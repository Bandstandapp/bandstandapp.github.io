const BS = (function(){
  const DB='bandstand', VER=1;
  const S_BUCH='buecher', S_TITEL='titel', S_EL='elemente', S_BYTE='bytes',
        S_NOTIZ='notizen', S_KORB='papierkorb', S_SICH='sicherung', S_META='meta';
  let _db=null;

  /* ---- Die Arten als Register, nicht als Sonderfaelle im Programm ----------
     Eine Art setzt nur zwei Dinge: ob sie Bytes mitbringt, und wie sie sich
     beim Oeffnen verhaelt. Eine weitere Art kostet damit einen Eintrag hier
     und keine Umschreibung. `austausch` ist die Vorgabe beim Export und beim
     Abgleich: immer mitgeben, nur auf Zuruf, oder nie.                       */
  const ARTEN = {
    blatt:     { name:'Blatt',      bytes:true,  oeffnen:'buehne',  austausch:'immer',  endung:'.pdf' },
    ton:       { name:'Ton',        bytes:true,  oeffnen:'player',  austausch:'zuruf',  endung:'' },
    midi:      { name:'MIDI',       bytes:true,  oeffnen:'player',  austausch:'zuruf',  endung:'.mid' },
    musicxml:  { name:'MusicXML',   bytes:true,  oeffnen:'extern',  austausch:'immer',  endung:'.musicxml' },
    notizblatt:{ name:'Notizblatt', bytes:true,  oeffnen:'buehne',  austausch:'immer',  endung:'.pdf' },
    /* Ein abfotografiertes Tafelbild. Es liegt als PDF vor — siehe
       `fotoAlsPDF` — und verhaelt sich damit ueberall wie ein Blatt: auf der
       Buehne, beim Drucken, im Export, im Paket. Als eigene ART bleibt es
       trotzdem erkennbar, und beim Weitergeben laesst es sich eigens
       ab- oder anwaehlen. Deshalb `zuruf` und nicht `immer`: Ein Tafelbild aus
       einem Workshop gibt man einem Bandkollegen vielleicht gern, dem Rest der
       Welt eher nicht. Am 1. August von Jens verlangt. */
    foto:      { name:'Foto',       bytes:true,  oeffnen:'buehne',  austausch:'zuruf',  endung:'.pdf' },
    /* Ein Leadsheet ist Musik als Daten, nicht als Seite: MusicXML oder ABC.
       Es bringt Bytes mit wie ein Blatt, wird aber nicht angezeigt, sondern
       GESETZT — in jeder Tonart und fuer jedes Instrument. Deshalb ein
       eigenes Verhalten beim Oeffnen; der PDF-Betrachter bleibt unberuehrt.
       Beim Austausch ist es der guenstigste Fall im ganzen Bestand: ein paar
       Kilobyte statt ein paar hundert. Am 19. August aufgenommen. */
    leadsheet: { name:'Leadsheet',  bytes:true,  oeffnen:'noten',   austausch:'immer',  endung:'.musicxml' },
    /* Ein Chord-Sheet traegt die Akkorde eines Stuecks und sonst nichts. Es
       ist KEIN Leadsheet ohne Noten, sondern etwas anderes: eine Liste von
       Takten mit Namen darin. Es braucht keinen Setzer, steht sofort da und
       wiegt ein paar hundert Zeichen — der guenstigste Fall im ganzen
       Bestand. Am 21. August aufgenommen, nachdem das Format von iReal Pro
       vermessen war. */
    chordsheet:{ name:'Chord-Sheet', bytes:true,  oeffnen:'changes', austausch:'immer',  endung:'.ireal' },
    verweis:   { name:'Verweis',    bytes:false, oeffnen:'extern',  austausch:'immer',  endung:'' },
  };
  const artOk = a => Object.prototype.hasOwnProperty.call(ARTEN,a);

  /* ---- Datenbank ---------------------------------------------------------- */
  function oeffnen(){
    if(_db) return Promise.resolve(_db);
    return new Promise((res,rej)=>{
      const r=indexedDB.open(DB,VER);
      r.onupgradeneeded=()=>{ const db=r.result;
        if(!db.objectStoreNames.contains(S_BUCH))  db.createObjectStore(S_BUCH,{keyPath:'id'});
        if(!db.objectStoreNames.contains(S_TITEL)){ const s=db.createObjectStore(S_TITEL,{keyPath:'id'});
          s.createIndex('buchId','buchId',{unique:false}); }
        if(!db.objectStoreNames.contains(S_EL)){ const s=db.createObjectStore(S_EL,{keyPath:'id'});
          s.createIndex('titelId','titelId',{unique:false}); s.createIndex('art','art',{unique:false}); }
        if(!db.objectStoreNames.contains(S_BYTE))  db.createObjectStore(S_BYTE,{keyPath:'id'});
        if(!db.objectStoreNames.contains(S_NOTIZ)){ const s=db.createObjectStore(S_NOTIZ,{keyPath:'id'});
          s.createIndex('elementId','elementId',{unique:false}); }
        if(!db.objectStoreNames.contains(S_KORB))  db.createObjectStore(S_KORB,{keyPath:'id'});
        if(!db.objectStoreNames.contains(S_SICH))  db.createObjectStore(S_SICH,{keyPath:'id'});
        if(!db.objectStoreNames.contains(S_META))  db.createObjectStore(S_META,{keyPath:'k'});
      };
      r.onsuccess=()=>{ _db=r.result;
        /* Zieht ein anderer Tab die Datenbank hoch oder loescht sie, wird
           diese Verbindung geschlossen. Der Zeiger muss dann WEG, sonst gibt
           `oeffnen` weiter eine geschlossene Verbindung zurueck und jede
           Transaktion scheitert mit „connection is closing". */
        _db.onversionchange=()=>{ try{ _db.close(); }catch(e){} _db=null; };
        _db.onclose=()=>{ _db=null; };
        res(_db); };
      r.onerror=()=>rej(r.error);
    });
  }
  /* Absichtlich schliessen — und den Zeiger mitnehmen. */
  function schliessen(){ if(_db){ try{ _db.close(); }catch(e){} _db=null; } }

  /* Eine Transaktion, ein Versprechen. `arbeit` bekommt die Stores und darf
     synchron alles anfordern; erst `oncomplete` gilt als geschrieben.

     Scheitert das Anlegen, weil die Verbindung inzwischen zu ist, wird EINMAL
     mit einer frischen Verbindung wiederholt. Ein Schreibvorgang darf nicht an
     einem veralteten Zeiger verlorengehen. */
  async function tx(stores, modus, arbeit, _zweiter){
    let db=await oeffnen();
    let t;
    try{ t=db.transaction(stores, modus); }
    catch(e){
      _db=null;
      if(_zweiter) throw e;
      return tx(stores, modus, arbeit, true);
    }
    return new Promise((res,rej)=>{
      let ergebnis;
      try{ ergebnis = arbeit(...[].concat(stores).map(n=>t.objectStore(n))); }
      catch(e){ try{ t.abort(); }catch(_){} return rej(e); }
      t.oncomplete=()=>res(ergebnis);
      t.onerror=()=>rej(t.error);
      t.onabort=()=>rej(t.error||new Error('Transaktion abgebrochen'));
    });
  }
  const alle = st => new Promise((res,rej)=>{ const out=[],c=st.openCursor();
    c.onsuccess=e=>{ const cu=e.target.result; if(cu){ out.push(cu.value); cu.continue(); } else res(out); };
    c.onerror=()=>rej(c.error); });
  const holen = (st,id) => new Promise((res,rej)=>{ const g=st.get(id);
    g.onsuccess=()=>res(g.result); g.onerror=()=>rej(g.error); });

  /* ---- Kennungen ---------------------------------------------------------
     Weltweit eindeutig, weil eine Geraetemarke darin steckt. Deshalb darf eine
     Kennung beim Import in einen fremden Bestand erhalten bleiben: Ein
     erneutes Teilen desselben Stuecks aktualisiert dann, statt zu verdoppeln.
     Die Kennung ist Identitaet, nicht Besitz. Sie wird nie geaendert und nie
     wiederverwendet — Umbenennen und Verschieben fassen sie nicht an.        */
  const GERAET_KEY='bs_geraet';
  function geraet(){
    let g=null; try{ g=localStorage.getItem(GERAET_KEY); }catch(e){}
    if(!g){
      const art = /iPad|iPhone/.test(navigator.userAgent) ? 'ipad'
                : /Android/.test(navigator.userAgent)     ? 'andr'
                : /Macintosh/.test(navigator.userAgent)   ? 'mac'
                : /Windows/.test(navigator.userAgent)     ? 'win' : 'ger';
      g = art+'-'+Math.random().toString(36).slice(2,7);
      try{ localStorage.setItem(GERAET_KEY,g); }catch(e){}
    }
    return g;
  }
  let _lauf=0;
  function kennung(praefix){
    /* Zeit + Geraet + Zaehler + Zufall. Der Zaehler trennt zwei Kennungen
       innerhalb derselben Millisekunde, was beim Blockschreiben vorkommt. */
    return (praefix||'x')+'_'+geraet()+'_'+Date.now().toString(36)
         + (_lauf=(_lauf+1)%46656).toString(36) + Math.random().toString(36).slice(2,5);
  }

  /* ---- Seitenzahl ohne PDF.js -------------------------------------------
     Die Zahl steht in den Bytes. Gemessen an 779 Blaettern quer durch alle
     siebzehn Buecher: 777 richtig, 0 falsch, 2 unbekannt, 2 ms statt 82 ms je
     Blatt. Wo sie nicht gefunden wird, kommt 0 zurueck und der Aufrufer faellt
     auf PDF.js zurueck — geraten wird nicht.                                */
  function seitenzahlAusBytes(u8){
    let s=''; const CH=65536;
    for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
    let best=0,m; const re=/\/Type\s*\/Pages\b[\s\S]{0,400}?\/Count\s+(\d+)/g;
    while((m=re.exec(s))) best=Math.max(best,+m[1]);
    if(best>0) return best;
    const p=s.match(/\/Type\s*\/Page[^s]/g);
    return p ? p.length : 0;
  }
  async function seitenzahl(blob){
    try{ const n=seitenzahlAusBytes(new Uint8Array(await blob.arrayBuffer())); if(n>0) return n; }catch(e){}
    try{ const buf=await blob.arrayBuffer();
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
      const n=doc.numPages; try{ await doc.destroy(); }catch(_){} return n;
    }catch(e){ return 1; }
  }

  /* ---- Katalog lesen ----------------------------------------------------
     Bewusst OHNE die Bytes. Das ist die eigentliche Aenderung gegenueber der
     alten Ablage, und alles andere folgt daraus.                            */
  async function katalog(){
    const [buecher,titel,elemente] = await tx([S_BUCH,S_TITEL,S_EL],'readonly',
      (b,t,e)=>[alle(b),alle(t),alle(e)]).then(ps=>Promise.all(ps));
    return {buecher,titel,elemente};
  }
  async function zahlen(){
    const k=await katalog();
    const summe=k.elemente.reduce((a,e)=>a+(e.groesse||0),0);
    return {buecher:k.buecher.length, titel:k.titel.length, elemente:k.elemente.length, bytes:summe};
  }

  /* ---- Anlegen ----------------------------------------------------------- */
  const jetzt = () => Date.now();
  async function buchAnlegen({name, chip, hubId}={}){
    const n=(name||'Buch').trim()||'Buch';
    const rec={ id:kennung('bu'), name:n, chip:chip||(n.length>18?n.slice(0,16)+'…':n),
                hubId:hubId||null, angelegt:jetzt(), geaendert:jetzt() };
    await tx(S_BUCH,'readwrite',st=>st.put(rec));
    return rec;
  }
  async function titelAnlegen({buchId, titel, komponist}={}){
    if(!buchId) throw new Error('Ein Titel braucht ein Buch.');
    const rec={ id:kennung('ti'), buchId, titel:(titel||'Stück').trim()||'Stück',
                komponist:(komponist||'').trim(), angelegt:jetzt(), geaendert:jetzt() };
    await tx(S_TITEL,'readwrite',st=>st.put(rec));
    return rec;
  }

  /* ---- Schreiben in Bloecken, entlang der Stueckgrenzen -----------------
     Ein Stueck ist danach vollstaendig da oder gar nicht. Bricht der Vorgang
     ab, bleibt kein halbes Stueck zurueck und kein Element ohne seine Bytes.
     `gruppen` = [{titel:{...}, elemente:[{art,etikett,...,blob}]}]

     Traegt eine Gruppe stattdessen `titelId`, wird KEIN neues Stueck angelegt:
     die Blaetter haengen sich an das vorhandene an. Das ist der Weg, auf dem
     eine spaeter nachgeladene Ausgabe eines Real Books andockt, statt das
     Stueck zu verdoppeln. Entschieden wird das vorher in der Vorschau, nie
     hier und nie von selbst.

     Gemessen: 0,10 ms je Blatt gegenueber 1,65 ms auf dem alten Weg, weil die
     alte Fassung je Blatt eine eigene Verbindung und Transaktion aufbaute.   */
  const BLOCK_ELEMENTE=500;   /* am echten Bestand vermessen */
  /* Und eine zweite Schranke, in Bytes. Fuenfhundert gescannte Blaetter sind
     ein Block von rund 25 MB — auf dem Mac unauffaellig, auf dem iPad der
     Grund, aus dem Safari am 20. August die Seite abgeraeumt hat. Was in eine
     Transaktion geht, bleibt jetzt unter vier Megabyte, und zwischen zwei
     Bloecken hat der Browser Luft zum Aufraeumen. */
  const BLOCK_BYTES=2*1024*1024;
  /* Ein Zaehler statt eines Schalters: Mehrere Buecher in einem Durchgang
     laufen nacheinander durch diese Funktion, und der erste, der fertig ist,
     darf den Reload nicht freigeben, solange der naechste noch schreibt. */
  let _schreibt=0;
  function schreibtGerade(){ return _schreibt>0; }

  async function stueckeSchreiben(buchId, gruppen, fortschritt){
    if(!buchId) throw new Error('Ohne Buch kann nichts geschrieben werden.');
    _schreibt++;
    try{ return await stueckeSchreibenTun(buchId, gruppen, fortschritt); }
    finally{ _schreibt--; }
  }
  async function stueckeSchreibenTun(buchId, gruppen, fortschritt){
    /* Fuer das Andocken: die hoechste bisherige Reihung je Stueck, damit die
       neuen Blaetter hinten anschliessen und nicht auf Platz 0 landen. */
    const andock=(gruppen||[]).some(g=>g && g.titelId);
    let maxReihung={};
    if(andock){
      const k=await katalog();
      k.elemente.forEach(e=>{ const r=(e.reihung||0)+1;
        if(!(e.titelId in maxReihung) || r>maxReihung[e.titelId]) maxReihung[e.titelId]=r; });
    }
    /* `neueTitel` und `neueElemente` tragen die Kennungen dessen, was DIESER
       Lauf angelegt hat. Ohne sie liesse sich ein Import nur über Zeitstempel
       erraten, und das trifft daneben, sobald zwei Läufe dicht aufeinander
       folgen. Sie sind die Grundlage von „Letzten Import rückgängig machen" —
       gebaut am 7. August, nachdem Jens vier Real Books versehentlich in sein
       Blauton-Buch geschrieben hatte und keinen Weg zurück fand. */
    const bericht={stuecke:0, angedockt:0, elemente:0, bytes:0, uebergangen:[],
                   neueTitel:[], neueElemente:[]};
    /* Die Gesamtzahl zaehlt nur, was auch geschrieben werden kann. Zaehlte sie
       die uebergangenen Elemente mit, bliebe der Fortschritt kurz vor dem Ende
       stehen und kaeme nie an. */
    const gesamt=gruppen.reduce((a,g)=>a+(g.elemente||[]).filter(e=>artOk(e.art)).length, 0);
    let getan=0;

    /* Gesammelt wird stueckweise, geschrieben blockweise — aber ein Stueck
       liegt immer VOLLSTAENDIG in einer Transaktion. Damit gilt weiter „ganz
       oder gar nicht": Bricht der Vorgang ab, fehlt ein Stueck ganz, und es
       bleibt kein Element ohne seine Bytes zurueck.

       Ohne das Buendeln waere ein Real Book der langsame Fall, weil dort ein
       Stueck ein einzelnes Blatt ist: 6.231 Stuecke sind 6.231 Transaktionen.
       Gemessen kostet das 1,65 ms je Blatt statt 0,10 ms.                    */
    let stapel=[], stapelEl=0, stapelBytes=0, letzterTitel='';
    async function stapelSchreiben(){
      if(!stapel.length) return;
      const jetztStapel=stapel; stapel=[]; stapelEl=0; stapelBytes=0;
      await tx([S_TITEL,S_EL,S_BYTE],'readwrite',(t,el,by)=>{
        /* Beim Andocken wird der Titel NICHT geschrieben: Er steht schon da,
           und ein `put` wuerde seinen Komponisten und seinen Zeitstempel mit
           dem ueberschreiben, was der Import gerade zu wissen glaubt. */
        jetztStapel.forEach(s=>{ if(s.tRec) t.put(s.tRec);
          s.eRecs.forEach(r=>el.put(r)); s.bRecs.forEach(r=>by.put(r)); });
      });
      jetztStapel.forEach(s=>{
        /* Ein Stueck, das ueber mehrere Bloecke ging, zaehlt trotzdem als
           EINES. Die Fortsetzungen tragen `nurTeil` und werden uebergangen. */
        if(s.tRec){ bericht.stuecke++; bericht.neueTitel.push(s.tRec.id); }
        else if(!s.nurTeil) bericht.angedockt++;
        /* Auch die Elemente eines NEUEN Titels werden einzeln vermerkt. Beim
           Rückgängigmachen genügt zwar der Titel, weil er seine Blätter
           mitnimmt — aber die Zahl daneben soll stimmen, und angedockte
           Blätter lassen sich nur einzeln lösen. */
        s.eRecs.forEach(r=>bericht.neueElemente.push(r.id));
        bericht.elemente+=s.eRecs.length;
        bericht.bytes+=s.eRecs.reduce((a,r)=>a+r.groesse,0); getan+=s.eRecs.length; });
      if(fortschritt) fortschritt(getan, gesamt, letzterTitel);
    }

    for(const g of gruppen){
      const anhaengen = !!g.titelId;
      const tRec = anhaengen ? null
        : { id:kennung('ti'), buchId, titel:((g.titel&&g.titel.titel)||'Stück').trim()||'Stück',
            komponist:((g.titel&&g.titel.komponist)||'').trim(),
            angelegt:jetzt(), geaendert:jetzt() };
      const tid = anhaengen ? g.titelId : tRec.id;
      const eRecs=[], bRecs=[];
      /* Wird ein Stueck auf mehrere Bloecke verteilt, darf sein Titel nur
         EINMAL mitgehen — sonst zaehlt der Bericht ihn mehrfach. */
      let titelSchonDabei=false;
      let reihung = anhaengen ? (maxReihung[tid]||0) : 0;
      for(const e of (g.elemente||[])){
        if(!artOk(e.art)){ bericht.uebergangen.push({grund:'unbekannte Art', art:e.art, name:e.dateiname||''}); continue; }
        /* Liegt die Datei noch in einem Archiv, wird sie JETZT ausgepackt —
           kurz vor ihrem Block und nicht vorher. Was sich nicht auspacken
           laesst, faellt einzeln aus und haelt den Stapel nicht auf. */
        let blob=e.blob;
        if(blob && typeof blob.hole==='function'){
          try{ blob=await blob.hole(); }
          catch(err){ bericht.uebergangen.push({grund:'liess sich nicht auspacken',
                        art:e.art, name:e.dateiname||''}); continue; }
        }
        const id=kennung('el');
        const groesse=(blob&&blob.size)||0;
        eRecs.push({ id, titelId:tid, art:e.art,
                     etikett:(e.etikett||'').trim(), instrument:e.instrument||'',
                     reihung:reihung++, np:e.np||1,
                     dateiname:e.dateiname||'', groesse, ziel:e.ziel||'',
                     angelegt:jetzt(), geaendert:jetzt() });
        if(ARTEN[e.art].bytes && blob){ bRecs.push({id, blob}); stapelBytes+=groesse; }
        /* Ein einzelnes Stueck kann selbst schon schwer sein — ein Real Book
           mit vierhundert Blaettern an EINEM Titel etwa. Deshalb wird auch
           mitten im Stueck abgeriegelt, sobald der Block voll ist. */
        if(stapelBytes>=BLOCK_BYTES && eRecs.length){
          const kopf = titelSchonDabei ? null : tRec;
          titelSchonDabei = true;
          const teil = {tRec:kopf, nurTeil:titelSchonDabei && !kopf,
                        eRecs:eRecs.splice(0), bRecs:bRecs.splice(0)};
          stapelEl += teil.eRecs.length;
          stapel.push(teil);
          letzterTitel = anhaengen ? ((g.titel&&g.titel.titel)||'Stück') : tRec.titel;
          await stapelSchreiben();
        }
      }
      /* Ist der Rest leer, ist das Stueck schon vollstaendig geschrieben —
         beim Andocken ebenso wie bei einem neuen Titel. */
      if(!eRecs.length){ continue; }
      stapel.push({tRec: titelSchonDabei ? null : tRec, nurTeil:titelSchonDabei,
                   eRecs, bRecs});
      stapelEl+=eRecs.length;
      letzterTitel = anhaengen ? ((g.titel&&g.titel.titel)||'Stück') : tRec.titel;
      if(stapelEl>=BLOCK_ELEMENTE || stapelBytes>=BLOCK_BYTES) await stapelSchreiben();
    }
    await stapelSchreiben();
    /* Nach dem Schreiben nachzaehlen. Nicht als Zierde: Wenn hier eine andere
       Zahl steht als erwartet, ist etwas nicht angekommen, und der Aufrufer
       soll das sagen koennen statt zu schweigen. */
    const nachher=await zahlen();
    bericht.gezaehlt={titel:nachher.titel, elemente:nachher.elemente};
    return bericht;
  }

  /* ---- Ein Element einzeln anlegen -------------------------------------- */
  async function elementAnlegen({titelId, art, etikett, instrument, np, dateiname, blob, ziel}={}){
    if(!titelId) throw new Error('Ein Element braucht einen Titel.');
    if(!artOk(art)) throw new Error('Unbekannte Art: '+art);
    const vorhandene = await tx(S_EL,'readonly', st=>new Promise((res,rej)=>{
      const out=[],c=st.index('titelId').openCursor(IDBKeyRange.only(titelId));
      c.onsuccess=e=>{ const cu=e.target.result; if(cu){ out.push(cu.value); cu.continue(); } else res(out); };
      c.onerror=()=>rej(c.error); })).then(p=>p);
    const id=kennung('el');
    const rec={ id, titelId, art, etikett:(etikett||'').trim(), instrument:instrument||'',
                reihung:vorhandene.length, np:np||(blob?await seitenzahl(blob):1),
                dateiname:dateiname||'', groesse:(blob&&blob.size)||0, ziel:ziel||'',
                angelegt:jetzt(), geaendert:jetzt() };
    await tx([S_EL,S_BYTE],'readwrite',(el,by)=>{ el.put(rec); if(ARTEN[art].bytes&&blob) by.put({id,blob}); });
    return rec;
  }

  /* ---- Aendern ----------------------------------------------------------
     Ein Schreibvorgang, ein Zeitstempel. Der Zeitstempel entsteht ab dem
     ersten Tag, weil der Hub ihn spaeter braucht und er nicht nachtraeglich
     herstellbar ist.                                                        */
  const STORE_ZU_ART={buch:S_BUCH, titel:S_TITEL, element:S_EL};
  async function aendern(art, id, patch){
    const store=STORE_ZU_ART[art]; if(!store) throw new Error('Unbekannte Ebene: '+art);
    return tx(store,'readwrite',st=>new Promise((res,rej)=>{
      const g=st.get(id);
      g.onsuccess=()=>{ const r=g.result; if(!r){ rej(new Error('Nicht gefunden: '+id)); return; }
        Object.assign(r, patch, {geaendert:jetzt()}); st.put(r); res(r); };
      g.onerror=()=>rej(g.error);
    })).then(p=>p);
  }

  /* ---- Verschieben ------------------------------------------------------
     Ein Titel wandert in ein anderes Buch, ein Element an einen anderen Titel.
     Die Kennung bleibt, die Bytes bleiben liegen, nur der Verweis nach oben
     aendert sich. Genau dafuer ist der Titel eine eigene Sache: Das ist EIN
     Schreibvorgang und kein Umkopieren.                                     */
  async function verschieben(art, ids, zielId){
    ids=[].concat(ids||[]); if(!ids.length || !zielId) return 0;
    const k=await katalog();
    if(art==='titel'){
      if(!k.buecher.some(b=>b.id===zielId)) throw new Error('Das Zielbuch gibt es nicht.');
      const betroffen=k.titel.filter(t=>ids.includes(t.id) && t.buchId!==zielId);
      if(!betroffen.length) return 0;
      await tx(S_TITEL,'readwrite',st=>{ betroffen.forEach(t=>{
        st.put({...t, buchId:zielId, geaendert:jetzt()}); }); });
      return betroffen.length;
    }
    if(art==='element'){
      if(!k.titel.some(t=>t.id===zielId)) throw new Error('Den Ziel-Titel gibt es nicht.');
      const betroffen=k.elemente.filter(e=>ids.includes(e.id) && e.titelId!==zielId);
      if(!betroffen.length) return 0;
      let r=k.elemente.filter(e=>e.titelId===zielId).reduce((a,e)=>Math.max(a,(e.reihung||0)+1),0);
      await tx(S_EL,'readwrite',st=>{ betroffen.forEach(e=>{
        st.put({...e, titelId:zielId, reihung:r++, geaendert:jetzt()}); }); });
      return betroffen.length;
    }
    throw new Error('Verschieben gibt es nur für Titel und Elemente.');
  }

  /* ---- Zusammenfuehren --------------------------------------------------
     Aus mehreren Titeln wird einer. Das Datenmodell kannte bis zum 9. August
     nur Verschieben und Kopieren — und beides legt zwei gleichnamige Titel
     zwar ins selbe Buch, aber nicht in denselben Titel.

     Der Fall aus der Praxis: „Blue Bossa" liegt in vier Real Books, je eine
     Ausgabe. Das sind vier Titel mit je einem Blatt, wo einer mit vier
     Stimmen hingehoert. Von Hand kostet das vier Griffe je Titel — bei
     vierhundert Titeln mit drei Zusatzausgaben viertausendachthundert.

     Der ERSTE der Kennungen ist das Ziel; sein Name und sein Komponist
     gelten, und er behaelt sein Buch. Die Blaetter der uebrigen haengen sich
     an ihn, die leer gewordenen Titel wandern in den Papierkorb.

     Die Element-Kennungen bleiben unveraendert. Daran haengen Favoriten,
     Tags, Setlisten und Notizen — sie ueberstehen das Zusammenfuehren
     deshalb ohne Zutun.                                                    */
  async function titelZusammenfuehren(ids, anlass){
    ids=[].concat(ids||[]).filter(Boolean);
    if(ids.length<2) throw new Error('Zum Zusammenführen braucht es mindestens zwei Titel.');
    const k=await katalog();
    const ziel=k.titel.find(t=>t.id===ids[0]);
    if(!ziel) throw new Error('Den Ziel-Titel gibt es nicht mehr.');
    const weitere=ids.slice(1).filter(id=>k.titel.some(t=>t.id===id));
    if(!weitere.length) return { ziel:ziel.id, titel:0, elemente:0 };

    /* Die neuen Blaetter reihen sich HINTER die vorhandenen. */
    let r=k.elemente.filter(e=>e.titelId===ziel.id)
          .reduce((a,e)=>Math.max(a,(e.reihung||0)+1),0);
    const umzuhaengen=k.elemente
      .filter(e=>weitere.includes(e.titelId))
      .sort((a,b)=>weitere.indexOf(a.titelId)-weitere.indexOf(b.titelId)
                 || (a.reihung||0)-(b.reihung||0));
    if(umzuhaengen.length){
      await tx(S_EL,'readwrite',st=>{ umzuhaengen.forEach(e=>{
        st.put({...e, titelId:ziel.id, reihung:r++, geaendert:jetzt()}); }); });
    }
    /* Erst wenn die Blaetter sicher am Ziel haengen, gehen die leeren Titel
       in den Papierkorb — sonst naehme ein Fehlschlag sie mit. */
    await loeschen('titel', weitere, anlass||'beim Zusammenführen geleert');
    await tx(S_TITEL,'readwrite',st=>st.put({...ziel, geaendert:jetzt()}));
    return { ziel:ziel.id, titel:weitere.length, elemente:umzuhaengen.length };
  }

  /* ---- Kopieren ---------------------------------------------------------
     Anders als das Verschieben entstehen hier NEUE Kennungen und die Bytes
     werden ein zweites Mal abgelegt. Eine Kopie ist ein eigenes Ding; sonst
     wuerde eine Notiz am Original auch an der Kopie haengen.               */
  async function kopieren(art, ids, zielId){
    ids=[].concat(ids||[]); if(!ids.length || !zielId) return 0;
    const k=await katalog();
    let zahl=0;
    if(art==='titel'){
      if(!k.buecher.some(b=>b.id===zielId)) throw new Error('Das Zielbuch gibt es nicht.');
      for(const t of k.titel.filter(x=>ids.includes(x.id))){
        const neuT={ ...t, id:kennung('ti'), buchId:zielId, angelegt:jetzt(), geaendert:jetzt() };
        const el=k.elemente.filter(e=>e.titelId===t.id).sort((a,b)=>(a.reihung||0)-(b.reihung||0));
        const paare=[];
        for(const e of el){ const b=await bytes(e.id);
          paare.push({rec:{...e, id:kennung('el'), titelId:neuT.id, angelegt:jetzt(), geaendert:jetzt()}, blob:b}); }
        await tx([S_TITEL,S_EL,S_BYTE],'readwrite',(t2,e2,b2)=>{
          t2.put(neuT);
          paare.forEach(p=>{ e2.put(p.rec); if(p.blob) b2.put({id:p.rec.id, blob:p.blob}); });
        });
        zahl++;
      }
      return zahl;
    }
    if(art==='element'){
      const ziel=k.titel.find(t=>t.id===zielId);
      if(!ziel) throw new Error('Den Ziel-Titel gibt es nicht.');
      let r=k.elemente.filter(e=>e.titelId===zielId).reduce((a,e)=>Math.max(a,(e.reihung||0)+1),0);
      for(const e of k.elemente.filter(x=>ids.includes(x.id))){
        const b=await bytes(e.id);
        const rec={...e, id:kennung('el'), titelId:zielId, reihung:r++, angelegt:jetzt(), geaendert:jetzt()};
        await tx([S_EL,S_BYTE],'readwrite',(e2,b2)=>{ e2.put(rec); if(b) b2.put({id:rec.id, blob:b}); });
        zahl++;
      }
      return zahl;
    }
    throw new Error('Kopieren gibt es nur für Titel und Elemente.');
  }

  /* ---- Bytes auf Zuruf --------------------------------------------------
     Eine Object-URL entsteht beim Aufschlagen und wird beim Schliessen wieder
     eingezogen. Ein kleiner Vorrat bleibt offen, damit Blaettern nicht jedes
     Mal neu holt; er ist begrenzt, damit nichts dauerhaft angeheftet bleibt. */
  async function bytes(id){ return tx(S_BYTE,'readonly',st=>holen(st,id)).then(r=>r&&r.blob||null); }
  const _leihe=new Map(); const LEIHE_MAX=12;
  async function urlLeihen(id){
    const da=_leihe.get(id);
    if(da){ da.n++; _leihe.delete(id); _leihe.set(id,da); return da.url; }
    const b=await bytes(id); if(!b) return null;
    const url=URL.createObjectURL(b);
    _leihe.set(id,{url,n:1});
    for(const [k,v] of _leihe){ if(_leihe.size<=LEIHE_MAX) break; if(v.n<=0){ URL.revokeObjectURL(v.url); _leihe.delete(k); } }
    return url;
  }
  function urlZurueck(id){
    const da=_leihe.get(id); if(!da) return;
    da.n--;
    if(da.n<=0 && _leihe.size>LEIHE_MAX){ URL.revokeObjectURL(da.url); _leihe.delete(id); }
  }
  /* Werden die Bytes eines Elements UEBERSCHRIEBEN, zeigt die geliehene
     Adresse noch auf den alten Blob — und `urlZurueck` gibt sie nicht her,
     solange der Vorrat nicht voll ist. Das Blatt sah danach unveraendert aus.
     Hier wird sie ohne Ruecksicht auf den Zaehler weggeworfen. */
  function urlVergessen(id){
    const da=_leihe.get(id); if(!da) return;
    try{ URL.revokeObjectURL(da.url); }catch(e){}
    _leihe.delete(id);
  }

  /* ---- Notiz-Ebenen ------------------------------------------------------
     Eine handschriftliche Notiz liegt NEBEN dem Blatt, nicht darin: Das PDF
     bleibt unberuehrt, die Striche stehen in einem eigenen Satz und werden
     beim Zeigen darueber gelegt. Das ist der Speicher, den das Datenmodell
     vom 30. Juli vorgesehen hat und der bis zum 8. August leer blieb.

     Gespeichert werden die STRICHE, nicht ein Bild. Das ist ein Bruchteil so
     gross, laesst sich weiterzeichnen und einzeln zuruecknehmen. Weil der
     Editor anders skaliert als die Buehne, traegt jede Seite ihre eigene
     Bezugsgroesse; gezeichnet wird auf das Verhaeltnis umgerechnet.

     Bis zum 8. August erzeugte der Stift auf einem vorhandenen Blatt statt
     dessen ein EIGENES Stueck in „Sonstiges Material". Jens hat darauf
     geschrieben, das Blatt geschlossen und die Notiz nicht wiedergefunden —
     sie lag unter anderem Namen an anderer Stelle. */
  async function notizLesen(elementId){
    if(!elementId) return null;
    return tx(S_NOTIZ,'readonly', st=>new Promise((res,rej)=>{
      const g=st.get(elementId); g.onsuccess=()=>res(g.result||null); g.onerror=()=>rej(g.error); }));
  }
  /* `schluessel` ist bei einem gescannten Blatt die Element-Kennung selbst.
     Bei einem Leadsheet traegt er die AUSGABE mit — Tonart, Notation, Stimme
     — denn dort haengt die Notiz an dem, was auf dem Blatt steht, und nicht
     an der Quelle. `zusatz.elementId` bleibt in beiden Faellen die nackte
     Element-Kennung, damit die Liste weiter weiss, wer eine Notiz traegt.
     `zusatz.blatt` ist das eingefrorene Blatt: Ab dem ersten Strich steht der
     Satz fest, sonst wanderte die Notiz beim naechsten Setzen. */
  async function notizSchreiben(schluessel, seiten, zusatz){
    if(!schluessel) throw new Error('Eine Notiz braucht ein Element.');
    const leer=!seiten || !seiten.some(s=>s && s.strokes && s.strokes.length);
    if(leer) return notizLoeschen(schluessel);
    const alt = await notizLesen(schluessel);
    const rec={ id:schluessel,
                elementId:(zusatz && zusatz.elementId) || (alt && alt.elementId) || schluessel,
                seiten, geaendert:jetzt() };
    const blatt = (zusatz && zusatz.blatt) || (alt && alt.blatt);
    if(blatt) rec.blatt = blatt;
    if(zusatz && zusatz.ausgabe) rec.ausgabe = zusatz.ausgabe;
    else if(alt && alt.ausgabe) rec.ausgabe = alt.ausgabe;
    await tx(S_NOTIZ,'readwrite', st=>st.put(rec));
    return rec;
  }
  async function notizLoeschen(elementId){
    if(!elementId) return null;
    await tx(S_NOTIZ,'readwrite', st=>st.delete(elementId));
    return null;
  }
  /* Zu welchen AUSGABEN eines Elements liegt eine Notiz? Der Index laeuft
     ueber `elementId`; die Kennung selbst traegt die Ausgabe hinter dem
     senkrechten Strich. */
  async function notizAusgaben(elementId){
    if(!elementId) return [];
    return tx(S_NOTIZ,'readonly', st=>new Promise((res,rej)=>{
      const out=[], ix=st.index('elementId'), c=ix.openCursor(IDBKeyRange.only(elementId));
      c.onsuccess=e=>{ const cu=e.target.result;
        if(cu){ out.push({ id:cu.value.id, ausgabe:cu.value.ausgabe||null,
                           seiten:(cu.value.seiten||[]).length }); cu.continue(); }
        else res(out); };
      c.onerror=()=>rej(c.error); }));
  }

  /* Welche Elemente tragen eine Notiz? Einmal gelesen, damit die Liste und
     der Reiter „Bearbeitet" nicht je Zeile in die Datenbank greifen. */
  async function notizKennungen(){
    const alle=await tx(S_NOTIZ,'readonly', st=>new Promise((res,rej)=>{
      const out=[], c=st.openCursor();
      c.onsuccess=e=>{ const cu=e.target.result; if(cu){ out.push(cu.value.elementId); cu.continue(); } else res(out); };
      c.onerror=()=>rej(c.error); }));
    return new Set(alle);
  }
  function leiheLeeren(){ for(const [,v] of _leihe) try{ URL.revokeObjectURL(v.url); }catch(e){}
    _leihe.clear(); }

  /* ---- Loeschen heisst umziehen ----------------------------------------
     Gelegentlich loescht man ein Buch und meint ein Blatt. Der Papierkorb
     merkt sich deshalb nicht nur den Satz, sondern alles, was daran hing:
     ein Buch nimmt seine Titel mit, ein Titel seine Elemente. Sonst laesst
     sich nur die oberste Zeile zurueckholen und nicht der Zusammenhang.

     Die Bytes bleiben liegen, bis der Korb geleert wird. Ein Papierkorb, der
     die Datei sofort wegwirft, ist keiner.                                   */
  async function _kinder(buchIds, titelIds){
    const k=await katalog();
    const tids=new Set(titelIds||[]);
    (buchIds||[]).forEach(b=>k.titel.forEach(t=>{ if(t.buchId===b) tids.add(t.id); }));
    const titel=k.titel.filter(t=>tids.has(t.id));
    const elemente=k.elemente.filter(e=>tids.has(e.titelId));
    return {titel, elemente};
  }
  async function loeschen(art, ids, anlass){
    ids=[].concat(ids||[]); if(!ids.length) return null;
    const k=await katalog();
    let buecher=[], titel=[], elemente=[];
    if(art==='buch'){
      buecher=k.buecher.filter(b=>ids.includes(b.id));
      const kin=await _kinder(ids,[]); titel=kin.titel; elemente=kin.elemente;
    } else if(art==='titel'){
      titel=k.titel.filter(t=>ids.includes(t.id));
      const kin=await _kinder([],ids); elemente=kin.elemente;
    } else if(art==='element'){
      elemente=k.elemente.filter(e=>ids.includes(e.id));
    } else throw new Error('Unbekannte Ebene: '+art);
    if(!buecher.length && !titel.length && !elemente.length) return null;
    const eintrag={ id:kennung('pk'), geloescht:jetzt(), art, anlass:anlass||'',
                    buecher, titel, elemente,
                    zahl:{buecher:buecher.length, titel:titel.length, elemente:elemente.length} };
    await tx([S_KORB,S_BUCH,S_TITEL,S_EL],'readwrite',(korb,b,t,e)=>{
      korb.put(eintrag);
      buecher.forEach(x=>b.delete(x.id));
      titel.forEach(x=>t.delete(x.id));
      elemente.forEach(x=>e.delete(x.id));
    });
    return eintrag;
  }
  async function korb(){ return tx(S_KORB,'readonly',st=>alle(st)).then(ps=>ps)
    .then(a=>a.sort((x,y)=>y.geloescht-x.geloescht)); }
  async function wiederherstellen(korbId){
    const e=await tx(S_KORB,'readonly',st=>holen(st,korbId)).then(p=>p);
    if(!e) throw new Error('Im Papierkorb nicht gefunden.');
    /* Fehlt das Buch inzwischen, kommt es als „Wiederhergestellt" zurueck,
       damit ein Titel nicht ohne Buch dasteht. */
    const k=await katalog();
    const daBuch=new Set(k.buecher.map(b=>b.id));
    let ersatz=null;
    for(const t of (e.titel||[])) if(!daBuch.has(t.buchId) && !(e.buecher||[]).some(b=>b.id===t.buchId)){
      if(!ersatz){ ersatz=await buchAnlegen({name:'Wiederhergestellt'}); daBuch.add(ersatz.id); }
      t.buchId=ersatz.id;
    }
    const daTitel=new Set(k.titel.map(t=>t.id).concat((e.titel||[]).map(t=>t.id)));
    let ersatzTitel=null;
    for(const el of (e.elemente||[])) if(!daTitel.has(el.titelId)){
      if(!ersatzTitel){ if(!ersatz) ersatz=await buchAnlegen({name:'Wiederhergestellt'});
        ersatzTitel=await titelAnlegen({buchId:ersatz.id, titel:'Wiederhergestellt'});
        daTitel.add(ersatzTitel.id); }
      el.titelId=ersatzTitel.id;
    }
    await tx([S_KORB,S_BUCH,S_TITEL,S_EL],'readwrite',(korb,b,t,el)=>{
      (e.buecher||[]).forEach(x=>b.put(x));
      (e.titel||[]).forEach(x=>t.put(x));
      (e.elemente||[]).forEach(x=>el.put(x));
      korb.delete(korbId);
    });
    return e.zahl;
  }
  /* Erst hier verschwinden die Bytes wirklich. */
  async function korbLeeren(aelterAlsTage){
    const grenze = aelterAlsTage ? jetzt()-aelterAlsTage*86400000 : Infinity;
    const eintraege=(await korb()).filter(e=>e.geloescht<grenze || !aelterAlsTage);
    if(!eintraege.length) return {eintraege:0, bytes:0};
    /* Ein Element, das inzwischen wieder im Katalog steht, behaelt seine
       Bytes. Sonst reisst das Leeren des Korbs ein wiederhergestelltes
       Blatt mit. */
    const k=await katalog(); const lebendig=new Set(k.elemente.map(e=>e.id));
    let bytesWeg=0;
    const byteIds=[];
    eintraege.forEach(e=>(e.elemente||[]).forEach(el=>{
      if(!lebendig.has(el.id)){ byteIds.push(el.id); bytesWeg+=el.groesse||0; } }));
    await tx([S_KORB,S_BYTE,S_NOTIZ],'readwrite',(korb,by,no)=>{
      eintraege.forEach(e=>korb.delete(e.id));
      byteIds.forEach(id=>by.delete(id));
      byteIds.forEach(id=>{ const c=no.index('elementId').openCursor(IDBKeyRange.only(id));
        c.onsuccess=ev=>{ const cu=ev.target.result; if(cu){ cu.delete(); cu.continue(); } }; });
    });
    return {eintraege:eintraege.length, bytes:bytesWeg};
  }

  /* ---- Sicherung vor jedem Umstieg -------------------------------------
     Ein Abzug des Katalogs, in der Datenbank und zusaetzlich als Datei. Ohne
     die Bytes: die sind gross, und gegen ihren Verlust hilft der Export.
     Geuebt wird das schon beim ersten Umstieg, obwohl da nichts zu verlieren
     ist — der Ablauf soll sitzen, bevor er ernst wird.                       */
  async function sicherung(anlass){
    const k=await katalog();
    const rec={ id:kennung('si'), zeit:jetzt(), anlass:anlass||'ohne Anlass',
                geraet:geraet(), schema:VER, katalog:k,
                zahl:{buecher:k.buecher.length, titel:k.titel.length, elemente:k.elemente.length} };
    await tx(S_SICH,'readwrite',st=>st.put(rec));
    return rec;
  }
  async function sicherungen(){ return tx(S_SICH,'readonly',st=>alle(st)).then(ps=>ps)
    .then(a=>a.sort((x,y)=>y.zeit-x.zeit).map(({katalog,...r})=>r)); }
  function _laden(blob, name){
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }
  const _stempel = () => new Date().toISOString().slice(0,16).replace('T','-').replace(':','');
  async function sicherungAlsDatei(anlass){
    const rec=await sicherung(anlass);

     Sicherung gegen einen abgebrochenen Umbau. Gegen einen Fehler im Programm

     entschieden am 29. Juli. Der Mensch findet sich im Ordner zurecht, das

     Wer das Archiv auspackte und den nackten Ordner hereingab, verlor die

      ? { titel: kAlles.titel.filter(t=>nurDiese.has(t.id)),
          elemente: kAlles.elemente.filter(e=>nurDiese.has(e.titelId)),
          buecher: kAlles.buecher.filter(b=>kAlles.titel.some(t=>nurDiese.has(t.id) && t.buchId===b.id)) }

    if(!k.elemente.length && !k.buecher.length) throw new Error('Es ist nichts zum Exportieren gewählt.');

      ? (F.stueckOrdner ? 'Buch / Stueck / Stimme.pdf' : 'Buch / Stueck - Stimme.pdf')
      : (F.stueckOrdner ? 'Stueck / Stimme.pdf'        : 'Stueck - Stimme.pdf');

      +'Aufbau dieses Archivs:\n    '+wieGebaut+'\n\n'
      +'Die Dateien lassen sich mit jedem PDF-Betrachter oeffnen; BandStand wird\n'
      +'dafuer nicht gebraucht.\n\n'
      +'katalog.json enthaelt denselben Bestand mit seinen Kennungen. Beim\n'
      +'Wiedereinlesen haelt sich BandStand an diese Datei, damit Stuecke sich\n'
      +'nicht verdoppeln. struktur.json sagt, was die Ordner bedeuten — sie wird\n'
      +'gebraucht, wenn nur die Ordner hereingegeben werden und der Katalog fehlt.\n\n'
      +'Buecher: '+k.buecher.length+'\nStuecke: '+k.titel.length+'\nElemente: '+katEl.length+'\n');

  }

     billig; es nicht zu tun, kostet im schlimmsten Fall den Bestand.        */

  const gmid=()=>{ const a=arr(); return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; };
  function cancelStroke(){ ED.drawing=false; ED.activeId=null; ED.stroke=null; drawCurrent(); }
  // Laufenden Strich sofort festschreiben. WICHTIG gegen den "jeder zweite / kurze Striche
  // fehlen"-Effekt: auf iPad-Safari kann das pointerup eines kurzen Strichs verspätet oder
  // nach dem pointerdown des nächsten eintreffen. Wir warten deshalb NIE auf das pointerup –
  // ein neuer Aufsetzpunkt schreibt den vorigen Strich einfach sofort fest.
  function finalizeStroke(){
    if(ED.stroke){ if(ED.base) drawStroke(ED.base.getContext('2d'),ED.stroke); ED.pages[ED.cur].strokes.push(ED.stroke); ED.stroke=null; }
    ED.drawing=false; ED.activeId=null; ED.strokeStart=0;
  }

  c.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen')ED.penSeen=true;
    diag('DOWN',e);
    if(e.pointerType==='touch'){
      touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(touches.size>=2){ gz={d:gdist(),z:ED.zoom,m:gmid(),px:ED.panX,py:ED.panY}; if(ED.drawing)cancelStroke(); return; }
      if(ED.penSeen)return;                 // Handballen/Finger zeichnen nie, sobald ein Stift benutzt wurde
    }
    if(ED.drawing)finalizeStroke();          // hängengebliebenen Vorstrich sofort sichern, dann neu beginnen
    e.preventDefault();
    rect=c.getBoundingClientRect();
    ED.strokeStart=e.timeStamp;              // Zeitmarke dieses Strichs – gegen verspätete Events vorheriger Striche
    const isHL=ED.tool==='hl', isEr=ED.tool==='erase';
    const bw= isEr?ERASE_WIDTHS[ED.sizeIdx] : isHL?HL_WIDTHS[ED.sizeIdx] : PEN_WIDTHS[ED.sizeIdx];
    const w=bw*sx();
    ED.stroke={color:ED.color,w,erase:isEr,hl:isHL,pts:[pt(e)]};
    ED.drawing=true; ED.activeId=e.pointerId; ED.dctx=c.getContext('2d');
    if(isHL){ drawCurrent(); }
    else { const ctx=ED.dctx, p0=ED.stroke.pts[0]; ctx.globalCompositeOperation=isEr?'destination-out':'source-over';
      ctx.fillStyle=ED.stroke.color; ctx.beginPath(); ctx.arc(p0.x,p0.y,w/2,0,7); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
  });
  c.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch'&&touches.has(e.pointerId)){
      touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(gz&&touches.size===2){ e.preventDefault(); const nd=gdist(), m=gmid();
        ED.zoom=Math.min(4,Math.max(1, gz.z*nd/gz.d)); ED.panX=gz.px+(m.x-gz.m.x); ED.panY=gz.py+(m.y-gz.m.y); applyZoom(); return; }
    }
    if(!ED.drawing||!ED.stroke||e.pointerId!==ED.activeId)return;
    if(e.timeStamp<ED.strokeStart)return;    // verspäteter Move eines früheren Strichs → ignorieren
    e.preventDefault();
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    if(ED.stroke.hl){ for(const ev of evs) ED.stroke.pts.push(pt(ev)); drawCurrent(); }
    else { const ctx=ED.dctx, P=ED.stroke.pts; for(const ev of evs){ const np=pt(ev); seg(ctx,P[P.length-1],np,ED.stroke); P.push(np); } }
  });
  const end=e=>{
    if(e.pointerType==='touch'){ touches.delete(e.pointerId);
      if(touches.size<2){ gz=null; if(ED.zoom<=1.02){ ED.zoom=1;ED.panX=0;ED.panY=0;applyZoom(); } } }
    // KERN-FIX: Apple Pencil verwendet für jeden Strich dieselbe pointerId. Ein verspätetes
    // pointerup des VORIGEN Strichs würde sonst den laufenden neuen Strich vorzeitig beenden
    // ("jeder zweite kurze Strich fehlt"). Zeitmarke entlarvt das veraltete Event.
    const stale = ED.drawing && e.pointerId===ED.activeId && e.timeStamp<ED.strokeStart;
    diag((e.type==='pointercancel'?'CANCEL':'UP')+(stale?'·alt':''),e);
    if(!ED.drawing||e.pointerId!==ED.activeId)return;
    if(e.timeStamp<ED.strokeStart)return;    // veraltetes Ende eines vorherigen Strichs → NICHT beenden
    finalizeStroke();
  };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
}

(function(){ const ed=document.getElementById('editor'); if(!ed)return;

  ['selectstart','contextmenu','gesturestart','gesturechange'].forEach(n=>ed.addEventListener(n,stop,{passive:false}));
  /* DER eigentliche Hammer: die Auswahl-/Callout-Geste entsteht aus dem Touch-Strom.

/* ---------- Notizen sichern ----------
   Seit dem 8. August gibt es EINEN Weg fuer alle Notizen: Die Striche liegen
   als eigene Ebene neben dem Blatt, das Blatt selbst bleibt unberuehrt.

   Vorher gab es zwei. Der Stift auf einem vorhandenen Notenblatt erzeugte ein
   EIGENES Stueck in „Sonstiges Material" — Jens hat darauf geschrieben, das
   Blatt geschlossen und die Notiz nicht wiedergefunden. Das Notizblatt dagegen
   nahm die Striche in sich auf. Zwei Wege, zwei Speicher, ein Name.

   Gesichert wird jetzt bei JEDEM Verlassen, nicht nur auf Knopfdruck. „Wer
   vergisst zu speichern, verliert die Notiz" ist kein tragbarer Zustand fuer
   etwas, das man auf der Buehne benutzt. Nur „Abbrechen" verwirft — und fragt
   vorher nach. */

/* Was steht jetzt auf dem Blatt? Wird mit dem Stand beim Aufschlagen
   verglichen, damit ein blosses Ansehen nichts schreibt. */
function edVeraendert(){
  if(!ED) return false;
  return JSON.stringify(ED.pages.map(p=>p.strokes.length)) !== ED.stand;
}
/* Die Striche in den Notiz-Speicher, je Seite mit ihrer Bezugsgroesse. */
async function edSichern(){
  if(!ED || !ED.tune) return false;
  const t=ED.tune;
  if(!t.bsId) return false;                 // fremdes Material ohne eigene Kennung
  const seiten=ED.pages.map(pg=>({ w:pg.w, h:pg.h, strokes:pg.strokes||[] }));
  /* Mit dem ersten Strich friert das Blatt ein. Ab jetzt wird diese Ausgabe
     nicht mehr gesetzt, sondern gezeigt — sonst wanderte die Notiz beim
     nächsten Mal. Die Quelle bleibt liegen; eine andere Tonart entsteht
     daraus jederzeit neu, mit ihrer eigenen Notiz. */
  await BS.notizSchreiben(ED.lsSchluessel || t.bsId, seiten,
    ED.lsSchluessel ? { elementId:t.bsId, blatt:ED.lsSvgs,
                        ausgabe:LS.ausgabe(t.bsId) } : null);
  return true;
}
/* Editor zu, Blatt neu zeichnen, Liste auffrischen. */
async function edSchliessen(neuZeichnen){
  document.getElementById('editor').classList.remove('open');
  const bsId = ED && ED.tune && ED.tune.bsId;
  ED=null;
  if(neuZeichnen && bsId){
    /* Der Betrachter haelt das gerenderte Blatt fest; die Notiz liegt jetzt
       darueber und muss mitgezeichnet werden. */
    if(typeof NOTIZ_KENNUNGEN!=='undefined'){
      try{ NOTIZ_KENNUNGEN = await BS.notizKennungen(); }catch(e){}
    }
    render();
    if(document.getElementById('viewer').classList.contains('open')
       && typeof blattNeuZeichnen==='function') blattNeuZeichnen(true);
  } else render();
}

/* register service worker (offline / installable) + Auto-Update:
   sobald eine neue Version aktiv wird, die Seite einmal automatisch neu laden. */
/* ---- Der Auto-Reload und das Schreiben (20. August) ----------------------
   Wird eine neue Fassung aktiv, laedt die Seite sich EINMAL neu. Das ist der
   Weg, auf dem eine Aenderung ueberhaupt auf das installierte iPad kommt.

   Er darf aber nicht mitten in einen Schreibvorgang fallen. Ein Import von
   dreihundert Blaettern laeuft eine Weile; ein `location.reload()` dazwischen
   sieht genau so aus, wie Jens es am 20. August beschrieben hat — die
   Fortschrittsanzeige laeuft, der Bildschirm wird ein bis zwei Sekunden
   weiss, die App ist wieder da, und das Buch ist angelegt und leer.

   `BS.schreibtGerade()` sagt, ob gerade geschrieben wird. Ist es so, wartet
   der Reload, bis der Vorgang durch ist. Fallen lassen wird er nie — sonst
   bliebe das Geraet auf dem alten Stand stehen. */
if('serviceWorker' in navigator){
  let _swReloaded=false;
  const jetztLaden=()=>{
    if(_swReloaded) return;
    if(window.BS && BS.schreibtGerade && BS.schreibtGerade()){
      setTimeout(jetztLaden, 1000); return;
    }
    _swReloaded=true; location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', jetztLaden);
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{}); });
}

/* ============================================================================
   Cloud-Abgleich (Dropbox) — Phase 4, Baustein „Cloud-Abgleich"
   Eigenständige Schicht. Rührt bestehende Daten nur über read()/write() an.
   Modell: je Kategorie Karte id -> {wert}, dazu eigene Meta id -> {u:updatedAt, d:deleted}.
   Merge: pro id gewinnt größerer u (auch Tombstone). Löschungen werden per Snapshot-Diff erkannt.
   „neuere gewinnt" + lokale Sicherungskopie vor jedem Übernehmen. Nur User-State, NIE Noten/PDFs.
   ========================================================================== */
(function(){
  "use strict";
  const APP_KEY = 'fsn69fl4zqqc4ti';
  const REDIRECT = location.origin + location.pathname.replace(/index\.html$/,'');

    last:'rb_sync_last', dev:'rb_sync_device' };

  const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };

  const jset = (k,v) => lsSet(k, JSON.stringify(v));

  let META = jget(K.meta, {});
  let SNAP = jget(K.snap, {});
  let deviceId = lsGet(K.dev); if(!deviceId){ deviceId = 'd_'+Math.random().toString(36).slice(2,9); lsSet(K.dev, deviceId); }
  let statusText = '';
  let _busy = false, _pending = false, _debounce = null, _lastAuto = 0;

  const now = () => Date.now();
  const stamp = t => { try { return new Date(t).toLocaleString('de-DE'); } catch(e){ return '?'; } };

  /* ---------- Kategorien: read() -> {id:wert}, write(map) zurück in den App-State ---------- */
  const CATS = {
    setlists: { file:'setlists',
      read: () => Object.fromEntries((S.sets||[]).map(s=>[s.id, s])),
      write: m => { S.sets = Object.values(m); }, persist: () => save() },
    tags: { file:'tags',
      read: () => Object.fromEntries((S.tags||[]).map(t=>[t.id, t])),
      write: m => { S.tags = Object.values(m); }, persist: () => save() },
    tunetags: { file:'tunetags',
      read: () => { const o={}; for(const k in S.tuneTags){ if((S.tuneTags[k]||[]).length) o[k]=S.tuneTags[k]; } return o; },
      write: m => { const o={}; for(const k in m){ if((m[k]||[]).length) o[k]=m[k]; } S.tuneTags = o; }, persist: () => save() },
    favorites: { file:'favorites',
      read: () => { const o={}; S.fav.forEach(k=>o[k]=1); return o; },
      write: m => { S.fav = new Set(Object.keys(m)); }, persist: () => save() },
    practice: { file:'practice',

      write: m => { S.prac = new Set(Object.keys(m)); }, persist: () => save() },

      read: () => { const o={}; for(const k in OVERRIDES) o[k]=OVERRIDES[k]; return o; },
      write: m => { for(const k in OVERRIDES) delete OVERRIDES[k]; for(const k in m) OVERRIDES[k]=m[k]; },
      persist: () => { saveOverrides(); reapplyOverrides(); } }

  /* Overrides nach einem Sync erneut auf die Großsammlung anwenden (Titel/Komponist live). */
  function reapplyOverrides(){
    try {
      TUNES.forEach(t => { const o=OVERRIDES[t.key];
        t.t = (o && typeof o.t==='string' && o.t) ? o.t : t._ot;
        t.c = (o && typeof o.c==='string') ? o.c : (t._oc||''); });

    } catch(e){}
  }

  /* ---------- lokale Sicherung (Ring, letzte 20) ---------- */
  function backup(cat, dataMap){
    try {
      const ring = jget(K.backup, []);
      ring.push({ t: now(), cat, data: dataMap });
      while(ring.length > 20) ring.shift();
      jset(K.backup, ring);
    } catch(e){}
  }

  /* ---------- PKCE / OAuth ---------- */
  function b64url(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function randVerifier(){ const a=new Uint8Array(64); crypto.getRandomValues(a); return b64url(a); }
  function challenge(v){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(b64url); }
  function form(o){ return Object.keys(o).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(o[k])).join('&'); }

  function startLogin(){
    const v = randVerifier(); lsSet(K.ver, v);
    setStatus('Leite zu Dropbox weiter…');
    challenge(v).then(ch => {
      location.href = AUTH + '?client_id='+encodeURIComponent(APP_KEY)
        + '&response_type=code&code_challenge='+encodeURIComponent(ch)
        + '&code_challenge_method=S256&token_access_type=offline'
        + '&redirect_uri='+encodeURIComponent(REDIRECT);

  function exchangeCode(code){

      body: form({ code, grant_type:'authorization_code', client_id:APP_KEY, redirect_uri:REDIRECT, code_verifier:v||'' }) })
      .then(r => r.json().then(j => ({ok:r.ok, j}))).then(res => {
        if(!res.ok) throw new Error('Anmeldung fehlgeschlagen: '+JSON.stringify(res.j));

  function refreshAccess(){

        return res.j.access_token;
      });
  }

  function token(){
    const at = lsGet(K.acc), exp = parseInt(lsGet(K.exp)||'0',10);
    if(at && exp && now() < exp-60000) return Promise.resolve(at);
    return refreshAccess();
  }

  function isConnected(){ return !!lsGet(K.ref); }
  function autoOn(){ return lsGet(K.auto) !== '0'; }

  /* ---------- Dropbox Datei-Zugriff (relativ zum App-Ordner) ---------- */
  function download(file){
    return token().then(at => fetch(DL, { method:'POST', headers:{
        'Authorization':'Bearer '+at, 'Dropbox-API-Arg': JSON.stringify({ path:'/state/'+file+'.json' }) } }))
      .then(r => r.text().then(tx => ({ok:r.ok, tx})))
      .then(res => {
        if(res.ok){ try { return JSON.parse(res.tx); } catch(e){ return null; } }
        if(res.tx && res.tx.indexOf('not_found') >= 0) return null;   // Datei existiert noch nicht
        throw new Error('Laden ('+file+'): '+res.tx.slice(0,160));
      });
  }
  function upload(file, obj){
    const body = JSON.stringify(obj);
    return token().then(at => fetch(UP, { method:'POST', headers:{
        'Authorization':'Bearer '+at,
        'Dropbox-API-Arg': JSON.stringify({ path:'/state/'+file+'.json', mode:'overwrite', mute:true }),
        'Content-Type':'application/octet-stream' }, body }))
      .then(r => { if(!r.ok) return r.text().then(t => { throw new Error('Hochladen ('+file+'): '+t.slice(0,160)); }); });
  }

  /* ---------- Merge einer Kategorie ---------- */
  function syncCat(cat){
    const cfg = CATS[cat];
    const local = cfg.read();
    const meta = META[cat] || (META[cat] = {});
    const snap = SNAP[cat] || (SNAP[cat] = {});
    const t = now();

    // 1. lokale Änderungen seit letztem Sync erkennen (per Snapshot-Diff)
    const localIds = Object.keys(local);
    const localSet = new Set(localIds);
    localIds.forEach(id => {
      const ser = JSON.stringify(local[id]);
      if(snap[id] !== ser){
        const nu = (local[id] && typeof local[id].updatedAt==='number') ? local[id].updatedAt : null;
        meta[id] = { u: nu!=null ? Math.max(nu, (meta[id]&&meta[id].u)||0) : t, d:false };
      } else if(meta[id] && meta[id].d){ meta[id] = { u:t, d:false }; }
      if(!meta[id]) meta[id] = { u:t, d:false };
    });
    Object.keys(snap).forEach(id => {
      if(!localSet.has(id) && !(meta[id] && meta[id].d)) meta[id] = { u:t, d:true }; // lokal gelöscht -> Tombstone
    });

    // 2. Remote holen und mergen
    return download(cfg.file).then(remote => {
      const rItems = (remote && remote.items) || {};
      const rMeta  = (remote && remote.meta)  || {};
      const ids = new Set([].concat(Object.keys(meta), Object.keys(rMeta), Object.keys(local), Object.keys(rItems)));
      const outItems = {}, outMeta = {};
      ids.forEach(id => {
        const lm = meta[id] || (local[id]!==undefined ? {u:0,d:false} : null);
        const rm = rMeta[id] || (rItems[id]!==undefined ? {u:0,d:false} : null);
        let side;
        if(lm && rm) side = (rm.u||0) > (lm.u||0) ? 'r' : 'l';   // Gleichstand -> lokal
        else side = lm ? 'l' : 'r';
        const wm = side==='l' ? lm : rm;
        outMeta[id] = { u: wm.u||0, d: !!wm.d };
        if(!wm.d){
          let v = side==='l' ? local[id] : rItems[id];
          if(v===undefined) v = side==='l' ? rItems[id] : local[id];
          if(v!==undefined) outItems[id] = v; else outMeta[id].d = true;
        }
      });
      // Tombstones > 90 Tage aufräumen
      const cutoff = t - 90*24*3600*1000;
      Object.keys(outMeta).forEach(id => { if(outMeta[id].d && (outMeta[id].u||0) < cutoff) delete outMeta[id]; });

      // 3. Ergebnis übernehmen (mit Sicherung), Snapshot/Meta aktualisieren
      const localSer = JSON.stringify(local);
      const mergedSer = JSON.stringify(outItems);
      const changedLocally = localSer !== mergedSer;
      _busy = true;
      try {
        if(changedLocally){ backup(cat, local); cfg.write(outItems); cfg.persist(); }
      } finally { _busy = false; }
      const newSnap = {}; Object.keys(outItems).forEach(id => newSnap[id] = JSON.stringify(outItems[id]));
      SNAP[cat] = newSnap; META[cat] = outMeta;

      // 4. hochladen, falls Remote abweicht
      const needUp = JSON.stringify({items:rItems, meta:rMeta}) !== JSON.stringify({items:outItems, meta:outMeta});
      return (needUp ? upload(cfg.file, { schema:1, kind:cat, updatedAt:t, device:deviceId, items:outItems, meta:outMeta }) : Promise.resolve())
        .then(() => ({ cat, changedLocally, needUp }));
    });
  }

  /* ---------- Kompletter Abgleich ---------- */
  function syncAll(manual){
    if(_syncRunning){ _pending = true; return _syncRunning; }
    if(!isConnected()) return Promise.resolve();
    setStatus('Gleiche ab…');
    let anyLocal = false;
    const run = CAT_KEYS.reduce((p, cat) => p.then(() => syncCat(cat).then(r => { if(r && r.changedLocally) anyLocal = true; })
        .catch(e => { setStatus('Fehler: '+ (e && e.message ? e.message : e)); throw e; })), Promise.resolve());
    _syncRunning = run.then(() => {
      jset(K.meta, META); jset(K.snap, SNAP); lsSet(K.last, String(now()));
      if(anyLocal){ try { render(); } catch(e){} }
      setStatus('Abgeglichen · '+stamp(now()));
    }).catch(() => {}).then(() => {
      _syncRunning = null;
      if(_pending){ _pending = false; return syncAll(); }
    });
    return _syncRunning;
  }
  let _syncRunning = null;

  /* ---------- Auto-Trigger nach lokaler Änderung (entprellt) ---------- */
  function onLocalChange(){
    if(!isConnected() || !autoOn()) return;
    clearTimeout(_debounce);
    _debounce = setTimeout(() => syncAll(), 3000);
  }

  /* save()/saveOverrides() umschließen → automatischer Abgleich nach jeder Änderung */
  function wrap(name){
    const orig = window[name];
    if(typeof orig !== 'function') return;
    window[name] = function(){ const r = orig.apply(this, arguments); if(!_busy) onLocalChange(); return r; };
  }

  /* ---------- Status/UI ---------- */
  function setStatus(s){ statusText = s; const el = document.getElementById('rbSyncStatus'); if(el) el.textContent = s; }

  function renderSettings(card){
    if(!card || document.getElementById('rbSyncBox')) return;
    const box = document.createElement('div');
    box.id = 'rbSyncBox';
    box.style.cssText = 'border-top:1px solid var(--line);padding-top:14px;margin-top:14px';
    const last = lsGet(K.last);
    if(!isConnected()){
      box.innerHTML = '<div class="lbl" style="margin:0 0 8px">Cloud-Abgleich (Dropbox)</div>'
        + '<div class="muted" style="margin:0 0 10px">Gleicht Setlists, Tags, Favoriten, Üben-Liste und Metadaten-Korrekturen automatisch zwischen deinen Geräten ab. Noten-PDFs bleiben lokal.</div>'
        + '<button class="btn" id="rbSyncConnect" style="width:100%">Mit Dropbox verbinden</button>'
        + '<div class="muted" id="rbSyncStatus" style="margin:8px 2px 0">'+esc(statusText)+'</div>';
      card.append(box);
      const b = document.getElementById('rbSyncConnect'); if(b) b.onclick = startLogin;
    } else {
      box.innerHTML = '<div class="lbl" style="margin:0 0 8px">Cloud-Abgleich (Dropbox)</div>'
        + '<div class="muted" style="margin:0 0 10px">Verbunden.'+(last?' Letzter Abgleich: '+esc(stamp(parseInt(last,10))):' Noch nicht abgeglichen.')+'</div>'
        + '<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="rbSyncNow" style="flex:1">Jetzt abgleichen</button>'
        + '<button class="btn ghost" id="rbSyncOff" style="flex:1">Verbindung trennen</button></div>'
        + '<label style="display:flex;align-items:center;gap:8px;margin:10px 2px 0;font-size:14px;cursor:pointer">'
        + '<input type="checkbox" id="rbSyncAuto"'+(autoOn()?' checked':'')+'> Automatisch abgleichen</label>'
        + '<div class="muted" id="rbSyncStatus" style="margin:8px 2px 0">'+esc(statusText)+'</div>';
      card.append(box);
      const now_ = document.getElementById('rbSyncNow'); if(now_) now_.onclick = () => syncAll(true);
      const off = document.getElementById('rbSyncOff'); if(off) off.onclick = () => {
        if(confirm('Verbindung zu Dropbox trennen? Deine Daten bleiben lokal erhalten.')){
          [K.ref,K.acc,K.exp,K.ver].forEach(lsDel); renderReplace(card); } };
      const au = document.getElementById('rbSyncAuto'); if(au) au.onchange = () => { lsSet(K.auto, au.checked?'1':'0'); if(au.checked) syncAll(); };
    }
  }
  function renderReplace(card){ const old=document.getElementById('rbSyncBox'); if(old) old.remove(); renderSettings(card); }

  /* ---------- Init / Redirect-Rücksprung ---------- */
  function boot(){
    wrap('save'); wrap('saveOverrides');
    // openDataSheet umschließen → Abgleich-Bereich im ⚙︎-Menü anhängen
    if(typeof window.openDataSheet === 'function'){
      const od = window.openDataSheet;
      window.openDataSheet = function(){ const r = od.apply(this, arguments); try { renderSettings(document.getElementById('sheetCard')); } catch(e){} return r; };
      // ⚙︎-Knopf hält eine direkte Referenz auf die Originalfunktion → neu auf die umschlossene zeigen
      const sb = document.getElementById('settingsBtn'); if(sb) sb.onclick = window.openDataSheet;
    }
    // Foreground → leiser Abgleich (max. alle 15 s)
    document.addEventListener('visibilitychange', () => { if(!document.hidden) maybeAuto(); });
    window.addEventListener('focus', maybeAuto);

    const q = location.search;
    if(q.indexOf('code=') >= 0){
      const code = new URLSearchParams(q).get('code');
      history.replaceState({}, '', REDIRECT);
      setStatus('Verbinde…');
      exchangeCode(code).then(() => { setStatus('Verbunden.'); return syncAll(); })
        .catch(e => setStatus('Fehler: '+(e && e.message ? e.message : e)));
    } else if(q.indexOf('error=') >= 0){
      const err = new URLSearchParams(q).get('error_description') || new URLSearchParams(q).get('error');
      history.replaceState({}, '', REDIRECT);
      setStatus('Dropbox: '+err+' (ist die Adresse '+REDIRECT+' als Redirect-URI eingetragen?)');
    } else if(isConnected() && autoOn()){
      syncAll();
    }
  }
  function maybeAuto(){ if(isConnected() && autoOn() && now()-_lastAuto > 15000){ _lastAuto = now(); syncAll(); } }

  window.RBSync = { renderSettings, syncAll, isConnected, startLogin, _boot:boot };
  if(document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();


/* ============================================================================
   Phase 2 — Baustein „Stimmen & Audio": ein Stück = Bündel aus Dateien mit Rollen.
   Isoliert: neuer IndexedDB-Store 'parts', eigenes Betrachter-Overlay + Audio-Leiste.
   Gilt für ALLE Stücke (Großsammlung + eigene Importe), Schlüssel = t.key.
   Rührt den bestehenden Betrachter/CSS nicht an (nur additive Hooks: voiceBadges,
   umschlossenes openViewer/openMetaSheet). Dateien bleiben gerätelokal (kein Auto-Abgleich).
   ========================================================================== */
(function(){
  "use strict";
  const ROLE_KEY='rb_roles';
  const DEF_ROLES=['Leadsheet','Piano','Bass','Gitarre','Alt-Sax','Tenor-Sax','Trompete','Posaune','Audio'];
  const AUDIO_RX=/\.(mp3|m4a|aac|wav|ogg|opus)$/i;
  const SHORT={ 'Leadsheet':'LS','Piano':'Pno','Bass':'Bass','Gitarre':'Git','Alt-Sax':'ASax',
    'Tenor-Sax':'TSax','Trompete':'Tpt','Posaune':'Pos','Audio':'Ton','Gesang':'Voc','Vocals':'Voc','Schlagzeug':'Dr' };
  const shortOf = r => SHORT[r] || (r||'').slice(0,4);
  const uid = () => 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const roles = () => { try{ const r=JSON.parse(localStorage.getItem(ROLE_KEY)); if(Array.isArray(r)&&r.length) return r; }catch(e){} return DEF_ROLES.slice(); };

  /* ---- IndexedDB 'parts' (Store wird in idb() v3 angelegt) ---- */
  function tx(mode){ return idb().then(db=>{ try{ return db.transaction('parts',mode).objectStore('parts'); }catch(e){ return null; } }); }
  function partsAll(){ return idb().then(db=>new Promise((res,rej)=>{
    let t; try{ t=db.transaction('parts','readonly'); }catch(e){ return res([]); }
    const st=t.objectStore('parts'), out=[], c=st.openCursor();
    c.onsuccess=e=>{ const cur=e.target.result; if(cur){ out.push(cur.value); cur.continue(); } else res(out); }; c.onerror=()=>rej(c.error); })); }
  function partPut(rec){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction('parts','readwrite'); t.objectStore('parts').put(rec); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }
  function partDel(id){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction('parts','readwrite'); t.objectStore('parts').delete(id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }

  let PARTS={}; window.PARTS=PARTS;
  function loadParts(){ return partsAll().then(list=>{
    Object.values(PARTS).forEach(arr=>arr.forEach(p=>{ if(p._url) try{ URL.revokeObjectURL(p._url); }catch(_){}}));
    const map={};
    list.forEach(p=>{ try{ p._url=URL.createObjectURL(p.blob); }catch(_){ p._url=''; } (map[p.tuneKey]=map[p.tuneKey]||[]).push(p); });
    Object.values(map).forEach(arr=>arr.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)));
    PARTS=map; window.PARTS=map;
  }).catch(()=>{}); }
  const partsOf = key => PARTS[key]||[];

  /* ---- Badges in der Listenzeile (Hook aus tuneRow) ---- */
  window.voiceBadges=function(t){
    const ps = t && t.key ? partsOf(t.key) : [];
    if(!ps.length) return '';
    return '<span class="vbadges">'+ps.map(p=>'<span class="vbadge'+(p.kind==='audio'?' aud':'')+'">'+esc(shortOf(p.role))+'</span>').join('')+'</span>';
  };

  /* ---- Die aktive Stimme ----
     Eine PDF-Stimme wird seit Schritt 10 in der Buehne gezeigt und nicht
     mehr in einem eigenen Vollbild. Damit verhaelt sie sich wie das
     Leadsheet: volle Hoehe, Wischen blaettert, das Dock bleibt stehen.
     Technisch ist es derselbe Weg, den importierte PDFs schon immer
     gehen — renderPdfFit bekommt eine Blob-Adresse statt eines Pfades.
     Der empfindliche Betrachter-Pfad wird also wiederverwendet, nicht
     geaendert. */
  let AKTIV=null;                                  // gezeigte PDF-Stimme oder null

  /* Ein Pseudo-Stueck fuer den Betrachter. renderPdfFit liest daraus nur
     die Adresse; Titel und Buch stehen dabei, damit Teilen und Drucken
     den richtigen Namen tragen. */
  function stimmStueck(p, eltern){
    if(!p) return null;
    const e = eltern || {};
    return { key:(e.key||'')+'|'+p.id, t:(e.t||'Stück')+' — '+(p.role||'Stimme'),
             c:e.c||'', b:e.b||'', pg:'', np:1, f:p._url||'' };
  }
  const jetziges = () => (typeof CURRENT!=='undefined') ? CURRENT : null;
  window.aktiveStimme = () => AKTIV ? stimmStueck(AKTIV, jetziges()) : null;
  /* Was gerade auf dem Blatt liegt. Teilen und Drucken folgen dem — sonst
     teilte ein Tipp auf Teilen das Leadsheet, waehrend die Bassstimme zu
     sehen ist. */
  window.blattStueck = () => window.aktiveStimme() || jetziges();

  function zeigeStimme(p){
    AKTIV = (p && p.kind==='pdf') ? p : null;
    if(window.blattNeuZeichnen) window.blattNeuZeichnen(true);
  }
  function zeigeOriginal(){
    if(AKTIV===null) return;
    AKTIV=null;
    if(window.blattNeuZeichnen) window.blattNeuZeichnen(true);
  }

  /* Flaeche geaendert — erst die Spalten rechnen, dann das Blatt neu
     einpassen. Falle 2 des Arbeitsstands: layout() allein zeichnet das
     Blatt nicht. */
  function neuEinpassen(){
    if(window.layout) window.layout();
    if(window.blattNeuZeichnen) window.blattNeuZeichnen(true);
  }

  /* ---- Die Stimme vom Stueck loesen ---- */
  async function detachPart(part, eltern){
    if(!part || !eltern) return;
    if(!confirm('„'+(part.role||'Stimme')+'" vom Stück lösen?\n\nDie Stimme wird NICHT gelöscht — sie erscheint als eigenes Stück unter „Sonstiges Material".')) return;
    /* Die geloeste Stimme wird ein eigenes Stueck in der neuen Ablage. Sie
       braucht ein Buch; „Sonstiges Material" wird dafuer angelegt, wenn es
       noch keines gibt. */
    let np=1; if(part.kind==='pdf'){ try{ np=await BS.seitenzahl(part.blob); }catch(e){} }
    try{
      let buch=(USERBOOKS||[]).find(b=>b.name==='Sonstiges Material');
      const bid = buch ? buch.bid : await createBook('Sonstiges Material');
      if(!bid) throw new Error('Kein Buch für die gelöste Stimme.');
      const ti=await BS.titelAnlegen({buchId:bid,
        titel:(eltern.t||'Stück')+' — '+(part.role||'Stimme'), komponist:eltern.c||''});
      await BS.elementAnlegen({titelId:ti.id, art:(part.kind==='audio'?'ton':'blatt'),
        etikett:part.role||'', dateiname:part.fileName||'', blob:part.blob, np});
    }catch(e){ alert('Konnte die Stimme nicht ablegen: '+(e&&e.message||e)); return; }
    await partDel(part.id);
    if(AKTIV && AKTIV.id===part.id) AKTIV=null;                 // sonst zeigt die Buehne eine Datei, die nicht mehr dazugehoert
    await loadParts(); if(typeof loadLibrary==='function'){ try{ await loadLibrary(); }catch(e){} }
    try{ render(); }catch(e){}
    const v=document.getElementById('viewer');
    if(v&&v.classList.contains('open')&&jetziges()){ refreshVoiceBar(jetziges()); neuEinpassen(); }
  }

  /* ---- Der Player am unteren Buehnenrand ----
     Er haengt in der Buehne (in .frame) statt am Bildschirm: Im Querformat
     liegt er damit nur ueber den Noten und nicht ueber der Titelliste.
     Seine Hoehe geht in docPads() ein, damit das Blatt nie darunter
     laeuft. */
  function ensureAudio(){
    let a=document.getElementById('voiceAudio'); if(a) return a;
    const frame=document.querySelector('#viewer .frame'); if(!frame) return null;
    a=document.createElement('div'); a.id='voiceAudio';
    a.innerHTML='<span class="vaname" id="vaName"></span>'
      +'<audio id="vaEl" controls preload="metadata"></audio>'
      +'<button class="vax" id="vaX" title="Player schließen"><i class="i ic-x"></i></button>';
    frame.append(a);
    a.querySelector('#vaX').onclick=()=>{ closeAudio(); schalterAuffrischen(); };
    return a;
  }
  /* Die Randberechnung liest die Hoehe hier ab. Zugeklappt sind es null,
     damit das Blatt den Platz vollstaendig zurueckbekommt. */
  window.playerHoehe = function(){
    const a=document.getElementById('voiceAudio');
    if(!a || !a.classList.contains('open')) return 0;
    return a.offsetHeight + 12;                       // Hoehe zuzueglich des Abstands zur Kante
  };
  function closeAudio(still){
    const a=document.getElementById('voiceAudio');
    if(a && a.classList.contains('open')){
      const el=a.querySelector('#vaEl'); try{ el.pause(); }catch(_){}
      a.classList.remove('open'); a.dataset.pid='';
      if(!still) neuEinpassen();
    }
  }
  function showAudio(part){
    const a=ensureAudio(); if(!a) return;
    a.querySelector('#vaName').textContent=part.role||part.fileName||'Audio';
    const el=a.querySelector('#vaEl'); el.src=part._url;
    a.dataset.pid=part.id; a.classList.add('open');
    /* Sofort neu einpassen, nicht im naechsten Bild. Ein Zugriff auf
       offsetHeight erzwingt den Umbruch ohnehin, die Hoehe stimmt also
       schon hier — und requestAnimationFrame feuert nicht, solange die
       Seite im Hintergrund liegt. Genau die Art Zustand, an die nach dem
       Arbeitsstand kein Verhalten gehaengt werden soll. */
    a.offsetHeight;
    neuEinpassen();
    try{ el.play().catch(()=>{}); }catch(_){}
  }

  /* ================================================================
     Der Stimmen-Schalter auf dem Blatt — Schritt 4 des Stimmen-Konzepts

     Blatt und Ton sind zwei getrennte Zustaende: Auf dem Blatt liegt genau
     eines — eine Ausgabe oder eine hochgeladene PDF-Stimme —, und daneben
     kann ein Audio laufen. Genau das ist der Zweck der Sache: mitspielen,
     waehrend das Blatt sichtbar bleibt.

     Bis zum 28. Juli gab es dafuer ZWEI Wege: die Ausgaben ueber einen Knopf
     im Dock, die hochgeladenen Dateien ueber eine Leiste am oberen
     Buehnenrand. Das Konzept fuehrt beides zusammen — „drei Quellen speisen
     denselben Schalter, fuer die Bedienung sind sie nicht zu unterscheiden".
     Der Dock-Knopf und die Leiste sind damit entfallen.
     ================================================================ */

  const gruppeVon = t => (t && t.fam && typeof GRUPPEN!=='undefined' && GRUPPEN[t.gid])
                          ? GRUPPEN[t.gid] : (t ? [t] : []);

  /* Alles, was auf dem Blatt liegen kann, in fester Reihenfolge: erst die
     Ausgaben der Buchfamilie, dann die hochgeladenen PDF-Stimmen.

     Gesammelt wird ueber die GANZE Gruppe. Sonst verschwaende eine an der
     C-Ausgabe haengende Bassstimme, sobald man auf B wechselt — und der
     Schalter waere je nach Ausgabe verschieden lang. */
  function blaetter(){
    const t=jetziges(); if(!t) return [];
    const g=gruppeVon(t), aus=[];
    g.forEach(s=>aus.push({art:'ausgabe', id:'a:'+s.key, name:s.stimme||'C', seite:s.pg, tune:s}));
    g.forEach(s=>partsOf(s.key).filter(p=>p.kind==='pdf').forEach(p=>
      aus.push({art:'datei', id:'p:'+p.id, name:p.role||'Stimme', part:p, eltern:s})));
    return aus;
  }
  /* Ein Audio ist keine Stimme im Sinne des Konzepts — es steht deshalb
     nicht im Schalter, sondern in seinem Menue. */
  function toene(){
    const aus=[]; gruppeVon(jetziges()).forEach(s=>
      partsOf(s.key).filter(p=>p.kind==='audio').forEach(p=>aus.push(p)));
    return aus;
  }
  const jetztId = () => AKTIV ? ('p:'+AKTIV.id) : (jetziges() ? 'a:'+jetziges().key : '');
  const laufenderTon = () => { const a=document.getElementById('voiceAudio');
    return (a && a.classList.contains('open')) ? (a.dataset.pid||'') : ''; };

  function zeige(b){
    if(!b) return;
    const jetzt=jetziges();
    if(b.art==='datei'){
      /* Haengt die Datei an einer anderen Ausgabe, muss erst diese aufgehen —
         sonst stuende die Stimme unter dem falschen Stueck. */
      if(b.eltern && jetzt && b.eltern.key!==jetzt.key) openViewer(b.eltern, true);
      zeigeStimme(b.part);
    } else if(jetzt && b.tune.key===jetzt.key){
      zeigeOriginal();
    } else {
      /* Eine hier gewaehlte Ausgabe geht beim Blaettern mit zum naechsten
         Stueck — wer eine Setlist in B durchspielt, bleibt in B. */
      if(window.stimmWunsch) window.stimmWunsch(b.tune.stimme);
      openViewer(b.tune, true);
    }
    schalterAuffrischen();
  }

  function schalterAuffrischen(){
    const frame=document.querySelector('#viewer .frame'); if(!frame) return;
    let s=document.getElementById('stimmSchalter');
    const bl=blaetter(), tn=toene();
    /* Hat ein Stueck nur ein Blatt und keinen Ton, erscheint kein Schalter.
       Der Regelfall bleibt: Noten, sonst nichts. Gibt es nur Ton, erscheint
       er trotzdem — sonst kaeme man an den Ton nicht heran. */
    if(bl.length<2 && !tn.length){ if(s) s.remove(); schliesseMenue(); return; }
    if(!s){
      s=document.createElement('div'); s.id='stimmSchalter';
      s.innerHTML='<button class="sp" data-r="-1" title="Stimme zurück"><i class="i ic-chevron-left"></i></button>'
                 +'<div class="sname"></div>'
                 +'<button class="sp" data-r="1" title="Nächste Stimme"><i class="i ic-chevron-right"></i></button>';
      frame.append(s); verdrahteSchalter(s);
    }
    const i=bl.findIndex(b=>b.id===jetztId());
    s.querySelector('.sname').textContent = (i>=0 ? bl[i].name : (bl.length ? bl[0].name : 'Ton'));
    s.querySelector('[data-r="-1"]').disabled = !(i>0);
    s.querySelector('[data-r="1"]').disabled  = !(i>=0 && i<bl.length-1);
    s.classList.toggle('tont', !!laufenderTon());
    s.title = bl.length>1 ? 'Wischen oder Pfeile: Stimme wechseln · lange tippen: Menü'
                          : 'Lange tippen: Menü';
  }

  function schritt(d){
    const bl=blaetter(); const i=bl.findIndex(b=>b.id===jetztId());
    const j=(i<0?0:i)+d; if(j<0||j>=bl.length) return;
    zeige(bl[j]);
  }

  /* Der Wisch auf dem Schalter und der Wisch auf dem Blatt sind zwei Gesten
     an zwei Orten. Der Schalter faengt seine Zeigerereignisse deshalb selbst
     ab und laesst sie nicht zum Blatt durch — sonst blaetterte derselbe Wisch
     zugleich die Seite weiter.

     Kein setPointerCapture: Das ist die Regel des Pencil-Editors, und sie
     gilt hier aus demselben Grund nicht dagegen — aber ohne Not gefangen wird
     auch hier nicht. */
  function verdrahteSchalter(s){
    let x0=0, y0=0, zieht=false, lang=null, gewischt=false;
    s.querySelectorAll('.sp').forEach(b=>{
      b.onclick=e=>{ e.stopPropagation(); if(!b.disabled) schritt(+b.dataset.r); };
    });
    s.addEventListener('pointerdown', e=>{
      x0=e.clientX; y0=e.clientY; zieht=true; gewischt=false;
      clearTimeout(lang); lang=setTimeout(()=>{ zieht=false; menueOeffnen(); }, 500);
      /* Das Dock zaehlt vier Sekunden ohne Beruehrung. Wer am Schalter
         arbeitet, soll ihn nicht unter der Hand verlieren. */
      if(window.dockAntippen) window.dockAntippen();
      e.stopPropagation();
    });
    s.addEventListener('pointermove', e=>{
      if(!zieht) return;
      const dx=e.clientX-x0, dy=e.clientY-y0;
      if(Math.abs(dx)>8 || Math.abs(dy)>8) clearTimeout(lang);
      if(gewischt || Math.abs(dx)<34 || Math.abs(dx)<=Math.abs(dy)) return;
      gewischt=true; zieht=false; schritt(dx<0?1:-1);
    });
    const aus=()=>{ clearTimeout(lang); zieht=false; };
    s.addEventListener('pointerup', aus);
    s.addEventListener('pointercancel', aus);
    s.addEventListener('click', e=>e.stopPropagation());
  }

  /* ---- Das Menue des Schalters ---- */
  function schliesseMenue(){
    const m=document.getElementById('voiceMenu'); if(m) m.classList.remove('open');
  }
  function menueOeffnen(){
    const frame=document.querySelector('#viewer .frame'); if(!frame) return;
    const t=jetziges(); if(!t) return;
    let m=document.getElementById('voiceMenu');
    if(!m){ m=document.createElement('div'); m.id='voiceMenu'; frame.append(m);
      m.addEventListener('click', e=>e.stopPropagation()); }
    if(m.classList.contains('open')){ schliesseMenue(); return; }
    m.innerHTML='';
    const jetzt=jetztId(), laeuft=laufenderTon();
    const knopf=(html, fn, klasse)=>{ const b=document.createElement('button');
      if(klasse) b.className=klasse; b.innerHTML=html;
      b.onclick=()=>{ schliesseMenue(); fn(); }; m.append(b); };
    const trenner=()=>{ const d=document.createElement('div'); d.className='mtren'; m.append(d); };
    blaetter().forEach(b=>knopf(
      '<span>'+esc(b.name)+'</span>'
      + (b.art==='ausgabe' && b.seite ? '<span class="seite">S.&nbsp;'+esc(b.seite)+'</span>' : ''),
      ()=>zeige(b), b.id===jetzt ? 'an' : ''));
    const tn=toene();
    if(tn.length){
      trenner();
      tn.forEach(p=>knopf('<i class="i ic-play"></i><span>'+esc(p.role||'Audio')+'</span>',
        ()=>{ if(laeuft===p.id) closeAudio(); else showAudio(p); schalterAuffrischen(); },
        'ton'+(laeuft===p.id ? ' an' : '')));
    }
    trenner();
    knopf('<i class="i ic-upload"></i><span>Stimmen verwalten</span>',
          ()=>{ if(typeof openMetaSheet==='function') openMetaSheet(t); });
    if(AKTIV) knopf('<i class="i ic-external-link"></i><span>Diese Stimme lösen</span>',
          ()=>detachPart(AKTIV, t), 'warn');
    m.classList.add('open');
  }
  /* Der alte Name bleibt: Er wird an mehreren Stellen aufgerufen. */
  const refreshVoiceBar = () => schalterAuffrischen();
  /* ---- Verwaltung im Bearbeiten-Menü ---- */
  function guessRole(name){ const n=(name||'').toLowerCase();
