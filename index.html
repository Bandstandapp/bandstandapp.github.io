   `USERBOOKS` ist nur noch ihre synchron lesbare Spiegelung; gespeichert wird
   in der Datenbank. Der alte Schluessel `rb_userbooks` bleibt unangetastet
   liegen — er gehoert zum Rueckweg. */
function saveUserBooks(){ /* absichtlich leer: siehe loadLibrary */ }
function userBook(bid){ return USERBOOKS.find(b=>b.bid===bid); }
function newId(pfx){ return (pfx||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* ============================================================================
   Schritt 1c: Die Oberflaeche liest aus der neuen Ablage.

   Getauscht wird die Adapterschicht, nicht die Oberflaeche. Ein Eintrag aus
   BS bekommt genau die Form, die die Liste, die Buehne und der Druck schon
   kennen — mit einem Unterschied: `f` bleibt LEER. Die Bytes kommen erst beim
   Aufschlagen, ueber `urlSichern`. Damit haengen keine 294 MB mehr dauerhaft
   am Speicher.

   `libId` ist ab jetzt die Element-Kennung aus BS. Deshalb arbeiten `libGet`,
   `libDelete` und `saveLibMeta` unveraendert weiter — sie sind unten zu
   Adaptern auf BS umgebaut, und ihre fuenfzehn Aufrufstellen bleiben, wie sie
   waren.
   ============================================================================ */
function bsZuTune(el, ti, bu){
  const t = { key:'bs|'+el.id, libId:el.id, isLib:true, bsId:el.id, titelId:el.titelId,
    art:el.art, t:ti.titel||'(ohne Titel)', c:ti.komponist||'',
    pg:'1', b:(bu&&bu.name)||'Eigene Noten', bid:ti.buchId, np:el.np||1,
    addedAt:el.angelegt||0, groesse:el.groesse||0, dateiname:el.dateiname||'',
    ziel:el.ziel||'', f:'' };
  /* Traegt ein Satz eine Stimme, gehoert er zu einer Gruppe, und seine Zeile
     bekommt die Stimmen-Schalter wie ein Real Book. Die Gruppe ist jetzt der
     TITEL selbst und nicht mehr ein aus dem Namen gerechneter Schluessel —
     deshalb verschmelzen zwei gleichnamige Stuecke nicht mehr. */
  /* Ein Foto oder Notizblatt gehoert IMMER zu seinem Titel, auch ohne Etikett.
     Ohne diese Ausnahme bekam ein Foto eine eigene Gruppe, und der Titel stand
     zweimal in der Liste: einmal mit allen Blaettern, einmal nur mit dem Foto.
     Am 7. August von Jens gemeldet. Neue Fotos tragen jetzt ein Etikett; diese
     Zeile heilt zusaetzlich die, die vorher ohne eines entstanden sind — ohne
     ihre Daten anzufassen. */
  const amTitel = el.art==='foto' || el.art==='notizblatt';
  const hatStimme = !!(el.instrument || el.etikett) || amTitel;
  if(hatStimme){
    t.instrument = el.instrument||'';
    t.stimme = el.etikett || el.instrument || (amTitel ? (BS.ARTEN[el.art]||{}).name : '') || '';
    t.fam='ub|'+ti.buchId; t.gid='bs|'+el.titelId;
  } else { t.instrument=''; t.stimme=''; t.fam=''; t.gid=t.key; }
  return t;
}
/* GRUPPEN wird beim Start aus TUNES gerechnet; die eigenen Saetze kommen erst
   mit loadLibrary dazu und muessen nachgetragen werden — und bei jedem
   Neuladen zuerst wieder heraus, sonst stuenden sie doppelt darin. */
function gruppenLibNachtragen(){
  Object.keys(GRUPPEN).forEach(g=>{ if(g.startsWith('bs|')) delete GRUPPEN[g]; });
  LIBTUNES.forEach(t=>{ if(!t.fam) return; (GRUPPEN[t.gid]=GRUPPEN[t.gid]||[]).push(t); });
  Object.keys(GRUPPEN).forEach(g=>{ if(g.startsWith('bs|'))
    GRUPPEN[g].sort((x,y)=>(stimmenRang(stimmWert(x))-stimmenRang(stimmWert(y)))
      || (x.stimme||'').localeCompare(y.stimme||'','de',{numeric:true})); });
}
/* Der Katalog des eigenen Bestands. Gemessen an 6.231 Blaettern: 275 ms, und
   ohne eine einzige Object-URL. Der alte Weg las alle Blobs mit und legte je
   Blatt eine URL an — 709 ms, bei jedem Start und nach jeder Aenderung. */
let BS_KATALOG={buecher:[],titel:[],elemente:[]};

/* Einen Bildaufbau abwarten. Wer vor einer laengeren Rechnung darauf wartet,
   laesst den Browser vorher zeichnen — sonst friert die Oberflaeche in dem
   Zustand ein, den sie beim Start der Rechnung hatte. */
function atemzug(){
  return new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
}
async function loadLibrary(){
  let k={buecher:[],titel:[],elemente:[]};
  try{ k=await BS.katalog(); }catch(e){ k={buecher:[],titel:[],elemente:[]}; }
  BS_KATALOG=k;
  /* Die Buecher-Liste der Oberflaeche spiegelt die Buecher aus BS. Sie bleibt
     synchron lesbar, weil sehr viele Stellen sie ohne `await` brauchen. */
  USERBOOKS = k.buecher
    .slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','de'))
    .map(b=>({bid:b.id, name:b.name, chip:b.chip||b.name, createdAt:b.angelegt||0, hubId:b.hubId||null}));
  const buchById=Object.fromEntries(k.buecher.map(b=>[b.id,b]));
  const titelById=Object.fromEntries(k.titel.map(t=>[t.id,t]));
  /* Frueher geliehene URLs zurueckgeben, damit nichts angeheftet bleibt. */
  LIBTUNES.forEach(t=>{ if(t.bsId && t.f) urlFreigeben(t); });
  LIBTUNES = k.elemente
    .map(el=>{ const ti=titelById[el.titelId]; if(!ti) return null;
               return bsZuTune(el, ti, buchById[ti.buchId]); })
    .filter(Boolean)
    .sort((a,b)=> (a.t||'').localeCompare(b.t||'','de')
               || (stimmenRang(stimmWert(a))-stimmenRang(stimmWert(b))));
  if(typeof gruppenLibNachtragen==='function') gruppenLibNachtragen();
  /* Wer eine Notiz trägt, wird hier mitgelesen — die Liste soll es wissen,
     ohne je Zeile in die Datenbank zu greifen. */
  if(typeof notizKennungenLaden==='function') await notizKennungenLaden();
  rebuildByKey();
  /* Was gerade auf der Buehne liegt, zeigt auf ein Objekt aus der ALTEN Runde.
     Nach einem Umbenennen stand deshalb auf dem gesetzten Blatt weiter der
     alte Titel — bis man das Stueck einmal verliess und wieder aufschlug.
     Am 21. August von Jens gemeldet. */
  if(typeof CURRENT!=='undefined' && CURRENT && CURRENT.bsId){
    const frisch = LIBTUNES.find(x=>x.bsId===CURRENT.bsId);
    if(frisch && (CURRENT.t!==frisch.t || CURRENT.c!==frisch.c)){
      /* Nur die beiden Felder, nicht das ganze Objekt: An CURRENT haengt der
         geliehene Verweis auf die Bytes, und der ginge sonst verloren. */
      CURRENT.t=frisch.t; CURRENT.c=frisch.c;
      const kt=document.getElementById('vTitle'), ks=document.getElementById('vSub');
      if(kt) kt.textContent=CURRENT.t;
      if(ks && CURRENT.isLib && !CURRENT.isEdit)
        ks.textContent=(CURRENT.c?CURRENT.c+' — ':'')+CURRENT.b;
      lsKopfNachziehen(CURRENT);
    }
  }
  setzerVorholen();
}

/* Auf einem gesetzten Blatt steht der Titel in einer eigenen Gruppe, die
   NEBEN den Noten liegt (`g.bskopf`). Wer nur ihn austauscht, spart den
   ganzen Notensatz: Am 21. August dauerte das Speichern eines neuen Namens
   auf dem iPad vier bis fuenf Sekunden — nicht wegen des Schreibens, sondern
   weil das Blatt dafuer neu gesetzt wurde. */
function lsKopfNachziehen(t){
  if(!t || t.art!=='leadsheet') return;
  const kopf=document.querySelector('#vFit .pg svg g.bskopf');
  if(!kopf){ if(window.blattNeuZeichnen) blattNeuZeichnen(); return; }
  const txt=kopf.querySelectorAll('text');
  if(txt[0]) txt[0].textContent=String(t.t||'').toUpperCase();
  /* Ohne Komponist gab es nie einen zweiten Text — dann muss doch gesetzt
     werden, sonst bliebe der neue Name unsichtbar. */
  if(t.c && !txt[1]){ if(window.blattNeuZeichnen) blattNeuZeichnen(); return; }
  if(txt[1]) txt[1].textContent=String(t.c||'');
}

/* Der Setzer wiegt 6,8 MB. Beim ersten Leadsheet kostet das auf dem iPad zwei
   bis drei Sekunden — lang fuer jemanden, der nur ein Blatt aufschlagen will.
   Er wird deshalb im Hintergrund geholt, sobald der Bestand steht und ueberhaupt
   ein Leadsheet darin liegt. Danach liegt er im Cache `libs-bs-1` und ueberlebt
   jeden Versionswechsel; ein zweites Mal geht nichts ueber die Leitung. */
let _setzerVorrat=false;
function setzerVorholen(){
  if(_setzerVorrat || !window.LS || LS.bereit()) return;
  if(!(BS_KATALOG.elemente||[]).some(e=>e.art==='leadsheet')) return;
  _setzerVorrat=true;
  /* Erst die Liste zeigen. Ein Blatt aufzuschlagen ist wichtiger als ein
     Vorrat fuer spaeter. */
  setTimeout(()=>{ LS.holen().catch(()=>{ _setzerVorrat=false; }); }, 1500);
}

/* ---- Bytes auf Zuruf: ein Verweis wird geliehen, nicht gehalten ----------
   Die Oberflaeche liest an 21 Stellen `t.f`. Statt alle einundzwanzig
   umzuschreiben, wird `t.f` unmittelbar vor Gebrauch gefuellt. Der Vorrat ist
   begrenzt; laeuft er ueber, gibt der aelteste Eintrag seinen Verweis zurueck
   und sein `t.f` wird wieder leer. So bleibt nie mehr als eine Handvoll
   Blaetter angeheftet.

   Diese eine Stelle ersetzt die dauerhafte Object-URL des alten Modells. Der
   Safari-Betrachter selbst wird nicht angefasst — er bekommt nur seinen
   Verweis von hier. */
const URL_VORRAT=8;
const _urlHalter=new Map();   // bsId -> tune
function urlFreigeben(t){
  if(!t || !t.bsId) return;
  if(_urlHalter.has(t.bsId)){ _urlHalter.delete(t.bsId); BS.urlZurueck(t.bsId); }
  t.f='';
}
async function urlSichern(t){
  if(!t) return '';
  if(!t.bsId) return t.f||'';            // Grossammlung: echter Pfad
  if(t.f && _urlHalter.has(t.bsId)){     // schon geliehen: nach vorn holen
    _urlHalter.delete(t.bsId); _urlHalter.set(t.bsId,t); return t.f;
  }
  let url=''; try{ url=await BS.urlLeihen(t.bsId)||''; }catch(e){ url=''; }
  if(!url) return '';
  t.f=url; _urlHalter.set(t.bsId,t);
  while(_urlHalter.size>URL_VORRAT){
    const alt=_urlHalter.values().next().value;
    if(!alt || alt===t) break;
    urlFreigeben(alt);
  }
  return url;
}
/* Mehrere auf einmal — fuer Drucken, Teilen und die Setlist. Der Vorrat wird
   dafuer kurz geweitet, sonst zieht das Fuellen dem Anfang der Liste den
   Verweis wieder weg. */
async function urlSichernViele(items){
  const liste=(items||[]).filter(x=>x && x.bsId);
  for(const t of liste){
    if(t.f) continue;
    try{ const u=await BS.urlLeihen(t.bsId); if(u){ t.f=u; _urlHalter.set(t.bsId,t); } }catch(e){}
  }
  return items;
}
/* Nach Drucken oder Teilen wieder einziehen. Ohne das blieben bei einer
   Setlist mit dreissig Stuecken dreissig Verweise haengen. */
function urlFreigebenViele(items){ (items||[]).forEach(t=>{ if(t&&t.bsId) urlFreigeben(t); }); }
window.urlSichern=urlSichern; window.urlSichernViele=urlSichernViele;
window.urlFreigebenViele=urlFreigebenViele;
/* ---- book display names + grouping (by bid; data.js unchanged) ---- */

function bookChip(bid){ const m=BOOKMETA[bid]; if(m)return m.chip; const u=userBook(bid); if(u)return u.chip||u.name; return bid; }
/* Der volle Name zu einer Buch-Kennung. bookName braucht ein Stueck, bookChip

/* Metronom-Icon (SVG). on=true → gefüllt (aktiv). */
function metroIcon(on,size){ size=size||22; return `<svg class="metro" viewBox="0 0 24 24" width="${size}" height="${size}" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M8.6 3.4h6.8l2.1 16.4a1.1 1.1 0 0 1-1.1 1.2H7.6a1.1 1.1 0 0 1-1.1-1.2z"/><path d="M11.7 20.6 14.9 6.2" stroke="${on?'#0b1118':'currentColor'}"/><circle cx="15.2" cy="5.6" r="1.15" fill="${on?'#0b1118':'currentColor'}" stroke="none"/></svg>`; }
function markPlayed(t){ if(!t||!t.key)return; S.recent[t.key]=Date.now(); localStorage.setItem('rb_recent',JSON.stringify(S.recent)); renderTabs(); }
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/^(the|a|an) /,'').replace(/[^a-z0-9 ]/g,'').trim();}
function initialOf(t){const c=(norm(t.t)[0]||'#');return /[0-9]/.test(c)?'#':c.toUpperCase();}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function tuneTagIds(key){return S.tuneTags[key]||[];}

/* ---- count ---- */
/* Zwei Zeilen unter der Wortmarke: erst die aktiven Buecher, darunter die
   Stuecke. Wird bei jedem Neuzeichnen aufgefrischt, damit die Zahlen zur
   aktuellen Auswahl passen. */
/* Die Statusflaeche der Seitenleiste. Bis zum 28. Juli stand hier eine
   schmale Zeile neben dem Zahnrad, und die konnte nur zwei Zahlen tragen:
   „17 Buecher · 4.309 Stuecke". Welche siebzehn, sagte sie nicht.

   Jetzt nimmt sie den Raum zwischen der Bibliothek und dem Zahnrad ein und
   benennt die Buecher. Darunter steht die Gesamtzahl der Stuecke. Damit ist
   die Kontextzeile ueber der Liste ueberfluessig geworden und entfallen. */
function markeZahlen(){
  const el=document.getElementById('count'); if(!el) return;
  const ids = S.books.size ? [...S.books] : (typeof ALLBOOKS!=='undefined' ? ALLBOOKS.slice() : []);
  const namen = ids.map(b=>bookTitel(b)).sort((a,b)=>a.localeCompare(b,'de'));
  /* Gezaehlt wird der BESTAND der aktiven Buecher, nicht die Treffer. Die
     Treffer stehen in der Kopfzeile unter dem Suchschlitz; hier stuende
     dieselbe Zahl ein zweites Mal, und beim Suchen liefe sie mit — dann
     saehe es aus, als schrumpfe die Sammlung.

     Gezaehlt werden Stuecke, nicht Blaetter. Seit Schritt 3 stehen die
     transponierten Ausgaben in einer Zeile, und die Zahl muss dazu passen.
     Der Zusatz nennt die Blaetter dahinter, damit klar bleibt, dass nichts
     fehlt. */
  let blaetter = (typeof ALL==='function') ? ALL() : TUNES;
  if(S.books.size) blaetter = blaetter.filter(t=>S.books.has(t.bid));
  if(!S.sonstOn && !S.books.has(SONST_BID)) blaetter = blaetter.filter(t=>t.bid!==SONST_BID);
  const stk = (typeof zuZeilen==='function') ? zuZeilen(blaetter).length : blaetter.length;
  const extra = (blaetter.length>stk) ? ' <span class="leer">('+blaetter.length.toLocaleString('de-DE')+' Blätter)</span>' : '';
  const kopf = S.books.size ? '' : '<div class="buch leer">Alle Bücher</div>';
  el.innerHTML = '<div class="buecher">'+kopf
               + namen.map(n=>'<div class="buch" title="'+esc(n)+'">'+esc(n)+'</div>').join('')
               + '</div>'
               + '<div class="summe">'+stk.toLocaleString('de-DE')+' Titel'+extra+'</div>';
}
(function(){
  markeZahlen();
})();

/* `ohneBuch` ueberspringt die Buchauswahl. Gebraucht wird das von „Bearbeitet":
   Eine handschriftliche Notiz traegt `bid:'user'` und liegt damit in keinem
   Buch. War auch nur ein Buch gewaehlt, warf diese Zeile jede Notiz weg — der
   Reiter zeigte seine Zahl, und darunter stand nichts. Am 8. August von Jens
   gemeldet und nachgestellt: 1 im Reiter, 0 in der Liste. */
function matches(t, ohneBuch){
  if(!ohneBuch && S.books.size && !S.books.has(t.bid)) return false;
  if(S.initial && initialOf(t)!==S.initial) return false;
  if(S.q){const q=norm(S.q); if(!norm(t.t).includes(q) && !norm(t.c).includes(q) && !norm(t.editor).includes(q)) return false;}
  if(S.tagFilter.size){const tt=tuneTagIds(t.key); if(![...S.tagFilter].some(id=>tt.includes(id))) return false;}
  return true;
}
function currentList(){
  let list=ALL().filter(t=>matches(t, S.view==='edited'));
  // „Sonstiges Material" ausblenden, wenn abgeschaltet (außer im Reiter „Bearbeitet" oder wenn gezielt gefiltert)
  if(!S.sonstOn && S.view!=='edited' && !S.books.has(SONST_BID)) list=list.filter(t=>t.bid!==SONST_BID);
  /* Favorit, Ueben und Tags fragen die ganze Gruppe. Sonst zeigte die
     Favoriten-Ansicht nur die eine Ausgabe, an der die Marke haengt, und die
     uebrigen Stimmen desselben Stuecks fehlten in der Zeile. */
  if(S.view==='fav') list=list.filter(t=>gruppeHat(S.fav,t));
  else if(S.view==='prac') list=list.filter(t=>gruppeHat(S.prac,t));
  /* „Bearbeitet" zeigt BEIDE Sorten Notiz: die alten Eintraege des
     Stift-Editors (`isEdit`) und die Notizblaetter aus dem eigenen Bestand.
     Am 8. August von Jens gemeldet — er legte Notizblaetter an und fand sie
     hier nicht wieder. Dass es zwei Sorten gibt, ist eine Altlast und gehoert
     aufgeloest; bis dahin sollen sie wenigstens an einem Ort stehen. */
  else if(S.view==='edited'){
    list=list.filter(t=>t.isEdit || t.art==='notizblatt' || hatNotiz(t));
    list.sort((a,b)=>(b.editedAt||b.addedAt||0)-(a.editedAt||a.addedAt||0));
    return list; }
  else if(S.view.startsWith('tag:')){
    const id=S.view.slice(4); list=list.filter(t=>gruppeTagIds(t).includes(id));
    /* Eine eigene Reihenfolge je Tag, sobald einmal gezogen wurde. Sie liegt
       in einem eigenen Speicher und ruehrt die Tag-Zuordnungen nicht an — v3
       liest dieselben Schluessel, und Schritt 9 soll sauber bleiben. */
    const ord=tagOrdnung(id);
    if(ord.length){
      const rang=new Map(ord.map((k,i)=>[k,i]));
      list.sort((x,y)=>{ const i=rang.has(x.key)?rang.get(x.key):9e9, j=rang.has(y.key)?rang.get(y.key):9e9;
        return i-j || norm(x.t).localeCompare(norm(y.t)); });
      return list;
    }
  }
  list.sort((a,b)=>norm(a.t).localeCompare(norm(b.t))|| (a.b||bookName(a)||'').localeCompare(b.b||bookName(b)||''));
  return list;
}

/* ---------- top tabs (incl. pinned tags) ---------- */
function renderTabs(){
  const el=document.getElementById('tabs');
  /* Die beiden Koepfe „Buecher" und „Tags" gehoeren in dieselbe Liste wie die
     Reiter. Standen sie daneben, liessen sich die untersten beiden Eintraege
     der Seitenleiste als einzige nicht mitsortieren.

     Sie werden NICHT neu gebaut, sondern nur aus dem Baum genommen und
     wieder eingehaengt: So behalten sie ihre Anbindung an die Dialoge, ihre
     Zaehler und ihr langes Tippen. */
  const koepfe = ['bookToggle','tagToggle'].map(id=>document.getElementById(id)).filter(Boolean);
  koepfe.forEach(k=>{ k.dataset.view = (k.id==='bookToggle') ? 'dlg:books' : 'dlg:lists'; k.remove(); });
  el.innerHTML='';
  /* Symbol und Beschriftung liegen in eigenen Elementen. Nur so kann der
     Rail-Zustand die Beschriftung verkleinern und das Symbol darueber stellen. */
  const base=[
    ['all','Alle',null,'menu'],
    ['fav','Favoriten',S.fav.size,'star'],
    ['prac','Üben',S.prac.size,'metronome'],
    ['recent','Zuletzt', Object.keys(S.recent).length,'clock'],
    ['edited','Bearbeitet',bearbeiteteZahl(),'pencil'],
    ['set','Setlists',S.sets.length,'list-music'],
  ];
  /* Jeder Eintrag als Bauauftrag: eine Kennung und eine Funktion, die den
     Knoten liefert. Nur so lassen sich neu gebaute Reiter und verschobene
     Koepfe in EINER Reihenfolge mischen. */
  const eintraege = base.map(([v,label,badge,icon])=>({ v, hol:()=>{
    const d=document.createElement('div'); d.className='tab'+(S.view===v?' active':''); d.dataset.view=v;
    d.innerHTML='<i class="i ic-'+icon+'"></i><span class="lab">'+esc(label)+'</span>'
      +(badge!=null?` <span class="badge">${badge}</span>`:'');
    d.onclick=()=>{S.view=v;S.openSet=null;render();};
    return d; }}));
  eintraege.push({ v:'tags', hol:()=>{
    const d=document.createElement('div'); d.className='tab'; d.style.borderStyle='dashed';
    d.dataset.view='tags';
    d.innerHTML='<i class="i ic-tags"></i><span class="lab">Tags verwalten</span>';
    d.onclick=manageTagsFlow; return d; }});
  koepfe.forEach(k=>eintraege.push({ v:k.dataset.view, hol:()=>k }));
  /* Eigene Reihenfolge, per Ziehen gesetzt (siehe unten). Was nicht in der
     gespeicherten Liste steht, bleibt hinten in der urspruenglichen Ordnung. */
  const ordnung=(()=>{ try{ const a=JSON.parse(localStorage.getItem('rb_taborder')||'[]');
    return Array.isArray(a)?a:[]; }catch(e){ return []; } })();
  if(ordnung.length) eintraege.sort((x,y)=>{
    const i=ordnung.indexOf(x.v), j=ordnung.indexOf(y.v);
    return (i<0?99:i)-(j<0?99:j);
  });
  eintraege.forEach(e=>el.append(e.hol()));
  renderTagTabs();
}
/* Reihenfolge je Tag — eigener Speicher, damit die Tag-Zuordnungen und der
   Abgleich unberuehrt bleiben. */
const TAGORDER_KEY='rb_tagorder';
function tagOrdnungAlle(){ try{ return JSON.parse(localStorage.getItem(TAGORDER_KEY)||'{}')||{}; }catch(e){ return {}; } }
function tagOrdnung(id){ const a=tagOrdnungAlle()[id]; return Array.isArray(a)?a:[]; }
function tagOrdnungSetzen(id, keys){
  const alle=tagOrdnungAlle(); alle[id]=keys;
  try{ localStorage.setItem(TAGORDER_KEY, JSON.stringify(alle)); }catch(e){}
}
function tagCount(id){ let n=0; for(const k in S.tuneTags){ if((S.tuneTags[k]||[]).includes(id)) n++; } return n; }
function renderTagTabs(){
  const el=document.getElementById('tagtabs'); if(!el) return; el.innerHTML='';
  const tags=S.tags.filter(t=>t.pinned || tagCount(t.id)>0);
  tags.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || norm(a.name).localeCompare(norm(b.name)));
  tags.forEach(tag=>{
    const v='tag:'+tag.id;
    const d=document.createElement('div'); d.className='tab tagtab'+(S.view===v?' active':''); d.dataset.view=v;
    d.innerHTML=`<span class="dot" style="background:${tag.color}"></span>${esc(tag.name)} <span class="badge">${tagCount(tag.id)}</span>`;
    d.onclick=()=>{S.view=v;S.openSet=null;render();}; el.append(d);
  });
}

/* ---------- list ---------- */
/* Langes Tippen: 550 ms ohne nennenswerte Bewegung. Der danach folgende Klick
   wird verworfen, sonst ginge zugleich der Betrachter auf. */
function langesTippen(el, tuWas){
  if(!el) return;
  let uhr=null, x0=0, y0=0;
  const ab=()=>{ clearTimeout(uhr); uhr=null; };
  el.addEventListener('pointerdown', e=>{
    x0=e.clientX; y0=e.clientY; ab();
    uhr=setTimeout(()=>{ uhr=null;
      const li=el.closest('li'); if(li) li._langGetippt=true;
      tuWas();
    }, 550);
  });
  el.addEventListener('pointermove', e=>{
    if(uhr && (Math.abs(e.clientX-x0)>10 || Math.abs(e.clientY-y0)>10)) ab();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n, ab));
}
/* Zwei Wege zum selben Ziel. Jens am 21. August: Was in Content der Doppeltipp
   tut, soll in der Liste auch der lange Tipp tun — und umgekehrt. Welche Geste
   mit dem Finger traegt, haengt am Gerät und an der Gewohnheit; beide
   anzubieten kostet nichts. */
function bearbeitenGeste(el, tuWas){
  if(!el) return;
  langesTippen(el, tuWas);
  el.addEventListener('dblclick', e=>{
    e.stopPropagation(); e.preventDefault();
    const li=el.closest('li'); if(li) li._langGetippt=true;
    tuWas();
  });
}
function tuneRow(t, stimmen){
  const li=document.createElement('li'); li.className='tune'; li.dataset.key=t.key;
  /* Die Zeile steht fuer das ganze Stueck, nicht fuer eine seiner Ausgaben.
     Ueber die Gruppen-Kennung findet sie sich wieder, gleich welche Stimme
     gerade offen ist. */
  li.dataset.gid = t.gid || t.key;
  /* Die Zeile des zuletzt geoeffneten Stuecks kommt schon ausgezeichnet zur
     Welt. Bis zum 28. Juli wurde sie erst nach dem Zeichnen markiert, und wer
     die Liste auf einem Weg neu aufbaute, der diesen Nachlauf nicht ausloest,
     verlor die Hervorhebung. */
  /* Ausgezeichnet wird das Stueck, sobald IRGENDEINE seiner Stimmen offen
     ist. Sonst verlor die Zeile ihre Hervorhebung, wenn man auf E tippte —
     denn die Zeile traegt den Schluessel der C-Ausgabe. */
  if(window.aktivesStueck && (stimmen||[t]).some(s=>s.key===window.aktivesStueck))
    li.setAttribute('aria-selected','true');
  /* Die Marken gehoeren dem Stueck. Traegt irgendeine Ausgabe den Stern, ist
     die Zeile ein Favorit — auch wenn gerade eine andere Stimme zu sehen ist. */
  const star=gruppeHat(S.fav,t), prac=gruppeHat(S.prac,t);
  const tt=gruppeTagIds(t); const hasTags=tt.length>0;
  let metaHTML;
  if(t.isEdit){ const d=t.editedAt?new Date(t.editedAt).toLocaleDateString('de-DE'):'';
    metaHTML=`<span><i class="i ic-pencil"></i> ${t.editor?esc(t.editor)+' ·':''}</span><span class="book">${esc(bookName(t))}</span>`
      +`${d?`<span>· ${d}</span>`:''}${seitenzahl(t)}`; }
  else metaHTML=`${t.c?`<span>${esc(t.c)} ·</span>`:''}<span class="book">${esc(bookName(t))}</span>`
      +`<span class="book">· S.&nbsp;${esc(t.pg)}</span>${seitenzahl(t)}`;
  li.innerHTML=`
    <div class="main">
      <div class="tline">
        <div class="title">${esc(t.t)}</div>
        ${aktionenHTML(hasTags,prac,star)}
      </div>
      <div class="meta">${metaHTML}</div>
      ${tagZeile(tt)}
      ${stimmenZeile(stimmen,t)}
    </div>`;
  /* Titel und Komponist korrigiert man mit langem Tippen auf den Titel. Das
     ✎ ist dafuer aus der Zeile gefallen; sie traegt jetzt die vier Symbole des
     Entwurfs. Das Menue von iOS laesst sich nicht erweitern — entweder dessen
     Textauswahl oder unsere Geste, beides zusammen geht nicht. */
  bearbeitenGeste(li.querySelector('.title'), ()=>openMetaSheet(t));
  /* Wer die Zeile antippt, waehlt ein STUECK und keine Stimme. Ein frueher
     gesetzter Wunsch faellt damit weg, und es gilt wieder das Instrument —
     also genau das, was die Zeile zeigt. */
  li.querySelector('.main').onclick=()=>{ if(li._langGetippt){ li._langGetippt=false; return; }
    STIMMWUNSCH=''; openViewer(t); };
  verdrahteAktionen(li,t); verdrahtePillen(li); verdrahteStimmen(li);
  li.prepend(selBox(t.key)); if(S.selection.has(t.key)) li.classList.add('selected');
  /* In einer Tag-Ansicht laesst sich die Reihenfolge ziehen; dafuer bekommt
     die Zeile einen Griff. */
  if(S.view.startsWith('tag:')){
    const g=document.createElement('div'); g.className='handle'; g.title='Zum Sortieren ziehen';
    g.innerHTML='<i class="i ic-grip-vertical"></i>';
    li.prepend(g);
  }
  return li;
}
/* Bausteine der Zeile — einmal beschrieben, von beiden Zeilenbauern benutzt. */
function seitenzahl(t){ return t.np>1 ? `<span>· ${t.np}&nbsp;S.</span>` : ''; }
/* Die Stimmen stehen seit dem 28. Juli in einer EIGENEN, untersten Zeile,
   nicht mehr am Ende der Metazeile. Dort rutschten sie bei schmaler Liste
   hinter Komponist, Buch, Seite und Tags in die zweite oder dritte
   Umbruchzeile und waren im Querformat kaum zu treffen. Als eigene Zeile
   stehen sie immer an derselben Stelle.

   Die Kuerzel der hochgeladenen Dateien stehen dabei — sie sind Stimmen
   derselben Sache, nur aus einer anderen Quelle. */
function stimmenZeile(stimmen, zeige){
  let liste = stimmen;
  if(liste && liste.length && !zeigeFremdeStimmen()){
    /* Die eigene Voice bleibt stehen — dazu alles, was gar keine transponierte
       Ausgabe ist: Ein Notizblatt und ein Foto gehoeren zum Stueck und waeren
       sonst aus der Zeile verschwunden. Und die Stimme, die gerade auf der
       Buehne liegt, bleibt in jedem Fall, sonst verloere die Zeile ihre
       Auszeichnung. */
    liste = stimmen.filter(t => stimmenNaehe(t)<1
      || t.art==='notizblatt' || t.art==='foto'
      || t.key===zeige.key || t.key===window.aktivesStueck);
  }
  const s = stimmenHTML(liste, zeige);
  const b = window.voiceBadges ? window.voiceBadges(zeige) : '';
  return (s||b) ? '<div class="stimmzeile">'+s+b+'</div>' : '';
}
/* Ein Tipp oeffnet genau diese Stimme. Traegt ein Stueck nur eine, steht
   nichts da — das ist der Regelfall bei zwei Dritteln der Sammlung. */
function stimmenHTML(stimmen, zeige){
  if(!stimmen || stimmen.length<2) return '';
  /* Ausgezeichnet ist die Stimme, die wirklich auf der Buehne liegt. Bis zum
     28. Juli stand die Marke immer auf der Stimme, die AUFGEGANGEN WAERE —
     ein Tipp auf E oeffnete zwar E, aber blau blieb C. */
  const aktiv = window.aktivesStueck;
  const gezeigt = stimmen.some(s=>s.key===aktiv) ? aktiv : zeige.key;
  return '<span class="stimmen">'+stimmen.map(s=>
    '<button class="stimme'+(s.key===gezeigt?' an':'')+'" data-skey="'+esc(s.key)+'"'
    + ' title="'+esc(s.stimme||s.instrument||'')+' öffnen · S. '+esc(s.pg)+'">'
    + esc(zeigStimme(s.stimme, s.instrument))+'</button>').join('')+'</span>';
}

function pillenHTML(tagIds){

/* Die Tags stehen seit dem 2. August in einer eigenen Zeile unter den Angaben
   zum Stueck. Vorher liefen sie im selben Fluss wie Komponist, Buch und

   Jetzt beansprucht die Tag-Zeile eine Zeile. Erst wenn die Pillen darin nicht
   mehr nebeneinander passen, kommt eine zweite dazu. Ohne Tags entsteht kein

/* ---------- Zwei Schalter fuer eine ruhigere Liste ----------
   Am 8. August von Jens gewuenscht. Beide betreffen nur die ANZEIGE der
   Zeile; die Tags selbst und die uebrigen Ausgaben bleiben unangetastet und
   sind ueber die Tag-Verwaltung, die Suche und das Blaettern weiter zu

/* Welche Elemente tragen eine handschriftliche Notiz? Einmal beim Start und
   nach jedem Speichern gelesen — die Liste fragt sonst je Zeile die Datenbank.
   Steht mit `let` auf oberster Ebene und liegt damit NICHT auf `window`. */
let NOTIZ_KENNUNGEN=new Set();
async function notizKennungenLaden(){
  try{ NOTIZ_KENNUNGEN=await BS.notizKennungen(); }catch(e){ NOTIZ_KENNUNGEN=new Set(); }
}
/* Trägt dieses Blatt eine Notiz? */
function hatNotiz(t){ return !!(t && t.bsId && NOTIZ_KENNUNGEN.has(t.bsId)); }

/* Gezaehlt wird, was in der Liste STEHT — also ZEILEN, nicht Blaetter. Zwei
   beschriebene Ausgaben eines Stuecks ergeben eine Zeile. Zahl und Liste sind
   am 8. August schon einmal auseinandergelaufen; das soll nicht wieder
   passieren. */
function bearbeiteteZahl(){
  const alle=USER.concat(LIBTUNES.filter(t=>t.art==='notizblatt' || hatNotiz(t)));
  return new Set(alle.map(t=>t.gid||t.key)).size;
}

function zeigeTagsSetzen(an){ localStorage.setItem('bs_zeige_tags', an?'1':'0'); render(); }
function zeigeFremdeStimmenSetzen(an){ localStorage.setItem('bs_zeige_stimmen', an?'1':'0'); render(); }
/* Ein Tipp auf eine Tag-Pille zeigt alle Stuecke mit diesem Tag. Der Klick

function verdrahteAktionen(li,t){
  /* Die Schaltflaechen liegen jetzt INNERHALB von .main, damit sie auf der
     Titelzeile sitzen. Ohne diese Sperre wuerde ihr Klick weiterlaufen und
     zugleich das Stueck oeffnen. */
  li.querySelector('.racts').addEventListener('click', e=>e.stopPropagation());
  /* Geschrieben wird auf die Leitstimme, also die C-Ausgabe. Angezeigt wird
     die Marke fuer die ganze Gruppe. Traegt eine andere Ausgabe sie schon,
     wuerde ein Tipp auf die Leitstimme eine zweite setzen statt die
     vorhandene zu loeschen — deshalb raeumt das Abschalten die ganze Gruppe. */
  const ziel=schreibBlatt(t);

}

function gruppeSchalten(menge,t,ziel){
  if(gruppeHat(menge,t)) gruppenBlaetter(t).forEach(x=>menge.delete(x.key));

}

function cssEsc(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):String(s).replace(/["\\]/g,'\\$&'); }

/* Die Kopfzeile der Titelliste. Oben, was gerade filtert — Buecher und
   Anfangsbuchstabe —, darunter die Zahl der Treffer. Vorher stand alles in
   einer Zeile und in Grossbuchstaben. */
function kontextzeile(treffer){
  /* Die Kontextzeile ist am 28. Juli entfallen. Sie nannte Buecher,
     Anfangsbuchstaben und Tags — und sagte damit dasselbe wie die
     Statusflaeche in der Seitenleiste, nur kuerzer. Es bleibt die
     Trefferzahl. */
  const h=document.getElementById('hint');
  if(h) h.innerHTML='<b>'+treffer.toLocaleString('de-DE')+'</b> '+(treffer===1?'Treffer':'Treffer');
  /* Die Anzahl neben den Koepfen der Seitenleiste. */
  /* „2/7" statt „2": Die gewählte Zahl allein sagt nicht, wie viel man
     ausgeblendet hat. Am 7. August von Jens verlangt. Ohne Auswahl steht dort
     weiterhin nur die Gesamtzahl — ein „0/7" wäre Lärm. */
  const bc=document.getElementById('bookCnt');
  if(bc){
    /* `ALLBOOKS` allein ist die falsche Quelle: Es zählt nur die ausgelieferte
       Sammlung, und die ist seit dem 29. Juli leer. Die eigenen Bücher müssen
       dazu — sonst stand dort „2/0". Genauso zählt es der Bücher-Dialog. */
    const gesamt = ((typeof ALLBOOKS!=='undefined') ? ALLBOOKS.length : 0)
                 + ((typeof USERBOOKS!=='undefined') ? USERBOOKS.length : 0);
    if(S.books.size) bc.innerHTML='<b>'+S.books.size+'</b>/'+gesamt;
    else             bc.textContent = gesamt || '';
    bc.classList.toggle('aktiv', S.books.size>0);
    bc.classList.toggle('paar',  S.books.size>0);
  }
  const tc=document.getElementById('tagCnt');
  if(tc){ const n=S.tags.filter(t=>t.pinned||tagCount(t.id)>0).length;
          tc.textContent=n; tc.classList.toggle('aktiv', S.tagFilter.size>0); }
}

/* Der zweite Block ueber der Liste: SAEMTLICHE Tags als Schnellfilter, dazu
   die Auswahl-Zeile. Beide sollen beim Scrollen stehen bleiben, deshalb
   sitzen sie ausserhalb des Scrollbereichs.

   Bis zum 28. Juli standen hier nur die angehefteten Tags. Wer einen Tag
   nicht angeheftet hatte, kam nur ueber die Seitenleiste an ihn — und die ist
   im eingeklappten Zustand nicht zu sehen. Jetzt stehen alle da, die
   angehefteten zuerst. Tags ohne ein einziges Stueck bleiben weg; sie waeren
   ein Filter, der nichts findet. */
function listFix(){
  const box=document.getElementById('listfix'); if(!box) return;
  box.innerHTML='';
  const tags=S.tags.filter(t=>t.pinned || tagCount(t.id)>0)
                   .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || a.name.localeCompare(b.name,'de'));
  if(tags.length){
    const reihe=document.createElement('div'); reihe.className='pinrow';
    tags.forEach(tg=>{
      const v='tag:'+tg.id, an=S.view===v;
      const c=document.createElement('div'); c.className='pintag'+(an?' active':'');
      c.innerHTML='<span class="dot" style="background:'+tg.color+'"></span>'+esc(tg.name)
        +' <span class="cnt">'+tagCount(tg.id)+'</span>';
      c.onclick=()=>{ S.view = an ? 'all' : v; S.openSet=null; render(); };
      reihe.append(c);
    });
    box.append(reihe);
  }
  /* „Alle auswählen" steht seit dem 2. August NICHT mehr hier, sondern
     unmittelbar ueber der ersten Zeile. In `#listfix` lag es ueber den
     Tag-Pillen und — in einer geoeffneten Setliste — ueber deren ganzem Kopf:
     zweihundert Pixel von der Liste entfernt, auf die es sich bezieht. */
  box.classList.toggle('leer', !box.children.length);
}
/* Die Zeile ueber der Liste. Solange nichts gewaehlt ist, laedt sie zum
   Auswaehlen ein; sobald etwas gewaehlt ist, nennt sie die Zahl und die Box
   ist gesetzt. Ein Tipp darauf hebt dann die ganze Auswahl auf. */
function selectAllRow(keys){
  const row=document.createElement('div'); row.className='selall';
  const b=document.createElement('div'); b.className='selbox'; const t=document.createElement('span');
  const sync=()=>{
    const n=S.selection.size;
    b.classList.toggle('on', n>0); b.innerHTML = n>0 ? '✓' : '';
    t.textContent = n>0 ? ('Ausgewählt: '+n+' '+(n===1?'Titel':'Titel'))
                        : ('Alle auswählen ('+keys.length+')');
  };
  row.append(b,t); sync(); row.addEventListener('rf',sync);
  row.onclick=()=>{
    if(S.selection.size) S.selection.clear();
    else keys.forEach(k=>S.selection.add(k));

  return row;
}
function hasSelectedNotes(){ return [...S.selection].some(k=>byKey[k]&&byKey[k].isEdit); }
function renderSelBar(){
  const bar=document.getElementById('selbar'), n=S.selection.size;
  /* „Titel" und nicht „Stück": In der App heisst ein Stueck durchgehend Titel,
     und die Zeile darueber sagt es auch schon so. */
  document.getElementById('selCnt').textContent = n+' Titel ausgewählt';
  const zu=document.getElementById('selClose');

  const act=document.getElementById('selActions'); act.innerHTML='';
  if(!n){ bar.classList.remove('open'); return; }
  /* Symbole der App statt Emoji. Ein Emoji wird von jedem Betriebssystem
     anders gezeichnet, springt farbig aus der Zeile und laesst sich nicht
     einfaerben; die eigenen Symbole tun all das. Am 31. Juli von Jens
     verlangt.

     Zugleich raeumt die Leiste auf. Sie trug bis dahin vier einzelne Knoepfe
     fuer zwei Dinge — „Üben ＋", „Üben −", „★ ＋", „★ −". Jetzt steht je ein
     Paar zusammen: ein Symbol, ein Wort, zwei kleine Schalter. */
  const mk=(html,fn,art)=>{ const b=document.createElement('button');
    b.className='btn ghost sm'+(art?' '+art:''); b.innerHTML=html; b.onclick=fn; act.append(b); return b; };
  const sym=n=>'<i class="i ic-'+n+'"></i> ';
  /* Ein Paar aus Wegnehmen und Hinzufuegen, als eine Einheit gelesen. Seit dem
     2. August steht das Wort ZWISCHEN den beiden Zeichen: „− Üben ＋". Vorher
     lagen Plus und Minus unmittelbar nebeneinander am rechten Rand, und auf dem
     iPad greift man dort mit einem Finger daneben. Jetzt trennt sie die
     Beschriftung. */
  const paar=(icon, wort, ein, aus)=>{
    const g=document.createElement('span'); g.className='selpaar';
    const b=document.createElement('button'); b.className='btn ghost sm'; b.textContent='−'; b.title=wort+' wegnehmen';
    const l=document.createElement('span'); l.className='lbl'; l.innerHTML=sym(icon)+esc(wort);
    const a=document.createElement('button'); a.className='btn ghost sm'; a.textContent='＋'; a.title=wort+' hinzufügen';
    a.onclick=ein; b.onclick=aus; g.append(b,l,a); act.append(g);
  };
  mk(sym('list-plus')+'Setlist', bulkSetlistFlow);
  paar('metronome','Üben', ()=>bulkSet(S.prac,true), ()=>bulkSet(S.prac,false));
  paar('star','Favorit',   ()=>bulkSet(S.fav,true),  ()=>bulkSet(S.fav,false));
  mk(sym('tags')+'Tags', bulkTagsFlow);
  /* „Weitergeben" reicht die Dateien an das Teilen-Blatt des Geraets — lose
     PDFs an irgendein Programm. Das ist etwas anderes als „Als Paket teilen"
     in Content, wo ein BandStand-Paket fuer ein anderes BandStand entsteht.
     Bis zum 30. Juli hiessen beide „Teilen". */
  mk(sym('share')+'Weitergeben', bulkShare);
  mk(sym('printer')+'Drucken', bulkPrint);
  if(S.view==='set' && S.openSet) mk(sym('minus')+'Aus Setlist', bulkRemoveFromSet);
  /* Die Bruecke nach Content. Die Hauptliste fasst den Bestand nicht an;
     Umbenennen, Verschieben und Entfernen stehen dort. Am 30. Juli mit Jens
     so festgelegt: eine Regel, zwei Tueren. */
  const titelIds=[...new Set([...S.selection].map(k=>byKey[k])
                   .filter(t=>t&&t.titelId).map(t=>t.titelId))];
  /* Der haeufigste Griff kommt an die Liste, der seltene bleibt in Content.
     Das entscheidet nicht der Geschmack, sondern die Haeufigkeitstabelle des
     Content-Konzepts: Eine Zuordnung richtigstellen faellt oft an und immer
     einzeln; umbenennen, verschieben und aufraeumen faellt gelegentlich an
     und in Schueben. Deshalb steht „Bearbeiten" nur bei genau EINEM Titel —
     bei mehreren gibt es nichts zu benennen, was fuer alle gilt. */
  if(titelIds.length===1)
    mk(sym('pencil')+'Bearbeiten', ()=>titelBearbeiten(titelIds[0]));
  if(titelIds.length && window.contentZeigen)
    mk(sym('book-open')+'Im Content', ()=>window.contentZeigen(titelIds));
  /* Das Loeschen steht zuletzt, abgesetzt und rot — dieselbe Vorsicht wie bei
     „Setlist löschen". Ein Fehlgriff neben Drucken ist teuer. */
  if(hasSelectedNotes())
    mk(sym('trash-2')+'Notiz löschen', bulkDeleteNotes, 'warn');
  bar.classList.add('open'); a11y(bar);
  /* Erst jetzt, mit sichtbarer Leiste: Vorher hat sie keine Masse, und das
     Einpassen rechnete mit null Breite. */
  selbarPosAnwenden();
}
/* ================================================================
   Die Auswahl-Leiste laesst sich schieben

   Sie schwebt ueber der Liste und steht damit zwangslaeufig irgendwo im Weg.
   Wo genau, weiss nur der, der gerade arbeitet: am Mac ueber dem unteren Rand,
   auf dem iPad im Querformat vielleicht ueber den Noten, im Hochformat lieber
   weiter oben. Deshalb entscheidet Jens das und nicht die App — und BandStand
   merkt sich, wofuer er sich entschieden hat. Am 2. August verlangt.

   Solange nichts geschoben wurde, gilt die Vorgabe aus dem Stilblatt: unten,
   mittig. Erst der erste Zug schreibt eine Stelle fest.
   ================================================================ */
const SELBAR_POS='bs_selbar_pos';
function selbarPosLesen(){
  try{ const p=JSON.parse(localStorage.getItem(SELBAR_POS)||'null');
    return (p && typeof p.x==='number' && typeof p.y==='number') ? p : null; }
  catch(e){ return null; }
}
/* Eine gemerkte Stelle kann falsch werden, ohne dass jemand etwas tut: Das
   iPad wird gedreht, das Fenster am Mac kleiner gezogen. Deshalb wird beim
   Anlegen IMMER eingepasst und nie blind gesetzt. */
function selbarEinpassen(x, y){
  const b=document.getElementById('selbar'); if(!b) return {x,y};
  const r=b.getBoundingClientRect(), luft=8;
  const maxX=Math.max(luft, innerWidth  - r.width  - luft);
  const maxY=Math.max(luft, innerHeight - r.height - luft);
  return { x:Math.min(Math.max(luft,x), maxX), y:Math.min(Math.max(luft,y), maxY) };
}
function selbarStellen(x, y, merken){
  const b=document.getElementById('selbar'); if(!b) return;
  const p=selbarEinpassen(x,y);
  b.style.left=p.x+'px'; b.style.top=p.y+'px';
  b.style.right='auto'; b.style.bottom='auto'; b.style.transform='none';
  if(merken){ try{ localStorage.setItem(SELBAR_POS, JSON.stringify(p)); }catch(e){} }
}
/* Beim Oeffnen die gemerkte Stelle wieder einnehmen. Wird gerufen, nachdem die
   Leiste sichtbar ist — vorher hat sie keine Masse, und das Einpassen rechnete
   mit null. */
function selbarPosAnwenden(){
  const p=selbarPosLesen(); if(!p) return;
  selbarStellen(p.x, p.y, false);
}
(function selbarZiehen(){
  const kopf=document.querySelector('.selbar-head'); if(!kopf) return;
  kopf.addEventListener('pointerdown', e=>{
    if(e.button!==undefined && e.button!==0) return;
    /* „Auswahl aufheben" und das Kreuz bleiben Knoepfe. */
    if(e.target.closest('button, .link')) return;
    const b=document.getElementById('selbar'); if(!b) return;
    e.preventDefault();
    const r=b.getBoundingClientRect();
    const dx=e.clientX-r.left, dy=e.clientY-r.top;
    document.body.dataset.selbarZieht='1';
    let letzte={x:r.left, y:r.top};
    const bewegen=ev=>{ letzte=selbarEinpassen(ev.clientX-dx, ev.clientY-dy);
      selbarStellen(letzte.x, letzte.y, false); };
    const loslassen=()=>{
      document.removeEventListener('pointermove', bewegen);
      document.removeEventListener('pointerup', loslassen);
      document.removeEventListener('pointercancel', loslassen);
      delete document.body.dataset.selbarZieht;
      selbarStellen(letzte.x, letzte.y, true);
    };
    document.addEventListener('pointermove', bewegen);
    document.addEventListener('pointerup', loslassen);
    document.addEventListener('pointercancel', loslassen);
  });
  /* Nach einer Drehung oder einer Groessenaenderung neu einpassen, damit die
     Leiste nicht halb ausserhalb steht. Gemerkt wird dabei nichts: Die Stelle,
     die Jens gewaehlt hat, soll beim Zurueckdrehen wieder gelten. */
  window.addEventListener('resize', ()=>{
    if(!document.getElementById('selbar').classList.contains('open')) return;
    const p=selbarPosLesen(); if(!p) return;
    selbarStellen(p.x, p.y, false);
  });
})();
document.getElementById('selClear').onclick=()=>{ S.selection.clear(); refreshSelUI(); };
function bulkSet(ref,add){ [...S.selection].forEach(k=> add?ref.add(k):ref.delete(k)); save(); render(); }
function bulkRemoveFromSet(){ const st=S.sets.find(s=>s.id===S.openSet); if(!st)return;
  st.items=st.items.filter(k=>!S.selection.has(k)); st.updatedAt=Date.now(); S.selection.clear(); save(); render(); }
function bulkDeleteNotes(){
  const notes=[...S.selection].map(k=>byKey[k]).filter(t=>t&&t.isEdit); if(!notes.length){ alert('Nur eigene handschriftliche Notizen können gelöscht werden.'); return; }
  if(!confirm(notes.length+' Notiz(en) endgültig löschen? Das lässt sich nicht rückgängig machen.')) return;
  notes.forEach(t=>{ try{ idbDeletePages(t.key); }catch(e){} USER=USER.filter(u=>u.key!==t.key);
