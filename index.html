        u.style.paddingLeft='34px';
        /* Ein Haken je Blatt — mehrere auf einmal loeschen ist der Grund,
           warum es ihn gibt. */
        const hk=document.createElement('button'); hk.className='hkbox';
        hk.setAttribute('role','checkbox'); hk.title='Für das Löschen auswählen';
        hk.innerHTML='<i class="i ic-check"></i>';
        const setzen=an=>{ if(an) bestandWahl.add(b.libId); else bestandWahl.delete(b.libId);
          u.setAttribute('aria-checked', an ? 'true':'false'); };
        u.setAttribute('aria-checked', bestandWahl.has(b.libId)?'true':'false');
        hk.onclick=()=>{ setzen(!bestandWahl.has(b.libId)); zeichne(); };
        u.querySelector('.lb').parentElement.style.cssText='flex:1;min-width:0';
        u.prepend(hk);

        if(bestandKomponist.has(b.libId)){
          const kf=document.createElement('input'); kf.className='txt'; kf.value=b.c||'';
          kf.placeholder='Komponist nur für dieses Blatt';
          kf.style.cssText='margin-top:6px;max-width:320px';
          kf.onchange=()=>saveLibMeta(b.libId,{composer:kf.value.trim()}).then(zeichne);
          u.querySelector('.lb').parentElement.append(kf);
        }
        u._ctl.append(
          knopf('Vorschau', ()=>blattVorschau(b)),
          knopf(bestandKomponist.has(b.libId)?'Komponist zu':'Komponist', ()=>{
            if(bestandKomponist.has(b.libId)) bestandKomponist.delete(b.libId);
            else bestandKomponist.add(b.libId);
            zeichne(); }),
          knopf('Sichern', ()=>exportLibTune(b.libId)));
        zeilen.push(u);
      });

      /* Die Zeile zum Loeschen steht erst da, wenn etwas angehakt ist. */
      const gewaehlt=ids.filter(id=>bestandWahl.has(id));
      if(gewaehlt.length){
        const g=zeile(gewaehlt.length+' '+blattWort(gewaehlt.length)+' gewählt',
                      'Ausgewählte Blätter dieses Stücks');
        g.style.paddingLeft='34px';
        g._ctl.append(
          knopf('Auswahl aufheben', ()=>{ gewaehlt.forEach(id=>bestandWahl.delete(id)); zeichne(); }),
          knopf('Löschen', async ()=>{
            const weg=await deleteLibTunes(gewaehlt);
            if(weg) gewaehlt.forEach(id=>bestandWahl.delete(id));
            zeichne();
          }, 'warn'));
        zeilen.push(g);
      }
    });
    return zeilen;
  }

  /* ================================================================
     Unterseite: ein Bandbuch importieren — Schritt 6 des Stimmen-Konzepts

     Die Vorschau ist keine Bequemlichkeit, sondern die Bedingung dafuer,
     dass die Sache benutzbar ist. Ohne sie entstehen aus hundertachtzig
     Dateien im Zweifel hundertachtzig Stuecke, und das Aufraeumen dauert
     laenger als das Zuordnen von Hand gedauert haette.
     ================================================================ */
  /* Ein Eintrag ist {file, pfad}. Der Pfad kommt aus `webkitRelativePath`
     (Ordnerauswahl) oder aus dem Durchlaufen der hineingezogenen Ordner.
     Ohne Pfad steht dort nur der Dateiname. */
  let bandBid='', bandTrenner=' - ', bandDateien=[], bandHand={}, bandTitelHand={};
  /* Die Ausgabe des Durchgangs — leer heisst „je Datei erkennen". Und die
     Handentscheidung je Stueck, ob es an ein vorhandenes andockt. */
  let bandAusgabe='', bandAndockHand={}, bandGlattAuf=false;
  /* Was die Ordnerebenen bedeuten, und wohin die Buecher gehen.
     `bandRollen` ist {1:'buch', 2:'stueck', …}; fehlende Ebenen gelten als
     „nichts". `bandBuchZiel` bildet einen Ordnernamen auf ein vorhandenes
     Buch ab; ein leerer Wert heisst „neues Buch dieses Namens". */
  let bandRollen={}, bandBuchZiel={};
  /* Welche Zweige der obersten Ebene in diesem Durchgang mitgehen. Leer heisst
     alle. Gebraucht fuer den gemischten Stapel: Liegen „Real Books" und
     „Bandnoten" nebeneinander, bedeutet Ebene 2 in dem einen Zweig etwas
     anderes als im anderen. Eine Rolle je Ebene kann das nicht ausdruecken —
     zwei Durchgaenge koennen es. */
  let bandZweige=new Set();
  /* Von Hand gesetzte Stimme je Ordner der Stimm-Ebene.

     Gemessen am 6. August an Jens' echten Ordnern: `realbook1_bb` ergibt
     „B♭", `realbook1_eb` ergibt „E♭", `realbook1_bass` ergibt „Bass" — aber
     `realbook1`, die C-Ausgabe, ergibt gar nichts. Der Name sagt es nicht,
     und was nicht darinsteht, kann keine Erkennung finden. Also wird auch
     hier gefragt statt geraten. */
  let bandStimmHand={};
  /* Woher der Stapel kam — der Name des Archivs oder des Ordners. Er ist der
     einzige Name, den ein Stapel ohne Buch-Ebene mitbringt, und steht deshalb
     als Vorschlag im Feld „Neues Buch". Vorbelegen ist kein Raten: Der
     Vorschlag ist sichtbar und laesst sich ueberschreiben. */
  let bandStapelName='';
  /* Die Ausgaben eines Buchs sind Stimmen, keine eigenen Buecher. Die Namen
     stimmen mit STIMM_ORDNUNG ueberein, damit die Reihenfolge in der Zeile
     dieselbe ist wie bei den frueher mitgelieferten Real Books. */
  const AUSGABEN=[{wert:'',text:'Je Datei erkennen',ton:'aus dem Dateinamen'},
                  {wert:'C',text:'C-Ausgabe',ton:'Klavier, Gitarre, Flöte'},
                  {wert:'B♭',text:'B♭-Ausgabe',ton:'Tenor-Sax, Trompete, Klarinette'},
                  {wert:'E♭',text:'E♭-Ausgabe',ton:'Alt-Sax, Bariton-Sax'},
                  {wert:'Bass',text:'Bass-Ausgabe',ton:'Bassschlüssel'}];
  /* Welche Stuecke ihre Saetze zeigen. Voreingestellt keines. */
  const bandOffen=new Set();
  function bandZustand(){ bandDateien=[]; bandHand={}; bandTitelHand={}; bandTrenner=' - ';
    bandAusgabe=''; bandAndockHand={}; bandGlattAuf=false;
    bandRollen={}; bandBuchZiel={}; bandStapelName=''; bandZweige=new Set(); bandStimmHand={};
    bandOffen.clear(); bandLetzte=null;
    /* Offene Fenster zeigen sonst Blaetter, die es nicht mehr gibt. */
    if(window.PDFW) PDFW.alleZu();
    bandBid = USERBOOKS.length===1 ? USERBOOKS[0].bid : ''; }

  /* Das zuletzt Gelesene. Es ist die Wahrheit fuer die Fenster: Welche Stimme
     eine Datei traegt, steht hier und nicht im Fenster. */
  let bandLetzte=null;
  function bandEintrag(kennung){
    if(!bandLetzte) return null;
    return bandLetzte.saetze.find(x=>x.kennung===kennung)
        || bandLetzte.offen.find(x=>x.kennung===kennung)
        || bandLetzte.ausgelassen.find(x=>x.kennung===kennung) || null;
  }
  /* Woraus die Stimmen-Wahl ihren Zustand zieht — einmal geschrieben, von der
     Zeile in der Vorschau UND vom Fenster benutzt. */
  function wahlQuelle(kennung){
    return ()=>{
      const e=bandEintrag(kennung);
      const hand=(e&&e.hand)||'';
      const auto=(e&&e.auto)||'';
      const eintraege=stimmenAuswahl(auto);
      const jetzt=eintraege.find(x=>x.wert===hand) || eintraege[0];
      return { wert:hand, eintraege,
               text: hand ? jetzt.text : 'Automatisch',
               ton:  hand ? jetzt.ton  : (auto || 'nichts erkannt') };
    };
  }
  function wahlSetzen(kennung){
    return neu=>{
      if(neu) bandHand[kennung]=neu; else delete bandHand[kennung];
      zeichneVorschau();
    };
  }
  function stimmenWahl(kennung){
    return AWAHL.knopf(wahlQuelle(kennung), wahlSetzen(kennung), 'Stimme festlegen');
  }

  /* Ein Blick ins Blatt, bevor irgendetwas geschrieben wird. Das Fenster
     schwebt ueber der Vorschau und bleibt offen, waehrend man den naechsten
     Satz aufmacht — deshalb kein Dialog mit Schleier. Beliebig viele
     gleichzeitig: „Alt 1" und „Alt 2" nebeneinander ist genau der Fall,
     fuer den es gebaut ist. */
  function vorschauKnopf(eintrag){
    /* Kommt der Satz aus einem Archiv, liegen seine Bytes noch darin und
       werden erst hier ausgepackt — fuer dieses eine Blatt. Siehe
       `zipAlsOrdner`: Die Vorschau soll nicht 28 MB im Speicher halten,
       damit man vielleicht eines davon ansieht. */
    const b=knopf('Vorschau', async ()=>{
      let datei=eintrag.file;
      if(datei && typeof datei.hole==='function'){
        try{ datei=await datei.hole(); }
        catch(e){ alert('Diese Datei liess sich nicht aus dem Archiv holen.'); return; }
      }
      window.pdfVorschau({
        kennung: eintrag.kennung,
        datei,
        name:    eintrag.name,
        unter:   eintrag.titel || '',
        wahl:  { hole: wahlQuelle(eintrag.kennung), aufWahl: wahlSetzen(eintrag.kennung) }
      });
    });
    b.title='Das Blatt ansehen';
    return b;
  }

  const AUDIO_ENDUNG=/\.(mp3|m4a|wav|aac|aif|aiff)$/i;
  const PDF_ENDUNG=/\.pdf$/i;

  /* ================================================================
     Was eine Ordnerebene bedeutet — gesagt, nicht geraten

     Bis zum 5. August rechnete hier `stammKuerzen`: Der gemeinsame Stamm
     fiel weg, und der Ordner ueber einer Datei galt als das Stueck. Fuer
     Bandnoten stimmt das. Fuer ein Real Book ist es falsch, und zwar so
     falsch, dass aus einem Buch mit vierhundert Titeln ein Titel mit
     vierhundert Blaettern wurde. Genau das ist Jens am 3. August passiert.

     Der Grund laesst sich nicht wegprogrammieren. Beide Bestaende sind eine
     Ordnerebene tief; in dem einen ist ein Ordner ein Stueck, in dem anderen
     ein Buch. Dieselbe Form, entgegengesetzte Bedeutung — kein Verfahren kann
     das aus den Dateien ablesen, weil die Information nicht darin steht.

     Deshalb wird gefragt. Je Ordnerebene eine Rolle, und die Ebenen werden von
     OBEN gezaehlt. Von oben und nicht von unten, weil ein Zweig tiefer sein
     kann als sein Nachbar: In Jens' Bestand liegen zehn von 460 Blaettern in
     einer Zwischenebene ohne Bedeutung. Zaehlt man von oben, tragen sie
     denselben Stuecknamen wie ihre Nachbarn, ohne dass eine Sonderregel
     noetig waere.

     Der gemeinsame Stamm wird NICHT abgeschnitten. Bei einem gewaehlten
     Ordner ist er haeufig genau das Buch; wegzuschneiden hiesse, ihn zu
     verlieren.                                                              */
  const ROLLEN=[
    {wert:'nichts', text:'bedeutet nichts', ton:'wird übersprungen'},
    {wert:'buch',   text:'ist ein Buch',    ton:'sein Name wird der Buchname'},
    {wert:'stueck', text:'ist ein Stück',   ton:'sein Name wird der Titel'},
    {wert:'stimme', text:'ist eine Stimme', ton:'sein Name wird die Stimme aller Blätter darin'},
  ];
  const ROLL_TEXT = w => (ROLLEN.find(r=>r.wert===w)||ROLLEN[0]).text;

  /* Die Ordnerebenen eines Stapels: wie viele es gibt, wie viele verschiedene
     Ordner je Ebene, und ein paar Namen als Beleg. Ebene 1 ist die oberste. */
  function ebenenLesen(eintraege){
    const ebenen=[];
    (eintraege||[]).forEach(e=>{
      const teile=String(e.pfad||e.file&&e.file.name||'').split('/').filter(Boolean);
      teile.pop();                              /* der Dateiname zaehlt nicht */
      teile.forEach((ordner,i)=>{
        if(!ebenen[i]) ebenen[i]={ nr:i+1, namen:new Set(), dateien:0 };
        ebenen[i].namen.add(ordner); ebenen[i].dateien++;
      });
    });
    return ebenen.map(e=>({ nr:e.nr, anzahl:e.namen.size, dateien:e.dateien,
                            namen:[...e.namen], beispiele:[...e.namen].slice(0,3) }));
  }

  /* Was eine einzelne Datei nach den gesetzten Rollen wird. Liegt sie flacher
     als die Stueck-Ebene, faellt der Titel auf den Dateinamen zurueck — so
     bleiben ungleich tiefe Zweige benutzbar. */
  function dateiLesen(pfad, rollen){
    const teile=String(pfad||'').split('/').filter(Boolean);
    const datei=teile.pop()||'';
    let buch='', stueck=null, stimme='';
    teile.forEach((name,i)=>{
      const rolle=(rollen||{})[i+1]||'nichts';
      if(rolle==='buch')   buch=name;
      if(rolle==='stueck') stueck=name;
      if(rolle==='stimme') stimme=name;
    });
    return { datei, buch, stueck, stimme };
  }

  /* Ordnernamen tragen gelegentlich einen Zusatz, der die Fassung beschreibt
     und nicht das Stueck: „Afro Blue NEU". Er faellt weg; was gesaeubert
     wurde, steht in der Vorschau und laesst sich dort ueberschreiben.
     Bewusst kurz gehalten — jedes Wort mehr riskiert einen echten Titel. */
  const TITEL_ZUSATZ=/[\s_\-–—]+(neu|new|kopie|copy|final)\s*\d*$/i;
  function titelSaeubern(s){
    let t=String(s||'').trim();
    for(let i=0;i<3;i++){ const k=t.replace(TITEL_ZUSATZ,'').trim(); if(k===t||!k) break; t=k; }
    return t||String(s||'').trim();
  }

  /* Was vom Dateinamen bleibt, wenn der Titel vorn abgeschnitten ist.
     Grosszuegig verglichen: ohne Ruecksicht auf Gross- und Kleinschreibung,
     Umlaute und Satzzeichen. Steht der Titel nicht vorn, bleibt der ganze
     Name stehen — dann traegt er die Stimme irgendwo in sich. */

  /* Was aus den gewaehlten Dateien wird — gerechnet, nicht gespeichert. */
  /* Die Stimme aus einem Ordnernamen. Dieselbe Kette wie beim Dateinamen:
     erst die Ausgabe (C, B♭, E♭, Bass), dann das Instrument. Findet keine
     etwas, bleibt der Name stehen.

     Gemessen am 6. August an den vier echten Ausgaben von Real Book Vol. 1:
     „Real Book Vol 1 Bb" ergibt „B♭", nicht den ganzen Ordnernamen. */
  const _ordnerStimme={};
  /* Was ein Ordner an Stimme hergibt — von Hand gesetzt schlaegt erkannt. */
  function ordnerStimmeJetzt(name){
    if(!name) return '';
    if(bandStimmHand[name]!==undefined) return bandStimmHand[name];
    return ordnerStimme(name);
  }
  /* Die Stimme eines Ordners von Hand setzen. EINE Stelle, die der Knopf in
     der Vorschau und die Prueflatte gemeinsam rufen.
     Vorher hatte jeder seinen eigenen Weg, und sie liefen auseinander: Die
     Prueflatte vergass `bandAndockHand` zu leeren, und damit blieb das von
     Hand gewaehlte Andocken stehen, waehrend sich die Stimme darunter aenderte.
     Genau die Falle aus CLAUDE.md — der Pruefstand ging nicht den Weg, den der
     Nutzer geht. Am 7. August zusammengelegt. */
  function stimmVonHand(ordner, wert){
    if(!ordner) return '';
    if(wert) bandStimmHand[ordner]=wert; else delete bandStimmHand[ordner];
    bandAndockHand={};
    zeichne();
    return ordnerStimmeJetzt(ordner);
  }
  function ordnerStimme(name){
    if(!name) return '';
    if(name in _ordnerStimme) return _ordnerStimme[name];
    /* Zuerst die Ausgaben, und zwar am ENDE des Namens. Ein Ordner, den der
       Nutzer ausdruecklich als Stimme benannt hat, meint bei einem Real Book
       fast immer die Ausgabe — „Real Book Vol 1 Bass" ist die
       Bassschluessel-Ausgabe und nicht der E-Bass. `ausgabeAusText` allein
       reicht dafuer nicht: Es kennt C, B♭ und E♭, aber nicht „Bass".

       Beim DATEInamen gilt die umgekehrte Reihenfolge, und das bleibt so:
       „Mardi Gras Flöte in C" ist eine Floete und keine C-Ausgabe. Der
       Unterschied ist die Absicht — hier hat jemand die Ebene benannt. */
    const ende=String(name).trim().toLowerCase();
    /* Trennzeichen vor der Ausgabe: Leerzeichen, Unterstrich, Bindestrich,
       Punkt. Der Unterstrich ist der wichtige — Jens' echte Ordner heissen
       `realbook1_bb` und `realbook1_bass`. */
    const passt = w => ende===w || /[ _\-.]/.test(ende.slice(-w.length-1,-w.length))
                                    && ende.endsWith(w);
    const treffer=AUSGABEN.filter(a=>a.wert).find(a=>{
      const roh=a.wert.toLowerCase();
      return passt(roh) || passt(roh.replace('♭','b'));   /* „B♭" auch als „Bb" */
    });
    const w = (treffer && treffer.wert)
           || ausgabeAusText(name)
           || ((voiceAusText(name)||{}).name)
           || blattArt(name)
           || name;
    _ordnerStimme[name]=w;
    return w;
  }

  /* Die Dateien dieses Durchgangs — alle, oder nur die angehakten Zweige. */
  function bandStapel(){
    if(!bandZweige.size) return bandDateien;
    return bandDateien.filter(e=>{
      const t=String(e.pfad||e.file.name).split('/').filter(Boolean);
      t.pop();
      return bandZweige.has(t[0]||'');
    });
  }
  function bandLesen(){
    const saetze=[], offen=[], toene=[], uebergangen=[], ausgelassen=[];
    const stuecke=new Map();
    bandStapel().forEach(e=>{
      const pfad=String(e.pfad||e.file.name);
      const gelesen=dateiLesen(pfad, bandRollen);
      const name=gelesen.datei||e.file.name;
      /* Traegt keine Ebene die Rolle „Stueck", steht der Titel im Dateinamen.
         Zuerst das Trennzeichen versuchen; traegt der Name keines, die Stelle
         suchen, an der die Stimme anfaengt. Das ist der Weg auf dem iPad, wo
         es keine Ordnerwahl gibt. */
      const ausOrdner = gelesen.stueck!==null;
      let zerlegt=null;
      if(!ausOrdner){
        zerlegt=nameZerlegen(name, bandTrenner);
        if(zerlegt.rest){
          /* Manche Saetze tragen die Stimme VORN: „Alto 1 - Blue Trane
             Konzert". Dann sind Titel und Rest vertauscht — erkennbar daran,
             dass der vordere Teil eine Stimme ist und der hintere keine. */
          if(stimmeAmAnfang(zerlegt.titel) && !stimmeAmAnfang(zerlegt.rest))
            zerlegt={ titel:zerlegt.rest, rest:zerlegt.titel };
        } else {
          const t=titelVorStimme(name); if(t) zerlegt=t;
        }
      }
      const roh = ausOrdner ? gelesen.stueck : zerlegt.titel;
      /* Der Schluessel traegt das BUCH mit. Zwei Buecher duerfen ein Stueck
         desselben Namens haben, ohne dass die Vorschau sie zusammenwirft. */
      const schl = (gelesen.buch ? 'b:'+titelSchluessel(gelesen.buch)+'|' : '')
                 + titelSchluessel(roh);
      if(!stuecke.has(schl)) stuecke.set(schl,
        { schl, roh, titel:titelSaeubern(roh), ausOrdner,
          buchName:gelesen.buch||'', saetze:[], toene:[] });
      const st=stuecke.get(schl);
      const titel = bandTitelHand[schl]!==undefined ? bandTitelHand[schl] : st.titel;
      st.titel=titel;

      if(AUDIO_ENDUNG.test(name)){ const x={file:e.file, pfad:e.pfad, titel, name};
        toene.push(x); st.toene.push(x); return; }
      if(!PDF_ENDUNG.test(name) && !/pdf$/i.test(e.file.type||'')
         && !istLeadsheet(name, e.file.type)){
        uebergangen.push({file:e.file, pfad:e.pfad, name, grund:'weder Noten noch Ton'}); return; }

      const kennung = e.pfad || name;
      const rest = ausOrdner ? restNachTitel(name, roh) : zerlegt.rest;
      /* Erst das Blatt, dann das Instrument — die Reihenfolge ist die gleiche
         wie in blattArt begruendet.

         Was die App VON SELBST erkennt, wird immer gerechnet, auch wenn von
         Hand etwas anderes gesetzt ist. Nur so kann die Wahl im Dropdown
         sagen, worauf „Automatisch erkennen" hinausliefe. */
      /* Reihenfolge: Blattart, dann Instrument, dann die nackte Tonart. Die
         Tonart zuletzt, weil „Mardi Gras Flöte in C" eine Flöte ist und keine
         C-Ausgabe. */
      const auto = blattArt(rest) || ((voiceAusText(rest)||{}).name) || ausgabeAusText(rest) || '';
      const hand = bandHand[kennung] || '';
      /* Ist eine Ausgabe angesagt, gilt sie fuer den ganzen Durchgang und
         schlaegt die Erkennung aus dem Dateinamen. Ein Real Book traegt seine
         Ausgabe nicht im Dateinamen — sie steht auf dem Umschlag, und der
         kommt beim Import nicht mit. Deshalb wird sie gesagt und nicht
         geraten. Eine Handwahl am einzelnen Blatt geht trotzdem vor.

         Seit dem 5. August kann auch ein ORDNER die Stimme tragen. Dann gilt
         sie nur fuer die Blaetter darin und schlaegt die Ansage fuer den
         ganzen Durchgang. Damit gehen die vier Ausgaben eines Real Books in
         EINEM Durchgang herein statt in vieren.

         Der Ordnername wird dabei NICHT roh uebernommen. Er heisst in der
         Praxis „Real Book Vol 1 Bb" und nicht „B♭"; roh genommen stuende
         genau das auf dem Schalter, und die Stimme waere unbrauchbar. Er
         laeuft deshalb durch dieselbe Erkennung wie der Rest eines
         Dateinamens. Erst wenn die nichts findet, gilt der Name selbst — dann
         hat der Nutzer ihn vermutlich mit Absicht so gewaehlt. */
      const ausg = ordnerStimmeJetzt(gelesen.stimme) || bandAusgabe || '';
      /* `gruppe` ist die Kennung des Stuecks aus dieser Vorschau. Der Import
         buendelt danach — nicht nach dem Titeltext. Zwei Ordner desselben
         Namens bleiben dadurch zwei Stuecke und verschmelzen nicht. */
      const eintrag={file:e.file, pfad:e.pfad, name, kennung, titel, rest, auto, hand,
                     gruppe: schl, ausgabe: ausg,
                     voice: hand && hand!=='-' ? hand : (ausg || auto)};
      if(hand==='-'){ ausgelassen.push(eintrag); return; }
      /* Unerkanntes haelt den Import nicht mehr auf. Es bekommt „Not Assigned"
         und geht mit; in `offen` steht es weiterhin, damit die Vorschau danach
         fragen kann und damit man es vorher klaeren KANN, ohne es zu MUESSEN.
         Am 31. Juli nach der ersten Probe so von Jens verlangt. */
      if(!eintrag.voice){ eintrag.voice=OHNE_STIMME; eintrag.offen=true; offen.push(eintrag); }
      saetze.push(eintrag);
      st.saetze.push(eintrag);
    });
    const liste=[...stuecke.values()].filter(x=>x.saetze.length || x.toene.length);

    /* ---- Wohin jedes Stueck geht ---------------------------------------
       Traegt eine Ebene die Rolle „Buch", hat jedes Stueck sein eigenes Ziel,
       und es koennen mehrere Buecher zugleich entstehen. Sonst gilt das oben
       gewaehlte eine Buch, wie bisher. */
    liste.forEach(st=>{ st.zielBid = zielBuchVon(st.buchName); });

    /* ---- Was im Zielbuch schon steht -----------------------------------
       Gesucht wird nur im jeweiligen Zielbuch und nur nach dem eingedampften
       Titel. Gefunden heisst NICHT zusammengefuehrt: Es heisst, dass die
       Vorschau danach fragt. Entschieden wird oben, nicht hier.

       Der Katalog je Buch wird einmal gerechnet und dann wiederverwendet. Bei
       vierhundert Stuecken in einem Durchgang ist das der Unterschied zwischen
       einer Rechnung und vierhundert. */
    let treffer=0;
    const katalogJeBuch=new Map();
    const imBuchVon=bid=>{
      if(!bid) return null;
      if(katalogJeBuch.has(bid)) return katalogJeBuch.get(bid);
      const imBuch={};
      const elJeTitel={};
      (BS_KATALOG.elemente||[]).forEach(e=>{ elJeTitel[e.titelId]=(elJeTitel[e.titelId]||0)+1; });
      (BS_KATALOG.titel||[]).filter(t=>t.buchId===bid).forEach(t=>{
        const k=titelSchluessel(t.titel||'');
        if(!(k in imBuch)) imBuch[k]={id:t.id, titel:t.titel, blaetter:elJeTitel[t.id]||0};
      });
      katalogJeBuch.set(bid, imBuch);
      return imBuch;
    };
    liste.forEach(st=>{
      const imBuch=imBuchVon(st.zielBid);
      st.vorhanden = imBuch ? (imBuch[titelSchluessel(st.titel||'')] || null) : null;
      if(st.vorhanden) treffer++;
      /* Andocken ist die Vorgabe, wenn eine Ausgabe angesagt ist oder ein
         Ordner die Stimme traegt — genau dann laedt jemand eine zweite
         Fassung desselben Buchs nach. Sonst ist die Vorgabe „eigenes Stueck".
         Beides je Stueck ueberschreibbar. */
      const vorgabe = !!bandAusgabe || rollenHaben('stimme');
      st.andocken = st.vorhanden
        ? (bandAndockHand[st.schl]!==undefined ? bandAndockHand[st.schl] : vorgabe)
        : false;
      if(st.andocken && st.vorhanden) st.saetze.forEach(s=>{ s.andockAn=st.vorhanden.id; });
      else                            st.saetze.forEach(s=>{ delete s.andockAn; });
    });

    /* ---- Die Etiketten, jetzt und nicht erst beim Schreiben -------------
       Erst hier, weil die Rechnung wissen muss, ob angedockt wird: Beim
       Andocken zaehlen die Blaetter mit, die am Stueck schon haengen. Danach
       wird geordnet — nach Instrument, dann nach Etikett, sonst stehen
       „Alt 2" und „Alt 1" in der Reihenfolge der Dateien. */
    liste.forEach(st=>{
      const vorEl = (st.andocken && st.vorhanden)
        ? (BS_KATALOG.elemente||[]).filter(e=>e.titelId===st.vorhanden.id) : [];
      /* Objekte statt blosser Instrumentennamen — nur so kann die Rechnung ein
         vorhandenes Etikett glattziehen. Den Rest des Dateinamens gewinnt
         `restNachTitel` aus dem gespeicherten Namen zurueck; anders waere
         nicht zu erfahren, dass aus „Alt-Sax" „Alt 1" werden soll und nicht
         „Alt-Sax 1". */
      const vorhandene = vorEl.map(e=>({ instrument:e.instrument||'', etikett:e.etikett||'',
        rest: restNachTitel(e.dateiname||'', (st.vorhanden&&st.vorhanden.titel)||'') }));
      const paare=st.saetze.map(s=>({instrument:s.voice||'', rest:s.rest||''}));
      etikettenBerechnen(paare, vorhandene);
      st.saetze.forEach((s,i)=>{ s.etikett=paare[i].etikett; s.instrument=s.voice||''; });
      st.saetze.sort(nachStimmeOrdnen);
      /* Was an vorhandenen Blaettern angepasst WUERDE. Die Vorschau zeigt es;
         geschrieben wird es erst beim Import. */
      st.glatt = vorhandene
        .map((v,i)=>({ id:vorEl[i].id, alt:vorEl[i].etikett||'', neu:v.etikett }))
        .filter(g=>g.neu!==g.alt);

      /* Kommt ein Blatt herein, das unter demselben Dateinamen schon am Titel
         haengt, entsteht ein zweites daneben. Bei einem BandStand-Paket kann
         das nicht passieren — dort fuehren die Kennungen. Ein nackter Ordner
         hat keine, also ist der Dateiname das einzige Merkmal.

         Am 6. August gemessen: Dasselbe Archiv zweimal eingelesen ergab 240
         statt 120 Blaetter. Das ist nicht falsch, sondern die einzige
         Auslegung, die ohne Kennungen moeglich ist — aber es muss vorher
         dastehen, sonst haelt man es fuer einen Fehler. */
      const daNamen=new Set(vorEl.map(e=>(e.dateiname||'').toLowerCase()));
      st.doppelt = daNamen.size
        ? st.saetze.filter(s=>daNamen.has((s.file.name||'').toLowerCase())).length
        : 0;
    });

    /* Die Buecher dieses Durchgangs, in der Reihenfolge ihres Auftretens.
       Je Buch: der Ordnername, das Ziel und wie viel hineingeht. */
    const buecher=new Map();
    liste.forEach(st=>{
      const k=st.buchName||'';
      if(!buecher.has(k)) buecher.set(k, {name:k, zielBid:st.zielBid, stuecke:0, saetze:0});
      const b=buecher.get(k); b.stuecke++; b.saetze+=st.saetze.length;
    });

    return { saetze, offen, toene, uebergangen, ausgelassen, stuecke:liste, treffer,
             buecher:[...buecher.values()],
             ebenen: ebenenLesen(bandStapel()),
             hatBuchEbene: rollenHaben('buch'),
             ordnerWeg: rollenHaben('stueck') };
  }

  /* Welches Buch ein Ordnername ansteuert. Leerer Rueckgabewert heisst: ein
     neues Buch dieses Namens, angelegt erst beim Schreiben. Ohne Buch-Ebene
     gilt das oben gewaehlte eine Buch. */
  function zielBuchVon(buchName){
    if(!buchName) return bandBid||'';
    if(bandBuchZiel[buchName]!==undefined) return bandBuchZiel[buchName];
    const da=USERBOOKS.find(b=>b.name===buchName);
    return da ? da.bid : '';
  }
  const rollenHaben = rolle => Object.keys(bandRollen||{})
    .some(k=>bandRollen[k]===rolle);

  /* Was über „Dateien wählen" hereinkommt, ist entweder ein Archiv oder ein
     Stapel loser Blätter. Der Knopf bietet seit dem 7. August alles an, also
     muss er hier selbst sortieren — vorher tat es der `accept`-Filter, und
     genau der sperrte das Archiv aus.

     Beides zugleich ergibt keinen brauchbaren Stapel. Das Archiv bringt eine
     Ordnerstruktur mit, die losen Dateien haben keine, und `zipAlsOrdner`
     setzt den Zustand ohnehin zurück — die losen Dateien wären danach weg.
     Deshalb gewinnt das Archiv, und was liegen bleibt, wird genannt statt
     still verworfen. */
  function notenAnnehmen(dateien){
    const liste=(dateien||[]).filter(Boolean);
    if(!liste.length) return;
    const istZip = f => /\.zip$/i.test(f.name||'') || /zip/i.test(f.type||'');
    const zips=liste.filter(istZip);
    const rest=liste.filter(f=>!istZip(f));
    if(!zips.length){ bandUebernehmen(liste.map(f=>({file:f, pfad:f.name}))); return; }
    if(zips.length>1 || rest.length)
      alert('Es wird nur „'+(zips[0].name||'das Archiv')+'" gelesen.\n\n'
        +'Ein Archiv bringt seine Ordner mit; alles daneben würde den Stapel '
        +'verfälschen. Hol den Rest danach in einem zweiten Durchgang.');
    /* Dasselbe `importPackage` wie beim Empfang: Findet es einen Katalog, ist
       es ein BandStand-Paket; findet es keinen, geht das Archiv als Ordner in
       dieselbe Vorschau. Ein Weg herein, wie das Konzept vom 5. August will. */
    importPackage(zips[0]);
  }

  /* ---- Die Bausteine des Imports -----------------------------------------
     Seit dem 7. August gibt es zwei Rahmen für dieselben Fragen: die
     Import-Seite und den Assistenten. Damit sie nie auseinanderlaufen, liegen
     die Zeilen HIER und werden von beiden geholt. Dieselbe Lehre wie bei
     `stimmVonHand`: Zwei Wege zu einer Sache sind einer zu viel. */

  /* Baustein 1 — woher die Noten kommen. */
  function assiZeilenNoten(){
    const z_dat=zeile('Noten',
      bandDateien.length ? ('<b>'+bandDateien.length+'</b> Datei'+(bandDateien.length===1?'':'en')+' gelesen')
      : IST_IOS ? 'Auf dem iPad geht nur <b>Dateien wählen</b> — Safari kann hier keine Ordner auswählen. '
                 +'Ein gepacktes Archiv bringt die Ordner trotzdem mit.'
                : 'Ein ganzer Ordner, einzelne Dateien oder ein gepacktes Archiv.');
    /* Auf dem iPad steht die Dateiwahl vorn: Sie ist dort der einzige Weg, der
       traegt. Der Ordner-Knopf bleibt trotzdem stehen — er sagt, wenn nichts
       zurueckkam, statt zu schweigen. */
    /* Auf dem iPad heisst der Knopf weiter „Ordner wählen": „Anderen Ordner"
       hätte behauptet, es wäre schon einer im Spiel. Dort ist aber die
       Dateiwahl der Weg, und die trägt ihren eigenen Namen. */
    const kOrdner=knopf((bandDateien.length && !IST_IOS) ? 'Anderen Ordner' : 'Ordner wählen',
                        ()=>ordnerWaehlen());
    /* OHNE accept-Filter, wie der Empfangs-Knopf seit dem 2. August.
       Hier stand `'application/pdf,.pdf,audio/*'`, und damit war ein ZIP im
       Dateien-Dialog des iPads grau. Der Text der Zeile darüber verspricht
       auf iOS ausdrücklich, dass ein gepacktes Archiv die Ordner mitbringt —
       der Filter verbot genau das. Jens ist am 7. August daran gescheitert.
       Auf iOS greifen `accept`-Angaben ohnehin nicht zuverlässig. Lieber
       alles anbieten und hinterher sagen, was nicht ging. */
    const kDatei=knopf('Dateien wählen',
        ()=>dateiWaehlen(fs=>notenAnnehmen([...fs]), '', true));
    if(IST_IOS) z_dat._ctl.append(kDatei, kOrdner);
    else        z_dat._ctl.append(kOrdner, kDatei);
    const z_zieh=zeile('Hineinziehen','Ordner, Dateien oder ein Archiv auf diese Seite ziehen');
    return [z_dat, z_zieh];
  }

  /* Baustein 2 — die Zweige eines gemischten Stapels. Leer, wo es nichts zu
     teilen gibt. */
  function assiZeilenZweige(){
    const alleEbenen=ebenenLesen(bandDateien);
    const zeilen=[];
    if(bandDateien.length && alleEbenen.length){

      /* Der gemischte Stapel. Liegen oben mehrere Ordner und darunter noch
         eine Ebene, koennen die Zweige Verschiedenes bedeuten — „Real Books"
         flach und „Bandnoten" tief. Eine Rolle je Ebene kann das nicht
         ausdruecken. Dann laesst sich der Stapel aufteilen und in zwei
         Durchgaengen hereinholen. Die Zeile steht nur da, wo sie zaehlt. */
      if(alleEbenen.length>1 && alleEbenen[0].anzahl>1){
        const z_zw=zeile('Nur diese Zweige', bandZweige.size
          ? '<b>'+bandZweige.size+'</b> von '+alleEbenen[0].anzahl+' — der Rest bleibt liegen '
            +'und lässt sich danach mit anderen Ebenen holen'
          : 'Alle '+alleEbenen[0].anzahl+' Zweige gehen mit. Bedeuten sie Verschiedenes, '
            +'nimm sie einzeln und wiederhole den Durchgang');
        const wrap=document.createElement('div'); wrap.className='row'; wrap.style.flexWrap='wrap';
        alleEbenen[0].namen.forEach(n=>{
          const an = !bandZweige.size || bandZweige.has(n);
          const c=document.createElement('div');
          c.className='chip'+(an && bandZweige.size ? ' on' : '');
          c.setAttribute('role','checkbox'); c.setAttribute('aria-checked', an?'true':'false');
          c.tabIndex=0;
          c.textContent=(bandZweige.has(n)?'✓ ':'')+n;
          const um=()=>{
            if(!bandZweige.size){ /* aus „alle" wird „nur dieser" */
              bandZweige=new Set([n]);
            } else if(bandZweige.has(n)){
              bandZweige.delete(n);
              if(!bandZweige.size) bandZweige=new Set();   /* zurueck zu allen */
            } else bandZweige.add(n);
            bandAndockHand={}; bandBuchZiel={}; zeichne();
          };
          c.onclick=um;
          c.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); um(); } };
          wrap.append(c);
        });
        z_zw._ctl.append(wrap);
        zeilen.push(z_zw);
      }
      /* Solange keine Ebene eine Rolle traegt, ist jede Datei ein Stueck und
         alles geht in ein Buch. Das ist eine gesetzte Annahme, keine erkannte
         — und die Karte sagt das, statt ein Ergebnis zu behaupten. */
      const nichtsGesetzt = !Object.keys(bandRollen).length;
      const kopf=zeile('Was die Ordner bedeuten', nichtsGesetzt
        ? 'Noch nichts festgelegt. So wie es jetzt steht, ist <b>jede Datei ein Stück</b> '
          +'und alles geht in ein Buch. Stimmt das nicht, stell die Ebenen um.'
        : 'Die Zahlen in der Vorschau rechnen sich bei jeder Änderung sofort neu.');
      if(nichtsGesetzt) kopf.classList.add('warnrow');
      zeilen.push(kopf);
    }
    return zeilen;
  }

  /* Baustein 3 — welche Rolle jede Ordnerebene trägt. Die Frage, an der alles
     hängt: Dieselbe Ordnerform bedeutet bei Bandnoten ein Stück und bei Real
     Books ein Buch, und das steht in den Dateien nicht drin. */
  function assiZeilenRollen(){
    const ebenen=ebenenLesen(bandStapel());
    const zeilen=[];
    {
      ebenen.forEach(eb=>{
        const jetzt=bandRollen[eb.nr]||'nichts';
        const bsp=eb.beispiele.map(esc).join(' · ')
                + (eb.anzahl>eb.beispiele.length ? ' …' : '');
        const z=zeile('Ebene '+eb.nr,
          '<b>'+eb.anzahl+'</b> Ordner mit zusammen <b>'+eb.dateien+'</b> Dateien'
          +'<br><span class="muted">'+bsp+'</span>');
        z._ctl.append(AWAHL.knopf(()=>{
          const jetztR=ROLLEN.find(r=>r.wert===jetzt)||ROLLEN[0];
          return { wert:jetzt, eintraege:ROLLEN, text:jetztR.text, ton:jetztR.ton };
        }, neu=>{
          if(neu==='nichts') delete bandRollen[eb.nr]; else bandRollen[eb.nr]=neu;
          /* Zwei Ebenen duerfen nicht dieselbe Rolle tragen — „zwei Buecher
             uebereinander" hiesse raten, welches gilt. Die aeltere weicht. */
          if(neu!=='nichts') Object.keys(bandRollen).forEach(k=>{
            if(+k!==eb.nr && bandRollen[k]===neu) delete bandRollen[k]; });
          bandAndockHand={}; bandBuchZiel={}; bandStimmHand={}; zeichne();
        }, 'Was bedeutet Ebene '+eb.nr+'?'));
        zeilen.push(z);

      });
    }
    return zeilen;
  }

  /* Baustein 4 — welche Stimme aus welchem Ordner wird. Nur dort, wo eine
     Ebene die Rolle „Stimme" trägt.
     Erkennen allein reicht nicht: Ein Ordner namens „realbook1" ist die
     C-Ausgabe, und das steht in seinem Namen nirgends. Was nicht erkannt
     wurde, ist markiert und wird zur Eingabe aufgefordert, statt still als
     Stimme durchzugehen. */
  function assiZeilenStimmen(){
    const ebenen=ebenenLesen(bandStapel());
    const zeilen=[];
    ebenen.forEach(eb=>{
      const jetzt=bandRollen[eb.nr]||'nichts';
      {
        if(jetzt==='stimme') eb.namen.forEach(n=>{
          const erkannt=ordnerStimme(n);
          const wert=ordnerStimmeJetzt(n);
          const trifft = wert!==n;             /* etwas Sinnvolles gefunden? */
          const zs=zeile('', trifft
            ? 'wird die Stimme <b>'+esc(anzeigeStimme(wert))+'</b>'
            : '<b>nicht erkannt</b> — so bliebe der ganze Ordnername als Stimme stehen. '
              +'Sag, welche es ist.');
          zs.querySelector('.lb').innerHTML='<span class="muted">'+esc(n)+'</span>';
          if(!trifft) zs.classList.add('warnrow');
          zs._ctl.append(AWAHL.knopf(()=>{
            const eintraege=[{wert:'', text: erkannt!==n ? 'Wie erkannt' : 'Nicht erkannt',
                              ton: erkannt!==n ? anzeigeStimme(erkannt) : 'der Ordnername bliebe stehen'}]
              .concat(AUSGABEN.filter(a=>a.wert).map((a,i)=>({ wert:a.wert,
                       text:a.text, ton:a.ton, kopf: i===0 ? 'Ausgaben' : null })))
              .concat(stimmenAuswahl(erkannt).filter(x=>x.wert && x.wert!=='-'));
            const jz=eintraege.find(x=>x.wert===(bandStimmHand[n]||'')) || eintraege[0];
            return { wert:bandStimmHand[n]||'', eintraege, text:jz.text, ton:jz.ton };
          }, neu=>stimmVonHand(n, neu), 'Welche Stimme ist „'+n+'"?'));
          zeilen.push(zs);
        });
      }
    });
    return zeilen;
  }

  /* ---- Die Import-Seite ---------------------------------------------------
     Sie ist seit dem 7. August der Einstieg, nicht mehr der ganze Ablauf: Sie
     zeigt die drei Türen herein und die fertigen Pakete. Sobald Dateien da
     sind, übernimmt der Assistent. */
  function zeichneImport(w){
    w.append(karte('Noten hereinholen', assiZeilenNoten(),
      'Titel und Stimme werden aus den Namen gelesen. Du wirst Schritt für '
      +'Schritt gefragt und schreibst erst am Ende.'));

    /* Steht ein Stapel offen, führt eine Zeile zurück in den Assistenten. */
    if(bandDateien.length){
      const z=zeile('Import läuft',
        '<b>'+bandDateien.length+'</b> Datei'+(bandDateien.length===1?'':'en')
        +' gewählt und noch nicht geschrieben');
      z.classList.add('warnrow');
      z._ctl.append(knopf('Weiter', ()=>assiOeffnen()));
      w.append(karte(null,[z]));
    }

    /* Die anderen Eingänge. Sie stehen UNTER dem Hauptweg: Wer ein Paket
       einliest, hat keine Vorschau offen und findet sie gleich; wer mitten im
       Import steht, wird von ihnen nicht unterbrochen. */
    /* Auch hier ohne Filter, aus demselben Grund: `.zip,application/zip`
       greift auf iOS nicht zuverlässig, und ein grau dastehendes Archiv sperrt
       den Weg für ein ganzes Buch. `importPackage` prüft ohnehin selbst und
       meldet, wenn es kein Paket ist. */
    const z_pak=zeile('BandStand-Paket','Von einem anderen BandStand — führt zusammen, verdoppelt nichts');
    z_pak._ctl.append(knopf('Datei wählen',
      ()=>dateiWaehlen(f=>importPackage(f), '')));
    w.append(karte('Fertige Pakete',[z_pak],
      'Ein Paket bringt seine Kennungen mit. Daran erkennt BandStand, was schon '
      +'da ist — erneutes Einlesen legt nichts doppelt an.'));

    /* ---- Chord-Sheets aus iReal Pro (21. August) -------------------------
       iReal Pro teilt seine Stücke als HTML-Datei, und darin steht je Stück
       ein `irealb://`-Verweis. Eine Playlist bringt sie alle auf einmal mit —
       deshalb ist dieser Eingang zugleich der Weg für einen ganzen Bestand
       und für ein einzelnes Stück. */
    const z_ir=zeile('Chord-Sheets aus iReal Pro',
      'Die geteilte HTML-Datei oder ein einzelner Verweis. Was schon als Titel '
      +'im Bestand steht, bekommt sein Chord-Sheet dazu');
    z_ir._ctl.append(knopf('Datei wählen', ()=>dateiWaehlen(async f=>{
      try{ const txt=await f.text(); irealBlatt(txt, f.name||''); }
      catch(e){ alert('Die Datei ließ sich nicht lesen: '+(e&&e.message||e)); }
    }, '')));
    z_ir._ctl.append(knopf('Verweis einfügen', ()=>{
      const v=prompt('Den Verweis aus iReal Pro hier einfügen:');
      if(v && v.trim()) irealBlatt(v.trim(), '');
    }));
    w.append(karte('Aus iReal Pro',[z_ir],
      'Ein Chord-Sheet trägt die Akkorde und sonst nichts. Es wiegt ein paar '
      +'hundert Zeichen und steht sofort da — es braucht keinen Notensetzer.'));

    /* Eine eigene Überschrift, obwohl es nur eine Zeile ist. Ohne sie stünde
       ihr Hinweis unmittelbar unter der Paket-Karte und sähe aus, als gehörte
       er dorthin — genau die Vermischung, gegen die der Umbau angetreten ist. */
    const z_set=zeile('Listen und Einstellungen',
      'Setlists, Tags, Favoriten, Übungsliste — einzeln oder alles zusammen');
    z_set._ctl.append(knopf('Datei wählen', ()=>dateiWaehlen(f=>importPart(f))));
    w.append(karte('Ohne Noten',[z_set],
      'Wird zusammengeführt; nichts wird gelöscht, und bei einem Widerspruch '
      +'gewinnt der neuere Stand.'));

    /* Die Seite wird losgeloest zusammengebaut — Falle 3 aus CLAUDE.md. `w`
       ist der Knoten, den wir schon in der Hand haben; kein zweites Suchen. */
    w.dataset.zielflaeche='1';
    ziehenAnmelden(w);
  }

  /* ================================================================
     Der Import-Assistent — eine Frage je Fenster

     Am 7. August gebaut. Vorher standen alle Fragen untereinander auf einer
     Seite, und der Schreibknopf lag am Ende: bei vierhundert Blättern zwanzig
     Bildschirme tief. Jens hat dabei vier Real Books in sein Blauton-Buch
     geschrieben, weil die Buchwahl zwischen den anderen Karten unterging.

     Die Reihenfolge ist nicht beliebig. „Wohin" MUSS hinter „Was die Ordner
     bedeuten" stehen: Trägt eine Ebene die Rolle „Buch", gibt es mehrere
     Zielbücher — eines je Ordner —, und welche das sind, weiß man vorher
     nicht. Dieselbe Lehre wie am 5. August.

     Schritte, die nichts zu fragen haben, entfallen. Ein Stapel loser Dateien
     hat keine Ordner, also auch keine Ordnerfrage.
     ================================================================ */
  let assiSchritt=0;
  let assiFertig=null;      /* die Meldung des letzten Laufs, für das Schlussbild */

  function assiStufen(){
    /* Nach dem Schreiben ist der Stapel leer, und die Stufen „Ordner" und
       „Stimmen" fielen rückwirkend weg — die Leiste schrumpfte, während man
       auf „Fertig" stand. Der letzte Lauf hält sie deshalb fest. */
    if(assiFertig && assiFertig.stufen) return assiFertig.stufen;
    const hatOrdner = bandDateien.length && ebenenLesen(bandDateien).length>0;
    const hatStimmen = assiZeilenStimmen().length>0;
    const stufen=[{k:'was', t:'Noten'}];
    if(hatOrdner)  stufen.push({k:'ordner',  t:'Ordner'});
    if(hatStimmen) stufen.push({k:'stimmen', t:'Stimmen'});
    stufen.push({k:'wohin',  t:'Wohin'});
    stufen.push({k:'pruefen',t:'Prüfen'});
    stufen.push({k:'fertig', t:'Fertig'});
    return stufen;
  }
  function assiOeffnen(nr){
    const o=assiBau();
    assiSchritt = (nr===undefined) ? (bandDateien.length ? 1 : 0) : nr;
    o.classList.add('an');
    assiZeichnen();
  }
  function assiZu(){
    const o=document.getElementById('impAssi');
    if(o) o.classList.remove('an');
    assiFertig=null;
    zeichne();
  }
  function assiBau(){
    let o=document.getElementById('impAssi');
    if(o) return o;
    o=document.createElement('div'); o.id='impAssi'; o.className='assi';
    o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true');
    o.innerHTML='<div class="fenster"><div class="kopf"><h3></h3>'
      +'<div class="schritte"></div></div>'
      +'<div class="koerper"></div>'
      +'<div class="fuss"><span class="stand"></span></div></div>';
    document.body.append(o);
    return o;
  }

  function assiZeichnen(){
    const o=document.getElementById('impAssi'); if(!o) return;
    const stufen=assiStufen();
    if(assiSchritt>=stufen.length) assiSchritt=stufen.length-1;
    if(assiSchritt<0) assiSchritt=0;
    const jetzt=stufen[assiSchritt];

    /* Die Schrittleiste. Was noch kommt, steht gedimmt da — das ist die
       Antwort auf „wie viel liegt noch vor mir". */
    const leiste=o.querySelector('.schritte'); leiste.innerHTML='';
    stufen.forEach((s,i)=>{
      const d=document.createElement('div');
      d.className='stufe'+(i===assiSchritt?' jetzt':(i<assiSchritt?' erledigt':''));
      d.innerHTML='<span class="nr">'+(i+1)+'</span><span>'+esc(s.t)+'</span>';
      /* Zurückspringen ja, vorspringen nein: Ein späterer Schritt kann auf
         Angaben beruhen, die noch nicht gemacht sind. */
      if(i<assiSchritt){ d.style.cursor='pointer'; d.onclick=()=>{ assiSchritt=i; assiZeichnen(); }; }
      leiste.append(d);
    });

    const k=o.querySelector('.koerper'); k.innerHTML='';
    const fuss=o.querySelector('.fuss');
    [...fuss.querySelectorAll('button')].forEach(b=>b.remove());
    const stand=fuss.querySelector('.stand'); stand.textContent='';

    const titel=o.querySelector('h3');
    const v = bandDateien.length ? bandLesen() : null;
    /* Die drei Zahlen stehen in jedem Schritt im Fuß. Sie sind der Prüfstein:
       Wer sieht, dass aus 1.600 Blättern ein Titel würde, merkt es hier und
       nicht hinterher. */
    if(v && jetzt.k!=='fertig')
      stand.innerHTML='Ergibt <b>'+v.buecher.length+'</b> '+(v.buecher.length===1?'Buch':'Bücher')
        +' · <b>'+v.stuecke.length+'</b> Titel · <b>'+v.saetze.length+'</b> '
        +(v.saetze.length===1?'Blatt':'Blätter');

    const knopfR=(text,tu,art)=>{ const b=knopf(text,tu,art); fuss.append(b); return b; };

    if(jetzt.k==='was'){
      titel.textContent='Welche Noten?';
      k.append(karte(null, assiZeilenNoten(),
        bandDateien.length
          ? '<b>'+bandDateien.length+' Dateien gelesen.</b> Es ist noch nichts geschrieben.'
          : 'Ein ganzer Ordner, einzelne Dateien oder ein gepacktes Archiv. '
            +'Du kannst sie auch auf dieses Fenster ziehen.'));
      const zw=assiZeilenZweige();
      if(zw.length) k.append(karte('Nur ein Teil?', zw,
        'Bedeuten die obersten Ordner Verschiedenes, nimm sie einzeln und '
        +'wiederhole den Durchgang.'));
      knopfR('Abbrechen', ()=>assiZu());
      const w=knopfR('Weiter ›', ()=>{ assiSchritt++; assiZeichnen(); }, 'wichtig');
      w.disabled=!bandDateien.length;
      if(!bandDateien.length) w.style.opacity='.45';
    }
    else if(jetzt.k==='ordner'){
      titel.textContent='Was bedeuten die Ordner?';
      k.append(karte(null, assiZeilenRollen(),
        'Dieselbe Ordnerform bedeutet Verschiedenes: Bei Bandnoten ist ein '
        +'Ordner ein <b>Stück</b>, bei Real Books ein <b>Buch</b>. Das steht in '
        +'den Dateien nicht drin — deshalb die Frage. Die Zahlen unten rechnen '
        +'sich sofort neu.'));
      knopfR('‹ Zurück', ()=>{ assiSchritt--; assiZeichnen(); });
      knopfR('Weiter ›', ()=>{ assiSchritt++; assiZeichnen(); }, 'wichtig');
    }
    else if(jetzt.k==='stimmen'){
      titel.textContent='Welche Stimme wird aus welchem Ordner?';
      const zs=assiZeilenStimmen();
      const offen=zs.filter(z=>z.classList.contains('warnrow')).length;
      k.append(karte(null, zs,
        /* „1 Ordner sind" stand hier beim ersten Bauen. Derselbe Fehler ist im
           Projekt schon als „1 Sätze" und „1 Elemente" aufgetreten. */
        offen ? '<b>'+offen+(offen===1 ? ' Ordner ist' : ' Ordner sind')
                +' nicht erkannt.</b> '+(offen===1?'Sein':'Ihr')+' Name sagt die '
                +'Ausgabe nicht — so bliebe der ganze Ordnername als Stimme stehen.'
              : 'Alle Ordner sind erkannt. Stimmt etwas nicht, stell es hier um.'));
      knopfR('‹ Zurück', ()=>{ assiSchritt--; assiZeichnen(); });
      knopfR('Weiter ›', ()=>{ assiSchritt++; assiZeichnen(); }, 'wichtig');
    }
    else if(jetzt.k==='wohin'){
      titel.textContent='Wohin soll der Stapel?';
      k.append(zeichneWohin());
      /* Die Warnung, die Jens am 7. August gefehlt hat. Er schrieb vier Real
         Books in sein Blauton-Buch und merkte es erst, als beide Bestände
         untrennbar nebeneinanderlagen. */
      const warn=assiZielWarnung();
      if(warn) k.append(hinweis(warn, true));
      const trK=document.createElement('div'); trK.id='bandTrennKasten'; k.append(trK);
      knopfR('‹ Zurück', ()=>{ assiSchritt--; assiZeichnen(); });
      knopfR('Weiter ›', ()=>{ assiSchritt++; assiZeichnen(); }, 'wichtig');
      zeichneVorschauStill();
    }
    else if(jetzt.k==='pruefen'){
      titel.textContent='Stimmt das so?';
      const halterTr=document.createElement('div'); halterTr.id='bandTrennKasten'; k.append(halterTr);
      const halter=document.createElement('div'); halter.id='bandVorschau'; k.append(halter);
      zeichneVorschau();
      knopfR('‹ Zurück', ()=>{ assiSchritt--; assiZeichnen(); });
      knopfR('Jetzt importieren', ()=>assiSchreiben(), 'wichtig');
    }
    else if(jetzt.k==='fertig'){
      titel.textContent='Import abgeschlossen';
      const f=assiFertig||{};
      const z1=zeile('Geschrieben',
        '<b>'+(f.elemente||0)+'</b> '+((f.elemente===1)?'Blatt':'Blätter')
        +' · <b>'+(f.stuecke||0)+'</b> neue Titel'
        +((f.angedockt||0) ? ' · <b>'+f.angedockt+'</b> an vorhandene gehängt' : ''));
      const z2=zeile('In der Liste stehen jetzt',
        '<b>'+((BS_KATALOG.titel||[]).length)+'</b> Titel in <b>'
        +((BS_KATALOG.buecher||[]).length)+'</b> '
        +(((BS_KATALOG.buecher||[]).length===1)?'Buch':'Büchern'));
      k.append(karte(null,[z1,z2],
        f.buchName ? 'Geschrieben nach „<b>'+esc(f.buchName)+'</b>". '
          +'War das das falsche Buch, holt „Rückgängig" in Content alles wieder heraus.'
          : ''));
      /* Null geschriebene Blätter sind kein Abschluss, sondern ein Fehlschlag.
         Bis zum 20. August stand hier trotzdem „Import abgeschlossen" mit einer
         Null daneben, und das Buch war leer — Jens hat genau das gemeldet, und
         niemand konnte sagen, woran es lag. Jetzt sagt es die Karte selbst,
         mit Namen und Grund der ersten fünf Dateien. */
      const ab=(window._letzterImport||{}).abgewiesen||[];
      if(!(f.elemente>0)){
        titel.textContent='Import fehlgeschlagen';
        const gruende={};
        ab.forEach(x=>{ gruende[x.grund]=(gruende[x.grund]||0)+1; });
        const liste=Object.entries(gruende).map(([g,n])=>n+'× '+g).join(', ');
        k.append(karte('Es ist nichts geschrieben worden',
          [zeile('Gelesen', '<b>'+((window._letzterImport||{}).gelesen||0)+'</b> Dateien'),
           zeile('Davon abgewiesen', '<b>'+ab.length+'</b>'+(liste?' — '+esc(liste):'')),
           zeile('Die ersten', esc(ab.slice(0,5).map(x=>x.name).join(', ')||'—'))],
          'Das Buch ist angelegt, aber leer. Du kannst es in Content löschen und den '
          +'Import erneut versuchen. Hilft das nicht, sag mir die Zahlen aus dieser Karte.'));
      }
      knopfR('Fertig', ()=>{ assiZu(); }, 'wichtig');
    }
    /* Hineinziehen soll auch im Fenster gehen — sonst wäre der Assistent ein
       Rückschritt gegenüber der Seite. */
    k.dataset.zielflaeche='1'; ziehenAnmelden(k);
  }

  /* Die Vorschau still durchrechnen, ohne sie zu zeichnen: Der Schritt
     „Wohin" braucht ihre Zahlen für den Fuß, aber nicht ihre Zeilen. */
  function zeichneVorschauStill(){ try{ bandLetzte=bandLesen(); }catch(e){} }

  /* Was steht schon in dem Buch, in das geschrieben werden soll?
     Gibt null zurück, wenn das Ziel leer oder neu ist. */
  function assiZielWarnung(){
    if(rollenHaben('buch')) return null;      /* dort entscheidet jeder Ordner selbst */
    if(!bandBid) return null;                 /* noch kein Ziel gewählt */
    const buch=(BS_KATALOG.buecher||[]).find(b=>b.id===bandBid);
    if(!buch) return null;
    const titel=(BS_KATALOG.titel||[]).filter(t=>t.buchId===buch.id);
    if(!titel.length) return null;
    const ids=new Set(titel.map(t=>t.id));
    const blaetter=(BS_KATALOG.elemente||[]).filter(e=>ids.has(e.titelId)).length;
    const v=bandLesen();
    /* Gleiche Namen werden zusammengeführt — das ist der Fall, der sich
       hinterher am schwersten aufdröseln lässt. */
    const da=new Set(titel.map(t=>norm(t.titel)));
    const gleich=v.stuecke.filter(s=>da.has(norm(s.titel))).length;
    return '„<b>'+esc(buch.name)+'</b>" enthält bereits <b>'+titel.length+'</b> Titel '
      +'mit <b>'+blaetter+'</b> Blättern. Deine <b>'+v.saetze.length+'</b> Blätter kommen dazu.'
      + (gleich ? ' <b>'+gleich+(gleich===1 ? ' Titel trägt denselben Namen und wird'
                                            : ' Titel tragen denselben Namen und werden')
                  +' zusammengeführt.</b>' : '');
  }

  async function assiSchreiben(){
    const o=document.getElementById('impAssi');
    const knoepfe=o?[...o.querySelectorAll('.fuss button')]:[];
    knoepfe.forEach(b=>b.disabled=true);
    try{
      const zielBid=bandBid;
      /* Die Stufen VOR dem Schreiben festhalten: `bandSchreiben` räumt den
         Stapel weg, und ohne Dateien fielen „Ordner" und „Stimmen" aus der
         Leiste — sie schrumpfte, während man auf „Fertig" stand. */
      const stufen=assiStufen();
      const ber=await beiArbeit('Wird geschrieben…',
        'Bitte warte, bis diese Anzeige verschwindet.',
        ()=>bandSchreiben(null, true));
      const buch=(BS_KATALOG.buecher||[]).find(b=>b.id===(ber.erstesZiel||zielBid));
      assiFertig={ elemente:ber.blaetter, stuecke:ber.stuecke,
                   angedockt:ber.angedockt, buchName:(buch&&buch.name)||'',
                   engeWar:ber.engeWar, stufen };
      assiSchritt=stufen.length-1;
      assiZeichnen();
    }catch(e){
      knoepfe.forEach(b=>b.disabled=false);
      alert('Import fehlgeschlagen: '+(e&&e.message||e));
    }
  }

  /* ---- Der eine Weg zum Schreiben ----------------------------------------
     Bis zum 7. August steckte dieser Ablauf im Knopf der Vorschau. Seit es den
     Assistenten gibt, rufen ihn zwei Rahmen — und zwei Kopien wären zwei
     Wahrheiten. Der Fortschritt geht als Rückruf hinaus; wie er gezeigt wird,
     entscheidet der Aufrufer.

     `melde(art, getan, gesamt, buchName, anteil)` — art ist 'lesen' oder
     'schreiben'. */
  async function bandSchreiben(melde, ohneAbschluss){
    const v=bandLesen();
    /* Je Zielbuch ein Durchgang. `importStapel` bleibt unveraendert und
       schreibt in genau ein Buch; die Buendelung geschieht hier. Fehlende
       Buecher werden erst jetzt angelegt — vorher ist nichts entstanden,
       auch wenn die Vorschau schon Namen genannt hat. */
    const nachBuch=new Map();
    v.stuecke.forEach(st=>{
      const k=st.buchName||'';
      if(!nachBuch.has(k)) nachBuch.set(k, {name:k, zielBid:st.zielBid, saetze:[]});
      nachBuch.get(k).saetze.push(...st.saetze);
    });
    let gesamt=0, stueckZahl=0, angedockt=0, glatt=0, erstesZiel='';
    const gesamtBlaetter=v.saetze.length; let fertig=0;
    for(const g of nachBuch.values()){
      let bid=g.zielBid;
      if(!userBook(bid)){
        try{ bid=await createBook(g.name||'Import'); }
        catch(e){ alert('Buch „'+(g.name||'Import')+'" anlegen fehlgeschlagen: '
                        +(e&&e.message||e)); continue; }
      }
      if(!erstesZiel) erstesZiel=bid;
      const n=await importStapel(bid, g.saetze, (was,a,ges)=>{
        const p = gesamtBlaetter ? Math.round((fertig+a)/(gesamtBlaetter*2)*100) : 0;
        if(melde) melde(was, a, ges, g.name||'', Math.min(100,p));
      });
      fertig += g.saetze.length*2;
      gesamt += (n||0);
      const z=window._letzterImport||{};
      stueckZahl += (z.stuecke||0); angedockt += (z.angedockt||0); glatt += (z.glatt||0);
    }
    /* Jede Einschraenkung der Liste faellt, damit das Eingelesene auch zu
       sehen ist.

       Am 3. August hat Jens ein Buch mit 56 Titeln importiert und eine
       leere Liste vorgefunden: Eine gespeicherte Buchauswahl hatte sie
       eingeschraenkt. Damals bekam der Empfang diesen Aufruf — der grosse
       Import nicht. Seit dem 6. August laufen alle Wege durch diese eine
       Stelle, und am 6. August hat der Prueflauf gezeigt, dass die Falle
       damit wieder offen stand: 0 sichtbare Titel bei 33 im Bestand.
       Deshalb steht der Aufruf jetzt hier, wo alle Wege durchkommen. */
    await loadLibrary();
    const engeWar = (typeof nachImportZeigen==='function') ? nachImportZeigen() : false;
    const bericht={ blaetter:gesamt, stuecke:stueckZahl, angedockt, glatt,
                    buecher:nachBuch.size, erstesZiel, engeWar };
    /* Der Assistent zeigt sein eigenes Schlussbild und springt nicht weg.
       Über die Seite bleibt es beim gewohnten Ablauf: Meldung, dann hinein in
       das Buch, das gerade gefüllt wurde. */
    if(ohneAbschluss){ bandZustand(); return bericht; }
    alert('Import fertig.\n'
      + gesamt+' '+((gesamt===1)?'Blatt':'Blätter')+' geschrieben.\n'
      + stueckZahl+' neue Titel'
      + (nachBuch.size>1 ? ' in '+nachBuch.size+' Büchern' : '')
      + (angedockt ? ', '+angedockt+' an vorhandene angedockt' : '')
      + (glatt ? '\n'+glatt+(glatt===1?' vorhandenes Etikett':' vorhandene Etiketten')+' angepasst' : '')
      + (typeof titelInDerListe==='function'
          ? '\n\nIn der Liste stehen jetzt '+titelInDerListe()+' Titel.' : '')
      + (engeWar ? '\n\nDie Liste war eingeschränkt und steht jetzt auf „Alle".' : ''));
    /* Zurueck in den Content, und zwar IN das Buch, das gerade gefuellt
       wurde — nicht auf die oberste Ebene. Man will sehen, was angekommen
       ist. Bei mehreren Buechern in das erste. */
    const ziel=erstesZiel||bandBid;
    bandZustand(); unter=null; thema='content';
    thema='content'; cPfad=[ziel]; cFlach=false; cAktion=null; cZuruecksetzen();
    zeichne();
    return bericht;
  }

  /* ---- Wohin geschrieben wird -----------------------------------------
     Zwei Gestalten derselben Frage. Ohne Buch-Ebene wird EIN Buch gewaehlt,
     wie seit jeher. Mit Buch-Ebene bringt jeder Ordner seinen Namen mit, und
     die Zeile fragt nur noch, ob daraus ein neues Buch wird oder ein
     vorhandenes weitergefuellt.                                            */
  function zeichneWohin(){
    const zeilen=[];
    const buchEbene = rollenHaben('buch');

    if(buchEbene){
      /* Die Ordnernamen der Buch-Ebene, in der Reihenfolge des Stapels. */
      const nr=+Object.keys(bandRollen).find(k=>bandRollen[k]==='buch');
      const namen=[];
      bandStapel().forEach(e=>{
        const t=String(e.pfad||e.file.name).split('/').filter(Boolean);
        t.pop();
        const n=t[nr-1];
        if(n && !namen.includes(n)) namen.push(n);
      });
      if(!namen.length) zeilen.push(zeile('Keine Bücher gefunden',
        'Auf Ebene '+nr+' steht kein Ordner. Stell die Ebene um.'));
      namen.forEach(n=>{
        const ziel=zielBuchVon(n);
        const da=userBook(ziel);
        const z=zeile(esc(n), da
          ? 'Geht in das vorhandene Buch <b>'+esc(da.name)+'</b>'
          : 'Wird ein <b>neues Buch</b> mit diesem Namen');
        z._ctl.append(AWAHL.knopf(()=>{
          const eintraege=[{wert:'', text:'Neues Buch „'+n+'"', ton:'wird beim Schreiben angelegt'}]
            .concat(USERBOOKS.map((b,i)=>({ wert:b.bid, text:b.name,
              ton:(BS_KATALOG.titel||[]).filter(t=>t.buchId===b.bid).length+' Titel',
              kopf: i===0 ? 'Oder in ein vorhandenes' : null })));
          const jetzt=eintraege.find(x=>x.wert===ziel)||eintraege[0];
          return { wert:ziel, eintraege, text:jetzt.text, ton:jetzt.ton };
        }, neu=>{ bandBuchZiel[n]=neu; bandAndockHand={}; zeichne(); }, 'Wohin mit „'+n+'"?'));
        zeilen.push(z);
      });
    } else {
      const buch=userBook(bandBid);
      const z_buch=zeile('Buch', buch ? ('<b>'+esc(buch.name)+'</b>')
        : (USERBOOKS.length ? 'Noch keines gewählt' : 'Es gibt noch kein eigenes Buch — lege eines an'));
      if(USERBOOKS.length){
        /* Auch diese Wahl im Stil der App. Zwei Dropdowns nebeneinander, eines
           vom Betriebssystem und eines von BandStand, saehen nach Versehen aus. */
        z_buch._ctl.append(AWAHL.knopf(()=>{
          const eintraege=[{wert:'', text:'Noch keines', ton:''}]
            .concat(USERBOOKS.map((b,n)=>({ wert:b.bid, text:b.name,
              ton: LIBTUNES.filter(t=>t.bid===b.bid).length+' Sätze',
              kopf: n===0 ? 'Eigene Bücher' : null })));
          const jetzt=eintraege.find(x=>x.wert===bandBid) || eintraege[0];
          return { wert:bandBid, eintraege, text:jetzt.text, ton:'' };
        }, neu=>{ bandBid=neu; zeichne(); }, 'Buch wählen'));
      }
      const inp=document.createElement('input'); inp.className='txt';
      inp.placeholder='Neues Buch, z. B. Songbuch Band X';
      /* Der Stapel bringt einen Namen mit — der des Archivs oder des Ordners.
         Er steht als Vorschlag da, solange kein Buch gewaehlt ist. */
      if(!bandBid && bandStapelName) inp.value=bandStapelName;
      const anlegen=async()=>{ const v=inp.value.trim(); if(!v) return;
        bandBid=await createBook(v); inp.value=''; render(); zeichne(); };
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') anlegen(); });
      const z_neu=zeile('Neues Buch', bandStapelName && !bandBid
        ? 'Vorgeschlagen nach dem Stapel — überschreib ihn, wenn er nicht passt'
        : 'Bündelt die Blätter dieses Stapels');
      z_neu._ctl.append(inp, knopf('Anlegen', anlegen));
      zeilen.push(z_buch, z_neu);
    }

    /* Die Ausgabe. Ein Real Book traegt sie auf dem Umschlag und nicht im
       Dateinamen — sie wird deshalb gesagt und nicht geraten. Traegt bereits
       ein Ordner die Stimme, ist die Ansage ueberfluessig und sagt das. */
    const stimmOrdner = rollenHaben('stimme');
    const jetztAus=AUSGABEN.find(a=>a.wert===bandAusgabe)||AUSGABEN[0];
    const z_ausg=zeile('Ausgabe', stimmOrdner
      ? 'Nicht nötig — die Stimme steht schon im Ordnernamen'
      : bandAusgabe
        ? 'Alle Blätter dieses Durchgangs werden die <b>'+esc(bandAusgabe)+'</b>-Stimme'
        : 'Nur nötig, wenn der Stapel eine Ausgabe eines Real Books ist');
    if(!stimmOrdner) z_ausg._ctl.append(AWAHL.knopf(
      ()=>({ wert:bandAusgabe, eintraege:AUSGABEN, text:jetztAus.text, ton:'' }),
      neu=>{ bandAusgabe=neu; bandAndockHand={}; zeichne(); }, 'Ausgabe wählen'));
    zeilen.push(z_ausg);

    return karte('Wohin', zeilen);
  }

  /* Der Ordnerdialog ist eine Sache der Schreibtisch-Browser. Kann Safari auf
     dem iPad ihn nicht, bleibt der Weg ueber einzelne Dateien — deshalb steht
     der Knopf nur da, wo er auch etwas tut. */
  /* Ein Datei-Eingabefeld muss IM DOKUMENT haengen, bevor es angeklickt wird.
     Safari auf dem iPad oeffnet den Dialog fuer ein losgeloestes Feld nicht —
     ohne Fehler, ohne Meldung. Am Mac faellt das nicht auf, weil Safari und
     Chrome dort grosszuegiger sind. Das war Jens' „eingefrorener" Knopf am
     30. Juli: Der erste Griff ging noch, danach passierte gar nichts mehr.

     EIN Feld, dauerhaft im Dokument, wiederverwendet. Die erste Fassung dieses
     Umbaus hat das Feld nach der Wahl wieder entfernt — und damit einen
     schlimmeren Fehler eingebaut als den behobenen: Eine Datei aus der Dropbox
     muss erst heruntergeladen werden, das `change`-Ereignis kommt entsprechend
     spaet, und das Feld war da schon weg. Die Auswahl fiel ins Leere. Der
     Knopf „+ PDF" funktionierte weiter, weil sein Feld fest im Markup steht —
     genau dieser Unterschied hat den Fehler verraten.

     Also: nie entfernen, nichts an Zeitgeber haengen. */
  let _dateiFeld=null;
  function dateiFeld(bau, fertig){
    if(!_dateiFeld || !_dateiFeld.isConnected){
      _dateiFeld=document.createElement('input');
      _dateiFeld.type='file'; _dateiFeld.className='dateifeld';
      document.body.append(_dateiFeld);
    }
    const i=_dateiFeld;
    /* Vor jeder Wahl zuruecksetzen. `value=''` ist noetig, damit dieselbe
       Datei zweimal hintereinander gewaehlt werden kann. */
    i.value=''; i.multiple=false; i.accept='';
    try{ i.webkitdirectory=false; }catch(e){}
    i.removeAttribute('webkitdirectory');
    /* `capture` schickt direkt in die Kamera. Bliebe es stehen, oeffnete
       der naechste Griff nach einer PDF-Datei die Kamera. */
    i.removeAttribute('capture');
    bau(i);
    i.onchange=()=>{ i.onchange=null; fertig([...i.files]); };
    i.click();
  }

  /* Auf iPhone und iPad gibt es keine Ordnerwahl: `webkitdirectory` ist dort
     ohne Wirkung, obwohl die Eigenschaft existiert — eine Merkmalspruefung
     hilft also nicht, es bleibt die Kennung des Geraets. Sie entscheidet nur
     ueber den HINWEIS; der Knopf bleibt da, und wenn nichts zurueckkommt,
     sagt die App es in jedem Fall. */
  const IST_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

  function ordnerWaehlen(){
    dateiFeld(i=>{ i.webkitdirectory=true; i.multiple=true; }, fs=>{
      if(fs.length){
        bandUebernehmen(fs.map(f=>({file:f, pfad:f.webkitRelativePath||f.name})));
        return;
      }
      /* Nie stillschweigend nichts tun. Genau daran hat Jens am 30. Juli eine
         halbe Stunde verloren. */
      alert(IST_IOS
        ? 'Aus diesem Dialog kam kein einziger Ordner zurück.\n\n'
          +'Safari auf iPad und iPhone kann keine ORDNER auswählen — nur Dateien. '
          +'Nimm „Dateien wählen" und markiere dort alle PDFs des Stapels '
          +'(im Dateien-Dialog oben rechts „Auswählen", dann „Alle auswählen").\n\n'
          +'Der Titel wird dann aus dem Dateinamen gelesen statt aus dem Ordner. '
          +'Am Mac steht der Ordner-Weg weiterhin zur Verfügung.'
        : 'Aus diesem Dialog kam keine Datei zurück.\n\n'
          +'Entweder wurde abgebrochen, oder der gewählte Ordner enthält keine Dateien. '
          +'Liegen die Noten in einer Cloud, müssen sie vorher heruntergeladen sein.');
    });
  }
  function bandUebernehmen(eintraege){
    /* Verstecktes von macOS und Windows faellt weg, sonst stuende „.DS_Store"
       unter „Übergangen" und beunruhigte ohne Anlass. */
    bandDateien = eintraege.filter(e=>{
      const n=String(e.pfad||e.file.name);
      return !n.split('/').some(t=>t.startsWith('.'));
    });
    /* Auch die Ausgabe faellt zurueck auf „je Datei erkennen". Bliebe sie
       stehen, bekaeme der naechste Stapel still die Stimme des vorigen — bei
       vierhundert Blaettern faellt das erst auf, wenn es zu spaet ist.

       Dasselbe gilt fuer die Rollen der Ordnerebenen: Ein neuer Stapel ist
       anders gebaut als der vorige, und eine stehengebliebene Rolle waere
       eine stille Falschaussage ueber Dateien, die sie nie gesehen hat. */
    bandHand={}; bandTitelHand={}; bandAndockHand={}; bandAusgabe=''; bandGlattAuf=false;
    bandRollen={}; bandBuchZiel={}; bandZweige=new Set(); bandStimmHand={};
    bandOffen.clear(); bandLetzte=null;
    PDFW.alleZu();
    /* Sobald Dateien da sind, übernimmt der Assistent. Er ist seit dem
       7. August der Weg durch den Import; die Seite ist nur noch der
       Einstieg. */
    if(bandDateien.length){
      thema='import';
      assiOeffnen(1);
    } else {
      const o=document.getElementById('impAssi'); if(o) o.classList.remove('an');
      zeichne();
    }
  }

  /* Prueflatte fuer die Konsole — dieselbe Absicht wie `gruppenBericht` und
     `blattArt`: Der Import laesst sich damit ohne Dateiwaehler durchspielen und
     in Zahlen nachweisen. Er ruft nur, was der Knopf auch ruft. */
  window.bandPruef = {
    uebernehmen: e => bandUebernehmen(e),
    lesen:       () => bandLesen(),
    ausgabe:     v => { bandAusgabe = v||''; bandAndockHand={}; zeichne(); },
    buch:        b => { bandBid = b; zeichne(); },
    andocken:    (schl, an) => { bandAndockHand[schl]=an; zeichne(); },
    /* Die Rollen der Ordnerebenen — der Kern seit dem 5. August.
       `rollen({1:'buch'})` setzt, `rollen()` liest. */
    rollen:      r => { if(r!==undefined){ bandRollen=r||{}; bandBuchZiel={};
                          bandStimmHand={}; bandAndockHand={}; zeichne(); } return bandRollen; },
    /* Zwei Namen für dasselbe Paar aus Ordner und Stimme, und der
       ausführlichere von beiden las nur: `ordnerStimme('realbook1','C')` nahm
       den zweiten Wert still entgegen und tat nichts. Am 7. August genau
       darauf hereingefallen — eine Prüflatte, die schweigend nichts tut, ist
       schlimmer als gar keine. Jetzt setzen beide, wenn ein Wert danebensteht,
       und `ordnerStimme(n)` allein liest weiterhin nur das Erkannte. */
    stimme:      (ordner, wert) => stimmVonHand(ordner, wert),
    ordnerStimme:(ordner, wert) => wert===undefined ? ordnerStimme(ordner)
                                                    : stimmVonHand(ordner, wert),
    ebenen:      () => ebenenLesen(bandStapel()),
    zweige:      z => { bandZweige = new Set([].concat(z||[])); bandAndockHand={};
                        bandBuchZiel={}; zeichne(); return [...bandZweige]; },
    buchZiel:    (name, bid) => { bandBuchZiel[name]=bid||''; zeichne(); },
    /* Die drei Zahlen, an denen sich alles messen laesst. */
    zahlen:      () => { const v=bandLesen();
                   return { buecher:v.buecher.length, titel:v.stuecke.length,
                            elemente:v.saetze.length, uebergangen:v.uebergangen.length,
                            toene:v.toene.length, offen:v.offen.length }; },
    zustand:     () => ({ bandBid, bandAusgabe, bandRollen, bandBuchZiel,
                          dateien:bandDateien.length, bandAndockHand }),
  };

  /* Ordner hineinziehen. Der Browser gibt Verzeichnisse nur ueber
     `webkitGetAsEntry` heraus; ohne das Durchlaufen kaeme nur die oberste
     Ebene an. */
  async function eintraegeLesen(entry, pfad){
    if(!entry) return [];
    if(entry.isFile){
      const f=await new Promise(r=>entry.file(r, ()=>r(null)));
      return f ? [{file:f, pfad:(pfad?pfad+'/':'')+entry.name}] : [];
    }
    if(!entry.isDirectory) return [];
    const leser=entry.createReader();
    const kinder=[];
    for(;;){
      const teil=await new Promise(r=>leser.readEntries(r, ()=>r([])));
      if(!teil.length) break;
      kinder.push(...teil);
    }
    const unter=(pfad?pfad+'/':'')+entry.name;
    const aus=[];
    for(const k of kinder) aus.push(...await eintraegeLesen(k, unter));
    return aus;
  }
  function ziehenAnmelden(w){
    const halt=e=>{ e.preventDefault(); e.stopPropagation(); };
    ['dragenter','dragover'].forEach(n=>w.addEventListener(n, e=>{
      halt(e); e.dataTransfer.dropEffect='copy'; w.dataset.zieh='1'; }));
    ['dragleave','drop'].forEach(n=>w.addEventListener(n, e=>{
      halt(e); if(n==='dragleave' && w.contains(e.relatedTarget)) return; delete w.dataset.zieh; }));
    w.addEventListener('drop', async e=>{
      halt(e);
      const posten=[...(e.dataTransfer.items||[])];
      const wurzeln=posten.map(p=>p.webkitGetAsEntry && p.webkitGetAsEntry()).filter(Boolean);
      let aus=[];
      if(wurzeln.length){ for(const wz of wurzeln) aus.push(...await eintraegeLesen(wz, '')); }
      else aus=[...(e.dataTransfer.files||[])].map(f=>({file:f, pfad:f.name}));
      if(aus.length) bandUebernehmen(aus);
    });
  }

  function zeichneVorschau(){
    const halter=document.getElementById('bandVorschau'); if(!halter) return;
    halter.innerHTML='';
    const trK=document.getElementById('bandTrennKasten'); if(trK) trK.innerHTML='';
    if(!bandDateien.length){
      halter.append(karte('Vorschau',[zeile('Noch nichts gelesen',
        'Wähle oben die Noten — oder zieh sie auf diese Seite')]));
      return;
    }
    const v=bandLesen();
    /* Erst festhalten, dann zeichnen: Die Stimmen-Wahl der Zeilen liest ihren
       Zustand aus `bandLetzte`, und die Zeilen entstehen gleich darunter. */
    bandLetzte=v;

    /* Das Trennzeichen zaehlt nur ohne Ordner. Steht es sichtbar da, obwohl es
       nichts tut, sucht man den Fehler an der falschen Stelle. */
    if(trK && !v.ordnerWeg){
      /* Der Text stimmte nicht mehr: Seit dem 30. Juli wird der Titel zuerst
         an der Stelle gesucht, an der die Stimme anfaengt. Das Trennzeichen
         ist der zweite Weg und zaehlt nur, wenn der Dateiname eines traegt. */
      const z_tr=zeile('Trennzeichen',
        'Steht eines im Dateinamen, wird dort geteilt — sonst am Anfang der erkannten Stimme');
      const tin=document.createElement('input'); tin.className='txt'; tin.value=bandTrenner;
      tin.style.maxWidth='120px';
      tin.oninput=()=>{ bandTrenner=tin.value||' - '; zeichneVorschau(); };
      z_tr._ctl.append(tin);
      trK.append(karte('Ohne Ordner',[z_tr]));
    }

    /* Die eine Zeile, an der man sofort sieht, ob die Ordner richtig gelesen
       sind. Sie nennt Buecher, Titel und Blaetter — dieselben drei Zahlen, die
       nach dem Schreiben im Bestand stehen muessen. */
    const nBuch=v.buecher.length;
    const z_zahl=zeile('Ergibt',
      '<b>'+nBuch+'</b> '+(nBuch===1?'Buch':'Bücher')
      +' · <b>'+v.stuecke.length+'</b> Titel'
      +' · <b>'+v.saetze.length+'</b> '+(v.saetze.length===1?'Blatt':'Blätter')
      + (v.offen.length ? ' · <b>'+v.offen.length+'</b> ohne Stimme' : '')
      + (v.toene.length ? ' · '+v.toene.length+' Ton' : '')
      + (v.ausgelassen.length ? ' · '+v.ausgelassen.length+' ausgelassen' : ''));
    const vorschauZeilen=[z_zahl];

    /* Ein Titel mit sehr vielen Blaettern ist fast immer ein falsch gelesener
       Ordner. Gesagt wird es als Frage, nicht als Befund — geraten wird hier
       nichts, und die Zahl steht ohnehin daneben. */
    const dickstes=v.stuecke.reduce((a,b)=>b.saetze.length>(a?a.saetze.length:0)?b:a, null);
    if(dickstes && dickstes.saetze.length>=25 && v.stuecke.length<=2)
      vorschauZeilen.push(zeile('Sieht das richtig aus?',
        '„'+esc(dickstes.titel)+'" bekäme <b>'+dickstes.saetze.length+'</b> Blätter. '
        +'Wenn dieser Ordner in Wahrheit ein Buch ist, stell ihn oben auf '
        +'<b>ist ein Buch</b> um.'));

    const z_woher=zeile('Woher der Titel kommt', v.ordnerWeg
      ? 'Aus dem <b>Ordnernamen</b> der Stück-Ebene'
      : 'Aus dem <b>Dateinamen</b> — keine Ebene ist als Stück gesetzt');
    vorschauZeilen.push(z_woher);

    /* Blaetter, die unter demselben Dateinamen schon am Zieltitel haengen. */
    const doppelt=v.stuecke.reduce((n,s)=>n+(s.doppelt||0),0);
    if(doppelt) vorschauZeilen.push(zeile('Schon einmal da',
      '<b>'+doppelt+'</b> '+(doppelt===1?'Blatt trägt':'Blätter tragen')
      +' denselben Dateinamen wie ein Blatt, das schon am Titel hängt. '
      +(doppelt===1?'Es entsteht ':'Es entstehen ')+'ein zweites daneben. '
      +'Ein BandStand-Paket würde das erkennen — ein Ordner trägt keine Kennungen.'));
    if(v.hatBuchEbene) vorschauZeilen.push(zeile('Bücher',
      v.buecher.map(b=>{
        const da=userBook(b.zielBid);
        return esc(b.name||'ohne Namen')+' → '+(da?esc(da.name):'<b>neu</b>')
             +' <span class="muted">('+b.stuecke+' Titel)</span>';
      }).join('<br>')));
    if(rollenHaben('stimme')) vorschauZeilen.push(zeile('Stimme',
      'Aus dem Ordnernamen — alle Blätter eines Ordners bekommen dieselbe'));
    else if(bandAusgabe) vorschauZeilen.push(zeile('Ausgabe',
      'Alle Sätze bekommen die Stimme <b>'+esc(bandAusgabe)+'</b>'));
    halter.append(karte('Vorschau',vorschauZeilen));

    /* ---- Der Knopf zum Schreiben, GLEICH HIER ---------------------------
       Er stand bis zum 30. Juli am Ende aller Karten — bei 57 Stücken viele
       Bildschirme weit unten. Jens hat ihn deshalb nicht gefunden und gemeint,
       der Import sei bereits gelaufen. Solange nichts geschrieben ist, sagt
       die Zeile das jetzt ausdrücklich. */
    /* Jedes Ziel muss es auch wirklich geben — oder es muss neu angelegt
       werden duerfen. Zeigt ein Ziel auf ein geloeschtes Buch, entstuenden
       Stuecke ohne Buch: im Katalog unsichtbar und nur noch ueber den Export
       zu finden.

       Mit Buch-Ebene ist immer alles bereit, weil fehlende Buecher beim
       Schreiben angelegt werden. Ohne Buch-Ebene muss das eine Buch stehen. */
    const buchDa = v.hatBuchEbene
      ? v.buecher.length>0
      : !!userBook(bandBid);
    /* Die offenen Dateien sperren NICHT mehr. Bis zum 31. Juli stand hier
       zusaetzlich `&& !v.offen.length`, und elf von 460 Dateien hielten den
       ganzen Import auf. Sie gehen jetzt als „Not Assigned" mit. */
    const bereit = buchDa && v.saetze.length;
    const andockZahl=v.stuecke.filter(s=>s.andocken).length;
    const neuZahl=v.stuecke.length-andockZahl;
    const neueBuecher=v.buecher.filter(b=>!userBook(b.zielBid)).length;
    const wohin = v.hatBuchEbene
      ? (v.buecher.length===1
          ? '„'+esc(userBook(v.buecher[0].zielBid)&&userBook(v.buecher[0].zielBid).name || v.buecher[0].name)+'"'
          : v.buecher.length+' Bücher')
      : '„'+esc((userBook(bandBid)||{}).name||'')+'"';
    /* Im Assistenten traegt der Fuss den Schreibknopf. Diese Zeile bleibt fuer
       den Weg ueber die Seite und wird im Fenster ausgeblendet — zwei blaue
       Knoepfe mit derselben Aufschrift sind einer zu viel. */
    const z_go=zeile('Noch nichts gespeichert',
      !buchDa ? 'Wähle oben ein Buch'
      : !v.saetze.length ? 'Es ist nichts zuzuordnen'
      : '<b>'+v.saetze.length+'</b> '+(v.saetze.length===1?'Blatt':'Blätter')
        +' in '+wohin+' schreiben'
        + (neueBuecher ? ' · '+neueBuecher+(neueBuecher===1?' Buch':' Bücher')+' wird neu angelegt' : '')
        + (andockZahl ? ' · '+neuZahl+' neue Titel, '+andockZahl+' angedockt' : '')
        + (v.offen.length ? ' · <b>'+v.offen.length+'</b> davon als „'+OHNE_STIMME+'"' : ''));
    const b=knopf('Jetzt importieren', async ()=>{
      b.disabled=true;
      /* Bei 460 Blaettern dauert das zwanzig Sekunden. Bis zum 31. Juli stand
         der Fortschritt nur als Text AUF dem Knopf — Jens hat ihn in der Probe
         nicht gesehen und dachte, es passiere nichts. Jetzt liegt ein Balken
         unter der Zeile, dort, wo man ohnehin hinsieht. */
      const bar=document.createElement('div'); bar.className='fortschritt';
      const fuell=document.createElement('i'); const txt=document.createElement('span');
      bar.append(fuell, txt); z_go.after(bar);
      await bandSchreiben((art, a, ges, name, anteil)=>{
        b.textContent = (art==='lesen' ? 'Lese ' : 'Schreibe ') + a + '/' + ges;
        fuell.style.width = Math.min(100,anteil)+'%';
        txt.textContent = (art==='lesen' ? 'Blätter lesen' : 'In den Bestand schreiben')
                        + ' — ' + (name ? '„'+name+'": ' : '') + a + ' von ' + ges;
      });
      bar.remove();
    });
    b.disabled=!bereit;
    /* Der eine Knopf, der die Hauptsache tut — er traegt den Ton der
       Wortmarke und hebt sich damit von allem ab, was daneben nur anbietet. */
    b.classList.add('wichtig');
    z_go._ctl.append(b);
    z_go.classList.add('schreibzeile');
    halter.append(karte(null,[z_go]));
    /* ---- Was es im Buch schon gibt --------------------------------------
       Nichts davon geschieht von selbst. Die Karte sagt, was gefunden wurde,
       und stellt die Frage; geschrieben wird erst auf „Jetzt importieren". */
    if(v.treffer){
      const andockZahl=v.stuecke.filter(s=>s.andocken).length;
      const kopf=zeile('Gefunden',
        '<b>'+v.treffer+'</b> der gelesenen Titel '+(v.treffer===1?'steht':'stehen')
        +(v.hatBuchEbene ? ' schon im jeweiligen Zielbuch'
                         : ' schon in „'+esc((userBook(bandBid)||{}).name||'')+'"')
        +((bandAusgabe||rollenHaben('stimme'))
          ? ' — beim Nachladen einer Ausgabe ist Andocken das Übliche' : ''));
      const alle=zeile('Für alle', andockZahl+' von '+v.treffer+' docken an');
      alle._ctl.append(
        knopf('Alle andocken', ()=>{ v.stuecke.forEach(s=>{ if(s.vorhanden) bandAndockHand[s.schl]=true; }); zeichneVorschau(); }),
        knopf('Alle einzeln', ()=>{ v.stuecke.forEach(s=>{ if(s.vorhanden) bandAndockHand[s.schl]=false; }); zeichneVorschau(); }));
      const zeilen=[kopf, alle];
      v.stuecke.filter(s=>s.vorhanden).slice(0,14).forEach(s=>{
        const z=zeile('', s.andocken
          ? 'wird die '+ (s.saetze.length===1?'Stimme':'Stimmen') +' des vorhandenen Stücks ('
            + s.vorhanden.blaetter + (s.vorhanden.blaetter===1?' Blatt':' Blätter') + ')'
          : 'wird ein zweites Stück gleichen Namens');
        z.querySelector('.lb').innerHTML='<b>'+esc(s.titel)+'</b>';
