if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.js';

/* ================================================================
   Die Stimmen-Wahl

   Ein Knopf, der eine Liste aufklappt. Die Liste haengt am Dokument
   und nicht am Knopf: Sonst schnitte sie der Rand des schwebenden
   Fensters ab, und im Setup der Rand der Rollflaeche.

   Der Inhalt kommt aus EINER Quelle — dieselbe Liste steht in der
   Vorschau und in jedem Fenster.
   ================================================================ */
/* Was hinter dem Namen in Klammern steht. Die Notation kommt aus der
   Voice-Liste, wo Jens sie festlegt; „ohne Notation" ist dieselbe Wendung,
   die der Voice-Dialog verwendet. Schlagzeug und Percussion kommen in
   transponierten Ausgaben nicht vor und tragen darum keine. */
function notationText(i){ return i.notation ? i.notation : 'ohne Notation'; }
function stimmenAuswahl(erkannt){
  const aus=[{ wert:'', text:'Automatisch erkennen',
               ton: erkannt ? erkannt : 'nichts erkannt', kopf:null }];
  INSTRUMENTE.forEach((i,n)=>aus.push({ wert:i.name, text:anzeigeStimme(i.name), ton:notationText(i),
                                        kopf: n===0 ? 'Instrumente' : null }));
  BLATT_NAMEN.forEach((n,k)=>aus.push({ wert:n, text:anzeigeStimme(n), ton:'keine Stimme',
                                        kopf: k===0 ? 'Blätter' : null }));
  aus.push({ wert:'-', text:'Auslassen', ton:'wird nicht importiert', kopf:'Sonst' });
  return aus;
}
/* Dieselbe Liste fuer den fertigen Bestand. Dort gibt es kein „Auslassen"
   mehr — was importiert ist, ist da — und statt „Automatisch erkennen" steht
   „Keine Stimme": ein Blatt ohne Stimme ist eine gueltige Angabe, keine
   fehlende. */
function stimmenAuswahlBestand(){
  const aus=[{ wert:'', text:'Keine Stimme', ton:'steht für sich', kopf:null }];
  INSTRUMENTE.forEach((i,n)=>aus.push({ wert:i.name, text:anzeigeStimme(i.name), ton:notationText(i),
                                        kopf: n===0 ? 'Instrumente' : null }));
  /* Die Ausgaben stehen jetzt ausdruecklich zur Wahl. Sie waren ueber das Feld
     „Ausgabe" schon erreichbar, aber nur fuer den ganzen Durchgang; fuer ein
     einzelnes Blatt gab es sie nicht. */
  STIMM_ORDNUNG.forEach((s,k)=>aus.push({ wert:s, text:s+'-Ausgabe', ton:'Tonart',
                                        kopf: k===0 ? 'Ausgaben' : null }));
  BLATT_NAMEN.forEach((n,k)=>aus.push({ wert:n, text:anzeigeStimme(n), ton:'keine Stimme',
                                        kopf: k===0 ? 'Blätter' : null }));
  aus.push({ wert:OHNE_STIMME, text:anzeigeStimme(OHNE_STIMME), ton:'später zuordnen',
             kopf:'Ohne Zuordnung' });
  return aus;
}
const AWAHL = (function(){
  let liste=null, offenerKnopf=null;
  function bauen(){
    if(liste) return;
    liste=document.createElement('div'); liste.className='awahlliste';
    document.body.append(liste);
    /* Ein Tipp daneben schliesst. `pointerdown` statt `click`, damit die
       Liste weg ist, bevor darunter etwas anderes anspringt. */
    document.addEventListener('pointerdown', e=>{
      if(!offenerKnopf) return;
      if(liste.contains(e.target) || offenerKnopf.contains(e.target)) return;
      zu();
    }, true);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && offenerKnopf){ e.stopPropagation(); zu(); } }, true);
    /* Rollt oder dreht sich etwas, stimmt die Stelle nicht mehr. Dann lieber
       schliessen als daneben stehen.

       ABER: Die Liste selbst darf rollen. Sie hat `max-height:60vh` und
       `overflow-y:auto`, und bei zwanzig Stimmen braucht sie das auch. Bis zum
       31. Juli fing dieser Horcher das Roll-Ereignis der Liste mit — sie schloss
       sich also genau in dem Moment, in dem man sie zu rollen versuchte. Jens
       ist in der Probe darueber gestolpert: Das Tenor-Sax war nicht erreichbar.
       Deshalb wird das eigene Rollen ausgenommen. */
    window.addEventListener('resize', zu);
    window.addEventListener('scroll', e=>{
      if(liste && (e.target===liste || (e.target && e.target.nodeType===1 && liste.contains(e.target)))) return;
      zu();
    }, true);
  }
  function zu(){
    if(!offenerKnopf) return;
    offenerKnopf.setAttribute('aria-expanded','false');
    offenerKnopf=null; liste.classList.remove('offen'); liste.innerHTML='';
  }
  function stellen(knopf){
    const r=knopf.getBoundingClientRect();
    liste.style.visibility='hidden'; liste.classList.add('offen');
    liste.style.left='0px'; liste.style.top='0px';
    const lb=liste.offsetWidth, lh=liste.offsetHeight;
    let x=r.left, y=r.bottom+6;
    if(y+lh>window.innerHeight-8) y=Math.max(8, r.top-lh-6);      /* nach oben klappen */
    if(y+lh>window.innerHeight-8) y=Math.max(8, window.innerHeight-lh-8);
    x=Math.max(8, Math.min(x, window.innerWidth-lb-8));
    liste.style.left=Math.round(x)+'px'; liste.style.top=Math.round(y)+'px';
    liste.style.visibility='';
  }
  /* knopf: der Knoten. eintraege: [{wert,text,ton,kopf}]. wert: der jetzige.
     aufWahl(neu): wird gerufen, wenn gewaehlt wurde. */
  function auf(knopf, eintraege, wert, aufWahl){
    bauen();
    if(offenerKnopf===knopf){ zu(); return; }
    zu();
    offenerKnopf=knopf; knopf.setAttribute('aria-expanded','true');
    eintraege.forEach(e=>{
      if(e.kopf){ const h=document.createElement('div'); h.className='akopf'; h.textContent=e.kopf; liste.append(h); }
      const b=document.createElement('button'); b.type='button';
      b.innerHTML='<span>'+esc(e.text)+'</span>'+(e.ton?'<span class="ton">'+esc(e.ton)+'</span>':'');
      if(e.wert===wert) b.className='an';
      b.onclick=()=>{ const w=e.wert; zu(); aufWahl(w); };
      liste.append(b);
    });
    stellen(knopf);
  }
  /* Der Knopf selbst. `beschriftung(wert)` liefert, was darauf steht. */
  function knopf(hole, aufWahl, titel){
    const b=document.createElement('button'); b.type='button'; b.className='awahl';
    b.setAttribute('aria-haspopup','listbox'); b.setAttribute('aria-expanded','false');
    if(titel) b.title=titel;
    b.innerHTML='<span class="wert"></span><span class="ton"></span><i class="i ic-chevron-down"></i>';
    b._auffrischen=()=>{
      const {wert, text, ton}=hole();
      b.querySelector('.wert').textContent=text;
      b.querySelector('.ton').textContent=ton||'';
      b.dataset.wert=wert;
    };
    b.onclick=()=>{ const {wert, eintraege}=hole(); auf(b, eintraege, wert, aufWahl); };
    b._auffrischen();
    return b;
  }
  return { knopf, zu };
})();

/* ================================================================
   Das schwebende PDF-Fenster

   Es zeigt EIN PDF, frei verschiebbar, an der unteren rechten Ecke
   skalierbar, mit „X" zu schliessen. Die Seite wird immer GANZ
   gezeigt: eingepasst in die Flaeche, nie beschnitten.

   Es ist bewusst vom Safari-Betrachter getrennt. Der ist die
   empfindlichste Stelle des Projekts und wird nicht angefasst; dieses
   Fenster ist neuer, eigener Code und teilt mit ihm nichts als die
   Bibliothek PDF.js.

   Es gibt beliebig viele davon — wer „Alt 1" gegen „Alt 2" halten
   will, macht beide auf. Jedes traegt die Kennung seiner Datei; ein
   zweiter Tipp auf dieselbe Datei holt das vorhandene Fenster nach
   vorn, statt ein zweites danebenzustellen.
   ================================================================ */
/* Was nach der Stimmenwahl geschieht. Voreingestellt bleibt das Fenster
   stehen; wer viele Blaetter am Stueck zuordnet, stellt auf „schließen" und
   spart je Blatt einen Griff. Eigener Speicher, v3 liest ihn nicht. */
const PDFW_ZU_KEY='rb_pdfw_zu';
function pdfwZuNachWahl(){
  try{ return localStorage.getItem(PDFW_ZU_KEY)==='wahl'; }catch(e){ return false; }
}
function pdfwZuNachWahlSetzen(an){
  try{ localStorage.setItem(PDFW_ZU_KEY, an?'wahl':'knopf'); }catch(e){}
}
window.pdfwZuNachWahl=pdfwZuNachWahl;
window.pdfwZuNachWahlSetzen=pdfwZuNachWahlSetzen;

const PDFW = (function(){
  const fenster=new Map();          /* kennung -> Zustand */
  let obenZ=96, fang=null, versatz=0, letzterKasten=null;

  function fangFlaeche(){
    if(!fang) fang=document.getElementById('pdfwFang');
    return fang;
  }
  /* Ein neues Fenster steht nicht auf dem alten, sondern versetzt daneben —
     sonst sieht es beim zweiten Aufmachen so aus, als sei nichts geschehen. */
  function neuerKasten(){
    const B=window.innerWidth, H=window.innerHeight;
    if(letzterKasten){
      versatz=(versatz+1)%6;
      const k={...letzterKasten, x:letzterKasten.x+26*versatz, y:letzterKasten.y+26*versatz};
      return k;
    }
    const h=Math.min(Math.round(H*0.78), 760);
    const b=Math.min(Math.round(h*0.78), Math.round(B*0.6), 620);
    return { x:Math.max(12, B-b-24), y:Math.max(12, Math.round((H-h)/2)), b, h };
  }
  function einpassenInsBild(k){
    const B=window.innerWidth, H=window.innerHeight;
    k.b=Math.max(240, Math.min(k.b, B-16));
    k.h=Math.max(200, Math.min(k.h, H-16));
    k.x=Math.max(8, Math.min(k.x, B-k.b-8));
    k.y=Math.max(8, Math.min(k.y, H-k.h-8));
    return k;
  }
  function anwenden(f){
    f.knoten.style.left=f.kasten.x+'px'; f.knoten.style.top=f.kasten.y+'px';
    f.knoten.style.width=f.kasten.b+'px'; f.knoten.style.height=f.kasten.h+'px';
  }
  function hervorholen(f){
    f.knoten.style.zIndex=++obenZ;
    fenster.forEach(x=>{ if(x!==f) delete x.knoten.dataset.oben; });
    f.knoten.dataset.oben='1';
  }
  function oberstes(){
    let best=null;
    fenster.forEach(f=>{ if(!best || +f.knoten.style.zIndex > +best.knoten.style.zIndex) best=f; });
    return best;
  }

  /* Verschieben und Skalieren. Kein `setPointerCapture` — statt dessen faengt
     eine Flaeche ueber allem die Zeiger ab. Capture und Canvas vertragen sich
     in Safari nicht zuverlaessig, und die Fangflaeche haelt den Zug auch
     dann, wenn der Finger ueber einen Knopf faehrt. */
  function ziehen(f, knoten, art){
    knoten.addEventListener('pointerdown', e=>{
      if(e.button!==undefined && e.button!==0) return;
      if(art==='verschieben' && e.target.closest('button')) return;
      e.preventDefault(); hervorholen(f);
      const x0=e.clientX, y0=e.clientY, k0={...f.kasten};
      document.body.dataset.pdfwZieht='1'; fangFlaeche();
      const bewegen=ev=>{
        const dx=ev.clientX-x0, dy=ev.clientY-y0;
        if(art==='verschieben'){ f.kasten.x=k0.x+dx; f.kasten.y=k0.y+dy; }
        else { f.kasten.b=k0.b+dx; f.kasten.h=k0.h+dy; }
        einpassenInsBild(f.kasten); anwenden(f);
        /* Waehrend des Zuges wird NICHT neu gerechnet — das Blatt wird nur
           per CSS mitgezogen. Ein Neuzeichnen je Bild waere bei 460 Saetzen
           die eine Stelle, an der es hakt. Scharf wird es beim Loslassen. */
        if(art==='skalieren') grobEinpassen(f);
      };
      const loslassen=()=>{
        document.removeEventListener('pointermove', bewegen);
        document.removeEventListener('pointerup', loslassen);
        document.removeEventListener('pointercancel', loslassen);
        delete document.body.dataset.pdfwZieht;
        letzterKasten={...f.kasten};
        if(art==='skalieren') zeichnen(f);
      };
      document.addEventListener('pointermove', bewegen);
      document.addEventListener('pointerup', loslassen);
      document.addEventListener('pointercancel', loslassen);
    });
  }

  function flaeche(f){
    const cs=getComputedStyle(f.buehne), p=n=>parseFloat(cs[n])||0;
    return { b:f.buehne.clientWidth - p('paddingLeft') - p('paddingRight'),
             h:f.buehne.clientHeight - p('paddingTop') - p('paddingBottom') };
  }
  function grobEinpassen(f){
    const c=f.buehne.querySelector('canvas'); if(!c) return;
    const nb=+c.dataset.nb, nh=+c.dataset.nh; if(!nb||!nh) return;
    const fl=flaeche(f); if(fl.b<20||fl.h<20) return;
    const s=Math.min(fl.b/nb, fl.h/nh);
    c.style.width=Math.max(1,Math.round(nb*s))+'px';
    c.style.height=Math.max(1,Math.round(nh*s))+'px';
  }
  async function zeichnen(f){
    if(!f.doc) return;
    const meins=++f.zeichenLauf;
    const fl=flaeche(f); if(fl.b<20||fl.h<20) return;
    let s;
    try{ s=await f.doc.getPage(f.seite); }catch(e){ return; }
    if(meins!==f.zeichenLauf) return;
    const eins=s.getViewport({scale:1});
    /* Immer der ganze Inhalt: die Seite wird eingepasst, nie beschnitten. */
    const passe=Math.min(fl.b/eins.width, fl.h/eins.height);
    /* Auf dem Bildschirm des iPads liegen zwei Geraetepunkte auf einem
       CSS-Punkt. Ohne diesen Faktor waere die Note weich. */
    const dpr=Math.min(window.devicePixelRatio||1, 3);
    const vp=s.getViewport({scale:passe*dpr});
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
    c.dataset.nb=eins.width; c.dataset.nh=eins.height;
    c.style.width=Math.max(1,Math.round(eins.width*passe))+'px';
    c.style.height=Math.max(1,Math.round(eins.height*passe))+'px';
    try{ await s.render({canvasContext:c.getContext('2d'), viewport:vp}).promise; }
    catch(e){ return; }
    if(meins!==f.zeichenLauf) return;
    f.buehne.innerHTML=''; f.buehne.append(c);
  }
  function blaetternZeigen(f){
    f.bl.hidden = f.seiten<=1;
    f.zahl.textContent = f.seite+' / '+f.seiten;
    f.zurueck.disabled = f.seite<=1;
    f.vor.disabled = f.seite>=f.seiten;
  }
  function blaettern(f,d){
    const neu=Math.min(f.seiten, Math.max(1, f.seite+d));
    if(neu===f.seite) return;
    f.seite=neu; blaetternZeigen(f); zeichnen(f);
  }

  function bauen(opt){
    const k=document.createElement('div');
    k.className='pdfw'; k.setAttribute('role','dialog'); k.setAttribute('aria-label','PDF-Vorschau');
    k.innerHTML=
      '<div class="pdfw-kopf">'
      +  '<div style="flex:1;min-width:0"><div class="nm"></div><div class="sub"></div></div>'
      +  '<div class="pdfw-blaettern" hidden>'
      +    '<button class="pdfw-knopf" data-r="zurueck" title="Seite zurück"><i class="i ic-chevron-left"></i></button>'
      +    '<span class="zahl"></span>'
      +    '<button class="pdfw-knopf" data-r="vor" title="Seite vor"><i class="i ic-chevron-right"></i></button>'
      +  '</div>'
      +  '<button class="pdfw-knopf" data-r="zu" title="Schließen"><i class="i ic-x"></i></button>'
      + '</div>'
      + '<div class="pdfw-buehne"></div>'
      + '<div class="pdfw-griff" title="Ziehen zum Skalieren"></div>';
    document.body.append(k);
    /* Die Knoten EINMAL holen und festhalten — Falle 3 aus CLAUDE.md. */
    const f={ kennung:opt.kennung, knoten:k,
      kopf:k.querySelector('.pdfw-kopf'), buehne:k.querySelector('.pdfw-buehne'),
      griff:k.querySelector('.pdfw-griff'),
      nm:k.querySelector('.nm'), sub:k.querySelector('.sub'),
      bl:k.querySelector('.pdfw-blaettern'), zahl:k.querySelector('.zahl'),
      zurueck:k.querySelector('[data-r=zurueck]'), vor:k.querySelector('[data-r=vor]'),
      doc:null, seite:1, seiten:1, lauf:0, zeichenLauf:0,
      kasten:einpassenInsBild(neuerKasten()), wahlKnopf:null };
    k.querySelector('[data-r=zu]').onclick=()=>schliessen(f.kennung);
    f.zurueck.onclick=()=>blaettern(f,-1);
    f.vor.onclick=()=>blaettern(f,1);
    k.addEventListener('pointerdown', ()=>hervorholen(f), true);
    ziehen(f, f.kopf, 'verschieben');
    ziehen(f, f.griff, 'skalieren');
    anwenden(f);
    fenster.set(f.kennung, f);
    return f;
  }

  async function oeffnen(opt){
    const da=fenster.get(opt.kennung);
    const f = da || bauen(opt);
    hervorholen(f);
    letzterKasten={...f.kasten};
    f.nm.textContent = opt.name || (opt.datei && opt.datei.name) || 'PDF';
    f.sub.textContent = opt.unter || '';
    /* Die Stimmen-Wahl im Kopf, links vom Schliessen. Waehlen und
       weitergehen sind ein Handgriff, nicht zwei an entgegengesetzten
       Ecken. */
    if(opt.wahl){
      /* ZUERST hinterlegen, dann bauen: Der Knopf fragt seinen Zustand schon
         beim Bauen ab. Andersherum griffe er ins Leere, und das Fenster
         stuende ohne Wahl da. */
      f.wahl=opt.wahl;
      if(!f.wahlKnopf){
        f.wahlKnopf=AWAHL.knopf(
          ()=>f.wahl.hole(),
          /* `aufWahl` kann in den Bestand schreiben und damit erst spaeter
             fertig sein. Darum ueber ein Promise — sonst zeigte der Knopf
             noch den alten Wert. */
          neu=>Promise.resolve(f.wahl.aufWahl(neu)).then(()=>{
                 /* Wer viele Blaetter am Stueck zuordnet, will nach der Wahl
                    weiter und nicht erst schliessen. Der Schalter im Setup
                    entscheidet; voreingestellt bleibt das Fenster stehen. */
                 if(pdfwZuNachWahl()) schliessen(f.kennung);
                 else if(fenster.has(f.kennung)) f.wahlKnopf._auffrischen();
               }),
          'Stimme festlegen');
        f.kopf.insertBefore(f.wahlKnopf, f.kopf.querySelector('[data-r=zu]'));
      }
      f.wahlKnopf.hidden=false; f.wahlKnopf._auffrischen();
    } else if(f.wahlKnopf) f.wahlKnopf.hidden=true;
    if(da) return f;                       /* schon offen: nur nach vorn geholt */

    const meins=++f.lauf;
    f.bl.hidden=true;
    f.buehne.innerHTML='<div class="pdfw-lade">Wird geladen …</div>';
    let neu;
    try{
      const puffer=await opt.datei.arrayBuffer();
      if(meins!==f.lauf) return f;
      neu=await pdfjsLib.getDocument({data:new Uint8Array(puffer)}).promise;
    }catch(e){
      if(meins!==f.lauf) return f;
      f.buehne.innerHTML='<div class="pdfw-lade">Diese Datei lässt sich nicht anzeigen.</div>';
      return f;
    }
    if(meins!==f.lauf){ try{ neu.destroy(); }catch(e){} return f; }
    f.doc=neu; f.seiten=f.doc.numPages||1; f.seite=1;
    blaetternZeigen(f); zeichnen(f);
    return f;
  }
  function schliessen(kennung){
    const f=fenster.get(kennung); if(!f) return;
    f.lauf++; f.zeichenLauf++;
    if(f.doc){ try{ f.doc.destroy(); }catch(e){} f.doc=null; }
    f.knoten.remove(); fenster.delete(kennung);
    const o=oberstes(); if(o) o.knoten.dataset.oben='1';
  }
  function alleZu(){ [...fenster.keys()].forEach(schliessen); versatz=0; }
  /* Nach jedem Neuzeichnen der Vorschau: Was die Fenster anzeigen, kann sich
     geaendert haben. Die Wahrheit steht in der Vorschau, nicht im Fenster. */
  function auffrischen(){
    fenster.forEach(f=>{ if(f.wahlKnopf) f.wahlKnopf._auffrischen(); });
  }
  /* Escape schliesst das oberste Fenster — eines nach dem anderen. Die
     Stimmen-Liste faengt die Taste vorher ab, wenn sie offen ist.

     `stopImmediatePropagation` ist hier kein Zierrat: Das Setup haengt an
     derselben Taste und ginge sonst gleichzeitig eine Ebene zurueck. Ein
     Druck, zwei Wirkungen — man haette das Fenster geschlossen und stuende
     ploetzlich woanders. Der Betrachter meldet sich vor uns an und ist
     darum nicht betroffen. */
  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape' || !fenster.size) return;
    e.stopImmediatePropagation();
    const o=oberstes(); if(o) schliessen(o.kennung);
  });
  window.addEventListener('resize', ()=>{
    fenster.forEach(f=>{ einpassenInsBild(f.kasten); anwenden(f); zeichnen(f); });
  });
  return { oeffnen, schliessen, alleZu, auffrischen, anzahl:()=>fenster.size };
})();
/* Der Fang ist nicht ueberfluessig: `oeffnen` ist asynchron, und ein Fehler
   darin blieb sonst voellig stumm — kein Fenster, keine Meldung, nichts in
   der Konsole. Genau so ist die Stimmen-Wahl einmal unbemerkt ausgefallen. */
window.pdfVorschau = opt => PDFW.oeffnen(opt).catch(e=>{
  console.error('PDF-Vorschau fehlgeschlagen:', e);
  alert('Die Vorschau lässt sich nicht öffnen: '+(e&&e.message||e));
});
window.PDFW = PDFW;

/* keep search area visible: pin controls just below the header */
(function(){
  const header=document.querySelector('header'), controls=document.getElementById('controls');
  function sync(){ if(document.body.dataset.o==='land'){ controls.style.top=''; return; }
                   controls.style.top=(header.offsetHeight-1)+'px'; }
  if(window.ResizeObserver) new ResizeObserver(sync).observe(header);
  window.addEventListener('resize',sync); sync(); setTimeout(sync,300);
})();

function getEditorName(){ return localStorage.getItem('rb_editor')||''; }
function setEditorName(v){ localStorage.setItem('rb_editor', v||''); }

/* ---- fit layout ---- */
function computeFit(n,natW,natH,W,H,gap){
  if(n<=2){ const s=Math.min(H/natH,(W-gap*(n-1))/(n*natW)); return {scale:Math.max(s,0.05),center:true}; }
  return {scale:Math.max(H/natH,0.05),center:false};
}
/* Eine Notiz-Seite auf ein fertiges Blatt zeichnen. Der Editor arbeitet in
   einer anderen Groesse als die Buehne, deshalb traegt jede Seite ihre eigene
   Bezugsgroesse; hier wird auf das Verhaeltnis umgerechnet. `drawStroke`
   selbst bleibt unberuehrt — es ist derselbe Baustein, den der Editor nutzt,
   und damit sieht die Notiz auf der Buehne genauso aus wie beim Schreiben. */
function notizZeichnen(cvs, seite){
  if(!cvs || !seite || !seite.strokes || !seite.strokes.length) return;
  /* Erst auf eine EIGENE, durchsichtige Flaeche, dann als Ganzes aufs Blatt.
     Direkt auf das Blatt zu zeichnen waere kuerzer und falsch: Der Radierer
     arbeitet mit `destination-out` und wuerde dann Loecher in die Noten
     reissen statt nur die eigenen Striche zu entfernen. Im Editor liegt die
     Zeichenflaeche aus demselben Grund ueber dem Blatt und nicht darauf. */
  const f = seite.w ? cvs.width/seite.w : 1;
  const eb = document.createElement('canvas');
  eb.width = cvs.width; eb.height = cvs.height;
  const e = eb.getContext('2d');
  e.scale(f,f);
  seite.strokes.forEach(s=>{ try{ drawStroke(e,s); }catch(err){} });
  cvs.getContext('2d').drawImage(eb,0,0);
}
const _pdfCache={};
async function loadPdf(url){
  if(_pdfCache[url])return _pdfCache[url];
  /* Fehlt die Bibliothek, hiess der Fehler bisher „Can't find variable:
     pdfjsLib" — auf dem iPad ein Satz, mit dem niemand etwas anfangen kann.
     Er sagt jetzt, was zu tun ist. */
  if(!window.pdfjsLib) throw new Error(
    'Der Noten-Baustein (PDF.js) ist nicht geladen. Schliesse BandStand ganz '
    +'und starte es mit Netz noch einmal — dann holt die App ihn nach.');
  // Bytes selbst holen und an PDF.js geben – robuster in Safari & mit Service Worker als getDocument(url)
  const buf=await (await fetch(encodeURI(url))).arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  _pdfCache[url]=doc; return doc;
}
/* Sicherheitsnetz: Was auch immer beim Rechnen schiefgeht — am Ende MUSS das
   Blatt in die Flaeche passen. Gemessen wird nach dem Zeichnen, und nur
   verkleinert, nie vergroessert. Ohne dieses Netz war das Blatt im Querformat
   zu gross und lief aus der Buehne heraus; erkennbar daran, dass es nicht mehr
   mittig sass. */
function passeBlattEin(){
  const fit=document.getElementById('vFit'); if(!fit) return;
  const cs=getComputedStyle(fit);
  const p=n=>parseFloat(cs[n])||0;
  const cw=fit.clientWidth  - p('paddingLeft') - p('paddingRight');
  const ch=fit.clientHeight - p('paddingTop')  - p('paddingBottom');
  const seiten=[...fit.querySelectorAll('.pg')];
  if(!seiten.length || cw<40 || ch<40) return;
  const b=parseFloat(seiten[0].style.width), h=parseFloat(seiten[0].style.height);
  if(!b || !h) return;
  const f=Math.min(1, cw/b, ch/h);
  if(f>0.999) return;
  seiten.forEach(s=>{ const sb=parseFloat(s.style.width), sh=parseFloat(s.style.height);
    s.style.width=(sb*f)+'px'; s.style.height=(sh*f)+'px'; });
}

/* Das Blatt neu einpassen, wenn sich die Flaeche geaendert hat — beim Drehen,
   beim Klappen der Seitenleiste, beim Verschieben des Docks. Vorher hing das
   allein am resize-Ereignis, und auf das ist unter iOS kein Verlass; nach dem
   Drehen blieb das Blatt in der Groesse der alten Ausrichtung stehen. */
let _blattUhr;
function blattNeuZeichnen(sofort){
  clearTimeout(_blattUhr);
  const tu=()=>{
    if(!document.getElementById('viewer').classList.contains('open') || !CURRENT) return;
    /* Seit Schritt 10 kann statt des Leadsheets eine Stimme auf dem Blatt
       liegen. Sie ist ein Pseudo-Stueck mit einer Blob-Adresse und geht
       denselben Weg wie ein importiertes PDF. */
    const stimme = window.aktiveStimme ? window.aktiveStimme() : null;
    if(stimme) renderPdfFit(stimme);
    else if(CURRENT.art==='leadsheet') renderLeadFit(CURRENT);
    else if(CURRENT.art==='chordsheet') renderChordFit(CURRENT);
    else if(CURRENT.isEdit) renderUserFit(CURRENT); else renderPdfFit(CURRENT);
  };
  if(sofort) tu(); else _blattUhr=setTimeout(tu,180);
}
window.blattNeuZeichnen=blattNeuZeichnen;

/* Polsterung der Einpass-Flaeche, in Pixeln abgelesen (x = links+rechts). */
function fitRand(fit){
  const cs=getComputedStyle(fit);
  const l=parseFloat(cs.paddingLeft)||0, r=parseFloat(cs.paddingRight)||0;
  const t=parseFloat(cs.paddingTop)||0,  b=parseFloat(cs.paddingBottom)||0;
  return { x:l+r, y:t+b };
}
async function renderPdfFit(t){
  const fit=document.getElementById('vFit'); fit.classList.remove('center');
  /* Beim Drehen liegt das alte Blatt schon da und wird nur neu eingepasst.
     Es dann durch „Laedt…" zu ersetzen, laesst die Noten kurz verschwinden —
     genau das Flackern, das Jens am 28. Juli gemeldet hat. Das alte Blatt
     bleibt deshalb stehen, bis das neue fertig gezeichnet ist. Nur wenn gar
     nichts da ist, erscheint der Hinweis. */
  const stehtSchon = !!fit.querySelector('.pg');
  if(!stehtSchon) fit.innerHTML='<div class="vlade">Lädt…</div>';
  /* Die EINE Zeile, die Schritt 1c am Betrachter aendert: Sie beschafft den
     Verweis. Wie gezeichnet und wie eingepasst wird, bleibt unberuehrt —
     samt dem Rueckfallweg unten, der `t.f` ebenfalls schon gefuellt findet. */
  await urlSichern(t);
  try{
    const doc=await loadPdf(t.f); const n=doc.numPages;
    const p1=await doc.getPage(1); const v1=p1.getViewport({scale:1});
    /* Das Seitenverhaeltnis kommt aus dem Viewport der ersten Seite und ersetzt
       jede feste Annahme. Die Buehnenbreite haengt davon ab, also erst neu
       rechnen, dann messen — sonst misst man die alte Breite. */
    const verh=v1.width/v1.height;
    if(window.SHEET_RATIO!==undefined && Math.abs(verh-window.SHEET_RATIO)>0.002){
      window.SHEET_RATIO=verh; if(window.layout) window.layout();
    }
    const fsMode=document.getElementById('viewer').classList.contains('fullscreen');
    const box=fit.getBoundingClientRect();
    /* Der Rand der Einpass-Flaeche haelt seit Schritt 6 an der Dock-Kante
       94 px frei, sonst 16 px, jeweils zuzueglich der sicheren Raender. Er
       wird abgelesen statt angenommen, damit das Blatt nie unter das Dock
       laeuft. Bei der frueheren festen Polsterung von 10 px kommen genau die
       alten Werte 24 und 20 heraus. */
    const rand=fitRand(fit);
    const W=(fsMode?window.innerWidth:(box.width||window.innerWidth))-rand.x-4;
    const H=(fsMode?window.innerHeight:(box.height||window.innerHeight))-rand.y;
    /* In der Buehne ist genau ein Blatt Platz. computeFit stellt ein- bis
       zweiseitige Stuecke nebeneinander — jede Seite waere dann halb so gross.
       Deshalb dort der Hoehen-Pfad; weitere Seiten erreicht man durch Wischen.
       Im Vollbild und im Hochformat bleibt das Nebeneinander erhalten, dort
       ist es gerade der Vorteil (kein Umblaettern beim Spielen). */
    /* Nebeneinander lohnt nur im Vollbild im QUERformat — dort sind zwei
       Seiten je rund 570 px breit. Im Hochformat waeren es je 400 px, und
       in der Buehne nur die halbe Bahn. Sonst gilt: ein Blatt, volle Hoehe. */
    const einBlatt = !(fsMode && document.body.dataset.o==='land');
    /* Die Hoehe gibt den Ton an, aber die Breite darf nicht ueberlaufen. Im
       Querformat folgt die Buehnenbreite ohnehin aus dem Verhaeltnis, dort
       aendert die Begrenzung nichts. Im Hochformat schon: Ein Blatt im
       Letter-Format wurde 828 px breit, verfuegbar waren 802 — der rechte Rand
       lag ausserhalb und war nur durch Wischen erreichbar. */
    const {scale,center} = einBlatt
      ? { scale: Math.max(Math.min(H/v1.height, W/v1.width), 0.05), center: (n===1) }
      : computeFit(n,v1.width,v1.height,W,H,14);
    fit.classList.toggle('center',center);
    /* Erst zeichnen, dann tauschen. Solange die neuen Seiten entstehen, bleibt
       das alte Blatt stehen; erst am Ende wird in einem Zug ersetzt. Vorher
       war die Flaeche waehrend des Zeichnens leer, und beim Drehen sah man das
       als Flackern. */
    /* Die handschriftliche Notiz liegt als eigener Satz daneben und wird hier
       ueber das fertige Blatt gelegt. Sie wird NICHT ins PDF geschrieben —
       das Blatt bleibt unberuehrt und laesst sich jederzeit blank zeigen. */
    const ebene = t.bsId ? await BS.notizLesen(t.bsId).catch(()=>null) : null;
    const neu=document.createDocumentFragment();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=n;i++){ const page=await doc.getPage(i); const vp=page.getViewport({scale:scale*dpr});
      const cvs=document.createElement('canvas'); cvs.className='pg';
      cvs.width=Math.round(vp.width); cvs.height=Math.round(vp.height);
      cvs.style.width=(vp.width/dpr)+'px'; cvs.style.height=(vp.height/dpr)+'px';
      neu.append(cvs); await page.render({canvasContext:cvs.getContext('2d'),viewport:vp}).promise;
      notizZeichnen(cvs, ebene && ebene.seiten && ebene.seiten[i-1]); }
    fit.replaceChildren(neu);
    passeBlattEin();
    /* Dauer des Blatts nach einem Drehen nachtragen — siehe Setup, „Über". */
    if(window.drehBlattStart && window.drehZeiten){
      window.drehZeiten.blatt = Math.round(performance.now()-window.drehBlattStart);
      window.drehBlattStart = 0;
    }
  }catch(e){
    /* Fallback: PDF.js nicht verfügbar → native Anzeige, aber per Iframe-Breite auf die HÖHE eingepasst.
       Iframe-Breite = Seitenbreite bei voller Höhe → der native Betrachter (view=FitH) füllt die Höhe. */
    const frame=document.getElementById('vFrame'), holder=frame.parentElement;
    fit.style.display='none'; fit.innerHTML='';
    const H=window.innerHeight, W=window.innerWidth,
          ratio=(window.SHEET_RATIO||210/297); // je PDF, nicht mehr fest US-Letter
    const iw=Math.min(W, Math.round(H*ratio));
    holder.style.display='flex'; holder.style.justifyContent='center'; holder.style.overflow='hidden';
    frame.style.display='block'; frame.style.width=iw+'px'; frame.style.height='100%'; frame.style.margin='0 auto';
    frame.src=encodeURI(t.f)+'#toolbar=0&navpanes=0&view=FitH';
  }
}
/* ---- Stufe 4: Weitergeben und iReal Pro (20. August) ---------------------
   Ein Leadsheet laesst sich auf drei Arten weitergeben, und sie meinen
   Verschiedenes. Die Quelle ist ein paar Kilobyte gross und laesst dem
   Empfaenger seine eigene Tonart — das ist die Weitergabe unter Kollegen,
   die BandStand haben. Das Blatt als Bild sieht bei allen gleich aus und
   braucht kein Programm. Das Blatt mit den Notizen ist eine Probenvorlage. */

/* Die Akkorde des GESETZTEN Blattes, Takt fuer Takt. Sie stehen dort schon
   in der richtigen Tonart; aus der Quelle gelesen waeren sie die alte. */
/* Die Vorzeichen IN einem Akkordnamen sind eigene Zeichen der Notenschrift
   und keine Buchstaben. Sie stehen nicht dort, wo man sie vermutet: Verovio
   nimmt für Akkordsymbole nicht die Zeichen der Noten (U+E260 ff.), sondern
   die eigenen Kurzformen U+EA64 und U+EA66. Am 20. August aus dem fertigen
   Blatt ausgelesen, nachdem die erste Vermutung stumm danebenlag — aus
   „E♭maj7" wurde „Emaj7". */
const SMUFL_B='\uea64', SMUFL_KREUZ='\uea66', SMUFL_AUFL='\uea65';
function lsAkkorde(svgs){
  const takte=[];
  for(const svg of svgs){
    let doc; try{ doc=new DOMParser().parseFromString(svg,'image/svg+xml'); }catch(e){ continue; }
    doc.querySelectorAll('g.measure').forEach(m=>{
      const namen=[];
      m.querySelectorAll('g.harm').forEach(h=>{
        const roh=(h.textContent||'').replace(/\s+/g,'');
        const t=roh.split(SMUFL_B).join('b').split(SMUFL_KREUZ).join('#')
                   .split(SMUFL_AUFL).join('').trim();
        if(t) namen.push(t);
      });
      takte.push(namen);
    });
  }
  return takte;
}
/* Von unserer Schreibweise in die von iReal Pro. Dort heisst die grosse
   Septime `^`, die kleine Terz `-`, halbvermindert `h` und vermindert `o`. */
function irealAkkord(a){
  let s=String(a||'').trim();
  if(!s) return '';
  const m=/^([A-G][b#]?)(.*)$/.exec(s);
  if(!m) return '';
  let grund=m[1], rest=m[2];
  let bass='';
  const bm=/\/([A-G][b#]?)\s*$/.exec(rest);
  if(bm){ bass='/'+bm[1]; rest=rest.slice(0, bm.index); }
  rest=rest.replace(/[()]/g,'');
  /* „add" ist in iReal Pro nicht nötig: D7(add#11) heißt dort D7#11. */
  rest=rest.replace(/add/gi,'');
  rest=rest.replace(/^min7b5$/i,'h7').replace(/^-7b5$/,'h7')
           .replace(/^m7b5$/i,'h7').replace(/^ø7?$/,'h7')
           .replace(/^dim7$/i,'o7').replace(/^°7$/,'o7')
           .replace(/^dim$/i,'o').replace(/^°$/,'o')
           .replace(/^maj/i,'^').replace(/^ma(?=\d|$)/i,'^').replace(/^△/,'^').replace(/^Δ/,'^')
           .replace(/^min/i,'-').replace(/^mi(?=\d|$)/i,'-').replace(/^m(?=\d|$)/,'-')
           .replace(/^aug$/i,'+')
           .replace(/^\^$/,'');   /* ein blosses „maj" ist der Dreiklang */
  return grund+rest+bass;
}
/* Die Taktart der Quelle — iReal Pro will sie vorweg. */
function lsTaktart(quelle){
  const m=/<beats>\s*(\d+)\s*<\/beats>\s*<beat-type>\s*(\d+)\s*<\/beat-type>/.exec(quelle||'');
  if(m) return m[1]+m[2];
  const a=/(^|\n)M:\s*(\d+)\s*\/\s*(\d+)/.exec(quelle||'');
  if(a) return a[2]+a[3];
  return '44';
}
async function irealAdresse(t){
  const b = await lsBlaetter(t);
  const takte = lsAkkorde(b.svgs);
  if(!takte.length || !takte.some(x=>x.length)) return null;
  let quelle=''; try{ quelle=await leadQuelle(t); }catch(e){}
  const taktart = lsTaktart(quelle);
  /* Ein Takt ohne eigenen Akkord uebernimmt den vorigen — iReal Pro schreibt
     dafuer einen Schraegstrich. */
  const stuecke = takte.map(namen=>
    namen.length ? namen.map(irealAkkord).filter(Boolean).join(' ') : ' ');
  /* Die Akkordfolge steht zwischen Taktstrichen und nicht frei. Bis zum
     21. August fing sie ohne oeffnenden Strich an und hoerte ohne
     Schlussstrich auf; iReal Pro startete, meldete aber „Datei konnte nicht
     geoeffnet werden". */
  const folge = '['+'T'+taktart+'*A' + stuecke.join(' |') + ' ]';
  /* Am 21. August wies iOS die Adresse als „Invalid URL" zurueck: Eckige
     Klammern sind fuer IPv6-Adressen reserviert und in einer URL nicht
     zulaessig; ein Taktstrich ebenso wenig. Kodiert wird deshalb wieder alles,
     was nicht in eine URL gehoert — die Raute zuerst, sonst machte `F#-7` den
     Rest zur Sprungmarke. `encodeURI` laesst `=` stehen, und das ist hier das
     Trennzeichen zwischen den Feldern. */
  const zeichen = x => encodeURI(String(x))
    .replace(/#/g,'%23').replace(/&/g,'%26').replace(/=/g,'%3D')
    .replace(/\?/g,'%3F').replace(/\+/g,'%2B');
  const teile = [ (t.t||'Stück'), (t.c||''), 'Medium Swing',
                  (t._lsGelesen||'C'), 'n', folge ];
  return 'irealbook://' + teile.map(zeichen).join('=');
}

/* Das Blatt als Bild — mit oder ohne die eigenen Notizen. */
async function lsAlsBild(t, mitNotiz){
  const b = await lsBlaetter(t);
  const notiz = mitNotiz ? b.notiz : null;
  const bilder=[];
  for(let i=0;i<b.svgs.length;i++){
    const im = await svgAlsBild(b.svgs[i]);
    const bw = im.naturalWidth||LS_BREITE, bh = im.naturalHeight||LS_HOEHE;
    const cv=document.createElement('canvas');
    cv.width=bw; cv.height=bh;
    const g=cv.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,bw,bh);
    g.drawImage(im,0,0,bw,bh);
    const seite = notiz && notiz.seiten && notiz.seiten[i];
    if(seite && seite.strokes && seite.strokes.length) notizZeichnen(cv, seite);
    const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
    bilder.push(new File([blob],
      safeName(t.t) + (b.svgs.length>1 ? ' '+(i+1) : '')
      + (t._lsGelesen ? ' ('+t._lsGelesen+')' : '') + '.png', {type:'image/png'}));
  }
  return bilder;
}

async function lsWeitergeben(dateien, titel){
  if(!dateien || !dateien.length) return;
  try{
    if(navigator.canShare && navigator.canShare({files:dateien})){
      await navigator.share({files:dateien, title:titel}); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  /* Ohne Teilen-Blatt bleibt der Weg über einen Verweis, den man selbst
     sichert. Auf dem Mac im Browser ist das der Normalfall. */
  const d=dateien[0];
  const url=URL.createObjectURL(d);
  const a=document.createElement('a'); a.href=url; a.download=d.name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function lsTeilenBlatt(t){
  openSheet(card=>{
    card.innerHTML='<h2>Weitergeben</h2><div class="muted" style="margin:-6px 0 14px">'
      +'Drei Wege, und sie meinen Verschiedenes.</div>';
    const zeilen=[];
    const mach=(titel, unter, knopfText, tu)=>{
      const z=document.createElement('div'); z.className='srow';
      z.innerHTML='<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(titel)+'</div>'
        +'<div class="sb">'+unter+'</div></div>';
      const b=document.createElement('button'); b.className='btn ghost'; b.textContent=knopfText;
      b.onclick=async()=>{ closeSheet();
        try{ await beiArbeit('Wird vorbereitet…','', tu); }
        catch(e){ alert('Fehlgeschlagen: '+(e&&e.message||e)); } };
      z.append(b); zeilen.push(z);
    };

    mach('Die Noten selbst',
      'Ein paar Kilobyte. Wer sie bekommt, wählt seine eigene Tonart und seine eigene Stimme.',
      'Datei', async()=>{
        const f=await fetchAsFile(t);
        if(!f) throw new Error('Zu diesem Leadsheet ist keine Datei hinterlegt.');
        await lsWeitergeben([f], t.t);
      });

    mach('Dieses Blatt als Bild',
      'So, wie es gerade vor Dir liegt — in dieser Tonart und dieser Notation. '
      +'Braucht kein Programm und sieht bei allen gleich aus.',
      'Bild', async()=>{ await lsWeitergeben(await lsAlsBild(t, false), t.t); });

    BS.notizLesen(LS.notizSchluessel(t.bsId, LS.ausgabe(t.bsId))).then(n=>{
      if(!n || !n.seiten || !n.seiten.some(x=>x&&x.strokes&&x.strokes.length)) return;
      const z=document.createElement('div'); z.className='srow';
      z.innerHTML='<div style="flex:1;min-width:0"><div style="font-weight:600">Blatt mit Deinen Notizen</div>'
        +'<div class="sb">Dasselbe Bild, mit dem, was Du daraufgeschrieben hast — eine Probenvorlage.</div></div>';
      const b=document.createElement('button'); b.className='btn ghost'; b.textContent='Bild mit Notiz';
      b.onclick=async()=>{ closeSheet();
        try{ await beiArbeit('Wird vorbereitet…','', async()=>{
          await lsWeitergeben(await lsAlsBild(t, true), t.t); }); }
        catch(e){ alert('Fehlgeschlagen: '+(e&&e.message||e)); } };
      z.append(b);
      const karte2=card.querySelector('.scard'); if(karte2) karte2.append(z);
    }).catch(()=>{});

    const c=document.createElement('div'); c.className='scard';
    zeilen.forEach(z=>c.append(z)); card.append(c);

    /* iReal Pro — die Changes, nicht das Blatt. Aus den Akkordsymbolen des
       gesetzten Blattes, also in der Tonart, die gerade eingestellt ist. */
    const ir=document.createElement('div'); ir.className='scard'; ir.style.marginTop='12px';
    const zr=document.createElement('div'); zr.className='srow';
    zr.innerHTML='<div style="flex:1;min-width:0"><div style="font-weight:600">Changes an iReal Pro</div>'
      +'<div class="sb">Nur die Akkorde, in der eingestellten Tonart. <b>Neuere Fassungen von '
      +'iReal Pro nehmen dieses ältere Verweis-Format nicht mehr an</b> und melden „Datei konnte '
      +'nicht geöffnet werden". Am 21. August so vorgefunden; das heutige Format wird gerade '
      +'untersucht.</div></div>';
    const bi=document.createElement('button'); bi.className='btn ghost'; bi.textContent='Öffnen';
    bi.onclick=async()=>{
      try{
        const adr=await irealAdresse(t);
        if(!adr){ alert('Auf diesem Blatt stehen keine Akkordsymbole.'); return; }
        closeSheet(); location.href=adr;
      }catch(e){ alert('Fehlgeschlagen: '+(e&&e.message||e)); }
    };
    /* Scheitert das Oeffnen, hilft nur der Verweis selbst. iReal Pro sagt
       nicht, WAS es nicht lesen konnte; wer ihn in der Hand hat, kann ihn in
       Safari einfuegen oder herschicken. */
    const bk=document.createElement('button'); bk.className='btn ghost';
    bk.textContent='Verweis kopieren'; bk.style.marginLeft='8px';
    bk.onclick=async()=>{
      try{
        const adr=await irealAdresse(t);
        if(!adr){ alert('Auf diesem Blatt stehen keine Akkordsymbole.'); return; }
        try{ await navigator.clipboard.writeText(adr); alert('Der Verweis liegt in der Zwischenablage.'); }
        catch(e){ prompt('Der Verweis — zum Kopieren markieren:', adr); }
      }catch(e){ alert('Fehlgeschlagen: '+(e&&e.message||e)); }
    };
    zr.append(bi, bk); ir.append(zr); card.append(ir);

    const row=document.createElement('div'); row.className='row'; row.style.marginTop='16px';
    row.innerHTML='<button class="btn ghost" id="tAb" style="flex:1">Schließen</button>';
    card.append(row);
    row.querySelector('#tAb').onclick=closeSheet;
  });
}

/* ================================================================
   Chord-Sheets hereinholen                                (21. August 2026)

   iReal Pro teilt als HTML-Datei, und darin steht je Stueck ein
   `irealb://`-Verweis. Eine Playlist bringt sie alle mit — derselbe Weg
   traegt also ein einzelnes Stueck und einen ganzen Bestand.

   Zugeordnet wird ueber den Namen, und das ist der bequeme Weg und zugleich
   der gefaehrliche: Ein Fehlgriff bleibt still, und wer es merkt, steht auf
   der Buehne. Deshalb wird gezeigt, was gefunden wurde, bevor geschrieben
   wird — dieselbe Regel wie beim Import von Noten.
   ================================================================ */
function irealAusText(txt){
  const gefunden=[];
  const re=/irealb:\/\/[^"'\s<>]+/g;
  let m;
  while((m=re.exec(String(txt||'')))){
    try{ const o=IR.lesen(m[0]); if(o.takte && o.takte.length) gefunden.push({o, url:m[0]}); }
    catch(e){}
  }
  return gefunden;
}

function irealBlatt(txt, dateiname){
  const stuecke = irealAusText(txt);
  if(!stuecke.length){
    alert('Darin steht kein Stück aus iReal Pro.\n\nErwartet wird die HTML-Datei, '
        + 'die iReal Pro beim Teilen erzeugt, oder ein Verweis, der mit „irealb://" beginnt.');
    return;
  }
  /* Was steht schon im Bestand? Verglichen wird ueber `norm` — dieselbe
     Normalisierung, mit der der Import seit dem 6. August dieselbe Frage
     beantwortet. */
  const vorhanden = new Map();
  (BS_KATALOG.titel||[]).forEach(t=>{
    const k=norm(t.titel||''); if(!k) return;
    if(!vorhanden.has(k)) vorhanden.set(k, []);
    vorhanden.get(k).push(t);
  });
  const zeilen = stuecke.map(x=>{
    const treffer = vorhanden.get(norm(x.o.titel)) || [];
    return { ...x, treffer, ziel: treffer.length===1 ? treffer[0].id : null, an:true };
  });
  const passend = zeilen.filter(z=>z.ziel).length;
  const mehrdeutig = zeilen.filter(z=>!z.ziel && z.treffer.length>1).length;
  const neu = zeilen.length - passend - mehrdeutig;

  openSheet(card=>{
    card.innerHTML='<h2>Aus iReal Pro</h2>';
    const kopf=document.createElement('div'); kopf.className='muted';
    kopf.style.margin='-6px 0 14px';
    kopf.innerHTML='<b>'+zeilen.length+'</b> Stück'+(zeilen.length===1?'':'e')+' gefunden'
      + (dateiname ? ' in „'+esc(dateiname)+'"' : '')+'. '
      + '<b>'+passend+'</b> '+(passend===1?'passt':'passen')+' zu einem Titel im Bestand, '
      + '<b>'+neu+'</b> '+(neu===1?'wird':'werden')+' neu angelegt'
      + (mehrdeutig ? ', <b>'+mehrdeutig+'</b> '+(mehrdeutig===1?'ist':'sind')
                      +' mehrdeutig und '+(mehrdeutig===1?'bleibt':'bleiben')+' liegen' : '')+'.';
    card.append(kopf);

    const l=document.createElement('div'); l.className='lbl'; l.style.margin='0 0 6px';
    l.textContent='Buch für die neuen Titel';
    const bf=document.createElement('input'); bf.className='txt';
    bf.value='iReal Pro'; card.append(l,bf);

    /* Eine Liste, aber keine vierhundert Zeilen: Gezeigt werden die ersten
       zwanzig, damit man sieht, was passiert. Der Rest zaehlt mit. */
    const li=document.createElement('div');
    li.style.cssText='margin:14px 0 0;max-height:34vh;overflow:auto';
    zeilen.slice(0,20).forEach(z=>{
      const r=document.createElement('div'); r.className='srow';
      const wo = z.ziel ? 'an vorhandenen Titel'
               : (z.treffer.length>1 ? 'mehrdeutig — bleibt liegen' : 'neuer Titel');
      r.innerHTML='<div style="flex:1;min-width:0"><div>'+esc(z.o.titel)+'</div>'
        +'<div class="sb">'+z.o.takte.length+' Takte · '+esc(z.o.tonart||'?')+' · '+wo+'</div></div>';
      li.append(r);
    });
    if(zeilen.length>20){
      const r=document.createElement('div'); r.className='muted'; r.style.padding='8px 2px';
      r.textContent='… und '+(zeilen.length-20)+' weitere';
      li.append(r);
    }
    card.append(li);

    const row=document.createElement('div'); row.className='row'; row.style.marginTop='16px';
    const ab=document.createElement('button'); ab.className='btn ghost'; ab.textContent='Abbrechen';
    ab.onclick=closeSheet;
    const luft=document.createElement('span'); luft.style.flex='1';
    const ok=document.createElement('button'); ok.className='btn';
    ok.textContent='Übernehmen';
    ok.onclick=async()=>{
      ok.disabled=true; ab.disabled=true;
      try{
        const zahl = await irealSchreiben(zeilen, bf.value.trim()||'iReal Pro');
        closeSheet();
        await loadLibrary(); render();
        alert(zahl+(zahl===1?' Chord-Sheet':' Chord-Sheets')+' übernommen.');
      }catch(e){
        ok.disabled=false; ab.disabled=false;
        alert('Fehlgeschlagen: '+(e&&e.message||e));
      }
    };
    row.append(ab, luft, ok); card.append(row); a11y(card);
  });
}

/* Geschrieben wird blockweise, aus demselben Grund wie beim Import von Noten:
   Wird die Seite mittendrin abgeraeumt, ist wenigstens das Geschriebene da.
   Ein Chord-Sheet wiegt allerdings ein paar hundert Zeichen — die Gefahr ist
   klein, die Gewohnheit trotzdem richtig. */
async function irealSchreiben(zeilen, buchname){
  let buchId = null;
  let zahl = 0;
  for(const z of zeilen){
    if(z.treffer.length>1) continue;          /* mehrdeutig: bleibt liegen */
    let titelId = z.ziel;
    if(!titelId){
      if(!buchId){
        const vorh=(BS_KATALOG.buecher||[]).find(b=>norm(b.name)===norm(buchname));
        buchId = vorh ? vorh.id : await BS.buchAnlegen({name:buchname, chip:buchname.slice(0,8)});
        if(buchId && buchId.id) buchId = buchId.id;
      }
      const t = await BS.titelAnlegen({ buchId, titel:z.o.titel, komponist:z.o.komponist||'' });
      titelId = t && (t.id||t);
    }
    await BS.elementAnlegen({ titelId, art:'chordsheet', etikett:'Changes',
      dateiname: safeName(z.o.titel)+'.ireal',
      blob: new Blob([z.url], {type:'text/plain'}), np:1 });
    zahl++;
    if(zahl % 25 === 0) await atemzug();
  }
  return zahl;
}

/* ---- Ein Chord-Sheet auf die Buehne ---------------------------------------
   Derselbe Platz wie ein Blatt und ein Leadsheet, aber ohne Setzer: Das SVG
   entsteht in wenigen Millisekunden aus den Akkorden selbst. */
async function renderChordFit(t){
  const fit=document.getElementById('vFit'); fit.classList.remove('center');
  if(!fit.querySelector('.pg')) fit.innerHTML='<div class="lslade">Lädt…</div>';
  try{
    const roh = await chordQuelle(t);
    const o = IR.lesen(String(roh).trim());
    const e = LS.E();

    /* Das Blatt bleibt A4, und zwar aus einem Grund, den ich am 21. August
       selbst gebaut habe: Die Buehnenbreite folgt dem Seitenverhaeltnis des
       Blattes. Wer das Verhaeltnis aus der Buehnenbreite rechnet, schliesst
       einen Kreis — schmale Buehne, flacheres Blatt, noch schmalere Buehne.
       Nach dem Drehen und Zurueckdrehen blieb die Buehne dann schmal.

       Gefuellt wird trotzdem: Die Zeilen verteilen sich ueber die ganze Hoehe,
       und die Akkorde wachsen mit. Ein Chord-Sheet mit sechs Zeilen hat
       groessere Schrift als eines mit zwoelf — das ist richtig so. */
    const verh = LS.A4_VERH;
    const cs=getComputedStyle(fit);
    const p=n=>parseFloat(cs[n])||0;
    const cw=Math.max(320, fit.clientWidth  - p('paddingLeft') - p('paddingRight'));
    const ch=Math.max(320, fit.clientHeight - p('paddingTop')  - p('paddingBottom'));

    const svg = IR.zeichnen(o, {
      breite: 21000, hoehe: Math.round(21000/verh),
      titel:t.t||'', komponist:t.c||'', taktart:o.taktart, stil:o.stil||'',
      akkgroesse:e.akkgroesse });

    if(window.SHEET_RATIO!==undefined && Math.abs(verh-window.SHEET_RATIO)>0.002){
      window.SHEET_RATIO=verh; if(window.layout) window.layout();
    }
    const d=document.createElement('div'); d.className='pg ls';
    const bw = Math.min(cw, ch*verh);
    d.style.width=bw+'px'; d.style.height=(bw/verh)+'px'; d.style.position='relative';
    d.innerHTML=svg.replace(/^<svg([^>]*)>/, (m,a)=>
      '<svg'+a.replace(/\s(width|height)="[^"]*"/g,'')
      +' preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">');
    fit.replaceChildren(d);
    passeBlattEin();
    if(window.navKann) navKann();
  }catch(err){
    fit.innerHTML='<div class="lslade">Dieses Chord-Sheet lässt sich nicht lesen.<br>'
      +esc(err&&err.message||String(err))+'</div>';
  }
}
/* Die Bytes eines Chord-Sheets sind Text, kein Blob-Verweis. */
async function chordQuelle(t){
  const b = await BS.bytes(t.bsId);
  if(!b) throw new Error('Zu diesem Chord-Sheet stehen keine Daten im Bestand.');
  return typeof b==='string' ? b : await b.text();
}

/* ---- Ein Leadsheet auf die Buehne -----------------------------------------
   Derselbe Platz, dieselbe Einpassung wie ein Blatt — nur entsteht die Seite
   hier beim Zeigen und liegt nicht fertig vor. Das kostet auf dem Mac rund
   dreissig Millisekunden je Blatt.

   Die Seiten sind SVG und kommen in dieselbe `.pg` wie die Leinwaende des
   PDF-Wegs. Damit gilt `passeBlattEin` unveraendert, und Wischen, Drehen und
   Vollbild verhalten sich wie gewohnt. */
async function leadQuelle(t){
  const blob = await BS.bytes(t.bsId);
  if(!blob) throw new Error('Zu diesem Leadsheet ist keine Datei hinterlegt.');
  const kopf = new Uint8Array(await blob.slice(0,2).arrayBuffer());
  /* Ein `.mxl` ist ein Archiv mit dem MusicXML darin. JSZip liegt ohnehin
     schon in der App. */
  if(kopf[0]===0x50 && kopf[1]===0x4B){
    if(!window.JSZip) throw new Error('Gepackte Leadsheets brauchen JSZip, und das steht gerade nicht bereit.');
    const zip = await JSZip.loadAsync(blob);
    let name = null;
    const cont = zip.file('META-INF/container.xml');
    if(cont){ const m=/full-path="([^"]+)"/.exec(await cont.async('string')); if(m) name=m[1]; }
    if(!name) name = Object.keys(zip.files).find(n=>/\.(musicxml|xml)$/i.test(n) && !/^META-INF\//.test(n));
    if(!name) throw new Error('In diesem Archiv steht kein MusicXML.');
    return await zip.file(name).async('string');
  }
  return await blob.text();
}
/* Ein Blatt zu setzen dauert. Wer an einem Regler zieht, loest dabei ein
   Dutzend Laeufe aus, und sie kommen NICHT in der Reihenfolge zurueck, in der
   sie gestartet sind — auf dem Mac faellt das nicht auf, auf dem iPad zeigte
   das Blatt am Ende irgendeinen Zwischenstand oder gar keinen. Nur das
   Ergebnis des juengsten Laufs darf auf die Buehne. */
let _leadLauf = 0;
async function renderLeadFit(t){
  const lauf = ++_leadLauf;
  const veraltet = () => lauf !== _leadLauf;
  const fit=document.getElementById('vFit'); fit.classList.remove('center');
  const stehtSchon = !!fit.querySelector('.pg');
  if(!stehtSchon) fit.innerHTML='<div class="lslade">Lädt…</div>';
  const sagen = txt=>{ if(!fit.querySelector('.pg')) fit.innerHTML='<div class="lslade">'+esc(txt)+'</div>'; };
  try{
    const e = LS.E();
    /* Steht zu dieser Ausgabe schon eine Notiz, kommt ihr EINGEFRORENES
       Blatt — nicht ein neu gesetztes. Sonst wanderte die Notiz. */
    const b = await lsBlaetter(t, sagen);
    if(veraltet()) return;
    const n = b.svgs.length;
    if(!n) throw new Error('Aus dieser Datei ist kein Blatt geworden.');
    const notiz = b.notiz;

    /* Das Verhaeltnis ist bei einem Leadsheet fest — A4 hochkant, so
       entschieden am 19. August. Die Buehnenbreite folgt daraus. */
    if(window.SHEET_RATIO!==undefined && Math.abs(LS.A4_VERH-window.SHEET_RATIO)>0.002){
      window.SHEET_RATIO=LS.A4_VERH; if(window.layout) window.layout();
    }
    const fsMode=document.getElementById('viewer').classList.contains('fullscreen');
    const box=fit.getBoundingClientRect(); const rand=fitRand(fit);
    const W=(fsMode?window.innerWidth:(box.width||window.innerWidth))-rand.x-4;
    const H=(fsMode?window.innerHeight:(box.height||window.innerHeight))-rand.y;
    const einBlatt = !(fsMode && document.body.dataset.o==='land');
    const natH=1000, natW=Math.round(natH*LS.A4_VERH);
    const {scale,center} = einBlatt
      ? { scale: Math.max(Math.min(H/natH, W/natW), 0.05), center:(n===1) }
      : computeFit(n,natW,natH,W,H,14);
    fit.classList.toggle('center',center);

    const halter=document.createDocumentFragment();
    b.svgs.forEach((svg,i)=>{
      const d=document.createElement('div'); d.className='pg ls';
      const bw=natW*scale, bh=natH*scale;
      d.style.width=bw+'px'; d.style.height=bh+'px';
      d.style.position='relative';
      /* Schrift, Farbe und Handschrift stecken seit Stufe 3 IM Blatt. Die
         alten Regeln bleiben als Rückfall für Blätter, die vor dem
         20. August eingefroren wurden. */
      d.style.setProperty('--ls-linie', e.farbe);
      d.innerHTML = svg.replace(/^<svg([^>]*)>/, (m,a)=>
        '<svg'+a.replace(/\s(width|height)="[^"]*"/g,'')
        +' viewBox="0 0 '+LS_BREITE+' '+LS_HOEHE+'" preserveAspectRatio="xMidYMid meet">');

      /* Die handschriftliche Notiz liegt DARÜBER und wird nicht ins Blatt
         geschrieben — dasselbe Verhältnis wie beim gescannten Blatt. */
      const seite = notiz && notiz.seiten && notiz.seiten[i];
      if(seite && seite.strokes && seite.strokes.length){
        const dpr=Math.min(window.devicePixelRatio||1,2);
        const cv=document.createElement('canvas');
        cv.width=Math.round(bw*dpr); cv.height=Math.round(bh*dpr);
        cv.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none';
        notizZeichnen(cv, seite);
        d.append(cv);
      }
      halter.append(d);
    });
    fit.replaceChildren(halter);
    passeBlattEin();
    lsKnopfBeschriften(t);
  }catch(err){
    fit.innerHTML='<div class="lslade">Dieses Leadsheet lässt sich nicht setzen.<br>'
      + esc((err&&err.message)||String(err)) + '</div>';
  }
}
const LS_BREITE=2100, LS_HOEHE=2970;

/* ---- Die Blätter einer Ausgabe (Stufe 3, 20. August) ---------------------
   Steht zu dieser Ausgabe schon eine Notiz, ist ihr Blatt EINGEFROREN: Es
   wird nicht neu gesetzt, sondern so gezeigt, wie es beim ersten Strich
   aussah. Sonst wanderte die Notiz beim nächsten Setzen — eine neue Fassung
   des Setzers, ein anderer Umbruch, und der Fingersatz steht über dem
   falschen Takt.

   Zurück kommen eigenständige SVGs: Schrift und Handschrift-Welle stecken
   darin, nicht im Stylesheet der Seite. */
async function lsBlaetter(t, sagen){
  const a = LS.ausgabe(t.bsId);
  const schluessel = LS.notizSchluessel(t.bsId, a);
  let notiz=null;
  try{ notiz = await BS.notizLesen(schluessel); }catch(e){}
  if(notiz && notiz.blatt && notiz.blatt.length)
    return { svgs:notiz.blatt, schluessel, notiz, eingefroren:true };

  const quelle = await leadQuelle(t);
  const org = LS.tonartLesen(quelle);
  const ziel = (a.tonart===undefined || a.tonart==='') ? org.q : +a.tonart;
  const um = LS.rechne(org.q, ziel, a.notation||'C', org.moll);
  t._lsOrg = org; t._lsZiel = ziel; t._lsGelesen = um.gelesen;
  const r = await LS.setze(quelle, { tonart:um.transpose, stimme:a.stimme||'', sagen,
    titel:t.t||'', komponist:t.c||'' });
  const e = LS.E();
  const svgs = [];
  for(const svg of r.seiten) svgs.push(await LS.eigenstaendig(svg, e));
  return { svgs, schluessel, notiz, eingefroren:false };
}

/* Ein SVG in ein Bild — der Weg in die Leinwand des Editors. */
function svgAlsBild(svg){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    const im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url); res(im); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Das Blatt ließ sich nicht zeichnen.')); };
    im.src=url;
  });
}
/* Die Seiten für den Editor: dieselbe Form wie beim PDF-Weg, damit alles
   dahinter unverändert bleibt — die Zeicheneingabe wird nicht angefasst. */
async function lsEditorSeiten(t){
  const {svgs, schluessel} = await lsBlaetter(t);
  const seiten=[];
  for(const svg of svgs){
    const im=await svgAlsBild(svg);
    const breite=Math.min(1240, im.naturalWidth||LS_BREITE);
    const f=breite/(im.naturalWidth||LS_BREITE);
    const bg=document.createElement('canvas');
    bg.width=Math.round((im.naturalWidth||LS_BREITE)*f);
    bg.height=Math.round((im.naturalHeight||LS_HOEHE)*f);
    const g=bg.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,bg.width,bg.height);
    g.drawImage(im,0,0,bg.width,bg.height);
    seiten.push({bg, w:bg.width, h:bg.height, strokes:[]});
  }
  return { seiten, schluessel, svgs };
}

/* Auf dem Knopf steht, was man gerade liest — nicht das Wort „Tonart".
   Wer eine Stimme in B♭ vor sich hat, will das sehen, ohne zu tippen. */
function lsKnopfBeschriften(t){
  const leadsheet = !!(t && t.art==='leadsheet');
  const a = leadsheet ? LS.ausgabe(t.bsId) : {};
  const n = LS.NOTATION.find(y=>y.wert===(a.notation||'C'))||LS.NOTATION[0];
  const ton = (leadsheet && t._lsGelesen) ? t._lsGelesen.replace('b','♭').replace('#','♯') : '';
  const kurz = ton + (leadsheet && t._lsOrg && t._lsOrg.moll ? 'm' : '')
             + (n.wert==='C' ? '' : ' '+n.kurz);
  const gesetzt = leadsheet && (a.notation && a.notation!=='C'
                  || (a.tonart!==undefined && a.tonart!=='' && t._lsOrg && +a.tonart!==t._lsOrg.q));

  /* Das Dock — hier tippt man wirklich. Die Leiste darueber ist seit
     Schritt 6 ausgeblendet; sie wird trotzdem mitgefuehrt, damit nichts
     auseinanderlaeuft, falls sie je zurueckkommt. */
  const d=document.getElementById('dockKeyTxt');
  const db=d && d.parentElement;
  if(db){
    if(leadsheet){
      db.removeAttribute('hidden');
      d.textContent = kurz || '♪';
      db.dataset.lang = kurz.length>5 ? '2' : kurz.length>2 ? '1' : '0';
      if(gesetzt) db.dataset.on='um'; else db.removeAttribute('data-on');
      db.title = kurz ? ('Gelesen: '+kurz+' — tippen für Tonart und Notation')
                      : 'Tonart und Notation';
    } else db.setAttribute('hidden','');
  }

  const b=document.getElementById('vKeyBtn'), x=document.getElementById('vKeyTxt');
  if(b&&x){
    b.style.display = leadsheet ? 'flex' : 'none';
    x.textContent = kurz || 'Tonart';
    b.onclick=()=>openTonartSheet(t);
  }
}

/* Tonart, Notation, Stimme — die drei Achsen einer Ausgabe. */
async function openTonartSheet(t){
  if(!t || t.art!=='leadsheet') return;
  /* Erst die Quelle lesen, dann das Blatt oeffnen. Sonst waechst es dem
     Nutzer unter den Fingern, und die Tastaturbedienung geht an den spaeter
     angehaengten Knoepfen vorbei. */
  let quelle=null, stimmen=[];
  try{ quelle=await leadQuelle(t); stimmen=LS.stimmen(quelle); }
  catch(e){ alert('Die Datei zu diesem Leadsheet lässt sich nicht lesen.'); return; }
  const orgGelesen=LS.tonartLesen(quelle);
  openSheet(card=>{
    card.innerHTML='<h2>Tonart &amp; Notation</h2>'
      +'<div class="muted" style="margin:-6px 0 14px">Das Blatt wird neu gesetzt. '
      +'Die Datei bleibt unberührt, und die Wahl gilt nur für dieses Stück.</div>';
    const org=orgGelesen;
    const jetzt=LS.ausgabe(t.bsId);
    const zielJetzt=(jetzt.tonart===undefined||jetzt.tonart==='')?org.q:+jetzt.tonart;
    const notJetzt=jetzt.notation||'C';

    const bau=(titel, hinweis)=>{ const h=document.createElement('div');
      h.className='lbl'; h.style.cssText='margin:14px 0 6px'; h.textContent=titel;
      card.append(h);
      if(hinweis){ const p=document.createElement('div'); p.className='muted';
        p.style.cssText='margin:-2px 0 8px'; p.textContent=hinweis; card.append(p); }
      const r=document.createElement('div'); r.className='row';
      r.style.cssText='flex-wrap:wrap;gap:6px'; card.append(r); return r; };

    const zeigen=()=>{
      const um=LS.rechne(org.q, zielJetzt2, notJetzt2, org.moll);
      erg.innerHTML='Gelesen wird <b>'+esc(um.gelesen.replace('b','♭').replace('#','♯'))
        +(org.moll?'-Moll':'-Dur')+'</b>'
        +(um.transpose?' · gesetzt um '+esc(um.transpose):' · wie geliefert');
    };
    let zielJetzt2=zielJetzt, notJetzt2=notJetzt;

    /* Klingende Tonart: die zwölf, in Quintenordnung — so denkt eine Band. */
    const rT=bau('Klingende Tonart', 'Was die Band spielt, nicht was Du liest.');
    const tKnoepfe=[];
    ['Db','Ab','Eb','Bb','F','C','G','D','A','E','B','F#'].forEach(nm=>{
      const q=LS.quintenVon(nm);
      const b=document.createElement('button'); b.className='btn ghost sm wahlk';
      b.textContent=nm.replace('b','♭').replace('#','♯');
      b.onclick=()=>{ zielJetzt2=q; markiere(); zeigen(); };
      rT.append(b); tKnoepfe.push({b,q});
    });
    const zurueck=document.createElement('button'); zurueck.className='btn ghost sm wahlk';
    zurueck.textContent='wie geliefert';
    zurueck.onclick=()=>{ zielJetzt2=org.q; markiere(); zeigen(); };
    rT.append(zurueck); tKnoepfe.push({b:zurueck, q:null});
    const markiere=()=>tKnoepfe.forEach(x=>x.b.setAttribute('aria-pressed',
      x.q===null ? (zielJetzt2===org.q) : (x.q===zielJetzt2 && zielJetzt2!==org.q)));
    markiere();

    /* Notation: was auf DEINEM Pult steht. */
    const rN=bau('Notation', 'Dein Instrument. Die klingende Tonart bleibt dieselbe.');
    const nKnoepfe=[];
    LS.NOTATION.forEach(n=>{
      const b=document.createElement('button'); b.className='btn ghost sm wahlk';
      b.textContent=n.kurz; b.title=n.name;
      b.onclick=()=>{ notJetzt2=n.wert; nKnoepfe.forEach(x=>x.b.setAttribute('aria-pressed', x.w===n.wert)); zeigen(); };
      rN.append(b); nKnoepfe.push({b,w:n.wert});
    });
    nKnoepfe.forEach(x=>x.b.setAttribute('aria-pressed', x.w===notJetzt2));

    /* Stimme — nur, wenn die Quelle mehrere hat. */
    let stimmeJetzt=jetzt.stimme||'';
    if(stimmen.length>1){
      const rS=bau('Stimme', 'Der Satz hat mehrere. Die Akkorde gehen mit, gleich aus welcher sie stammen.');
      const sK=[];
      const alle=document.createElement('button'); alle.className='btn ghost sm wahlk';
      alle.textContent='ganzer Satz';
      alle.onclick=()=>{ stimmeJetzt=''; sK.forEach(x=>x.b.setAttribute('aria-pressed', x.w==='')); };
      rS.append(alle); sK.push({b:alle,w:''});
      stimmen.forEach(st=>{
        const b=document.createElement('button'); b.className='btn ghost sm wahlk'; b.textContent=st.name;
        b.onclick=()=>{ stimmeJetzt=st.id; sK.forEach(x=>x.b.setAttribute('aria-pressed', x.w===st.id)); };
        rS.append(b); sK.push({b,w:st.id});
      });
      sK.forEach(x=>x.b.setAttribute('aria-pressed', x.w===stimmeJetzt));
    }

    const erg=document.createElement('div'); erg.className='muted';
    erg.style.cssText='margin:16px 0 0;padding:10px 12px;background:var(--card2,rgba(255,255,255,.04));border-radius:8px';
    card.append(erg); zeigen();

    /* Steht auf diesem Blatt schon etwas geschrieben, gehoert die Notiz zu
       DIESER Ausgabe. Ein Tonartwechsel laesst sie nicht verschwinden — er
       fuehrt auf ein anderes Blatt, das noch leer ist. Das soll man vorher
       wissen und nicht erst, wenn die Anmerkungen weg zu sein scheinen. */
    BS.notizAusgaben ? BS.notizAusgaben(t.bsId).then(liste=>{
      if(!liste || liste.length<1) return;
      const h=document.createElement('div'); h.className='shint';
      h.style.cssText='margin:10px 0 0';
      h.innerHTML='Auf '+(liste.length===1?'einer Fassung':liste.length+' Fassungen')
        +' dieses Stücks steht schon etwas geschrieben. Eine Notiz gehört zu der '
        +'Tonart, in der sie entstanden ist — beim Wechsel liegt sie weiter dort '
        +'und wartet, bis Du zurückkommst.';
      card.insertBefore(h, erg.nextSibling);
    }).catch(()=>{}) : null;

    const row=document.createElement('div'); row.className='row'; row.style.marginTop='16px';
    row.innerHTML='<button class="btn" id="kOk" style="flex:2">Setzen</button>'
      +'<button class="btn ghost" id="kWeg" style="flex:1">Zurücksetzen</button>'
      +'<button class="btn ghost" id="kAb" style="flex:1">Abbrechen</button>';
    card.append(row);
    row.querySelector('#kOk').onclick=()=>{
      LS.ausgabeSetzen(t.bsId, {tonart:String(zielJetzt2), notation:notJetzt2, stimme:stimmeJetzt});
      closeSheet(); blattNeuZeichnen(true);
    };
    row.querySelector('#kWeg').onclick=()=>{

}
