        z._ctl.append(schalter(!!s.andocken, an=>{ bandAndockHand[s.schl]=an; zeichneVorschau(); }));
        zeilen.push(z);
      });
      if(v.treffer>14) zeilen.push(zeile('…','und '+(v.treffer-14)+' weitere, alle nach der Vorgabe oben'));
      halter.append(karte('Schon im Buch ('+v.treffer+')', zeilen));
    }

    /* ---- Etiketten, die dabei angepasst werden --------------------------
       Zusammengefasst mit einem Aufklapper — am 30. Juli so von Jens gewaehlt.
       Beim Nachladen einer zweiten Real-Book-Ausgabe docken schnell dreihundert
       Titel an; dreihundert einzelne Zeilen waeren keine Auskunft, sondern
       eine Wand. Die Zahl steht oben, die Einzelheiten holt, wer sie will.
       Stillschweigend geschieht damit nichts. */
    const glatt=[].concat(...v.stuecke.map(s=>(s.glatt||[]).map(g=>
      ({alt:g.alt, neu:g.neu, titel:s.titel}))));
    if(glatt.length){
      const kopf=zeile('Vorhandene Etiketten',
        'An <b>'+glatt.length+'</b> vorhandenen '+(glatt.length===1?'Blatt':'Blättern')
        +' wird das Etikett angepasst, weil dasselbe Instrument dort künftig '
        +'mehrfach vorkommt. Selbst getippte Schreibweisen bleiben unberührt.');
      kopf._ctl.append(knopf(bandGlattAuf?'Verbergen':'Zeigen',
        ()=>{ bandGlattAuf=!bandGlattAuf; zeichneVorschau(); }));
      const gz=[kopf];
      if(bandGlattAuf){
        glatt.slice(0,200).forEach(g=>{
          const z=zeile('', esc(g.alt||'(ohne)')+' → <b>'+esc(g.neu)+'</b>');
          z.querySelector('.lb').innerHTML='<b>'+esc(g.titel)+'</b>';
          gz.push(z);
        });
        if(glatt.length>200) gz.push(zeile('…','und '+(glatt.length-200)+' weitere'));
      }
      halter.append(karte('Etiketten anpassen ('+glatt.length+')', gz));
    }

    /* Was sich nicht zuordnen liess, steht einzeln da. Es verschwindet nicht
       stillschweigend und wird auch nicht geraten — es haelt den Import aber
       auch nicht mehr auf. */
    if(v.offen.length){
      const kopf=zeile(v.offen.length+' ohne erkannte Stimme',
        'Sie gehen als <b>'+esc(OHNE_STIMME)+'</b> mit und lassen sich jederzeit später zuordnen — '
        +'in Content über die Stimmen-Wahl am Blatt. Wer will, klärt sie gleich hier.');
      const zeilen=[kopf].concat(v.offen.map(o=>{
        const z=zeile('', esc(o.name));
        z.querySelector('.lb').innerHTML = '<b>'+esc(o.titel||'(ohne Titel)')+'</b>'
          + (o.rest ? ' · übrig bleibt „'+esc(o.rest)+'"' : ' · nichts übrig, was eine Stimme nennt');
        /* Gerade hier zaehlt der Blick ins Blatt am meisten: Was der Name
           nicht verraet, verraet die erste Zeile der Noten. */
        z._ctl.append(vorschauKnopf(o), stimmenWahl(o.kennung));
        return z;
      }));
      halter.append(karte('Ohne Stimme ('+v.offen.length+')', zeilen));
    }

    /* Ausgelassene Dateien stehen weiter da, mit dem Weg zurueck. Sonst waere
       ein Tipp auf „auslassen" nicht mehr ruecknehmbar — die Datei
       verschwaende aus der Liste, und nur ein neues Waehlen aller Dateien
       haette geholfen. */
    if(v.ausgelassen.length){
      const zeilen=v.ausgelassen.map(o=>{
        const z=zeile(o.name, 'Wird nicht importiert');
        z._ctl.append(vorschauKnopf(o),
          knopf('Zurücknehmen', ()=>{ delete bandHand[o.kennung]; zeichneVorschau(); }));
        return z;
      });
      halter.append(karte('Ausgelassen ('+v.ausgelassen.length+')', zeilen));
    }

    /* Die Stuecke, je eines eine Zeile. Der Titel ist ein Feld: Was aus dem
       Ordnernamen gesaeubert wurde, laesst sich hier zuruecknehmen. */
    if(v.stuecke.length){
      const zeigen=v.stuecke.slice(0,60);
      const zeilen=[];
      zeigen.forEach(st=>{
        /* Gezeigt wird das ETIKETT, nicht das Instrument — genau das, was
           nachher auf dem Schalter steht. Vorher stand hier „Alt-Sax ·
           Alt-Sax", geschrieben wurde „Alt 1" und „Alt 2". */
        const z=zeile('', (st.saetze.length ? esc(st.saetze.map(x=>x.etikett||x.voice).join(' · ')) : '<i>keine Stimme erkannt</i>')
                        + (st.toene.length ? ' · '+st.toene.length+' Ton' : ''));
        const lb=z.querySelector('.lb'); lb.innerHTML='';
        /* Ohne dieses `flex` richtet sich die linke Spalte nach ihrem
           laengsten Inhalt — der Stimmenzeile — und die Titelfelder stuenden
           von Zeile zu Zeile verschieden breit da. */
        lb.parentElement.style.cssText='flex:1;min-width:0';
        const it=document.createElement('input'); it.className='txt'; it.value=st.titel;
        it.style.cssText='width:100%;min-width:0';
        it.onchange=()=>{ bandTitelHand[st.schl]=it.value.trim()||st.roh; zeichneVorschau(); };
        lb.append(it);
        if(st.titel!==st.roh){
          const h=document.createElement('div'); h.className='sb';
          h.innerHTML='Ordner heißt „'+esc(st.roh)+'"';
          lb.append(h);
        }
        /* Aufgeklappt zeigt ein Stueck seine Saetze einzeln, jeder mit seinem
           Dateinamen und seinem Blick ins Blatt. Zugeklappt ist die Vorgabe —
           57 Stuecke mal acht Saetzen wuerden die Seite fluten. */
        const auf = bandOffen.has(st.schl);
        z._ctl.append(knopf(auf?'Zuklappen':'Sätze zeigen', ()=>{
          if(auf) bandOffen.delete(st.schl); else bandOffen.add(st.schl);
          zeichneVorschau();
        }));
        zeilen.push(z);
        if(!auf) return;
        st.saetze.forEach(s=>{
          /* Links das Etikett, und wo es vom erkannten Instrument abweicht,
             steht dieses dahinter — sonst waere nicht zu sehen, worauf die
             Zuordnung beruht. */
          const u=zeile(zeigStimme(s.etikett, s.voice), esc(s.name)
            + (s.etikett && s.etikett!==s.voice ? ' · erkannt als '+esc(anzeigeStimme(s.voice)) : ''));
          u.style.paddingLeft='34px';
          /* Auch ein erkannter Satz laesst sich hier richtigstellen — ohne
             dafuer erst das Fenster aufmachen zu muessen. */
          u._ctl.append(vorschauKnopf(s), stimmenWahl(s.kennung));
          zeilen.push(u);
        });
        st.toene.forEach(t=>{
          const u=zeile('Ton', esc(t.name));
          u.style.paddingLeft='34px';
          zeilen.push(u);
        });
      });
      if(v.stuecke.length>zeigen.length)
        zeilen.push(zeile('…', 'und '+(v.stuecke.length-zeigen.length)+' weitere Stücke'));
      halter.append(karte('Stücke ('+v.stuecke.length+')', zeilen));
    }

    /* Ton und Uebergangenes werden benannt, nicht verschwiegen. Der Ton wird
       in diesem Stand noch nicht mitgeschrieben — das ist Schritt 5 des
       Konzepts. Wer es nicht dazuschreibt, wundert sich spaeter. */
    if(v.toene.length){
      const zeilen=[zeile('Noch nicht dabei',
        '<b>'+v.toene.length+'</b> Ton-Datei'+(v.toene.length===1?'':'en')
        +' gehören zu Deinen Stücken, werden aber noch nicht mit importiert')];
      v.toene.slice(0,12).forEach(t=>zeilen.push(zeile(t.name, esc(t.titel))));
      if(v.toene.length>12) zeilen.push(zeile('…','und '+(v.toene.length-12)+' weitere'));
      halter.append(karte('Ton ('+v.toene.length+')', zeilen));
    }
    if(v.uebergangen.length){
      const zeilen=v.uebergangen.slice(0,12).map(u=>zeile(u.name, esc(u.grund)));
      if(v.uebergangen.length>12) zeilen.push(zeile('…','und '+(v.uebergangen.length-12)+' weitere'));
      halter.append(karte('Übergangen ('+v.uebergangen.length+')', zeilen));
    }


    /* Zum Schluss die offenen Fenster nachziehen: Wer die Stimme in der Liste
       aendert, soll sie im Fenster stehen sehen und umgekehrt. */
    PDFW.auffrischen();
  }

  /* ---- Unterseite: Einzeln sichern und teilen ---- */
  /* Die Unterseite „Einzeln sichern und teilen" ist am 7. August entfallen.
     Ihre vier Knöpfe stehen jetzt unmittelbar im Thema Export, und ihr
     Einlese-Knopf im Thema Import — eine Seite tiefer war sie nur, weil der
     Export dort keinen eigenen Ort hatte. */

  /* ---- Unterseite: welche Bücher offline ----
     Vorher galt alles oder nichts. Bei 309 MB und 6.231 Dateien ist die Wahl
     die halbe Miete: Wer nur aus zwei Büchern spielt, laedt nicht siebzehn. */
  const OFF_KEY='rb_offlinebooks';
  function alleBuecher(){
    const aus=[];
    BOOK_GROUPS.forEach(g=>g.bids.filter(b=>PRESENT_BIDS.has(b)).forEach(b=>
      aus.push({bid:b, name:(BOOKMETA[b]||{}).name||b})));
    USERBOOKS.forEach(ub=>aus.push({bid:ub.bid, name:ub.name}));
    return aus;
  }
  function offlineAuswahl(){
    try{ const a=JSON.parse(localStorage.getItem(OFF_KEY)||'[]');
      return Array.isArray(a)?a.filter(b=>PRESENT_BIDS.has(b)):[]; }catch(e){ return []; }
  }
  function offlineUrls(){
    const wahl=new Set(offlineAuswahl());
    const passt = t => !wahl.size || wahl.has(t.bid);
    return TUNES.filter(passt).map(t=>t.f);
  }
  function zeichneOffline(w){
    const wahl=new Set(offlineAuswahl());
    const zahl={}; TUNES.forEach(t=>{ zahl[t.bid]=(zahl[t.bid]||0)+1; });
    const zeilen=alleBuecher().filter(b=>zahl[b.bid]).map(b=>{
      const z=zeile(b.name, zahl[b.bid].toLocaleString('de-DE')+' Stücke');
      z._ctl.append(schalter(wahl.has(b.bid), an=>{
        const a=new Set(offlineAuswahl());
        an ? a.add(b.bid) : a.delete(b.bid);
        Sset(OFF_KEY, JSON.stringify([...a]));
        zeichne();
      }));
      return z;
    });
    const z_alle=zeile('Alle Bücher','Keine Auswahl bedeutet: alle Bücher werden gespeichert');
    z_alle._ctl.append(knopf('Auswahl aufheben', ()=>{ Sset(OFF_KEY,'[]'); zeichne(); }));
    const anzahl=offlineUrls().length;
    /* Gestartet wird eine Ebene höher, im Thema selbst. Hier wird nur
       gewählt — sonst stünde derselbe Knopf an zwei Orten. */
    w.append(karte('Auswahl', [z_alle,...zeilen],
      'Gewählt sind zurzeit <b>'+anzahl.toLocaleString('de-DE')+'</b> Stücke, '
      +'geschätzt '+Math.round(anzahl*0.05)+' MB. Gespeichert wird mit „Zurück" '
      +'und dann „Starten".'));
  }

  /* ---- Fortschritt beim Vorabspeichern ---- */
  function precacheStart(urls){
    if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller){
      alert('Offline-Speicher ist erst nach der Installation (bzw. einem Neuladen der Seite) aktiv.'); return; }
    precacheState={running:true,done:0,total:urls.length}; updatePrecacheUI();
    navigator.serviceWorker.controller.postMessage({type:'PRECACHE_ALL', urls});
  }
  function precacheZeichnen(){
    const st=document.getElementById('precacheStatus');
    const bar=document.getElementById('precacheBar');
    const btn=document.getElementById('precacheBtn');
    if(!st||!bar||!btn) return;
    const p=precacheState;
    if(!p.total && !p.running){ bar.classList.remove('an'); btn.disabled=false; btn.textContent='Starten'; return; }
    const anteil = p.total ? Math.round(p.done/p.total*100) : 0;
    bar.classList.add('an');
    bar.querySelector('i').style.width=anteil+'%';
    if(p.running){
      st.textContent='Speichert… '+p.done.toLocaleString('de-DE')+' von '+p.total.toLocaleString('de-DE')+' · '+anteil+' %';
      btn.disabled=true; btn.textContent='Läuft…';
    } else {
      st.textContent='✓ '+p.total.toLocaleString('de-DE')+' Noten sind offline gespeichert.';
      btn.disabled=false; btn.textContent='Erneut prüfen';
    }
  }
  /* Die Meldungen des Service Workers laufen ueber updatePrecacheUI. Statt
     einen zweiten Weg zu bauen, wird die vorhandene Funktion umschlossen. */
  (function(){
    const alt=window.updatePrecacheUI;
    if(typeof alt!=='function') return;
    window.updatePrecacheUI=function(){
      const r=alt.apply(this, arguments);
      try{ precacheZeichnen(); }catch(e){}
      return r;
    };
  })();

  /* Dieselbe Falle wie bei der Ordnerwahl: Das Feld muss im Dokument haengen,
     sonst oeffnet Safari auf dem iPad den Dialog nicht. */
  /* `kamera` setzt `capture` und schickt damit direkt in die Kamera statt in
     die Dateiauswahl. Auf dem Schreibtisch bleibt es wirkungslos. */
  function dateiWaehlen(tu, arten, mehrere, kamera){
    dateiFeld(i=>{
      /* `arten` weggelassen heisst: der alte Vorgabewert fuer die
         Einstellungs-Dateien. Ein LEERER String heisst ausdruecklich OHNE
         Filter — und das ist etwas anderes.

         Am 2. August teuer gelernt: Hier stand `arten||'…json'`, und ein
         leerer String ist falsch. Der Empfangs-Knopf uebergab ihn, um alles
         anzubieten, und bekam stattdessen den JSON-Filter. Im Dateien-Dialog
         des iPads war daraufhin JEDE Datei ausgegraut — auch das ZIP mit dem
         Bandbestand. Der Weg, auf dem ein ganzes Buch hereinkommt, war damit
         zu, und zwar durch die Zeile, die ihn oeffnen sollte. */
      const a = (arten===undefined || arten===null) ? 'application/json,.json' : arten;
      if(a) i.accept=a; else i.removeAttribute('accept');
      if(mehrere) i.multiple=true;
      if(kamera) i.setAttribute('capture','environment');
    }, fs=>{ if(!fs.length) return; tu(mehrere ? fs : fs[0]); });
  }
  function alleNotizenLoeschen(){
    const notizen=USER.filter(t=>t.isEdit);
    if(!notizen.length){ alert('Es gibt keine handschriftlichen Notizen.'); return; }
    if(!confirm(notizen.length+' Notiz'+(notizen.length===1?'':'en')+' endgültig löschen? Das lässt sich nicht rückgängig machen.')) return;
    notizen.forEach(t=>{ try{ idbDeletePages(t.key); }catch(e){}
      USER=USER.filter(u=>u.key!==t.key);
      delete S.recent[t.key]; S.fav.delete(t.key); S.prac.delete(t.key); delete S.tuneTags[t.key];
      S.sets.forEach(st=>st.items=st.items.filter(k=>k!==t.key)); });
    saveUser(); save(); zeichne();
  }

  function auf(){
    document.body.dataset.page='setup';
    document.body.dataset.drawer='closed';
    unter=null;
    zeichne();
  }
  /* Auf dem iPad liegt Setup als Vollbild ueber der Buehne. Das Blatt darunter
     hat dann keine Breite, und was waehrend dieser Zeit gesetzt wird, passt
     nicht auf die Flaeche, die nachher da ist. Deshalb wird nach dem Schliessen
     noch einmal gesetzt, wenn an den Leadsheet-Reglern etwas geaendert wurde.
     Am 21. August von Jens gemeldet: „Die Regler beeinflussen die Darstellung
     nicht." */
  let lsGeaendert=false;
  function zu(){
    unter=null; kopfSetzen(); delete document.body.dataset.page;
    if(window.layout) window.layout();
    if(lsGeaendert){ lsGeaendert=false;
      if(window.blattNeuZeichnen) setTimeout(()=>blattNeuZeichnen(true), 60); }
  }
  /* Mit einem Thema aufgerufen springt das Setup gleich dorthin. Der Knopf in
     der Kopfzeile fuehrt so unmittelbar zur Instrumentenwahl. */
  /* Die Dateiwahl traegt die Ruecksicht, die das iPad verlangt: Das Feld haengt
     dauerhaft im Dokument und wird nie entfernt. Deshalb wird sie geteilt und
     nicht nachgebaut. */
  window.dateiWaehlen = dateiWaehlen;
  window.openSetup = function(t){ if(t && THEMEN.some(x=>x[0]===t)) thema=t; auf(); };

  /* Löschen, Importieren und Buch-Löschen rufen am Ende openLibrarySheet auf.
     Steht die Unterseite offen, soll sich dort nichts oeffnen — dann wird sie
     einfach neu gezeichnet. Sonst gilt das alte Blatt unveraendert. */
  (function(){
    const alt=window.openLibrarySheet;
    if(typeof alt!=='function') return;
    window.openLibrarySheet=function(){
      if(document.body.dataset.page==='setup'){ zeichne(); return; }
      return alt.apply(this, arguments);
    };
  })();

  document.getElementById('setupClose').onclick=zu;
  /* Das Zahnrad fuehrt hierher. Der Klick wird am Dokument abgefangen, nicht
     am Knopf: Der Abgleich-Baustein setzt dessen onclick spaeter noch einmal. */
  document.addEventListener('click', e=>{
    if(!e.target.closest || !e.target.closest('#settingsBtn')) return;
    e.stopImmediatePropagation(); e.preventDefault();
    if(document.body.dataset.page==='setup') zu(); else auf();
  }, true);
  /* Wer in der Seitenleiste etwas anderes waehlt, will nicht mehr ins Setup. */
  document.getElementById('nav').addEventListener('click', e=>{
    if(document.body.dataset.page!=='setup') return;
    if(e.target.closest('#settingsBtn')) return;
    if(e.target.closest('.tab,.collapse-h,.fchip,.iconbtn,.brand,[data-dlg]')) zu();
  });
  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape' || document.body.dataset.page!=='setup') return;
    if(unter){ unter=null; zeichne(); } else zu();
  });
})();
</script>

<script>
/* ================================================================
   Die Eintraege der Seitenleiste per Ziehen sortieren

   Aufgenommen wird nach langem Tippen, nicht sofort: Ein kurzer Tipp soll
   weiterhin die Ansicht wechseln. Die Reihenfolge steht unter
   'rb_taborder' und wird von renderTabs beim Neuzeichnen angewandt.
   ================================================================ */
/* ================================================================
   Die Stuecke einer Tag-Liste per Ziehen sortieren

   Gilt nur in einer Tag-Ansicht. Aufgenommen wird nach langem Tippen, damit
   ein kurzer Tipp weiterhin das Stueck oeffnet. Die Reihenfolge liegt unter
   'rb_tagorder', getrennt von den Tag-Zuordnungen.
   ================================================================ */
(function(){
  const haupt=document.getElementById('main'); if(!haupt) return;
  let uhr=null, zug=null, start=null, sperre=false, liste=null;

  const tagId=()=>S.view.startsWith('tag:') ? S.view.slice(4) : null;
  function speichere(){
    const id=tagId(); if(!id || !liste) return;
    tagOrdnungSetzen(id, [...liste.querySelectorAll('li.tune')].map(li=>li.dataset.key));
  }
  function beginn(el){
    zug=el; liste=el.parentElement; el.classList.add('dragging');
    document.body.dataset.zieht='1';
    if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
  }
  function bewege(y){
    if(!zug||!liste) return;
    for(const li of liste.querySelectorAll('li.tune')){
      if(li===zug) continue;
      const r=li.getBoundingClientRect();
      if(y < r.top + r.height/2){ if(li.previousSibling!==zug) liste.insertBefore(zug,li); return; }
    }
    if(liste.lastChild!==zug) liste.append(zug);
  }
  function ende(){
    if(uhr){ clearTimeout(uhr); uhr=null; }
    if(!zug) return;
    zug.classList.remove('dragging'); delete document.body.dataset.zieht;
    zug=null; speichere(); liste=null;
    sperre=true; setTimeout(()=>{ sperre=false; }, 60);
  }
  /* Angefasst wird am Griff, der nur in einer Tag-Ansicht erscheint. Ueber die
     ganze Zeile zu ziehen haette das Scrollen langer Listen unmoeglich
     gemacht — ein Tag wie „Bossa" kann zweihundert Stuecke tragen. */
  haupt.addEventListener('pointerdown', e=>{
    if(!tagId()) return;
    const griff=e.target.closest('.handle'); if(!griff) return;
    const li=griff.closest('li.tune'); if(!li) return;
    e.preventDefault();
    start={x:e.clientX,y:e.clientY};
    beginn(li);
  });
  window.addEventListener('pointermove', e=>{
    if(zug){ e.preventDefault(); bewege(e.clientY); }
  }, {passive:false});
  window.addEventListener('pointerup', ende, true);
  window.addEventListener('pointercancel', ende, true);
  haupt.addEventListener('click', e=>{ if(sperre){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();
</script>

<script>
(function(){
  const box=document.getElementById('tabs'); if(!box) return;
  let uhr=null, zug=null, start=null, sperre=false;

  function speichere(){
    const ord=[...box.querySelectorAll('.tab,.collapse-h')].map(t=>t.dataset.view).filter(Boolean);
    try{ localStorage.setItem('rb_taborder', JSON.stringify(ord)); }catch(e){}
  }
  function beginn(el){
    zug=el; el.classList.add('ziehen'); document.body.dataset.zieht='1';
    if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
  }
  function bewege(y){
    if(!zug) return;
    for(const t of box.querySelectorAll('.tab,.collapse-h')){
      if(t===zug) continue;
      const r=t.getBoundingClientRect();
      if(y < r.top + r.height/2){ if(t.previousSibling!==zug) box.insertBefore(zug,t); return; }
    }
    if(box.lastChild!==zug) box.append(zug);
  }
  function ende(){
    if(uhr){ clearTimeout(uhr); uhr=null; }
    if(!zug) return;
    zug.classList.remove('ziehen'); delete document.body.dataset.zieht;
    zug=null; speichere();
    /* Der Klick nach dem Loslassen wuerde die Ansicht wechseln. */
    sperre=true; setTimeout(()=>{ sperre=false; }, 60);
  }

  box.addEventListener('pointerdown', e=>{
    /* Seit dem 28. Juli zaehlen die Koepfe „Buecher" und „Tags" mit: Sie
       stehen in derselben Liste und sollen sich mitsortieren lassen. */
    const t=e.target.closest('.tab,.collapse-h'); if(!t || !t.dataset.view) return;
    start={x:e.clientX, y:e.clientY};
    clearTimeout(uhr);
    uhr=setTimeout(()=>{ uhr=null; beginn(t); }, 380);
  });
  window.addEventListener('pointermove', e=>{
    if(uhr && start && (Math.abs(e.clientX-start.x)>8 || Math.abs(e.clientY-start.y)>8)){
      clearTimeout(uhr); uhr=null;
    }
    if(zug){ e.preventDefault(); bewege(e.clientY); }
  }, {passive:false});
  window.addEventListener('pointerup', ende, true);
  window.addEventListener('pointercancel', ende, true);
  box.addEventListener('click', e=>{
    if(!sperre) return;
    e.stopImmediatePropagation(); e.preventDefault();
  }, true);
})();
</script>
