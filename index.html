<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BandStand</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14202c">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BandStand">
<style>
  /* Manrope, lokal eingebettet — SIL Open Font License 1.1, Wortlaut in fonts/OFL.txt.
     Manrope ist eine variable Schrift: eine Datei je Zeichensatz traegt den gesamten
     Gewichtsbereich 200 bis 800. Kein Netzabruf zur Laufzeit; beide Dateien stehen in
     der Shell-Liste des Service Workers und sind damit offline verfuegbar. */
  @font-face{
    font-family:'Manrope'; font-style:normal; font-weight:200 800; font-display:swap;
    src:url('fonts/manrope-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Manrope'; font-style:normal; font-weight:200 800; font-display:swap;
    src:url('fonts/manrope-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  :root{
    /* ================================================================
       Gestaltungsschicht — Token-Satz nach dem BandStand-Handoff.

       Schritt 2 des Umbaus. Die WERTE sind noch die von v3, damit sich
       nichts sichtbar aendert. Wo der Handoff einen abweichenden
       Zielwert nennt, steht dieser als Kommentar dahinter. Ab Schritt 4
       wird der Wert nur noch hier getauscht, nicht mehr in den Regeln.
       ================================================================ */

    /* --- Flaechen --------------------------------------------------- */
    --bg-app:#0f1720;
    --bg-nav:#131c26;              /* ab Schritt 4: Seitenleiste */
    --bg-panel:#141d28;            /* Zielwert des Entwurfs, seit Schritt 7 */
    --bg-panel-hover:#1a2532;      /* ab Schritt 4 */
    --bg-panel-sel:#1e2936;        /* Zielwert des Entwurfs, seit Schritt 7 */
    --bg-panel-open:#25344a;       /* das offene Stueck in der Liste */
    --bg-elev:#16202b;             /* Zielwert des Entwurfs, seit Schritt 7 */
    --bg-input:#17222e;
    /* Der Suchschlitz ueber der Liste: heller als die Knoepfe daneben,
       damit er als Eingabe erkennbar bleibt und nicht als dritter Knopf. */
    --bg-input-kopf:#26333f;       /* ab dem 28. Juli */
    --bg-control:#1e2b39;          /* v3: Chips, Knoepfe, Symbolflaechen */
    --bg-stage:#3a3d40;
    --bg-viewer:#0b1118;
    --bg-editor:#20242a;
    --bg-pdfframe:#525659;
    --bg-penw:#2a2d30;
    --dock-bg:rgba(15,23,32,.88);        /* ab Schritt 6: das schwebende Dock */
    --dock-ink:#cfdcea;
    --dock-hover:rgba(255,255,255,.09);
    --header-top:#1b2836;
    --header-bottom:#14202c;
    --banner-bg:#7a2e12;

    /* --- Linien ------------------------------------------------------ */
    --line:#23313f;
    --line-soft:rgba(255,255,255,.06);   /* ab Schritt 4: Rand der Setup-Karten */
    --line-row:rgba(255,255,255,.05);    /* ab Schritt 8: Trenner in der Karte */
    --line-hair:rgba(255,255,255,.055);  /* ab Schritt 8: Zeilen-Stil A */
    --line-hair2:rgba(255,255,255,.075); /* ab Schritt 8: Zeilen-Stil C */
    --row-edge:rgba(132,182,234,.38);    /* ab Schritt 8: Zeilen-Stil E */
    --dock-line:rgba(255,255,255,.11);   /* ab Schritt 6 */
    --border:#2b3b4d;
    --border-strong:#33455a;       /* Zielwert des Entwurfs, seit Schritt 7 */

    /* --- Text -------------------------------------------------------- */
    --text:#eef3f8;
    --text-body:#c2d1de;           /* ab Schritt 4 */
    --text-muted:#9db0c2;
    --text-faint:#7f97ad;
    --text-dim:#5f7488;            /* ab Schritt 4 */
    /* Eine Stufe unter --text-dim, fuer die Statusflaeche der Seitenleiste:
       Sie soll da sein, ohne die Aufmerksamkeit zu ziehen. */
    --text-ghost:#4b5c6d;          /* ab dem 28. Juli */
    --text-placeholder:#7c90a4;
    --book:#84b6ea;
    --pill-line:rgba(132,182,234,.42);   /* ab Schritt 7: Haarlinie der Tag-Pillen */
    --pill-fill-grey:rgba(255,255,255,.045);  /* ab Schritt 8: Tag-Umrandung „Grau" */
    --az-off:#3b4a59;                    /* ab Schritt 7: nicht belegter Buchstabe */
    --check-line:#3a4c5f;                /* ab Schritt 7b: Kontrollkaestchen im Dialog */
    --switch-off:#2a3846;                /* ab Schritt 8: Schalter der Setup-Seite */
    --switch-knob:#cfdcea;
    --danger-ink:#e0879b;
    --danger-line:#4a2f38;
    --badge-active:#9bbef0;              /* Zahl in der aktiven Menuezeile */
    --wm-dim:rgba(255,255,255,.18);      /* senkrechte Wortmarke, Fassung „dim" */
    --wm-dim-accent:rgba(74,163,255,.32);
    --wm-emboss:#1b2733;                 /* Fassung „emboss" */
    --white:#fff;
    --banner-ink:#ffeede;
    --pen-ink:#cfe2f5;

    /* --- Akzente ----------------------------------------------------- */
    --accent:#2b7de0;
    --accent-bright:#4aa3ff;
    --accent-wash:rgba(74,163,255,.10);
    --accent-wash-strong:rgba(74,163,255,.15);   /* ab Schritt 6: Dock-Zustand */
    --accent-edge:rgba(74,163,255,.6);           /* ab Schritt 6: offenes Stueck in der Liste */
    --fav:#ffc94a;
    --fav-wash:rgba(255,201,74,.15);             /* ab Schritt 6 */
    --practice:#57c98b;
    --practice-wash:rgba(87,201,139,.15);        /* ab Schritt 6 */
    --danger:#ff6b6b;

    /* --- Stimmen und Audio (ab Schritt 10) --------------------------
       Der Entwurf kennt weder Stimmen noch Audio; diese Werte sind aus
       seiner Sprache abgeleitet. Audio traegt einen eigenen Ton, klar
       vom Gold des Favoriten getrennt — beide stehen in der Listenzeile
       nebeneinander. */
    --voice-bg:#101a24;                          /* Leiste am oberen Buehnenrand */
    --voice-chip:rgba(255,255,255,.055);         /* ruhender Chip */
    --voice-chip-line:rgba(255,255,255,.10);
    --audio:#e8a838;
    --audio-wash:rgba(232,168,56,.15);
    --audio-line:rgba(232,168,56,.42);
    --player-bg:rgba(15,23,32,.94);              /* schwebender Player unten */

    /* --- Auflagen und Schleier --------------------------------------- */
    --scrim:rgba(0,0,0,.55);
    --scrim-dlg:rgba(0,0,0,.5);          /* ab Schritt 7b */
    --overlay-btn:rgba(20,28,38,.85);
    --overlay-btn-soft:rgba(20,28,38,.5);
    --badge-bg:rgba(255,255,255,.18);
    --badge-bg-soft:rgba(255,255,255,.16);
    --badge-bg-strong:rgba(255,255,255,.28);
    --code-bg:rgba(0,0,0,.3);

    /* --- Schatten ----------------------------------------------------- */
    --shadow-header:0 6px 18px rgba(0,0,0,.45);
    --shadow-logo:0 2px 6px rgba(0,0,0,.4);
    --shadow-controls:0 8px 14px -8px rgba(0,0,0,.6);
    --shadow-drag:0 8px 22px rgba(0,0,0,.5);
    --shadow-sheet:0 3px 14px rgba(0,0,0,.5);   /* Handoff Blatt: 0 3px 16px rgba(0,0,0,.55) */
    --shadow-estack:0 4px 18px rgba(0,0,0,.5);
    --shadow-float:0 2px 12px rgba(0,0,0,.55);
    --shadow-selbar:0 -6px 20px rgba(0,0,0,.45);
    --shadow-dock:0 10px 30px rgba(0,0,0,.55);        /* ab Schritt 6 */
    --shadow-dock-drag:0 18px 46px rgba(0,0,0,.65);   /* ab Schritt 6 */
    --shadow-drawer:14px 0 40px rgba(0,0,0,.5);
    --shadow-dlg:0 26px 70px rgba(0,0,0,.62);        /* ab Schritt 7b */
    /* Achtung: durch rotate(180deg) sind diese Offsets gespiegelt —
       '0 1px' liegt am Bildschirm oben. So steht es auch im Handoff. */
    --shadow-wm-emboss:0 1px 0 rgba(255,255,255,.1), 0 -1.5px 1px rgba(0,0,0,.72);

    /* --- Radien (Handoff-Skala) --------------------------------------- */
    --r-5:5px; --r-7:7px; --r-8:8px; --r-9:9px; --r-10:10px; --r-11:11px;
    --r-4:4px; --r-6:6px; --r-12:12px; --r-13:13px; --r-15:15px; --r-16:16px; --r-20:20px;
    --r-pill:999px;
    --radius:var(--r-12);

    /* --- Typografie ---------------------------------------------------- */
    --font-sans:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --fs:17px;

    /* --- Bewegung ------------------------------------------------------ */
    --motion-nav:.24s cubic-bezier(.2,.8,.3,1);   /* ab Schritt 4 */
    --motion-fast:.15s;                            /* ab Schritt 4 */
    --motion-arrow:.18s;

    /* --- Masse --------------------------------------------------------- */
    --tap:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg-app);color:var(--text);
    font:var(--fs)/1.45 var(--font-sans);
    -webkit-text-size-adjust:100%;}

  #topbar{position:sticky;top:0;z-index:20;background:var(--bg-app)}
  header{background:linear-gradient(180deg,var(--header-top),var(--header-bottom));
    border-bottom:1px solid var(--border-strong);box-shadow:var(--shadow-header);
    padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top));}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;width:max-content}
  .logo{width:40px;height:40px;border-radius:var(--r-11);flex:none;display:block;box-shadow:var(--shadow-logo)}
  .brand .word{font-size:22px;font-weight:800;letter-spacing:.3px}
  .brand .word b{color:var(--accent-bright)}
  .brand .count{color:var(--text-muted);font-size:13px;font-weight:500;margin-top:2px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-bottom:12px}
  .tab{background:var(--bg-control);color:var(--text-muted);border:1px solid var(--border);
    padding:9px 15px;border-radius:var(--r-pill);font-size:14.5px;cursor:pointer;
    min-height:38px;display:flex;align-items:center;gap:7px;user-select:none;font-weight:600;}
  .tab.active{background:var(--accent);color:var(--white);border-color:var(--accent)}
  .tab.tagtab{border-style:dashed}
  .tab.tagtab.active{border-style:solid}
  .tab .badge{background:var(--badge-bg);border-radius:var(--r-pill);padding:0 7px;font-size:12px}
  .tab .dot{width:9px;height:9px;border-radius:50%}

  .controls{padding:12px 16px 10px;display:flex;flex-direction:column;gap:9px;background:var(--bg-app);
    box-shadow:var(--shadow-controls);border-bottom:1px solid var(--line)}
  input[type=search],input.txt,select{background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    border-radius:var(--r-11);padding:12px 14px;font-size:var(--fs);width:100%;min-height:var(--tap);}
  input::placeholder{color:var(--text-placeholder)}
  .lbl{color:var(--text-muted);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:2px 2px -2px}
  /* A–Z-Leiste nach dem Entwurf: quadratische Felder statt Chips, alle 26
     Buchstaben immer sichtbar, nicht belegte ausgegraut statt weggelassen —
     so bleibt die Leiste ruhig und die Buchstaben immer an derselben Stelle. */
  .alpha{display:flex;flex-wrap:wrap;gap:3px;padding-bottom:4px}
  .alpha button{all:unset;min-width:26px;height:26px;padding:0 5px;border-radius:var(--r-7);
    display:flex;align-items:center;justify-content:center;font:700 11.5px/1 var(--font-sans);
    color:var(--text-muted);cursor:pointer}
  .alpha button[aria-pressed=true]{background:var(--accent);color:var(--white)}
  .alpha button:disabled{color:var(--az-off);cursor:default;background:none}

  .chiprow{display:flex;gap:7px;flex-wrap:wrap}
  .chiprow.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .fchip{background:var(--bg-control);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--r-pill);
    padding:7px 13px;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap;min-height:36px;
    display:flex;align-items:center;gap:6px;font-weight:600}
  .fchip.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
  .filters{display:flex;gap:10px;flex-wrap:wrap}
  .filters>*{flex:1;min-width:150px}
  .hint{color:var(--text-muted);font-size:13px;padding:0 2px}
  .linkrow{display:flex;justify-content:space-between;align-items:center}
  .link{color:var(--accent-bright);cursor:pointer;font-weight:600;font-size:13.5px}

  main{padding:6px 10px 130px}
  .group-letter{font:800 11px/1 var(--font-sans);letter-spacing:.18em;color:var(--text-faint);
    padding:14px 6px 5px}
  ul.list{list-style:none;margin:0;padding:0}
  /* Die beiden Platzhalter halten die Hoehe der Eintraege, die gerade nicht
     im Dokument stehen. Ohne sie waere die Bildlaufleiste falsch. */
  .fensterplatz{flex:none}
  /* Chromium verschiebt die Rollposition von sich aus, sobald sich die Hoehe
     ueber dem Sichtfeld aendert — Scroll-Anchoring. Genau das tut die Liste
     beim Nachladen auch, und beide Ausgleiche zusammen trugen sie je Schritt
     um Tausende Pixel fort. Gemessen: statt 800 px wanderte sie 2.191.
     Safari kennt Scroll-Anchoring gar nicht; die Zeile kostet dort nichts und
     ist am Rechner die Bedingung dafuer, dass ueberhaupt messbar ist. */
  #listcol main{overflow-anchor:none}
  .fensterplatz, body[data-fenster=an] ul.list{overflow-anchor:none}
  /* Solange ausgeschnitten wird, sind die Zeilen ohnehin nur wenige. Das
     Auslagern per content-visibility wuerde hier die Hoehenmessung
     verfaelschen: Eine ausgelagerte Zeile meldet ihre Schaetzung, nicht ihre
     wirkliche Hoehe. */
  body[data-fenster=an] li.tune{content-visibility:visible}
  /* ================================================================
     Schritt 7 — die Listenzeile nach dem Entwurf, Stil „B · Panel".

     Zeile 1 traegt den Titel und rechts vier Schaltflaechen, Zeile 2 die
     umbruchfaehige Metazeile mit den Tag-Pillen. Buchname und Seitenzahl
     sind gleich ausgezeichnet, weil beide dasselbe beantworten: wo das
     Stueck steht.
     ================================================================ */
  li.tune{display:flex;align-items:flex-start;gap:8px;background:var(--bg-panel);
    border:1px solid transparent;border-radius:var(--r-11);padding:9px 10px 10px 12px;margin:5px 0;
    cursor:pointer;
    /* Zeilen ausserhalb des Sichtfelds werden vom Umbruch ausgenommen. Bei
       4.309 Zeilen kostete das Drehen sonst 213 bis 271 ms, weil jede Zeile
       neu gerechnet wurde — auf dem iPad der sichtbare Aufbau in zwei
       Schritten. Mit dieser Regel sind es 13 bis 19 ms.

       Die 66 px sind gemessen, nicht geschaetzt: Sie sind die mittlere
       INHALTShoehe einer Zeile ohne Rand. Damit trifft die Gesamthoehe der
       Liste auf 0,5 Prozent, und die Bildlaufleiste springt nicht. Das
       Schluesselwort auto laesst den Browser die echte Hoehe merken, sobald
       eine Zeile einmal gezeichnet war. */
    content-visibility:auto;contain-intrinsic-size:auto 66px}
  li.tune .main{flex:1;min-width:0;cursor:pointer}
  li.tune .selbox{margin-top:3px}
  li.tune .handle{width:22px;height:26px;min-width:22px;margin-top:1px;color:var(--text-dim);
     display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  li.tune .handle .i{width:15px;height:15px}
  .tline{display:flex;align-items:center;gap:8px}
  li.tune .title{flex:1;min-width:0;font:600 16px/1.3 var(--font-sans);letter-spacing:-.005em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    /* Langes Tippen oeffnet den Metadaten-Editor. Dafuer muss die eigene Geste
       gewinnen: iOS wuerde sonst die Textauswahl mit „Kopieren, Nachschlagen"
       starten, und beides zusammen geht nicht. */
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .racts{display:flex;gap:2px;flex:none}
  .racts .iconbtn{width:30px;height:30px;min-width:30px;border:none;background:transparent;
    border-radius:var(--r-8);color:var(--text-dim)}
  .racts .iconbtn .i{width:16px;height:16px}
  /* Das offene Stueck, zurueckhaltend ausgezeichnet wie im Entwurf: Flaeche
     leicht angehoben, duenne Innenkante links statt eines blauen Rahmens. */
  /* Eine Stufe heller als die uebrigen Zeilen, damit man das offene Stueck
     beim Blick auf die Liste sofort findet. */
  li.tune[aria-selected=true]{background:var(--bg-panel-open);border-color:var(--border-strong);
    box-shadow:inset 3px 0 0 var(--accent-edge)}
  li.tune .meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px;margin-top:2px;
    padding-right:2px;font:500 12.5px/1.5 var(--font-sans);color:var(--text-muted);white-space:normal}
  li.tune .meta .book{color:var(--book)}
  /* Tag-Pille, Variante D: Schriftfarbe ist die Tag-Farbe, die Haarlinie fuer
     alle Tags gleich, keine Fuellung. Die bunten gefuellten Pillen ergaben ein
     unruhiges Gesamtbild. */
  .pill{font:700 10px/1.5 var(--font-sans);border-radius:var(--r-pill);padding:1px 8px;
    border:1px solid var(--pill-line);background:none;white-space:nowrap}
  .pill[data-tag]{cursor:pointer}
  .iconbtn{background:var(--bg-control);border:1px solid var(--border);border-radius:var(--r-11);
    width:var(--tap);height:var(--tap);min-width:var(--tap);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:20px;color:var(--text-muted);user-select:none;}
  .iconbtn.on-star{color:var(--fav);border-color:var(--fav)}
  .iconbtn.on-prac{color:var(--practice);border-color:var(--practice)}
  .iconbtn.on-tag{color:var(--accent-bright);border-color:var(--accent-bright)}
  .iconbtn.add{font-size:24px;line-height:1}
  .empty{color:var(--text-muted);text-align:center;padding:44px 20px;font-size:16px}

  .viewer{position:fixed;inset:0;background:var(--bg-viewer);z-index:60;display:none;flex-direction:column}
  .viewer.open{display:flex}
  .vbar{display:flex;align-items:center;gap:9px;padding:11px 14px;
    padding-top:calc(11px + env(safe-area-inset-top));background:var(--bg-panel);border-bottom:1px solid var(--border)}
  .vbar .vtitle{flex:1;min-width:0;font-weight:650;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vbar .vsub{color:var(--text-muted);font-size:13px;font-weight:400}
  .btn{background:var(--accent);color:var(--white);border:none;border-radius:var(--r-11);padding:0 16px;height:var(--tap);
    font-size:15px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:6px}
  .btn.ghost{background:var(--bg-control);color:var(--text);border:1px solid var(--border)}
  .btn.sm{height:38px;padding:0 12px;font-size:13.5px}
  .btn:disabled{opacity:.4}
  .viewer .frame{flex:1;background:var(--bg-pdfframe)}
  .viewer iframe{width:100%;height:100%;border:none;background:var(--bg-pdfframe)}

  /* Die Blaetter — Metadaten, Tags, Setlists — folgen jetzt der Sprache der
     Dialoge: mittig, begrenzte Breite, Radius 16, Schatten statt Kante. Im
     Hochformat bleiben sie unten, dort ist das der gewohnte Griff. */
  .sheet{position:fixed;inset:0;background:var(--scrim-dlg);z-index:85;display:none}
  .sheet.open{display:block}
  .sheet .card{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:520px;max-width:calc(100vw - 24px);max-height:86%;overflow:auto;
    background:var(--bg-elev);border:1px solid var(--border);
    border-radius:var(--r-16) var(--r-16) 0 0;
    box-shadow:var(--shadow-dlg);
    padding:18px 18px calc(26px + env(safe-area-inset-bottom))}
  body[data-o=land] .sheet .card{top:50%;bottom:auto;transform:translate(-50%,-50%);
    border-radius:var(--r-16);max-height:82%}
  .sheet h2{font:800 17px/1.25 var(--font-sans);margin:0 0 4px}
  .sheet .lbl{font:600 13px/1.3 var(--font-sans);color:var(--text-body)}
  .sheet .muted{font:400 12.5px/1.5 var(--font-sans);color:var(--text-faint)}
  .sheet .txt{min-height:40px;padding:9px 12px;font-size:14px;border-radius:var(--r-10)}
  .sheet .btn{height:40px;font-size:14px;border-radius:var(--r-10)}
  .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .newrow input{flex:1}
  .chip{background:var(--bg-control);border:1px solid var(--border);border-radius:var(--r-pill);padding:8px 14px;
    font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
  .muted{color:var(--text-muted);font-size:13.5px}
  .danger{color:var(--danger);cursor:pointer;font-weight:600}
  .handle{cursor:grab;touch-action:none;font-size:20px;color:var(--text-muted);
    width:var(--tap);height:var(--tap);min-width:var(--tap);display:flex;align-items:center;justify-content:center}
  li.tune.dragging{opacity:.85;border-color:var(--accent-bright);box-shadow:var(--shadow-drag);background:var(--bg-panel-sel)}
  .swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .swatch.sel{border-color:var(--white)}


  /* ================================================================
     Hover nur dort, wo es ein Zeigegeraet gibt.

     Auf dem iPad bleibt die Hover-Darstellung nach einem Tipp am Element
     kleben, bis man woanders hintippt. Sie hat dabei die aktive Farbe
     ueberschrieben: Ein angetippter Stern blieb grau, obwohl er als Favorit
     gesetzt war, und wurde erst gold, wenn Jens ein anderes Stueck antippte.
     Dieselbe Ursache liess die Auszeichnung des offenen Stuecks verschwinden.
     ================================================================ */
  @media (hover:hover){
    .alpha button:hover{background:var(--bg-panel-hover);color:var(--text)}
    li.tune:hover{background:var(--bg-panel-hover)}
    .racts .iconbtn:hover{color:var(--text-muted);background:var(--bg-panel-sel)}
    .collapse-h:hover{border-color:var(--accent-bright)}
    #nav .tab:hover{background:var(--bg-panel-hover)}
    .navtoggle:hover{color:var(--accent-bright);background:var(--bg-panel-sel)}
    .gb:hover{background:var(--dock-hover)}
    .dockbtn:hover{opacity:1}
    .dlgclose:hover{color:var(--accent-bright);background:var(--bg-panel-sel)}
    .dlgrow:hover{background:var(--bg-panel-hover)}
    .supitem:hover{background:var(--bg-panel-hover)}
  }
  /* Der aktive Zustand gewinnt in jedem Fall gegen Hover. */
  li.tune .racts .iconbtn.on-star{color:var(--fav)}
  li.tune .racts .iconbtn.on-prac{color:var(--practice)}
  li.tune .racts .iconbtn.on-tag{color:var(--accent-bright)}
  li.tune[aria-selected=true],
  li.tune[aria-selected=true]:hover{background:var(--bg-panel-open)}

  /* fit view */
  /* Seit Schritt 6, Fassung 3 wird nicht mehr frei gescrollt: Geblaettert wird
     Blatt fuer Blatt, und zwar von uns gesteuert. Das freie Scrollen war der
     Grund, warum das Wischen sich nicht entscheiden konnte, ob es im Stueck
     blaettert oder zum naechsten Stueck springt. */
  .fitwrap{width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;gap:14px;
    overflow:hidden;background:var(--bg-stage);padding:10px}
  .fitwrap.center{justify-content:center}
  .fitwrap .pg{background:var(--white);box-shadow:var(--shadow-sheet);flex:none}
  .fitwrap img.pg{display:block}

  /* annotation editor */
  .editor{position:fixed;inset:0;background:var(--bg-editor);z-index:70;display:none;flex-direction:column;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .editor.open{display:flex}
  .editor .etitle{-webkit-user-select:text;user-select:text}
  .ebar{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap;
    padding-top:calc(9px + env(safe-area-inset-top));background:var(--bg-panel);border-bottom:1px solid var(--border)}
  .etitle{flex:0 1 240px;min-height:40px;padding:9px 12px}
  .etools{display:flex;gap:6px}
  .ebtn{background:var(--bg-control);color:var(--text);border:1px solid var(--border);border-radius:var(--r-10);
    height:40px;padding:0 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
  .ebtn.primary{background:var(--accent);border-color:var(--accent);color:var(--white)}
  .ebtn.on{outline:2px solid var(--accent-bright)}
  .pen{width:34px;height:34px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer}
  .pen.on{border-color:var(--white);transform:scale(1.1)}
  .ecanvaswrap{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg-stage);padding:12px;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .estack{position:relative;background:var(--white);box-shadow:var(--shadow-estack);touch-action:none;
    -webkit-user-select:none;user-select:none;transform-origin:center center;will-change:transform}
  .estack canvas{position:absolute;left:0;top:0;display:block}
  .estack canvas.draw{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .penw{width:34px;height:34px;border-radius:var(--r-8);border:2px solid var(--border-strong);cursor:pointer;background:var(--bg-penw);display:flex;align-items:center;justify-content:center}
  .penw.on{border-color:var(--white)}
  .penw i{display:block;background:var(--pen-ink);border-radius:var(--r-pill)}

  /* fullscreen (Vollbild) */
  .viewer.fullscreen .vbar{display:none}
  .fsclose{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:80;display:none;
    width:46px;height:46px;border-radius:50%;border:none;background:var(--overlay-btn);color:var(--white);
    font-size:21px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow-float)}
  .viewer.fullscreen .fsclose{display:flex}
  .viewer.fullscreen .frame{background:var(--bg-stage)}
  /* Blätter-Pfeile im Vollbild */
  .fsnav{position:fixed;top:50%;transform:translateY(-50%);z-index:80;display:none;
    width:46px;height:66px;border:none;border-radius:var(--r-12);background:var(--overlay-btn-soft);color:var(--white);
    font-size:28px;font-weight:700;cursor:pointer;align-items:center;justify-content:center}
  .fsnav.prev{left:8px} .fsnav.next{right:8px}
  .viewer.fullscreen .fsnav{display:flex}
  .fsnav[hidden]{display:none!important}
  .fsnav:disabled{opacity:.22}

  /* collapsible section headers (Bücher / Anfangsbuchstabe) – nebeneinander, kompakt */
  .collapse-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 2px 4px}
  .collapse-h{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:8px 12px;border-radius:var(--r-10);background:var(--bg-panel);border:1px solid var(--border)}
  .collapse-h.open{border-color:var(--accent)}
  .collapse-h .lbl{margin:0}
  .collapse-h .arrow{color:var(--text-muted);font-size:12px;transition:transform var(--motion-arrow)}
  .collapse-h .i{width:17px;height:17px;flex:none;color:var(--text-faint)}
  .collapse-h i.arrow{width:13px;height:13px;color:var(--text-muted)}
  .collapse-h .cnt{margin-left:auto;font-weight:700;color:var(--text-dim);font-size:12.5px}
  .collapse-h .cnt.aktiv{color:var(--accent-bright)}
  .collapse-h.open .arrow{transform:rotate(180deg)}
  #bookwrap.closed,#azwrap.closed{display:none}
  /* tag row in header */
  #tagtabs{margin-top:-2px;padding-bottom:12px}
  #tagtabs:empty{display:none}
  .tab.tagtab .badge{background:var(--badge-bg-soft)}
  .tab.tagtab.active .badge{background:var(--badge-bg-strong)}
  /* share/print icons in viewer buttons */
  .btn svg{display:block}
  /* Mehrfachauswahl */
  .selbox{width:26px;height:26px;min-width:26px;border-radius:var(--r-7);border:2px solid var(--border);flex:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--white);font-size:15px;background:var(--bg-control);user-select:none}
  .selbox.on{background:var(--accent);border-color:var(--accent)}
  li.tune.selected{border-color:var(--accent)}
  .selall{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:14px;padding:8px 6px 0;cursor:pointer;user-select:none}
  .selall .selbox{width:22px;height:22px;min-width:22px;font-size:13px}
  /* Die Sammelaktionen standen als Leiste am unteren Rand. Jetzt sind sie ein
     schwebendes Fenster wie die Dialoge — im Querformat ueber den Noten. */
  .selbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:95;width:440px;max-width:calc(100vw - 32px);
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-16);
    box-shadow:var(--shadow-dlg);padding:12px 14px 13px;display:none;flex-direction:column;gap:10px}
  .selbar.open{display:flex}
  .selbar-head{display:flex;align-items:center;gap:12px}
  .selbar-head .cnt{font:700 13.5px/1.3 var(--font-sans);color:var(--text)}
  .selbar-actions{display:flex;gap:8px;flex-wrap:wrap}
  .selbar-actions .btn{flex:none;white-space:nowrap;height:36px;padding:0 12px;font-size:13px}
  .bookgroup{margin:0 0 4px}
  .gtitle{color:var(--text-faint);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:9px 2px 5px}

  /* tag manage zones */
  .tagzone{border:1.5px dashed var(--border);border-radius:var(--r-12);padding:10px;margin:4px 0 14px;min-height:54px;
    display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
  .tagzone.over{border-color:var(--accent-bright);background:var(--accent-wash)}
  .tagcard{display:flex;align-items:center;gap:7px;background:var(--bg-control);border:1px solid var(--border);
    border-radius:var(--r-pill);padding:7px 12px;cursor:grab;touch-action:none;user-select:none;font-weight:600;font-size:14px}
  .tagcard.dragging{opacity:.55}
  .tagcard .grip{color:var(--text-muted);font-size:14px;cursor:grab}
  .zonelbl{color:var(--text-muted);font-size:12px;font-weight:700;margin:4px 2px}
  .tagedit{border:1px solid var(--border);border-radius:var(--r-12);padding:10px 12px;margin:8px 0}

  .tab:focus-visible,.fchip:focus-visible,.chip:focus-visible,.iconbtn:focus-visible,.link:focus-visible,
  .swatch:focus-visible,.tagcard:focus-visible,.handle:focus-visible,.collapse-h:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}

  .filebanner{position:fixed;top:0;left:0;right:0;z-index:95;background:var(--banner-bg);color:var(--banner-ink);
    padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));font-size:13.5px;line-height:1.4;
    display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow-float)}
  .filebanner b{color:var(--white)}
  .filebanner code{background:var(--code-bg);padding:1px 5px;border-radius:var(--r-5)}
  .filebanner .x{margin-left:auto;cursor:pointer;font-size:18px;flex:none;line-height:1}

  @media(min-width:820px){
    :root{--fs:18px}
    main,.controls,header .inner{max-width:920px;margin-left:auto;margin-right:auto}
    header{padding-left:0;padding-right:0}
    header .inner{padding-left:16px;padding-right:16px}
  }

  /* ================================================================
     Schritt 4 — dreispaltiges Geruest (Fassung 1+2)

     Querformat: Seitenleiste | Titelliste | Buehne nebeneinander.
     Die Buehnenbreite rechnet layout() nach der Funktion des Handoffs.
     Hochformat bleibt vorerst einspaltig gestapelt; die Schublade kommt
     in einer eigenen Fassung. Das Innenleben des Betrachters wird nicht
     angefasst, nur seine Einbettung.
     ================================================================ */
  .ui{display:flex;align-items:stretch;height:100dvh;overflow:hidden}
  /* 220 px sind genau das Mass, das App-Symbol, Wortmarke und Pfeil brauchen:
     gemessen 153 + 11 + 32 + zweimal 12 Polsterung. Vorher waren es 256; die
     36 Pixel Unterschied bekommt im Querformat die Titelliste. */
  #nav{width:220px;flex:none;background:var(--bg-nav);
       display:flex;flex-direction:column;overflow:hidden;
       /* Langes Tippen nimmt einen Eintrag auf; ohne diese Sperre startet iOS
          dabei zugleich die Textauswahl. */
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #navScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 12px}
  #listcol{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-app)}
  #listcol main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 24px;margin:0;max-width:none}
  #stage{flex:none;position:relative;background:var(--bg-stage);overflow:hidden}

  /* Der Inhalt reicht bis unter die Statusleiste (viewport-fit=cover). Ohne
     den sicheren Rand ueberschneiden sich Logo und Kontextzeile mit Uhrzeit
     und Batterieanzeige. Eine Webseite kann die Statusleiste nicht
     ausblenden, also weicht der Inhalt nach unten aus. */
  .navhead{display:flex;align-items:center;gap:11px;flex:none;
    padding:14px 12px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
  .navhead .logo{width:36px;height:36px}
  .navhead .word{font-size:20px;letter-spacing:-.02em}
  .ntitle{font:800 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;
          color:var(--text-dim);margin:16px 4px 6px}
  /* Die Statusflaeche nimmt den Raum zwischen der Bibliothek und dem Zahnrad
     ein. Sie ist bewusst gross: Sie benennt die Buecher, statt sie nur zu
     zaehlen. Was nicht hineinpasst, wird gerollt. */
  /* Gerollt wird nur die Liste der Buecher; die Summe steht fest darunter.
     Sonst schoebe sie sich bei siebzehn Buechern aus der Flaeche, und gerade
     sie ist die Zahl, die man sucht. Ein justify-content:flex-end waere die
     naheliegende Loesung gewesen und ist die falsche: Was bei Ueberlauf nach
     OBEN aus einer Flexbox herauslaeuft, ist nicht mehr erreichbar. */
  /* Vorrang hat die Bibliothek. Zuerst teilten sich beide die Hoehe haelftig
     — dadurch rutschten die Koepfe „Bücher" und „Tags" aus dem Bild, und man
     kam nur durch Rollen an sie heran. Die Statusflaeche nimmt jetzt nur, was
     sie braucht, hoechstens aber nicht ganz ein Drittel. */
  #navStatus{flex:0 1 auto;min-height:0;max-height:32%;display:flex;flex-direction:column;
     justify-content:flex-end;padding:10px 12px 6px;border-top:1px solid var(--line)}
  /* Je eine Stufe dunkler als zuerst gebaut: Die Flaeche soll da sein, ohne
     die Aufmerksamkeit zu ziehen. */
  #navStatus .count{margin:0;min-height:0;display:flex;flex-direction:column;
     font:500 12px/1.45 var(--font-sans);color:var(--text-dim)}
  #navStatus .buecher{display:flex;flex-direction:column;gap:1px;margin-bottom:7px;
     min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overflow-anchor:none}
  #navStatus .buch{flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-ghost)}
  #navStatus .summe{flex:none;font-weight:700;color:var(--text-faint);font-size:12.5px}
  #navStatus .leer{color:var(--text-ghost);font-weight:500}
  .navfoot{padding:8px 10px;display:flex;gap:8px;flex:none;align-items:center}
  /* Das Zahnrad steht links und sitzt mittig in seiner Flaeche. Als Glyphe war
     es weder waagerecht noch senkrecht zentriert; jetzt traegt es das Symbol
     aus dem Satz. */
  .navfoot #settingsBtn{order:-1;font-size:0;line-height:0;background:var(--bg-control)}
  .navfoot #settingsBtn .i{width:20px;height:20px}
  /* Solange das Setup offen ist, traegt das Zahnrad die Akzentfarbe. Sonst ist
     nicht zu sehen, welcher Bereich gerade vorne liegt. */
  body[data-page=setup] .navfoot #settingsBtn{color:var(--accent-bright);
     border-color:var(--accent-bright);background:var(--accent-wash-strong)}
  /* Im Rail ist dafuer kein Platz — dort steht die senkrechte Wortmarke. */
  body[data-o=land][data-nav=rail] #navStatus{display:none}

  /* Reiter werden in der Seitenleiste zu Menuezeilen — gleiche Knoten, andere
     Gestalt. Diese Regeln hingen bis zum 28. Juli an data-o=land; im Hochformat
     fiel die Schublade damit auf die alte Pillen-Darstellung zurueck: 82 px
     breit mit Radius 999 statt 236 px mit Radius 9. Sie gelten jetzt in beiden
     Ausrichtungen. Der Rail-Zustand bleibt auf land eingegrenzt. */
  #nav .tabs{flex-direction:column;gap:2px;margin:0;padding:0;flex-wrap:nowrap}
  #nav .tab{width:100%;justify-content:flex-start;border-radius:var(--r-9);
       background:transparent;border-color:transparent;padding:9px 10px;font-size:13.5px;
       font-weight:600;color:var(--text-body);min-height:34px}
  #nav .tab.active{background:var(--bg-panel-sel);color:var(--white)}
  #nav .tab .badge{margin-left:auto;background:transparent;color:var(--text-dim);
       font-weight:700;padding:0}
  #nav .tab.active .badge{color:var(--badge-active)}
  #nav .collapse-h{width:100%;background:transparent;border-color:transparent;padding:9px 10px}
  #nav .collapse-h .arrow{margin-left:auto}
  #nav .chiprow{gap:6px}

  /* Kopfzeile der Titelliste: Kontextzeile und A–Z */
  /* Keine Haarlinien mehr: Die Koepfe setzen sich ueber die Flaeche ab, nicht
     ueber Striche. Striche ergaben lauter Kaestchen mit spitzen Ecken. */
  /* Buecher und Trefferzahl gehoeren zusammen: nur ein Zeilenumbruch dazwischen,
     kein Abstand. Alphabet und Buecher stehen oben auf einer Linie. */
  /* Der oberste Block ueber der Liste: Suchschlitz und „Alphabet" auf einer
     Linie, darunter die Trefferzahl. Beides schraenkt dieselbe Liste ein und
     gehoert deshalb zusammen. */
  .lhead{display:flex;align-items:center;column-gap:10px;row-gap:6px;flex:none;flex-wrap:wrap;
         padding:11px 12px 9px;padding-top:calc(11px + env(safe-area-inset-top));
         background:var(--bg-nav)}
  /* Die Mindestbreite laesst den Suchschlitz lieber umbrechen als schrumpfen.
     Im Hochformat stehen alle drei auf einer Linie; im Querformat, wo die
     Spalte 374 px misst, faellt er auf eine eigene Zeile — sonst blieben ihm
     gemessene 132 px, und darin steht kein Wort mehr. */
  .suchfeld{flex:1;min-width:190px;order:1;position:relative;display:flex}
  .lhead input[type=search]{flex:1;min-width:0;min-height:38px;padding:9px 12px;
         font-size:14px;border-radius:var(--r-10);
         background:var(--bg-input-kopf);border-color:var(--border-strong)}
  .suchfeld.voll input[type=search]{padding-right:38px}
  .suchx{all:unset;position:absolute;right:5px;top:50%;transform:translateY(-50%);
     width:28px;height:28px;border-radius:50%;display:none;align-items:center;
     justify-content:center;color:var(--text-dim);cursor:pointer}
  .suchfeld.voll .suchx{display:flex}
  .suchx .i{width:14px;height:14px}
  @media (hover:hover){ .suchx:hover{color:var(--text-body);background:var(--bg-control)} }
  /* Safaris eigenes Loeschzeichen wuerde daneben ein zweites ergeben. */
  .lhead input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .lheadbtns{order:2;flex:none;display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
  .lhead .collapse-h{flex:none;padding:8px 11px}
  /* Das gewaehlte Instrument. Solange keines gewaehlt ist, tritt der Knopf
     zurueck — er fordert nichts, er bietet an. */
  /* Der Knopf traegt kein Zeichen, nur den Namen. Begrenzt wird die
     BESCHRIFTUNG, nicht der Knopf: Ein max-width in Prozent rechnet gegen die
     Klammer, und die richtet sich selbst nach ihrem Inhalt — der Knopf
     schnurrte dadurch auf „TR…" zusammen. 150 px tragen auch „Bariton-Sax".

     Ist eine Voice gewaehlt, umrandet ihn die Akzentfarbe. Das ist der eine
     Ort, an dem man ohne Nachsehen erkennt, in welcher Stimme die App die
     Stuecke aufmacht. */
  #instrBtn .lbl{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #instrBtn.aus{color:var(--text-dim)}
  #instrBtn:not(.aus){color:var(--accent-bright);border-color:var(--accent-bright);
     background:var(--accent-wash)}
  /* Die Trefferzahl steht neben den Knoepfen, nicht darunter: Im Querformat
     bricht der Kopf ohnehin auf zwei Zeilen um, und eine dritte nur fuer drei
     Woerter kostete gemessene 24 px Blattflaeche. */
  .lhead .hint{flex:1;min-width:70px;order:3;padding:0;text-align:right;
               font:500 12.5px/1.4 var(--font-sans);color:var(--text-faint)}
  .lhead .hint b{color:var(--text-muted);font-weight:700}
  /* Kopfzeile des Hochformats — Symbol und Wortmarke links, sonst nichts.
     Sie tritt an die Stelle des Hamburgers: Ein Tipp darauf klappt dieselbe
     Seitenleiste aus wie im Querformat. Mittig steht nichts mehr, sonst
     staende die Marke zweimal auf dem Bildschirm. */
  .porthead{display:none}
  body[data-o=port] .porthead{display:flex;align-items:center;flex:none;
     padding:8px 10px 4px;padding-top:calc(8px + env(safe-area-inset-top))}
  .porthead .brand{width:max-content}
  .porthead .logo{width:32px;height:32px}
  .porthead .brand .word{font-size:20px}
  /* Der Hamburger ist hier ersetzt; er bleibt im Baum, damit vorhandener
     Code seinen Knoten weiter findet. */
  body[data-o=port] .porthead .drawerbtn{display:none}
  #azwrapHost{flex:none;padding:8px 12px 4px;background:var(--bg-nav)}
  #azwrapHost:empty,#azwrapHost.leer{display:none;padding:0;border:none}

  /* Feststehende Zeile unter der A–Z-Leiste: angeheftete Tags und die
     Auswahl-Zeile. Sie sitzt ausserhalb des Scrollbereichs und bleibt
     deshalb sichtbar, waehrend die Liste laeuft. */
  #listfix{flex:none;padding:0 12px 4px;background:var(--bg-nav)}
  #listfix.leer{display:none;padding:0}
  /* Saemtliche Tags, nicht nur die angehefteten. Bei vielen Tags waechst der
     Block sonst so weit, dass von der Liste nichts uebrig bleibt — deshalb
     eine Obergrenze und Rollen darin. */
  .pinrow{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 2px;
     max-height:96px;overflow-y:auto;-webkit-overflow-scrolling:touch;overflow-anchor:none}
  .pintag{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);
     border:1px solid var(--border);background:var(--bg-panel);cursor:pointer;
     font:600 12px/1.4 var(--font-sans);color:var(--text-body)}
  .pintag .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pintag .cnt{color:var(--text-dim);font-weight:700}
  .pintag.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
  .pintag.active .cnt{color:var(--white)}
  #listfix .selall{padding:8px 0}

  /* Die ausgeklappten Buecher- und Tag-Listen der Seitenleiste entfallen:
     Beide fuehren jetzt in den Dialog. Die Knoten bleiben im Baum, damit
     vorhandener Code sie weiter findet. */
  #bookwrap,#tagtabs{display:none}
  /* Dasselbe gilt fuer die leere Huelle der alten Kopfzeile. Sie stand als
     dunkler Kasten mit Haarlinie unter dem letzten Eintrag der Seitenleiste
     und war von nichts mehr die Kopfzeile — .controls traegt Polsterung,
     Flaeche, Schatten und eben jene Linie. Die Linie selbst bleibt, aber am
     richtigen Ort: als Trennung zwischen Navigation und Statusflaeche. */
  #nav #controls{display:none}

  /* Buehne: Betrachter eingebettet statt als Overlay */
  body[data-o=land] .viewer{position:absolute}
  body[data-o=land] .viewer.fullscreen{position:fixed}
  .stage-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:var(--text-dim);font:600 13.5px/1.5 var(--font-sans);text-align:center;padding:28px}
  body[data-o=land] .viewer.open ~ .stage-empty{display:none}

  /* Hochformat: gestapelt wie bisher, Betrachter wieder als Overlay */
  body[data-o=port] .ui{display:block;height:auto;overflow:visible}
  /* Dieselbe Breite wie im Querformat. Die Schublade ist dieselbe Spalte,
     nicht eine zweite. */
  body[data-o=port] #nav{position:fixed;top:0;bottom:0;left:0;width:220px;z-index:70;
       border-right:1px solid var(--line);box-shadow:var(--shadow-drawer);
       transform:translateX(-100%);transition:transform var(--motion-nav);
       display:flex;flex-direction:column;overflow:hidden}
  body[data-o=port][data-drawer=open] #nav{transform:none}
  body[data-o=port] #navScroll{overflow-y:auto;padding:0 10px 8px}
  /* Der obere Bereich steht fest: Symbol, Wortmarke, Kontextzeile, Alphabet,
     angeheftete Tags und die Mehrfachauswahl. Gescrollt wird allein die Liste.
     Vorher scrollte die ganze Spalte, und der Kopf verschwand nach oben. */
  body[data-o=port] #listcol{display:flex;flex-direction:column;overflow:hidden;height:100dvh}
  body[data-o=port] #listcol main{flex:1;min-height:0;overflow-y:auto;
       -webkit-overflow-scrolling:touch;padding:6px 10px 130px}
  body[data-o=port] .porthead,body[data-o=port] .lhead,
  body[data-o=port] #azwrapHost,body[data-o=port] #listfix{flex:none}
  /* Im Hochformat traegt die Buehne keine Flaeche mehr, darf aber NICHT
     ausgeblendet werden: Der Betrachter liegt in ihr, und ein ausgeblendeter
     Elternknoten wuerde ihn mitnehmen, obwohl er selbst fest positioniert ist.
     Stattdessen null Groesse mit sichtbarem Ueberlauf. */
  body[data-o=port] #stage{width:0;height:0;min-height:0;flex:none;overflow:visible;background:none}
  body[data-o=port] .stage-empty{display:none}
  /* Den sicheren Rand oben traegt jetzt die Kopfzeile darueber. Bliebe er hier
     stehen, saesse die Filterzeile ein zweites Mal tiefer. */
  body[data-o=port] .lhead{border-bottom:none;padding:2px 10px 0}

  /* ================================================================
     Fassung 3 — Rail-Zustand.  Fassung 4 — Hochformat mit Schublade.
     ================================================================ */

  /* Basisregel fuer den Symbolsatz: die .ic-* Klassen liefern nur die Maske. */
/* Ein eigenes Zeichen fuer Voice. Das Metronom gehoert zu „Ueben"; zwei
   verschiedene Dinge duerfen nicht dasselbe Zeichen tragen. */
.ic-music{-webkit-mask-image:url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%2018V5l12-2v13%22%3E%3C%2Fpath%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2218%22%20r%3D%223%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2216%22%20r%3D%223%22%3E%3C%2Fcircle%3E%3C%2Fsvg%3E');mask-image:url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%2018V5l12-2v13%22%3E%3C%2Fpath%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2218%22%20r%3D%223%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2216%22%20r%3D%223%22%3E%3C%2Fcircle%3E%3C%2Fsvg%3E')}
  .i{display:inline-block;width:17px;height:17px;flex:none;background:currentColor;
     -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
     -webkit-mask-position:center;mask-position:center;
     -webkit-mask-size:contain;mask-size:contain}

  /* Die Eintraege lassen sich per langem Tippen aufnehmen und verschieben.
     Dafuer duerfen sie die Beruehrung nicht ans Scrollen abgeben. Seit die
     Buecher- und Tag-Listen im Flyout sitzen, muss die Seitenleiste ohnehin
     nicht mehr scrollen. */
  #nav #tabs .tab,#nav #tabs .collapse-h{touch-action:none}
  #nav .tab.ziehen,#nav .collapse-h.ziehen{opacity:.9;background:var(--bg-panel-sel);
     box-shadow:var(--shadow-drag);transform:scale(1.02)}
  body[data-zieht] #nav{cursor:grabbing}

  .navtoggle{width:32px;height:32px;border-radius:var(--r-9);flex:none;margin-left:auto;
     display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-faint);
     background:transparent;border:none;transition:background var(--motion-fast),color var(--motion-fast)}
  .navtoggle .i{width:18px;height:18px;transition:transform var(--motion-nav)}
  body[data-nav=rail] .navtoggle .i{transform:rotate(180deg)}

  /* ---- Rail: 84 px, Symbol ueber Beschriftung ---- */
  #nav{transition:width var(--motion-nav)}
  body[data-o=land][data-nav=rail] #nav{width:84px}
  body[data-o=land][data-nav=rail] .navhead{flex-direction:row;gap:4px;justify-content:center;
       padding:12px 4px 8px;padding-top:calc(12px + env(safe-area-inset-top))}
  body[data-o=land][data-nav=rail] .navtoggle{margin:0;width:26px}
  body[data-o=land][data-nav=rail] .navhead .brand{gap:0;width:auto;justify-content:center}
  body[data-o=land][data-nav=rail] .navhead .brand>div{display:none}
  body[data-o=land][data-nav=rail] #navScroll{padding:0 6px 8px}
  /* Nur die Gruppentitel IN der Seitenleiste verschwinden im Rail. Ohne die
     Einschraenkung auf #nav nahm die Regel auch die Titel im Buecher-Dialog
     mit — und den gibt es nur im Rail. */
  body[data-o=land][data-nav=rail] #nav .ntitle{display:none}
  body[data-o=land][data-nav=rail] #nav .tab{flex-direction:column;gap:3px;width:64px;margin:0 auto 2px;
       padding:8px 2px;justify-content:center;text-align:center;min-height:52px}
  body[data-o=land][data-nav=rail] #nav .tab .i{width:20px;height:20px}
  body[data-o=land][data-nav=rail] #nav .tab .lab{font:700 9.5px/1.1 var(--font-sans);
       letter-spacing:0;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body[data-o=land][data-nav=rail] #nav .tab .badge{position:absolute;display:none}
  body[data-o=land][data-nav=rail] #nav .collapse-h,
  body[data-o=land][data-nav=rail] #bookwrap,
  body[data-o=land][data-nav=rail] #tagtabs,
  body[data-o=land][data-nav=rail] #controls{display:none}
  body[data-o=land][data-nav=rail] .navfoot{flex-direction:column;gap:6px;align-items:center}

  /* Senkrechte Wortmarke, nur im Rail. Drei Fassungen ueber data-wmv. */
  #navWordmark{display:none}
  body[data-o=land][data-nav=rail] #navWordmark{display:flex;justify-content:center;align-items:flex-end;
       flex:1;min-height:0;padding:10px 0 14px;overflow:hidden;pointer-events:none;user-select:none}
  #navWordmark span{writing-mode:vertical-rl;transform:rotate(180deg);
       font:800 48px/1 var(--font-sans);letter-spacing:-.02em;white-space:nowrap}
  body[data-wmv=dim] #navWordmark span{color:var(--wm-dim)}
  body[data-wmv=dim] #navWordmark b{color:var(--wm-dim-accent);font-weight:800}
  body[data-wmv=emboss] #navWordmark span{color:var(--wm-emboss);
       text-shadow:var(--shadow-wm-emboss)}
  body[data-wmv=emboss] #navWordmark b{color:var(--wm-emboss);font-weight:800}
  body[data-wmv=off] #navWordmark{display:none!important}

  /* ---- Hochformat: Seitenleiste als Schublade ---- */
  #scrim{position:fixed;inset:0;background:var(--scrim);z-index:69;display:none}
  body[data-o=port][data-drawer=open] #scrim{display:block}
  .drawerbtn{width:38px;height:38px;border-radius:var(--r-10);flex:none;display:none;
     align-items:center;justify-content:center;cursor:pointer;color:var(--text-body);
     background:var(--bg-control);border:1px solid var(--border)}
  body[data-o=port] .drawerbtn{display:flex}
  .drawerbtn .i{width:19px;height:19px}

  /* Vorlaeufig: die Listenzeile stammt noch aus dem einspaltigen Layout und
     wuerde in der schmalen Spalte den Titel erdruecken. Schritt 7 baut sie
     nach dem Entwurf neu; bis dahin nur kleinere Masse. */
  /* ================================================================
     Schritt 6 — das verschiebbare Dock.

     Die Leiste des Betrachters sass im Fluss und nahm dem Blatt bis zu
     95 px Hoehe. Das Dock schwebt stattdessen ueber dem Blatt und haelt
     nur an SEINER Kante Platz frei; die uebrige Hoehe geht ans Blatt
     zurueck. Die Leiste bleibt im Baum, damit vorhandener Code seine
     Knoepfe weiter findet — sie wird nur nicht mehr gezeigt.
     ================================================================ */
  .viewer .vbar{display:none}
  .viewer .frame{position:relative}

  #dock{position:absolute;z-index:20;display:none;gap:5px;
     background:var(--dock-bg);border:1px solid var(--dock-line);border-radius:var(--r-15);
     padding:6px;box-shadow:var(--shadow-dock);touch-action:none;
     transition:opacity var(--motion-fast)}
  .viewer.open #dock{display:flex}
  #dock[data-edge=bottom],#dock[data-edge=top]{flex-direction:row;left:50%;transform:translateX(-50%)}
  #dock[data-edge=bottom]{bottom:calc(16px + env(safe-area-inset-bottom))}
  #dock[data-edge=top]{top:calc(16px + env(safe-area-inset-top))}
  #dock[data-edge=left],#dock[data-edge=right]{flex-direction:column;top:50%;transform:translateY(-50%)}
  #dock[data-edge=left]{left:calc(16px + env(safe-area-inset-left))}
  #dock[data-edge=right]{right:calc(16px + env(safe-area-inset-right))}
  #dock.dragging{opacity:.9;box-shadow:var(--shadow-dock-drag);transition:none}

  .grip{width:22px;flex:none;display:flex;align-items:center;justify-content:center;
     color:var(--text-dim);cursor:grab;touch-action:none}
  .grip:active{cursor:grabbing}
  #dock[data-edge=left] .grip,#dock[data-edge=right] .grip{width:38px;height:22px;transform:rotate(90deg)}
  .gb{all:unset;width:40px;height:40px;flex:none;border-radius:var(--r-11);
     display:flex;align-items:center;justify-content:center;color:var(--dock-ink);cursor:pointer}
  .gb .i{width:20px;height:20px}
  .gb[data-on=fav]{color:var(--fav);background:var(--fav-wash)}
  .gb[data-on=prac]{color:var(--practice);background:var(--practice-wash)}
  .gb[data-on=tag]{color:var(--accent-bright);background:var(--accent-wash-strong)}
  .gb[disabled]{opacity:.28;cursor:default}
  .gb[hidden]{display:none}
  .gsep{width:1px;flex:none;background:var(--dock-line);margin:6px 3px}
  #dock[data-edge=left] .gsep,#dock[data-edge=right] .gsep{width:auto;height:1px;margin:3px 6px}
  /* ---- Fassung 2: eingeklappt, und je Ausrichtung ein eigener Satz ----

     Im Querformat steht die Liste daneben; Favorit, Üben, Tags und Setlist
     sind dort in jeder Zeile erreichbar und im Dock ueberfluessig. Es bleiben
     Notiz, Teilen und Vollbild. Im Vollbild ist die Liste verdeckt, deshalb
     kommen die vier Zustaende dort zurueck. Im Hochformat sind sie immer da.
     ------------------------------------------------------------------- */
  /* Favorit, Ueben, Tags und Setlist stehen in beiden Ausrichtungen im Dock.
     Kurz waren sie im Querformat ausgeblendet, weil sie in der Listenzeile
     daneben stehen — im Gebrauch fehlten sie dort aber. */

  /* Der runde Knopf holt das Dock im Querformat hervor. Er sitzt fest oben
     links, wo auf den Blaettern am wenigsten steht. Im Hochformat gibt es ihn
     nicht — dort sitzt an dieser Stelle der Zurueck-Knopf, und das Dock steht
     ohnehin dauerhaft unten. */
  /* Durchgaengig unten rechts, in beiden Ausrichtungen. Oben links lag er auf
     dem Notenkopf, und im Hochformat teilte er sich die Ecke mit dem
     Zurueck-Knopf. */
  .dockbtn{all:unset;position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));
     right:calc(14px + env(safe-area-inset-right));left:auto;top:auto;z-index:22;width:44px;height:44px;
     border-radius:50%;background:var(--dock-bg);border:1px solid var(--dock-line);
     color:var(--dock-ink);display:none;align-items:center;justify-content:center;
     cursor:pointer;box-shadow:var(--shadow-dock);opacity:.72;
     transition:opacity var(--motion-fast)}
  .dockbtn .i{width:20px;height:20px}
  body[data-dockfold=an] .viewer.open .dockbtn{display:flex}
  /* Eingeklappt heisst: kein Platz reserviert, das Blatt bekommt die volle
     Flaeche. Ausgeklappt schwebt das Dock darueber, ohne dass die Spalten neu
     gerechnet werden — sonst spraenge das Blatt bei jedem Oeffnen. */
  body[data-dockfold=an][data-dock=zu] .viewer.open #dock{display:none}

  /* Runder Zurueck-Knopf im Hochformat (Handoff). Achtung: all:unset MUSS
     vor den Positionsangaben stehen, sonst werden sie ueberschrieben. */
  .backbtn{all:unset;position:absolute;top:calc(14px + env(safe-area-inset-top));
     left:calc(14px + env(safe-area-inset-left));z-index:21;width:44px;height:44px;
     border-radius:50%;background:var(--overlay-btn);color:var(--white);display:none;
     align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-float)}
  .backbtn .i{width:20px;height:20px}
  body[data-o=port] .viewer.open .backbtn{display:flex}

  /* ================================================================
     Schritt 7b — die Dialoge „Bücher" und „Listen".

     Sie ersetzen im Rail-Zustand die ausgeklappten Listen der Seitenleiste.
     Ohne sie kam man dort an Bücher und Tags gar nicht heran.
     ================================================================ */
  .railonly{display:none}
  body[data-o=land][data-nav=rail] .railonly{display:block}

  /* ================================================================
     Die Stimmen-Wahl — ein eigenes Dropdown

     Ein `select` ist hier nicht zu gebrauchen: Die aufgeklappte Liste
     zeichnet das Betriebssystem, nicht die App. Unter iOS laesst sie
     sich weder faerben noch in der Schrift der App setzen — und genau
     die aufgeklappte Liste sieht man beim Zuordnen am laengsten.

     Darum dieselbe Form wie das Menue auf dem Blatt (#voiceMenu):
     gleiche Farben, gleiche Radien, gleiche Schrift. Die Liste haengt
     am Dokument, nicht am Knopf — sonst schnitte sie der Rand des
     schwebenden Fensters ab.
     ================================================================ */
  .awahl{all:unset;display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;
     background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-9);
     padding:7px 10px 7px 12px;cursor:pointer;
     font:600 12.5px/1.3 var(--font-sans);color:var(--text);max-width:100%}
  .awahl .wert{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .awahl .ton{color:var(--text-faint);font-weight:500}
  .awahl .i{width:13px;height:13px;flex:none;color:var(--text-faint)}
  .awahl[aria-expanded=true]{border-color:var(--accent);color:var(--accent-bright)}
  .awahl[aria-expanded=true] .i{color:var(--accent-bright)}
  .awahlliste{position:fixed;z-index:9000;min-width:210px;max-height:60vh;overflow-y:auto;
     -webkit-overflow-scrolling:touch;padding:5px;
     background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-13);
     box-shadow:var(--shadow-dlg);display:none}
  .awahlliste.offen{display:block}
  .awahlliste button{all:unset;display:flex;align-items:center;gap:9px;width:100%;
     box-sizing:border-box;padding:9px 12px;border-radius:var(--r-9);
     font:600 13.5px/1.25 var(--font-sans);color:var(--text-body);cursor:pointer}
  .awahlliste button .ton{margin-left:auto;font-weight:500;color:var(--text-dim);font-size:12.5px}
  .awahlliste button.an{background:var(--accent-wash);color:var(--accent-bright)}
  .awahlliste button.an .ton{color:var(--accent-bright)}
  .awahlliste .atren{height:1px;background:var(--line);margin:5px 8px}
  .awahlliste .akopf{font:800 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;
     color:var(--text-dim);padding:9px 12px 5px}
  @media (hover:hover){ .awahlliste button:hover{background:var(--bg-panel-hover)} }

  /* ================================================================
     Das schwebende PDF-Fenster

     Es liegt ueber allem, was das Setup zeigt (z-index 96, also ueber
     Dialog 91 und Banner 95), aber unter der Diagnose. Es hat bewusst
     KEINEN Schleier dahinter: Man soll die Vorschau daneben weiter
     lesen und den naechsten Satz aufmachen koennen, ohne zu schliessen.

     Alle Werte kommen aus dem :root — es kommt keiner dazu.
     ================================================================ */
  /* Jedes Fenster ist ein eigener Knoten. Es gibt beliebig viele; wer zwei
     Alt-Stimmen nebeneinander halten will, macht beide auf. Das oberste
     traegt den staerkeren Rand — sonst weiss man bei fuenf Fenstern nicht
     mehr, welches auf den Tastendruck hoert. */
  .pdfw{position:fixed;z-index:96;display:flex;flex-direction:column;
     background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-16);
     box-shadow:var(--shadow-dlg);overflow:hidden;min-width:330px;min-height:200px}
  .pdfw[data-oben]{border-color:var(--accent-edge)}
  /* Der Kopf ist der Griff zum Verschieben. `touch-action:none` ist nicht
     Zierrat: ohne ihn nimmt iOS den Finger fuer das Scrollen der Seite und
     das Fenster bleibt stehen. */
  .pdfw-kopf{display:flex;align-items:center;gap:10px;flex:none;cursor:move;
     touch-action:none;user-select:none;-webkit-user-select:none;
     background:var(--bg-panel);padding:9px 9px 9px 14px}
  .pdfw-kopf .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
     font:700 13px/1.3 var(--font-sans)}
  .pdfw-kopf .sub{font:400 11.5px/1.3 var(--font-sans);color:var(--text-faint);margin-top:2px}
  .pdfw-blaettern{display:flex;align-items:center;gap:2px;flex:none}
  /* `hidden` allein reicht nicht: Die Regel darueber setzt `display` und
     ueberstimmt das Vorgabe-Stylesheet des Browsers. Ohne diese Zeile stand
     „1 / 1" auch bei einseitigen Blaettern da. */
  .pdfw-kopf [hidden]{display:none}
  .pdfw-blaettern .zahl{font:600 12px/1 var(--font-sans);color:var(--text-faint);
     min-width:44px;text-align:center}
  .pdfw-knopf{all:unset;flex:none;width:30px;height:30px;border-radius:var(--r-9);
     display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer}
  .pdfw-knopf[disabled]{opacity:.3;cursor:default}
  .pdfw-knopf .i{width:15px;height:15px}
  .pdfw-buehne{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
     background:var(--bg-viewer);padding:8px;overflow:hidden}
  .pdfw-buehne canvas{display:block;background:var(--white);box-shadow:var(--shadow-sheet)}
  .pdfw-lade{font:600 12.5px/1.4 var(--font-sans);color:var(--text-faint)}
  /* Die Stimmen-Wahl steht im Kopf, unmittelbar links vom Schliessen —
     die beiden Handgriffe gehoeren zusammen: waehlen, dann weiter. Unten
     rechts zu waehlen und oben rechts zu schliessen war ein Weg zu viel. */
  .pdfw-kopf .awahl{flex:none;max-width:240px}
  /* Im Kopf ist es eng. Der Name der Stimme hat Vorrang; die Tonart daneben
     wird gekuerzt, bevor er es wird — sonst stand dort „Autom…" und die
     Angabe, auf die es ankommt, war die abgeschnittene. */
  .pdfw-kopf .awahl .ton{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Der Griff zum Skalieren sitzt in der unteren rechten Ecke. Die sichtbare
     Marke ist klein, die Greifflaeche ist es nicht — auf dem iPad zielt
     niemand auf zwoelf Pixel. */
  .pdfw-griff{position:absolute;right:0;bottom:0;width:28px;height:28px;
     cursor:nwse-resize;touch-action:none}
  .pdfw-griff::after{content:'';position:absolute;right:5px;bottom:5px;width:11px;height:11px;
     border-right:2px solid var(--text-faint);border-bottom:2px solid var(--text-faint);
     border-bottom-right-radius:var(--r-4);opacity:.7}
  /* Solange gezogen wird, faengt eine unsichtbare Flaeche alle Zeiger ab.
     Ohne sie reisst der Zug ab, sobald der Finger ueber das Canvas oder ueber
     einen Knopf faehrt. */
  .pdfw-fang{position:fixed;inset:0;z-index:95;display:none}
  body[data-pdfw-zieht] .pdfw-fang{display:block}
  body[data-pdfw-zieht] .pdfw{box-shadow:var(--shadow-dock-drag)}

  .dlgscrim{position:fixed;inset:0;background:var(--scrim-dlg);z-index:90;display:none}
  body[data-dlg] .dlgscrim{display:block}
  .dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;
     width:420px;max-width:calc(100vw - 32px);max-height:78%;display:none;flex-direction:column;
     background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-16);
     box-shadow:var(--shadow-dlg);overflow:hidden}
  body[data-dlg] .dlg{display:flex}
  .dlghead{display:flex;align-items:flex-start;gap:10px;padding:15px 15px 11px;
     background:var(--bg-panel);flex:none}
  .dlghead h3{margin:0;font:800 16px/1.2 var(--font-sans)}
  .dlghead .sub{margin-top:3px;font:400 12px/1.4 var(--font-sans);color:var(--text-faint)}
  .dlgclose{all:unset;margin-left:auto;flex:none;width:32px;height:32px;border-radius:var(--r-9);
     display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer}
  .dlgclose .i{width:16px;height:16px}
  .dlgbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 9px 10px}
  .dlgbody .ntitle{margin:12px 4px 4px}
  .dlgbody .ntitle:first-child{margin-top:2px}
  .dlgfoot{display:flex;gap:8px;align-items:center;flex:none;background:var(--bg-panel);
     padding:10px 13px calc(11px + env(safe-area-inset-bottom))}
  .dlgrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-9);
     cursor:pointer;font:600 13.5px/1.3 var(--font-sans);color:var(--text-body)}
  .dlgrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dlgrow .cnt{flex:none;font-weight:700;color:var(--text-dim)}
  .dlgrow .i{width:17px;height:17px;flex:none;color:var(--text-faint)}
  .dlgrow .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dlgbox{width:15px;height:15px;border-radius:var(--r-4);border:1px solid var(--check-line);
     flex:none;display:flex;align-items:center;justify-content:center;color:var(--white)}
  .dlgbox .i{width:11px;height:11px;color:var(--white);opacity:0}
  .dlgrow[aria-checked=true] .dlgbox{background:var(--accent);border-color:var(--accent)}
  .dlgrow[aria-checked=true] .dlgbox .i{opacity:1}
  /* Der gesetzte Standard wird nicht ausgegraut, sondern in der Akzentfarbe
     genannt — es ist eine Aussage, kein abgeschalteter Knopf. */
  .istStandard{color:var(--accent-bright);font:700 12.5px/1 var(--font-sans);white-space:nowrap}

  /* ================================================================
     Schritt 8 — die Setup-Seite.

     Sie fuellt die Flaeche rechts der Seitenleiste und ersetzt damit
     Titelliste und Buehne, solange sie offen ist. So steht es im Entwurf.
     ================================================================ */
  #setup{flex:1;min-width:0;display:none;flex-direction:column;background:var(--bg-app)}
  body[data-page=setup] #setup{display:flex}
  body[data-page=setup] #listcol,
  body[data-page=setup] #stage{display:none}
  /* Im Hochformat scrollt die ganze Seite; ohne sticky waere „Schließen"
     nach dem ersten Scrollen nicht mehr erreichbar. */
  .suphead{display:flex;align-items:center;gap:12px;flex:none;position:sticky;top:0;z-index:2;
     background:var(--bg-nav);
     padding:15px 22px 14px;padding-top:calc(15px + env(safe-area-inset-top))}
  .suphead h2{margin:0;font:800 19px/1.2 var(--font-sans)}
  /* Zweispaltig: links die Themen, rechts die Einstellungen des gewaehlten
     Themas. Eine einzige lange Liste war unuebersichtlich. */
  .supcols{flex:1;min-height:0;display:flex;align-items:stretch}
  .supnav{width:232px;flex:none;background:var(--bg-nav);overflow-y:auto;
     -webkit-overflow-scrolling:touch;padding:10px 8px calc(20px + env(safe-area-inset-bottom))}
  .supitem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-9);
     cursor:pointer;font:600 13.5px/1.3 var(--font-sans);color:var(--text-body);margin-bottom:2px}
  .supitem.gewaehlt{background:var(--bg-panel-sel);color:var(--white)}
  .supitem .i{width:17px;height:17px;flex:none;color:var(--text-faint)}
  .supitem.gewaehlt .i{color:var(--accent-bright)}
  .supscroll{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
     padding:6px 22px calc(40px + env(safe-area-inset-bottom))}
  .supscroll .sgrp:first-child{margin-top:14px}
  /* Auch im Hochformat zweispaltig. Die Themen lagen dort als waagerechte
     Reihe, und was nicht in die Breite passte, lag ausserhalb — man sah nie
     alle sechs auf einmal. Die Spalte ist schmaler als im Querformat, aber
     sie zeigt vollstaendig, was es gibt. */
  body[data-o=port] .supnav{width:180px;padding:10px 6px calc(20px + env(safe-area-inset-bottom))}
  body[data-o=port] .supitem{padding:10px 9px;font-size:13px;gap:8px}
  body[data-o=port] .supscroll{padding-left:14px;padding-right:14px}
  body[data-o=port] .supitem{flex:none;margin:0;white-space:nowrap}
  .sgrp{font:800 10.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;
     color:var(--text-dim);margin:22px 0 9px}
  .scard{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:var(--r-13);
     overflow:hidden;max-width:720px}
  /* Alle Zeilen tragen denselben helleren Ton; getrennt werden sie durch eine
     ein Pixel schmale Fuge, durch die die Karte darunter durchscheint. */
  .scard{display:flex;flex-direction:column;gap:1px}
  .srow{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--bg-panel-hover)}

  .srow .lb{font:600 13.5px/1.35 var(--font-sans)}
  .srow .sb{font:400 12px/1.45 var(--font-sans);color:var(--text-faint);margin-top:2px;max-width:380px}
  .srow .ctl{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}
  .srow .btn{height:auto;padding:8px 13px;font-size:12.5px;border-radius:var(--r-9);font-weight:600}
  /* Der Haken zum Mehrfachwaehlen im Notenbestand. Groesser als der im
     Dialog: Hier zielt ein Finger darauf, kein Mauszeiger. */
  .srow .hkbox{all:unset;width:20px;height:20px;flex:none;border-radius:var(--r-5);
     border:1px solid var(--check-line);display:flex;align-items:center;justify-content:center;
     cursor:pointer;color:var(--white)}
  .srow .hkbox .i{width:13px;height:13px;opacity:0}
  .srow[aria-checked=true] .hkbox{background:var(--accent);border-color:var(--accent)}
  .srow[aria-checked=true] .hkbox .i{opacity:1}
  /* Die Zielflaeche fuer hineingezogene Ordner. Sie meldet sich nur, solange
     etwas darueber schwebt — ein dauerhafter Rahmen waere blosser Zierrat. */
  [data-zielflaeche][data-zieh]{outline:2px dashed var(--accent-edge);outline-offset:-6px;
     border-radius:var(--r-13);background:var(--accent-wash)}
  .srow .btn.warn{color:var(--danger-ink);border-color:var(--danger-line)}
  .srow input.txt{min-height:36px;padding:7px 11px;font-size:13px;width:180px}
  .sw{width:44px;height:26px;border-radius:var(--r-pill);background:var(--switch-off);position:relative;
     cursor:pointer;transition:background var(--motion-fast);flex:none;border:none}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
     background:var(--switch-knob);transition:transform var(--motion-fast),background var(--motion-fast)}
  .sw[data-on=true]{background:var(--accent)}
  .sw[data-on=true]::after{transform:translateX(18px);background:var(--white)}
  .sw:disabled{opacity:.45;cursor:default}
  /* Die Zeile der Voice-Liste: Griff zum Ziehen, Formular zum Aendern. */
  .srow.gewaehlt{background:var(--accent-wash)}
  .igriff{width:22px;flex:none;display:flex;align-items:center;justify-content:center;
     color:var(--text-dim);cursor:grab;touch-action:none;margin-left:-4px}
  .igriff:active{cursor:grabbing}
  .igriff .i{width:15px;height:15px}
  .srow.zieht{opacity:.85;background:var(--bg-panel-sel);box-shadow:var(--shadow-drag)}
  .srow.warnrow .sb{color:var(--danger-ink)}
  .instrform{align-items:flex-start}
  .ifelder{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .ifeld{width:100%;box-sizing:border-box;min-height:36px;padding:8px 11px;
     border-radius:var(--r-9);border:1px solid var(--border);background:var(--bg-app);
     color:var(--text);font:600 14px/1.2 var(--font-sans)}
  .ifelder .seg2{align-self:flex-start}
  .iwarn:empty{display:none}
  .iwarn{color:var(--danger-ink)}
  .seg2{display:flex;background:var(--bg-app);border:1px solid var(--border);border-radius:var(--r-9);
     padding:3px;gap:3px;flex-wrap:wrap}
  .seg2 button{all:unset;padding:6px 10px;border-radius:var(--r-6);color:var(--text-muted);
     font:600 12px/1 var(--font-sans);cursor:pointer}
  .seg2 button[aria-pressed=true]{background:var(--accent);color:var(--white)}
  /* Fortschritt beim Vorabspeichern. 6.231 Dateien dauern lange genug, dass
     eine reine Zahl nicht reicht — ohne Balken wirkt die App eingefroren. */
  .sbar{margin-top:8px;height:6px;max-width:380px;border-radius:var(--r-pill);
     background:var(--switch-off);overflow:hidden;display:none}
  .sbar.an{display:block}
  .sbar i{display:block;height:100%;width:0;border-radius:var(--r-pill);
     background:var(--accent);transition:width var(--motion-fast)}
  .stat{font:500 12.5px/1.5 var(--font-sans);color:var(--text-muted)}
  .stat b{color:var(--dock-ink);font-weight:700}
  /* Der Kasten des Dropbox-Abgleichs kommt aus dem Abgleich-Baustein und
     bringt seine eigenen Abstaende mit; in der Karte stoeren sie. */
  .srow #rbSyncBox{border-top:0!important;padding-top:0!important;margin-top:0!important;width:100%}

  /* Die fuenf Zeilen-Stile des Entwurfs. B ist die Vorgabe. */
  body[data-rs=a] li.tune{border-radius:0;border:0;border-bottom:1px solid var(--line-hair);
     margin:0;padding:11px 8px;background:none}
  body[data-rs=c] li.tune{background:none;border-color:var(--line-hair2);margin:5px 0}
  body[data-rs=d] li.tune{background:none;margin:0;padding:13px 10px 15px}
  body[data-rs=e] li.tune{border-radius:var(--r-4) var(--r-11) var(--r-11) var(--r-4);
     border-left:3px solid var(--row-edge);padding-left:11px}
  body[data-rs=e] li.tune[aria-selected=true]{border-left-color:var(--accent-bright);box-shadow:none}
  body[data-tagline=grey] .pill{border-color:var(--badge-bg-soft);background:var(--pill-fill-grey)}

  /* Im Vollbild bleibt die Werkzeugleiste, alles andere blendet aus (Handoff).
     Das Dock traegt Vollbild und Blaettern selbst. */
  .viewer.fullscreen .fsclose,.viewer.fullscreen .fsnav{display:none}

  /* ================================================================
     Schritt 10 — Stimmen, Audio, Metadaten.

     Diese Regeln kamen bis heute aus dem Stimmen-Baustein selbst: Der
     spielte sein CSS zur Laufzeit ein und trug dabei einunddreissig
     Farbwerte im Klartext. Die Pruefung auf Rohwerte sah sie nie, weil
     sie nicht in diesem Block standen. Jetzt stehen sie hier, und die
     Werte kommen aus dem :root-Block wie ueberall sonst.
     ================================================================ */

  /* --- Der Stimmen-Schalter auf dem Blatt (Schritt 4 des Stimmen-Konzepts) ---

     Er loest die Leiste am oberen Buehnenrand ab. Die nahm dem Blatt
     siebenundvierzig Pixel, dauerhaft und bei jedem Stueck mit Stimmen; der
     Schalter schwebt und kostet keine Flaeche.

     Oben rechts, nach Jens' Wahl. Das Dock steht an der Oberkante waagerecht
     mittig und an der rechten Kante senkrecht mittig — die beiden stossen
     dort also nicht zusammen.

     Er kommt und geht mit dem Dock, ueber dasselbe Merkmal am body. Nach vier
     Sekunden ohne Beruehrung ist das Blatt voellig frei. */
  #stimmSchalter{position:absolute;z-index:21;display:none;align-items:center;gap:1px;
     top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
     padding:3px;border-radius:var(--r-pill);
     background:var(--dock-bg);border:1px solid var(--dock-line);
     box-shadow:var(--shadow-dock);opacity:.74;touch-action:none;
     transition:opacity var(--motion-fast)}
  .viewer.open #stimmSchalter{display:flex}
  body[data-dockfold=an][data-dock=zu] .viewer.open #stimmSchalter{display:none}
  /* Laeuft Ton mit, faerbt sich der Rand. Sonst ist auf dem Blatt nicht zu
     sehen, dass daneben etwas spielt. */
  #stimmSchalter.tont{border-color:var(--audio-line);opacity:.88}
  #stimmSchalter .sp{all:unset;width:30px;height:30px;flex:none;border-radius:50%;
     display:flex;align-items:center;justify-content:center;color:var(--dock-ink);cursor:pointer}
  #stimmSchalter .sp .i{width:15px;height:15px}
  #stimmSchalter .sp[disabled]{opacity:.22;cursor:default}
  #stimmSchalter .sname{min-width:46px;padding:0 3px;text-align:center;
     font:800 13.5px/1 var(--font-sans);letter-spacing:-.01em;color:var(--dock-ink);
     white-space:nowrap;cursor:pointer;-webkit-user-select:none;user-select:none}
  /* Falle 1 des Arbeitsstands: Hover klebt auf dem iPad. */
  @media (hover:hover){ #stimmSchalter:hover{opacity:1} }

  /* Das Menue des Schalters — in der Sprache der Dialoge, nur kleiner. Es
     haengt in der Buehne, damit es im Querformat nicht ueber der Liste steht,
     und sitzt unter dem Schalter. */
  #voiceMenu{position:absolute;z-index:40;min-width:210px;max-height:70%;overflow-y:auto;padding:5px;
     top:calc(56px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
     background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-13);
     box-shadow:var(--shadow-dlg);display:none}
  #voiceMenu.open{display:block}
  #voiceMenu button{all:unset;display:flex;align-items:center;gap:9px;width:100%;
     box-sizing:border-box;padding:10px 12px;border-radius:var(--r-9);
     font:600 14.5px/1.2 var(--font-sans);color:var(--text-body);cursor:pointer}
  #voiceMenu button .i{width:16px;height:16px}
  #voiceMenu button.an{background:var(--accent-wash);color:var(--accent-bright)}
  #voiceMenu button.ton.an{background:var(--audio-wash);color:var(--audio)}
  #voiceMenu button.warn{color:var(--danger-ink)}
  #voiceMenu .seite{margin-left:auto;font-weight:500;color:var(--text-dim);font-size:13px}
  #voiceMenu .mtren{height:1px;background:var(--line);margin:5px 8px}

  /* --- Die Kuerzel in der Listenzeile ---
     Sie stehen vor den Tag-Pillen: Sie sagen etwas ueber das Stueck aus,
     die Tags sind Zuordnung. Ruhiger als die Pillen, damit die Zeile
     nicht flimmert. */
  /* --- Die Stimmen eines Stuecks in der Metazeile (Schritt 3) ---
     Ruhiger als die Tag-Pillen, denn sie stehen in jeder Zeile eines
     Real-Book-Stuecks. Die Stimme, die aufgeht, ist ausgezeichnet. */
  /* Die eigene, unterste Zeile der Listenzeile. Sie bricht um, wenn viele
     Stimmen zusammenkommen, faengt aber immer an derselben Stelle an. */
  .stimmzeile{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px}
  .stimmen{display:inline-flex;gap:4px;margin:0;vertical-align:middle}
  .stimme{all:unset;box-sizing:border-box;cursor:pointer;
     font:700 11px/1.45 var(--font-sans);padding:1px 7px;border-radius:var(--r-6);
     color:var(--text-dim);border:1px solid var(--voice-chip-line);background:var(--voice-chip)}
  .stimme.an{color:var(--accent-bright);border-color:var(--pill-line);background:var(--accent-wash)}

  .vbadges{display:inline-flex;gap:4px;margin-left:0;vertical-align:middle}
  .vbadge{font:700 11px/1.45 var(--font-sans);padding:1px 6px;border-radius:var(--r-6);
     background:var(--voice-chip);color:var(--book);border:1px solid var(--voice-chip-line)}
  .vbadge.aud{color:var(--audio);border-color:var(--audio-line);background:var(--audio-wash)}

  /* --- Der Player am unteren Buehnenrand ---
     Er schwebt wie das Dock, liegt aber nur ueber der Buehne. Seine Hoehe
     geht in docPads() ein, damit das Blatt nie darunter laeuft. */
  #voiceAudio{position:absolute;left:12px;right:12px;z-index:22;
     bottom:calc(12px + env(safe-area-inset-bottom));
     background:var(--player-bg);border:1px solid var(--dock-line);border-radius:var(--r-15);
     box-shadow:var(--shadow-dock);padding:7px 8px 7px 12px;
     display:none;align-items:center;gap:10px}
  #voiceAudio.open{display:flex}
  #voiceAudio .vaname{color:var(--audio);font:650 13px/1.2 var(--font-sans);flex:0 0 auto;
     max-width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #voiceAudio audio{flex:1;min-width:0;height:36px}
  #voiceAudio .vax{all:unset;flex:0 0 auto;width:32px;height:32px;border-radius:var(--r-9);
     color:var(--text-muted);cursor:pointer;font-size:17px;
     display:flex;align-items:center;justify-content:center}

  /* --- Die Verwaltung im Metadaten-Blatt --- */
  .partsSec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
  .partsSec .prow{display:flex;align-items:center;gap:8px;padding:7px 0;
     border-bottom:1px solid var(--line-row)}
  .partsSec .prow:last-child{border-bottom:0}
  .partsSec .pkind{flex:0 0 auto;color:var(--text-muted);font-size:15px}
