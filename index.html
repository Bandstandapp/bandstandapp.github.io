  .partsSec .prole-sel{flex:0 0 auto}
  .partsSec .pfile{color:var(--text-dim);font-size:13px;flex:1;min-width:0;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .partsSec .pdetach,.partsSec .pdel{all:unset;flex:0 0 auto;width:32px;height:32px;
     border-radius:var(--r-9);cursor:pointer;font-size:15px;
     display:flex;align-items:center;justify-content:center}
  .partsSec .pdetach{color:var(--accent-bright)}
  .partsSec .pdel{color:var(--danger)}
  .partsSec select,.partsSec .btn{font-size:14px}
  .vlade{color:var(--text-body);margin:auto}
  .vfehler{color:var(--danger-ink);margin:auto;padding:24px;text-align:center}

  /* Versteckte Datei-Eingabefelder. NICHT `display:none`: Safari auf dem iPad
     oeffnet den Dateien-Dialog fuer ein so verstecktes Feld nicht zuverlaessig,
     und zwar ohne jede Meldung. Aus dem Bild geschoben wird es gefunden und
     angeklickt wie jedes andere. */
  .dateifeld{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

  /* Der Brotkrumenpfad in der Kopfzeile des Setups. Er sagt, wo man ist; die
     anklickbaren Teile führen zurück. */
  /* Die Zeilen im Content tragen mehr Steuerung als eine normale Setup-Zeile:
     Haken, Namensfeld, Stimmen-Wahl, Vorschau. Wird die Flaeche schmal, muessen
     sie umbrechen duerfen — sonst quetscht `.ctl` das Namensfeld auf null, und
     der Untertitel bricht Wort fuer Wort. Auf dem iPad im Querformat passt
     alles in eine Zeile; auf dem iPhone nicht. */
  .srow.crow{flex-wrap:wrap;gap:10px 12px}
  .srow.crow>:first-child{flex:1 1 240px;min-width:0}
  .srow.crow .ctl{flex-wrap:wrap;margin-left:auto}
  .srow.crow .txt{min-width:120px}

  .krume{white-space:nowrap}
  .krumeTr{opacity:.45;margin:0 .45em;font-weight:400}
  .krume.klick{cursor:pointer;color:var(--text-muted)}
  @media (hover:hover){ .krume.klick:hover{color:var(--accent-bright)} }

  /* Die Zeile traegt seit Schritt 7 in beiden Ausrichtungen dieselben Masse —
     sie sind fuer die schmale Spalte des Querformats entworfen. Nur die
     Auswahl-Box wird dort kleiner. */
  body[data-o=land] li.tune .selbox{width:22px;height:22px;min-width:22px;font-size:13px}


  /* ================================================================
     Symbolsatz des Handoffs (_icons.css, unveraendert uebernommen).
     CSS-Masken als Daten-URIs, keine Fremdabrufe. Eingefaerbt wird
     ueber currentColor. Verwendung ab Schritt 4; die heutige

  tuneTags:JSON.parse(localStorage.getItem('rb_tunetags')||'{}'),  // key -> [tagId]
  recent:JSON.parse(localStorage.getItem('rb_recent')||'{}'),      // key -> timestamp zuletzt gespielt
  recentSort:{by:'date',dir:'desc'},
  selection:new Set(),   // Mehrfachauswahl (nur Sitzung)
  _sig:'',
  sonstOn: localStorage.getItem('rb_sonston')!=='0',  // „Sonstiges Material" einbeziehen (Default an)
  openSet:null,
  booksOpen: localStorage.getItem('rb_booksopen')==='1',
  azOpen: localStorage.getItem('rb_azopen')==='1',
};
/* Standard-Buchauswahl: beim Öffnen der App wird diese Auswahl vorausgewählt. */
const DEFAULT_BOOKS = JSON.parse(localStorage.getItem('rb_defaultbooks')||'[]');
S.books = new Set(DEFAULT_BOOKS);
function setDefaultBooks(){ const arr=[...S.books]; localStorage.setItem('rb_defaultbooks', JSON.stringify(arr));
  DEFAULT_BOOKS.length=0; DEFAULT_BOOKS.push(...arr); render(); }
function clearDefaultBooks(){ localStorage.removeItem('rb_defaultbooks'); DEFAULT_BOOKS.length=0; render(); }
function booksAreDefault(){ if(DEFAULT_BOOKS.length!==S.books.size) return false; return DEFAULT_BOOKS.every(b=>S.books.has(b)); }
/* Metadaten-Korrektur der Großsammlung: Overrides je Stück (Titel/Komponist), PDFs bleiben unberührt.
   Schlüssel = ursprüngliche Identität (bid|Originaltitel|Seite), damit er auch nach Umbenennen stabil bleibt. */
const OVERRIDES = JSON.parse(localStorage.getItem('rb_overrides')||'{}');
function saveOverrides(){ localStorage.setItem('rb_overrides', JSON.stringify(OVERRIDES)); }
const TUNES = window.TUNES.map((t,i)=>{
  const key=t.bid+'|'+t.t+'|'+t.pg; const o=OVERRIDES[key];
  const base={...t, key, idx:i, _ot:t.t, _oc:t.c||''};
  if(o){ if(typeof o.t==='string' && o.t) base.t=o.t; if(typeof o.c==='string') base.c=o.c; }
  return base;
});

/* ================================================================
   Schritt 2 des Stimmen-Konzepts — die Gruppierung.

   Vier der siebzehn Buecher sind keine eigenen Buecher, sondern
   transponierte Ausgaben desselben Buchs. Die Buch-Kennung traegt die
   Ausgabe im Namen: realbook1_bb ist die B-Ausgabe von realbook1.
   Daraus laesst sich berechnen, welche Blaetter zu einem Stueck gehoeren.

   GERECHNET, NICHT GESPEICHERT. Es entsteht kein neuer Schluessel, kein
   Feld wandert, data.js bleibt unberuehrt. Wird die Regel geaendert,
   aendert sich die Anzeige und sonst nichts. Genau darum ist dieser
   Schritt vor Schritt 9 moeglich, obwohl er tief zu greifen scheint.

   Diese Fassung rechnet nur — sichtbar wird davon noch nichts.
   ================================================================ */
const STIMM_SUFFIX = { '_bb':'B♭', '_eb':'E♭', '_bass':'Bass' };
const STIMM_ORDNUNG = ['C','B♭','E♭','Bass'];

/* Aus einer Buch-Kennung Familie und Stimme lesen. Ohne Suffix ist es die
   C-Ausgabe; sie ist zugleich die Leitstimme der Familie. */
function buchZerlegen(bid){
  for(const suf in STIMM_SUFFIX){
    if(bid.endsWith(suf)) return { fam: bid.slice(0, -suf.length), stimme: STIMM_SUFFIX[suf] };
  }
  return { fam: bid, stimme: 'C' };
}

/* Der Titel ist das einzige Merkmal, das die Ausgaben verbindet. Die
   Seitenzahl taugt nicht: Die E-Ausgabe ist anders paginiert, in 337
   Faellen weichen die Zahlen voneinander ab.

   Verglichen wird der URSPRUENGLICHE Titel, nicht der korrigierte. Sonst
   zerrisse eine Korrektur an einer einzelnen Ausgabe die Gruppe, und das
   waere von aussen nicht zu erklaeren. */
const titelSchluessel = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

/* Eine Familie zaehlt nur, wenn von ihr wirklich mehrere Ausgaben in der
   Sammlung liegen. Ein Buch ohne Geschwister bleibt ein Buch, und seine
   Stuecke tragen keine Stimme. Eigene Buecher fallen damit von selbst
   heraus. */
const FAMILIEN = (()=>{
  const m={};
  TUNES.forEach(t=>{ const z=buchZerlegen(t.bid); (m[z.fam]=m[z.fam]||new Set()).add(z.stimme); });
  Object.keys(m).forEach(f=>{ if(m[f].size<2) delete m[f]; });
  return m;
})();

TUNES.forEach(t=>{
  const z=buchZerlegen(t.bid);
  if(!FAMILIEN[z.fam]){ t.gid=t.key; t.stimme=''; t.fam=''; return; }
  t.fam=z.fam; t.stimme=z.stimme;
  t.gid=z.fam+'|'+titelSchluessel(t._ot);
});

const GRUPPEN = (()=>{
  const g={};
  TUNES.forEach(t=>{ (g[t.gid]=g[t.gid]||[]).push(t); });
  Object.values(g).forEach(a=>a.sort((x,y)=>
    STIMM_ORDNUNG.indexOf(x.stimme)-STIMM_ORDNUNG.indexOf(y.stimme)));
  return g;
})();
window.GRUPPEN = GRUPPEN;

/* Die Leitstimme einer Gruppe. Auf sie werden spaeter Favoriten, Tags und
   die Uebungsliste geschrieben, damit v3 sie am C-Blatt weiter findet. */
function leitstimme(gid){
  const a=GRUPPEN[gid]; if(!a||!a.length) return null;
  return a.find(t=>t.stimme==='C') || a[0];
}
window.leitstimme = leitstimme;

/* ---- Schritt 3: was der Gruppe gehoert und was dem Blatt ----

   Favorit, Ueben und Tags gelten dem STUECK, nicht dem einzelnen Blatt.
   Angezeigt werden sie, sobald irgendeine Stimme sie traegt. Geschrieben
   werden sie auf die Leitstimme, also die C-Ausgabe. So bleibt der
   Datenbestand unveraendert, und v3 findet die Marke am C-Blatt wieder.

   Bewusst wird dabei die GANZE Gruppe gefragt, nicht nur die gerade
   sichtbaren Stimmen: Der Stern gehoert dem Stueck, auch wenn die
   Buchauswahl die markierte Ausgabe gerade ausblendet. */
function gruppenBlaetter(t){ return (t && t.fam && GRUPPEN[t.gid]) ? GRUPPEN[t.gid] : [t]; }
function gruppeHat(menge, t){ return gruppenBlaetter(t).some(x=>menge.has(x.key)); }
function gruppeTagIds(t){
  if(!t || !t.fam) return tuneTagIds(t.key);
  const s=new Set(); gruppenBlaetter(t).forEach(x=>tuneTagIds(x.key).forEach(id=>s.add(id)));
  return [...s];
}
/* Wohin eine Marke geschrieben wird. */
function schreibBlatt(t){ return (t && t.fam) ? (leitstimme(t.gid)||t) : t; }

/* Die Zeile des aktiven Stuecks — gesucht ueber die Gruppe, nicht ueber den
   Schluessel. Liegt die E-Ausgabe auf der Buehne, traegt die Zeile trotzdem
   den Schluessel der C-Ausgabe. */
window.aktiveZeile = function(){
  const k=window.aktivesStueck; if(!k) return null;
  const t=(typeof byKey!=='undefined') ? byKey[k] : null;
  const gid=(t && t.gid) ? t.gid : k;
  return document.querySelector('li.tune[data-gid="'+cssEsc(gid)+'"]');
};

/* Welche Stimme aufgeht, wenn mehrere zur Wahl stehen. Bis die
   Instrumentenliste steht (Schritt 5), gilt die letzte Stufe der Kette aus
   dem Konzept: erst C, sonst die erste vorhandene. Das Instrument haengt
   sich spaeter an genau dieser Stelle ein — es gibt nur diese eine. */
/* ================================================================
   Die Instrumentenliste — Schritt 5 des Stimmen-Konzepts

   Sie ist der einzige Ort, an dem etwas eingestellt wird. Jeder Eintrag
   traegt drei Angaben: den Namen, die Notation und die gaengigen
   Abkuerzungen. Die Abkuerzungen sind kein Zierrat: Eine Datei heisst
   selten „Blue Bossa - Trompete.pdf", sondern „Blue Bossa - tp.pdf".
   Gebraucht werden sie erst beim Import eines Bandbuchs (Schritt 6);
   gepflegt werden sie hier.

   Schlagzeug und Percussion tragen keine Notation. Sie kommen in
   transponierten Ausgaben nicht vor, nur in Bandbuechern, und dort
   entscheidet allein der Name.

   Zwei eigene Speicher, beide neu — v3 liest sie nicht und verliert
   dadurch nichts.
   ================================================================ */
const INSTR_KEY='rb_instrumente', INSTR_WAHL_KEY='rb_instrument';
const NOTATIONEN=['C','B♭','E♭','Bass',''];
/* Jeder Eintrag traegt den deutschen und den englischen Namen. Der englische
   ist nicht Zierrat: Arrangeure benennen ihre Dateien meist englisch, und
   „Blue Bossa - Guitar.pdf" soll beim Import (Schritt 6) ebenso erkannt werden
   wie „- Git.pdf". Gesucht wird darum nach beiden Namen und nach den
   Abkuerzungen.

   Die Reihenfolge ist alphabetisch nach dem deutschen Namen; sie laesst sich
   im Setup durch Ziehen aendern. */
/* Die Abkuerzungen sind am 29. Juli am echten Bestand `Blauton` vermessen
   worden — 460 PDFs, 56 Stuecke. Ohne die hier ergaenzten Woerter erkennt die
   Liste 73 Prozent, mit ihnen 97,6. Jedes Wort steht fuer gezaehlte Faelle,
   keines ist geraten:
     Tenor (30) · Trpt (15) · Vocal, Chor (5) · Drm, Drms, Drum (5) ·
     Alto, Altsax (4) · Keyboard, Keyb (2) · Sopran (3) · Xylo (1) ·
     Bassklarinette (1) · Lead, Back (2)
   Wer hier etwas streicht, senkt die Erkennung messbar. */
const INSTR_VORGABE=[
  {id:'akk',  name:'Akkordeon',    en:'Accordion',    notation:'C',    kurz:['Akk','Acc']},
  {id:'as',   name:'Alt-Sax',      en:'Alto Sax',     notation:'E♭',   kurz:['As','Alt','ASax','Alto','Altsax']},
  {id:'bari', name:'Bariton-Sax',  en:'Baritone Sax', notation:'E♭',   kurz:['Bari','Bar','BSax']},
  {id:'vc',   name:'Cello',        en:'Cello',        notation:'Bass', kurz:['Vc']},
  {id:'bs',   name:'E-Bass',       en:'Bass Guitar',  notation:'Bass', kurz:['Bass','Bs','b']},
  {id:'fl',   name:'Flöte',        en:'Flute',        notation:'C',    kurz:['Fl','Flt']},
  {id:'flh',  name:'Flügelhorn',   en:'Flugelhorn',   notation:'B♭',   kurz:['Flh','Flg']},
  {id:'ges',  name:'Gesang',       en:'Vocals',       notation:'C',    kurz:['Voc','Vox','Ges','Vocal','Chor','Choir','Lead','Back','Backing']},
  {id:'git',  name:'Gitarre',      en:'Guitar',       notation:'C',    kurz:['Git','Gtr','Gt','g']},
  {id:'cl',   name:'Klarinette',   en:'Clarinet',     notation:'B♭',   kurz:['Cl','Klar','Kl','Bassklarinette','Bass Clarinet']},
  {id:'pno',  name:'Klavier',      en:'Piano',        notation:'C',    kurz:['Pno','Key','Klav','p','Keyboard','Keyb','Keys']},
  {id:'kb',   name:'Kontrabass',   en:'Double Bass',  notation:'Bass', kurz:['Kb','Cb']},
  {id:'perc', name:'Percussion',   en:'Percussion',   notation:'',     kurz:['Perc','Pc','Xylo','Xylophon','Xylophone']},
  {id:'pos',  name:'Posaune',      en:'Trombone',     notation:'Bass', kurz:['Pos','Tbn','Trb']},
  {id:'dr',   name:'Schlagzeug',   en:'Drums',        notation:'',     kurz:['Dr','Drs','Schlz','Drm','Drms','Drum']},
  {id:'ss',   name:'Sopran-Sax',   en:'Soprano Sax',  notation:'B♭',   kurz:['Ss','Sop','SSax','Sopran']},
  {id:'ts',   name:'Tenor-Sax',    en:'Tenor Sax',    notation:'B♭',   kurz:['Ts','Ten','TSax','Tenor','Tenorsax']},
  {id:'tp',   name:'Trompete',     en:'Trumpet',      notation:'B♭',   kurz:['Tp','Tpt','Trp','Trpt']},
  {id:'tba',  name:'Tuba',         en:'Tuba',         notation:'Bass', kurz:['Tba']},
  {id:'vln',  name:'Violine',      en:'Violin',       notation:'C',    kurz:['Vln','Vl']},
];
/* Die Marke sagt, welcher Wortschatz zuletzt nachgetragen wurde. Sie ist
   noetig, weil eine einmal gespeicherte Liste die Vorgabe verdraengt: Wer die
   Voices schon sortiert hat, bekaeme neue Abkuerzungen sonst nie zu sehen. */
const INSTR_WORTSCHATZ = 2;
const INSTR_WORT_KEY = 'rb_instrumente_wortschatz';
/* Fuer den Vergleich: Gross- und Kleinschreibung sind gleich, Umlaute und
   Bindestriche zaehlen nicht. „Alt-Sax" und „altsax" sind dasselbe. */
function instrNorm(s){ return (s||'').toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }

const INSTR_FRISCH = () => INSTR_VORGABE.map(x=>({...x, kurz:x.kurz.slice()}));
let INSTRUMENTE = (function(){
  try{ const a=JSON.parse(localStorage.getItem(INSTR_KEY)||'null');
    if(Array.isArray(a) && a.length) return a.map(x=>{
      /* Ein Stand von vor dem 28. Juli kennt das englische Feld noch nicht.
         Was zu einer Vorgabe gehoert, bekommt es nachgereicht. */
      const v=INSTR_VORGABE.find(y=>y.id===String(x.id||''));
      return { id:String(x.id||''), name:String(x.name||''),
               en: x.en!==undefined ? String(x.en) : (v ? v.en : ''),
               notation:NOTATIONEN.includes(x.notation)?x.notation:'',
               kurz:Array.isArray(x.kurz)?x.kurz.map(String):[] };
    }).filter(x=>x.id && x.name);
  }catch(e){}
  return INSTR_FRISCH();
})();
/* Neue Abkuerzungen nachtragen — einmalig, und nur was fehlt.
   Eigene Eintraege und eine von Hand gesetzte Reihenfolge bleiben unberuehrt;
   was Jens selbst geloescht hat, kaeme allerdings einmal zurueck. Das ist der
   Preis dafuer, dass der gemessene Wortschatz ueberhaupt ankommt. */
(function wortschatzNachtragen(){
  let stand=0; try{ stand=parseInt(localStorage.getItem(INSTR_WORT_KEY)||'0',10)||0; }catch(e){}
  if(stand>=INSTR_WORTSCHATZ) return;
  INSTR_VORGABE.forEach(v=>{
    const i=INSTRUMENTE.find(x=>x.id===v.id); if(!i) return;
    const da=new Set(i.kurz.map(instrNorm));
    v.kurz.forEach(k=>{ if(!da.has(instrNorm(k))){ i.kurz.push(k); da.add(instrNorm(k)); } });
  });
  try{ localStorage.setItem(INSTR_KEY, JSON.stringify(INSTRUMENTE));
       localStorage.setItem(INSTR_WORT_KEY, String(INSTR_WORTSCHATZ)); }catch(e){}
})();
/* Alphabetisch nach dem deutschen Namen — die Vorgabe und der Weg zurueck,
   wenn die Reihenfolge von Hand durcheinandergeraten ist. */
function instrumenteAlphabetisch(){
  INSTRUMENTE.sort((a,b)=>a.name.localeCompare(b.name,'de'));
  instrumenteSichern();
}
window.instrumenteAlphabetisch = instrumenteAlphabetisch;
let INSTR_WAHL = localStorage.getItem(INSTR_WAHL_KEY) || '';
function instrumenteSichern(){
  try{ localStorage.setItem(INSTR_KEY, JSON.stringify(INSTRUMENTE)); }catch(e){}
}
function meinInstrument(){ return INSTRUMENTE.find(i=>i.id===INSTR_WAHL) || null; }
window.meinInstrument = meinInstrument;
/* Ein Wechsel des Instruments aendert, welche Ausgabe aufgeht — die Liste
   muss also neu gezeichnet werden. */
function instrumentWaehlen(id){
  INSTR_WAHL = id||'';
  try{ localStorage.setItem(INSTR_WAHL_KEY, INSTR_WAHL); }catch(e){}
  if(window.instrumentMarkeAuffrischen) window.instrumentMarkeAuffrischen();
  if(typeof render==='function') render();
}
window.instrumentWaehlen = instrumentWaehlen;
/* Wer eigene Abkuerzungen eintraegt, kann das Gleichgewicht stoeren: „Tb"
   steht im Deutschen fuer Tuba und im Englischen fuer Trombone. Darum prueft
   das Setup beim Sichern, ob zwei Instrumente dieselbe beanspruchen. */
function kuerzelKonflikte(liste){
  const gesehen=new Map(), streit=[];
  /* Geprueft werden Abkuerzungen UND der englische Name — beide dienen beim
     Import demselben Zweck und koennen sich darum gegenseitig in die Quere
     kommen. */
  (liste||INSTRUMENTE).forEach(i=>[...i.kurz, i.en||''].forEach(k=>{
    const n=instrNorm(k); if(!n) return;
    if(gesehen.has(n) && gesehen.get(n)!==i.name) streit.push({kurz:k, a:gesehen.get(n), b:i.name});
    else gesehen.set(n, i.name);
  }));
  return streit;
}
window.kuerzelKonflikte = kuerzelKonflikte;

/* Welche Stimme aufgeht. Die Rangfolge wird nicht gepflegt, sondern
   gerechnet — aus dem Instrument in drei Stufen:

   1. eine Stimme, die so heisst wie das Instrument. Das trifft im Bandbuch
      zu, wo eine Stimme „Trompete" heisst.
   2. eine Stimme in der Notation des Instruments. Das trifft in den Real
      Books zu, wo die B-Ausgabe die richtige ist.
   3. die C-Ausgabe, und gibt es die nicht, die erste vorhandene.

   Ist kein Instrument gewaehlt, gilt Stufe 3 allein — also genau das
   Verhalten von vorher. Es aendert sich nichts, bis Jens waehlt. */
/* Der Stimmen-Wunsch: die Wahl, die die Rangfolge fuer den Augenblick
   ueberstimmt. Gesetzt wird er nur durch eine ausdrueckliche Wahl — den
   Schalter auf dem Blatt oder einen Tipp auf eine Stimme in der Listenzeile.
   Wer ein Stueck ueber seine Zeile oeffnet, waehlt ein Stueck und keine
   Stimme; dann faellt der Wunsch weg und es gilt wieder das Instrument.

   Er wird nirgends gespeichert und verfaellt damit beim naechsten Start —
   genau wie es das Konzept verlangt. */
let STIMMWUNSCH='';
window.stimmWunsch = s => { STIMMWUNSCH = s||''; };

/* ================================================================
   Schritt 6 — ein Bandbuch lesen

   Die Annahme des Konzepts, hier ausdruecklich: Ein Notensatz traegt im
   Namen einen Hinweis auf das Instrument, fuer das er geschrieben ist.
   Alles andere ist unsauber gearbeitet und wird nicht unterstuetzt. Die
   App raet nicht — was sie nicht erkennt, legt sie dem Nutzer vor.
   ================================================================ */
/* Alle Bewerber aus einem Stueck Text: jede zusammenhaengende Wortfolge, dazu
   jedes einzelne Wort ohne seine angehaengte Zahl. Jeder Bewerber merkt sich,
   am wievielten Wort er beginnt — daran haengt die Vorrangregel unten.

   Die Zahlregel ist am Bestand gemessen: „Alt1" und „Alt2" schreibt Jens ohne
   Leerzeichen, „Bass2" ebenso. Ohne sie blieben diese Dateien liegen. */
function wortfolgen(text){
  const roh=String(text||'').split(/[^0-9A-Za-zÄÖÜäöüß]+/).filter(Boolean);
  const aus=[];
  for(let n=roh.length;n>=1;n--)
    for(let i=0;i+n<=roh.length;i++) aus.push({i, s:instrNorm(roh.slice(i,i+n).join(''))});
  roh.forEach((w,i)=>{ const m=/^(.*?[A-Za-zÄÖÜäöüß])(\d{1,2})$/.exec(w);
    if(m) aus.push({i, s:instrNorm(m[1]), nr:m[2]}); });
  return aus;
}

/* Blaetter, die zum Stueck gehoeren, aber keine Instrumentenstimme sind.
   Am Bestand vermessen: 35 der 460 Dateien. Sie werden VOR dem Instrument
   geprueft, sonst risse „Lead" aus „Lead Sheet" die Datei zum Gesang.

   „Soloform" steht bewusst nicht hier: Jens' Dateien heissen „Soloform Alt 1"
   und „Soloform Floete" — das sind Instrumentenstimmen mit einem Zusatz, kein
   Ablauf. */
const BLATTARTEN=[
  {art:'Leadsheet', w:['leadsheet','leadsh','sheet']},
  {art:'Lyrics',    w:['lyrics','text','songtext','chords','akkorde']},
  {art:'Ablauf',    w:['ablauf','setliste','setlist']},
];
const BLATT_NAMEN = BLATTARTEN.map(a=>a.art);
function blattArt(text){
  const b=wortfolgen(text);
  for(const a of BLATTARTEN) if(b.some(x=>a.w.includes(x.s))) return a.art;
  return null;
}
window.blattArt = blattArt;

/* Welche Voice steckt in diesem Stueck Text?

   Verglichen wird gegen GANZE Woerter — ohne diese Regel schluege „g" in
   „Gesang" an, und die Saengerin bekaeme die Gitarrenstimme.

   Es gewinnt die ZUERST GENANNTE, bei gleichem Anfang die laengste. Vorher
   gewann allein die laengste; das war an Jens' Bestand messbar falsch:
   „Drums + Perc." wurde Schlagzeug, „Drm+Perc." dagegen Percussion — dieselbe
   Sache, zwei Instrumente. Gemessen kostete die alte Regel den Schlagzeuger
   seine Stimme bei 4 von 29 Stuecken, die neue bei einem. Der Grund dahinter:
   Wer zwei Instrumente in einen Dateinamen schreibt, nennt sein eigenes
   zuerst. */
function voiceAusText(text){
  const b=wortfolgen(text); if(!b.length) return null;
  let treffer=null, wo=1e9, laenge=-1;
  INSTRUMENTE.forEach(inst=>{
    [inst.name, inst.en, ...inst.kurz].filter(Boolean).forEach(kand=>{
      const k=instrNorm(kand); if(!k) return;
      b.forEach(x=>{ if(x.s!==k) return;
        if(x.i<wo || (x.i===wo && k.length>laenge)){ wo=x.i; laenge=k.length; treffer=inst; } });
    });
  });
  return treffer;
}
window.voiceAusText = voiceAusText;
/* Dateiname in Titel und Stimmen-Text zerlegen. Geteilt wird an der LETZTEN
   Fundstelle des Trennzeichens: „Blue Bossa - Take 2 - tp.pdf" ist das Stueck
   „Blue Bossa - Take 2" mit der Stimme „tp". */
/* Genau die Endungen, die der Import kennt — und keine allgemeine Regel:
   „St. Thomas" oder „Nica´s Dream Vol.2" duerfen nicht beschnitten werden. */
const ENDUNG=/\.(pdf|mp3|m4a|wav|aac|aif|aiff)$/i;
function nameZerlegen(dateiname, trenner){
  const ohne=String(dateiname||'').replace(ENDUNG,'').trim();
  const t=trenner||'-';
  const i=ohne.lastIndexOf(t);
  if(i<0) return { titel:ohne, rest:'' };
  return { titel:ohne.slice(0,i).trim()||ohne, rest:ohne.slice(i+t.length).trim() };
}
window.nameZerlegen = nameZerlegen;

/* Ein Dateiname ohne Trennzeichen: „Bienentanz Alt 1.pdf". Wo hoert das Stueck
   auf und wo faengt die Stimme an?

   Gesucht wird die STELLE, an der die Stimme beginnt — nicht bloss, ob eine
   drinsteht. Dafuer wird von hinten geprueft: Der letzte Wortanfang, ab dem
   der Rest noch eine Stimme enthaelt, ist ihr Anfang. Alles davor ist der
   Titel.

   Gebraucht wird das auf dem iPad. Safari kann dort keine Ordner waehlen, und
   ohne Ordner gaebe es keinen Titel — aus 460 Blaettern wuerden 460 Stuecke.
   Am Mac bleibt der Ordner der bessere Weg, weil er nicht raten muss. */
/* Faengt an DIESER Stelle eine Stimme an? Geprueft wird nur das erste Wort —
   „enthaelt irgendwo eine Stimme" waere zu wenig, denn dann bliebe bei
   „St. Thomas Drum Perc." das Wort „Drum" im Titel haengen, weil auch „Perc."
   noch eine Stimme ist. */
function stimmeAmAnfang(text){
  const b=wortfolgen(text).filter(x=>x.i===0);
  if(!b.length) return false;
  for(const a of BLATTARTEN) if(b.some(x=>a.w.includes(x.s))) return true;
  for(const inst of INSTRUMENTE){
    const kand=[inst.name, inst.en].concat(inst.kurz||[]).filter(Boolean).map(instrNorm);
    if(b.some(x=>kand.includes(x.s))) return true;
  }
  return false;
}
function titelVorStimme(dateiname){
  const ohne=String(dateiname||'').replace(ENDUNG,'').trim();
  const woerter=[]; const re=/[0-9A-Za-zÄÖÜäöüß]+/g; let m;
  while((m=re.exec(ohne))) woerter.push({w:m[0], von:m.index});
  if(woerter.length<2) return null;
  /* Vorwaerts: die FRUEHESTE Stelle, an der eine Stimme beginnt. Alles davor
     ist der Titel, alles danach gehoert zur Stimme. */
  for(let k=1; k<woerter.length; k++){
    if(!stimmeAmAnfang(ohne.slice(woerter[k].von))) continue;
    const titel=ohne.slice(0,woerter[k].von).replace(/[\s_\-–—:.,]+$/,'').trim();
    return titel ? { titel, rest:ohne.slice(woerter[k].von).trim() } : null;
  }
  return null;
}
window.titelVorStimme = titelVorStimme;
window.stimmeAmAnfang = stimmeAmAnfang;

/* ---- Das Etikett: was auf dem Schalter steht ---------------------------
   In der Regel ist es der Instrumentenname; „Alt-Sax" ist genau richtig. Nur
   wenn ZWEI Blaetter desselben Stuecks auf dasselbe Instrument fallen, sagt
   der Name nichts mehr — dann stand bei `Bienentanz` zweimal „Alt-Sax" und man
   musste raten. Erst dort wird der Rest des Dateinamens herangezogen, also
   Jens' eigene Schreibweise: „Alt 1", „Alt 2". Reicht der Rest nicht, wird
   durchgezaehlt.

   Diese Rechnung stand bis zum 30. Juli nur im Import. Die Vorschau zeigte
   deshalb „Alt-Sax · Alt-Sax", geschrieben wurde aber „Alt 1" und „Alt 2" —
   die Vorschau zeigte etwas anderes als das Ergebnis. Jetzt rechnen beide mit
   dieser einen Funktion.

   `saetze` = [{instrument, rest}] und bekommt `.etikett` gesetzt.
   `vorhandene` = Instrumente der Blaetter, die am Stueck schon haengen. */
const ETIKETT_ZUSATZ=/(^|[\s_\-–—]+)(neu|new|kopie|copy|final)\s*\d*(?=$|[\s_\-–—])/gi;
function etikettSauber(r){
  return String(r||'')
    .replace(ETIKETT_ZUSATZ,' ')
    .replace(/[\s_\-–—:.,]+/g,' ')
    .replace(/\s+/g,' ').trim().slice(0,18);
}
function etikettenBerechnen(saetze, vorhandene){
  const zahl={}, lauf={};
  (vorhandene||[]).forEach(i=>{ const k=i||''; zahl[k]=(zahl[k]||0)+1; lauf[k]=(lauf[k]||0)+1; });
  (saetze||[]).forEach(s=>{ const k=s.instrument||''; zahl[k]=(zahl[k]||0)+1; });
  (saetze||[]).forEach(s=>{
    const k=s.instrument||'';
    if(zahl[k]<=1){ s.etikett=k; return; }
    const r=etikettSauber(s.rest);
    lauf[k]=(lauf[k]||0)+1;
    s.etikett = (r && r.length<=18) ? r : (k+' '+lauf[k]);
  });
  return saetze;
}
/* Ordnen: erst nach dem Instrument, dann nach dem Etikett. Ohne den zweiten
   Schluessel stehen „Alt 2" und „Alt 1" in der Reihenfolge, in der die
   Dateien hereinkamen. */
function nachStimmeOrdnen(a, b){
  return (stimmenRang(a.instrument||a.voice||'') - stimmenRang(b.instrument||b.voice||''))
      || String(a.etikett||'').localeCompare(String(b.etikett||''),'de',{numeric:true});
}
window.etikettenBerechnen = etikettenBerechnen;
window.nachStimmeOrdnen = nachStimmeOrdnen;

/* Die Reihenfolge der Stimmen. Tonarten stehen fest; Bandstimmen folgen der
   Voice-Liste — also der Ordnung, die Jens im Setup durch Ziehen setzt. */
function stimmenRang(s){
  const i=STIMM_ORDNUNG.indexOf(s); if(i>=0) return i;
  const n=instrNorm(s); if(!n) return 999;
  const j=INSTRUMENTE.findIndex(x=>instrNorm(x.name)===n || instrNorm(x.en)===n);
  if(j>=0) return 100+j;
  /* Blaetter stehen hinter allen Instrumenten, aber in fester Reihenfolge —
     Leadsheet zuerst, weil es das einzige ist, das man spielen kann. */
  const b=BLATT_NAMEN.indexOf(s); if(b>=0) return 200+b;
  return 998;
}
window.stimmenRang = stimmenRang;

/* Etikett und Instrument sind zweierlei — Schritt 3 des Import-Konzepts.
   Auf dem Schalter steht Jens' Schreibweise („Alt 1", „Alt 2"), verglichen
   wird aber das erkannte Instrument („Alt-Sax"). Ohne diese Trennung fiele
   die Zuordnung aus, sobald zwei Stimmen desselben Instruments eigene
   Etiketten tragen: „Alt 1" steht in keiner Instrumentenliste.
   Blaetter der Grossammlung tragen kein Instrument; dort ist `stimme` die
   Notation und zugleich der Vergleichswert. */
const stimmWert = t => (t && (t.instrument || t.stimme)) || '';
window.stimmWert = stimmWert;

function waehleStimme(stimmen){
  if(!stimmen || !stimmen.length) return null;
  const ich=meinInstrument();
  if(ich){
    /* Stufe 1 kennt beide Namen. Eine Bandstimme kann „Gitarre" heissen oder
       „Guitar" — fuer den Spieler ist es dasselbe. */
    const namen=[ich.name, ich.en].filter(Boolean).map(instrNorm);
    const nachName = stimmen.find(t=>namen.includes(instrNorm(stimmWert(t))));
    if(nachName) return nachName;
    if(ich.notation){
      const nachNotation = stimmen.find(t=>stimmWert(t)===ich.notation);
      if(nachNotation) return nachNotation;
    }
  }
  /* Entschieden am 28. Juli: Ein Leadsheet ist die C-Fassung und geht auf,
     wenn die gewaehlte Voice keine eigene Stimme hat. „Lyrics" und „Ablauf"
     bleiben neutral und gehen nie von selbst auf — sie stehen deshalb hier
     nicht, obwohl sie derselben Art angehoeren. */
  return stimmen.find(t=>stimmWert(t)==='C')
      || stimmen.find(t=>stimmWert(t)==='Leadsheet')
      || stimmen[0];
}

function applyOverride(key, patch){
  const t=byKey[key]; if(!t) return;
  const o=Object.assign({}, OVERRIDES[key]);
  if('t' in patch){ const v=(patch.t||'').trim(); if(v && v!==t._ot){ o.t=v; t.t=v; } else { delete o.t; t.t=t._ot; } }
  if('c' in patch){ const v=(patch.c||'').trim(); if(v!==(t._oc||'')){ o.c=v; t.c=v; } else { delete o.c; t.c=t._oc; } }
  if(Object.keys(o).length) OVERRIDES[key]=o; else delete OVERRIDES[key];
  saveOverrides(); rebuildByKey(); render();
}

/* ============================================================================
   Schritt 1c: Die Oberflaeche liest aus der neuen Ablage.

   Getauscht wird die Adapterschicht, nicht die Oberflaeche. Ein Eintrag aus
   BS bekommt genau die Form, die die Liste, die Buehne und der Druck schon
   kennen — mit einem Unterschied: `f` bleibt LEER. Die Bytes kommen erst beim
   Aufschlagen, ueber `urlSichern`. Damit haengen keine 294 MB mehr dauerhaft
   am Speicher.

   `libId` ist ab jetzt die Element-Kennung aus BS. Deshalb arbeiten `libGet`,
   `libDelete` und `saveLibMeta` unveraendert weiter — sie sind unten zu
   Adaptern auf BS umgebaut, und ihre fuenfzehn Aufrufstellen bleiben, wie sie
   waren.
   ============================================================================ */
function bsZuTune(el, ti, bu){
  const t = { key:'bs|'+el.id, libId:el.id, isLib:true, bsId:el.id, titelId:el.titelId,
    art:el.art, t:ti.titel||'(ohne Titel)', c:ti.komponist||'',
    pg:'1', b:(bu&&bu.name)||'Eigene Noten', bid:ti.buchId, np:el.np||1,
    addedAt:el.angelegt||0, groesse:el.groesse||0, dateiname:el.dateiname||'',
    ziel:el.ziel||'', f:'' };
  /* Traegt ein Satz eine Stimme, gehoert er zu einer Gruppe, und seine Zeile
     bekommt die Stimmen-Schalter wie ein Real Book. Die Gruppe ist jetzt der
     TITEL selbst und nicht mehr ein aus dem Namen gerechneter Schluessel —
     deshalb verschmelzen zwei gleichnamige Stuecke nicht mehr. */
  const hatStimme = !!(el.instrument || el.etikett);
  if(hatStimme){
    t.instrument = el.instrument||'';
    t.stimme = el.etikett || el.instrument || '';
    t.fam='ub|'+ti.buchId; t.gid='bs|'+el.titelId;
  } else { t.instrument=''; t.stimme=''; t.fam=''; t.gid=t.key; }
  return t;
}
/* GRUPPEN wird beim Start aus TUNES gerechnet; die eigenen Saetze kommen erst
   mit loadLibrary dazu und muessen nachgetragen werden — und bei jedem
   Neuladen zuerst wieder heraus, sonst stuenden sie doppelt darin. */
function gruppenLibNachtragen(){
  Object.keys(GRUPPEN).forEach(g=>{ if(g.startsWith('bs|')) delete GRUPPEN[g]; });
  LIBTUNES.forEach(t=>{ if(!t.fam) return; (GRUPPEN[t.gid]=GRUPPEN[t.gid]||[]).push(t); });
  Object.keys(GRUPPEN).forEach(g=>{ if(g.startsWith('bs|'))
    GRUPPEN[g].sort((x,y)=>(stimmenRang(stimmWert(x))-stimmenRang(stimmWert(y)))
      || (x.stimme||'').localeCompare(y.stimme||'','de',{numeric:true})); });
}
/* Der Katalog des eigenen Bestands. Gemessen an 6.231 Blaettern: 275 ms, und
   ohne eine einzige Object-URL. Der alte Weg las alle Blobs mit und legte je
   Blatt eine URL an — 709 ms, bei jedem Start und nach jeder Aenderung. */
let BS_KATALOG={buecher:[],titel:[],elemente:[]};
async function loadLibrary(){
  let k={buecher:[],titel:[],elemente:[]};
  try{ k=await BS.katalog(); }catch(e){ k={buecher:[],titel:[],elemente:[]}; }
  BS_KATALOG=k;
  /* Die Buecher-Liste der Oberflaeche spiegelt die Buecher aus BS. Sie bleibt
     synchron lesbar, weil sehr viele Stellen sie ohne `await` brauchen. */
  USERBOOKS = k.buecher
    .slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','de'))
    .map(b=>({bid:b.id, name:b.name, chip:b.chip||b.name, createdAt:b.angelegt||0, hubId:b.hubId||null}));
  const buchById=Object.fromEntries(k.buecher.map(b=>[b.id,b]));
  const titelById=Object.fromEntries(k.titel.map(t=>[t.id,t]));
  /* Frueher geliehene URLs zurueckgeben, damit nichts angeheftet bleibt. */
  LIBTUNES.forEach(t=>{ if(t.bsId && t.f) urlFreigeben(t); });
  LIBTUNES = k.elemente
    .map(el=>{ const ti=titelById[el.titelId]; if(!ti) return null;
               return bsZuTune(el, ti, buchById[ti.buchId]); })
    .filter(Boolean)
    .sort((a,b)=> (a.t||'').localeCompare(b.t||'','de')
               || (stimmenRang(stimmWert(a))-stimmenRang(stimmWert(b))));
  if(typeof gruppenLibNachtragen==='function') gruppenLibNachtragen();
  rebuildByKey();
}

/* ---- Bytes auf Zuruf: ein Verweis wird geliehen, nicht gehalten ----------
   Die Oberflaeche liest an 21 Stellen `t.f`. Statt alle einundzwanzig
   umzuschreiben, wird `t.f` unmittelbar vor Gebrauch gefuellt. Der Vorrat ist
   begrenzt; laeuft er ueber, gibt der aelteste Eintrag seinen Verweis zurueck
   und sein `t.f` wird wieder leer. So bleibt nie mehr als eine Handvoll
   Blaetter angeheftet.

   Diese eine Stelle ersetzt die dauerhafte Object-URL des alten Modells. Der
   Safari-Betrachter selbst wird nicht angefasst — er bekommt nur seinen
   Verweis von hier. */
const URL_VORRAT=8;
const _urlHalter=new Map();   // bsId -> tune
function urlFreigeben(t){
  if(!t || !t.bsId) return;
  if(_urlHalter.has(t.bsId)){ _urlHalter.delete(t.bsId); BS.urlZurueck(t.bsId); }
  t.f='';
}
async function urlSichern(t){
  if(!t) return '';
  if(!t.bsId) return t.f||'';            // Grossammlung: echter Pfad
  if(t.f && _urlHalter.has(t.bsId)){     // schon geliehen: nach vorn holen
    _urlHalter.delete(t.bsId); _urlHalter.set(t.bsId,t); return t.f;
  }
  let url=''; try{ url=await BS.urlLeihen(t.bsId)||''; }catch(e){ url=''; }
  if(!url) return '';
  t.f=url; _urlHalter.set(t.bsId,t);
  while(_urlHalter.size>URL_VORRAT){
    const alt=_urlHalter.values().next().value;
    if(!alt || alt===t) break;
    urlFreigeben(alt);
  }
  return url;
}
/* Mehrere auf einmal — fuer Drucken, Teilen und die Setlist. Der Vorrat wird
   dafuer kurz geweitet, sonst zieht das Fuellen dem Anfang der Liste den
   Verweis wieder weg. */
async function urlSichernViele(items){
  const liste=(items||[]).filter(x=>x && x.bsId);
  for(const t of liste){
    if(t.f) continue;
    try{ const u=await BS.urlLeihen(t.bsId); if(u){ t.f=u; _urlHalter.set(t.bsId,t); } }catch(e){}
  }
  return items;
}
/* Nach Drucken oder Teilen wieder einziehen. Ohne das blieben bei einer
   Setlist mit dreissig Stuecken dreissig Verweise haengen. */
function urlFreigebenViele(items){ (items||[]).forEach(t=>{ if(t&&t.bsId) urlFreigeben(t); }); }
window.urlSichern=urlSichern; window.urlSichernViele=urlSichernViele;

   schmale Zeile neben dem Zahnrad, und die konnte nur zwei Zahlen tragen:
   „17 Buecher · 4.309 Stuecke". Welche siebzehn, sagte sie nicht.

   Jetzt nimmt sie den Raum zwischen der Bibliothek und dem Zahnrad ein und
   benennt die Buecher. Darunter steht die Gesamtzahl der Stuecke. Damit ist
   die Kontextzeile ueber der Liste ueberfluessig geworden und entfallen. */
function markeZahlen(){
  const el=document.getElementById('count'); if(!el) return;
  const ids = S.books.size ? [...S.books] : (typeof ALLBOOKS!=='undefined' ? ALLBOOKS.slice() : []);
  const namen = ids.map(b=>bookTitel(b)).sort((a,b)=>a.localeCompare(b,'de'));
  /* Gezaehlt wird der BESTAND der aktiven Buecher, nicht die Treffer. Die
     Treffer stehen in der Kopfzeile unter dem Suchschlitz; hier stuende
     dieselbe Zahl ein zweites Mal, und beim Suchen liefe sie mit — dann
     saehe es aus, als schrumpfe die Sammlung.

     Gezaehlt werden Stuecke, nicht Blaetter. Seit Schritt 3 stehen die
     transponierten Ausgaben in einer Zeile, und die Zahl muss dazu passen.
     Der Zusatz nennt die Blaetter dahinter, damit klar bleibt, dass nichts
     fehlt. */

               + '</div>'

function matches(t){
  if(S.books.size && !S.books.has(t.bid)) return false;
  if(S.initial && initialOf(t)!==S.initial) return false;
  if(S.q){const q=norm(S.q); if(!norm(t.t).includes(q) && !norm(t.c).includes(q) && !norm(t.editor).includes(q)) return false;}
  if(S.tagFilter.size){const tt=tuneTagIds(t.key); if(![...S.tagFilter].some(id=>tt.includes(id))) return false;}
  return true;
}
function currentList(){
  let list=ALL().filter(matches);
  // „Sonstiges Material" ausblenden, wenn abgeschaltet (außer im Reiter „Bearbeitet" oder wenn gezielt gefiltert)
  if(!S.sonstOn && S.view!=='edited' && !S.books.has(SONST_BID)) list=list.filter(t=>t.bid!==SONST_BID);
  /* Favorit, Ueben und Tags fragen die ganze Gruppe. Sonst zeigte die
     Favoriten-Ansicht nur die eine Ausgabe, an der die Marke haengt, und die
     uebrigen Stimmen desselben Stuecks fehlten in der Zeile. */
  if(S.view==='fav') list=list.filter(t=>gruppeHat(S.fav,t));
  else if(S.view==='prac') list=list.filter(t=>gruppeHat(S.prac,t));
  else if(S.view==='edited'){ list=list.filter(t=>t.isEdit); list.sort((a,b)=>(b.editedAt||0)-(a.editedAt||0)); return list; }
  else if(S.view.startsWith('tag:')){
    const id=S.view.slice(4); list=list.filter(t=>gruppeTagIds(t).includes(id));
    /* Eine eigene Reihenfolge je Tag, sobald einmal gezogen wurde. Sie liegt
       in einem eigenen Speicher und ruehrt die Tag-Zuordnungen nicht an — v3
       liest dieselben Schluessel, und Schritt 9 soll sauber bleiben. */
    const ord=tagOrdnung(id);
    if(ord.length){
      const rang=new Map(ord.map((k,i)=>[k,i]));
      list.sort((x,y)=>{ const i=rang.has(x.key)?rang.get(x.key):9e9, j=rang.has(y.key)?rang.get(y.key):9e9;
        return i-j || norm(x.t).localeCompare(norm(y.t)); });
      return list;
    }
  }
  list.sort((a,b)=>norm(a.t).localeCompare(norm(b.t))|| (a.b||bookName(a)||'').localeCompare(b.b||bookName(b)||''));
  return list;
}

/* ---------- top tabs (incl. pinned tags) ---------- */
function renderTabs(){
  const el=document.getElementById('tabs');
  /* Die beiden Koepfe „Buecher" und „Tags" gehoeren in dieselbe Liste wie die
     Reiter. Standen sie daneben, liessen sich die untersten beiden Eintraege
     der Seitenleiste als einzige nicht mitsortieren.

     Sie werden NICHT neu gebaut, sondern nur aus dem Baum genommen und
     wieder eingehaengt: So behalten sie ihre Anbindung an die Dialoge, ihre
     Zaehler und ihr langes Tippen. */
  const koepfe = ['bookToggle','tagToggle'].map(id=>document.getElementById(id)).filter(Boolean);
  koepfe.forEach(k=>{ k.dataset.view = (k.id==='bookToggle') ? 'dlg:books' : 'dlg:lists'; k.remove(); });
  el.innerHTML='';
  /* Symbol und Beschriftung liegen in eigenen Elementen. Nur so kann der
     Rail-Zustand die Beschriftung verkleinern und das Symbol darueber stellen. */
  const base=[
    ['all','Alle',null,'menu'],
    ['fav','Favoriten',S.fav.size,'star'],
    ['prac','Üben',S.prac.size,'metronome'],
    ['recent','Zuletzt', Object.keys(S.recent).length,'clock'],
    ['edited','Bearbeitet',USER.length,'pencil'],
    ['set','Setlists',S.sets.length,'list-music'],
  ];
  /* Jeder Eintrag als Bauauftrag: eine Kennung und eine Funktion, die den
     Knoten liefert. Nur so lassen sich neu gebaute Reiter und verschobene
     Koepfe in EINER Reihenfolge mischen. */
  const eintraege = base.map(([v,label,badge,icon])=>({ v, hol:()=>{
    const d=document.createElement('div'); d.className='tab'+(S.view===v?' active':''); d.dataset.view=v;
    d.innerHTML='<i class="i ic-'+icon+'"></i><span class="lab">'+esc(label)+'</span>'
      +(badge!=null?` <span class="badge">${badge}</span>`:'');
    d.onclick=()=>{S.view=v;S.openSet=null;render();};
    return d; }}));
  eintraege.push({ v:'tags', hol:()=>{
    const d=document.createElement('div'); d.className='tab'; d.style.borderStyle='dashed';
    d.dataset.view='tags';
    d.innerHTML='<i class="i ic-tags"></i><span class="lab">Tags verwalten</span>';
    d.onclick=manageTagsFlow; return d; }});
  koepfe.forEach(k=>eintraege.push({ v:k.dataset.view, hol:()=>k }));
  /* Eigene Reihenfolge, per Ziehen gesetzt (siehe unten). Was nicht in der
     gespeicherten Liste steht, bleibt hinten in der urspruenglichen Ordnung. */
  const ordnung=(()=>{ try{ const a=JSON.parse(localStorage.getItem('rb_taborder')||'[]');
    return Array.isArray(a)?a:[]; }catch(e){ return []; } })();
  if(ordnung.length) eintraege.sort((x,y)=>{
    const i=ordnung.indexOf(x.v), j=ordnung.indexOf(y.v);
    return (i<0?99:i)-(j<0?99:j);
  });
  eintraege.forEach(e=>el.append(e.hol()));
  renderTagTabs();
}
/* Reihenfolge je Tag — eigener Speicher, damit die Tag-Zuordnungen und der
   Abgleich unberuehrt bleiben. */
const TAGORDER_KEY='rb_tagorder';
function tagOrdnungAlle(){ try{ return JSON.parse(localStorage.getItem(TAGORDER_KEY)||'{}')||{}; }catch(e){ return {}; } }
function tagOrdnung(id){ const a=tagOrdnungAlle()[id]; return Array.isArray(a)?a:[]; }
function tagOrdnungSetzen(id, keys){
  const alle=tagOrdnungAlle(); alle[id]=keys;
  try{ localStorage.setItem(TAGORDER_KEY, JSON.stringify(alle)); }catch(e){}
}
function tagCount(id){ let n=0; for(const k in S.tuneTags){ if((S.tuneTags[k]||[]).includes(id)) n++; } return n; }
function renderTagTabs(){
  const el=document.getElementById('tagtabs'); if(!el) return; el.innerHTML='';
  const tags=S.tags.filter(t=>t.pinned || tagCount(t.id)>0);
  tags.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || norm(a.name).localeCompare(norm(b.name)));

  });
}

/* Langes Tippen: 550 ms ohne nennenswerte Bewegung. Der danach folgende Klick
   wird verworfen, sonst ginge zugleich der Betrachter auf. */
function langesTippen(el, tuWas){
  if(!el) return;
  let uhr=null, x0=0, y0=0;
  const ab=()=>{ clearTimeout(uhr); uhr=null; };
  el.addEventListener('pointerdown', e=>{
    x0=e.clientX; y0=e.clientY; ab();
    uhr=setTimeout(()=>{ uhr=null;
      const li=el.closest('li'); if(li) li._langGetippt=true;
      tuWas();
    }, 550);
  });
  el.addEventListener('pointermove', e=>{
    if(uhr && (Math.abs(e.clientX-x0)>10 || Math.abs(e.clientY-y0)>10)) ab();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n, ab));
}
function tuneRow(t, stimmen){
  const li=document.createElement('li'); li.className='tune'; li.dataset.key=t.key;
  /* Die Zeile steht fuer das ganze Stueck, nicht fuer eine seiner Ausgaben.
     Ueber die Gruppen-Kennung findet sie sich wieder, gleich welche Stimme
     gerade offen ist. */
  li.dataset.gid = t.gid || t.key;
  /* Die Zeile des zuletzt geoeffneten Stuecks kommt schon ausgezeichnet zur
     Welt. Bis zum 28. Juli wurde sie erst nach dem Zeichnen markiert, und wer
     die Liste auf einem Weg neu aufbaute, der diesen Nachlauf nicht ausloest,
     verlor die Hervorhebung. */
  /* Ausgezeichnet wird das Stueck, sobald IRGENDEINE seiner Stimmen offen
     ist. Sonst verlor die Zeile ihre Hervorhebung, wenn man auf E tippte —
     denn die Zeile traegt den Schluessel der C-Ausgabe. */
  if(window.aktivesStueck && (stimmen||[t]).some(s=>s.key===window.aktivesStueck))
    li.setAttribute('aria-selected','true');
  /* Die Marken gehoeren dem Stueck. Traegt irgendeine Ausgabe den Stern, ist
     die Zeile ein Favorit — auch wenn gerade eine andere Stimme zu sehen ist. */
  const star=gruppeHat(S.fav,t), prac=gruppeHat(S.prac,t);
  const tt=gruppeTagIds(t); const hasTags=tt.length>0;
  let metaHTML;
  if(t.isEdit){ const d=t.editedAt?new Date(t.editedAt).toLocaleDateString('de-DE'):'';
    metaHTML=`<span>✏️${t.editor?' '+esc(t.editor)+' ·':''}</span><span class="book">${esc(bookName(t))}</span>`
      +`${d?`<span>· ${d}</span>`:''}${seitenzahl(t)}`; }
  else metaHTML=`${t.c?`<span>${esc(t.c)} ·</span>`:''}<span class="book">${esc(bookName(t))}</span>`
      +`<span class="book">· S.&nbsp;${esc(t.pg)}</span>${seitenzahl(t)}`;
  li.innerHTML=`
    <div class="main">
      <div class="tline">
        <div class="title">${esc(t.t)}</div>
        ${aktionenHTML(hasTags,prac,star)}
      </div>
      <div class="meta">${metaHTML}${pillenHTML(tt)}</div>
      ${stimmenZeile(stimmen,t)}
    </div>`;
  /* Titel und Komponist korrigiert man mit langem Tippen auf den Titel. Das
     ✎ ist dafuer aus der Zeile gefallen; sie traegt jetzt die vier Symbole des
     Entwurfs. Das Menue von iOS laesst sich nicht erweitern — entweder dessen
     Textauswahl oder unsere Geste, beides zusammen geht nicht. */
  langesTippen(li.querySelector('.title'), ()=>openMetaSheet(t));
  /* Wer die Zeile antippt, waehlt ein STUECK und keine Stimme. Ein frueher
     gesetzter Wunsch faellt damit weg, und es gilt wieder das Instrument —
     also genau das, was die Zeile zeigt. */
  li.querySelector('.main').onclick=()=>{ if(li._langGetippt){ li._langGetippt=false; return; }
    STIMMWUNSCH=''; openViewer(t); };
  verdrahteAktionen(li,t); verdrahtePillen(li); verdrahteStimmen(li);
  li.prepend(selBox(t.key)); if(S.selection.has(t.key)) li.classList.add('selected');
  /* In einer Tag-Ansicht laesst sich die Reihenfolge ziehen; dafuer bekommt
     die Zeile einen Griff. */
  if(S.view.startsWith('tag:')){
    const g=document.createElement('div'); g.className='handle'; g.title='Zum Sortieren ziehen';
    g.innerHTML='<i class="i ic-grip-vertical"></i>';
    li.prepend(g);
  }
  return li;
}
/* Bausteine der Zeile — einmal beschrieben, von beiden Zeilenbauern benutzt. */
function seitenzahl(t){ return t.np>1 ? `<span>· ${t.np}&nbsp;S.</span>` : ''; }
/* Die Stimmen stehen seit dem 28. Juli in einer EIGENEN, untersten Zeile,
   nicht mehr am Ende der Metazeile. Dort rutschten sie bei schmaler Liste
   hinter Komponist, Buch, Seite und Tags in die zweite oder dritte
   Umbruchzeile und waren im Querformat kaum zu treffen. Als eigene Zeile
   stehen sie immer an derselben Stelle.

   Die Kuerzel der hochgeladenen Dateien stehen dabei — sie sind Stimmen
   derselben Sache, nur aus einer anderen Quelle. */
function stimmenZeile(stimmen, zeige){
  const s = stimmenHTML(stimmen, zeige);
  const b = window.voiceBadges ? window.voiceBadges(zeige) : '';
  return (s||b) ? '<div class="stimmzeile">'+s+b+'</div>' : '';
}
/* Ein Tipp oeffnet genau diese Stimme. Traegt ein Stueck nur eine, steht
   nichts da — das ist der Regelfall bei zwei Dritteln der Sammlung. */
function stimmenHTML(stimmen, zeige){
  if(!stimmen || stimmen.length<2) return '';
  /* Ausgezeichnet ist die Stimme, die wirklich auf der Buehne liegt. Bis zum
     28. Juli stand die Marke immer auf der Stimme, die AUFGEGANGEN WAERE —
     ein Tipp auf E oeffnete zwar E, aber blau blieb C. */
  const aktiv = window.aktivesStueck;
  const gezeigt = stimmen.some(s=>s.key===aktiv) ? aktiv : zeige.key;
  return '<span class="stimmen">'+stimmen.map(s=>
    '<button class="stimme'+(s.key===gezeigt?' an':'')+'" data-skey="'+esc(s.key)+'"'
    + ' title="'+esc(s.stimme)+'-Ausgabe öffnen · S. '+esc(s.pg)+'">'+esc(s.stimme)+'</button>').join('')+'</span>';
}

         Blaettern mit, bis eine andere getroffen wird. */
      const t=byKey[b.dataset.skey]; if(t){ STIMMWUNSCH = t.stimme||''; openViewer(t); } };
  });

function pillenHTML(tagIds){

function aktionenHTML(hasTags,prac,star){
  return `<div class="racts">
        <div class="iconbtn ${hasTags?'on-tag':''}" data-a="tag" title="Tags"><i class="i ic-tag"></i></div>
        <div class="iconbtn" data-a="set" title="Zu Setlist hinzufügen"><i class="i ic-list-plus"></i></div>

        <div class="iconbtn ${star?'on-star':''}" data-a="star" title="Favorit"><i class="i ic-star"></i></div>

function verdrahteAktionen(li,t){
  /* Die Schaltflaechen liegen jetzt INNERHALB von .main, damit sie auf der
     Titelzeile sitzen. Ohne diese Sperre wuerde ihr Klick weiterlaufen und
     zugleich das Stueck oeffnen. */
  li.querySelector('.racts').addEventListener('click', e=>e.stopPropagation());
  /* Geschrieben wird auf die Leitstimme, also die C-Ausgabe. Angezeigt wird
     die Marke fuer die ganze Gruppe. Traegt eine andere Ausgabe sie schon,
     wuerde ein Tipp auf die Leitstimme eine zweite setzen statt die
     vorhandene zu loeschen — deshalb raeumt das Abschalten die ganze Gruppe. */
  const ziel=schreibBlatt(t);
  li.querySelector('[data-a=tag]').onclick=()=>assignTagsFlow(ziel);
  li.querySelector('[data-a=set]').onclick=()=>addToSetlistFlow(ziel);
  li.querySelector('[data-a=prac]').onclick=()=>gruppeSchalten(S.prac,t,ziel);
  li.querySelector('[data-a=star]').onclick=()=>gruppeSchalten(S.fav,t,ziel);
}
/* An: auf die Leitstimme schreiben. Aus: bei allen Stimmen entfernen, sonst
   bliebe eine Marke an einer Ausgabe haengen, die man gar nicht sieht. */
function gruppeSchalten(menge,t,ziel){
  if(gruppeHat(menge,t)) gruppenBlaetter(t).forEach(x=>menge.delete(x.key));
  else menge.add(ziel.key);
  save(); render();
}
function toggle(set,key){ set.has(key)?set.delete(key):set.add(key); save(); render(); }

/* Die Kopfzeile der Titelliste. Oben, was gerade filtert — Buecher und
   Anfangsbuchstabe —, darunter die Zahl der Treffer. Vorher stand alles in
   einer Zeile und in Grossbuchstaben. */
function kontextzeile(treffer){
  /* Die Kontextzeile ist am 28. Juli entfallen. Sie nannte Buecher,
     Anfangsbuchstaben und Tags — und sagte damit dasselbe wie die
     Statusflaeche in der Seitenleiste, nur kuerzer. Es bleibt die
     Trefferzahl. */
  const h=document.getElementById('hint');
  if(h) h.innerHTML='<b>'+treffer.toLocaleString('de-DE')+'</b> '+(treffer===1?'Treffer':'Treffer');
  /* Die Anzahl neben den Koepfen der Seitenleiste. */
  const bc=document.getElementById('bookCnt');
  if(bc){ bc.textContent = S.books.size ? S.books.size : (typeof ALLBOOKS!=='undefined'?ALLBOOKS.length:'');
          bc.classList.toggle('aktiv', S.books.size>0); }
  const tc=document.getElementById('tagCnt');
  if(tc){ const n=S.tags.filter(t=>t.pinned||tagCount(t.id)>0).length;

     die aufgeht. */
  const schluessel=zeilen.map(z=>z.zeige.key);

  listeAufbauen(main, zeilen, !S.initial, merke);

/* ================================================================
   Die Liste legt nur an, was zu sehen ist.

   Jens hat am 28. Juli auf dem iPad gemessen: Das Drehen kostete bei
   4.310 Zeilen 310 ms, bei 440 Zeilen 33 ms. Nicht das Zeichnen der
   Liste ist teuer, sondern ihr Umbruch — und der faellt bei jeder
   Aenderung der Spaltenbreite an, also bei jedem Drehen. Der Versuch,
   die Zeilen ueber content-visibility vom Umbruch auszunehmen, wirkt in
   Chromium und auf seinem Safari nicht.

   Deshalb stehen jetzt nur noch die Zeilen im Dokument, die man sehen
   kann, dazu ein Puffer darueber und darunter. Ober- und unterhalb haelt
   je ein leerer Platzhalter die Gesamthoehe, damit die Bildlaufleiste
   stimmt.

   Nur fuer lange Listen. Kurze werden vollstaendig gezeichnet, und die
   Tag-Ansichten immer — dort wird durch Ziehen sortiert, und das setzt
   voraus, dass alle Zeilen dastehen.

   ---------------------------------------------------------------
   Warum der Ausgleich ueber ein Element laeuft und nicht ueber Summen

   Der erste Anlauf rechnete: Er addierte die geschaetzten Hoehen aller
   Eintraege oberhalb, und wenn eine Messung eine Schaetzung widerlegte,
   setzte er scrollTop um die Differenz nach. Gemessen: 48 von 50
   Rollschritten landeten woanders, und scrollTop schoss je Schritt um
   rund 7.000 px vor.

   Der Grund ist eine Rueckkopplung. Das Nachsetzen von scrollTop
   verschiebt das Fenster, dadurch kommen neue, noch ungemessene Zeilen
   herein, deren Messung wieder nachgesetzt wird — und weil die
   Schaetzung zu klein war, ging es immer in dieselbe Richtung. Eine
   Sperre gegen das eigene Roll-Ereignis half nicht: Die Ereignisse
   werden verzoegert zugestellt, die Sperre schluckte das falsche.

   Jetzt wird scrollTop beim Rollen ueberhaupt nicht mehr angefasst.
   Statt dessen merkt sich die Liste, welcher Eintrag die Oberkante des
   Sichtfelds beruehrt und wie weit er schon hinausgerollt ist. Nach dem
   Neuzeichnen wird nachgesehen, wohin dieser Eintrag geraten ist, und
   der obere Platzhalter genau um diesen Unterschied verstellt. Damit
   steht die Zeile wieder, wo sie stand — ohne Rechnung ueber Summen,
   ohne Annahme ueber Raender, ohne Rueckkopplung.

   Die Summen bleiben, aber nur noch fuer drei Dinge, bei denen ein
   Schaetzfehler nichts kostet: wie viele Eintraege ins Fenster passen,
   wie hoch der untere Platzhalter ist, und wo ein Sprung landet.
   ================================================================ */
const FENSTER_AB  = 600;   /* ab so vielen Eintraegen wird ausgeschnitten */
const PUFFER      = 12;    /* Eintraege ueber und unter dem Sichtfeld */
/* Startschaetzung, bis eine Zeile wirklich gemessen ist. 100 px sind der
   gemessene Schnitt NACH Schritt 3 — die Stimmen-Schalter haben die Zeile
   hoeher gemacht, und mit dem alten Wert 89 lag die Gesamthoehe um zehn
   Prozent daneben. */
let   H_ZEILE     = 100;
const H_BUCHSTABE = 44;

let FEN = null;
let LISTE_ZEILEN = 0;
window.listeZeilenZahl = () => LISTE_ZEILEN;

function eintraegeBauen(zeilen, gruppiert){
  const aus=[]; let cur=null;
  zeilen.forEach(z=>{
    if(gruppiert){ const L=initialOf(z.zeige); if(L!==cur){ cur=L; aus.push({art:'L', text:L}); } }
    aus.push({art:'Z', z});
  });
  return aus;
}
/* Der Buchstabe war bisher ein div neben der Liste. Als Eintrag IN der
   Liste laesst er sich mit den Zeilen zusammen ausschneiden. */
function eintragZeichnen(e){
  if(e.art==='L'){ const li=document.createElement('li'); li.className='group-letter';
                   li.textContent=e.text; return li; }
  return tuneRow(e.z.zeige, e.z.stimmen);
}

/* Welches Stueck steht oben im Bild, und wie weit ist es hinausgerollt? Wird
   vor dem Neuzeichnen gemerkt und danach wiederhergestellt. Ueber die
   Gruppen-Kennung, nicht ueber den Schluessel: Der wechselt mit der Stimme. */
function fensterMerken(main){
  if(!FEN || FEN.haupt!==main) return { y:main.scrollTop };
  const a=ankerAusDok();
  if(!a) return { y:main.scrollTop };
  const e=FEN.eintraege[a.i];
  return { y:main.scrollTop, gid:(e.art==='Z' ? e.z.gid : null), v:a.v };
}

function listeAufbauen(main, zeilen, gruppiert, merke){
  const eintraege = eintraegeBauen(zeilen, gruppiert);
  /* Wie viele Zeilen die Liste im Ganzen hat — fuer die Messzeile im Setup.
     Ohne sie liest sich „37 Zeilen" wie ein Verlust von Noten, obwohl es der
     Erfolg ist: 37 im Dokument von 4.309 in der Liste. */
  LISTE_ZEILEN = zeilen.length;
  const lang = eintraege.length>=FENSTER_AB && !S.view.startsWith('tag:');
  document.body.dataset.fenster = lang ? 'an' : 'aus';
  if(FEN && FEN.haupt) FEN.haupt.removeEventListener('scroll', fensterAnstossen);
  main.innerHTML='';
  if(!lang){
    FEN=null;
    const ul=document.createElement('ul'); ul.className='list';
    eintraege.forEach(e=>ul.append(eintragZeichnen(e)));
    main.append(ul);
    main.scrollTop = (merke&&merke.y)||0;
    return;
  }
  const oben =document.createElement('div'); oben.className='fensterplatz';
  const ul   =document.createElement('ul');  ul.className='list';
  const unten=document.createElement('div'); unten.className='fensterplatz';
  main.append(oben, ul, unten);
  FEN={ eintraege, hoehen:eintraege.map(e=>e.art==='L'?H_BUCHSTABE:H_ZEILE),
        gemessen:new Uint8Array(eintraege.length), mSumme:0, mZahl:0,
        summen:null, start:-1, ende:-1, obenH:0, oben, unten, ul, haupt:main,
        breite:main.clientWidth, padOben:0 };
  polsterMessen();
  summenNeu();
  /* Erst die Gesamthoehe herstellen, dann die gemerkte Position setzen — eine
     leere Flaeche wuerde scrollTop auf null klemmen. */
  unten.style.height = FEN.summen[eintraege.length]+'px';
  let ziel = (merke&&merke.y)||0;
  if(merke && merke.gid){
    const i=eintraege.findIndex(e=>e.art==='Z' && e.z.gid===merke.gid);
    if(i>=0) ziel = Math.max(0, FEN.summen[i]+merke.v);
  }
  main.scrollTop = ziel;
  fensterSetzen();
  main.addEventListener('scroll', fensterAnstossen, {passive:true});
}

function summenNeu(){
  const h=FEN.hoehen, s=new Array(h.length+1); s[0]=0;
  for(let i=0;i<h.length;i++) s[i+1]=s[i]+h[i];
  FEN.summen=s;
}
const versatz = i => FEN.summen[Math.max(0, Math.min(i, FEN.summen.length-1))];
/* Welcher Eintrag liegt bei dieser Hoehe? Binaere Suche ueber die Summen. */
function indexBei(y){
  const s=FEN.summen; let lo=0, hi=s.length-2;
  while(lo<hi){ const m=(lo+hi+1)>>1; if(s[m]<=y) lo=m; else hi=m-1; }
  return lo;
}

let fensterUhr=0;
function fensterAnstossen(){
  if(!FEN || fensterUhr) return;
  fensterUhr=requestAnimationFrame(()=>{ fensterUhr=0; fensterSetzen(); });
}

/* Welcher Eintrag beruehrt die Oberkante des Sichtfelds, und wie weit ist er
   schon darueber hinaus? Gelesen wird aus dem Dokument, nicht aus einer
   Gesamtrechnung — nur deshalb steht die Zeile nach dem Nachladen wieder da,
   wo sie stand.

   Ein schneller Wisch kann den Puffer ueberholen; dann liegt die Oberkante
   ausserhalb des Gezeichneten. Statt die ganze Liste neu aufzusetzen, wird
   von der ersten beziehungsweise letzten gezeichneten Zeile aus
   weitergerechnet. Geschaetzt wird dann nur ueber die wenigen
   uebersprungenen Zeilen, nicht ueber alles davor — gemessen: 11 px
   Abweichung statt 94. */
/* Bezugskante ist der Anfang des INHALTS, nicht der Rahmen der Flaeche. Die
   Liste hat oben eine Polsterung; wer gegen den Rahmen misst, haelt bei
   scrollTop null den Anker sechs Pixel zu hoch und rollt sie jedes Mal wieder
   heraus. Gemessen: Die Liste liess sich nicht ganz an den Anfang rollen. */
function polsterMessen(){
  FEN.padOben = FEN.haupt.clientTop + (parseFloat(getComputedStyle(FEN.haupt).paddingTop)||0);
}
const inhaltKante = () => FEN.haupt.getBoundingClientRect().top + FEN.padOben;

function ankerAusDok(){
  if(!FEN || FEN.start<0) return null;
  const kinder=FEN.ul.children; if(!kinder.length) return null;
  const kante=inhaltKante();
  const letzter=FEN.eintraege.length-1;
  /* Weitergerechnet wird hoechstens ueber so viele Zeilen. Darueber hinaus
     summierten sich die Schaetzfehler: Ein Sprung von 120.000 px zurueck auf
     null blieb 928 px ueber dem Anfang haengen. So weite Spruenge setzen
     neu auf — dort ist die Gesamtrechnung das genauere Mittel. */
  const GRENZE = PUFFER*3;
  const erst=kinder[0].getBoundingClientRect();
  if(erst.top > kante){
    let d=erst.top-kante, i=FEN.start, n=0;
    while(i>0 && d>0 && n<GRENZE){ i--; d-=FEN.hoehen[i]; n++; }
    if(d>0 && i>0) return null;
    return { i, v:Math.max(0,-d) };
  }
  for(let i=0;i<kinder.length;i++){
    const r=kinder[i].getBoundingClientRect();
    if(r.bottom > kante) return { i:FEN.start+i, v:kante-r.top };
  }
  let d=kante-FEN.ul.getBoundingClientRect().bottom, i=FEN.ende+1, n=0;
  while(i<letzter && d>=FEN.hoehen[i] && n<GRENZE){ d-=FEN.hoehen[i]; i++; n++; }
  if(i<letzter && d>=FEN.hoehen[i]) return null;
  return { i:Math.min(i,letzter), v:Math.max(0,d) };
}

function fensterSetzen(){
  if(!FEN) return;
  const haupt=FEN.haupt, letzter=FEN.eintraege.length-1;
  const sicht=haupt.clientHeight||600;
  let anker=ankerAusDok(), aufsetzen=false;
  if(!anker){
    const i=indexBei(haupt.scrollTop);
    anker={ i, v:haupt.scrollTop-versatz(i) };
    aufsetzen=true;
  }

  /* Das Fenster wird vom Anker aus abgesteckt, nicht aus dem Rollstand
     gerechnet: Der Anker ist gemessen, der Rollstand nur geschaetzt. */
  const start=Math.max(0, anker.i-PUFFER);
  let ende=anker.i, h=0;
  while(ende<letzter && h < anker.v+sicht){ h+=FEN.hoehen[ende]; ende++; }
  ende=Math.min(letzter, ende+PUFFER);
  if(!aufsetzen && start===FEN.start && ende===FEN.ende) return;

  FEN.start=start; FEN.ende=ende;
  const teil=document.createDocumentFragment();
  for(let i=start;i<=ende;i++) teil.append(eintragZeichnen(FEN.eintraege[i]));
  FEN.ul.replaceChildren(teil);

  /* Jetzt stehen die echten Hoehen fest. Gemessen wird ueber den Abstand zum
     naechsten Eintrag, nicht ueber die eigene Hoehe: So sind die Raender mit
     drin, auch wenn sie zusammenfallen. */
  const kinder=FEN.ul.children;
  let geaendert=false;
  if(kinder.length){
    const kanten=new Array(kinder.length+1);
    for(let i=0;i<kinder.length;i++) kanten[i]=kinder[i].getBoundingClientRect().top;
    kanten[kinder.length]=FEN.ul.getBoundingClientRect().bottom;
    for(let i=0;i<kinder.length;i++){
      const hh=Math.round(kanten[i+1]-kanten[i]); if(hh<=0) continue;
      const k=start+i;
      if(hh!==FEN.hoehen[k]){ FEN.hoehen[k]=hh; geaendert=true; }
      /* Die Schaetzung fuer die noch ungemessenen Zeilen ist der laufende
         Schnitt ueber alles bisher Gemessene. Ein Schnitt nur ueber das
         Sichtfeld schwankte je nach Gegend um Dutzende Pixel, und mit ihm
         die Gesamthoehe und die Bildlaufleiste. */
      if(!FEN.gemessen[k]){
        FEN.gemessen[k]=1;
        if(FEN.eintraege[k].art==='Z'){ FEN.mSumme+=hh; FEN.mZahl++; }
      }
    }
    if(FEN.mZahl>=20){
      const neu=Math.round(FEN.mSumme/FEN.mZahl);
      if(Math.abs(neu-H_ZEILE)>2){
        H_ZEILE=neu;
        /* Nachgezogen wird nur UNTERHALB des Fensteranfangs. Wer auch die
           Eintraege darueber neu schaetzt, verschiebt den gerechneten
           Listenanfang, waehrend der obere Platzhalter stehen bleibt — beide
           Rechnungen laufen dann auseinander, und beim naechsten Neuzeichnen
           spraenge die Liste um Hunderte Pixel. Gemessen: ein Tipp auf
           Favorit trug sie fort. Oberhalb aendert sich also nie etwas; die
           Bildlaufleiste wird trotzdem besser, weil der weitaus groessere
           Teil der Liste unterhalb liegt. */
        for(let k=start;k<FEN.hoehen.length;k++)
          if(!FEN.gemessen[k] && FEN.eintraege[k].art==='Z'){ FEN.hoehen[k]=H_ZEILE; geaendert=true; }
      }
    }
  }
  if(geaendert) summenNeu();

  /* Der Ausgleich. Nachgesehen wird, wohin der Anker geraten ist, und der
     obere Platzhalter um genau diesen Unterschied verstellt. scrollTop bleibt
     unberuehrt — daran ist der erste Anlauf gescheitert. */
  let obenH;
  if(aufsetzen){ obenH=versatz(start); }
  else {
    const el=kinder[anker.i-start];
    const ist=inhaltKante() - el.getBoundingClientRect().top;
    obenH=FEN.obenH + (ist-anker.v);
  }
  /* Am Anfang der Liste steht kein Platz mehr zur Verfuegung: Dort MUSS der
     Platzhalter null sein, sonst klaffte ueber der ersten Zeile eine Luecke. */
  const geklemmt = (start===0 || obenH<0);
  if(geklemmt) obenH=0;
  FEN.obenH=obenH;
  FEN.oben.style.height  = obenH+'px';
  FEN.unten.style.height = (ende>=letzter ? 0 : Math.max(0, versatz(letzter+1)-versatz(ende+1)))+'px';

  /* Nachgerollt wird nur in zwei Faellen: beim Aufsetzen nach einem Sprung und
     wenn der Platzhalter geklemmt wurde. Beides loest ein weiteres
     Roll-Ereignis aus, das beim naechsten Durchgang nichts mehr zu tun findet
     — die Sache laeuft sich fest, statt sich aufzuschaukeln. Im Regelfall,
     also beim gewoehnlichen Rollen, wird scrollTop gar nicht angefasst. */
  if((geklemmt||aufsetzen) && kinder.length){
    const el=kinder[anker.i-start];
    const ist=inhaltKante() - el.getBoundingClientRect().top;
    if(Math.abs(ist-anker.v)>0.5) haupt.scrollTop += (anker.v-ist);
  }
}

/* Nach dem Drehen sind alle gemessenen Hoehen ungueltig — die Spalte ist
   anders breit, und die Metazeile bricht anders um. Der Eintrag, der oben
   stand, bleibt oben. */
window.fensterNeuMessen = function(){
  if(!FEN) return;
  if(FEN.haupt.clientWidth===FEN.breite) return;
  FEN.breite=FEN.haupt.clientWidth;
  const anker=ankerAusDok();
  polsterMessen();
  FEN.gemessen=new Uint8Array(FEN.eintraege.length); FEN.mSumme=0; FEN.mZahl=0;
  FEN.hoehen=FEN.eintraege.map(e=>e.art==='L'?H_BUCHSTABE:H_ZEILE);
  summenNeu();
  neuAufsetzen(anker ? versatz(anker.i)+anker.v : FEN.haupt.scrollTop);
};
/* Zu einer Gruppe rollen, auch wenn ihre Zeile gerade nicht dasteht. */
window.zuGruppeRollen = function(gid){
  if(!FEN) return false;
  const i=FEN.eintraege.findIndex(e=>e.art==='Z' && e.z.gid===gid);
  if(i<0) return false;
  neuAufsetzen(Math.max(0, versatz(i) - Math.max(0,(FEN.haupt.clientHeight-FEN.hoehen[i])/2)));
  return true;
};
/* Ein Sprung setzt die Liste auf den geschaetzten Stand zurueck. Damit der
   Rollstand ueberhaupt erreichbar ist, muss die Flaeche vorher hoch genug
   sein — deshalb erst die volle Gesamthoehe, dann rollen, dann einpassen. */
function neuAufsetzen(y){
  FEN.oben.style.height='0px'; FEN.obenH=0;
  FEN.unten.style.height=versatz(FEN.eintraege.length)+'px';
  FEN.start=-1; FEN.ende=-1;
  FEN.haupt.scrollTop=y;
  fensterSetzen();
}

/* Die gefilterten Blaetter zu Zeilen buendeln: je Stueck eine.

   Gebuendelt wird nur, was zu einer Buchfamilie gehoert. Alles andere bleibt
   fuer sich, und zwar ohne Sonderfall — Stuecke ohne Familie tragen ihre
   eigene Kennung als Gruppe.

   Welche Stimmen eine Zeile traegt, entscheidet die Buchauswahl: Gefiltert
   wird VOR dem Buendeln. Ist nur die B-Ausgabe gewaehlt, hat die Zeile eine
   Stimme, und die geht auf. Damit koennen Buchauswahl und Stimmenwahl sich
   nicht widersprechen. */
function zuZeilen(blaetter){
  const nach=new Map(); const zeilen=[];
  blaetter.forEach(t=>{
    if(!t.fam){ zeilen.push({gid:t.gid, stimmen:[t], zeige:t}); return; }
    let z=nach.get(t.gid);
    if(!z){ z={gid:t.gid, stimmen:[], zeige:null}; nach.set(t.gid,z); zeilen.push(z); }
    z.stimmen.push(t);
  });
  zeilen.forEach(z=>{
    /* Nach dem Instrument ordnen, bei gleichem Instrument nach dem Etikett —
       sonst stehen „Alt 2" und „Alt 1" in zufaelliger Reihenfolge. */
    if(z.stimmen.length>1) z.stimmen.sort((a,b)=>
      (stimmenRang(stimmWert(a))-stimmenRang(stimmWert(b)))
      || (a.stimme||'').localeCompare(b.stimme||'','de',{numeric:true}));
    z.zeige=waehleStimme(z.stimmen);
  });
  return zeilen;
}
window.zuZeilen = zuZeilen;
