/* ============================================================================
   BS — die neue Ablage. Stufe 1, Schritt 1a des Bestands-Konzepts.

   Sie liegt NEBEN der alten und nicht in ihr: eigene Datenbank `bandstand`,
   waehrend `realbook` unberuehrt weiterbesteht. Nichts hier draussen haengt
   heute davon ab; Liste, Verwaltung und Buehne lesen erst in Schritt 1c daraus.
   Der Rueckweg ist damit die alte Datenbank selbst.

   Drei Ebenen: Buch enthaelt Titel, Titel enthaelt Elemente. Der Titel ist eine
   eigene Sache mit eigener Kennung — am 29. Juli 2026 so entschieden. Deshalb
   kostet ein Umbenennen einen Schreibvorgang statt acht, und zwei gleichnamige
   Stuecke verschmelzen nicht mehr stillschweigend zu einem.

   Die Bytes liegen getrennt vom Katalog. Gemessen an 6.231 Blaettern: Katalog
   lesen 136 ms statt 709 ms, und ein Blatt auf Zuruf 6,3 ms. Es gibt keinen
   Grund, 294 MB dauerhaft anzuheften, um ein Blatt zu oeffnen.
   ============================================================================ */
/* ============================================================================
   LS — der Notensetzer fuer Leadsheets                        (19. August 2026)

   Ein Leadsheet ist keine Seite, sondern Musik als Daten: MusicXML oder ABC.
   Daraus wird hier ein festes A4-Blatt gerechnet, in jeder Tonart und fuer
   jedes Instrument. Der PDF-Betrachter wird dabei NICHT angefasst — dieser
   Weg laeuft neben ihm, so wie das schwebende Fenster des Imports neben ihm
   laeuft. Gemeinsam haben beide nur die Buehne, auf der sie landen.

   Der Setzer heisst Verovio, kommt von RISM Digital und steht unter der
   LGPL v3. Er wiegt 6,7 MB und wird deshalb ERST GEHOLT, wenn das erste
   Leadsheet geoeffnet wird — und dann in einen eigenen Cache gelegt, der den
   Versionswechsel ueberlebt (siehe sw.js, `libs-bs-1`). Auf der Buehne wird
   nichts nachgeladen.
   ========================================================================= */
const LS = (function(){

  /* A4 hochkant in Zehntel-Millimetern, wie Verovio sie zaehlt. Fest, nicht
     nach Bildschirm: Nur so bleibt der Umbruch derselbe, egal ob Mac oder
     iPad, und nur so passt eine Notiz spaeter noch auf ihre Stelle. */
  const A4 = { pageWidth:2100, pageHeight:2970,
    pageMarginLeft:110, pageMarginRight:110, pageMarginTop:90, pageMarginBottom:110 };
  const A4_VERH = 2100/2970;

  /* ---- Einstellungen ------------------------------------------------------
     Vier Regler aus Setup › Darstellung. Farbe und Staerke der Notenlinien
     sind getrennt vom Hals, weil duenne Linien mit kraeftigem Hals der
     Handschrift naeher kommen als eine gleichmaessige Verdickung. */
  const VORGABE = { hand:2, farbe:'#333333', linie:0.24, hals:0.32, akkorde:'lang', raster:true, bogen:1.0,
                    akkgroesse:1.0, akkstrich:0 };
  function E(){
    const z=(k,v)=>{ const x=parseFloat(localStorage.getItem(k)); return isNaN(x)?v:x; };
    return {
      hand:    Math.max(0, Math.min(3, z('bs_ls_hand', VORGABE.hand))),
      farbe:   localStorage.getItem('bs_ls_farbe') || VORGABE.farbe,
      /* Verovio nimmt fuer die Notenlinie 0,10 bis 0,30 und fuer den Hals
         0,10 bis 0,50. Was darueber liegt, weist es zurueck und faellt auf
         seinen Vorgabewert zurueck — die Linie wuerde am oberen Ende des
         Reglers duenner statt dicker. Am 19. August beim Pruefen aufgefallen.
         Seit dem 21. August geht die Linie trotzdem bis 0,60: bis 0,30 macht
         es der Setzer, darueber `blattFeinschliff` am fertigen Blatt. */
      linie:   Math.max(0.10, Math.min(0.60, z('bs_ls_linie', VORGABE.linie))),
      hals:    Math.max(0.10, Math.min(0.50, z('bs_ls_hals',  VORGABE.hals))),
      akkorde: localStorage.getItem('bs_ls_akkorde') || VORGABE.akkorde,
      raster:  localStorage.getItem('bs_ls_raster') !== '0',
      /* Wie rund ein Bogen faellt. Verovio nimmt 0,2 bis 5,0; darunter wird
         der Bogen flach, darueber ein Halbkreis. */
      bogen:   Math.max(0.3, Math.min(2.0, z('bs_ls_bogen', VORGABE.bogen))),
      /* Die Akkordschrift ist kein Verovio-Regler — der Setzer kennt keine
         Groesse fuer Akkordsymbole. Beides wird am fertigen Blatt gemacht. */
      akkgroesse: Math.max(0.7, Math.min(1.6, z('bs_ls_akkgroesse', VORGABE.akkgroesse))),
      /* Wie kraeftig die Akkordschrift traegt, in Bruchteilen ihrer eigenen
         Hoehe. Null ist die Schrift, wie sie kommt; 0,10 ist deutlich fett.
         Bis zum 21. August war das ein Schalter mit zwei Stufen — Jens wollte
         dazwischen regeln koennen. */
      akkstrich:  Math.max(0, Math.min(0.12, z('bs_ls_akkstrich', VORGABE.akkstrich)))
    };
  }
  function setzen(k,v){ localStorage.setItem('bs_ls_'+k, String(v)); }

  /* ---- Die Handschrift ----------------------------------------------------
     Vier Stufen. Die Welle ist ein Filter des Browsers und wirkt einmal beim
     Zeichnen; sie kostet nichts und macht aus exakt geraden Linien die
     Unregelmaessigkeit einer Feder. Stufe 0 laesst alles gerade.

     Seit Stufe 3 steckt der Filter IM Blatt und nicht mehr im Dokument —
     `eigenstaendig` legt ihn hinein. `filterEinbauen` bleibt fuer den Fall,
     dass ein Blatt aus der Zeit davor gezeigt wird. */
  const WELLE = [null, [0.012,2.2], [0.02,3.5], [0.035,5]];
  function filterEinbauen(){
    if(document.getElementById('lsFilter')) return;
    const d=document.createElementNS('http://www.w3.org/2000/svg','svg');
    d.id='lsFilter'; d.setAttribute('width','0'); d.setAttribute('height','0');
    d.style.cssText='position:absolute;width:0;height:0';
    d.innerHTML = WELLE.map((w,i)=> w ? '<filter id="lsW'+i+'">'
      + '<feTurbulence type="fractalNoise" baseFrequency="'+w[0]+'" numOctaves="2" seed="7" result="n"/>'
      + '<feDisplacementMap in="SourceGraphic" in2="n" scale="'+w[1]+'" '
      + 'xChannelSelector="R" yChannelSelector="G"/></filter>' : '').join('');
    document.body.appendChild(d);
  }

  /* ---- Akkordschrift ------------------------------------------------------
     Die Dateien schreiben `min7` und `maj7` aus; das Real Book setzt `-7` und
     `∆7`. Umgeschrieben wird das ANGEZEIGTE Kuerzel im MusicXML (`kind/@text`),
     nicht der Akkord selbst — die Harmonie bleibt, was sie ist, und das
     Transponieren rechnet unveraendert damit. */
  const KURZ = {
    'min':'-', 'mi':'-', 'min7':'-7', 'mi7':'-7', 'min9':'-9', 'min11':'-11',
    'min13':'-13', 'min6':'-6', 'min(maj7)':'-(△7)',
    'maj':'', 'maj7':'△7', 'ma7':'△7', 'maj9':'△9',
    'maj13':'△13', 'maj6':'6', 'dim':'°', 'dim7':'°7'
  };
  function akkordeKuerzen(xml){
    return xml.replace(/(<kind\b[^>]*\btext=")([^"]*)(")/g, (m,a,t,b)=>{
      if(Object.prototype.hasOwnProperty.call(KURZ,t)) return a+KURZ[t]+b;
      return a + t.replace(/^min/,'-').replace(/^maj/,'△').replace(/^dim/,'°') + b;
    });
  }

  /* ---- Der feste Umbruch --------------------------------------------------
     Vier Takte je Zeile, zwei bei vollen Takten, nie drei. Erst muessen die
     Umbrueche AUS DEM HERKUNFTSPROGRAMM weg: Verovio haelt sich sonst an die
     und nicht an unsere, und dann steht die Zeile mal mit einem, mal mit
     sechs Takten da. */
  function umbrechen(xml, proZeile){
    proZeile = proZeile || 4;
    xml = xml.replace(/<print\b[^>]*\/>/g,'').replace(/<print\b[^>]*>[\s\S]*?<\/print>/g,'');
    const erster = /<part\b[^>]*>([\s\S]*?)<\/part>/.exec(xml);
    const takte = [...(erster?erster[1]:xml).matchAll(/<measure\b[^>]*>([\s\S]*?)<\/measure>/g)];
    const dicht = takte.map(m=>(m[1].match(/<note\b/g)||[]).length);
    if(!dicht.length) return xml;
    const voll=new Set(); dicht.forEach((n,i)=>{ if(n>11) voll.add(i); });
    const grenzen=new Set();
    for(let i=0;i<dicht.length;){
      const g = (voll.has(i)||voll.has(i+1)||voll.has(i+2)||voll.has(i+3)) ? 2 : proZeile;
      i+=g; if(i<dicht.length) grenzen.add(i);
    }
    let nr=-1;
    return xml.replace(/<measure\b[^>]*>/g, m=>{
      nr=(nr+1)%dicht.length;
      return grenzen.has(nr) ? m+'<print new-system="yes"/>' : m;
    });
  }

  /* ---- Eine Stimme herausziehen -------------------------------------------
     Der Befund vom 19. August: Die Akkordsymbole stehen in mehrstimmigen
     Dateien immer nur bei EINER Stimme, und welche das ist, wechselt von
     Datei zu Datei — bei 23 von 57 die erste, sonst die zweite oder dritte.
     Wer eine Stimme ohne Akkorde herauszieht, gibt dem Spieler seine Toene
     ohne Changes. Deshalb wandern die Akkorde taktweise mit. */
  function stimmen(xml){
    const out=[];
    const re=/<score-part id="([^"]+)"[^>]*>([\s\S]*?)<\/score-part>/g;
    let m; while((m=re.exec(xml))){
      const n=/<part-name[^>]*>([\s\S]*?)<\/part-name>/.exec(m[2]);
      out.push({ id:m[1], name:(n?n[1]:'').replace(/<[^>]*>/g,'').trim() });
    }
    /* Viele Dateien tragen keinen brauchbaren Stimmen-Namen — aus Finale
       kommt dreimal „MusicXML Part". Ein Name, der bei allen gleich ist,
       hilft niemandem beim Waehlen; dann wird durchgezaehlt. */
    const brauchbar = n => n && !/^musicxml\s*part$/i.test(n) && !/^part\b/i.test(n);
    const eindeutig = new Set(out.map(x=>x.name)).size === out.length;
    out.forEach((x,i)=>{ if(!brauchbar(x.name) || !eindeutig) x.name='Stimme '+(i+1); });
    return out;
  }
  function teileTakte(rumpf){ return [...rumpf.matchAll(/<measure\b[^>]*>[\s\S]*?<\/measure>/g)].map(x=>x[0]); }

  function stimmeZiehen(xml, partId){
    const teile=[...xml.matchAll(/<part id="([^"]+)">([\s\S]*?)<\/part>/g)];
    if(teile.length<2) return xml;
    const ziel=teile.find(t=>t[1]===partId); if(!ziel) return xml;

    /* Wer traegt die Akkorde? Die Stimme mit den meisten. */
    let geber=null, meiste=(ziel[2].match(/<harmony\b/g)||[]).length;
    teile.forEach(t=>{ const n=(t[2].match(/<harmony\b/g)||[]).length;
      if(n>meiste){ meiste=n; geber=t; } });

    let rumpf=ziel[2];
    if(geber){
      const gt=teileTakte(geber[2]), zt=teileTakte(rumpf);
      const neu=zt.map((takt,i)=>{
        const q=gt[i]; if(!q) return takt;
        const h=(q.match(/<harmony\b[\s\S]*?<\/harmony>/g)||[]).join('');
        if(!h) return takt;
        const p=takt.search(/<note\b/);
        return p<0 ? takt.replace(/<\/measure>$/, h+'</measure>')
                   : takt.slice(0,p)+h+takt.slice(p);
      });
      let k=-1; rumpf=rumpf.replace(/<measure\b[^>]*>[\s\S]*?<\/measure>/g, ()=>neu[++k]);
    }
    return xml
      .replace(/<part id="([^"]+)">[\s\S]*?<\/part>/g, (m,p)=>
        p===partId ? '<part id="'+p+'">'+rumpf+'</part>' : '')
      .replace(/<score-part id="([^"]+)">[\s\S]*?<\/score-part>/g, (m,p)=>p===partId?m:'');
  }

  /* ---- Tonart und Notation (Stufe 2, 20. August) --------------------------
     Gerechnet wird in QUINTEN, nicht in Halbtoenen: Nur so kommt beim
     Transponieren die richtige Schreibweise heraus. Ges-Dur und Fis-Dur
     klingen gleich und sehen verschieden aus, und auf dem Pult zaehlt, was
     man liest.

     Die Rechnung ist gegen den Setzer geprueft: drei Quellen, dreizehn
     Tonarten, fuenf Notationen — 195 Faelle, 195 Treffer. */
  const QUINTEN=['Cb','Gb','Db','Ab','Eb','Bb','F','C','G','D','A','E','B','F#','C#']; /* -7 … +7 */
  const quintenVon = n => QUINTEN.indexOf(n)-7;
  function nameVonQuinten(q){ while(q>7)q-=12; while(q<-7)q+=12; return QUINTEN[q+7]; }
  const klang = q => ((q*7)%12+12)%12;

  const DUR=[0,2,4,5,7,9,11];      /* Halbtoene der Stufen 1 bis 7 */
  const REIN=new Set([0,3,4]);     /* Prim, Quart, Quint sind rein, nicht gross */
  function intervall(quinten, halbtoene){
    const ab=halbtoene<0, H=Math.abs(halbtoene), Q=ab?-quinten:quinten;
    const stufen=(((Q*4)%7)+7)%7;
    const okt=Math.max(0, Math.round((H-DUR[stufen])/12));
    const natur=DUR[stufen]+12*okt, abw=H-natur, zahl=stufen+7*okt+1;
    const art = REIN.has(stufen)
      ? (abw===0?'P' : abw>0?'A'.repeat(abw) : 'd'.repeat(-abw))
      : (abw===0?'M' : abw===-1?'m' : abw>0?'A'.repeat(abw) : 'd'.repeat(-abw-1));
    return (ab?'-':'+')+art+zahl;
  }

  /* Was ein Spieler liest, gemessen am Klang. Die Oktavlage ist Konvention
     und keine Rechnung: Ein Alt liest eine grosse Sexte darueber, ein Tenor
     eine grosse None. So bleibt der Ton im Griffbereich. */
  const NOTATION=[
    {wert:'C',   kurz:'C',       name:'C — Klavier, Gitarre, Flöte, Posaune', q:0, h:0},
    {wert:'Bb',  kurz:'B♭',      name:'B♭ — Trompete, Klarinette, Sopran',    q:2, h:2},
    {wert:'Eb',  kurz:'E♭',      name:'E♭ — Alt, Bariton',                    q:3, h:9},
    {wert:'Bb9', kurz:'B♭ tief', name:'B♭ tief — Tenor, Bassklarinette',      q:2, h:14},
    {wert:'F',   kurz:'F',       name:'F — Horn',                             q:1, h:7},
  ];

  /* Die Tonart der Quelle. MusicXML sagt sie als Vorzeichenzahl, ABC als
     Buchstabe. Zurueck kommt der GRUNDTON in Quinten, dazu das Geschlecht —
     ein Stueck in c-Moll traegt drei Be und heisst trotzdem c. */
  function tonartLesen(quelle){
    const x=String(quelle||'');
    let m=/<fifths>\s*(-?\d+)\s*<\/fifths>/.exec(x);
    if(m){
      const sig=+m[1];
      const moll=/<mode>\s*minor\s*<\/mode>/i.test(x);
      return { q: sig + (moll?3:0), moll, sig };
    }
    m=/(^|\n)K:\s*([A-G])([b#]?)\s*(m|min|maj|dor|mix)?/i.exec(x);
    if(m){
      const grund=quintenVon(m[2].toUpperCase()+(m[3]||'').replace('#','#'));
      const moll=/^m(in)?$/i.test(m[4]||'');
      return { q: isNaN(grund)?0:grund, moll, sig:(isNaN(grund)?0:grund)-(moll?3:0) };
    }
    return { q:0, moll:false, sig:0 };
  }

  /* Was am Ende auf dem Blatt steht. Mehr als sieben Vorzeichen setzt
     niemand, deshalb wird jenseits davon enharmonisch gedreht. */
  function gelesene(zielQ, notationWert, moll){
    const n=NOTATION.find(x=>x.wert===notationWert)||NOTATION[0];
    let w=zielQ+n.q;
    let sig=w-(moll?3:0);
    if(sig>7){ w-=12; } else if(sig<-7){ w+=12; }
    return w;
  }

  function rechne(originalQ, zielQ, notationWert, moll){
    const n=NOTATION.find(x=>x.wert===notationWert)||NOTATION[0];
    const w=gelesene(zielQ, notationWert, moll);
    const dq=w-originalQ;
    let s=(klang(zielQ)-klang(originalQ)+12)%12; if(s>6) s-=12;
    const h=s+n.h;
    return { transpose:(dq===0&&h===0)?'':intervall(dq,h),
             gelesen:nameVonQuinten(w), gelesenQ:w };
  }

  /* ---- Ein Blatt, das fuer sich allein steht (Stufe 3, 20. August) -------
     Das SVG aus dem Setzer ist nicht vollstaendig: Die Jazz-Schrift fuer die
     Akkorde und die Handschrift-Welle kommen aus dem Stylesheet der Seite.
     Solange das Blatt IM Dokument haengt, faellt das nicht auf. Sobald es in
     eine Leinwand gezeichnet oder weggelegt wird, faellt beides weg — im
     Editor stuenden die Akkorde in einer Systemschrift, und das eingefrorene
     Blatt saehe anders aus als das, worauf geschrieben wurde.

     `eigenstaendig` legt deshalb beides INS SVG: die Schrift als Datenblock,
     die Welle als eigener Filter. Was dabei herauskommt, sieht ueberall
     gleich aus — im Fenster, in der Leinwand, in einem Jahr. */
  let _schrift=null;
  async function schriftBase64(){
    if(_schrift!==null) return _schrift;
    try{
      const r=await fetch(new URL('fonts/PetalumaScript.otf', location.href).href);
      const b=new Uint8Array(await r.arrayBuffer());
      let bin=''; const N=0x8000;
      for(let i=0;i<b.length;i+=N) bin+=String.fromCharCode.apply(null, b.subarray(i,i+N));
      _schrift=btoa(bin);
    }catch(e){ _schrift=''; }
    return _schrift;
  }
  /* `ohneSchrift`: Wer das Blatt IN der Seite zeigt, braucht den Schriftblock
     nicht — die Seite bringt PetalumaScript selbst mit. Er wiegt 258 KB als
     Datenblock, und den bei jedem Reglerschritt neu zu parsen kostete die
     Vorschau am 21. August eine ganze Sekunde je Bild. Fuer alles, was das
     Blatt VERLAESST — Bild, eingefrorene Notiz, Weitergabe —, muss er hinein. */
  async function eigenstaendig(svg, e, ohneSchrift){
    e = e || E();
    const b64 = ohneSchrift ? '' : await schriftBase64();
    const w = WELLE[e.hand];
    const filterId = 'lsw'+e.hand;
    const stil = '<style>'
      + (b64 ? "@font-face{font-family:'PetalumaScript';src:url(data:font/otf;base64,"+b64+") format('opentype')}" : '')
      + "svg{font-family:'PetalumaScript',sans-serif}"
      /* `!important` ist hier kein Faustschlag, sondern noetig: Verovio legt in
         jedes Blatt eine eigene Regel mit ID-Selektor —
         `#id path{stroke:currentcolor}` —, und eine ID schlaegt jede Klasse.
         Ohne das blieben die Notenlinien schwarz, was der Regler auch tat und
         was Jens am 21. August zweimal gemeldet hat. Nur fuer die Linienfarbe,
         nicht fuer die Schrift: Ein `!important` auf `font-family` macht aus
         `B♭7` ein Kaestchen. */
      + "g.staff>path{stroke:"+e.farbe+" !important}"
      /* Petaluma Script hat keinen fetten Schnitt. Verdickt wird deshalb mit
         einem Rand in derselben Farbe — das traegt gleichmaessig auf, wo eine
         nachgeahmte Fettschrift die Buchstaben verschmiert. */
      /* `stroke-width` in em, nicht in px: Die Akkordschrift ist ueber 400 px
         hoch, sechs Pixel Rand waren daran nicht zu sehen. Und die Regel muss
         den TSPAN treffen: Verovio setzt am `<text>` `font-size="0px"` und die
         wirkliche Groesse erst am tspan darin — ein `em` am text waere null. */
      + (e.akkstrich > 0.002
          ? "g.harm tspan{paint-order:stroke;stroke:#000;stroke-width:"
            + e.akkstrich.toFixed(3) + "em;stroke-linejoin:round}"
          : "")
      + '</style>';
    const filter = w ? '<filter id="'+filterId+'">'
      + '<feTurbulence type="fractalNoise" baseFrequency="'+w[0]+'" numOctaves="2" seed="7" result="n"/>'
      + '<feDisplacementMap in="SourceGraphic" in2="n" scale="'+w[1]+'" '
      + 'xChannelSelector="R" yChannelSelector="G"/></filter>' : '';
    /* Der Filter liegt auf einer Gruppe um ALLES — auf dem Wurzelelement
       wuerde Safari ihn am Rand beschneiden. */
    let out = svg.replace(/^(<svg[^>]*>)/, '$1' + stil + (filter ? '<defs>'+filter+'</defs>' : '')
      + (w ? '<g filter="url(#'+filterId+')">' : ''));
    if(w) out = out.replace(/<\/svg>\s*$/, '</g></svg>');
    return out;
  }

  /* Die Kennung einer Ausgabe. Sie haengt an der Notiz: Wer in B ueber Takt
     zwoelf schreibt, findet es in B wieder und nicht in C. Ist nichts
     eingestellt, ist die Kennung leer und die Notiz haengt am Element wie bei
     einem gescannten Blatt — so bleiben die alten Notizen, wo sie sind. */
  function ausgabeKuerzel(a){
    a = a || {};
    const teile=[];
    if(a.tonart!==undefined && a.tonart!=='') teile.push('t'+a.tonart);
    if(a.notation && a.notation!=='C') teile.push('n'+a.notation);
    if(a.stimme) teile.push('s'+a.stimme);
    return teile.join('_');
  }
  function notizSchluessel(elementId, a){
    const k=ausgabeKuerzel(a);
    return k ? elementId+'|'+k : elementId;
  }

  /* ---- Was der Nutzer gewaehlt hat --------------------------------------
     Die Ausgabe ist eine BESCHREIBUNG und keine Datei: Tonart, Notation,
     Stimme. Sie haengt an der Element-Kennung und wiegt nichts. */
  function ausgabeAlle(){
    try{ return JSON.parse(localStorage.getItem('bs_ls_ausgabe')||'{}')||{}; }catch(e){ return {}; }
  }
  function ausgabe(id){ return (ausgabeAlle()[id])||{}; }
  function ausgabeSetzen(id, wert){
    const a=ausgabeAlle();
    if(wert && (wert.tonart!==undefined || wert.notation || wert.stimme!==undefined))
      a[id]=Object.assign({}, a[id], wert);
    else delete a[id];
    try{ localStorage.setItem('bs_ls_ausgabe', JSON.stringify(a)); }catch(e){}
  }

  /* ---- Der Kopf des Blattes (20. August) ---------------------------------
     Titel und Komponist kommen aus DEINEM Bestand, nicht aus der Datei. Was
     dort in den `credit`-Blöcken steht, ist bei den meisten Quellen Beiwerk
     — „C Lead Sheet", der Arrangeur, eine Sammlungsnummer. Der Setzer würde
     genau das oben hinschreiben.

     Gesetzt wird deshalb selbst, in dieselbe Handschrift wie die Akkorde und
     in Versalien wie im Real Book. Der Platz dafür kommt aus dem oberen Rand;
     ohne Titel bleibt er schmal. */
  const KOPF_HOEHE = 210;
  function kopfEinsetzen(svg, titel, komponist){
    if(!titel && !komponist) return svg;
    const mitte = Math.round(A4.pageWidth/2);
    const rechts = A4.pageWidth - A4.pageMarginRight;
    const t = String(titel||'').toUpperCase();
    const teile = [];
    if(t) teile.push('<text x="'+mitte+'" y="150" text-anchor="middle" '
      + 'font-size="72" font-weight="bold">'+esc(t)+'</text>');
    if(komponist) teile.push('<text x="'+rechts+'" y="232" text-anchor="end" '
      + 'font-size="40">'+esc(String(komponist))+'</text>');
    return svg.replace(/^(<svg[^>]*>)/, '$1<g class="bskopf">'+teile.join('')+'</g>');
  }

  /* ---- Das Taktraster (20. August) ---------------------------------------
     Ein Takt ist ein Zeitmaß. Steht er überall gleich breit, liest man am
     Bild ab, ob die Noten dicht aufeinander folgen oder weit auseinander —
     genau das, was ein Leadsheet leisten soll.

     Der Setzer macht das von sich aus NICHT: Er gibt jedem Takt so viel
     Platz, wie sein Inhalt braucht. Gemessen an drei Stücken schwanken die
     Taktbreiten dabei um 31 bis 54 Prozent, und keine seiner Einstellungen
     ändert daran etwas — `spacingLinear`, `spacingNonLinear` und
     `measureMinWidth` wurden durchprobiert.

     Also wird nachgerechnet: Je System bekommt jeder Takt denselben Anteil an
     der Breite, und die Inhalte werden entsprechend verschoben. Verschoben,
     nicht gedehnt — Notenköpfe, Hälse und Schrift behalten ihre Größe, es
     ändern sich nur ihre Abstände. Der erste Takt eines Systems trägt
     Schlüssel und Vorzeichen; dieser Vorspann bleibt unangetastet. */
  /* Der erste Versuch am 20. August hat ALLES gestreckt, was in einem System
     stand — und damit auch die Abstände INNERHALB einer Note. Ein Notenhals
     sitzt aber fest am Kopf, ein Balken fest auf den Hälsen, ein Haltebogen
     fest an zwei Köpfen. Gestreckt sahen die Blätter so aus: Hälse mitten im
     Kopf, Balken irgendwo, Bögen ins Leere. Jens hat es sofort gesehen.

     Richtig ist: Eine Note wird als GANZES verschoben, nie gedehnt. Was
     zwischen zwei Noten gespannt ist — Balken, Bögen —, folgt den Noten, an
     denen es hängt. Nur Taktstriche und Notenlinien werden auf das Raster
     gerechnet. */

  /* Die x-Lage eines Elements: erst der Verschiebe-Wert, dann ein Pfad, dann
     ein Attribut. */
  function xVon(el){
    const t=el.getAttribute && el.getAttribute('transform');
    if(t){ const m=/translate\(\s*(-?[\d.]+)/.exec(t); if(m) return +m[1]; }
    const d=el.getAttribute && el.getAttribute('d');
    if(d){ const m=/M\s*(-?[\d.]+)/.exec(d); if(m) return +m[1]; }
    if(el.hasAttribute && el.hasAttribute('x')) return +el.getAttribute('x');
    if(el.hasAttribute && el.hasAttribute('cx')) return +el.getAttribute('cx');
    const p=el.getAttribute && el.getAttribute('points');
    if(p){ const m=/(-?[\d.]+)\s*,/.exec(p); if(m) return +m[1]; }
    return null;
  }
  /* Eine Gruppe im Ganzen verschieben. */
  function schieben(el, dx){
    if(!dx) return;
    const t=el.getAttribute('transform')||'';
    el.setAttribute('transform', 'translate('+Math.round(dx*100)/100+',0) '+t);
  }
  /* Ein Pfad wird nicht mit einer Textsuche gelesen, sondern Kommando fuer
     Kommando. Verovio schreibt gerade Linien als `M x y L x y`, Boegen aber als
     `M x,y C x,y x,y x,y` — dieselben Zahlen, zwei Schreibweisen. Wer nur nach
     `Zahl Leerzeichen Zahl` sucht, findet bei einem Bogen die y-Werte und dreht
     ihn dabei um. Genau das war auf dem iPad zu sehen. */
  const PFAD_ARG = {M:2, L:2, T:2, C:6, S:4, Q:4, A:7, H:1, V:1, Z:0};
  /* Welche Werte einer Kommando-Gruppe sind x? */
  function xStellen(c, n){
    if(c==='H') return [0];
    if(c==='V' || c==='Z') return [];
    if(c==='A') return [5];
    const r=[]; for(let i=0;i<n;i+=2) r.push(i); return r;
  }
  function pfadXAbbilden(d, f){
    const tok = String(d).match(/[a-zA-Z]|-?[\d.]+(?:[eE][-+]?\d+)?/g);
    if(!tok) return d;
    let aus=[], cmd=null, i=0;
    while(i<tok.length){
      if(/[a-zA-Z]/.test(tok[i])){ cmd=tok[i]; aus.push(cmd); i++;
        if(cmd==='Z'||cmd==='z') continue; }
      if(cmd===null) return d;
      const gross=cmd.toUpperCase(), n=PFAD_ARG[gross];
      if(n===undefined) return d;
      const g=tok.slice(i, i+n); if(g.length<n) break;
      i += n;
      /* Relative Kommandos sind Abstaende, keine Orte — die bleiben. */
      if(cmd===gross) for(const k of xStellen(gross, n))
        g[k] = String(Math.round(f(+g[k])*100)/100);
      aus.push(g.join(' '));
    }
    return aus.join(' ');
  }
  /* Dieselbe Lesart, aber mit BEIDEN Werten eines Punktes — fuer alles, was
     ein Pfad in der Hoehe aendern soll. */
  function pfadPunkteAbbilden(d, f, nurLesen){
    const tok = String(d).match(/[a-zA-Z]|-?[\d.]+(?:[eE][-+]?\d+)?/g);
    if(!tok) return d;
    let aus=[], cmd=null, i=0;
    while(i<tok.length){
      if(/[a-zA-Z]/.test(tok[i])){ cmd=tok[i]; aus.push(cmd); i++;
        if(cmd==='Z'||cmd==='z') continue; }
      if(cmd===null) return d;
      const gross=cmd.toUpperCase(), n=PFAD_ARG[gross];
      if(n===undefined) return d;
      const g=tok.slice(i, i+n); if(g.length<n) break;
      i += n;
      /* H und V tragen nur einen Wert, A nur an Stelle 5/6 einen Punkt —
         beide bleiben unberuehrt; Verovio zeichnet Boegen mit M und C. */
      if(cmd===gross && (gross==='M'||gross==='L'||gross==='T'||gross==='C'||gross==='S'||gross==='Q'))
        for(let k=0;k+1<n;k+=2){
          const r=f(+g[k], +g[k+1]);
          if(!nurLesen && r){ g[k]=String(r[0]); g[k+1]=String(r[1]); }
        }
      aus.push(g.join(' '));
    }
    return nurLesen ? d : aus.join(' ');
  }
  const pfadPunkte = (d, sehen) => pfadPunkteAbbilden(d, (x,y)=>{ sehen(x,y); }, true);

  /* Einzelne x-Werte eines Pfades oder Vielecks abbilden. */
  function xWerteAbbilden(el, f){
    const d=el.getAttribute && el.getAttribute('d');
    if(d) el.setAttribute('d', pfadXAbbilden(d, f));
    const pts=el.getAttribute && el.getAttribute('points');
    if(pts) el.setAttribute('points', pts.replace(/(-?[\d.]+)\s*,\s*(-?[\d.]+)/g,
      (m,a,b)=>(Math.round(f(+a)*100)/100)+','+b));
    if(el.hasAttribute && el.hasAttribute('x')) el.setAttribute('x', Math.round(f(+el.getAttribute('x'))*100)/100);
    if(el.hasAttribute && el.hasAttribute('cx')) el.setAttribute('cx', Math.round(f(+el.getAttribute('cx'))*100)/100);
  }

  /* `bezug` ordnet jedem Bogen seine beiden Noten zu: {bogenId:{startid,endid}}.
     Verovio kennt diese Zuordnung, schreibt sie aber nicht ins SVG — `setze`
     holt sie sich vor dem Rastern beim Setzer ab. Ohne Tabelle faellt der
     Bogen auf die naechstgelegene Note zurueck. */
  function taktraster(svgText, bezug){
    let doc;
    try{ doc = new DOMParser().parseFromString(svgText,'image/svg+xml'); }catch(e){ return svgText; }
    if(!doc || doc.querySelector('parsererror')) return svgText;

    doc.querySelectorAll('g.system').forEach(sys=>{
      const takte = [...sys.children].filter(k=>k.classList && k.classList.contains('measure'));
      if(takte.length<2) return;

      /* Rechte Kante jedes Takts: der äußerste Taktstrich darin. */
      const kante = t=>{ let x=null;
        t.querySelectorAll('g.barLine path').forEach(p=>{
          const m=/M\s*(-?[\d.]+)/.exec(p.getAttribute('d')||''); if(!m) return;
          const v=+m[1]; if(x===null || v>x) x=v; });
        return x; };
      const enden = takte.map(kante);
      if(enden.some(x=>x===null)) return;

      /* Der Vorspann mit Schlüssel und Vorzeichen bleibt, wo er ist. */
      let musikStart=null;
      const l1=takte[0].querySelector('g.layer');
      if(l1) l1.querySelectorAll('g.note, g.rest, g.mRest, g.chord').forEach(el=>{
        const v=xVon(el.querySelector('use, ellipse, path') || el);
        if(v!==null && (musikStart===null || v<musikStart)) musikStart=v; });
      if(musikStart===null) return;
      const gesamt=enden[enden.length-1]-musikStart;
      if(!(gesamt>0)) return;
      const w=gesamt/takte.length;

      /* Der grobe Weg — er sagt nur, WOHIN eine Note rückt. */
      const st=[{von:musikStart, nach:musikStart}];
      for(let i=0;i<takte.length;i++) st.push({von:enden[i], nach:musikStart+w*(i+1)});
      if(st.every(x=>Math.abs(x.von-x.nach)<=1)) return;
      const F = x=>{
        if(x<=st[0].von) return x;
        for(let i=1;i<st.length;i++){
          const a=st[i-1], b=st[i];
          if(x<=b.von || i===st.length-1){
            const sp=b.von-a.von; if(sp<=0) return b.nach;
            return a.nach + (x-a.von)/sp*(b.nach-a.nach);
          }
        }
        return x;
      };

      /* ---- 1. Jede Note, Pause und jeder Akkord als GANZES ---------------- */
      const anker=[];   /* {x, dx} je Ereignis — daran hängt alles Weitere */
      const dxJeId=new Map();   /* dieselbe Verschiebung, nach Kennung nachschlagbar */
      const erledigt=new Set();
      sys.querySelectorAll('g.chord, g.note, g.rest, g.mRest').forEach(el=>{
        let p=el.parentElement, drin=false;
        while(p && p!==sys){ if(erledigt.has(p)) { drin=true; break; } p=p.parentElement; }
        if(drin) return;
        const kopf=el.querySelector('g.notehead use, use, ellipse, path');
        const x=xVon(kopf||el);
        if(x===null) return;
        const dx=F(x)-x;
        schieben(el, dx);
        erledigt.add(el);
        anker.push({x, dx});
        /* Ein Bogen zeigt auf die einzelne Note, auch wenn sie in einem
           Akkord steckt — der als Ganzes verschoben wurde. */
        if(el.id) dxJeId.set(el.id, dx);
        el.querySelectorAll('g.note').forEach(n=>{ if(n.id) dxJeId.set(n.id, dx); });
      });
      if(!anker.length) return;
      anker.sort((a,b)=>a.x-b.x);

      /* Zwischen zwei Noten wird geradlinig überblendet — so bleibt ein Bogen
         an beiden Enden hängen und behält dazwischen seine Form. */
      const dxI = x=>{
        if(x<=anker[0].x) return anker[0].dx;
        if(x>=anker[anker.length-1].x) return anker[anker.length-1].dx;
        for(let i=1;i<anker.length;i++){
          if(x<=anker[i].x){
            const a=anker[i-1], b=anker[i], sp=b.x-a.x;
            return sp<=0 ? b.dx : a.dx + (x-a.x)/sp*(b.dx-a.dx);
          }
        }
        return 0;
      };

      /* ---- 1b. Hilfslinien gehören zu einer Note, stehen aber woanders ----
         Verovio zeichnet sie nicht in die Note, sondern in die Notenzeile.
         Bleiben sie liegen, während ihre Note wandert, steht ein kurzer
         Strich allein auf dem Blatt — genau das war nach dem Umbau im
         zweiten System zu sehen. Sie wandern deshalb zur nächsten Note und
         behalten dabei ihre Länge. */
      const nahDx = x=>{
        let best=anker[0], d=Math.abs(x-anker[0].x);
        for(const a of anker){ const e=Math.abs(x-a.x); if(e<d){ d=e; best=a; } }
        return best.dx;
      };
      sys.querySelectorAll('g.ledgerLines path').forEach(p=>{
        if(p.closest('g.note') || p.closest('g.chord')) return;   /* schon mitbewegt */
        const d=p.getAttribute('d')||'';
        const m=/M\s*(-?[\d.]+)\s+(-?[\d.]+)\s*L\s*(-?[\d.]+)\s+(-?[\d.]+)/.exec(d);
        if(!m) return;
        const x1=+m[1], x2=+m[3], dx=nahDx((x1+x2)/2);
        p.setAttribute('d','M'+Math.round(x1+dx)+' '+m[2]+' L'+Math.round(x2+dx)+' '+m[4]);
      });

      /* ---- 2. Balken folgen den Hälsen, an denen sie sitzen --------------- */
      sys.querySelectorAll('g.beam').forEach(bm=>{
        const haelse=[];
        bm.querySelectorAll('g.note').forEach(n=>{
          const p=n.querySelector('g.stem path'); if(!p) return;
          const m=/M\s*(-?[\d.]+)/.exec(p.getAttribute('d')||''); if(!m) return;
          const kopf=n.querySelector('g.notehead use');
          const kx=xVon(kopf||n);
          haelse.push({x:+m[1], dx: kx===null?0:(F(kx)-kx)});
        });
        if(!haelse.length) return;
        /* Jede Ecke gehört zu genau einem Hals — dem nächstgelegenen. */
        const naechster = x=>{
          let best=haelse[0], d=Math.abs(x-haelse[0].x);
          for(const h of haelse){ const e=Math.abs(x-h.x); if(e<d){ d=e; best=h; } }
          return best.dx;
        };
        bm.querySelectorAll('polygon, path').forEach(el=>{
          if(el.closest('g.note')) return;             /* gehört einer Note, ist schon bewegt */
          xWerteAbbilden(el, x=>x+naechster(x));
        });
      });

      /* ---- 3. Bögen hängen an zwei Noten ----------------------------------
         Verovio zeichnet einen Bogen als geschlossene Sichel: Hinkurve,
         Rueckkurve, letzter Punkt gleich erstem. Seine Enden sind deshalb
         nicht der erste und der letzte Punkt des Pfades, sondern der linkeste
         und der rechteste. Beide haengen an einer Note, nicht an einer Stelle
         im Takt — sonst loest sich der Bogen von seinen Koepfen. */
      sys.querySelectorAll('g.tie, g.slur, g.phrase').forEach(g=>{
        g.querySelectorAll('path').forEach(p=>{
          const d=p.getAttribute('d')||''; if(!d) return;
          let lo=Infinity, hi=-Infinity;
          pfadXAbbilden(d, x=>{ if(x<lo) lo=x; if(x>hi) hi=x; return x; });
          if(!(hi>lo)) return;
          /* Endet ein Bogen im naechsten System, kennt dieses Blatt seine
             zweite Note nicht — dann bleibt die naechstgelegene. */
          const bz = (bezug && bezug[g.id]) || {};
          const ohne = r=>String(r||'').replace(/^#/,'');
          const links = dxJeId.get(ohne(bz.startid)), rechts = dxJeId.get(ohne(bz.endid));
          const d0 = links===undefined ? nahDx(lo) : links;
          const d1 = rechts===undefined ? nahDx(hi) : rechts;
          const sp=hi-lo;
          p.setAttribute('d', pfadXAbbilden(d, x=> x + d0 + (x-lo)/sp*(d1-d0)));
        });
      });

      /* ---- 4. Was sonst zwischen den Noten gespannt ist -------------------- */
      sys.querySelectorAll('g.hairpin, g.tupletBracket, g.octave, g.bracketSpan, g.ending')
        .forEach(g=>g.querySelectorAll('path, polygon, text, tspan')
          .forEach(el=>xWerteAbbilden(el, x=>x+dxI(x))));

      /* ---- 5. Akkordnamen, Texte und Zahlen ------------------------------- */
      sys.querySelectorAll('g.harm, g.dir, g.tempo, g.dynam, g.fing, g.tupletNum, g.mNum')
        .forEach(g=>{ const x=xVon(g.querySelector('text, tspan, use')||g);
          if(x!==null) schieben(g, F(x)-x); });

      /* ---- 6. Taktstriche auf das Raster, Notenlinien mit ----------------- */
      takte.forEach((t,i)=>{
        t.querySelectorAll('g.barLine path, g.barLine use').forEach(el=>{
          const x=xVon(el); if(x===null) return;
          xWerteAbbilden(el, ()=>F(x));
          if(el.tagName==='use') schieben(el, F(x)-x);
        });
        t.querySelectorAll('g.staff > path').forEach(p=>xWerteAbbilden(p, F));
      });
    });
    try{ return new XMLSerializer().serializeToString(doc); }catch(e){ return svgText; }
  }

  /* ---- Der Feinschliff am fertigen Blatt ---------------------------------
     Drei Dinge kann der Setzer nicht, und alle drei lassen sich am fertigen
     SVG machen: Akkordsymbole groesser stellen (er kennt dafuer keine Groesse),
     Notenlinien ueber seine Grenze hinaus verstaerken (bei 0,30 ist Schluss,
     darueber faellt er auf seinen Vorgabewert zurueck) und Boegen runder oder
     flacher setzen. `slurCurveFactor` wirkt nur auf BINDEboegen; Haltebogen
     haben im Setzer eine feste Form — gemessen am 21. August ueber alle Werte.

     Ein Bogen wird an seiner Sehne gestreckt: Die beiden Enden bleiben, wo sie
     sind, alles dazwischen rueckt von der Verbindungslinie weg oder auf sie
     zu. So bleibt der Bogen an seinen Noten haengen. */
  function blattFeinschliff(svgText, e){
    e = e || E();
    const akkF   = e.akkgroesse;
    const linieF = e.linie > 0.30 ? e.linie/0.30 : 1;
    const bogenF = e.bogen;
    if(Math.abs(akkF-1)<0.01 && Math.abs(linieF-1)<0.01 && Math.abs(bogenF-1)<0.01)
      return svgText;
    let doc;
    try{ doc = new DOMParser().parseFromString(svgText,'image/svg+xml'); }catch(err){ return svgText; }
    if(!doc || doc.querySelector('parsererror')) return svgText;

    if(Math.abs(akkF-1)>=0.01)
      doc.querySelectorAll('g.harm [font-size]').forEach(el=>{
        const v=parseFloat(el.getAttribute('font-size'));
        if(v>0) el.setAttribute('font-size', Math.round(v*akkF)+'px');
      });

    if(Math.abs(linieF-1)>=0.01)
      doc.querySelectorAll('g.staff > path').forEach(p=>{
        const v=parseFloat(p.getAttribute('stroke-width'));
        if(v>0) p.setAttribute('stroke-width', Math.round(v*linieF));
      });

    if(Math.abs(bogenF-1)>=0.01)
      doc.querySelectorAll('g.tie path, g.slur path, g.phrase path').forEach(p=>{
        const d=p.getAttribute('d')||''; if(!d) return;
        const pkt=[]; pfadPunkte(d, (x,y)=>{ pkt.push([x,y]); });
        if(pkt.length<3) return;
        /* Die Sehne: von der linkesten zur rechtesten Stelle des Bogens. */

        for(const q of pkt){ if(q[0]<a[0]) a=q; if(q[0]>b[0]) b=q; }
        const sp=b[0]-a[0]; if(!(sp>0)) return;
        const sehne = x => a[1] + (x-a[0])/sp*(b[1]-a[1]);
        p.setAttribute('d', pfadPunkteAbbilden(d, (x,y)=>{
          const s0=sehne(x);
          return [x, Math.round((s0 + (y-s0)*bogenF)*100)/100];
        }));
      });

  }

  /* ---- Das Probestueck fuer die Vorschau ---------------------------------

  const PROBE = `<?xml version="1.0" encoding="UTF-8"?>

<part id="P1">
<measure number="1"><attributes><divisions>2</divisions><key><fifths>-1</fifths></key>
<time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
<harmony><root><root-step>F</root-step></root><kind>major-seventh</kind></harmony>
<note><pitch><step>A</step><octave>4</octave></pitch><duration>4</duration><type>half</type>
<notations><tied type="start"/></notations><tie type="start"/></note>
<note><pitch><step>A</step><octave>4</octave></pitch><duration>2</duration><type>quarter</type>
<notations><tied type="stop"/></notations><tie type="stop"/></note>
<note><pitch><step>C</step><octave>5</octave></pitch><duration>2</duration><type>quarter</type></note></measure>
<measure number="2">
<harmony><root><root-step>D</root-step></root><kind>minor-seventh</kind></harmony>
<note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>eighth</type><beam number="1">begin</beam>
<notations><slur type="start" number="1"/></notations></note>
<note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>eighth</type><beam number="1">continue</beam></note>
<note><pitch><step>A</step><octave>4</octave></pitch><duration>1</duration><type>eighth</type><beam number="1">continue</beam></note>
<note><pitch><step>F</step><octave>4</octave></pitch><duration>1</duration><type>eighth</type><beam number="1">end</beam>
<notations><slur type="stop" number="1"/></notations></note>
<note><pitch><step>G</step><octave>4</octave></pitch><duration>4</duration><type>half</type></note></measure>
<measure number="3">
<harmony><root><root-step>B</root-step><root-alter>-1</root-alter></root><kind>dominant</kind>
<degree><degree-value>11</degree-value><degree-alter>1</degree-alter><degree-type>add</degree-type></degree></harmony>
<note><pitch><step>B</step><alter>-1</alter><octave>4</octave></pitch><duration>3</duration><type>quarter</type><dot/></note>
<note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>eighth</type></note>
<note><pitch><step>F</step><octave>5</octave></pitch><duration>4</duration><type>half</type></note></measure>
<measure number="4">
<harmony><root><root-step>F</root-step></root><kind>major-seventh</kind></harmony>
<note><pitch><step>F</step><octave>5</octave></pitch><duration>8</duration><type>whole</type></note>
<barline location="right"><bar-style>light-heavy</bar-style></barline></measure>
</part></score-partwise>`;

  /* Ein Blatt aus dem Probestueck, in der eingestellten Gestalt. Es geht

     anderes als die Buehne. */

  /* ---- Der Setzer, auf Zuruf geholt --------------------------------------- */
  let _tk=null, _laeuft=null;
  function bereit(){ return !!_tk; }
  function holen(sagen){

     `opt.tonart`  Verovio-Schreibweise: '+M2', 'Eb', '' fuer wie geliefert

/* ============================================================================
   IR — iReal Pro lesen und schreiben                       (21. August 2026)

   Ein Chord-Sheet ist kein Leadsheet ohne Noten, sondern etwas anderes: eine
   Liste von Takten mit Akkordnamen darin. Es braucht keinen Notensetzer, es
   steht sofort da, und Transponieren ist eine Rechnung ueber Namen statt ueber
   Tonhoehen.

   Das Format hat der Hersteller nie veroeffentlicht. Am 21. August ist es an
   einem geteilten Stueck vermessen worden — „Body And Soul", zusammen mit dem
   MusicXML, das iReal Pro zum selben Stueck ausgibt.

   Der Aufbau: `irealb://` und dann zehn Felder, durch `=` getrennt. Belegt
   sind Titel, Komponist als „Nachname Vorname", der Stil, die Tonart und der
   Rumpf; die uebrigen sind leer oder tragen eine Null.

   Der Rumpf traegt den Marker `1r34LbKcu7` und ist danach VERWUERFELT, nicht
   verschluesselt: Jeder Block von fuenfzig Zeichen wird umgekehrt, und drei
   Bereiche bleiben dabei stehen — 5 bis 9, 24 bis 25 und 40 bis 44. Was am
   Ende keinen vollen Block mehr fuellt, wird gar nicht angefasst.

   Die Vorschrift ist ihre eigene Umkehrung. Deshalb steht hier nur EINE
   Funktion fuer beide Richtungen.                                          */
const IR = (function(){
  const MARKER = '1r34LbKcu7';
  const FEST = new Set([5,6,7,8,9,24,25,40,41,42,43,44]);

  function dreh(s){
    let aus = '';
    s = String(s||'');
    while(s.length > 50){
      const p = s.slice(0,50); s = s.slice(50);
      let t = '';
      for(let j=0;j<50;j++) t += FEST.has(j) ? p[j] : p[49-j];
      aus += t;
    }
    return aus + s;
  }

  /* ---- Den Rumpf in Takte zerlegen ---------------------------------------
     Die Syntax, am Beispiel abgelesen:
       *A *B   Abschnittsmarke        { }   Wiederholung
       [ ]     Abschnittsklammer      T44   Taktart
       LZ |    Taktstrich             Z     Schlussstrich
       N1 N2   erste, zweite Endung   s l   klein, wieder gross
       XyQ     Wiederholungstakt      , ' ' Trenner
     Was nicht erkannt wird, wird uebergangen und nicht geraten — ein falsch
     gelesener Akkord auf dem Pult ist schlimmer als eine Luecke.            */
  const AKKORD = /^([A-G][b#]?)((?:\^|-|h|o|\+|sus|alt|add|[0-9#b]|\(|\))*)(\/[A-G][b#]?)?/;

  function rumpfLesen(t){
    const takte = [];
    let takt = { akkorde:[], marke:'', auf:'', zu:'', endung:'', umbruch:false };
    let taktart = '';
    const neuerTakt = () => {
      takte.push(takt);
      takt = { akkorde:[], marke:'', auf:'', zu:'', endung:'', umbruch:false };
    };
    let i = 0;
    while(i < t.length){
      const r = t.slice(i);
      let m;
      if(r.startsWith('LZ') || r[0]==='|'){ neuerTakt(); i += r.startsWith('LZ') ? 2 : 1; continue; }
      if(r[0]==='Z'){ takt.zu='ende'; neuerTakt(); i++; continue; }
      if((m = /^T(\d)(\d)/.exec(r))){ taktart = m[1]+'/'+m[2]; i += 3; continue; }
      if((m = /^\*([A-Za-z])/.exec(r))){ takt.marke = m[1].toUpperCase(); i += 2; continue; }
      if((m = /^N(\d)/.exec(r))){ takt.endung = m[1]; i += 2; continue; }
      /* Klammern sind AUCH Taktstriche: Zwischen zwei Abschnitten steht
         `]*B[` und sonst nichts. Wer nur `LZ` und `|` trennt, laesst drei
         Takte zu einem verschmelzen. */
      if(r[0]==='}'){ takt.zu='wdh'; neuerTakt(); i++; continue; }
      if(r[0]===']'){ neuerTakt(); i++; continue; }
      if(r[0]==='{'){ if(takt.akkorde.length) neuerTakt(); takt.auf='wdh'; i++; continue; }
      if(r[0]==='['){ if(takt.akkorde.length) neuerTakt(); i++; continue; }
      /* Zwei Fuellzeichen, am 21. August an „Autumn Leaves" geklaert.

         `XyQ` fuellt den REST EINES TAKTES: Es steht hinter jedem Akkord, der
         allein in seinem Takt steht — `C-7XyQ|F7XyQ|`. Steht es dagegen ohne
         Akkord davor, fuellt es leere Takte am Zeilenende, damit das Naechste
         neu beginnt; bei „Body And Soul" sind das vier Stueck vor der zweiten
         Endung. Deshalb dieselbe Marke, zwei Bedeutungen — und die haengt
         daran, ob im Takt schon etwas steht.

         `Kcl` ist der Wiederholungstakt: noch einmal dasselbe. */
      if(r.startsWith('XyQ')){
        if(!takt.akkorde.length){
          if(takte.length) takte[takte.length-1].umbruch = true;
          else takt.umbruch = true;
        }
        i += 3; continue;
      }
      if(r.startsWith('Kcl')){ neuerTakt(); takt.akkorde.push('%'); i += 3; continue; }
      if(r[0]==='x'){ takt.akkorde.push('%'); i++; continue; }
      if(r[0]==='s' || r[0]==='l' || r[0]==='U' || r[0]==='Y'){ i++; continue; }
      if(r[0]===',' || r[0]===' '){ i++; continue; }
      if((m = AKKORD.exec(r))){ takt.akkorde.push(m[0]); i += m[0].length; continue; }
      i++;   /* unbekanntes Zeichen: uebergehen */
    }
    neuerTakt();
    return { taktart: taktart || '4/4',
             takte: takte.filter((x,k)=> x.akkorde.length || x.marke || x.endung || k===0) };
  }

  function lesen(url){
    const s = decodeURIComponent(String(url||'').replace(/^irealb:\/\//,''));
    const f = s.split('=');
    if(f.length < 7) throw new Error('Das sieht nicht nach einem iReal-Pro-Verweis aus.');
    let rumpf = f[6] || '';
    const k = rumpf.indexOf(MARKER);
    if(k < 0) throw new Error('In diesem Verweis steht kein Stück.');
    rumpf = dreh(rumpf.slice(k + MARKER.length));
    const komp = (f[1]||'').trim();
    const teile = komp.split(/\s+/);
    return Object.assign({
      titel: (f[0]||'').trim(),
      /* iReal Pro schreibt „Nachname Vorname". */
      komponist: teile.length===2 ? teile[1]+' '+teile[0] : komp,
      stil: (f[3]||'').trim(),
      tonart: (f[4]||'').trim(),
      rumpf
    }, rumpfLesen(rumpf));
  }

  /* ---- Das Blatt ---------------------------------------------------------
     Vier Takte je Zeile ist die Konvention des Real Book. Wo viele Wechsel mit
     langen Namen stehen, werden es zwei — das entscheidet sich je Zeile und
     nicht fuer das ganze Stueck, so hat Jens es am 21. August verlangt.

     Das Blatt hat KEIN festes Papierformat. Ein Chord-Sheet ist kein
     gescanntes Blatt: Es entsteht beim Zeigen und richtet sich nach der
     Flaeche, die da ist. Auf dem Pult zaehlt die Schrifthoehe, nicht die
     Treue zu DIN A4 — beim Drucken und Weitergeben wird A4 uebergeben, sonst
     die Buehne.                                                            */
  const A4 = { b:21000, h:29700, rand:1100 };

  const taktBreite = t => Math.max(6, (t.akkorde.join(' ').length || 2));

  function zeilenBauen(takte){
    const zeilen = [];
    let zeile = [];
    const schliessen = () => { if(zeile.length){ zeilen.push(zeile); zeile=[]; } };
    let i = 0;
    while(i < takte.length){
      const rest = takte.slice(i);
      const vier = rest.slice(0,4);
      const eng = vier.some(t => t.akkorde.length > 2 || t.akkorde.some(a=>a.length>7))
               || vier.reduce((n,t)=>n+taktBreite(t),0) > 38;
      const n = Math.min(eng ? 2 : 4, rest.length);
      for(let k=0;k<n;k++){
        zeile.push(rest[k]);
        /* Ein erzwungener Umbruch: iReal Pro setzt ihn, damit eine Endung
           oder ein Abschnitt in einer neuen Zeile beginnt. */
        if(rest[k].umbruch){ schliessen(); i += k+1; break; }
        if(k===n-1) i += n;
      }
      if(zeile.length >= (eng?2:4)) schliessen();
    }
    schliessen();
    return zeilen;
  }

  function esc(x){ return String(x==null?'':x)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* Die Schreibweise des Real Book. Gemessen am 21. August, welche Zeichen
     Petaluma Script wirklich hat: Dreieck, ø, ° und Kreuz — aber KEIN
     b-Vorzeichen, weder als U+EA64 noch als U+266D. U+EA64 liegt im
     Privatbereich, wo auch keine Ersatzschrift etwas hat; daraus wurde eine
     Luecke und aus `Eb-7` ein `E -7`. U+266D ist ein gewoehnliches Zeichen:
     Die Ersatzschrift springt dafuer ein. */
  function akkordSetzen(a){
    return String(a)
      .replace(/\^/g, '△').replace(/b/g, '♭').replace(/#/g, '♯')
      .replace(/h/g, 'ø').replace(/o/g, '°');
  }
  /* Der Grundton steht gross, was dahinter kommt kleiner und etwas hoeher —
     so setzt es das Real Book, und so bleibt eine lange Alteration lesbar,
     ohne den Takt zu sprengen. */
  function akkordTeile(a){
    const m = /^([A-G][b#]?)(.*)$/.exec(String(a));
    if(!m) return { grund: akkordSetzen(a), rest:'' };
    return { grund: akkordSetzen(m[1]), rest: akkordSetzen(m[2]) };
  }

  /* Alles auf diesem Blatt ist schwarz. Der Regler in Setup faerbt die
     NOTENLINIEN eines gesetzten Blattes, und ein Chord-Sheet hat keine — es
     hat Taktstriche, und die gehoeren zur Schrift. Am 21. August standen
     Wiederholungszeichen grau neben schwarzen Akkorden. */
  function zeichnen(o, opt){
    opt = opt || {};
    const B = Math.round(opt.breite || A4.b);
    const H = Math.round(opt.hoehe  || A4.h);
    const rand = Math.round(Math.min(B,H) * 0.055);
    const zeilen = zeilenBauen(o.takte || []);
    const breite = B - 2*rand;
    const kopf = (opt.titel || opt.komponist) ? Math.round(H*0.075) : 0;
    const y0 = rand + kopf + Math.round(H*0.03);
    const platz = H - y0 - rand;
    const ZH = Math.max(1, Math.floor(platz / Math.max(1, zeilen.length)));
    const hoch = ZH * 0.60;                     /* Hoehe eines Taktkastens */
    const gr = Math.round(hoch * 0.62 * (opt.akkgroesse || 1));
    const st = Math.max(3, Math.round(hoch*0.028));
    const farbe = '#000';

    const T = [];
    const linie = (x1,y1,x2,y2,dick) => T.push('<path d="M'+Math.round(x1)+' '+Math.round(y1)
      +' L'+Math.round(x2)+' '+Math.round(y2)+'" stroke="'+farbe+'" stroke-width="'
      +(dick||st)+'" fill="none" stroke-linecap="butt"/>');
    const punkt = (x,y,r) => T.push('<circle cx="'+Math.round(x)+'" cy="'+Math.round(y)
      +'" r="'+Math.round(r)+'" fill="'+farbe+'"/>');
    const kasten = (x,y,w,h) => T.push('<rect x="'+Math.round(x)+'" y="'+Math.round(y)
      +'" width="'+Math.round(w)+'" height="'+Math.round(h)+'" fill="'+farbe+'"/>');
    const text = (x,y,g,inhalt,anker,fuellung) => T.push('<text x="'+Math.round(x)+'" y="'
      +Math.round(y)+'" font-size="'+Math.round(g)+'" fill="'+(fuellung||'#000')+'"'
      +(anker?' text-anchor="'+anker+'"':'')+'>'+inhalt+'</text>');

    if(opt.titel) text(B/2, rand + kopf*0.55, kopf*0.52, esc(String(opt.titel).toUpperCase()), 'middle');
    if(opt.komponist) text(B-rand, rand + kopf*0.92, kopf*0.30, esc(opt.komponist), 'end');
    /* Der Stil steht links unter dem Titel, wie bei iReal Pro. Er sagt, wie
       das Stueck gemeint ist — „Ballad" oder „Medium Swing" —, und das
       gehoert auf ein Blatt, aus dem gespielt wird. */
    if(opt.stil) text(rand, rand + kopf*0.92, kopf*0.30, '('+esc(opt.stil)+')', 'start');

    zeilen.forEach((zeile, zi)=>{
      const oben = y0 + zi*ZH;
      const unten = oben + hoch;
      /* Die Takte einer Zeile sind NICHT gleich breit. Wer Schluessel, Taktart
         oder ein Wiederholungszeichen traegt, braucht mehr Platz, und wer
         vier Akkorde hat, auch. Bei gleicher Breite stand im ersten Takt die
         Taktart auf dem ersten Akkord — am 21. August von Jens gesehen. */
      const gew = zeile.map((t,k)=> 1
        + ((zi===0 && k===0 && opt.taktart) ? 0.45 : 0)
        + (t.auf==='wdh' ? 0.12 : 0) + (t.zu ? 0.10 : 0)
        + Math.max(0, (t.akkorde.length-1) * 0.16));
      const summe = gew.reduce((a,b)=>a+b, 0);
      const kanten = [rand];
      gew.forEach(g=>kanten.push(kanten[kanten.length-1] + breite*g/summe));
      zeile.forEach((t, ti)=>{
        const x = kanten[ti], xr = kanten[ti+1], w = xr - x;

        /* Taktstriche: der linke immer, der rechte nur ganz aussen. */
        if(t.auf==='wdh'){
          linie(x+st*3, oben, x+st*3, unten, st*3.2);
          linie(x+st*7.5, oben, x+st*7.5, unten);
          punkt(x+st*12, oben+hoch*0.36, st*1.5);
          punkt(x+st*12, oben+hoch*0.64, st*1.5);
        } else linie(x, oben, x, unten);
        if(t.zu==='wdh'){
          punkt(xr-st*12, oben+hoch*0.36, st*1.5);
          punkt(xr-st*12, oben+hoch*0.64, st*1.5);
          linie(xr-st*7.5, oben, xr-st*7.5, unten);
          linie(xr-st*3, oben, xr-st*3, unten, st*3.2);
        } else if(t.zu==='ende'){
          linie(xr-st*7, oben, xr-st*7, unten);
          linie(xr-st*1.6, oben, xr-st*1.6, unten, st*3.2);
        } else if(ti===zeile.length-1) linie(xr, oben, xr, unten);

        /* Die Abschnittsmarke als schwarzes Kaestchen mit weissem Buchstaben —
           so setzt es das Real Book, und so findet man sie im Augenwinkel. */
        if(t.marke){
          const k = hoch*0.30;
          kasten(x + st*2, oben - k - st*3, k, k);
          text(x + st*2 + k/2, oben - k*0.22 - st*3, k*0.86, esc(t.marke), 'middle', '#fff');
        }
        /* Die Endung: waagerechte Klammer mit Abknick nach unten. */
        if(t.endung){
          const yk = oben - hoch*0.17;
          linie(x, yk, xr - w*0.06, yk);
          linie(x, yk, x, yk + hoch*0.16);
          text(x + st*6, yk - hoch*0.06, hoch*0.26, esc(t.endung)+'.');
        }
        /* Die Taktart steht einmal, vor dem ersten Takt. */
        if(zi===0 && ti===0 && opt.taktart){
          const p = String(opt.taktart).split('/');
          const tx = x + st*(t.auf==='wdh' ? 17 : 6);
          text(tx, oben + hoch*0.40, hoch*0.42, esc(p[0]), 'start');
          text(tx, oben + hoch*0.86, hoch*0.42, esc(p[1]||'4'), 'start');
        }

        const links = x + (zi===0 && ti===0 && opt.taktart ? st*20 : st*8)
                        + (t.auf==='wdh' ? st*9 : 0);
        const rechts = xr - st*8 - (t.zu ? st*9 : 0);
        const feld = Math.max(w*0.3, rechts-links);
        const n = t.akkorde.length;
        const yb = oben + hoch*0.72;
        /* Mehrere Akkorde in einem Takt werden kleiner gesetzt — dasselbe tut
           iReal Pro, und dafuer steht das `s` in seinem Format. Ohne das
           standen `G-7` und `Gb7` uebereinander. */
        const gr2 = gr * (n<=1 ? 1 : n===2 ? 0.76 : 0.60);
        t.akkorde.forEach((a, ai)=>{
          if(a==='%'){
            /* Der Wiederholungstakt: Schraegstrich mit zwei Punkten. */
            const cx = links + feld/2, cy = oben + hoch*0.5;
            linie(cx - hoch*0.16, cy + hoch*0.20, cx + hoch*0.16, cy - hoch*0.20, st*2.2);
            punkt(cx - hoch*0.17, cy - hoch*0.13, st*1.6);
            punkt(cx + hoch*0.17, cy + hoch*0.13, st*1.6);
            return;
          }
          const k = akkordTeile(a);
          const ax = n===1 ? links : links + feld*(ai/(n-1))*0.92;
          const anker = n===1 ? 'start' : (ai===n-1 ? 'end' : 'start');
          T.push('<text x="'+Math.round(ax)+'" y="'+Math.round(yb)+'" fill="#000"'
            +(anker!=='start'?' text-anchor="'+anker+'"':'')+'>'
            +'<tspan font-size="'+Math.round(gr2)+'">'+esc(k.grund)+'</tspan>'
            +(k.rest ? '<tspan font-size="'+Math.round(gr2*0.62)+'" dy="'+Math.round(-gr2*0.06)+'">'
                       +esc(k.rest)+'</tspan>' : '')
            +'</text>');
        });
      });
    });

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+B+' '+H+'" '
         + 'width="'+B+'" height="'+H+'">'
         + '<rect width="'+B+'" height="'+H+'" fill="#fff"/>'
         + T.join('') + '</svg>';

  return { dreh, lesen, rumpfLesen, zeichnen, zeilenBauen, A4, MARKER };
})();
