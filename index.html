     background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-16);
     box-shadow:var(--shadow-dlg);overflow:hidden}
  body[data-dlg] .dlg{display:flex}
  .dlghead{display:flex;align-items:flex-start;gap:10px;padding:15px 15px 11px;
     background:var(--bg-panel);flex:none}
  .dlghead h3{margin:0;font:800 16px/1.2 var(--font-sans)}
  .dlghead .sub{margin-top:3px;font:400 12px/1.4 var(--font-sans);color:var(--text-faint)}
  .dlgclose{all:unset;margin-left:auto;flex:none;width:32px;height:32px;border-radius:var(--r-9);
     display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer}
  .dlgclose .i{width:16px;height:16px}
  .dlgbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 9px 10px}
  .dlgbody .ntitle{margin:12px 4px 4px}
  .dlgbody .ntitle:first-child{margin-top:2px}
  .dlgfoot{display:flex;gap:8px;align-items:center;flex:none;background:var(--bg-panel);
     padding:10px 13px calc(11px + env(safe-area-inset-bottom))}
  .dlgrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-9);
     cursor:pointer;font:600 13.5px/1.3 var(--font-sans);color:var(--text-body)}
  .dlgrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dlgrow .cnt{flex:none;font-weight:700;color:var(--text-dim)}
  .dlgrow .i{width:17px;height:17px;flex:none;color:var(--text-faint)}
  .dlgrow .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dlgbox{width:15px;height:15px;border-radius:var(--r-4);border:1px solid var(--check-line);
     flex:none;display:flex;align-items:center;justify-content:center;color:var(--white)}
  .dlgbox .i{width:11px;height:11px;color:var(--white);opacity:0}
  .dlgrow[aria-checked=true] .dlgbox{background:var(--accent);border-color:var(--accent)}
  .dlgrow[aria-checked=true] .dlgbox .i{opacity:1}
  /* Der gesetzte Standard wird nicht ausgegraut, sondern in der Akzentfarbe
     genannt — es ist eine Aussage, kein abgeschalteter Knopf. */
  .istStandard{color:var(--accent-bright);font:700 12.5px/1 var(--font-sans);white-space:nowrap}

  /* ================================================================
     Schritt 8 — die Setup-Seite.

     Sie fuellt die Flaeche rechts der Seitenleiste und ersetzt damit
     Titelliste und Buehne, solange sie offen ist. So steht es im Entwurf.
     ================================================================ */
  #setup{flex:1;min-width:0;display:none;flex-direction:column;background:var(--bg-app)}
  body[data-page=setup] #setup{display:flex}
  body[data-page=setup] #listcol,
  body[data-page=setup] #stage{display:none}
  /* Im Hochformat scrollt die ganze Seite; ohne sticky waere „Schließen"
     nach dem ersten Scrollen nicht mehr erreichbar. */
  /* Der Brotkrumenpfad beginnt dort, wo die rechte Spalte beginnt. Ueber der
     Themenspalte hat er nichts zu suchen: Was dort gewaehlt ist, steht schon
     farbig hervorgehoben da. Am 1. August von Jens so verlangt. Die Breite
     steht als Token und wird von beiden gelesen. */
  .suphead{display:flex;align-items:center;gap:12px;flex:none;position:sticky;top:0;z-index:2;
     background:var(--bg-nav);
     padding:15px 22px 14px;padding-left:calc(22px + var(--supnav-w));
     padding-top:calc(15px + env(safe-area-inset-top))}
  .suphead h2{margin:0;font:800 19px/1.2 var(--font-sans)}
  /* Zweispaltig: links die Themen, rechts die Einstellungen des gewaehlten
     Themas. Eine einzige lange Liste war unuebersichtlich. */
  .supcols{flex:1;min-height:0;display:flex;align-items:stretch}
  .supnav{width:var(--supnav-w);flex:none;background:var(--bg-nav);overflow-y:auto;
     -webkit-overflow-scrolling:touch;padding:10px 8px calc(20px + env(safe-area-inset-bottom))}
  .supitem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-9);
     cursor:pointer;font:600 13.5px/1.3 var(--font-sans);color:var(--text-body);margin-bottom:2px}
  .supitem.gewaehlt{background:var(--bg-panel-sel);color:var(--white)}
  .supitem .i{width:17px;height:17px;flex:none;color:var(--text-faint)}
  .supitem.gewaehlt .i{color:var(--accent-bright)}
  .supscroll{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
     padding:6px 22px calc(40px + env(safe-area-inset-bottom))}
  .supscroll .sgrp:first-child{margin-top:14px}
  /* Die Werkzeugleiste von Content klebt am unteren Rand des Rollbereichs.
     Sie erscheint erst mit der Auswahl — vorher nimmt sie keine Hoehe. Der
     Verlauf darueber laesst die Liste darunter weglaufen, statt sie hart
     abzuschneiden. */
  .cwerkleiste{position:sticky;bottom:calc(-6px - env(safe-area-inset-bottom));
     z-index:5;margin:12px 0 0;padding:10px 0 calc(12px + env(safe-area-inset-bottom));
     background:var(--bg-app)}
  .cwerkleiste::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:22px;
     background:linear-gradient(to top, var(--bg-app), transparent);pointer-events:none}
  .cwerkleiste .scard{box-shadow:var(--shadow-dock);border-color:var(--accent-edge)}
  .cwerkleiste[hidden]{display:none}
  /* Der Name einer Content-Zeile als Text. Er sieht antippbar aus, ohne ein
     Formular zu sein — ein Doppeltipp macht ein Feld daraus. */
  .cname{font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;
     text-overflow:ellipsis;white-space:nowrap;cursor:text;
     padding:2px 0;border-bottom:1px dashed transparent}
  .cname:hover{border-bottom-color:var(--line-soft)}
  .ckomp{opacity:.85}
  /* Auch im Hochformat zweispaltig. Die Themen lagen dort als waagerechte
     Reihe, und was nicht in die Breite passte, lag ausserhalb — man sah nie
     alle sechs auf einmal. Die Spalte ist schmaler als im Querformat, aber
     sie zeigt vollstaendig, was es gibt. */
  body[data-o=port] .supnav{padding:10px 6px calc(20px + env(safe-area-inset-bottom))}
  body[data-o=port] .supitem{padding:10px 9px;font-size:13px;gap:8px}
  body[data-o=port] .supscroll{padding-left:14px;padding-right:14px}
  body[data-o=port] .supitem{flex:none;margin:0;white-space:nowrap}
  .sgrp{font:800 10.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;
     color:var(--text-dim);margin:22px 0 9px}
  /* Die Gruppen der Themenliste. Elf Themen ohne Gliederung sind eine Wand;
     drei Gruppen sagen, wonach man sucht — Bestand, App, System. Am 7. August
     mit Jens festgelegt, zusammen mit der Trennung von Import und Export. */
  .supgrp{font:800 9.5px/1 var(--font-sans);letter-spacing:.15em;text-transform:uppercase;
     color:var(--text-faint);padding:16px 11px 6px}
  .supnav>.supgrp:first-child{padding-top:4px}
  body[data-o=port] .supgrp{padding:13px 9px 5px}
  /* Erklärung ist kein Bedienelement. Bis zum 7. August stand jede Erklärung
     als eigene Zeile IN der Karte und sah damit aus wie eine Zeile, an der es
     etwas zu tun gibt. Jetzt steht sie darüber, ohne Kasten und ohne Fuge —
     am Aussehen erkennt man, ob eine Handlung dranhängt. */
  .shint{font:400 12.5px/1.55 var(--font-sans);color:var(--text-faint);
     max-width:640px;margin:-1px 0 11px}
  .shint b{color:var(--text-body);font-weight:600}
  .shint.warn{color:var(--danger-ink)}
  .sgrp+.shint{margin-top:-5px}
  .scard{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:var(--r-13);
     overflow:hidden;max-width:720px}
  /* Alle Zeilen tragen denselben helleren Ton; getrennt werden sie durch eine
     ein Pixel schmale Fuge, durch die die Karte darunter durchscheint. */
  .scard{display:flex;flex-direction:column;gap:1px}
  .srow{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--bg-panel-hover)}

  .srow .lb{font:600 13.5px/1.35 var(--font-sans)}
  .srow .sb{font:400 12px/1.45 var(--font-sans);color:var(--text-faint);margin-top:2px;max-width:380px}
  .srow .ctl{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}
  /* Die Werkzeugleiste von Content. Seit die Knoepfe ihre Ebene mitnennen —
     „2 Titel verschieben" statt „Verschieben" — brauchen sie mehr Breite, und
     `flex:none` auf den Knoepfen quetschte die Beschriftung links auf vier
     Zeilen. Diese eine Zeile darf deshalb umbrechen, und der Text behaelt eine
     Mindestbreite. Nur hier: In den uebrigen Setup-Zeilen steht rechts ein
     einzelner Schalter, dort ist die eine Zeile richtig. */
  .srow.werkzeuge{flex-wrap:wrap;row-gap:10px}
  .srow.werkzeuge>div:first-child{flex:1 1 190px;min-width:0}
  /* `flex:none` liess die Knoepfe im Hochformat aus dem Bild laufen: Sie
     nahmen ihre volle Breite und schrumpften nicht. Mit einer Grundbreite von
     260 px rutscht die Knopfgruppe stattdessen unter den Text, sobald es eng
     wird, und bricht dort selbst um. */
  .srow.werkzeuge .ctl{flex:1 1 260px;min-width:0;flex-wrap:wrap;row-gap:8px;
    justify-content:flex-end}
  .srow.werkzeuge .sb{max-width:none}
  .srow .btn{height:auto;padding:8px 13px;font-size:12.5px;border-radius:var(--r-9);font-weight:600}
  /* Eine Flucht rechts. Vorher stand jedes Bedienelement dort, wo sein Text
     endete: Eingabefelder mit 180, 220 und 240 px nebeneinander, Knöpfe so
     breit wie ihre Beschriftung. Jetzt hat die Steuerspalte eine Mindestbreite
     und richtet sich rechts aus; gleichartige Elemente sind gleich groß.
     Ausgenommen sind die Listenzeilen von Content und die Werkzeugleiste —
     dort stehen mehrere Knöpfe nebeneinander und dürfen umbrechen. */
  .srow:not(.crow):not(.werkzeuge)>.ctl{min-width:188px;justify-content:flex-end}
  .srow:not(.crow):not(.werkzeuge)>.ctl>.btn{min-width:108px;text-align:center;
     justify-content:center}
  .srow:not(.crow)>.ctl>input.txt{width:188px;max-width:188px}
  /* Der Haken zum Mehrfachwaehlen im Notenbestand. Groesser als der im
     Dialog: Hier zielt ein Finger darauf, kein Mauszeiger. */
  .srow .hkbox{all:unset;width:20px;height:20px;flex:none;border-radius:var(--r-5);
     border:1px solid var(--check-line);display:flex;align-items:center;justify-content:center;
     cursor:pointer;color:var(--white)}
  .srow .hkbox .i{width:13px;height:13px;opacity:0}
  .srow[aria-checked=true] .hkbox{background:var(--accent);border-color:var(--accent)}
  .srow[aria-checked=true] .hkbox .i{opacity:1}
  /* Die Zielflaeche fuer hineingezogene Ordner. Sie meldet sich nur, solange
     etwas darueber schwebt — ein dauerhafter Rahmen waere blosser Zierrat. */
  [data-zielflaeche][data-zieh]{outline:2px dashed var(--accent-edge);outline-offset:-6px;
     border-radius:var(--r-13);background:var(--accent-wash)}
  /* Warnende Knoepfe gab es bisher nur in einer Setup-Zeile. Seit „Setlist
     löschen" am Ende der Liste steht, wird die Auszeichnung allgemein
     gebraucht. */
  .btn.warn{color:var(--danger-ink);border-color:var(--danger-line)}
  .srow input.txt{min-height:36px;padding:7px 11px;font-size:13px;width:180px}
  /* Der Fortschritt beim Import. Er lag bis zum 31. Juli nur als Text auf dem
     Knopf und wurde uebersehen. */
  .fortschritt{position:relative;height:30px;margin:2px 0 10px;border-radius:var(--r-9);
     background:var(--bg-panel);border:1px solid var(--border);overflow:hidden}
  .fortschritt i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent-wash-strong);
     border-right:2px solid var(--accent-bright);transition:width .18s linear}
  .fortschritt span{position:absolute;inset:0;display:flex;align-items:center;
     justify-content:center;font:600 12.5px/1 var(--font-sans);color:var(--text-body)}
  .sw{width:44px;height:26px;border-radius:var(--r-pill);background:var(--switch-off);position:relative;
     cursor:pointer;transition:background var(--motion-fast);flex:none;border:none}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
     background:var(--switch-knob);transition:transform var(--motion-fast),background var(--motion-fast)}
  .sw[data-on=true]{background:var(--accent)}
  .sw[data-on=true]::after{transform:translateX(18px);background:var(--white)}
  .sw:disabled{opacity:.45;cursor:default}
  /* Die Zeile der Voice-Liste: Griff zum Ziehen, Formular zum Aendern. */
  .srow.gewaehlt{background:var(--accent-wash)}
  .igriff{width:22px;flex:none;display:flex;align-items:center;justify-content:center;
     color:var(--text-dim);cursor:grab;touch-action:none;margin-left:-4px}
  .igriff:active{cursor:grabbing}
  .igriff .i{width:15px;height:15px}
  .srow.zieht{opacity:.85;background:var(--bg-panel-sel);box-shadow:var(--shadow-drag)}
  .srow.warnrow .sb{color:var(--danger-ink)}
  .instrform{align-items:flex-start}
  .ifelder{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .ifeld{width:100%;box-sizing:border-box;min-height:36px;padding:8px 11px;
     border-radius:var(--r-9);border:1px solid var(--border);background:var(--bg-app);
     color:var(--text);font:600 14px/1.2 var(--font-sans)}
  .ifelder .seg2{align-self:flex-start}
  .iwarn:empty{display:none}
  .iwarn{color:var(--danger-ink)}
  .seg2{display:flex;background:var(--bg-app);border:1px solid var(--border);border-radius:var(--r-9);
     padding:3px;gap:3px;flex-wrap:wrap}
  .seg2 button{all:unset;padding:6px 10px;border-radius:var(--r-6);color:var(--text-muted);
     font:600 12px/1 var(--font-sans);cursor:pointer}
  .seg2 button[aria-pressed=true]{background:var(--accent);color:var(--white)}
  /* Fortschritt beim Vorabspeichern. 6.231 Dateien dauern lange genug, dass
     eine reine Zahl nicht reicht — ohne Balken wirkt die App eingefroren. */
  .sbar{margin-top:8px;height:6px;max-width:380px;border-radius:var(--r-pill);
     background:var(--switch-off);overflow:hidden;display:none}
  .sbar.an{display:block}
  .sbar i{display:block;height:100%;width:0;border-radius:var(--r-pill);
     background:var(--accent);transition:width var(--motion-fast)}
  .stat{font:500 12.5px/1.5 var(--font-sans);color:var(--text-muted)}
  .stat b{color:var(--dock-ink);font-weight:700}
  /* Der Kasten des Dropbox-Abgleichs kommt aus dem Abgleich-Baustein und
     bringt seine eigenen Abstaende mit; in der Karte stoeren sie. */
  .srow #rbSyncBox{border-top:0!important;padding-top:0!important;margin-top:0!important;width:100%}

  /* Die fuenf Zeilen-Stile des Entwurfs. B ist die Vorgabe. */
  body[data-rs=a] li.tune{border-radius:0;border:0;border-bottom:1px solid var(--line-hair);
     margin:0;padding:11px 8px;background:none}
  body[data-rs=c] li.tune{background:none;border-color:var(--line-hair2);margin:5px 0}
  body[data-rs=d] li.tune{background:none;margin:0;padding:13px 10px 15px}
  body[data-rs=e] li.tune{border-radius:var(--r-4) var(--r-11) var(--r-11) var(--r-4);
     border-left:3px solid var(--row-edge);padding-left:11px}
  body[data-rs=e] li.tune[aria-selected=true]{border-left-color:var(--accent-bright);box-shadow:none}
  body[data-tagline=grey] .pill{border-color:var(--badge-bg-soft);background:var(--pill-fill-grey)}

  /* Im Vollbild bleibt die Werkzeugleiste, alles andere blendet aus (Handoff).
     Das Dock traegt Vollbild und Blaettern selbst. */
  .viewer.fullscreen .fsclose,.viewer.fullscreen .fsnav{display:none}

  /* ================================================================
     Schritt 10 — Stimmen, Audio, Metadaten.

     Diese Regeln kamen bis heute aus dem Stimmen-Baustein selbst: Der
     spielte sein CSS zur Laufzeit ein und trug dabei einunddreissig
     Farbwerte im Klartext. Die Pruefung auf Rohwerte sah sie nie, weil
     sie nicht in diesem Block standen. Jetzt stehen sie hier, und die
     Werte kommen aus dem :root-Block wie ueberall sonst.
     ================================================================ */

  /* --- Der Stimmen-Schalter auf dem Blatt (Schritt 4 des Stimmen-Konzepts) ---

     Er loest die Leiste am oberen Buehnenrand ab. Die nahm dem Blatt
     siebenundvierzig Pixel, dauerhaft und bei jedem Stueck mit Stimmen; der
     Schalter schwebt und kostet keine Flaeche.

     Oben rechts, nach Jens' Wahl. Das Dock steht an der Oberkante waagerecht
     mittig und an der rechten Kante senkrecht mittig — die beiden stossen
     dort also nicht zusammen.

     Er kommt und geht mit dem Dock, ueber dasselbe Merkmal am body. Nach vier
     Sekunden ohne Beruehrung ist das Blatt voellig frei. */
  #stimmSchalter{position:absolute;z-index:21;display:none;align-items:center;gap:1px;
     top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
     padding:3px;border-radius:var(--r-pill);
     background:var(--dock-bg);border:1px solid var(--dock-line);
     box-shadow:var(--shadow-dock);opacity:.74;touch-action:none;
     transition:opacity var(--motion-fast)}
  .viewer.open #stimmSchalter{display:flex}
  body[data-dockfold=an][data-dock=zu] .viewer.open #stimmSchalter{display:none}
  /* Laeuft Ton mit, faerbt sich der Rand. Sonst ist auf dem Blatt nicht zu
     sehen, dass daneben etwas spielt. */
  #stimmSchalter.tont{border-color:var(--audio-line);opacity:.88}
  #stimmSchalter .sp{all:unset;width:30px;height:30px;flex:none;border-radius:50%;
     display:flex;align-items:center;justify-content:center;color:var(--dock-ink);cursor:pointer}
  #stimmSchalter .sp .i{width:15px;height:15px}
  #stimmSchalter .sp[disabled]{opacity:.22;cursor:default}
  #stimmSchalter .sname{min-width:46px;padding:0 3px;text-align:center;
     font:800 13.5px/1 var(--font-sans);letter-spacing:-.01em;color:var(--dock-ink);
     white-space:nowrap;cursor:pointer;-webkit-user-select:none;user-select:none}
  /* Falle 1 des Arbeitsstands: Hover klebt auf dem iPad. */
  @media (hover:hover){ #stimmSchalter:hover{opacity:1} }

  /* Das Menue des Schalters — in der Sprache der Dialoge, nur kleiner. Es
     haengt in der Buehne, damit es im Querformat nicht ueber der Liste steht,
     und sitzt unter dem Schalter. */
  #voiceMenu{position:absolute;z-index:40;min-width:210px;max-height:70%;overflow-y:auto;padding:5px;
     top:calc(56px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
     background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-13);
     box-shadow:var(--shadow-dlg);display:none}
  #voiceMenu.open{display:block}
  #voiceMenu button{all:unset;display:flex;align-items:center;gap:9px;width:100%;
     box-sizing:border-box;padding:10px 12px;border-radius:var(--r-9);
     font:600 14.5px/1.2 var(--font-sans);color:var(--text-body);cursor:pointer}
  #voiceMenu button .i{width:16px;height:16px}
  #voiceMenu button.an{background:var(--accent-wash);color:var(--accent-bright)}
  #voiceMenu button.ton.an{background:var(--audio-wash);color:var(--audio)}
  #voiceMenu button.warn{color:var(--danger-ink)}
  #voiceMenu .seite{margin-left:auto;font-weight:500;color:var(--text-dim);font-size:13px}
  #voiceMenu .mtren{height:1px;background:var(--line);margin:5px 8px}

  /* --- Die Kuerzel in der Listenzeile ---
     Sie stehen vor den Tag-Pillen: Sie sagen etwas ueber das Stueck aus,
     die Tags sind Zuordnung. Ruhiger als die Pillen, damit die Zeile
     nicht flimmert. */
  /* --- Die Stimmen eines Stuecks in der Metazeile (Schritt 3) ---
     Ruhiger als die Tag-Pillen, denn sie stehen in jeder Zeile eines
     Real-Book-Stuecks. Die Stimme, die aufgeht, ist ausgezeichnet. */
  /* Die eigene, unterste Zeile der Listenzeile. Sie bricht um, wenn viele
     Stimmen zusammenkommen, faengt aber immer an derselben Stelle an. */
  .stimmzeile{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px}
  /* `.stimmen` hielt alle Schalter in EINER nicht umbrechenden Reihe. Die
     umgebende Zeile durfte zwar umbrechen, konnte diese eine Reihe aber nicht
     teilen — also wurde sie gestaucht, und der Text brach INNERHALB der
     Schalter um: „Not Assigned" stand drei Zeilen hoch. Aufgefallen, seit die
     Setlisten-Zeile durch die vier Symbole schmaler geworden ist.

     Dieselbe Regel wie bei den Tags: Ein Schalter bricht nie in sich um, die
     Reihe bricht statt seiner. Am 2. August von Jens verlangt. */
  .stimmen{display:inline-flex;flex-wrap:wrap;gap:4px;margin:0;min-width:0;vertical-align:middle}
  .stimme{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;
     font:700 11px/1.45 var(--font-sans);padding:1px 7px;border-radius:var(--r-6);
     color:var(--text-dim);border:1px solid var(--voice-chip-line);background:var(--voice-chip)}
  .stimme.an{color:var(--accent-bright);border-color:var(--pill-line);background:var(--accent-wash)}

  .vbadges{display:inline-flex;gap:4px;margin-left:0;vertical-align:middle}
  .vbadge{font:700 11px/1.45 var(--font-sans);padding:1px 6px;border-radius:var(--r-6);
     background:var(--voice-chip);color:var(--book);border:1px solid var(--voice-chip-line)}
  .vbadge.aud{color:var(--audio);border-color:var(--audio-line);background:var(--audio-wash)}

  /* --- Der Player am unteren Buehnenrand ---
     Er schwebt wie das Dock, liegt aber nur ueber der Buehne. Seine Hoehe
     geht in docPads() ein, damit das Blatt nie darunter laeuft. */
  #voiceAudio{position:absolute;left:12px;right:12px;z-index:22;
     bottom:calc(12px + env(safe-area-inset-bottom));
     background:var(--player-bg);border:1px solid var(--dock-line);border-radius:var(--r-15);
     box-shadow:var(--shadow-dock);padding:7px 8px 7px 12px;
     display:none;align-items:center;gap:10px}
  #voiceAudio.open{display:flex}
  #voiceAudio .vaname{color:var(--audio);font:650 13px/1.2 var(--font-sans);flex:0 0 auto;
     max-width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #voiceAudio audio{flex:1;min-width:0;height:36px}
  #voiceAudio .vax{all:unset;flex:0 0 auto;width:32px;height:32px;border-radius:var(--r-9);
     color:var(--text-muted);cursor:pointer;font-size:17px;
     display:flex;align-items:center;justify-content:center}

  /* --- Die Verwaltung im Metadaten-Blatt --- */
  .partsSec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
  .partsSec .prow{display:flex;align-items:center;gap:8px;padding:7px 0;
     border-bottom:1px solid var(--line-row)}
  .partsSec .prow:last-child{border-bottom:0}
  .partsSec .pkind{flex:0 0 auto;color:var(--text-muted);font-size:15px}
  .partsSec .prole-sel{flex:0 0 auto}
  .partsSec .pfile{color:var(--text-dim);font-size:13px;flex:1;min-width:0;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .partsSec .pdetach,.partsSec .pdel{all:unset;flex:0 0 auto;width:32px;height:32px;
     border-radius:var(--r-9);cursor:pointer;font-size:15px;
     display:flex;align-items:center;justify-content:center}
  .partsSec .pdetach{color:var(--accent-bright)}
  .partsSec .pdel{color:var(--danger)}
  .partsSec select,.partsSec .btn{font-size:14px}
  .vlade{color:var(--text-body);margin:auto}
  .vfehler{color:var(--danger-ink);margin:auto;padding:24px;text-align:center}

  /* Versteckte Datei-Eingabefelder. NICHT `display:none`: Safari auf dem iPad
     oeffnet den Dateien-Dialog fuer ein so verstecktes Feld nicht zuverlaessig,
     und zwar ohne jede Meldung. Aus dem Bild geschoben wird es gefunden und
     angeklickt wie jedes andere. */
  .dateifeld{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

  /* Der Brotkrumenpfad in der Kopfzeile des Setups. Er sagt, wo man ist; die
     anklickbaren Teile führen zurück. */
  /* Die Zeilen im Content tragen mehr Steuerung als eine normale Setup-Zeile:
     Haken, Namensfeld, Stimmen-Wahl, Vorschau. Wird die Flaeche schmal, muessen
     sie umbrechen duerfen — sonst quetscht `.ctl` das Namensfeld auf null, und
     der Untertitel bricht Wort fuer Wort. Auf dem iPad im Querformat passt
     alles in eine Zeile; auf dem iPhone nicht. */
  .srow.crow{flex-wrap:wrap;gap:10px 12px}
  .srow.crow>:first-child{flex:1 1 240px;min-width:0}
  .srow.crow .ctl{flex-wrap:wrap;margin-left:auto}
  .srow.crow .txt{min-width:120px}

  .krume{white-space:nowrap}
  .krumeTr{opacity:.45;margin:0 .45em;font-weight:400}
  .krume.klick{cursor:pointer;color:var(--text-muted)}
  @media (hover:hover){ .krume.klick:hover{color:var(--accent-bright)} }

  /* Die Zeile traegt seit Schritt 7 in beiden Ausrichtungen dieselben Masse —
     sie sind fuer die schmale Spalte des Querformats entworfen. Nur die
     Auswahl-Box wird dort kleiner. */
  body[data-o=land] li.tune .selbox{width:22px;height:22px;min-width:22px;font-size:13px}

<script src="vendor/pdfjs/pdf.min.js"></script>

<script src="data.js"></script>
<script>
const PALETTE=['#e0662b','#2b7de0','#57c98b','#c94ad1','#e0b93a','#4ab5c9','#e0506b','#8b7de0','#7bc043','#d98cae'];
const S = {
  view:'all', q:'', initial:'', books:new Set(), comp:'', tagFilter:new Set(),
  fav:new Set(JSON.parse(localStorage.getItem('rb_fav')||'[]')),
  prac:new Set(JSON.parse(localStorage.getItem('rb_prac')||'[]')),
  sets:JSON.parse(localStorage.getItem('rb_sets')||'[]'),
  tags:JSON.parse(localStorage.getItem('rb_tags')||'[]'),          // [{id,name,color,pinned}]
  tuneTags:JSON.parse(localStorage.getItem('rb_tunetags')||'{}'),  // key -> [tagId]
  recent:JSON.parse(localStorage.getItem('rb_recent')||'{}'),      // key -> timestamp zuletzt gespielt
  recentSort:{by:'date',dir:'desc'},
  selection:new Set(),   // Mehrfachauswahl (nur Sitzung)
  _sig:'',
  sonstOn: localStorage.getItem('rb_sonston')!=='0',  // „Sonstiges Material" einbeziehen (Default an)
  openSet:null,
  booksOpen: localStorage.getItem('rb_booksopen')==='1',
  azOpen: localStorage.getItem('rb_azopen')==='1',
};
/* Standard-Buchauswahl: beim Öffnen der App wird diese Auswahl vorausgewählt. */
const DEFAULT_BOOKS = JSON.parse(localStorage.getItem('rb_defaultbooks')||'[]');
S.books = new Set(DEFAULT_BOOKS);
function setDefaultBooks(){ const arr=[...S.books]; localStorage.setItem('rb_defaultbooks', JSON.stringify(arr));
  DEFAULT_BOOKS.length=0; DEFAULT_BOOKS.push(...arr); render(); }
function clearDefaultBooks(){ localStorage.removeItem('rb_defaultbooks'); DEFAULT_BOOKS.length=0; render(); }
function booksAreDefault(){ if(DEFAULT_BOOKS.length!==S.books.size) return false; return DEFAULT_BOOKS.every(b=>S.books.has(b)); }
/* Metadaten-Korrektur der Großsammlung: Overrides je Stück (Titel/Komponist), PDFs bleiben unberührt.
   Schlüssel = ursprüngliche Identität (bid|Originaltitel|Seite), damit er auch nach Umbenennen stabil bleibt. */
const OVERRIDES = JSON.parse(localStorage.getItem('rb_overrides')||'{}');
function saveOverrides(){ localStorage.setItem('rb_overrides', JSON.stringify(OVERRIDES)); }
const TUNES = window.TUNES.map((t,i)=>{
  const key=t.bid+'|'+t.t+'|'+t.pg; const o=OVERRIDES[key];
  const base={...t, key, idx:i, _ot:t.t, _oc:t.c||''};
  if(o){ if(typeof o.t==='string' && o.t) base.t=o.t; if(typeof o.c==='string') base.c=o.c; }
  return base;
});

/* ================================================================
   Schritt 2 des Stimmen-Konzepts — die Gruppierung.

   Vier der siebzehn Buecher sind keine eigenen Buecher, sondern
   transponierte Ausgaben desselben Buchs. Die Buch-Kennung traegt die
   Ausgabe im Namen: realbook1_bb ist die B-Ausgabe von realbook1.
   Daraus laesst sich berechnen, welche Blaetter zu einem Stueck gehoeren.

   GERECHNET, NICHT GESPEICHERT. Es entsteht kein neuer Schluessel, kein
   Feld wandert, data.js bleibt unberuehrt. Wird die Regel geaendert,
   aendert sich die Anzeige und sonst nichts. Genau darum ist dieser
   Schritt vor Schritt 9 moeglich, obwohl er tief zu greifen scheint.

   Diese Fassung rechnet nur — sichtbar wird davon noch nichts.
   ================================================================ */
const STIMM_SUFFIX = { '_bb':'B♭', '_eb':'E♭', '_bass':'Bass' };
const STIMM_ORDNUNG = ['C','B♭','E♭','Bass'];

/* Aus einer Buch-Kennung Familie und Stimme lesen. Ohne Suffix ist es die
   C-Ausgabe; sie ist zugleich die Leitstimme der Familie. */
function buchZerlegen(bid){
  for(const suf in STIMM_SUFFIX){
    if(bid.endsWith(suf)) return { fam: bid.slice(0, -suf.length), stimme: STIMM_SUFFIX[suf] };
  }
  return { fam: bid, stimme: 'C' };
}

/* Der Titel ist das einzige Merkmal, das die Ausgaben verbindet. Die
   Seitenzahl taugt nicht: Die E-Ausgabe ist anders paginiert, in 337
   Faellen weichen die Zahlen voneinander ab.

   Verglichen wird der URSPRUENGLICHE Titel, nicht der korrigierte. Sonst
   zerrisse eine Korrektur an einer einzelnen Ausgabe die Gruppe, und das
   waere von aussen nicht zu erklaeren. */
const titelSchluessel = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

/* Eine Familie zaehlt nur, wenn von ihr wirklich mehrere Ausgaben in der
   Sammlung liegen. Ein Buch ohne Geschwister bleibt ein Buch, und seine
   Stuecke tragen keine Stimme. Eigene Buecher fallen damit von selbst
   heraus. */
const FAMILIEN = (()=>{
  const m={};
  TUNES.forEach(t=>{ const z=buchZerlegen(t.bid); (m[z.fam]=m[z.fam]||new Set()).add(z.stimme); });
  Object.keys(m).forEach(f=>{ if(m[f].size<2) delete m[f]; });
  return m;
})();

TUNES.forEach(t=>{
  const z=buchZerlegen(t.bid);
  if(!FAMILIEN[z.fam]){ t.gid=t.key; t.stimme=''; t.fam=''; return; }
  t.fam=z.fam; t.stimme=z.stimme;
  t.gid=z.fam+'|'+titelSchluessel(t._ot);
});

const GRUPPEN = (()=>{
  const g={};
  TUNES.forEach(t=>{ (g[t.gid]=g[t.gid]||[]).push(t); });
  Object.values(g).forEach(a=>a.sort((x,y)=>
    STIMM_ORDNUNG.indexOf(x.stimme)-STIMM_ORDNUNG.indexOf(y.stimme)));
  return g;
})();
window.GRUPPEN = GRUPPEN;

/* Die Leitstimme einer Gruppe. Auf sie werden spaeter Favoriten, Tags und
   die Uebungsliste geschrieben, damit v3 sie am C-Blatt weiter findet. */
function leitstimme(gid){
  const a=GRUPPEN[gid]; if(!a||!a.length) return null;
  return a.find(t=>t.stimme==='C') || a[0];
}
window.leitstimme = leitstimme;

/* ---- Schritt 3: was der Gruppe gehoert und was dem Blatt ----

   Favorit, Ueben und Tags gelten dem STUECK, nicht dem einzelnen Blatt.
   Angezeigt werden sie, sobald irgendeine Stimme sie traegt. Geschrieben
   werden sie auf die Leitstimme, also die C-Ausgabe. So bleibt der
   Datenbestand unveraendert, und v3 findet die Marke am C-Blatt wieder.

   Bewusst wird dabei die GANZE Gruppe gefragt, nicht nur die gerade
   sichtbaren Stimmen: Der Stern gehoert dem Stueck, auch wenn die
   Buchauswahl die markierte Ausgabe gerade ausblendet. */
function gruppenBlaetter(t){ return (t && t.fam && GRUPPEN[t.gid]) ? GRUPPEN[t.gid] : [t]; }
function gruppeHat(menge, t){ return gruppenBlaetter(t).some(x=>menge.has(x.key)); }
function gruppeTagIds(t){
  if(!t || !t.fam) return tuneTagIds(t.key);
  const s=new Set(); gruppenBlaetter(t).forEach(x=>tuneTagIds(x.key).forEach(id=>s.add(id)));
  return [...s];
}
/* Wohin eine Marke geschrieben wird. */
function schreibBlatt(t){ return (t && t.fam) ? (leitstimme(t.gid)||t) : t; }

/* Die Zeile des aktiven Stuecks — gesucht ueber die Gruppe, nicht ueber den
   Schluessel. Liegt die E-Ausgabe auf der Buehne, traegt die Zeile trotzdem
   den Schluessel der C-Ausgabe. */
window.aktiveZeile = function(){
  const k=window.aktivesStueck; if(!k) return null;
  const t=(typeof byKey!=='undefined') ? byKey[k] : null;
  const gid=(t && t.gid) ? t.gid : k;
  return document.querySelector('li.tune[data-gid="'+cssEsc(gid)+'"]');
};

/* Welche Stimme aufgeht, wenn mehrere zur Wahl stehen. Bis die
   Instrumentenliste steht (Schritt 5), gilt die letzte Stufe der Kette aus
   dem Konzept: erst C, sonst die erste vorhandene. Das Instrument haengt
   sich spaeter an genau dieser Stelle ein — es gibt nur diese eine. */
/* ================================================================
   Die Instrumentenliste — Schritt 5 des Stimmen-Konzepts

   Sie ist der einzige Ort, an dem etwas eingestellt wird. Jeder Eintrag
   traegt drei Angaben: den Namen, die Notation und die gaengigen
   Abkuerzungen. Die Abkuerzungen sind kein Zierrat: Eine Datei heisst
   selten „Blue Bossa - Trompete.pdf", sondern „Blue Bossa - tp.pdf".
   Gebraucht werden sie erst beim Import eines Bandbuchs (Schritt 6);
   gepflegt werden sie hier.

   Schlagzeug und Percussion tragen keine Notation. Sie kommen in
   transponierten Ausgaben nicht vor, nur in Bandbuechern, und dort
   entscheidet allein der Name.

   Zwei eigene Speicher, beide neu — v3 liest sie nicht und verliert
   dadurch nichts.
   ================================================================ */
const INSTR_KEY='rb_instrumente', INSTR_WAHL_KEY='rb_instrument';
const NOTATIONEN=['C','B♭','E♭','Bass',''];
/* Jeder Eintrag traegt den deutschen und den englischen Namen. Der englische
   ist nicht Zierrat: Arrangeure benennen ihre Dateien meist englisch, und
   „Blue Bossa - Guitar.pdf" soll beim Import (Schritt 6) ebenso erkannt werden
   wie „- Git.pdf". Gesucht wird darum nach beiden Namen und nach den
   Abkuerzungen.

   Die Reihenfolge ist alphabetisch nach dem deutschen Namen; sie laesst sich
   im Setup durch Ziehen aendern. */
/* Die Abkuerzungen sind am 29. Juli am echten Bestand `Blauton` vermessen
   worden — 460 PDFs, 56 Stuecke. Ohne die hier ergaenzten Woerter erkennt die
   Liste 73 Prozent, mit ihnen 97,6. Jedes Wort steht fuer gezaehlte Faelle,
   keines ist geraten:
     Tenor (30) · Trpt (15) · Vocal, Chor (5) · Drm, Drms, Drum (5) ·
     Alto, Altsax (4) · Keyboard, Keyb (2) · Sopran (3) · Xylo (1) ·
     Bassklarinette (1) · Lead, Back (2)
   Wer hier etwas streicht, senkt die Erkennung messbar. */
const INSTR_VORGABE=[
  {id:'akk',  name:'Akkordeon',    en:'Accordion',    notation:'C',    kurz:['Akk','Acc']},
  {id:'as',   name:'Alt-Sax',      en:'Alto Sax',     notation:'E♭',   kurz:['As','Alt','ASax','Alto','Altsax']},
  {id:'bari', name:'Bariton-Sax',  en:'Baritone Sax', notation:'E♭',   kurz:['Bari','Bar','BSax']},
  {id:'vc',   name:'Cello',        en:'Cello',        notation:'Bass', kurz:['Vc']},
  {id:'bs',   name:'E-Bass',       en:'Bass Guitar',  notation:'Bass', kurz:['Bass','Bs','b']},
  {id:'fl',   name:'Flöte',        en:'Flute',        notation:'C',    kurz:['Fl','Flt']},
  {id:'flh',  name:'Flügelhorn',   en:'Flugelhorn',   notation:'B♭',   kurz:['Flh','Flg']},
  {id:'ges',  name:'Gesang',       en:'Vocals',       notation:'C',    kurz:['Voc','Vox','Ges','Vocal','Chor','Choir','Lead','Back','Backing']},
  {id:'git',  name:'Gitarre',      en:'Guitar',       notation:'C',    kurz:['Git','Gtr','Gt','g']},
  {id:'cl',   name:'Klarinette',   en:'Clarinet',     notation:'B♭',   kurz:['Cl','Klar','Kl','Bassklarinette','Bass Clarinet']},
  {id:'pno',  name:'Klavier',      en:'Piano',        notation:'C',    kurz:['Pno','Key','Klav','p','Keyboard','Keyb','Keys']},
  {id:'kb',   name:'Kontrabass',   en:'Double Bass',  notation:'Bass', kurz:['Kb','Cb']},
  {id:'perc', name:'Percussion',   en:'Percussion',   notation:'',     kurz:['Perc','Pc','Xylo','Xylophon','Xylophone']},
  {id:'pos',  name:'Posaune',      en:'Trombone',     notation:'Bass', kurz:['Pos','Tbn','Trb']},
  {id:'dr',   name:'Schlagzeug',   en:'Drums',        notation:'',     kurz:['Dr','Drs','Schlz','Drm','Drms','Drum']},
  {id:'ss',   name:'Sopran-Sax',   en:'Soprano Sax',  notation:'B♭',   kurz:['Ss','Sop','SSax','Sopran']},
  {id:'ts',   name:'Tenor-Sax',    en:'Tenor Sax',    notation:'B♭',   kurz:['Ts','Ten','TSax','Tenor','Tenorsax']},
  {id:'tp',   name:'Trompete',     en:'Trumpet',      notation:'B♭',   kurz:['Tp','Tpt','Trp','Trpt']},
  {id:'tba',  name:'Tuba',         en:'Tuba',         notation:'Bass', kurz:['Tba']},
  {id:'vln',  name:'Violine',      en:'Violin',       notation:'C',    kurz:['Vln','Vl']},
];
/* Die Marke sagt, welcher Wortschatz zuletzt nachgetragen wurde. Sie ist
   noetig, weil eine einmal gespeicherte Liste die Vorgabe verdraengt: Wer die
   Voices schon sortiert hat, bekaeme neue Abkuerzungen sonst nie zu sehen. */
const INSTR_WORTSCHATZ = 2;
const INSTR_WORT_KEY = 'rb_instrumente_wortschatz';
/* Fuer den Vergleich: Gross- und Kleinschreibung sind gleich, Umlaute und
   Bindestriche zaehlen nicht. „Alt-Sax" und „altsax" sind dasselbe. */
function instrNorm(s){ return (s||'').toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }

const INSTR_FRISCH = () => INSTR_VORGABE.map(x=>({...x, kurz:x.kurz.slice()}));
let INSTRUMENTE = (function(){
  try{ const a=JSON.parse(localStorage.getItem(INSTR_KEY)||'null');
    if(Array.isArray(a) && a.length) return a.map(x=>{
      /* Ein Stand von vor dem 28. Juli kennt das englische Feld noch nicht.
         Was zu einer Vorgabe gehoert, bekommt es nachgereicht. */
      const v=INSTR_VORGABE.find(y=>y.id===String(x.id||''));
      return { id:String(x.id||''), name:String(x.name||''),
               en: x.en!==undefined ? String(x.en) : (v ? v.en : ''),
               notation:NOTATIONEN.includes(x.notation)?x.notation:'',
               kurz:Array.isArray(x.kurz)?x.kurz.map(String):[] };
    }).filter(x=>x.id && x.name);
  }catch(e){}
  return INSTR_FRISCH();
})();
/* Neue Abkuerzungen nachtragen — einmalig, und nur was fehlt.
   Eigene Eintraege und eine von Hand gesetzte Reihenfolge bleiben unberuehrt;
   was Jens selbst geloescht hat, kaeme allerdings einmal zurueck. Das ist der
   Preis dafuer, dass der gemessene Wortschatz ueberhaupt ankommt. */
(function wortschatzNachtragen(){
  let stand=0; try{ stand=parseInt(localStorage.getItem(INSTR_WORT_KEY)||'0',10)||0; }catch(e){}
  if(stand>=INSTR_WORTSCHATZ) return;
  INSTR_VORGABE.forEach(v=>{
    const i=INSTRUMENTE.find(x=>x.id===v.id); if(!i) return;
    const da=new Set(i.kurz.map(instrNorm));
    v.kurz.forEach(k=>{ if(!da.has(instrNorm(k))){ i.kurz.push(k); da.add(instrNorm(k)); } });
  });
  try{ localStorage.setItem(INSTR_KEY, JSON.stringify(INSTRUMENTE));
       localStorage.setItem(INSTR_WORT_KEY, String(INSTR_WORTSCHATZ)); }catch(e){}
})();
/* Alphabetisch nach dem deutschen Namen — die Vorgabe und der Weg zurueck,
   wenn die Reihenfolge von Hand durcheinandergeraten ist. */
function instrumenteAlphabetisch(){
  INSTRUMENTE.sort((a,b)=>a.name.localeCompare(b.name,'de'));
  instrumenteSichern();
}
window.instrumenteAlphabetisch = instrumenteAlphabetisch;
let INSTR_WAHL = localStorage.getItem(INSTR_WAHL_KEY) || '';
function instrumenteSichern(){
  try{ localStorage.setItem(INSTR_KEY, JSON.stringify(INSTRUMENTE)); }catch(e){}
}
function meinInstrument(){ return INSTRUMENTE.find(i=>i.id===INSTR_WAHL) || null; }
window.meinInstrument = meinInstrument;
/* Ein Wechsel des Instruments aendert, welche Ausgabe aufgeht — die Liste
   muss also neu gezeichnet werden. */
function instrumentWaehlen(id){
  INSTR_WAHL = id||'';
  try{ localStorage.setItem(INSTR_WAHL_KEY, INSTR_WAHL); }catch(e){}
  if(window.instrumentMarkeAuffrischen) window.instrumentMarkeAuffrischen();
  if(typeof render==='function') render();
}
window.instrumentWaehlen = instrumentWaehlen;
/* Wer eigene Abkuerzungen eintraegt, kann das Gleichgewicht stoeren: „Tb"
   steht im Deutschen fuer Tuba und im Englischen fuer Trombone. Darum prueft
   das Setup beim Sichern, ob zwei Instrumente dieselbe beanspruchen. */
function kuerzelKonflikte(liste){
  const gesehen=new Map(), streit=[];
  /* Geprueft werden Abkuerzungen UND der englische Name — beide dienen beim
     Import demselben Zweck und koennen sich darum gegenseitig in die Quere
     kommen. */
  (liste||INSTRUMENTE).forEach(i=>[...i.kurz, i.en||''].forEach(k=>{
    const n=instrNorm(k); if(!n) return;
    if(gesehen.has(n) && gesehen.get(n)!==i.name) streit.push({kurz:k, a:gesehen.get(n), b:i.name});
    else gesehen.set(n, i.name);
  }));
  return streit;
}
window.kuerzelKonflikte = kuerzelKonflikte;

/* Welche Stimme aufgeht. Die Rangfolge wird nicht gepflegt, sondern
   gerechnet — aus dem Instrument in drei Stufen:

   1. eine Stimme, die so heisst wie das Instrument. Das trifft im Bandbuch
      zu, wo eine Stimme „Trompete" heisst.
   2. eine Stimme in der Notation des Instruments. Das trifft in den Real
      Books zu, wo die B-Ausgabe die richtige ist.
   3. die C-Ausgabe, und gibt es die nicht, die erste vorhandene.

   Ist kein Instrument gewaehlt, gilt Stufe 3 allein — also genau das
   Verhalten von vorher. Es aendert sich nichts, bis Jens waehlt. */
/* Der Stimmen-Wunsch: die Wahl, die die Rangfolge fuer den Augenblick
   ueberstimmt. Gesetzt wird er nur durch eine ausdrueckliche Wahl — den
   Schalter auf dem Blatt oder einen Tipp auf eine Stimme in der Listenzeile.
   Wer ein Stueck ueber seine Zeile oeffnet, waehlt ein Stueck und keine
   Stimme; dann faellt der Wunsch weg und es gilt wieder das Instrument.

   Er wird nirgends gespeichert und verfaellt damit beim naechsten Start —
   genau wie es das Konzept verlangt. */
let STIMMWUNSCH='';
window.stimmWunsch = s => { STIMMWUNSCH = s||''; };

/* ================================================================
   Schritt 6 — ein Bandbuch lesen

   Die Annahme des Konzepts, hier ausdruecklich: Ein Notensatz traegt im
   Namen einen Hinweis auf das Instrument, fuer das er geschrieben ist.
   Alles andere ist unsauber gearbeitet und wird nicht unterstuetzt. Die
   App raet nicht — was sie nicht erkennt, legt sie dem Nutzer vor.
   ================================================================ */
/* Alle Bewerber aus einem Stueck Text: jede zusammenhaengende Wortfolge, dazu
   jedes einzelne Wort ohne seine angehaengte Zahl. Jeder Bewerber merkt sich,
   am wievielten Wort er beginnt — daran haengt die Vorrangregel unten.

   Die Zahlregel ist am Bestand gemessen: „Alt1" und „Alt2" schreibt Jens ohne
   Leerzeichen, „Bass2" ebenso. Ohne sie blieben diese Dateien liegen. */
function wortfolgen(text){
  const roh=String(text||'').split(/[^0-9A-Za-zÄÖÜäöüß]+/).filter(Boolean);
  const aus=[];
  for(let n=roh.length;n>=1;n--)
    for(let i=0;i+n<=roh.length;i++) aus.push({i, s:instrNorm(roh.slice(i,i+n).join(''))});
  roh.forEach((w,i)=>{ const m=/^(.*?[A-Za-zÄÖÜäöüß])(\d{1,2})$/.exec(w);
    if(m) aus.push({i, s:instrNorm(m[1]), nr:m[2]}); });
  return aus;
}

/* Blaetter, die zum Stueck gehoeren, aber keine Instrumentenstimme sind.
   Am Bestand vermessen: 35 der 460 Dateien. Sie werden VOR dem Instrument
   geprueft, sonst risse „Lead" aus „Lead Sheet" die Datei zum Gesang.

   „Soloform" steht bewusst nicht hier: Jens' Dateien heissen „Soloform Alt 1"
   und „Soloform Floete" — das sind Instrumentenstimmen mit einem Zusatz, kein
   Ablauf. */
const BLATTARTEN=[
  {art:'Leadsheet', w:['leadsheet','leadsh','sheet']},
  {art:'Lyrics',    w:['lyrics','text','songtext','chords','akkorde']},
  {art:'Ablauf',    w:['ablauf','setliste','setlist']},
  /* „Misc." nimmt auf, was gar keine Stimme ist, aber mitgehen soll — die
     Telefonnummer fuer den Auftritt, ein Hinweiszettel, ein Foto von der
     Tafel. Am 31. Juli von Jens verlangt. */
  {art:'Misc.',     w:['misc','sonstiges','diverses','info','infos']},
];
const BLATT_NAMEN = BLATTARTEN.map(a=>a.art);

/* Wohin alles faellt, was sich nicht benennen liess. Es ist KEINE Blattart mit
   Wortschatz: Erkannt wird es nie, es ist der Auffangort.

   Bis zum 31. Juli sperrte der Import, solange auch nur eine Datei ohne Stimme
   dastand. Bei Jens' Bandbestand hielten elf von 460 Dateien die uebrigen 449
   auf, und in der Probe war das der teuerste Punkt der ganzen Liste. Jetzt
   landet Unerkanntes hier, bleibt sichtbar und laesst sich jederzeit spaeter
   zuordnen. */
const OHNE_STIMME = 'Not Assigned';
window.OHNE_STIMME = OHNE_STIMME;

/* Eine nackte Tonart im Dateinamen ist eine Stimme: „Summertime Bb" ist die
   B♭-Ausgabe. Gerechnet wird das ZULETZT, nach Blattart und Instrument —
   „Mardi Gras Flöte in C" ist eine Flöte und keine C-Ausgabe.

   Bewusst NICHT dabei: das einzelne „b" und „bass". Beide gehoeren schon dem
   E-Bass, und ein „Blue Bossa Bass melodie" ist seine Stimme und nicht die
   Bass-Ausgabe eines Real Books. */
const AUSGABE_WORT = { bb:'B♭', eb:'E♭', c:'C' };
function ausgabeAusText(text){
  for(const x of wortfolgen(text)) if(AUSGABE_WORT[x.s]) return AUSGABE_WORT[x.s];
  return '';
}
window.ausgabeAusText = ausgabeAusText;
function blattArt(text){
  const b=wortfolgen(text);
  for(const a of BLATTARTEN) if(b.some(x=>a.w.includes(x.s))) return a.art;
  return null;
}
window.blattArt = blattArt;

/* Welche Voice steckt in diesem Stueck Text?

   Verglichen wird gegen GANZE Woerter — ohne diese Regel schluege „g" in
   „Gesang" an, und die Saengerin bekaeme die Gitarrenstimme.

   Es gewinnt die ZUERST GENANNTE, bei gleichem Anfang die laengste. Vorher
   gewann allein die laengste; das war an Jens' Bestand messbar falsch:
   „Drums + Perc." wurde Schlagzeug, „Drm+Perc." dagegen Percussion — dieselbe
   Sache, zwei Instrumente. Gemessen kostete die alte Regel den Schlagzeuger
   seine Stimme bei 4 von 29 Stuecken, die neue bei einem. Der Grund dahinter:
   Wer zwei Instrumente in einen Dateinamen schreibt, nennt sein eigenes
   zuerst. */
function voiceAusText(text){
  const b=wortfolgen(text); if(!b.length) return null;
  let treffer=null, wo=1e9, laenge=-1;
  INSTRUMENTE.forEach(inst=>{
    [inst.name, inst.en, ...inst.kurz].filter(Boolean).forEach(kand=>{
      const k=instrNorm(kand); if(!k) return;
      b.forEach(x=>{ if(x.s!==k) return;
        if(x.i<wo || (x.i===wo && k.length>laenge)){ wo=x.i; laenge=k.length; treffer=inst; } });
    });
  });
  return treffer;
}
window.voiceAusText = voiceAusText;
/* Dateiname in Titel und Stimmen-Text zerlegen. Geteilt wird an der LETZTEN
   Fundstelle des Trennzeichens: „Blue Bossa - Take 2 - tp.pdf" ist das Stueck
   „Blue Bossa - Take 2" mit der Stimme „tp". */
/* Genau die Endungen, die der Import kennt — und keine allgemeine Regel:
   „St. Thomas" oder „Nica´s Dream Vol.2" duerfen nicht beschnitten werden. */
const ENDUNG=/\.(pdf|mp3|m4a|wav|aac|aif|aiff|musicxml|mxl|xml|abc)$/i;
/* Ein Leadsheet ist Musik als Daten. `.xml` ist streng genommen mehrdeutig,
   in der Praxis aber genau das, was die Sammlungen liefern; taugt die Datei
   nicht, sagt es der Setzer beim Aufschlagen und nicht der Import. */
const LEAD_ENDUNG=/\.(musicxml|mxl|xml|abc)$/i;
function istLeadsheet(name,typ){
  return LEAD_ENDUNG.test(String(name||'')) || /musicxml/i.test(String(typ||''));
}
window.istLeadsheet=istLeadsheet;
function nameZerlegen(dateiname, trenner){
  const ohne=String(dateiname||'').replace(ENDUNG,'').trim();
  const t=trenner||'-';
  const i=ohne.lastIndexOf(t);
  if(i<0) return { titel:ohne, rest:'' };
  return { titel:ohne.slice(0,i).trim()||ohne, rest:ohne.slice(i+t.length).trim() };
}
window.nameZerlegen = nameZerlegen;

/* Was vom Dateinamen uebrig bleibt, wenn der Titel vorn abgezogen ist. Das
   ist der Weg, auf dem der Import zu „Alt 1" kommt, wenn der Ordner den
   Titel liefert.

   Sie stand bis zum 30. Juli im Import-Baustein. Sie ist aber eine reine
   Namensrechnung wie ihre beiden Nachbarn — und seit dem Glattziehen der
   Etiketten wird sie auch beim Schreiben gebraucht, weit ausserhalb des
   Bausteins: Ein bereits abgelegtes Blatt traegt seinen `dateiname` mit sich,
   und daraus laesst sich sein Rest zurueckgewinnen. */
function restNachTitel(dateiname, titel){
  const ohne=String(dateiname||'').replace(ENDUNG,'').trim();
  const tn=instrNorm(titel); if(!tn) return ohne;
  let j=0, i=0;
  for(; i<ohne.length && j<tn.length; i++){
    const c=instrNorm(ohne[i]); if(!c) continue;
    if(c===tn[j]) j++; else break;
  }
  /* Fuehrende Trennzeichen fallen mit weg: „Blue Bossa_Sheet in Eb" laesst
     sonst „_Sheet in Eb" stehen. Erkannt wuerde es trotzdem — aber in der
     Vorschau liest es sich wie ein Fehler. */
  return j<tn.length ? ohne : ohne.slice(i).replace(/^[\s_\-–—:.,]+/,'').trim();
}
window.restNachTitel = restNachTitel;

/* ================================================================
   Ein Foto wird ein Blatt

   In Workshops und Proben schreibt jemand etwas an die Tafel, und man
   fotografiert es ab. Das Bild gehoert an das Stueck, zu dem es entstanden
   ist, und nicht in die Foto-App.

   Die Buehne zeigt PDF ueber PDF.js, und der Safari-Betrachter gehoert zu den
   Bereichen, die nicht angefasst werden. Ein JPEG dorthin zu reichen hiesse,
   genau diesen Code zu beruehren. Statt dessen wird das Bild beim Anlegen in
   ein einseitiges PDF gelegt. Danach ist das Foto fuer den Rest der App ein
   Blatt wie jedes andere: Betrachter, Notizen darueber, Drucken, Export, Paket
   und Abgleich funktionieren unveraendert, und der Betrachter bleibt
   unberuehrt.

   Der Weg fuehrt ueber die Zeichenflaeche, obwohl sich ein JPEG auch OHNE
   Neucodierung einbetten liesse — PDF kennt es als Bildformat direkt. Den
   Ausschlag gibt die Ausrichtung: Kameras schreiben sie als EXIF-Marke NEBEN
   das Bild, nicht ins Bild. Ein roh eingebettetes Foto laege im PDF quer.
   `createImageBitmap` mit `imageOrientation:'from-image'` dreht es richtig,
   und derselbe Weg nimmt HEIC und PNG gleich mit. Der Preis ist eine einzige
   Neucodierung, und die sieht man einem Tafelbild nicht an.

   Die lange Kante wird auf 2400 Punkte begrenzt. Handschrift bleibt lesbar,
   und ein Paket bleibt handlich: rund ein halbes Megabyte je Foto statt drei.
   ================================================================ */
const FOTO_KANTE = 2400;
async function fotoAlsPDF(datei, kante){
  const max = kante || FOTO_KANTE;
  let bild=null;
  try{ bild = await createImageBitmap(datei, {imageOrientation:'from-image'}); }
  catch(e){
    /* Aeltere Browser kennen die Option nicht. Ein `<img>` dreht nach EXIF
       von selbst — es ist der langsamere, aber gleichwertige Weg. */
    bild = await new Promise((ja,nein)=>{
      const u=URL.createObjectURL(datei), i=new Image();
      i.onload =()=>{ URL.revokeObjectURL(u); ja(i); };
      i.onerror=()=>{ URL.revokeObjectURL(u); nein(new Error('Bild nicht lesbar')); };
      i.src=u; });
  }
  const bw=bild.width||bild.naturalWidth, bh=bild.height||bild.naturalHeight;
  if(!bw || !bh) throw new Error('Das Bild hat keine Maße.');
  const f = Math.min(1, max/Math.max(bw,bh));
  const w = Math.max(1,Math.round(bw*f)), h = Math.max(1,Math.round(bh*f));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  /* Weiss darunter: Ein PNG mit durchsichtigem Grund wuerde sonst schwarz. */
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bild,0,0,w,h);
  if(bild.close){ try{ bild.close(); }catch(e){} }
  const jpg = await new Promise(ja=>c.toBlob(ja,'image/jpeg',0.9));
  if(!jpg) throw new Error('Das Bild ließ sich nicht umwandeln.');
  return pdfMitBild(new Uint8Array(await jpg.arrayBuffer()), w, h);
}
/* Ein leeres Notizblatt: eine weiße Seite im Format DIN A4 hochkant, als PDF.
   Am 7. August für die Probe gebaut. Es entsteht auf demselben Weg wie ein
   Foto — weiße Fläche auf eine Leinwand, daraus ein JPEG, daraus ein PDF —
   und verhält sich danach überall wie ein Blatt: Es liegt am Titel, geht auf
   die Bühne und nimmt den Stift an.

   1240 auf 1754 Punkte sind A4 bei 150 dpi. Feiner lohnt nicht: Der Stift
   zeichnet auf der Bildschirmauflösung, nicht auf der des Blattes. */
async function notizblattLeer(){
  const c=document.createElement('canvas'); c.width=1240; c.height=1754;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height);
  const jpg=await new Promise(res=>c.toBlob(res,'image/jpeg',0.92));
  const bytes=new Uint8Array(await jpg.arrayBuffer());
  return pdfMitBild(bytes, c.width, c.height);
}
window.notizblattLeer = notizblattLeer;

/* Ein einseitiges PDF, das genau ein JPEG traegt — fuenf Objekte, von Hand
   gebaut. Eine Bibliothek dafuer einzubinden waere ein Vielfaches an Gewicht,
   und die Regel des Projekts verbietet ohnehin, etwas nachzuladen. Das JPEG
   liegt als DCTDecode-Strom darin und wird dabei NICHT noch einmal codiert. */
function pdfMitBild(jpg, w, h){
  const enc=new TextEncoder();
  const teile=[]; let laenge=0;
  const schreib=x=>{ const b=(typeof x==='string')?enc.encode(x):x;
    teile.push(b); laenge+=b.length; };
  const versatz=[];
  const obj=(n, kopf, strom)=>{
    versatz[n]=laenge;
    schreib(n+' 0 obj\n'+kopf+'\n');
    if(strom!==undefined){ schreib('stream\n'); schreib(strom); schreib('\nendstream\n'); }
    schreib('endobj\n');
  };
  schreib('%PDF-1.4\n');
  /* Die Marke, die eine Datei als binaer ausweist — als rohe Bytes, nicht als
     Text: Ueber UTF-8 wuerden daraus andere Bytes. */
  schreib(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+w+' '+h+']'
       +'/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
  obj(4,'<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h
       +'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>', jpg);
  /* Das Bild fuellt die Seite genau aus. */
  const inhalt='q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q';
  obj(5,'<</Length '+inhalt.length+'>>', inhalt);
  const xref=laenge;
  let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) x += String(versatz[i]).padStart(10,'0')+' 00000 n \n';
  schreib(x);
  schreib('trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(teile,{type:'application/pdf'});
}
window.fotoAlsPDF = fotoAlsPDF;
window.pdfMitBild = pdfMitBild;

/* Ein Dateiname ohne Trennzeichen: „Bienentanz Alt 1.pdf". Wo hoert das Stueck
   auf und wo faengt die Stimme an?

   Gesucht wird die STELLE, an der die Stimme beginnt — nicht bloss, ob eine
   drinsteht. Dafuer wird von hinten geprueft: Der letzte Wortanfang, ab dem
   der Rest noch eine Stimme enthaelt, ist ihr Anfang. Alles davor ist der
   Titel.

   Gebraucht wird das auf dem iPad. Safari kann dort keine Ordner waehlen, und
   ohne Ordner gaebe es keinen Titel — aus 460 Blaettern wuerden 460 Stuecke.
   Am Mac bleibt der Ordner der bessere Weg, weil er nicht raten muss. */
/* Faengt an DIESER Stelle eine Stimme an? Geprueft wird nur das erste Wort —
   „enthaelt irgendwo eine Stimme" waere zu wenig, denn dann bliebe bei
   „St. Thomas Drum Perc." das Wort „Drum" im Titel haengen, weil auch „Perc."
   noch eine Stimme ist. */
function stimmeAmAnfang(text){
  const b=wortfolgen(text).filter(x=>x.i===0);
  if(!b.length) return false;
  for(const a of BLATTARTEN) if(b.some(x=>a.w.includes(x.s))) return true;
  for(const inst of INSTRUMENTE){
    const kand=[inst.name, inst.en].concat(inst.kurz||[]).filter(Boolean).map(instrNorm);
    if(b.some(x=>kand.includes(x.s))) return true;
  }
  return false;
}
/* Ist der Text NICHTS ALS eine Stimme? „Alt", „Tenor Sax", „C" — ja. „Tenor
   Madness" — nein, das ist ein Stueck, das zufaellig mit einem Instrument
   anfaengt.

   Der Unterschied ist am 2. August teuer geworden. Beim Einlesen eines Real
   Books wurde „Tenor Madness - C.pdf" vertauscht, weil der Titel mit einer
   Stimme BEGINNT: Aus dem Stueck wurde ein Titel namens „C" mit der Stimme
   „Tenor Madness". `stimmeAmAnfang` allein reicht als Bedingung fuer das
   Vertauschen also nicht. */
function nurStimme(text){
  let t=String(text||'').trim();
  if(!t) return false;
  /* Eine angehaengte Nummer („Alt 2") und eine Tonartangabe („Trumpet in Bb")
     gehoeren noch zur Stimme und werden vor dem Vergleich abgezogen. */
  t=t.replace(/\s+in\s+[A-Ha-h][b#♭]?$/i,'').replace(/[\s_-]+\d+$/,'').trim();
  if(!t) return false;
  /* Verglichen wird der GANZE Text, nicht sein Anfang. `stimmeAmAnfang` taugt
     dafuer nicht: Es sagt bei „Tenor Madness" ja, weil es nur vorne schaut. */
  const s=instrNorm(t);
  if(!s) return false;
  for(const a of BLATTARTEN) if(a.w.includes(s)) return true;
  for(const i of INSTRUMENTE){
    const kand=[i.name, i.en].concat(i.kurz||[]).filter(Boolean).map(instrNorm);
    if(kand.includes(s)) return true;
  }
  /* Die Ausgaben: „C", „Bb", „Eb", „Bass". */
  if(STIMM_ORDNUNG.some(x=>instrNorm(x)===s)) return true;
  return !!ausgabeAusText(t) && instrNorm(ausgabeAusText(t))===s
      || !!ausgabeAusText(t) && t.length<=3;
}
window.nurStimme = nurStimme;
function titelVorStimme(dateiname){
  const ohne=String(dateiname||'').replace(ENDUNG,'').trim();
  const woerter=[]; const re=/[0-9A-Za-zÄÖÜäöüß]+/g; let m;
  while((m=re.exec(ohne))) woerter.push({w:m[0], von:m.index});
  if(woerter.length<2) return null;
  /* Vorwaerts: die FRUEHESTE Stelle, an der eine Stimme beginnt. Alles davor
     ist der Titel, alles danach gehoert zur Stimme. */
  for(let k=1; k<woerter.length; k++){
    if(!stimmeAmAnfang(ohne.slice(woerter[k].von))) continue;
    const titel=ohne.slice(0,woerter[k].von).replace(/[\s_\-–—:.,]+$/,'').trim();
    return titel ? { titel, rest:ohne.slice(woerter[k].von).trim() } : null;
  }
  return null;
}
window.titelVorStimme = titelVorStimme;
window.stimmeAmAnfang = stimmeAmAnfang;

/* ---- Das Etikett: was auf dem Schalter steht ---------------------------
   In der Regel ist es der Instrumentenname; „Alt-Sax" ist genau richtig. Nur
   wenn ZWEI Blaetter desselben Stuecks auf dasselbe Instrument fallen, sagt
   der Name nichts mehr — dann stand bei `Bienentanz` zweimal „Alt-Sax" und man
   musste raten. Erst dort wird der Rest des Dateinamens herangezogen, also
   Jens' eigene Schreibweise: „Alt 1", „Alt 2". Reicht der Rest nicht, wird
   durchgezaehlt.

   Diese Rechnung stand bis zum 30. Juli nur im Import. Die Vorschau zeigte
   deshalb „Alt-Sax · Alt-Sax", geschrieben wurde aber „Alt 1" und „Alt 2" —
   die Vorschau zeigte etwas anderes als das Ergebnis. Jetzt rechnen beide mit
   dieser einen Funktion.

   `saetze` = [{instrument, rest}] und bekommt `.etikett` gesetzt.
   `vorhandene` = Instrumente der Blaetter, die am Stueck schon haengen. */
const ETIKETT_ZUSATZ=/(^|[\s_\-–—]+)(neu|new|kopie|copy|final)\s*\d*(?=$|[\s_\-–—])/gi;
/* Eine Nummer am Ende eines Etiketts abschneiden.

   Jens' Bandnoten tragen im Dateinamen eine Katalognummer: „Cute Alt 1 612".
   Das Etikett ist bewusst seine Schreibweise und nicht die gerechnete, und
   deshalb stand die 612 auf dem Schalter. Sie bedeutet nichts, und am
   3. August hat er gebeten, sie wegzulassen.

   Abgeschnitten wird nur eine Gruppe von DREI oder mehr Ziffern am Ende.
   „Alt 1" und „Git 2" bleiben damit unangetastet — dort unterscheidet die
   Nummer zwei Stimmen desselben Instruments, und das ist ihr ganzer Zweck. */
function etikettOhneNummer(s){
  const t=String(s||'').trim();
  if(/^\d{3,}$/.test(t)) return '';               /* nur die Nummer */
  return t.replace(/[\s_\-–—]+\d{3,}$/,'').trim();
}
window.etikettOhneNummer = etikettOhneNummer;
/* Welche Etiketten im Bestand tragen noch eine solche Nummer? Die Regel oben
   greift beim Import; was vorher hereinkam, traegt sie weiter. */
function etikettenMitNummer(){
  return (BS_KATALOG.elemente||[]).filter(e=>{
    const et=(e.etikett||'').trim(); if(!et) return false;
    return etikettOhneNummer(et)!==et;
  });
}
async function nummernAusEtiketten(){
  const treffer=etikettenMitNummer();
  if(!treffer.length){ alert('Kein Etikett trägt eine Nummer am Ende.'); return 0; }
  const neuVon = e => etikettOhneNummer(e.etikett) || (e.instrument||'');
  const zeig=treffer.slice(0,8).map(e=>'· '+e.etikett+'  →  '+(neuVon(e)||'(ohne)'));
  if(!confirm(treffer.length+(treffer.length===1?' Etikett trägt':' Etiketten tragen')
    +' eine Nummer am Ende:\n\n'+zeig.join('\n')
    +(treffer.length>8?'\n… und '+(treffer.length-8)+' weitere':'')
    +'\n\nDie Nummern entfernen?\n\nDas Blatt selbst bleibt unangetastet — nur die '
    +'Beschriftung auf dem Schalter ändert sich. Rückgängig geht es über „Bearbeiten".')) return 0;
  let n=0;
  for(const e of treffer){
    try{ await BS.aendern('element', e.id, {etikett:neuVon(e)}); n++; }catch(_){}
  }
  await loadLibrary(); render();
  alert(n+(n===1?' Etikett':' Etiketten')+' aufgeräumt.');
  return n;
}
window.nummernAusEtiketten = nummernAusEtiketten;
function etikettSauber(r){
  return etikettOhneNummer(String(r||'')
    .replace(ETIKETT_ZUSATZ,' ')
    .replace(/[\s_\-–—:.,]+/g,' ')
    .replace(/\s+/g,' ').trim()).slice(0,18);
}
/* `vorhandene` sind die Blaetter, die am Stueck schon haengen.

   Als blosse Zeichenketten nennen sie nur das Instrument — dann zaehlen sie
   mit, mehr nicht. Als Objekte `{instrument, etikett, rest}` erlauben sie
   ausserdem das GLATTZIEHEN, und das ist seit dem 30. Juli der Regelfall.

   Der Grund: Wer erst ein einzelnes Alt-Blatt ablegt, bekommt „Alt-Sax"
   darauf, denn das Instrument kommt nur einmal vor. Legt er spaeter das
   zweite dazu, hiess das erste weiter „Alt-Sax" und das zweite „Alt 2" —
   der Name eines Blattes haette also davon abgehangen, in welcher
   REIHENFOLGE importiert wurde. Zwei Bestaende mit demselben Inhalt saehen
   verschieden aus. Jetzt wird das vorhandene Etikett mitgerechnet und am
   uebergebenen Objekt zurueckgeschrieben; der Aufrufer traegt es nach.

   Angefasst wird dabei nur, was die Maschine gesetzt hat — erkennbar daran,
   dass das Etikett noch gleich dem Instrument ist. Eine selbst getippte
   Schreibweise bleibt unantastbar. Am 30. Juli mit Jens so festgelegt
   (Frage 3, Weg B). */
function etikettenBerechnen(saetze, vorhandene){
  const alt=(vorhandene||[]).map(v => (v && typeof v==='object')
    ? v : {instrument:String(v||''), etikett:String(v||''), rest:'', _nurZaehlen:true});
  const zahl={}, lauf={};
  alt.forEach(a=>{ const k=a.instrument||''; zahl[k]=(zahl[k]||0)+1; });
  (saetze||[]).forEach(s=>{ const k=s.instrument||''; zahl[k]=(zahl[k]||0)+1; });
  /* Zuerst die vorhandenen: Sie besetzen die Nummern 1..n, damit die neuen
     dahinter weiterzaehlen — genau wie zuvor, als `lauf` aus ihrer Anzahl
     vorbelegt wurde. */
  alt.forEach(a=>{
    const k=a.instrument||'';
    lauf[k]=(lauf[k]||0)+1;
    if(a._nurZaehlen) return;              /* nur das Instrument bekannt */
    if(zahl[k]<=1) return;                 /* bleibt allein, bleibt wie es ist */
    if((a.etikett||'')!==k) return;        /* selbst getippt — unantastbar */
    const r=etikettSauber(a.rest);
    a.etikett = (r && r.length<=18) ? r : (k+' '+lauf[k]);
  });
  (saetze||[]).forEach(s=>{
    const k=s.instrument||'';
    if(zahl[k]<=1){ s.etikett=k; return; }
    const r=etikettSauber(s.rest);
    lauf[k]=(lauf[k]||0)+1;
    s.etikett = (r && r.length<=18) ? r : (k+' '+lauf[k]);
  });
  return saetze;
}
/* Ordnen: erst nach dem Instrument, dann nach dem Etikett. Ohne den zweiten
   Schluessel stehen „Alt 2" und „Alt 1" in der Reihenfolge, in der die
   Dateien hereinkamen. */
function nachStimmeOrdnen(a, b){
  return (stimmenRang(a.instrument||a.voice||'') - stimmenRang(b.instrument||b.voice||''))
      || String(a.etikett||'').localeCompare(String(b.etikett||''),'de',{numeric:true});
}
window.etikettenBerechnen = etikettenBerechnen;
window.nachStimmeOrdnen = nachStimmeOrdnen;

/* Die Reihenfolge der Stimmen. Tonarten stehen fest; Bandstimmen folgen der
   Voice-Liste — also der Ordnung, die Jens im Setup durch Ziehen setzt. */
function stimmenRang(s){
  /* Das Unzugeordnete steht immer zuletzt — es ist kein Rang, sondern eine
     offene Aufgabe. */
  if(s===OHNE_STIMME) return 1000;
  const i=STIMM_ORDNUNG.indexOf(s); if(i>=0) return i;
  const n=instrNorm(s); if(!n) return 999;
  const j=INSTRUMENTE.findIndex(x=>instrNorm(x.name)===n || instrNorm(x.en)===n);
  if(j>=0) return 100+j;
  /* Blaetter stehen hinter allen Instrumenten, aber in fester Reihenfolge —
     Leadsheet zuerst, weil es das einzige ist, das man spielen kann. */
  const b=BLATT_NAMEN.indexOf(s); if(b>=0) return 200+b;
  return 998;
}
window.stimmenRang = stimmenRang;

/* Etikett und Instrument sind zweierlei — Schritt 3 des Import-Konzepts.
   Auf dem Schalter steht Jens' Schreibweise („Alt 1", „Alt 2"), verglichen
   wird aber das erkannte Instrument („Alt-Sax"). Ohne diese Trennung fiele
   die Zuordnung aus, sobald zwei Stimmen desselben Instruments eigene
   Etiketten tragen: „Alt 1" steht in keiner Instrumentenliste.
   Blaetter der Grossammlung tragen kein Instrument; dort ist `stimme` die
   Notation und zugleich der Vergleichswert. */
const stimmWert = t => (t && (t.instrument || t.stimme)) || '';
window.stimmWert = stimmWert;

/* ================================================================
   Was auf dem Schalter STEHT — und was darunter gespeichert ist

   Am 1. August mit Jens festgelegt. Angezeigt wird kurz und englisch,
   gespeichert bleibt der bisherige Wert als Kennung. Das kostet keine
   Umstellung des Bestands, ist jederzeit umkehrbar und kann nichts
   verlieren; ein Datenumbau fuer eine Beschriftung waere das schlechteste
   Geschaeft von beiden.

   Der Anlass ist Platz. In der Setliste stand „Alt-Sax · E-Bass · Gitarre ·
   Klavier · Tenor-Sax" und fuellte die Zeile; „Alto · Bass · Guitar · Keys ·
   Tenor" sagt dasselbe in gut der halben Breite. Das Ziel heisst: eine Stimme,
   eine Zeile.

   Umbenennt ein Nutzer eine Voice im Setup, greift die Tabelle nicht mehr —
   dann gilt sein Name, und das ist richtig so.
   ================================================================ */
const STIMM_ANZEIGE = {
  'Akkordeon':'Accordion',  'Alt-Sax':'Alto',       'Bariton-Sax':'Bari',
  'Cello':'Cello',          'E-Bass':'Bass',        'Flöte':'Flute',
  'Flügelhorn':'Flugel',    'Gesang':'Vocals',      'Gitarre':'Guitar',
  'Klarinette':'Clarinet',  'Klavier':'Keys',       'Kontrabass':'Upright',
  'Percussion':'Perc.',     'Posaune':'Trombone',   'Schlagzeug':'Drums',
  'Sopran-Sax':'Soprano',   'Tenor-Sax':'Tenor',    'Trompete':'Trumpet',
  'Tuba':'Tuba',            'Violine':'Violin',
  /* Die Blattarten. „Misc." heisst schon so. */
  'Leadsheet':'Lead',       'Ablauf':'Form',        'Not Assigned':'none',
};
function anzeigeStimme(wert){ const w=String(wert||''); return STIMM_ANZEIGE[w] || w; }
/* Ein selbst getipptes Etikett bleibt unangetastet — erkennbar daran, dass es
   vom erkannten Instrument abweicht. Dieselbe Regel wie beim Glattziehen der
   Etiketten: Angefasst wird nur, was die Maschine gesetzt hat. */
function zeigStimme(etikett, instrument){
  const e=String(etikett||''), i=String(instrument||'');
  if(e && i && e!==i) return e;
  return anzeigeStimme(e||i);
}
window.anzeigeStimme = anzeigeStimme;
window.zeigStimme = zeigStimme;

/* Wie nah steht eine Stimme an der gewaehlten Voice? 0 ist der eigene Name,
   0.5 die eigene Notation, 1 alles andere. Damit laesst sich sortieren.

   Am 2. August von Jens verlangt: Wer Gitarre gewaehlt hat, will „Git" als
   erste Marke der Zeile sehen und nicht an achter Stelle zwischen Bass und
   Keys. Die Reihenfolge der Voice-Liste bestimmt weiter alles Uebrige. */
function stimmenNaehe(t){
  const ich=(typeof meinInstrument==='function') ? meinInstrument() : null;
  if(!ich) return 1;
  const w=instrNorm(stimmWert(t));
  const namen=[ich.name, ich.en].filter(Boolean).map(instrNorm);
  if(namen.includes(w)) return 0;
  if(ich.notation && stimmWert(t)===ich.notation) return 0.5;
  return 1;
}
/* Die eine Ordnung fuer alle Zeilenbauer: eigene Stimme zuerst, danach die
   Voice-Liste, bei gleichem Instrument das Etikett. */
function stimmenOrdnen(arr){
  return arr.sort((a,b)=>
    (stimmenNaehe(a)-stimmenNaehe(b))
    || (stimmenRang(stimmWert(a))-stimmenRang(stimmWert(b)))
    || (a.stimme||'').localeCompare(b.stimme||'','de',{numeric:true}));
}
window.stimmenOrdnen = stimmenOrdnen;
function waehleStimme(stimmen){
  if(!stimmen || !stimmen.length) return null;
  const ich=meinInstrument();
  if(ich){
    /* Stufe 1 kennt beide Namen. Eine Bandstimme kann „Gitarre" heissen oder
       „Guitar" — fuer den Spieler ist es dasselbe. */
    const namen=[ich.name, ich.en].filter(Boolean).map(instrNorm);
    const nachName = stimmen.find(t=>namen.includes(instrNorm(stimmWert(t))));
    if(nachName) return nachName;
    if(ich.notation){
      const nachNotation = stimmen.find(t=>stimmWert(t)===ich.notation);
      if(nachNotation) return nachNotation;
    }
  }
  /* Entschieden am 28. Juli: Ein Leadsheet ist die C-Fassung und geht auf,
     wenn die gewaehlte Voice keine eigene Stimme hat. „Lyrics" und „Ablauf"
     bleiben neutral und gehen nie von selbst auf — sie stehen deshalb hier
     nicht, obwohl sie derselben Art angehoeren. */
  return stimmen.find(t=>stimmWert(t)==='C')
      || stimmen.find(t=>stimmWert(t)==='Leadsheet')
      || stimmen[0];
}
window.waehleStimme = waehleStimme;

/* Nachweis in Zahlen — aus der Konsole aufrufbar, damit sich dieser
   Schritt ohne sichtbare Aenderung pruefen laesst. */
window.gruppenBericht = function(){
  const fam={}; Object.keys(FAMILIEN).forEach(f=>fam[f]=[...FAMILIEN[f]].sort());
  const inFam=TUNES.filter(t=>t.fam);
  const gids=new Set(inFam.map(t=>t.gid));
  const verteilung={};
  gids.forEach(g=>{ const n=GRUPPEN[g].length; verteilung[n]=(verteilung[n]||0)+1; });
  const doppelt=[...gids].filter(g=>{
    const s=GRUPPEN[g].map(t=>t.stimme); return new Set(s).size<s.length; });
  return { familien:fam, eintraegeInFamilien:inFam.length, stueckeInFamilien:gids.size,
           verteilung, zeilenVorher:TUNES.length,
           zeilenNachher:TUNES.length-(inFam.length-gids.size),
           gruppenMitDoppelterStimme:doppelt.map(g=>GRUPPEN[g][0]._ot) };
};
function applyOverride(key, patch){
  const t=byKey[key]; if(!t) return;
  const o=Object.assign({}, OVERRIDES[key]);
  if('t' in patch){ const v=(patch.t||'').trim(); if(v && v!==t._ot){ o.t=v; t.t=v; } else { delete o.t; t.t=t._ot; } }
  if('c' in patch){ const v=(patch.c||'').trim(); if(v!==(t._oc||'')){ o.c=v; t.c=v; } else { delete o.c; t.c=t._oc; } }
  if(Object.keys(o).length) OVERRIDES[key]=o; else delete OVERRIDES[key];
  saveOverrides(); rebuildByKey(); render();
}
let USER = JSON.parse(localStorage.getItem('rb_usertunes')||'[]');  // annotated copies (metadata; page images in IndexedDB)
let LIBTUNES = [];   // eigene importierte PDFs (Metadaten + Blob in IndexedDB, Store 'libtunes')
let USERBOOKS = JSON.parse(localStorage.getItem('rb_userbooks')||'[]'); // [{bid,name,chip,createdAt}]
let byKey = {};
function ALL(){ return TUNES.concat(USER).concat(LIBTUNES); }
function rebuildByKey(){ byKey={}; ALL().forEach(t=>byKey[t.key]=t); }
rebuildByKey();
function saveUser(){ localStorage.setItem('rb_usertunes', JSON.stringify(USER)); rebuildByKey(); }
