/* ================================================================
   Drucken

   Der Seitenumbruch hat lange nicht gestimmt: Von jedem Notenblatt rutschte
   die letzte Zeile des Systems auf eine zweite Seite. Drei Ursachen, alle drei
   hier behoben.

   Erstens hatte der Rahmen eine feste Hoehe von 1000 Pixeln. Wie hoch eine
   Druckseite ist, weiss das Blatt aber erst beim Drucken, und auf A4 sind
   1000 px zu viel. `100vh` fragt die Seite selbst.

   Zweitens ist `<embed>` von Haus aus ein Zeilen-Element. Unter ihm bleibt der
   Platz fuer Unterlaengen stehen — ein paar Pixel, die genau diesen Ueberlauf
   ergeben. `display:block` nimmt ihn weg.

   Drittens brachte die Seite den voreingestellten Rand des Browsers mit, und
   der kam zur Hoehe hinzu. `@page{margin:0}` setzt ihn auf null; seinen Rand
   bringt das gescannte Blatt selbst mit.

   Das letzte Blatt bekommt keinen Umbruch mehr, sonst faellt hinten eine leere
   Seite heraus.
   ================================================================ */
/* ================================================================
   Gedruckt wird IM Dokument, nicht in einem zweiten Fenster

   Der zweite Anlauf hat einen Fehler eingebaut, der erst auf dem iPad
   sichtbar wurde: Das Druckfenster ging zuerst auf — wegen des
   Pop-up-Blockers muss das im Griff des Nutzers geschehen —, und danach
   wurde in BandStand gezeichnet. Nur liegt BandStand dann im HINTERGRUND.
   Dort feuert `requestAnimationFrame` nicht, und PDF.js wartet ewig. Jens
   stand nach Minuten immer noch bei „Blatt 1 von 5 wird gezeichnet".

   Das ist dieselbe Falle, die den Pruefstand schon zweimal gekostet hat,
   nur diesmal im Betrieb. Sie verschwindet, wenn es kein zweites Fenster
   mehr gibt.

   Gedruckt wird deshalb aus dem eigenen Dokument. Ein verstecktes Fach
   nimmt die Seiten auf; beim Drucken blendet das Stilblatt alles andere
   aus. Das loest drei Dinge auf einmal: keine Drosselung, kein
   Pop-up-Blocker, und kein Fenster, aus dem man nicht mehr zurueckfindet.
   ================================================================ */
/* ================================================================
   Die Arbeitsanzeige für lange Eingriffe am Bestand

   `arbeitet()` zeigt sie, `arbeitetAus()` nimmt sie weg. Dazwischen liegt ein
   `await arbeitetSichtbar()` — ohne das erscheint sie nie: Der Browser zeichnet
   erst, wenn der Aufrufer den Faden abgibt, und eine Lösch-Transaktion gibt ihn
   danach lange nicht mehr her.

   Bewusst NICHT über `requestAnimationFrame`: Liegt das Fenster im
   Hintergrund, feuert das nicht — die Falle, die in diesem Projekt schon
   mehrfach zugeschlagen hat. `setTimeout` feuert auch dann.
   ================================================================ */
function arbeitet(text, unter){
  let k=document.getElementById('arbeitLauf');
  if(!k){
    k=document.createElement('div'); k.id='arbeitLauf';
    k.setAttribute('role','status'); k.setAttribute('aria-live','polite');
    k.innerHTML='<div class="kasten"><div class="text"></div>'
      +'<div class="unter"></div><div class="lauf"><i></i></div></div>';
    document.body.append(k);
  }
  k.querySelector('.text').textContent=text||'Einen Moment…';
  const u=k.querySelector('.unter');
  u.textContent=unter||''; u.style.display=unter?'':'none';
  k.classList.add('an');
  void k.offsetHeight;          /* erzwingt das Zeichnen, bevor es weitergeht */
  return k;
}
function arbeitetAus(){
  const k=document.getElementById('arbeitLauf'); if(k) k.classList.remove('an');
}
/* Den Faden einmal abgeben, damit das Overlay wirklich auf dem Schirm steht. */
function arbeitetSichtbar(){ return new Promise(r=>setTimeout(r,32)); }
/* Der bequeme Weg: zeigen, arbeiten lassen, wegnehmen — auch wenn es
   schiefgeht. Ohne `finally` bliebe die Anzeige nach einem Fehler stehen und
   die App waere scheinbar eingefroren. */
async function beiArbeit(text, unter, tun){
  arbeitet(text, unter);
  await arbeitetSichtbar();
  try{ return await tun(); }
  finally{ arbeitetAus(); }
}
window.arbeitet=arbeitet; window.arbeitetAus=arbeitetAus; window.beiArbeit=beiArbeit;

function druckFortschritt(text){
  let k=document.getElementById('druckLauf');
  if(!k){
    k=document.createElement('div'); k.id='druckLauf';
    k.innerHTML='<div class="kasten"><div class="text"></div>'
      +'<button class="btn ghost sm" id="druckAb">Abbrechen</button></div>';
    document.body.append(k);
    k.querySelector('#druckAb').onclick=()=>{ druckAbbruch=true; };
  }
  k.querySelector('.text').textContent=text;
  k.style.display='flex';
}
function druckFortschrittWeg(){
  const k=document.getElementById('druckLauf'); if(k) k.style.display='none';
}
let druckAbbruch=false;
/* Ein Blatt wird zum Drucken gezeichnet, nicht eingebettet.

   Ein `<embed>` zeigt nur den Anfang eines Dokuments — ein mehrseitiges
   Stueck kam ab Seite zwei nicht mit, und Drucken scrollt nicht. Und ueber
   Massstab und Ausschnitt entscheidet der PDF-Betrachter des Browsers
   selbst; auf dem iPad hat er die Blaetter rechts und unten abgeschnitten.

   Gezeichnet wird mit derselben Bibliothek wie die Buehne, aber ueber einen
   eigenen Weg — der Safari-Betrachter wird nicht angefasst. */
async function pdfAlsSeitenbilder(url){
  if(!window.pdfjsLib) throw new Error('PDF.js steht nicht bereit.');
  const buf=await (await fetch(encodeURI(url))).arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const bilder=[];
  for(let n=1; n<=doc.numPages; n++){
    if(druckAbbruch) break;
    const s=await doc.getPage(n);
    const eins=s.getViewport({scale:1});
    /* 1400 Bildpunkte auf der langen Kante: rund 170 dpi, fein genug fuer
       Notensatz und Handschrift, und ein Blatt wiegt als JPEG ein paar
       hundert Kilobyte statt einiger Megabyte. */
    const lang=Math.max(eins.width, eins.height);
    const vp=s.getViewport({scale:1400/lang});
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
    const ctx=c.getContext('2d');
    /* Weisser Grund: Ein gescanntes Blatt ist weiss, eine Leinwand ist
       durchsichtig. Ohne das kaeme Schwarz auf Schwarz aus dem Drucker. */
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    await s.render({canvasContext:ctx, viewport:vp}).promise;
    bilder.push(c.toDataURL('image/jpeg',0.85));
  }
  try{ doc.destroy(); }catch(e){}
  return bilder;
}
/* Das erste Blatt: der Name der Liste, darunter die Titel in ihrer Reihenfolge
   mit Komponist, Buch und den vergebenen Tags. */
function programmHTML(name, items){
  const zeilen=items.map(t=>{
    const tags=gruppeTagIds(t).map(id=>{ const g=tagById(id); return g?g.name:null; }).filter(Boolean);
    const wer=[t.c, bookName(t)].filter(Boolean).map(esc).join(' · ');
    return '<li><b>'+esc(t.t)+'</b>'
      + (wer ? '<div class="wer">'+wer+'</div>' : '')
      + (tags.length ? '<div class="tags">'+tags.map(n=>'<span class="tag">'+esc(n)+'</span>').join('')+'</div>' : '')
      + '</li>';
  }).join('');
  return '<div class="bs-seite bs-programm"><h1>'+esc(name)+'</h1>'
    + '<div class="unter">'+items.length+' Titel</div>'
    + '<ol>'+zeilen+'</ol></div>';
}
/* Die Seiten in das Fach legen und drucken. Aufgeraeumt wird danach. */
function druckImDokument(titel, programm, bilder){
  let raum=document.getElementById('druckRaum');
  if(!raum){ raum=document.createElement('div'); raum.id='druckRaum'; document.body.append(raum); }
  const seiten=(bilder||[]).map((src,i)=>
    '<div class="bs-seite bs-blatt'+(i===bilder.length-1?' letzte':'')+'">'
    + '<img src="'+src+'" alt=""></div>').join('');
  const prog = programm && !(bilder||[]).length
    ? programm.replace('class="bs-seite bs-programm"','class="bs-seite bs-programm letzte"')
    : (programm||'');
  raum.innerHTML = prog + seiten;
  /* Der Fenstertitel wird beim „In PDF sichern" zum Dateinamen. */
  const alterTitel=document.title;
  document.title=titel;
  const aufraeumen=()=>{ raum.innerHTML=''; document.title=alterTitel;
    window.removeEventListener('afterprint', aufraeumen); };
  window.addEventListener('afterprint', aufraeumen);
  /* Erst drucken, wenn die Bilder geladen sind — sonst druckt Safari leere
     Seiten.

     NICHT ueber `decode()`: Das Fach steht auf `display:none`, und fuer ein
     Bild, das nicht gezeichnet wird, loest `decode()` in manchen Browsern nie
     auf. Am 3. August gemessen: Alle Bilder waren fertig, `window.print` wurde
     trotzdem nie gerufen. `load` feuert dagegen auch im verborgenen Fach. */
  const bl=[...raum.querySelectorAll('img')];
  const fertig=new Promise(res=>{
    let offen=bl.filter(i=>!(i.complete && i.naturalWidth>0)).length;
    if(!offen) return res();
    bl.forEach(i=>{ if(i.complete && i.naturalWidth>0) return;
      i.addEventListener('load', ()=>{ if(--offen<=0) res(); }, {once:true});
      i.addEventListener('error',()=>{ if(--offen<=0) res(); }, {once:true}); });
    setTimeout(res, 6000);            /* Notbremse */
  });
  fertig.then(()=>setTimeout(()=>{ try{ window.print(); }catch(e){} }, 150));
}
/* In einer offenen Setliste druckt „Drucken" das Programm voran: erst der Name
   der Liste und die Titel in ihrer Reihenfolge, dann die Blaetter. Sonst nur
   die Blaetter. Die eigenen Knoepfe im Setlisten-Kopf sind dafuer entfallen —
   sie taten dasselbe, standen aber ueber der Liste im Weg. */
async function bulkPrint(){
  let items=[...S.selection].map(k=>byKey[k]).filter(t=>t&&!t.isEdit);
  if(!items.length){ alert('Keine druckbaren Titel ausgewählt.'); return; }
  const st = (S.view==='set' && S.openSet) ? S.sets.find(s=>s.id===S.openSet) : null;
  /* In der Setliste zaehlt ihre Reihenfolge und nicht die der Auswahl. */
  if(st){ const drin=new Set(S.selection);
    items=st.items.filter(k=>drin.has(k)).map(k=>byKey[k]).filter(t=>t&&!t.isEdit); }
  const name = st ? st.name : ('Auswahl ('+items.length+')');
  await urlSichernViele(items);
  const bilder=[], schief=[];
  const mitBytes=items.filter(t=>t.f);
  druckAbbruch=false;
  try{
    let n=0;
    for(const t of mitBytes){
      if(druckAbbruch) break;
      n++;
      druckFortschritt('Blatt '+n+' von '+mitBytes.length+' wird gezeichnet…');
      /* Dem Bildschirm eine Runde lassen, sonst steht die Zahl still. */
      await new Promise(r=>requestAnimationFrame(()=>r()));
      try{ bilder.push(...await pdfAlsSeitenbilder(t.f)); }
      catch(e){ schief.push(t.t||'ein Blatt'); }
    }
  } finally {
    /* Die geliehenen Verweise gleich zurueckgeben: Die Seitenbilder tragen
       ihre Daten selbst, das Druckdokument braucht die Dateien nicht mehr. */
    urlFreigebenViele(items);
    druckFortschrittWeg();
  }
  if(druckAbbruch){ druckAbbruch=false; return; }
  druckImDokument(name, st?programmHTML(st.name, items):null, bilder);
  if(schief.length)
    alert('Nicht gezeichnet: '+schief.join(', ')
      +'\n\nDie übrigen Blätter sind im Druck.');
}

/* ================================================================
   Titel bearbeiten — der haeufigste Griff, ohne die Liste zu verlassen

   Schritt 1 des Content-Konzepts in der Fassung 2. Eine Zuordnung
   richtigzustellen ist der haeufigste Griff im laufenden Betrieb: ein
   Etikett stimmt nicht, eine Stimme wurde falsch erkannt, ein Foto
   braucht einen Namen. Der Weg dorthin fuehrte bis hierher ueber „Im
   Content", zwei Ebenen hinein und wieder zurueck — genau der Umweg, den
   das Konzept als das eigentliche Aergernis benennt.

   Hier steht ausschliesslich das Ungefaehrliche: umbenennen und
   zuordnen. Verschieben, Kopieren und Entfernen bleiben in Content, und
   zwar nicht aus Vorsicht, sondern weil sie gelegentlich und in Schueben
   anfallen und dort Platz haben. Weil nichts davon verlieren kann,
   braucht dieses Blatt auch keine Rueckfrage.

   Der Listenbauer wird nicht angefasst. Das hier ist ein eigenes Blatt
   ueber der Liste und kein Umbau der Zeile.
   ================================================================ */
function titelBearbeiten(titelId){
  openSheet(card=>{
    card.innerHTML='<h2>Titel bearbeiten</h2>';
    const ti=(BS_KATALOG.titel||[]).find(x=>x.id===titelId);
    if(!ti){
      const w=document.createElement('div'); w.className='muted';
      w.textContent='Dieser Titel steht nicht mehr im Bestand.';
      card.append(w); return;
    }
    const buch=(BS_KATALOG.buecher||[]).find(b=>b.id===ti.buchId);
    const hinweis=document.createElement('div'); hinweis.className='muted';
    hinweis.style.margin='-6px 0 12px';
    hinweis.textContent='Umbenennen und Stimmen zuordnen, ohne die Liste zu verlassen. '
      +'Verschieben und Entfernen stehen weiter in Content.';
    card.append(hinweis);

    const feld=(label, wert, platzhalter)=>{
      const l=document.createElement('div'); l.className='lbl'; l.style.margin='0 0 6px';
      l.textContent=label;
      const i=document.createElement('input'); i.className='txt'; i.value=wert||'';
      if(platzhalter) i.placeholder=platzhalter;
      card.append(l,i); return i;
    };

    /* Titel und Komponist haengen am Titel und gelten fuer alle seine
       Blaetter. Ein Schreibvorgang, nicht acht — das war der zweite Grund,
       aus dem der Titel am 29. Juli eine eigene Sache geworden ist. */
    const tf=feld('Titel', ti.titel);
    tf.onchange=async()=>{
      const v=tf.value.trim(); if(!v || v===ti.titel){ tf.value=ti.titel||''; return; }
      try{ await BS.aendern('titel', titelId, {titel:v}); }
      catch(e){ alert('Umbenennen fehlgeschlagen: '+(e&&e.message||e)); return; }
      ti.titel=v;
      /* Die Liste neu zu bauen kostet bei einem grossen Bestand Zeit, und
         solange sie laeuft, zeichnet der Browser nichts — das Blatt blieb
         nach „Fertig" noch Sekunden sichtbar stehen, obwohl es laengst
         geschlossen war. Erst einen Bildaufbau abwarten, dann rechnen. */
      await atemzug();
      await loadLibrary(); render();
    };
    const kf=feld('Komponist', ti.komponist, 'Komponist');
    kf.style.marginTop='0';
    kf.onchange=async()=>{
      const v=kf.value.trim(); if(v===(ti.komponist||'')) return;
      try{ await BS.aendern('titel', titelId, {komponist:v}); }
      catch(e){ alert('Fehlgeschlagen: '+(e&&e.message||e)); return; }
      ti.komponist=v; await atemzug(); await loadLibrary(); render();
    };

    const bz=document.createElement('div'); bz.className='muted'; bz.style.margin='10px 2px 0';
    bz.textContent='Buch: '+((buch&&buch.name)||'ohne Buch');
    card.append(bz);

    /* Die Blaetter des Titels. Auf dem Schalter steht das Etikett,
       verglichen wird das Instrument — geaendert wird also das Instrument,
       und das Etikett folgt, solange keines von Hand gesetzt ist. */
    const els=(BS_KATALOG.elemente||[]).filter(e=>e.titelId===titelId)
      .sort((a,b)=>(a.reihung||0)-(b.reihung||0));
    const kopf=document.createElement('div'); kopf.className='lbl';
    kopf.style.margin='14px 0 6px';
    kopf.textContent=els.length ? ('Blätter ('+els.length+')') : 'Blätter';
    card.append(kopf);
    if(!els.length){
      const e=document.createElement('div'); e.className='muted';
      e.textContent='Noch nichts an diesem Titel.'; card.append(e);
    }
    const zeigName = e => zeigStimme(e.etikett, e.instrument) || BS.ARTEN[e.art].name;
    els.forEach(e=>{
      const r=document.createElement('div'); r.className='row';
      r.style.cssText='margin:0 0 8px;gap:8px;align-items:center;flex-wrap:wrap';
      const nf=document.createElement('input'); nf.className='txt';
      nf.value=zeigName(e); nf.style.cssText='flex:1 1 150px;min-width:0';
      nf.title=BS.ARTEN[e.art].name+' · '+(e.dateiname||'ohne Datei');
      nf.onchange=async()=>{
        const neu=nf.value.trim();
        /* Wer das Feld nur verlaesst, darf den Anzeigenamen nicht als eigenes
           Etikett festschreiben. Sonst waere „Alto" ploetzlich von Hand
           getippt und liesse sich nie wieder glattziehen. Dieselbe Vorsicht
           wie in Content. */
        if(!neu || neu===zeigName(e)){ nf.value=zeigName(e); return; }
        try{ await BS.aendern('element', e.id, {etikett:neu}); }
        catch(err){ alert('Umbenennen fehlgeschlagen: '+(err&&err.message||err)); return; }
        await loadLibrary(); render(); titelBearbeiten(titelId);
      };
      r.append(nf);
      r.append(AWAHL.knopf(()=>{
        const jetzt=(BS_KATALOG.elemente||[]).find(x=>x.id===e.id) || e;
        const wert=jetzt.instrument||'';
        const eintraege=stimmenAuswahlBestand();
        const tr=eintraege.find(x=>x.wert===wert)||eintraege[0];
        return { wert, eintraege, text:tr.text, ton:tr.ton };
      }, async neu=>{
        await saveLibMeta(e.id, {voice:neu});   /* laedt und zeichnet selbst neu */
        titelBearbeiten(titelId);
      }, 'Stimme festlegen'));
      card.append(r);
    });

    /* Schritt 2, die kontextbezogene Haelfte: Schickt ein Kollege die Bari-Stimme
       zu einem Stueck, das schon im Bestand steht, gehoert sie an diesen Titel
       und nirgends sonst. Der Kontext ist damit vollstaendig, es ist nichts zu
       fragen — nur die Datei zu waehlen. Dieselben zwei Griffe wie in Content
       auf der Element-Ebene, hier ohne den Umweg dorthin. */
    const neu=document.createElement('div'); neu.className='row';
    neu.style.cssText='margin:12px 0 0;gap:8px;flex-wrap:wrap';
    const waehle=(arten, kamera, umbau)=>{
      if(!window.dateiWaehlen){ alert('Die Dateiwahl steht erst nach dem vollständigen Laden bereit.'); return; }
      window.dateiWaehlen(async fs=>{
        let z=0; const schief=[];
        for(const f of [].concat(fs)){
          try{
            const {blob, art, name} = await umbau(f);
            /* Ein Foto braucht ein Etikett, sonst faellt es aus der Gruppe
               seines Titels: `bsZuTune` steckt ein Element ohne Stimme in eine
               eigene Gruppe, und der Titel stand danach zweimal in der Liste.
               Am 7. August von Jens gemeldet. */
            const eti = art==='foto'
              ? 'Foto'+((()=>{ const d=(BS_KATALOG.elemente||[])
                    .filter(e=>e.titelId===titelId && e.art==='foto').length+z;
                  return d?' '+(d+1):''; })())
              : '';
            await BS.elementAnlegen({ titelId, art, etikett:eti, dateiname:name, blob,
              np:art==='foto'?1:await BS.seitenzahl(blob) });
            z++;
          }catch(e){ schief.push(f.name||'eine Datei'); }
        }
        await loadLibrary(); render(); titelBearbeiten(titelId);
        alert(z+(z===1?' Blatt':' Blätter')+' zu „'+(ti.titel||'diesem Titel')+'" gelegt.'
          + (schief.length ? '\n\nNicht lesbar: '+schief.join(', ') : ''));
      }, arten, !kamera, kamera);
    };
    const bl=knopf=>{ const b=document.createElement('button'); b.className='btn ghost sm';
      b.innerHTML=knopf.html; b.onclick=knopf.tu; neu.append(b); };
    /* Text statt Symbol bei den beiden Foto-Wegen: Der Symbolsatz der App kennt
       weder Kamera noch Bild, und ein Emoji kommt nicht in Frage. Content
       beschriftet dieselben zwei Griffe ebenso. */
    bl({html:'<i class="i ic-plus"></i> Blätter', tu:()=>waehle(
      'application/pdf,.pdf,.musicxml,.mxl,.xml,.abc', false,
      async f=>({blob:f,
                 art: istLeadsheet(f.name, f.type) ? 'leadsheet' : 'blatt',
                 name:f.name||'Blatt.pdf'}))});
    bl({html:'Kamera', tu:()=>waehle('image/*', true,
      async f=>({blob:await fotoAlsPDF(f), art:'foto',
                 name:String(f.name||'Foto').replace(/\.[^.]+$/,'')+'.pdf'}))});
    bl({html:'Aus Fotos', tu:()=>waehle('image/*', false,
      async f=>({blob:await fotoAlsPDF(f), art:'foto',
                 name:String(f.name||'Foto').replace(/\.[^.]+$/,'')+'.pdf'}))});
    card.append(neu);

    const fuss=document.createElement('div'); fuss.className='row'; fuss.style.marginTop='12px';
    const weiter=document.createElement('span'); weiter.className='link';
    weiter.textContent='Im Content öffnen';
    weiter.onclick=()=>{ closeSheet(); if(window.contentZeigen) window.contentZeigen([titelId]); };
    const luft=document.createElement('span'); luft.style.flex='1';
    const ok=document.createElement('button'); ok.className='btn'; ok.textContent='Fertig';
    ok.onclick=closeSheet;
    fuss.append(weiter, luft, ok); card.append(fuss); a11y(card);
  });
}

/* ================================================================
   Schritt 2: der Empfang eines einzelnen Titels

   Der Pruefstein aus dem Content-Konzept, Fassung 2: Einen von einem Kollegen
   geschickten Titel ins richtige Buch zu bekommen, darf nicht mehr Handgriffe
   kosten, als heute ein Foto hinzuzufuegen.

   Der grosse Import mit Vorschau und Regeln bleibt, wo er ist — er richtet die
   Bibliothek ein. Was hier steht, ist seine kleine Gestalt: Sie nimmt EINE
   Sendung an und faellt dabei nicht aus der Liste heraus.

   Ein Eingang, zwei Sorten. Ein nacktes PDF braucht noch ein Buch, und Titel
   und Stimme werden wie beim grossen Import aus dem Dateinamen gelesen. Ein
   BandStand-Paket bringt Titel und Kennung mit und fuehrt sich selbst
   zusammen; weil die Kennungen erhalten bleiben, verdoppelt ein zweites
   Einlesen nichts. Erkannt wird das an der Datei und nicht vom Nutzer
   erfragt.
   ================================================================ */
/* ================================================================
   Nach einem Import muss zu sehen sein, was hereingekommen ist

   Jens hat am 2. August ein Buch mit 56 Titeln eingelesen. Der Import lief
   durch, das Buch stand im Bestand, die Liste blieb leer. Der Fehler lag
   nicht im Import, sondern in einem Filter.

   `matches()` zeigt eine Zeile nur, wenn ihr Buch in `S.books` steht — und
   `S.books` wird beim Start aus `rb_defaultbooks` gefuellt. Wer je einmal
   „Als Standard setzen" gedrueckt hat, sieht jedes neu angelegte Buch nicht.
   Ohne Meldung, ohne Hinweis, bei jedem Start aufs Neue. Dasselbe gilt fuer
   den Anfangsbuchstaben, die Suche, eine Tag-Auswahl und jede Ansicht ausser
   „Alle".

   Deshalb raeumt ein Import sie alle weg. Was gerade hereingekommen ist, hat
   Vorrang vor jeder frueheren Einschraenkung — und weil eine Standardauswahl
   sonst beim naechsten Start wieder zuschlagen wuerde, faellt auch sie. Das
   geschieht nicht stillschweigend: Die Meldung nennt es.
   ================================================================ */
function nachImportZeigen(){
  const hatteBuchfilter = S.books.size>0 || (typeof DEFAULT_BOOKS!=='undefined' && DEFAULT_BOOKS.length>0);
  const hatteEnge = hatteBuchfilter || !!S.initial || !!S.q || S.tagFilter.size>0 || S.view!=='all';
  S.view='all'; S.openSet=null;
  S.books=new Set(); S.initial=''; S.q=''; S.tagFilter=new Set();
  const feld=document.getElementById('q'); if(feld) feld.value='';
  if(typeof DEFAULT_BOOKS!=='undefined' && DEFAULT_BOOKS.length){
    DEFAULT_BOOKS.length=0;
    try{ localStorage.removeItem('rb_defaultbooks'); }catch(e){}
  }
  save(); render();
  const m=document.getElementById('main'); if(m) m.scrollTop=0;
  return hatteEnge;
}
/* Wie viele Titel stehen jetzt in der Liste? Die Zahl gehoert in die Meldung:
   Sie ist der Beleg dafuer, dass das Eingelesene wirklich da ist. */
function titelInDerListe(){
  try{ return zuZeilen(ALL().filter(matches)).length; }
  catch(e){ return (BS_KATALOG.titel||[]).length; }
}
/* Wie viele lose Blaetter noch als „kurzer Fall" gelten.

   Der Pruefstein aus dem Content-Konzept lautet: Einen vom Kollegen
   geschickten Titel ins richtige Buch zu bekommen, darf nicht mehr Handgriffe
   kosten als ein Foto. Ein einzelnes Blatt durch die Vorschau zu schicken
   waere genau der Umweg, den der Pruefstein verbietet.

   Bei einem groesseren Stapel kippt das Verhaeltnis: Dort will man vorher
   sehen, was entsteht. Die Grenze ist gesetzt und nicht gemessen — sie
   trennt „ein Kollege schickt etwas" von „ich richte etwas ein". */
const EMPFANG_KURZ = 5;
async function empfangen(files){
  const liste=[...(files||[])].filter(Boolean);
  if(!liste.length) return;
  const istPaket = f => /\.zip$/i.test(f.name||'') || /zip/i.test(f.type||'');
  const istPdf   = f => /\.pdf$/i.test(f.name||'') || /pdf$/i.test(f.type||'');
  const pakete=liste.filter(istPaket);
  const pdfs  =liste.filter(f=>!istPaket(f) && istPdf(f));
  const rest  =liste.filter(f=>!istPaket(f) && !istPdf(f));
  if(rest.length)
    alert('Nicht angenommen: '+rest.map(f=>f.name||'eine Datei').join(', ')
      +'\n\nDer Empfang nimmt Notenblätter als PDF und BandStand-Pakete. '
      +'Ein Foto legst Du über „Bearbeiten" an den Titel, zu dem es gehört.');
  for(const p of pakete) await importPackage(p);
  if(!pdfs.length) return;
  /* Lose Blaetter tragen keine Ordner. Es gibt also nichts zu deuten, und der
     kurze Weg verliert nichts — er fragt nach dem Buch und liest Titel und
     Stimme aus dem Dateinamen. Erst ein groesserer Stapel geht durch die
     Vorschau, wo man ihn vorher nachzaehlen kann. */
  if(pdfs.length<=EMPFANG_KURZ){ empfangenBuchFlow(pdfs); return; }
  window.importVorschau(pdfs.map(f=>({file:f, pfad:f.name})),
    pdfs.length+' Blätter empfangen.\n\n'
    +'Es ist noch nichts geschrieben. Titel und Stimme werden aus den '
    +'Dateinamen gelesen — prüfe die Vorschau und schreib dann.');
}
/* Der zweite Eingang: das Teilen-Blatt des Geraets.

   Das Manifest meldet BandStand als Ziel an; waehlt man die App dort aus,
   nimmt der Service Worker die Dateien entgegen, legt sie in ein eigenes
   Cache-Fach und oeffnet die App mit `?geteilt=1`. Hier werden sie abgeholt
   und dasselbe `empfangen` gerufen wie beim Knopf — ein Weg herein, zwei
   Tueren davor.

   Ob iOS das je ausloest, weiss ich nicht: Safari kennt Web Share Target nach
   meinem Kenntnisstand nicht. Es kostet wenig, es anzubieten, und der Knopf
   bleibt unabhaengig davon der sichere Weg. */
async function geteiltesAbholen(){
  if(!/[?&]geteilt=1/.test(location.search)) return;
  /* Die Adresse gleich saeubern: Ein Neuladen soll nicht zweimal einlesen. */
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  try{
    const cache=await caches.open('geteilt-bs');
    const schluessel=await cache.keys();
    const files=[];
    for(const k of schluessel){
      const r=await cache.match(k); if(!r) continue;
      const blob=await r.blob();
      const name=decodeURIComponent((new URL(k.url).pathname.split('/').pop())||'Datei');
      files.push(new File([blob], name, {type:blob.type||''}));
      await cache.delete(k);
    }
    if(files.length) await empfangen(files);
  }catch(e){}
}
/* Die dritte Tuer: eine Datei auf die Liste ziehen.

   Auf dem iPad laesst sich in der geteilten Ansicht eine Datei aus „Dateien"
   in die daneben liegende App ziehen; am Mac geht dasselbe aus dem Finder.
   Damit entfaellt der Weg ueber die Dateiauswahl, und die Sendung landet mit
   einem Zug im Bestand.

   Der Baustein war schon da, aber nur auf der Seite „Noten hinzufügen". Hier
   fuehrt er in dasselbe `empfangen` wie der Knopf: ein Weg herein, drei
   Tueren davor. Ob iPadOS-Safari eine Datei aus einer fremden App wirklich
   als Ablage durchreicht, kann nur Jens sagen — am Mac ist es geprueft. */
function ablageAnmelden(){
  /* Angemeldet wird am ganzen Dokument, nicht an der Listenspalte.

     Der Grund kam am 2. August vom iPad: In der geteilten Ansicht ist das
     Fenster schmal, BandStand geht ins Hochformat, und dort schliessen Noten
     und Liste einander aus. Wer gerade ein Blatt offen hat, sieht keine
     Liste — und haette nichts, worauf er ziehen koennte. Eine Ablageflaeche,
     die nur auf der Liste liegt, ist genau dann nicht da, wenn man sie
     braucht. Jetzt nimmt das ganze Fenster an. */
  const nurDateien = dt => !!dt && [...(dt.types||[])].includes('Files');
  const eigenerZug = e => !!(e.target && e.target.closest
                        && e.target.closest('[data-zielflaeche]'));
  const gesperrt = () => {
    const ed=document.getElementById('editor');
    return !!(ed && ed.classList.contains('open'));   /* nicht beim Zeichnen */
  };
  const halt=e=>{ e.preventDefault(); e.stopPropagation(); };
  ['dragenter','dragover'].forEach(n=>document.addEventListener(n, e=>{
    if(!nurDateien(e.dataTransfer) || eigenerZug(e) || gesperrt()) return;
    halt(e); e.dataTransfer.dropEffect='copy'; document.body.dataset.ablage='1';
  }));
  ['dragleave','dragend'].forEach(n=>document.addEventListener(n, e=>{
    /* Nur loeschen, wenn der Zeiger das Fenster wirklich verlassen hat. */
    if(n==='dragleave' && e.relatedTarget) return;
    delete document.body.dataset.ablage;
  }));
  document.addEventListener('drop', e=>{
    if(!nurDateien(e.dataTransfer) || eigenerZug(e) || gesperrt()) return;
    halt(e); delete document.body.dataset.ablage;
    const files=[...(e.dataTransfer.files||[])];
    if(files.length) empfangen(files);
  });
}
/* Wohin gehoert die Sendung? Gefragt wird einmal und nur nach dem Buch — den
   Titel liest der Import aus dem Dateinamen, und ob er an einen vorhandenen
   Titel andockt, fragt `importPdfs` selbst. */
function empfangenBuchFlow(pdfs){
  openSheet(card=>{
    const n=pdfs.length;
    card.innerHTML='<h2>'+n+(n===1?' Blatt empfangen':' Blätter empfangen')+'</h2>'
      +'<div class="muted" style="margin:-6px 0 12px">'
      +esc(pdfs.map(f=>f.name||'Blatt').slice(0,4).join(', '))
      +(n>4?' und '+(n-4)+' weitere':'')
      +'<br>Titel und Stimme werden aus dem Dateinamen gelesen. In welches Buch?</div>';
    /* Ein Weg fuer beide Faelle: Das vorhandene Buch und das eben angelegte
       unterscheiden sich nur in der Kennung. */
    const hinein=async(bid, name)=>{
      closeSheet();
      const z=await importPdfs(bid, pdfs, true);
      await loadLibrary(); const eng=nachImportZeigen();
      alert(z+(z===1?' Blatt':' Blätter')+' in „'+name+'" aufgenommen.'
        +'\n\nIn der Liste stehen jetzt '+titelInDerListe()+' Titel.'
        +(eng ? '\n\nDie Liste war eingeschränkt und steht jetzt auf „Alle".' : ''));
    };

    /* Die vorhandenen Buecher standen schon zur Wahl, aber ohne Ueberschrift
       und ohne Zahl — und wer noch kein Buch hat, las die eine graue Zeile als
       „geht nicht". Jens hat am 2. August berichtet, er koenne nur neu
       anlegen. Jetzt sagen zwei Ueberschriften, dass es zwei Wege gibt, und
       jedes Buch nennt, wie viele Titel schon darin stehen. */
    const kopf=(text)=>{ const d=document.createElement('div'); d.className='lbl';
      d.style.margin='14px 0 6px'; d.textContent=text; card.append(d); };

    if(USERBOOKS.length){
      kopf('In ein vorhandenes Buch');
      const wrap=document.createElement('div'); wrap.className='row'; wrap.style.flexWrap='wrap';
      USERBOOKS.forEach(b=>{
        const zahl=(BS_KATALOG.titel||[]).filter(t=>t.buchId===b.bid).length;
        const c=document.createElement('div'); c.className='chip';
        c.innerHTML=esc(b.name)+' <span class="muted">('+zahl+')</span>';
        c.onclick=()=>hinein(b.bid, b.name);
        wrap.append(c);
      });
      card.append(wrap);
      kopf('Oder ein neues Buch anlegen');
    } else {
      kopf('Ein neues Buch anlegen');
      const h=document.createElement('div'); h.className='muted';
      h.style.margin='0 2px 8px';
      h.textContent='Es gibt noch kein Buch. Sobald eines da ist, steht es hier zur Wahl.';
      card.append(h);
    }

    const nr=document.createElement('div'); nr.className='row newrow'; nr.style.margin='0';
    nr.innerHTML='<input class="txt" id="nb" placeholder="Name des Buchs, z. B. Blauton"><button class="btn" id="mkb">Anlegen</button>';
    card.append(nr);
    const anlegen=async()=>{
      const v=nr.querySelector('#nb').value.trim(); if(!v) return;
      /* Traegt schon ein Buch diesen Namen, wird es weiterbenutzt, statt ein
         zweites gleichen Namens danebenzustellen. Dieselbe Regel wie beim
         gepackten Ordner. */
      const da=USERBOOKS.find(b=>b.name.toLowerCase()===v.toLowerCase());
      if(da) return hinein(da.bid, da.name);
      let buch; try{ buch=await BS.buchAnlegen({name:v}); }
      catch(e){ alert('Buch anlegen fehlgeschlagen: '+(e&&e.message||e)); return; }
      await loadLibrary();
      hinein(buch.id||buch, v);
    };
    nr.querySelector('#mkb').onclick=anlegen;
    const close=document.createElement('div'); close.className='row'; close.style.marginTop='12px';
    close.innerHTML='<button class="btn ghost" id="ab" style="flex:1">Abbrechen</button>';
    close.querySelector('#ab').onclick=closeSheet; card.append(close);
    a11y(card);
  });
}

function render(){
  const sig=S.view+'|'+(S.openSet||'');
  if(S._sig!==sig){ S.selection.clear(); S._sig=sig; }
  requestAnimationFrame(()=>{ a11y(); renderSelBar(); });
  renderTabs(); renderAZ(); renderBooks();
  /* Der Suchschlitz steht seit dem 28. Juli ueber der Liste und bleibt in
     jeder Ansicht stehen; #controls ist nur noch die leere Huelle der alten
     Kopfzeile. */
  /* Aendert sich der Filter, faengt die Liste oben an. Wer einen
     Anfangsbuchstaben waehlt, will dessen erste Zeile sehen — vorher blieb der
     alte Rollstand stehen, und bei „M" landete man am Ende der M-Liste.
     Aendert sich nur der Inhalt einer Zeile, etwa durch einen Tipp auf
     Favorit, bleibt die Liste stehen, wo sie steht. */
  const fsig=[S.view, S.openSet||'', S.q, S.initial, S.sonstOn?1:0,
              [...S.books].sort().join(','), [...S.tagFilter].sort().join(',')].join('|');
  const filterNeu = (S._fsig!==fsig); S._fsig=fsig;
  /* Die Rollposition wird VOR dem Leeren gemerkt. Eine leere Flaeche klemmt
     scrollTop sofort auf null — wer erst danach nachsieht, liest immer null,
     und die Liste spraenge bei jedem Tipp auf Favorit an den Anfang.
     Gemerkt wird nicht der Pixelwert, sondern das Stueck, das oben stand. */
  const main=document.getElementById('main');
  const merke = filterNeu ? null : fensterMerken(main); main.innerHTML='';
  if(S.view==='set'){ renderSets(main); return; }
  if(S.view==='recent'){ renderRecent(main); return; }
  const zeilen=zuZeilen(currentList());
  kontextzeile(zeilen.length); markeZahlen();
  if(!zeilen.length){ main.innerHTML='<div class="empty">Keine Treffer.</div>'; LISTNAV=[]; listFix(); return; }
  /* Geblaettert wird von Stueck zu Stueck, nicht von Ausgabe zu Ausgabe.
     Darum steht je Zeile genau ein Schluessel im Kontext: der der Stimme,
     die aufgeht. */
  const schluessel=zeilen.map(z=>z.zeige.key);
  LISTNAV=schluessel;
  LISTGIDS=zeilen.map(z=>z.gid);
  listFix();
  /* Solange ein Anfangsbuchstabe gewaehlt ist, entfallen die Gruppentitel —
     sie wuerden nur denselben Buchstaben ueber der ganzen Liste wiederholen. */
  /* Die Zeile „Alle auswählen" geht MIT hinein und steht dann unmittelbar
     ueber der ersten Zeile — nicht mehr im Kopfbereich darueber. */
  listeAufbauen(main, zeilen, !S.initial, merke, selectAllRow(schluessel));
}

/* ================================================================
   Die Liste legt nur an, was zu sehen ist.

   Jens hat am 28. Juli auf dem iPad gemessen: Das Drehen kostete bei
   4.310 Zeilen 310 ms, bei 440 Zeilen 33 ms. Nicht das Zeichnen der
   Liste ist teuer, sondern ihr Umbruch — und der faellt bei jeder
   Aenderung der Spaltenbreite an, also bei jedem Drehen. Der Versuch,
   die Zeilen ueber content-visibility vom Umbruch auszunehmen, wirkt in
   Chromium und auf seinem Safari nicht.

   Deshalb stehen jetzt nur noch die Zeilen im Dokument, die man sehen
   kann, dazu ein Puffer darueber und darunter. Ober- und unterhalb haelt
   je ein leerer Platzhalter die Gesamthoehe, damit die Bildlaufleiste
   stimmt.

   Nur fuer lange Listen. Kurze werden vollstaendig gezeichnet, und die
   Tag-Ansichten immer — dort wird durch Ziehen sortiert, und das setzt
   voraus, dass alle Zeilen dastehen.

   ---------------------------------------------------------------
   Warum der Ausgleich ueber ein Element laeuft und nicht ueber Summen

   Der erste Anlauf rechnete: Er addierte die geschaetzten Hoehen aller
   Eintraege oberhalb, und wenn eine Messung eine Schaetzung widerlegte,
   setzte er scrollTop um die Differenz nach. Gemessen: 48 von 50
   Rollschritten landeten woanders, und scrollTop schoss je Schritt um
   rund 7.000 px vor.

   Der Grund ist eine Rueckkopplung. Das Nachsetzen von scrollTop
   verschiebt das Fenster, dadurch kommen neue, noch ungemessene Zeilen
   herein, deren Messung wieder nachgesetzt wird — und weil die
   Schaetzung zu klein war, ging es immer in dieselbe Richtung. Eine
   Sperre gegen das eigene Roll-Ereignis half nicht: Die Ereignisse
   werden verzoegert zugestellt, die Sperre schluckte das falsche.

   Jetzt wird scrollTop beim Rollen ueberhaupt nicht mehr angefasst.
   Statt dessen merkt sich die Liste, welcher Eintrag die Oberkante des
   Sichtfelds beruehrt und wie weit er schon hinausgerollt ist. Nach dem
   Neuzeichnen wird nachgesehen, wohin dieser Eintrag geraten ist, und
   der obere Platzhalter genau um diesen Unterschied verstellt. Damit
   steht die Zeile wieder, wo sie stand — ohne Rechnung ueber Summen,
   ohne Annahme ueber Raender, ohne Rueckkopplung.

   Die Summen bleiben, aber nur noch fuer drei Dinge, bei denen ein
   Schaetzfehler nichts kostet: wie viele Eintraege ins Fenster passen,
   wie hoch der untere Platzhalter ist, und wo ein Sprung landet.
   ================================================================ */
const FENSTER_AB  = 600;   /* ab so vielen Eintraegen wird ausgeschnitten */
const PUFFER      = 12;    /* Eintraege ueber und unter dem Sichtfeld */
/* Startschaetzung, bis eine Zeile wirklich gemessen ist. 100 px sind der
   gemessene Schnitt NACH Schritt 3 — die Stimmen-Schalter haben die Zeile
   hoeher gemacht, und mit dem alten Wert 89 lag die Gesamthoehe um zehn
   Prozent daneben. */
let   H_ZEILE     = 100;
const H_BUCHSTABE = 44;

let FEN = null;
let LISTE_ZEILEN = 0;
window.listeZeilenZahl = () => LISTE_ZEILEN;

function eintraegeBauen(zeilen, gruppiert){
  const aus=[]; let cur=null;
  zeilen.forEach(z=>{
    if(gruppiert){ const L=initialOf(z.zeige); if(L!==cur){ cur=L; aus.push({art:'L', text:L}); } }
    aus.push({art:'Z', z});
  });
  return aus;
}
/* Der Buchstabe war bisher ein div neben der Liste. Als Eintrag IN der
   Liste laesst er sich mit den Zeilen zusammen ausschneiden. */
function eintragZeichnen(e){
  if(e.art==='L'){ const li=document.createElement('li'); li.className='group-letter';
                   li.textContent=e.text; return li; }
  return tuneRow(e.z.zeige, e.z.stimmen);
}

/* Welches Stueck steht oben im Bild, und wie weit ist es hinausgerollt? Wird
   vor dem Neuzeichnen gemerkt und danach wiederhergestellt. Ueber die
   Gruppen-Kennung, nicht ueber den Schluessel: Der wechselt mit der Stimme. */
function fensterMerken(main){
  if(!FEN || FEN.haupt!==main) return { y:main.scrollTop };
  const a=ankerAusDok();
  if(!a) return { y:main.scrollTop };
  const e=FEN.eintraege[a.i];
  return { y:main.scrollTop, gid:(e.art==='Z' ? e.z.gid : null), v:a.v };
}

/* `kopf` ist ein Knoten, der VOR der Liste stehen soll — seit dem 2. August
   die Zeile „Alle auswählen". Sie muss durch diese Funktion hindurch: Sie
   leert `main` selbst, und ein Anhaengen davor waere spurlos weg. Ein
   Anhaengen danach wiederum verschoebe die gemerkte Rollposition, die hier
   unten gesetzt wird. */
function listeAufbauen(main, zeilen, gruppiert, merke, kopf){
  const eintraege = eintraegeBauen(zeilen, gruppiert);
  /* Wie viele Zeilen die Liste im Ganzen hat — fuer die Messzeile im Setup.
     Ohne sie liest sich „37 Zeilen" wie ein Verlust von Noten, obwohl es der
     Erfolg ist: 37 im Dokument von 4.309 in der Liste. */
  LISTE_ZEILEN = zeilen.length;
  const lang = eintraege.length>=FENSTER_AB && !S.view.startsWith('tag:');
  document.body.dataset.fenster = lang ? 'an' : 'aus';
  if(FEN && FEN.haupt) FEN.haupt.removeEventListener('scroll', fensterAnstossen);
  main.innerHTML='';
  if(kopf) main.append(kopf);
  if(!lang){
    FEN=null;
    const ul=document.createElement('ul'); ul.className='list';
    eintraege.forEach(e=>ul.append(eintragZeichnen(e)));
    main.append(ul);
    main.scrollTop = (merke&&merke.y)||0;
    return;
  }
  const oben =document.createElement('div'); oben.className='fensterplatz';
  const ul   =document.createElement('ul');  ul.className='list';
  const unten=document.createElement('div'); unten.className='fensterplatz';
  main.append(oben, ul, unten);
  FEN={ eintraege, hoehen:eintraege.map(e=>e.art==='L'?H_BUCHSTABE:H_ZEILE),
        gemessen:new Uint8Array(eintraege.length), mSumme:0, mZahl:0,
        summen:null, start:-1, ende:-1, obenH:0, oben, unten, ul, haupt:main,
        breite:main.clientWidth, padOben:0 };
  polsterMessen();
  summenNeu();
  /* Erst die Gesamthoehe herstellen, dann die gemerkte Position setzen — eine
     leere Flaeche wuerde scrollTop auf null klemmen. */
  unten.style.height = FEN.summen[eintraege.length]+'px';
  let ziel = (merke&&merke.y)||0;
  if(merke && merke.gid){
    const i=eintraege.findIndex(e=>e.art==='Z' && e.z.gid===merke.gid);
    if(i>=0) ziel = Math.max(0, FEN.summen[i]+merke.v);
  }
  main.scrollTop = ziel;
  fensterSetzen();
  main.addEventListener('scroll', fensterAnstossen, {passive:true});
}

function summenNeu(){
  const h=FEN.hoehen, s=new Array(h.length+1); s[0]=0;
  for(let i=0;i<h.length;i++) s[i+1]=s[i]+h[i];
  FEN.summen=s;
}
const versatz = i => FEN.summen[Math.max(0, Math.min(i, FEN.summen.length-1))];
/* Welcher Eintrag liegt bei dieser Hoehe? Binaere Suche ueber die Summen. */
function indexBei(y){
  const s=FEN.summen; let lo=0, hi=s.length-2;
  while(lo<hi){ const m=(lo+hi+1)>>1; if(s[m]<=y) lo=m; else hi=m-1; }
  return lo;
}

let fensterUhr=0;
function fensterAnstossen(){
  if(!FEN || fensterUhr) return;
  fensterUhr=requestAnimationFrame(()=>{ fensterUhr=0; fensterSetzen(); });
}

/* Welcher Eintrag beruehrt die Oberkante des Sichtfelds, und wie weit ist er
   schon darueber hinaus? Gelesen wird aus dem Dokument, nicht aus einer
   Gesamtrechnung — nur deshalb steht die Zeile nach dem Nachladen wieder da,
   wo sie stand.

   Ein schneller Wisch kann den Puffer ueberholen; dann liegt die Oberkante
   ausserhalb des Gezeichneten. Statt die ganze Liste neu aufzusetzen, wird
   von der ersten beziehungsweise letzten gezeichneten Zeile aus
   weitergerechnet. Geschaetzt wird dann nur ueber die wenigen
   uebersprungenen Zeilen, nicht ueber alles davor — gemessen: 11 px
   Abweichung statt 94. */
/* Bezugskante ist der Anfang des INHALTS, nicht der Rahmen der Flaeche. Die
   Liste hat oben eine Polsterung; wer gegen den Rahmen misst, haelt bei
   scrollTop null den Anker sechs Pixel zu hoch und rollt sie jedes Mal wieder
   heraus. Gemessen: Die Liste liess sich nicht ganz an den Anfang rollen. */
function polsterMessen(){
  FEN.padOben = FEN.haupt.clientTop + (parseFloat(getComputedStyle(FEN.haupt).paddingTop)||0);
}
const inhaltKante = () => FEN.haupt.getBoundingClientRect().top + FEN.padOben;

function ankerAusDok(){
  if(!FEN || FEN.start<0) return null;
  const kinder=FEN.ul.children; if(!kinder.length) return null;
  const kante=inhaltKante();
  const letzter=FEN.eintraege.length-1;
  /* Weitergerechnet wird hoechstens ueber so viele Zeilen. Darueber hinaus
     summierten sich die Schaetzfehler: Ein Sprung von 120.000 px zurueck auf
     null blieb 928 px ueber dem Anfang haengen. So weite Spruenge setzen
     neu auf — dort ist die Gesamtrechnung das genauere Mittel. */
  const GRENZE = PUFFER*3;
  const erst=kinder[0].getBoundingClientRect();
  if(erst.top > kante){
    let d=erst.top-kante, i=FEN.start, n=0;
    while(i>0 && d>0 && n<GRENZE){ i--; d-=FEN.hoehen[i]; n++; }
    if(d>0 && i>0) return null;
    return { i, v:Math.max(0,-d) };
  }
  for(let i=0;i<kinder.length;i++){
    const r=kinder[i].getBoundingClientRect();
    if(r.bottom > kante) return { i:FEN.start+i, v:kante-r.top };
  }
  let d=kante-FEN.ul.getBoundingClientRect().bottom, i=FEN.ende+1, n=0;
  while(i<letzter && d>=FEN.hoehen[i] && n<GRENZE){ d-=FEN.hoehen[i]; i++; n++; }
  if(i<letzter && d>=FEN.hoehen[i]) return null;
  return { i:Math.min(i,letzter), v:Math.max(0,d) };
}

function fensterSetzen(){
  if(!FEN) return;
  const haupt=FEN.haupt, letzter=FEN.eintraege.length-1;
  const sicht=haupt.clientHeight||600;
  let anker=ankerAusDok(), aufsetzen=false;
  if(!anker){
    const i=indexBei(haupt.scrollTop);
    anker={ i, v:haupt.scrollTop-versatz(i) };
    aufsetzen=true;
  }

  /* Das Fenster wird vom Anker aus abgesteckt, nicht aus dem Rollstand
     gerechnet: Der Anker ist gemessen, der Rollstand nur geschaetzt. */
  const start=Math.max(0, anker.i-PUFFER);
  let ende=anker.i, h=0;
  while(ende<letzter && h < anker.v+sicht){ h+=FEN.hoehen[ende]; ende++; }
  ende=Math.min(letzter, ende+PUFFER);
  if(!aufsetzen && start===FEN.start && ende===FEN.ende) return;

  FEN.start=start; FEN.ende=ende;
  const teil=document.createDocumentFragment();
  for(let i=start;i<=ende;i++) teil.append(eintragZeichnen(FEN.eintraege[i]));
  FEN.ul.replaceChildren(teil);

  /* Jetzt stehen die echten Hoehen fest. Gemessen wird ueber den Abstand zum
     naechsten Eintrag, nicht ueber die eigene Hoehe: So sind die Raender mit
     drin, auch wenn sie zusammenfallen. */
  const kinder=FEN.ul.children;
  let geaendert=false;
  if(kinder.length){
    const kanten=new Array(kinder.length+1);
    for(let i=0;i<kinder.length;i++) kanten[i]=kinder[i].getBoundingClientRect().top;
    kanten[kinder.length]=FEN.ul.getBoundingClientRect().bottom;
    for(let i=0;i<kinder.length;i++){
      const hh=Math.round(kanten[i+1]-kanten[i]); if(hh<=0) continue;
      const k=start+i;
      if(hh!==FEN.hoehen[k]){ FEN.hoehen[k]=hh; geaendert=true; }
      /* Die Schaetzung fuer die noch ungemessenen Zeilen ist der laufende
         Schnitt ueber alles bisher Gemessene. Ein Schnitt nur ueber das
         Sichtfeld schwankte je nach Gegend um Dutzende Pixel, und mit ihm
         die Gesamthoehe und die Bildlaufleiste. */
      if(!FEN.gemessen[k]){
        FEN.gemessen[k]=1;
        if(FEN.eintraege[k].art==='Z'){ FEN.mSumme+=hh; FEN.mZahl++; }
      }
    }
    if(FEN.mZahl>=20){
      const neu=Math.round(FEN.mSumme/FEN.mZahl);
      if(Math.abs(neu-H_ZEILE)>2){
        H_ZEILE=neu;
        /* Nachgezogen wird nur UNTERHALB des Fensteranfangs. Wer auch die
           Eintraege darueber neu schaetzt, verschiebt den gerechneten
           Listenanfang, waehrend der obere Platzhalter stehen bleibt — beide
           Rechnungen laufen dann auseinander, und beim naechsten Neuzeichnen
           spraenge die Liste um Hunderte Pixel. Gemessen: ein Tipp auf
           Favorit trug sie fort. Oberhalb aendert sich also nie etwas; die
           Bildlaufleiste wird trotzdem besser, weil der weitaus groessere
           Teil der Liste unterhalb liegt. */
        for(let k=start;k<FEN.hoehen.length;k++)
          if(!FEN.gemessen[k] && FEN.eintraege[k].art==='Z'){ FEN.hoehen[k]=H_ZEILE; geaendert=true; }
      }
    }
  }
  if(geaendert) summenNeu();

  /* Der Ausgleich. Nachgesehen wird, wohin der Anker geraten ist, und der
     obere Platzhalter um genau diesen Unterschied verstellt. scrollTop bleibt
     unberuehrt — daran ist der erste Anlauf gescheitert. */
  let obenH;
  if(aufsetzen){ obenH=versatz(start); }
  else {
    const el=kinder[anker.i-start];
    const ist=inhaltKante() - el.getBoundingClientRect().top;
    obenH=FEN.obenH + (ist-anker.v);
  }
  /* Am Anfang der Liste steht kein Platz mehr zur Verfuegung: Dort MUSS der
     Platzhalter null sein, sonst klaffte ueber der ersten Zeile eine Luecke. */
  const geklemmt = (start===0 || obenH<0);
  if(geklemmt) obenH=0;
  FEN.obenH=obenH;
  FEN.oben.style.height  = obenH+'px';
  FEN.unten.style.height = (ende>=letzter ? 0 : Math.max(0, versatz(letzter+1)-versatz(ende+1)))+'px';

  /* Nachgerollt wird nur in zwei Faellen: beim Aufsetzen nach einem Sprung und
     wenn der Platzhalter geklemmt wurde. Beides loest ein weiteres
     Roll-Ereignis aus, das beim naechsten Durchgang nichts mehr zu tun findet
     — die Sache laeuft sich fest, statt sich aufzuschaukeln. Im Regelfall,
     also beim gewoehnlichen Rollen, wird scrollTop gar nicht angefasst. */
  if((geklemmt||aufsetzen) && kinder.length){
    const el=kinder[anker.i-start];
    const ist=inhaltKante() - el.getBoundingClientRect().top;
    if(Math.abs(ist-anker.v)>0.5) haupt.scrollTop += (anker.v-ist);
  }
}

/* Nach dem Drehen sind alle gemessenen Hoehen ungueltig — die Spalte ist
   anders breit, und die Metazeile bricht anders um. Der Eintrag, der oben
   stand, bleibt oben. */
window.fensterNeuMessen = function(){
  if(!FEN) return;
  if(FEN.haupt.clientWidth===FEN.breite) return;
  FEN.breite=FEN.haupt.clientWidth;
  const anker=ankerAusDok();
  polsterMessen();
  FEN.gemessen=new Uint8Array(FEN.eintraege.length); FEN.mSumme=0; FEN.mZahl=0;
  FEN.hoehen=FEN.eintraege.map(e=>e.art==='L'?H_BUCHSTABE:H_ZEILE);
  summenNeu();
  neuAufsetzen(anker ? versatz(anker.i)+anker.v : FEN.haupt.scrollTop);
};
/* Zu einer Gruppe rollen, auch wenn ihre Zeile gerade nicht dasteht. */
window.zuGruppeRollen = function(gid){
  if(!FEN) return false;
  const i=FEN.eintraege.findIndex(e=>e.art==='Z' && e.z.gid===gid);
  if(i<0) return false;
  neuAufsetzen(Math.max(0, versatz(i) - Math.max(0,(FEN.haupt.clientHeight-FEN.hoehen[i])/2)));
  return true;
};
/* Ein Sprung setzt die Liste auf den geschaetzten Stand zurueck. Damit der
   Rollstand ueberhaupt erreichbar ist, muss die Flaeche vorher hoch genug
   sein — deshalb erst die volle Gesamthoehe, dann rollen, dann einpassen. */
function neuAufsetzen(y){
  FEN.oben.style.height='0px'; FEN.obenH=0;
  FEN.unten.style.height=versatz(FEN.eintraege.length)+'px';
  FEN.start=-1; FEN.ende=-1;
  FEN.haupt.scrollTop=y;
  fensterSetzen();
}

/* Die gefilterten Blaetter zu Zeilen buendeln: je Stueck eine.

   Gebuendelt wird nur, was zu einer Buchfamilie gehoert. Alles andere bleibt
   fuer sich, und zwar ohne Sonderfall — Stuecke ohne Familie tragen ihre
   eigene Kennung als Gruppe.

   Welche Stimmen eine Zeile traegt, entscheidet die Buchauswahl: Gefiltert
   wird VOR dem Buendeln. Ist nur die B-Ausgabe gewaehlt, hat die Zeile eine
   Stimme, und die geht auf. Damit koennen Buchauswahl und Stimmenwahl sich
   nicht widersprechen. */
function zuZeilen(blaetter){
  const nach=new Map(); const zeilen=[];
  blaetter.forEach(t=>{
    if(!t.fam){ zeilen.push({gid:t.gid, stimmen:[t], zeige:t}); return; }
    let z=nach.get(t.gid);
    if(!z){ z={gid:t.gid, stimmen:[], zeige:null}; nach.set(t.gid,z); zeilen.push(z); }
    z.stimmen.push(t);
  });
  zeilen.forEach(z=>{
    /* Eigene Stimme zuerst, dann nach der Voice-Liste, bei gleichem Instrument
       nach dem Etikett — sonst stehen „Alt 2" und „Alt 1" in zufaelliger
       Reihenfolge. */
    if(z.stimmen.length>1) stimmenOrdnen(z.stimmen);
    z.zeige=waehleStimme(z.stimmen);
  });
  return zeilen;
}
window.zuZeilen = zuZeilen;

/* collapsible panels: Bücher + Anfangsbuchstabe */
function setupCollapse(toggleId, wrapId, stateKey, lsKey){
  const h=document.getElementById(toggleId), wrap=document.getElementById(wrapId);
  const set=()=>{ h.classList.toggle('open',S[stateKey]); wrap.classList.toggle('closed',!S[stateKey]); };
  h.onclick=()=>{ S[stateKey]=!S[stateKey]; localStorage.setItem(lsKey,S[stateKey]?'1':'0'); set(); };
  set();
}
setupCollapse('bookToggle','bookwrap','booksOpen','rb_booksopen');

/* ---------- Viewer ---------- */
let CURRENT=null, fitOn=false;
let LISTNAV=[];               // Keys der aktuell angezeigten Liste (Kontext-Blättern)
/* Die Gruppen-Kennung je Zeile, in derselben Reihenfolge. Ohne sie findet ein
   Stueck seinen Platz im Blaetter-Kontext nicht, sobald eine andere als die
   angezeigte Stimme offen ist — der Kontext traegt ja den Schluessel der
   C-Ausgabe. Genau daran hing das Blaettern fest. */
let LISTGIDS=[];
let NAV={keys:[],idx:0};      // aktueller Blätter-Kontext im Betrachter
function openViewer(t, keepNav){
  CURRENT=t; fitOn=false;
  /* Das aktive Stueck ist etwas anderes als das gerade geoeffnete. Es bleibt
     aktiv, bis ein anderes gewaehlt wird — auch wenn im Hochformat ueber den
     Hamburger zur Liste zurueckgegangen wird. Daran haengen die Auszeichnung
     in der Liste und die Buehne nach dem Drehen. */
  window.aktivesStueck = t.key;
  if(!keepNav){
    /* Erst ueber den Schluessel, dann ueber die Gruppe. Ohne den zweiten Weg
       fand eine E-Ausgabe ihren Platz in der Liste nicht, der Kontext schrumpfte
       auf ein einziges Stueck, und das Blaettern stand still. */
    let i=LISTNAV.indexOf(t.key);
    if(i<0 && t.gid) i=LISTGIDS.indexOf(t.gid);
    NAV = (i>=0)?{keys:LISTNAV.slice(), idx:i} : {keys:[t.key], idx:0};
  }
  document.getElementById('vTitle').textContent=t.t;
  document.getElementById('vSub').textContent = t.isEdit
    ? ('Notiz'+(t.editor?' von '+t.editor:'')+(t.editedAt?' — '+new Date(t.editedAt).toLocaleString('de-DE'):''))
    : t.isLib ? ((t.c?t.c+' — ':'')+t.b)
    : ((t.c?t.c+' — ':'')+t.b+', S. '+t.pg);
  const frame=document.getElementById('vFrame'), fit=document.getElementById('vFit');
  document.getElementById('viewer').classList.remove('fullscreen'); fitOn=false;
  resetFrameStyle();
  document.getElementById('vFitBtn').classList.remove('on');
  document.getElementById('vFitBtn').style.display='flex';
  document.getElementById('vEditBtn').style.display = t.isEdit ? 'none':'flex';
  { const kb=document.getElementById('vKeyBtn'); if(kb) kb.style.display='none'; }
  const vMeta=document.getElementById('vMetaBtn');
  vMeta.style.display = 'flex';                                     // Titel/Komponist – Großsammlung, importierte Stücke UND Notizen
  vMeta.onclick=()=>openMetaSheet(t);
  const vt=document.querySelector('.vtitle');                       // Titel/Komponist direkt antippbar
  if(vt){ vt.style.cursor='pointer'; vt.title='Titel & Komponist bearbeiten'; vt.onclick=()=>openMetaSheet(CURRENT); }
  document.getElementById('vShare').onclick=()=>shareTune(t);
  document.getElementById('vPrint').onclick=()=>printCurrent(t);
  if(t.art==='leadsheet'){
    /* Zuerst geprueft, denn ein Leadsheet ist auch `isLib` — es kommt aus dem
       eigenen Bestand. Gesetzt wird es trotzdem und nicht angezeigt. */
    frame.style.display='none'; frame.src='about:blank';
    fit.style.display='flex'; document.getElementById('vTab').style.display='none';
    lsKnopfBeschriften(t);
    fitOn=true; renderLeadFit(t);
  } else if(t.art==='chordsheet'){
    /* Wie ein Leadsheet aus dem eigenen Bestand — aber ohne Setzer. */
    frame.style.display='none'; frame.src='about:blank';
    fit.style.display='flex'; document.getElementById('vTab').style.display='none';
    fitOn=true; renderChordFit(t);
  } else if(t.isEdit){
    frame.style.display='none'; frame.src='about:blank';
    fit.style.display='flex'; document.getElementById('vTab').style.display='none';
    renderUserFit(t);
  } else if(t.isLib){
    // Importiertes PDF: direkt über PDF.js (Blob) einpassen – zuverlässiger als Blob im Iframe (Safari)
    frame.style.display='none'; frame.src='about:blank';
    fit.style.display='flex'; document.getElementById('vTab').style.display='none';
    fitOn=true; renderPdfFit(t);
  } else {
    /* Das Blatt wird ueber PDF.js in die Hoehe eingepasst — im Querformat in
       die Buehne, im Hochformat in den Bildschirm. Safaris native Anzeige im
       Iframe passt die Seite nicht ein: quer lief sie rechts heraus, hoch sass
       sie oben mit leerer Flaeche darunter. Faellt PDF.js aus, greift der
       Rueckfallpfad in renderPdfFit und setzt das Iframe frisch. */
    fit.style.display='flex'; fit.innerHTML='';
    frame.style.display='none'; frame.src='about:blank';
    /* Im Hochformat bleibt '↗' erreichbar: Es oeffnet das PDF in einem eigenen
       Tab, wo Safaris Betrachter das Zoomen mit zwei Fingern anbietet. */
    const tab=document.getElementById('vTab');
    tab.style.display = (document.body.dataset.o==='land') ? 'none':'flex';
    tab.onclick=async()=>{ const u=await urlSichern(t); if(u) window.open(encodeURI(u),'_blank'); };
    fitOn=true; renderPdfFit(t);
  }
  updateNavUI();
  document.getElementById('viewer').classList.add('open');
  if(window.layout) window.layout();
  markPlayed(t);
}
function updateNavUI(){
  const multi=NAV.keys.length>1;
  const nav=document.getElementById('seqnav');
  if(!multi){ nav.style.display='none'; nav.innerHTML=''; }
  else{
    nav.style.display='flex';
    nav.innerHTML='<button class="btn ghost" id="navPrev" title="Vorheriges">‹</button>'
      +'<span id="navPos" style="align-self:center;color:var(--sub);font-size:13px;white-space:nowrap"></span>'
      +'<button class="btn ghost" id="navNext" title="Nächstes">›</button>';
    document.getElementById('navPos').textContent=(NAV.idx+1)+' / '+NAV.keys.length;
    const pv=document.getElementById('navPrev'), nx=document.getElementById('navNext');
    pv.disabled=!navKann(-1); nx.disabled=!navKann(1);
    pv.onclick=()=>navGo(-1); nx.onclick=()=>navGo(1);
  }
  const fp=document.getElementById('vFsPrev'), fn=document.getElementById('vFsNext');
  fp.hidden=!multi; fn.hidden=!multi;
  fp.disabled=!navKann(-1); fn.disabled=!navKann(1);
}
/* Ob ein Schritt ueberhaupt etwas bringt. Muss dieselben Faelle kennen wie
   `navGo`, sonst steht der Pfeil auf dem letzten Stueck grau, obwohl dahinter
   noch zwei Notizen liegen. */
function navKann(delta){
  if(notizBlaetternAn() && CURRENT){
    const n=notizenVon(CURRENT);
    if(n.length){
      const i=n.findIndex(x=>x.key===CURRENT.key);
      if(delta>0 && i<n.length-1) return true;
      if(delta<0 && i>=0)         return true;
    }
  }
  const i=NAV.idx+delta;
  return NAV.keys.length>1 && i>=0 && i<NAV.keys.length;
}
/* ---------- Notizen als weitere Seiten ----------
   Beim Blaettern kann ein Notizblatt wie eine weitere Seite des Stueckes
   gelten: Erst nach der letzten Notiz springt die Darstellung auf den
   naechsten Titel. Zwei Schalter, weil das Stoebern in der Liste etwas
   anderes ist als das Durchspielen einer Setlist. Am 8. August von Jens
   gewuenscht, beide Male voreingestellt an.

   Gezaehlt werden NUR Notizblaetter — nicht die Fotos am selben Titel und
   nicht die alten Eintraege unter „Bearbeitet", die als eigenstaendige
   Stuecke in der Liste stehen und dort ohnehin angeblaettert werden.

   Der Zustand steckt in CURRENT und braucht kein Gedaechtnis: Steht ein
   Notizblatt auf der Buehne, geht es zum naechsten desselben Titels; steht
   ein Notenblatt da, geht es zur ersten Notiz. `NAV.idx` bleibt dabei auf
   dem Stueck stehen — der Zaehler „3 / 17" soll Stuecke zaehlen, nicht
   Blaetter. */
function notizBlaetternWert(wo){
  return localStorage.getItem('bs_notiz_'+wo) !== '0';
}
function notizBlaetternSetzen(wo,an){
  localStorage.setItem('bs_notiz_'+wo, an?'1':'0');
}
function notizBlaetternAn(){
  return notizBlaetternWert((S.view==='set' && S.openSet) ? 'setlist' : 'liste');
}
/* Die Notizblaetter eines Stueckes, „Notizen" vor „Notizen 2". */
function notizenVon(t){
  if(!t || !t.gid || typeof GRUPPEN==='undefined' || !GRUPPEN[t.gid]) return [];
  return GRUPPEN[t.gid].filter(x=>x.art==='notizblatt')
    .sort((a,b)=>(a.stimme||'').localeCompare(b.stimme||'','de',{numeric:true}));
}
/* Das Blatt, das die Zeile an dieser Stelle zeigt.

   Die gewaehlte Stimme geht mit zum naechsten Stueck, sofern es sie hat.
   Wer eine Setlist in B durchspielt, bleibt in B. Sonst gilt, was die Zeile
   ohnehin zeigen wuerde.

   Der Wunsch ist ein eigener Zustand und wird NICHT aus CURRENT.stimme
   gelesen. Bis zum 28. Juli war er das, und dann loeschte ihn jedes Stueck
   ohne transponierte Ausgaben — dort ist die Stimme leer. Gemessen: Nach
   „Bass" wischte man weiter, traf „1983" ohne Ausgaben, und Bass war
   verloren. Schlimmer noch setzte „500 Miles High", das es nur in E gibt,
   den Wunsch versehentlich auf E, und der ueberstimmte danach das
   Instrument. */
function stueckAn(i){
  let t=byKey[NAV.keys[i]]; if(!t) return null;
  const wunsch = STIMMWUNSCH;
  if(wunsch && t.fam && GRUPPEN[t.gid]){
    const gleiche = GRUPPEN[t.gid].find(x=>x.stimme===wunsch);
    if(gleiche) t=gleiche;
  }
  return t;
}
function navGo(delta){
  const wasFull=document.getElementById('viewer').classList.contains('fullscreen');
  const zeige=t=>{ if(!t) return; openViewer(t, true); if(wasFull) enterFullscreen(); };

  /* Erst die Notizen des laufenden Stueckes, dann das naechste. Steht das
     Notenblatt auf der Buehne, ist `i` gleich -1 und `n[i+1]` die erste
     Notiz. */
  if(notizBlaetternAn() && CURRENT){
    const n=notizenVon(CURRENT);
    if(n.length){
      const i=n.findIndex(x=>x.key===CURRENT.key);
      if(delta>0 && i<n.length-1) return zeige(n[i+1]);
      if(delta<0 && i>0)          return zeige(n[i-1]);
      if(delta<0 && i===0)        return zeige(stueckAn(NAV.idx));
    }
  }

  if(NAV.keys.length<2) return;
  const i=NAV.idx+delta; if(i<0||i>=NAV.keys.length) return;
  NAV={keys:NAV.keys, idx:i};
  const t=stueckAn(i); if(!t) return;
  /* Rueckwaerts ins vorige Stueck: dort gleich an dessen LETZTE Notiz, damit
     der Weg vorwaerts und rueckwaerts derselbe ist. Ohne das kaeme man beim
     Zurueckblaettern nie an die Notizen des vorigen Stueckes. */
  if(delta<0 && notizBlaetternAn()){
    const n=notizenVon(t);
    if(n.length) return zeige(n[n.length-1]);
  }
  zeige(t);
}

/* ---------- Blaettern: Blatt fuer Blatt ----------
   Ein Wisch bewegt genau ein Blatt weiter, gleich wie kraeftig gewischt wird.
   Dafuer scrollt die Flaeche nicht mehr von selbst (overflow:hidden); wir
   setzen die Position auf die Kante des naechsten Blattes. Liegt in
   Wischrichtung kein Blatt mehr, geht es zum naechsten Stueck. */
function blattKanten(){
  const fit=document.getElementById('vFit');
  const fr=fit.getBoundingClientRect(), pl=parseFloat(getComputedStyle(fit).paddingLeft)||0;
  return [...fit.querySelectorAll('.pg')]
    .map(c=>Math.round(c.getBoundingClientRect().left - fr.left + fit.scrollLeft - pl));
}
function blaettern(vor){
  const fit=document.getElementById('vFit');
  if(!document.getElementById('viewer').classList.contains('open')) return;
  const k=blattKanten(), jetzt=fit.scrollLeft;
  /* Die Kante des letzten Blattes ist oft gar nicht erreichbar: Dahinter liegt
     nur noch der Rand, und die Flaeche laesst sich nicht weiter schieben als
     bis scrollWidth minus clientWidth. Im Querformat fiel das nicht auf, weil
     Blatt und Flaeche dort fast gleich breit sind — im Hochformat blieb das
     Blaettern nach der zweiten Seite haengen, weil das Ziel immer 45 px vor
     dem lag, was die Flaeche hergibt. Deshalb wird das Ziel begrenzt, und wenn
     es uns nicht weiterbringt, geht es zum naechsten Stueck. */
  const grenze = Math.max(0, fit.scrollWidth - fit.clientWidth);
  let ziel = vor ? k.find(x=>x>jetzt+4) : k.slice().reverse().find(x=>x<jetzt-4);
  if(ziel!==undefined) ziel = Math.max(0, Math.min(ziel, grenze));
  const bringtNichts = (ziel===undefined) || (vor ? ziel<=jetzt+4 : ziel>=jetzt-4);
  if(bringtNichts){ navGo(vor?1:-1); return; }
  gleite(fit, ziel);
}
/* Weiches Blaettern: Der eingebaute Weg sprang hart, weil Safari die eigene
   Glaettung bei programmatischem Scrollen kaum ausfuehrt. 340 ms mit einer
   Kurve, die weich anfaengt und weich ausklingt. */
function gleite(el, ziel){
  const start=el.scrollLeft, weg=ziel-start, dauer=340;
  if(Math.abs(weg)<2){ el.scrollLeft=ziel; return; }
  cancelAnimationFrame(gleite._f);
  const t0=performance.now();
  const schritt=now=>{
    const p=Math.min(1,(now-t0)/dauer);
    const e = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    el.scrollLeft = start + weg*e;
    if(p<1) gleite._f=requestAnimationFrame(schritt);
  };
  gleite._f=requestAnimationFrame(schritt);
}
(function(){
  const el=document.getElementById('vFit'); let x0=null,y0=null,t0=0;
  el.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
  el.addEventListener('touchend',e=>{ if(x0==null)return; const c=e.changedTouches[0]; const dx=c.clientX-x0, dy=c.clientY-y0; x0=null;
    if(Date.now()-t0>1200) return;
    if(Math.abs(dx)<40 || Math.abs(dx)<Math.abs(dy)*1.2) return;
    blaettern(dx<0); },{passive:true});
})();
/* Pfeiltasten links/rechts blättern (funktionieren, wenn nicht in der Nativ-PDF-Ansicht fokussiert) */
document.addEventListener('keydown',e=>{

/* ---------- Teilen (Web Share) + Drucken ---------- */
function safeName(s){ return (s||'Stück').replace(/[\/\\:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80); }
async function fetchAsFile(t){
  if(t.isEdit){ const pages=await idbGetPages(t.key); if(!pages.length) return null;
    const bl=await (await fetch(pages[0])).blob(); return new File([bl], safeName(t.t)+'.png',{type:'image/png'}); }
  /* Aus der neuen Ablage direkt die Bytes nehmen, ohne Umweg ueber eine URL. */
  if(t.bsId){ const bl=await BS.bytes(t.bsId); if(!bl) return null;
    /* Ein Leadsheet ist kein PDF. Es unter falschem Namen weiterzugeben
       hiesse, dem Empfaenger eine Datei zu schicken, die kein Programm
       oeffnet. Die Endung kommt vom Dateinamen im Bestand. */
    if(t.art==='leadsheet'){
      const el=(BS_KATALOG.elemente||[]).find(x=>x.id===t.bsId)||{};
      const nm=el.dateiname || (safeName(t.t)+'.musicxml');
      const endung=(/\.([a-z0-9]+)$/i.exec(nm)||[,'xml'])[1].toLowerCase();
      const typ = endung==='mxl' ? 'application/vnd.recordare.musicxml'
                : endung==='abc' ? 'text/vnd.abc' : 'application/vnd.recordare.musicxml+xml';
      return new File([bl], safeName(t.t)+'.'+endung, {type:typ});
    }
    return new File([bl], safeName(t.t)+'.pdf',{type:'application/pdf'}); }
  const bl=await (await fetch(encodeURI(t.f))).blob(); return new File([bl], safeName(t.t)+'.pdf',{type:'application/pdf'});
}
async function shareTune(t){
  if(!t) return;
  /* Ein Leadsheet laesst sich auf drei Arten weitergeben, und sie meinen
     Verschiedenes. Deshalb wird gefragt, statt eine davon zu erraten.
     So verlangt es das Konzept unter „Notizen, Einfrieren und Teilen". */
  if(t.art==='leadsheet'){ return lsTeilenBlatt(t); }
  await urlSichern(t);
  /* Ein Blatt aus der eigenen Ablage hat keine teilbare Adresse — sein Verweis
     gilt nur in dieser Sitzung. Geteilt wird dann die Datei, nicht die URL. */
  const title=t.t, url=t.bsId ? '' : new URL(encodeURI(t.f), location.href).href;
  // 1) Datei teilen (iPad/iPhone + neuere macOS): öffnet den Apple-Share-Dialog inkl. Drucken
  try{ const f=await fetchAsFile(t);
    if(f && navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  // 2) URL teilen (öffnet auch auf dem Mac den Apple-Share-Dialog)
  try{ if(navigator.share && url){ await navigator.share({title, url}); return; }
       if(navigator.share){ await navigator.share({title, text:title}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  // 3) Web Share nicht verfügbar (z. B. Doppelklick/file://)
  alert('Weitergeben ist hier nicht verfügbar – es funktioniert in der installierten App bzw. über die veröffentlichte Adresse oder localhost. Ich öffne stattdessen den Druck-Dialog.');
  printCurrent(t);
}
function printCurrent(t){
  if(!t) return;
  if(t.isEdit){ printImages(t); return; }
  const frame=document.getElementById('vFrame');
  try{ if(frame && frame.style.display!=='none' && frame.contentWindow){ frame.contentWindow.focus(); frame.contentWindow.print(); return; } }catch(e){}
  /* Liegt das Blatt auf der Buehne, ist sein Verweis schon geliehen und der
     Klick bleibt eine Nutzerhandlung. Nur wenn nicht, muss gewartet werden —
     dafuer wird das Fenster vorher geoeffnet, sonst greift der Pop-up-Blocker. */
  if(t.f){ const w=window.open(encodeURI(t.f),'_blank');
    try{ w&&w.addEventListener&&w.addEventListener('load',()=>{try{w.print();}catch(e){}}); }catch(e){}
    return; }
  const w=window.open('','_blank'); if(!w){ alert('Bitte Pop-ups erlauben, um zu drucken.'); return; }
  urlSichern(t).then(url=>{
    if(!url){ try{ w.close(); }catch(e){} alert('Für diesen Titel ist keine Datei hinterlegt.'); return; }
    w.location.href=encodeURI(url);
    try{ w.addEventListener('load',()=>{try{w.print();}catch(e){}}); }catch(e){}
  });
}

/* ---------- Tags: assign to a tune ---------- */
/* Beide Bestandteile hatten Millisekunden-Aufloesung, und damit lieferte `uid`
   bei mehreren Aufrufen in derselben Millisekunde denselben Wert. Am 2. August
   nachgemessen: sechs Aufrufe hintereinander ergaben sechsmal dieselbe Kennung.

   Von Hand ist das kaum zu erreichen — man tippt keine zwei Tags in einer
   Millisekunde. Trifft es doch zu, ist der Schaden still und unangenehm: Zwei
   Tags mit derselben Kennung sind fuer die App ein Tag, und wer den einen
   vergibt, vergibt den anderen mit. Der Zaehler schliesst das aus, ohne an
   vorhandenen Kennungen etwas zu aendern. */
let uidZaehler=0;
function uid(p){return (p||'x')+Math.abs(Date.now()%1e7)+Math.floor(performance.now()%1000)

function setupTagDnD(card){
  const zones=[...card.querySelectorAll('.tagzone')]; let d=null;
  function zoneAt(x,y){ return zones.find(z=>{const r=z.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}); }
  function move(e){ if(!d)return; d.moved=true; const z=zoneAt(e.clientX,e.clientY); zones.forEach(zz=>zz.classList.toggle('over',zz===z)); }
  function up(e){ if(!d)return; const z=zoneAt(e.clientX,e.clientY);
    zones.forEach(zz=>zz.classList.remove('over')); d.el.classList.remove('dragging');
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    const id=d.id, moved=d.moved; d=null;
    if(z && moved){ const tag=tagById(id); const want=z.dataset.pinned==='1';
      if(tag && !!tag.pinned!==want){ tag.pinned=want; tag.updatedAt=Date.now(); save(); manageTagsFlow(); render(); } }
  }
  card.querySelectorAll('.tagcard').forEach(el=>{
    el.addEventListener('pointerdown',e=>{ if(e.target.closest('[data-e=edit]'))return; if(d)return; e.preventDefault();
      d={el,id:el.dataset.tag,moved:false}; el.classList.add('dragging');
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up); });
  });
}

function renderOneSet(main){
  const st=S.sets.find(s=>s.id===S.openSet); if(!st){S.openSet=null;return render();}
  const head=document.createElement('div'); head.className='controls'; head.style.padding='12px 8px';
  /* Der Kopf ist am 2. August auf eine Zeile zusammengezogen worden. Vorher
     standen darunter „Weitergeben" und „Drucken" und ein Hinweis auf den
     Ziehgriff — zusammen gut hundert Pixel ueber der Liste, auf die es
     ankommt. Die beiden Knoepfe stehen mit einer Auswahl ohnehin in der
     Auswahl-Leiste, und der Griff erklaert sich beim Anfassen. */
  head.innerHTML=`<div class="row"><span class="link" id="back">‹ Setlists</span></div>
    <h2 style="margin:4px 2px;font-size:20px"><span class="setlbl">Setlist:</span> ${esc(st.name)} <span class="muted">(${st.items.length})</span></h2>`;
  main.append(head);
  head.querySelector('#back').onclick=()=>{S.openSet=null;render();};
  /* „Setlist löschen" steht ganz unten und in Rot. Im Kopf lag es einen
     Fingerbreit neben Drucken und Weitergeben — ein Fehlgriff dort ist teuer,
     und Jens hat das am 31. Juli als gefaehrlich gemeldet. Ans Ende zu gehen
     ist der Vorsatz, den es hier braucht. */
  const loeschZeile=()=>{
    const f=document.createElement('div'); f.className='row';
    f.style.cssText='padding:22px 10px 40px;justify-content:center';
    const b=document.createElement('button'); b.className='btn ghost warn';
    b.innerHTML='<i class="i ic-trash-2"></i> Setlist löschen';
    b.onclick=()=>{ if(!confirm('Setlist „'+st.name+'" löschen?\n\n'
      +'Die Stücke selbst bleiben im Bestand; nur die Liste geht weg.')) return;
      S.sets=S.sets.filter(s=>s.id!==st.id); S.openSet=null; save(); render(); };
    f.append(b); main.append(f);
  };
  if(!st.items.length){main.insertAdjacentHTML('beforeend','<div class="empty">Leer. Füge Titel über ＋ hinzu.</div>');LISTNAV=[];loeschZeile();return;}
  LISTNAV=st.items.filter(k=>byKey[k]);
  listFix();
  /* Unmittelbar ueber der ersten Zeile. Vorher lag es im Kopfbereich ueber der
     Liste — bei einer geoeffneten Setliste zweihundert Pixel entfernt, hinter
     Namen, Knoepfen und Sortierhinweis. */
  main.append(selectAllRow(st.items.filter(k=>byKey[k])));
  const ul=document.createElement('ul'); ul.className='list'; ul.id='setUL'; main.append(ul);
  st.items.forEach((k,i)=>{
    const t=byKey[k]; if(!t)return;
    const li=document.createElement('li'); li.className='tune'; li.dataset.key=k;
    li.dataset.gid = t.gid || t.key;
    /* Die Stimmen gehoeren in die Setliste — der wichtigste Befund der ersten
       Probe. Der Griff zur richtigen Stimme ist die haeufigste Handlung, wenn
       ein Ensemble arbeitet; eine Liste, die nur Titel zeigt, wird deshalb
       nicht benutzt.

       Gebaut wird das mit DEMSELBEN Baustein wie die Hauptliste. Zwei
       Zeilenbauer mit zwei Verhaltensweisen waeren genau die Art von
       Unterschied, die man auf der Buehne nicht gebrauchen kann. */
    /* Sortiert wird HIER und nicht beim Laden: Die Reihenfolge folgt der
       Voice-Liste, und die zieht Jens im Setup selbst zurecht. Wer sie dort
       aendert, soll das Ergebnis sofort sehen und nicht erst nach einem
       Neustart. Dieselbe Rechnung wie in `zuZeilen`. */
    const grp = (t.gid && GRUPPEN[t.gid] && GRUPPEN[t.gid].length>1)
      ? stimmenOrdnen(GRUPPEN[t.gid].slice())
      : [t];
    /* Die vier Symbole der Hauptliste fehlten hier bis zum 2. August, und das
       hat wie ein Fehler ausgesehen: Wer in der Setliste „Favorit ＋" in der
       Auswahl-Leiste antippte, aenderte den Zustand tatsaechlich — nur sah man
       davon in der Zeile nichts, weil sie keinen Stern trug. Jens hat es als
       „funktioniert nicht" gemeldet, und aus seiner Sicht stimmte das.
       Nachgemessen: `S.fav` bekam den Schluessel, die Zeile zeigte ihn nur nie.

       Derselbe Baustein wie in der Hauptliste, dieselben Marken: Traegt
       irgendeine Stimme des Stuecks den Stern, ist die Zeile ein Favorit. */
    const star=gruppeHat(S.fav,t), prac=gruppeHat(S.prac,t);
    const tt=gruppeTagIds(t);
    li.innerHTML=`<div class="handle" title="Ziehen zum Sortieren">⣿</div>
      <div class="main">
      <div class="tline"><div class="title">${i+1}. ${esc(t.t)}</div>
      ${aktionenHTML(tt.length>0,prac,star)}</div>
      <div class="meta">${t.c?esc(t.c)+' · ':''}${esc(bookName(t))} · S. ${esc(t.pg)}${seitenzahl(t)}</div>
      ${tagZeile(tt)}
      ${stimmenZeile(grp, t)}</div>
      <div class="iconbtn" data-a="rm" title="Aus der Setliste nehmen"><i class="i ic-x"></i></div>`;
    /* Ein Tipp auf die Zeile waehlt das STUECK, ein Tipp auf eine Stimme genau
       diese — wie in der Hauptliste. */
    li.querySelector('.main').onclick=()=>{ STIMMWUNSCH=''; openViewer(t); };
    verdrahteAktionen(li,t); verdrahtePillen(li); verdrahteStimmen(li);
    li.querySelector('[data-a=rm]').onclick=()=>{st.items.splice(i,1);st.updatedAt=Date.now();save();render();};
    li.prepend(selBox(k)); if(S.selection.has(k)) li.classList.add('selected');
    enableDrag(li, st); ul.append(li);
  });
  loeschZeile();
}
let drag=null;
function enableDrag(li, st){
  const h=li.querySelector('.handle');
  h.addEventListener('pointerdown',e=>{e.preventDefault();if(drag)return;
    drag={li,st,h};li.classList.add('dragging');h.style.cursor='grabbing';
    window.addEventListener('pointermove',onDragMove);window.addEventListener('pointerup',onDragEnd);window.addEventListener('pointercancel',onDragEnd);});
}
function onDragMove(e){if(!drag)return;e.preventDefault();
  const li=drag.li,ul=li.parentElement,y=e.clientY;
  const sib=[...ul.children].filter(x=>x!==li);let placed=false;
  for(const s of sib){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){ul.insertBefore(li,s);placed=true;break;}}
  if(!placed)ul.appendChild(li);}
function onDragEnd(){if(!drag)return;const li=drag.li,ul=li.parentElement;
  li.classList.remove('dragging');drag.h.style.cursor='grab';
  drag.st.items=[...ul.children].map(x=>x.dataset.key);drag.st.updatedAt=Date.now();
  window.removeEventListener('pointermove',onDragMove);window.removeEventListener('pointerup',onDragEnd);window.removeEventListener('pointercancel',onDragEnd);
  drag=null;save();render();}
