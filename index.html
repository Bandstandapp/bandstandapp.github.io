/* ---------- Daten & Offline (Export / Import / PWA) ---------- */
function exportData(){
  const data={schema:1, app:'realbook', exportedAt:new Date().toISOString(),
    fav:[...S.fav], prac:[...S.prac], sets:S.sets, tags:S.tags, tuneTags:S.tuneTags};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(); const stamp=d.toISOString().slice(0,10);
  a.download='bandstand-daten-'+stamp+'.json'; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function mergeState(obj){
  if(!obj||typeof obj!=='object') throw new Error('Ungültige Datei');
  (obj.fav||[]).forEach(k=>S.fav.add(k));
  (obj.prac||[]).forEach(k=>S.prac.add(k));
  const setById=Object.fromEntries(S.sets.map(s=>[s.id,s]));
  (obj.sets||[]).forEach(s=>{const ex=setById[s.id];
    if(!ex){S.sets.push(s);setById[s.id]=s;} else if((s.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,s);}});
  const tagById2=Object.fromEntries(S.tags.map(t=>[t.id,t]));
  (obj.tags||[]).forEach(t=>{const ex=tagById2[t.id];
    if(!ex){S.tags.push(t);tagById2[t.id]=t;} else if((t.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,t);}});
  const inTags=id=>S.tags.some(t=>t.id===id);
  for(const k in (obj.tuneTags||{})){const cur=new Set(S.tuneTags[k]||[]);
    obj.tuneTags[k].forEach(id=>cur.add(id));
    const arr=[...cur].filter(inTags); if(arr.length)S.tuneTags[k]=arr; else delete S.tuneTags[k];}
  save(); render();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result);
      const before={sets:S.sets.length,tags:S.tags.length};
      mergeState(obj);
      alert('Import zusammengeführt.\nSetlists: '+before.sets+' → '+S.sets.length+'\nTags: '+before.tags+' → '+S.tags.length);
      closeSheet();
    }catch(e){ alert('Import fehlgeschlagen: '+e.message); } };
  r.readAsText(file);
}
/* ---- Baustein 2: Einstellungen als EINZELNE Dateien (je mit Versionskennung) ---- */
const PART_META={ setlists:{label:'Setlists',file:'setlists'}, tags:{label:'Tags',file:'tags'},
  favorites:{label:'Favoriten',file:'favoriten'}, practice:{label:'Üben-Liste',file:'ueben'} };
function partPayload(kind){
  const base={schema:1, app:'realbook', kind, exportedAt:new Date().toISOString()};
  if(kind==='setlists') return {...base, sets:S.sets};
  if(kind==='tags')     return {...base, tags:S.tags, tuneTags:S.tuneTags};
  if(kind==='favorites')return {...base, fav:[...S.fav]};
  if(kind==='practice') return {...base, prac:[...S.prac]};
  return base;
}
function downloadJSON(obj, name){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportPart(kind){ const m=PART_META[kind]; if(!m) return;
  downloadJSON(partPayload(kind), 'bandstand-'+m.file+'-'+new Date().toISOString().slice(0,10)+'.json'); }
/* Merge-Bausteine: neuere Version gewinnt (updatedAt); Favoriten/Üben = Vereinigung */
function mergeSets(arr){ const by=Object.fromEntries(S.sets.map(s=>[s.id,s])); let added=0,updated=0;
  (arr||[]).forEach(s=>{ if(!s||!s.id)return; const ex=by[s.id];
    if(!ex){ S.sets.push(s); by[s.id]=s; added++; }
    else if((s.updatedAt||0)>(ex.updatedAt||0)){ Object.assign(ex,s); updated++; } });
  return {added,updated}; }
function mergeTags(tags,tuneTags){ const by=Object.fromEntries(S.tags.map(t=>[t.id,t])); let added=0,updated=0;
  (tags||[]).forEach(t=>{ if(!t||!t.id)return; const ex=by[t.id];
    if(!ex){ S.tags.push(t); by[t.id]=t; added++; }
    else if((t.updatedAt||0)>(ex.updatedAt||0)){ Object.assign(ex,t); updated++; } });
  const inTags=id=>S.tags.some(t=>t.id===id);
  for(const k in (tuneTags||{})){ const cur=new Set(S.tuneTags[k]||[]);
    (tuneTags[k]||[]).forEach(id=>cur.add(id)); const a=[...cur].filter(inTags);
    if(a.length)S.tuneTags[k]=a; else delete S.tuneTags[k]; }
  return {added,updated}; }
function importPart(file){
  const r=new FileReader();
  r.onload=()=>{ try{
      const obj=JSON.parse(r.result);
      if(!obj||typeof obj!=='object') throw new Error('Ungültige Datei');
      let msg;
      if(obj.kind==='setlists'){ const b=S.sets.length; const {added,updated}=mergeSets(obj.sets);
        msg='Setlists: '+b+' → '+S.sets.length+' ('+added+' neu, '+updated+' aktualisiert)'; }
      else if(obj.kind==='tags'){ const b=S.tags.length; const {added,updated}=mergeTags(obj.tags,obj.tuneTags);
        msg='Tags: '+b+' → '+S.tags.length+' ('+added+' neu, '+updated+' aktualisiert)'; }
      else if(obj.kind==='favorites'){ const b=S.fav.size; (obj.fav||[]).forEach(k=>S.fav.add(k));
        msg='Favoriten: '+b+' → '+S.fav.size; }
      else if(obj.kind==='practice'){ const b=S.prac.size; (obj.prac||[]).forEach(k=>S.prac.add(k));
        msg='Üben-Liste: '+b+' → '+S.prac.size; }
      else { mergeState(obj); msg='Gesamtdatei zusammengeführt (Setlists '+S.sets.length+', Tags '+S.tags.length+').'; }
      save(); render();
      alert('Import zusammengeführt.\n'+msg);
      closeSheet();
    }catch(e){ alert('Import fehlgeschlagen: '+e.message); } };
  r.readAsText(file);
}
let precacheState={running:false,done:0,total:0};
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e=>{
  const m=e.data||{};
  if(m.type==='PRECACHE_PROGRESS'){precacheState={running:true,done:m.done,total:m.total}; updatePrecacheUI();}
  if(m.type==='PRECACHE_DONE'){precacheState={running:false,done:m.total,total:m.total}; updatePrecacheUI(true);}

function updatePrecacheUI(done){

function precacheAll(){
  if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller){
    alert('Offline-Speicher ist erst nach der Installation (bzw. einem Neuladen der Seite) aktiv.'); return; }

  navigator.serviceWorker.controller.postMessage({type:'PRECACHE_ALL', urls:TUNES.map(t=>t.f)});
}

/* ---------- Eigene Noten: Bücher anlegen, PDFs importieren, verwalten ----------
   Alles unten schreibt in die neue Ablage. Die alte `libtunes` wird nicht mehr
   beschrieben und bleibt als Rueckweg unberuehrt liegen. */
async function createBook(name){ name=(name||'').trim(); if(!name) return null;
  try{ const b=await BS.buchAnlegen({name}); await loadLibrary(); return b.id; }
  catch(e){ alert('Das Buch konnte nicht angelegt werden: '+(e&&e.message||e)); return null; }
}
async function deleteBook(bid){ const ub=userBook(bid); if(!ub) return;
  const own=LIBTUNES.filter(t=>t.bid===bid);
  if(!confirm('Buch „'+ub.name+'" löschen'+(own.length?' – samt '+own.length+' Stück'+(own.length>1?'en':'')+'?':'?')
      +'\n\nDas Gelöschte liegt danach im Papierkorb.')) return;
  own.forEach(t=>urlFreigeben(t));
  try{ await BS.loeschen('buch',[bid],'Buch löschen'); }
  catch(e){ alert('Löschen fehlgeschlagen: '+(e&&e.message||e)); return; }
  S.books.delete(bid);
  await loadLibrary(); render(); openLibrarySheet(); }
/* Einzelne PDFs dazulegen — der Knopf „＋ PDF" am Buch.

   Er liest Titel und Stimme genauso aus dem Dateinamen wie der
   Bandbuch-Import. Vorher nahm er den ganzen Dateinamen als Titel: Aus
   „Afro Blue Alt 1 NEU.pdf" wurde ein Stueck namens „Afro Blue Alt 1 NEU"
   ohne Stimme. Das war beim schnellen Nachlegen einer einzelnen Datei
   unbrauchbar und hat Jens am 30. Juli zu Recht gewundert.

   Gehoeren die Blaetter zu Stuecken, die im Buch schon stehen, wird EINMAL
   gefragt. Stillschweigend zusammengelegt wird nichts — dieselbe Regel wie in
   der Vorschau des Bandbuch-Imports. */
async function importPdfs(bid, files, stumm){
  const liste=[...files].filter(f=>/pdf$/i.test(f.type||'') || /\.pdf$/i.test(f.name||''));
  if(!liste.length) return 0;

  const saetze=liste.map(file=>{
    const name=file.name||'Stück';
    let z=nameZerlegen(name, ' - ');
    /* Vertauscht wird nur, wenn der vordere Teil NICHTS ALS eine Stimme ist.
       „Alt - Blue Bossa" gehoert getauscht, „Tenor Madness - C" nicht. */
    if(z.rest){ if(nurStimme(z.titel) && !nurStimme(z.rest)) z={titel:z.rest, rest:z.titel}; }
    else { const t=titelVorStimme(name); if(t) z=t; }
    /* Unerkanntes bekommt „Not Assigned" und geht mit — dieselbe Regel wie im
       grossen Import seit dem 1. August. Ohne sie bleibt das Blatt ganz ohne
       Stimme, und ein Blatt ohne Stimme bildet in der Liste eine eigene Zeile:
       Ein empfangenes „Blue Bossa - Bariton" stand dann als zweites „Blue
       Bossa" da, obwohl es am richtigen Titel hing. Am 2. August beim Bauen
       des Empfangs aufgefallen. */
    /* Dieselbe Kette wie in der Vorschau des grossen Imports, einschliesslich
       der nackten Tonart: „Autumn Leaves - C" ist die C-Ausgabe. Sie fehlte
       hier und ist am 2. August beim Einlesen eines gepackten Ordners
       aufgefallen — dasselbe Blatt wurde im grossen Import erkannt und hier
       nicht. Gerechnet wird sie zuletzt, damit „Flöte in C" eine Flöte bleibt. */
    const auto = blattArt(z.rest) || ((voiceAusText(z.rest)||{}).name)
               || ausgabeAusText(z.rest) || OHNE_STIMME;
    return { file, pfad:name, name, kennung:name, titel:z.titel||name.replace(/\.pdf$/i,''),
             rest:z.rest||'', auto, hand:'', gruppe:'t:'+titelSchluessel(z.titel||name),
             voice:auto };
  });

  /* Was gibt es im Buch schon? */
  const imBuch={};
  (BS_KATALOG.titel||[]).filter(t=>t.buchId===bid).forEach(t=>{
    const k=titelSchluessel(t.titel||''); if(!(k in imBuch)) imBuch[k]=t.id; });
  const treffer=[...new Set(saetze.map(s=>titelSchluessel(s.titel)).filter(k=>imBuch[k]))];
  if(treffer.length){
    const andocken=confirm(
      treffer.length+' der Blätter '+(treffer.length===1?'gehört':'gehören')+' zu einem Titel, '
      +'das in diesem Buch schon steht.\n\n'
      +'OK: als weitere Stimme zum vorhandenen Titel legen\n'
      +'Abbrechen: als eigenen Titel anlegen');
    if(andocken) saetze.forEach(s=>{ const id=imBuch[titelSchluessel(s.titel)]; if(id) s.andockAn=id; });
  }

  /* Ein Paket traegt Kennungen und fuehrt sich deshalb von selbst zusammen.
     Lose PDFs tragen keine: Wer denselben Ordner ein zweites Mal einliest,
     bekaeme jedes Blatt ein zweites Mal, und niemand saehe es. Deshalb wird
     ueber den Dateinamen nachgesehen und gefragt. Am 2. August beim Bauen des
     ZIP-Empfangs aufgefallen: Ein zweites Einlesen machte aus vier Blaettern
     acht. */
  const titelDesBuchs=new Set((BS_KATALOG.titel||[]).filter(t=>t.buchId===bid).map(t=>t.id));
  const namenImBuch=new Set((BS_KATALOG.elemente||[])
    .filter(e=>titelDesBuchs.has(e.titelId) && e.dateiname)
    .map(e=>e.dateiname.toLowerCase()));
  const doppelt=saetze.filter(s=>namenImBuch.has((s.name||'').toLowerCase()));
  let zuSchreiben=saetze;
  if(doppelt.length){
    const ueberspringen=confirm(
      doppelt.length+' der Blätter '+(doppelt.length===1?'trägt':'tragen')
      +' einen Dateinamen, der in diesem Buch schon vorkommt:\n\n'
      +doppelt.slice(0,8).map(s=>'· '+s.name).join('\n')
      +(doppelt.length>8 ? '\n… und '+(doppelt.length-8)+' weitere' : '')
      +'\n\nOK: diese überspringen\nAbbrechen: trotzdem hinzufügen (sie stehen dann doppelt)');
    if(ueberspringen) zuSchreiben=saetze.filter(s=>!doppelt.includes(s));
  }
  if(!zuSchreiben.length){ if(!stumm) openLibrarySheet(); return 0; }

  const n=await importStapel(bid, zuSchreiben);
  /* Aus dem Empfang heraus wird das Buecher-Blatt NICHT aufgeschlagen: Wer in
     der Liste steht und ein Blatt vom Kollegen annimmt, will dort bleiben. */
  if(!stumm) openLibrarySheet();
  return n;
}
/* Ein Bandbuch schreiben. Erst hier, nach der Vorschau — vorher wird nichts
   angelegt und nichts geraten.

   Schritt 1b: Die Saetze werden nach ihrem Stueck gebuendelt und als Stuecke
   geschrieben, nicht mehr als einzelne Blaetter. Damit entsteht der Titel als
   eigene Sache, und die Blaetter eines Stuecks haengen an ihm. Zwei Stuecke
   desselben Namens bleiben zwei, weil die Vorschau sie getrennt fuehrt.

   Das Etikett ist Jens' Schreibweise, das Instrument das Erkannte. Beide
   werden getrennt mitgeschrieben — damit ist Schritt 3 des Import-Konzepts
   erledigt, und auf dem Schalter steht „Alt 1" statt zweimal „Alt-Sax". */
async function importStapel(bid, saetze, fortschritt){
  const alle=(saetze||[]).filter(s=>s && s.file);
  const gueltig=alle.filter(s=>
    (/pdf$/i.test(s.file.type||'') || /\.pdf$/i.test(s.file.name||'')
     || istLeadsheet(s.file.name, s.file.type)));
  /* Was hier haengenbleibt, wird gezaehlt und benannt. Vorher gab die Funktion
     stumm 0 zurueck, und der Aufrufer zeigte trotzdem ein Erfolgsbild — genau
     die Lage, in der Jens am 20. August ein leeres Buch vorfand und niemand
     sagen konnte, warum. */
  const abgewiesen=alle.filter(s=>!gueltig.includes(s))
                       .map(s=>({name:(s.file.name||'ohne Namen'), grund:'kein bekanntes Format'}));
  if(!gueltig.length){
    window._letzterImport={stuecke:0, angedockt:0, glatt:0, elemente:0,
      abgewiesen, gelesen:alle.length, fehler:[]};
    return 0;
  }

  /* Die Bytes bleiben, wo sie sind. Ausgepackt wird erst ganz unten, in
     `stueckeSchreiben`, unmittelbar bevor ein Block in die Datenbank geht.

     Der 20. August hat gezeigt, warum das hier NICHT passieren darf: Ein
     erster Versuch holte an dieser Stelle alle Dateien auf einmal — und
     verschob den Speicherberg damit nur vom Lesen zum Schreiben. Auf Jens'
     iPad hat Safari die Seite daraufhin abgeraeumt: weisser Bildschirm,
     App neu geladen, Buch angelegt und leer. */
  const bereit=gueltig;
  const fehlerBeimHolen=[];

  /* Buendeln. Die Vorschau liefert je Satz seinen Titel; gleiche Titel in
     derselben Reihenfolge gehoeren zum selben Stueck. Ein zweites Stueck mit
     demselben Namen entsteht nur, wenn die Vorschau es getrennt fuehrt —
     dafuer traegt jeder Satz seine Gruppenkennung `gruppe`, sofern gesetzt. */
  const nachStueck=new Map();
  for(const s of bereit){
    const schl = s.gruppe || ('t:'+titelSchluessel(s.titel||'Stück'));
    if(!nachStueck.has(schl)) nachStueck.set(schl,
      { titel:{titel:s.titel||'Stück'}, elemente:[],
        /* Steht hier eine Kennung, dockt das Stueck an ein vorhandenes an,
           statt ein zweites gleichen Namens anzulegen. Gesetzt wird sie in
           der Vorschau und nur dort — hier wird nie nach Namen gesucht. */
        titelId: s.andockAn || null });
    const g=nachStueck.get(schl);
    g.elemente.push({ art: istLeadsheet(s.file.name, s.file.type) ? 'leadsheet' : 'blatt',
                      etikett:'', instrument:s.voice || '',
                      dateiname:s.file.name, blob:s.file, np:1, _rest:s.rest||'' });
  }
  const gruppen=[...nachStueck.values()];

  /* ---- Das Etikett ----------------------------------------------------
     Gerechnet wird mit `etikettenBerechnen` — derselben Funktion, mit der die
     Vorschau anzeigt. Beim Andocken zaehlen die Blaetter mit, die am Stueck
     schon haengen; sonst hiessen ein vorhandenes und ein neues Alt-Blatt beide
     „Alt-Sax". Dieselben Eingaben, dasselbe Ergebnis: Was die Vorschau zeigt,
     wird auch geschrieben. */
  const glattziehen=[];
  for(const g of gruppen){
    const vorEl = g.titelId ? (BS_KATALOG.elemente||[]).filter(e=>e.titelId===g.titelId) : [];
    const tName = g.titelId
      ? (((BS_KATALOG.titel||[]).find(t=>t.id===g.titelId)||{}).titel || '')
      : (g.titel.titel||'');
    const vorhandene = vorEl.map(e=>({ instrument:e.instrument||'', etikett:e.etikett||'',
      rest: restNachTitel(e.dateiname||'', tName) }));
    const paare=g.elemente.map(e=>({instrument:e.instrument||'', rest:e._rest||''}));
    etikettenBerechnen(paare, vorhandene);
    g.elemente.forEach((e,i)=>{ e.etikett=paare[i].etikett; delete e._rest; });
    g.elemente.sort(nachStimmeOrdnen);
    /* Dieselbe Rechnung wie in der Vorschau, also auch dasselbe Ergebnis.
       Geschrieben wird es erst NACH dem Import — siehe unten. */
    vorhandene.forEach((v,i)=>{ if(v.etikett!==(vorEl[i].etikett||''))
      glattziehen.push({id:vorEl[i].id, etikett:v.etikett}); });
  }
  /* Seitenzahl aus den Bytes, mit PDF.js als Rueckfallweg. */
  let gelesen=0;
  const gesamtDateien=gueltig.length;
  for(const g of gruppen) for(const e of g.elemente){
    e.np=await BS.seitenzahl(e.blob);
    if(fortschritt) fortschritt('lesen', ++gelesen, gesamtDateien);
  }
  let ber;
  try{ ber=await BS.stueckeSchreiben(bid, gruppen, (n,g,t)=>{ if(fortschritt) fortschritt('schreiben',n,g,t); }); }
  catch(e){ alert('Import fehlgeschlagen: '+(e&&e.message||e)); return 0; }
  /* Erst jetzt die vorhandenen Etiketten glattziehen: Sie sollen sich nur
     aendern, wenn die neuen Blaetter auch wirklich angekommen sind. Scheitert
     der Import, bleibt der Bestand, wie er war. */
  let glatt=0;
  for(const g of glattziehen){
    try{ await BS.aendern('element', g.id, {etikett:g.etikett}); glatt++; }catch(e){}
  }
  await loadLibrary(); render();
  window._letzterImport = Object.assign({}, ber, {glatt,
    gelesen: alle.length,
    abgewiesen: abgewiesen.concat(fehlerBeimHolen)
                          .concat((ber.uebergangen||[]).map(u=>({name:u.name||'', grund:u.grund||''})))});
  /* Der Vermerk über diesen Lauf, dauerhaft. Er ist die Grundlage von
     „Letzten Import rückgängig machen" und muss einen Neustart überleben —
     genau dann braucht man ihn, wenn man den Fehler erst später bemerkt.
     Ein misslungener Vermerk darf den geglückten Import nicht zu Fall
     bringen, deshalb still abgefangen. */
  try{
    const buch=(BS_KATALOG.buecher||[]).find(b=>b.id===bid);
    await BS.metaSetzen('letzterImport', {
      zeit: Date.now(),
      buchId: bid, buchName: (buch&&buch.name)||'',
      titel: ber.neueTitel||[], elemente: ber.neueElemente||[],
      angedockt: ber.angedockt||0, stuecke: ber.stuecke||0 });
  }catch(e){}
  return ber.elemente;
}
/* ---- Den letzten Import zurücknehmen ------------------------------------
   Gebaut am 7. August, nachdem Jens vier Real Books versehentlich in sein
   Blauton-Buch geschrieben hatte. Danach standen 1.600 fremde Blätter zwischen
   460 eigenen, und nichts unterschied sie — er hätte alles löschen und beide
   Bestände neu einlesen müssen.

   Zurückgenommen wird über die KENNUNGEN des Laufs, nicht über Zeitstempel.
   Zeitstempel treffen daneben, sobald zwei Läufe dicht aufeinanderfolgen.

   Es geht in den Papierkorb, nicht endgültig weg: Wer sich beim Rücknehmen
   vertut, soll denselben Weg zurück haben wie beim Löschen. Das Buch selbst
   bleibt stehen — es könnte vorher schon Inhalt gehabt haben, und ein leeres
   Buch ist mit einem Griff entfernt. */
async function letztenImportZuruecknehmen(){
  let v=null; try{ v=await BS.metaHolen('letzterImport'); }catch(e){}
  if(!v || (!(v.titel||[]).length && !(v.elemente||[]).length)){
    alert('Es ist kein Import vermerkt, der sich zurücknehmen ließe.'); return false;
  }
  const k=BS_KATALOG;
  /* Nur nehmen, was es noch gibt: Zwischenzeitlich von Hand Gelöschtes oder
     Verschobenes darf die Rücknahme nicht zum Stolpern bringen. */
  const titelDa=new Set((k.titel||[]).map(t=>t.id));
  const elDa=new Set((k.elemente||[]).map(e=>e.id));
  const titel=(v.titel||[]).filter(id=>titelDa.has(id));
  /* Elemente, die an einem der neuen Titel hängen, gehen mit diesem mit —
     sie hier noch einmal zu nennen, ergäbe zwei Papierkorb-Einträge für
     dieselbe Sache. Übrig bleiben die ANGEDOCKTEN: Blätter, die an einem
     vorher vorhandenen Titel hängen. Genau die sind der schwierige Fall. */
  const anNeuen=new Set((k.elemente||[]).filter(e=>titel.includes(e.titelId)).map(e=>e.id));
  const einzeln=(v.elemente||[]).filter(id=>elDa.has(id) && !anNeuen.has(id));
  if(!titel.length && !einzeln.length){
    alert('Von diesem Import ist nichts mehr da — er wurde bereits entfernt.'); return false;
  }
  const wann=new Date(v.zeit).toLocaleString('de-DE');
  const text='Den Import vom '+wann+' zurücknehmen?\n\n'
    + (titel.length ? titel.length+(titel.length===1?' Titel':' Titel')+' samt Blättern\n' : '')
    + (einzeln.length ? einzeln.length+(einzeln.length===1?' Blatt':' Blätter')
        +', die an vorhandene Titel gehängt wurden\n' : '')
    + '\nAlles wandert in den Papierkorb und lässt sich von dort zurückholen.'
    + (v.buchName ? '\n\nDas Buch „'+v.buchName+'" bleibt stehen.' : '');
  if(!confirm(text)) return false;

  return await beiArbeit('Import wird zurückgenommen…',
    'Bitte warte, bis diese Anzeige verschwindet.',
    async()=>{
      try{
        if(titel.length)   await BS.loeschen('titel',   titel,   'Import zurückgenommen');
        if(einzeln.length) await BS.loeschen('element', einzeln, 'Import zurückgenommen');
        await BS.metaWeg('letzterImport');
        await loadLibrary(); render();
        alert('Zurückgenommen: '
          + [titel.length ? titel.length+' Titel' : '',
             einzeln.length ? einzeln.length+(einzeln.length===1?' Blatt':' Blätter') : '']
            .filter(Boolean).join(' und ')
          + '.\n\nIm Papierkorb liegt alles bereit, falls Du es doch brauchst.');
        return true;
      }catch(e){ alert('Fehlgeschlagen: '+(e&&e.message||e)); return false; }
    });
}
window.letztenImportZuruecknehmen = letztenImportZuruecknehmen;
window.importStapel = importStapel;
/* Der alte Name bleibt als Rueckweg, damit Prueflatten und Notizen aus
   frueheren Sitzungen weiter funktionieren. Ein Buch ist seit dem 5. August
   eine Sammlung von Titeln und sonst nichts — „Bandbuch" war nie ein eigener
   Typ im Datenmodell, nur ein Wort. */
window.importBandbuch = importStapel;

/* ---- Adapter auf die neue Ablage ----------------------------------------
   Die Oberflaeche ruft weiter `saveLibMeta(libId, patch)`. Nur wandern die
   Felder jetzt an die richtige Ebene: Titel und Komponist gehoeren dem STUECK,
   die Stimme dem BLATT. Genau das ist der Gewinn des eigenen Titels — ein
   Stueck umzubenennen kostet einen Schreibvorgang statt acht. */
async function saveLibMeta(id, patch){ return saveLibMetaMehrere([id], patch); }
async function saveLibMetaMehrere(ids, patch){
  ids=(ids||[]).filter(Boolean); if(!ids.length) return;
  const tunes=ids.map(id=>LIBTUNES.find(x=>x.libId===id)).filter(Boolean);
  if(!tunes.length) return;
  try{
    /* Titel und Komponist: je betroffenes Stueck EIN Schreibvorgang. */
    if('title' in patch || 'composer' in patch){
      const stueck={};
      tunes.forEach(t=>{ stueck[t.titelId]=true; });
      const p={};
      if('title' in patch) p.titel=(patch.title||'').trim()||'Stück';
      if('composer' in patch) p.komponist=(patch.composer||'').trim();
      for(const tid of Object.keys(stueck)) await BS.aendern('titel', tid, p);
    }
    /* Die Stimme: je Blatt. Das Etikett folgt der Stimme, solange der Nutzer
       kein eigenes gesetzt hat — sonst hiesse ein richtiggestelltes Blatt
       weiter wie zuvor. */
    if('voice' in patch){
      for(const t of tunes){
        const el=BS_KATALOG.elemente.find(e=>e.id===t.libId); if(!el) continue;
        const neu={instrument:patch.voice||''};
        if(!el.etikett || el.etikett===el.instrument) neu.etikett=patch.voice||'';
        await BS.aendern('element', t.libId, neu);
      }
    }
    if('etikett' in patch){
      for(const t of tunes) await BS.aendern('element', t.libId, {etikett:(patch.etikett||'').trim()});
    }
  }catch(e){ alert('Konnte die Änderung nicht speichern: '+(e&&e.message||e)); }
  await loadLibrary(); render();
}
/* Mehrere Blaetter loeschen: einmal fragen, einmal aufraeumen. Die
   Verweise in Favoriten, Uebungsliste, Tags und Setlists muessen mit weg,
   sonst zeigen sie ins Leere. */
async function deleteLibTunes(ids){
  if(!ids.length) return false;
  const namen=ids.map(id=>{ const t=LIBTUNES.find(x=>x.libId===id);
    return t ? (t.stimme ? t.t+' · '+t.stimme : t.t) : 'Blatt'; });
  const frage = ids.length===1
    ? '„'+namen[0]+'" löschen?'
    : ids.length+' Blätter löschen?\n\n'+namen.slice(0,12).join('\n')
      + (ids.length>12 ? '\n… und '+(ids.length-12)+' weitere' : '');
  if(!confirm(frage+'\n\nDas Gelöschte liegt danach im Papierkorb.')) return false;
  /* Die Verweise in Favoriten, Uebungsliste, Tags und Setlists muessen mit
     weg, sonst zeigen sie ins Leere. Der Schluessel wird am Eintrag abgelesen
     und nicht zusammengebaut — er hiess frueher `lib|…` und heisst jetzt
     `bs|…`; zusammengebaut waere er beim Umstieg still falsch geworden. */
  const schluessel=ids.map(id=>{ const t=LIBTUNES.find(x=>x.libId===id); return t&&t.key; }).filter(Boolean);
  ids.forEach(id=>{ const t=LIBTUNES.find(x=>x.libId===id); if(t) urlFreigeben(t); });
  try{ await BS.loeschen('element', ids, 'Blätter löschen'); }
  catch(e){ alert('Löschen fehlgeschlagen: '+(e&&e.message||e)); return false; }
  schluessel.forEach(k=>{ S.fav.delete(k); S.prac.delete(k); delete S.tuneTags[k];
    S.sets.forEach(st=>st.items=st.items.filter(x=>x!==k)); });
  save(); await loadLibrary(); render();
  return true;
}
async function deleteLibTune(id){ const t=LIBTUNES.find(x=>x.libId===id);
  if(!confirm('„'+((t&&t.t)||'Stück')+'" löschen?\n\nDas Gelöschte liegt danach im Papierkorb.')) return;
  const k=t&&t.key; if(t) urlFreigeben(t);
  try{ await BS.loeschen('element',[id],'Blatt löschen'); }
  catch(e){ alert('Löschen fehlgeschlagen: '+(e&&e.message||e)); return; }
  if(k){ S.fav.delete(k); S.prac.delete(k); delete S.tuneTags[k];
    S.sets.forEach(st=>st.items=st.items.filter(x=>x!==k)); save(); }
  await loadLibrary(); render(); openLibrarySheet(); }
async function exportLibTune(id){ const r=await libGet(id); if(!r||!r.blob) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(r.blob); a.download=safeName(r.title)+'.pdf';

function resetOverride(key){ const t=byKey[key]; if(!t) return; delete OVERRIDES[key]; t.t=t._ot; t.c=t._oc; saveOverrides(); rebuildByKey(); render(); }

/* ---- Foto und Notizblatt aus der Notenansicht ---------------------------
   Beide haengen das neue Blatt an den TITEL des gerade offenen Stuecks, nicht
   an das Blatt — ein Foto vom Workshop gehoert zum Stueck, gleichgueltig
   welche Stimme man gerade aufgeschlagen hat.

   `t.titelId` traegt jede Zeile der eigenen Noten. Fehlt sie, stammt das
   Stueck aus der ausgelieferten Sammlung, und dort gibt es nichts anzuhaengen.
   ------------------------------------------------------------------------ */
function dockTitelId(t){ return t && t.titelId ? t.titelId : null; }

async function dockFotoHinzu(t){
  const tid=dockTitelId(t);
  if(!tid){ alert('An dieses Stück lässt sich nichts anhängen — es stammt nicht aus Deinem eigenen Bestand.'); return; }
  window.dateiWaehlen(async fs=>{
    const liste=[].concat(fs||[]); if(!liste.length) return;
    await beiArbeit(liste.length===1?'Foto wird abgelegt…':'Fotos werden abgelegt…','',async()=>{
      let n=0; const schief=[];
      for(const f of liste){
        try{
          const pdf=await fotoAlsPDF(f);
          /* Das Etikett ist nicht Zierde, sondern entscheidet die Gruppierung:
             `bsZuTune` steckt ein Element OHNE Stimme in eine eigene Gruppe,
             und dann stand der Titel zweimal in der Liste — einmal mit allen
             Blättern, einmal nur mit dem Foto. Am 7. August von Jens gemeldet. */
          const da=(BS_KATALOG.elemente||[])
            .filter(e=>e.titelId===tid && e.art==='foto').length + n;
          await BS.elementAnlegen({ titelId:tid, art:'foto',
            etikett:'Foto'+(da?' '+(da+1):''),
            dateiname:String(f.name||'Foto').replace(/\.[^.]+$/,'')+'.pdf', blob:pdf, np:1 });
          n++;
        }catch(e){ schief.push(f.name||'ein Bild'); }
      }
      await loadLibrary(); render();
      alert(n+(n===1?' Foto':' Fotos')+' an „'+(t.t||'diesen Titel')+'" gehängt.'
        + (schief.length ? '\n\nNicht lesbar: '+schief.join(', ') : ''));
    });
  }, 'image/*', true, true);
}

/* ---------- Umzug der alten „(Edits)"-Notizen ----------
   Bis zum 9. August erzeugte der Stift auf einem vorhandenen Blatt ein
   EIGENES Stueck in „Sonstiges Material" — als Bild in der alten Datenbank
   `realbook`/`pages`, mit einem Eintrag in `rb_usertunes`. Diese Notizen
   liegen weiter herum und gehoeren dorthin, wo sie entstanden sind.

   Aus einem Bild lassen sich die STRICHE nicht zurueckgewinnen: Noten und
   Handschrift sind darin fest ineinander gebrannt. Eine echte Notiz-Ebene
   kann daraus also nicht werden. Was geht, ist der halbe Weg — und der ist
   den ganzen Nutzen wert: Aus jeder alten Notiz wird ein NOTIZBLATT am
   Ursprungstitel. Es sieht aus wie damals, haengt aber am richtigen Stueck,
   steht in der Stimmenwahl, blaettert mit und geht in den Export.

   Mehrseitige Notizen ergeben je Seite ein Blatt; `pdfMitBild` baut nur
   einseitige PDFs, und eine Seite wegzuwerfen kommt nicht in Frage. */

/* Zu welchem Titel gehoert eine alte Notiz? Ueber `baseKey` — den Schluessel
   des Blattes, auf dem geschrieben wurde. */
function altNotizZiel(u){
  const basis = u && u.baseKey ? byKey[u.baseKey] : null;
  if(basis && basis.bsId){
    const el=(BS_KATALOG.elemente||[]).find(e=>e.id===basis.bsId);
    if(el) return { titelId:el.titelId, titel:basis.t };
  }
  return null;
}
/* Was der Umzug vorfindet — zum Anzeigen, bevor etwas geschrieben wird. */
function altNotizenSchau(){
  const alle=USER.filter(u=>u.isEdit);
  const zuordenbar=[], heimatlos=[];
  alle.forEach(u=>{ (altNotizZiel(u) ? zuordenbar : heimatlos).push(u); });
  const seiten=alle.reduce((n,u)=>n+(u.np||1),0);
  return { alle, zuordenbar, heimatlos, seiten };
}
async function altNotizenUmziehen(){
  const schau=altNotizenSchau();
  if(!schau.alle.length){ alert('Es liegen keine alten Notizen vor.'); return; }

  let text='Es liegen '+zahlwortEins(schau.alle.length,'alte Notiz','alte Notizen')
    +' mit '+zahlwortEins(schau.seiten,'Seite','Seiten')+' vor.\n\n';
  if(schau.zuordenbar.length)
    text+='• '+schau.zuordenbar.length+(schau.zuordenbar.length===1
        ? ' davon wandert an ihren Ursprungstitel.\n'
        : ' davon wandern an ihren Ursprungstitel.\n');
  if(schau.heimatlos.length)
    text+='• '+schau.heimatlos.length+(schau.heimatlos.length===1
        ? ' findet ihr Stück nicht mehr und kommt'
        : ' finden ihr Stück nicht mehr und kommen')
        +' in ein neues Buch „Übernommene Notizen".\n';
  text+='\nJede wird ein Notizblatt: Sie sieht aus wie bisher, hängt aber am Stück, '
      +'blättert mit und geht in den Export.\n\n'
      +'Vorher wird gesichert. Fortfahren?';
  if(!confirm(text)) return;

  await beiArbeit('Notizen ziehen um…','', async ()=>{
    let umgezogen=0, blaetter=0; const schief=[];
    try{ await BS.sicherung('vor dem Umzug der alten Notizen'); }catch(e){}

    /* Das Auffangbuch entsteht nur, wenn es gebraucht wird. */
    let heimatBuch=null;
    const heimatTitel={};

    for(const u of schau.alle){
      try{
        const seiten=await idbGetPages(u.key);
        if(!seiten.length){ schief.push(u.t+' (keine Seiten)'); continue; }

        let titelId=null;
        const ziel=altNotizZiel(u);
        if(ziel) titelId=ziel.titelId;
        else{
          if(!heimatBuch){
            const vorhanden=USERBOOKS.find(b=>b.name==='Übernommene Notizen');
            heimatBuch = vorhanden ? {id:vorhanden.bid}
                                   : await BS.buchAnlegen({name:'Übernommene Notizen', chip:'NOTIZ'});
          }
          const name=(u.t||'Notiz').replace(/\s*\(Edits\)\s*$/,'') || 'Notiz';
          if(!heimatTitel[name]){
            const ti=await BS.titelAnlegen({buchId:heimatBuch.id, titel:name, komponist:u.c||''});
            heimatTitel[name]=ti.id;
          }
          titelId=heimatTitel[name];
        }

        for(let i=0;i<seiten.length;i++){
          /* PNG → JPEG, weil `pdfMitBild` einen DCTDecode-Strom traegt. */
          const im=await loadImg(seiten[i]);
          const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
          const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
          g.drawImage(im,0,0);
          const jpg=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
          const pdf=pdfMitBild(new Uint8Array(await jpg.arrayBuffer()), c.width, c.height);
          const wieviel=(BS_KATALOG.elemente||[]).filter(e=>e.titelId===titelId && e.art==='notizblatt').length;
          const etikett='Notiz'+(seiten.length>1 ? ' '+(i+1)+'/'+seiten.length
                                                 : (wieviel? ' '+(wieviel+1) : ''));
          await BS.elementAnlegen({ titelId, art:'notizblatt', etikett,
            dateiname:(u.t||'Notiz')+(seiten.length>1?' S'+(i+1):'')+'.pdf', blob:pdf, np:1 });
          blaetter++;
          /* Der Katalog wird zwischendurch aufgefrischt, sonst zaehlt die
             Etikett-Vergabe der naechsten Seite noch am alten Stand. */
          BS_KATALOG=await BS.katalog();
        }

        /* Erst wenn die Seiten sicher drueben sind, faellt das Alte weg. */
        try{ await idbDeletePages(u.key); }catch(e){}
        USER=USER.filter(x=>x.key!==u.key);

        umgezogen++;
      }catch(e){ schief.push((u.t||'eine Notiz')+' — '+(e&&e.message||e)); }
    }

    saveUser(); save();
    await loadLibrary(); render();
    alert(zahlwortEins(umgezogen,'Notiz ist','Notizen sind')+' umgezogen, '
      +zahlwortEins(blaetter,'Blatt','Blätter')+' angelegt.'
      + (schief.length ? '\n\nNicht umgezogen:\n• '+schief.join('\n• ')
                        +'\n\nDiese Notizen liegen unverändert weiter unter „Bearbeitet".' : ''));
  });
}

         erhalten. Wer das Archiv auspackt, verliert sie. Das gehört gesagt,
         bevor jemand es für eine vollständige Sicherung hält. */

          +zahl.elemente+' Elemente, '+(zahl.bytes/1048576).toFixed(1)+' MB.\n\n'
          +'Aufbau: '+exportBeispiel(EXP_FORM)+'\n\n'

/* ================================================================
   Ein gepackter Ordner geht in die Vorschau

   Ein ZIP von einem Kollegen ist meistens kein BandStand-Paket, sondern
   einfach ein gepackter Ordner.

   Bis zum 5. August schrieb der Empfang ihn sofort und machte aus jedem
   Ordner ein Buch. Das war fuer ein Bandbuch richtig und fuer ein Real Book
   nicht zu gebrauchen: Vier Ausgaben als vier Archive ergaben vier Buecher,
   und ueber Buchgrenzen hinweg fuehrt der Import nie zusammen. Genau daran
   ist Jens' Real-Book-Import am 3. August gescheitert.

   Jetzt wird hier nichts mehr geschrieben. Das Archiv wird ausgepackt und mit
   seinen vollen Pfaden an die Vorschau uebergeben; dort gelten alle Regeln,
   die es ohnehin gibt — was die Ordner bedeuten, wohin es geht, was andockt.
   Aus zwei Wegen mit zwei Verhaltensweisen wird ein Weg mit drei Tueren.

   Ein Nebeneffekt, der mehr wiegt, als er klingt: Safari auf dem iPad kann
   keine Ordner auswaehlen. Ueber ein Archiv kommt die Ordnerstruktur trotzdem
   auf das Geraet — damit steht der Real-Book-Weg dort zum ersten Mal offen.
   ================================================================ */
const ARCHIV_ENDUNG=/\.(pdf|mp3|m4a|wav|aac|aif|aiff|musicxml|mxl|xml|abc)$/i;
async function zipAlsOrdner(zip, zipName){
  const wurzelName=(zipName||'Empfangen').replace(/\.zip$/i,'').trim() || 'Empfangen';
  const pfade=[];
  zip.forEach((pfad, eintrag)=>{ if(!eintrag.dir && ARCHIV_ENDUNG.test(pfad)) pfade.push(pfad); });
  if(!pfade.length){
    alert('In diesem Archiv stehen keine Notenblätter und kein Katalog.\n\n'
      +'BandStand nimmt PDF-Dateien und Tonaufnahmen an, einzeln, in Ordnern '
      +'oder als BandStand-Paket.');
    return;
  }
  /* Verstecktes und Packer-Beiwerk faellt hier schon weg. Es spaeter zu
     uebergehen ginge auch, aber dann stuenden „__MACOSX" und „.DS_Store" als
     Ordner in der Ebenen-Karte und wuerden die Zahlen verfaelschen, an denen
     man ablesen soll, ob die Rollen stimmen. */
  const echte=pfade.filter(p=>!/(^|\/)__MACOSX\//.test(p)
                           && !p.split('/').some(t=>t.startsWith('.')));
  if(!echte.length){ alert('Im Archiv steht nur Verborgenes — kein lesbares Blatt.'); return; }

  /* Liegen alle Dateien lose in der Wurzel, traegt das ZIP selbst den einzigen
     Namen, den es gibt. Er wird zur obersten Ebene, damit die Ebenen-Karte
     etwas zu zeigen hat und der Stapel benennbar bleibt. */
  const ohneOrdner = echte.every(p=>!p.includes('/'));
  const eintraege=[];
  /* Die Bytes bleiben im Archiv, bis geschrieben wird.

     Bis zum 20. August wurde hier JEDE Datei sofort ausgepackt und als Blob
     gehalten. Bei Jens' Leadsheet-Ordner sind das 361 Dateien und 28 MB — und
     die lagen dann NEBEN dem noch offenen Archiv im Speicher, also doppelt,
     waehrend die Vorschau davon nur die Namen braucht. Auf einem iPad ist das
     der Unterschied zwischen „laeuft" und „Safari raeumt den Tab ab".

     Statt des Blobs steht jetzt ein Platzhalter da: Name, Typ und Groesse wie
     bei einer Datei, dazu `hole()`. Die Vorschau kommt damit aus; `importStapel`
     packt erst unmittelbar vor dem Schreiben aus, eine Datei nach der anderen. */
  for(const pfad of echte){
    const eintrag=zip.file(pfad); if(!eintrag) continue;
    const datei=pfad.split('/').pop();
    const typ = /\.pdf$/i.test(datei) ? 'application/pdf' : '';
    /* `_size` ist die Groesse im ENTPACKTEN Zustand, so wie JSZip sie im
       Verzeichnis des Archivs vorfindet. Sie dient nur der Anzeige. */
    const groesse=(eintrag._data && eintrag._data.uncompressedSize) || 0;
    eintraege.push({
      file:{ name:datei, type:typ, size:groesse,
             hole:()=>eintrag.async('blob').then(b=>new File([b], datei, {type:typ})) },
      pfad: ohneOrdner ? (wurzelName+'/'+pfad) : pfad });
  }
  if(!eintraege.length){ alert('Keine Datei des Archivs liess sich lesen.'); return; }

  /* Stammt das Archiv aus einem BandStand-Export, steht seine Lesart darin.
     Dann wird nicht gefragt — der Rundlauf soll ohne Rueckfrage schliessen. */
  let vorgabe=null;
  try{
    const s=zip.file('struktur.json');
    if(s){ const j=JSON.parse(await s.async('string'));
           if(j && j.rollen && Object.keys(j.rollen).length) vorgabe=j.rollen; }
  }catch(e){}

  /* Der Text sagte bis zum 7. August „Sag oben, was die Ordner bedeuten".
     „Oben" gibt es nicht mehr — der Assistent führt jetzt Schritt für Schritt,
     und ein Verweis auf eine Stelle, die keiner sucht, verwirrt nur. */
  window.importVorschau(eintraege,
    eintraege.length+(eintraege.length===1?' Datei':' Dateien')+' aus „'+wurzelName+'" gelesen.\n\n'
    +(vorgabe
      ? 'Das Archiv stammt aus einem BandStand-Export und sagt selbst, was seine '
        +'Ordner bedeuten. Die Ebenen stehen schon richtig.'
      : 'Es ist noch nichts geschrieben. Du wirst jetzt Schritt für Schritt gefragt.'),
    wurzelName, vorgabe);
}
/* Einlesen. Es kennt zwei Formen: den neuen Katalog und das alte
   Sammlungspaket, damit frueher erzeugte Pakete nicht verloren sind.

   In beiden Faellen bleiben die KENNUNGEN erhalten. Deshalb verdoppelt ein
   zweites Einlesen desselben Pakets nichts, sondern erkennt „habe ich schon". */
async function importPackage(file){
  /* Die Meldung nennt, was sie sieht. Sie hiess bis zum 7. August nur „Kein
     gültiges Paket" und verschwieg den Grund — auf dem iPad war das eine
     Sackgasse: Jens sah den Download anlaufen, danach die Meldung, und nichts
     sagte ihm, woran es lag.

     Der haeufigste Grund steht deshalb zuerst und wird eigens geprueft. Eine
     Datei aus iCloud Drive liegt auf dem iPad oft nur als Platzhalter. Safari
     reicht sie weiter, waehrend der Download noch laeuft, und `size` ist dann
     0 — JSZip bekommt nichts zu lesen und wirft. */
  const name = (file && file.name) || 'Die Datei';
  if(file && file.size===0){
    alert('„'+name+'" ist leer — 0 Bytes.\n\n'
      +'Liegt sie in iCloud Drive, ist sie noch nicht auf dem Gerät. Tippe sie '
      +'in der Dateien-App einmal an, warte, bis das Wolkensymbol verschwindet, '
      +'und wähle sie dann erneut.');
    return;
  }
  let zip;
  try{ zip=await JSZip.loadAsync(file); }
  catch(e){
    alert('„'+name+'" lässt sich nicht als Archiv lesen.\n\n'
      +'Größe: '+(((file&&file.size)||0)).toLocaleString('de-DE')+' Bytes\n'
      +'Typ: '+((file&&file.type)||'unbekannt')+'\n'
      +'Grund: '+((e&&e.message)||e)+'\n\n'
      +'Stammt sie aus iCloud Drive, lade sie in der Dateien-App zuerst herunter.');
    return;
  }
  const neu=zip.file('katalog.json'), alt=zip.file('manifest.json');
  if(!neu && !alt) return zipAlsOrdner(zip, file && file.name);
  let kat;
  try{ kat=JSON.parse(await (neu||alt).async('string')); }
  catch(e){ alert('Der Katalog im Paket ist nicht lesbar.'); return; }

  const vorhanden=new Set((BS_KATALOG.elemente||[]).map(e=>e.id));
  const buchDa=new Set((BS_KATALOG.buecher||[]).map(b=>b.id));
  let neueBuecher=0, dazu=0, schonDa=0, ohneDatei=0;

  if(neu){
    /* Neue Form: Buecher, Titel und Elemente mit ihren Kennungen. */
    for(const b of (kat.buecher||[])){
      if(!b || !b.id || buchDa.has(b.id)) continue;
      await BS._intern.tx('buecher','readwrite',st=>st.put({
        id:b.id, name:b.name||'Import', chip:b.chip||b.name||'Import',
        hubId:b.hubId||null, angelegt:b.angelegt||Date.now(), geaendert:Date.now() }));
      buchDa.add(b.id); neueBuecher++;
    }
    const titelDa=new Set((BS_KATALOG.titel||[]).map(t=>t.id));
    for(const t of (kat.titel||[])){
      if(!t || !t.id || titelDa.has(t.id)) continue;
      const bid = buchDa.has(t.buchId) ? t.buchId : (await sammelBuch(buchDa));
      await BS._intern.tx('titel','readwrite',st=>st.put({
        id:t.id, buchId:bid, titel:t.titel||'Stück', komponist:t.komponist||'',
        angelegt:t.angelegt||Date.now(), geaendert:Date.now() }));
      titelDa.add(t.id);
    }
    for(const e of (kat.elemente||[])){
      if(!e || !e.id){ continue; }
      if(vorhanden.has(e.id)){ schonDa++; continue; }
      if(!titelDa.has(e.titelId)){ ohneDatei++; continue; }
      let blob=null;
      if(e.datei){ const zf=zip.file(e.datei); if(zf) blob=await zf.async('blob'); }
      if(!blob && (BS.ARTEN[e.art]||{}).bytes){ ohneDatei++; continue; }
      await BS._intern.tx(['elemente','bytes'],'readwrite',(el,by)=>{
        el.put({ id:e.id, titelId:e.titelId, art:e.art||'blatt', etikett:e.etikett||'',
                 instrument:e.instrument||'', reihung:e.reihung||0, np:e.np||1,
                 dateiname:e.dateiname||'', groesse:(blob&&blob.size)||0, ziel:e.ziel||'',
                 angelegt:e.angelegt||Date.now(), geaendert:Date.now() });
        if(blob) by.put({id:e.id, blob});
      });
      vorhanden.add(e.id); dazu++;
    }
  } else {
    /* Alte Form: je Stueck ein Satz. Daraus wird je Satz ein Stueck mit einem
       Blatt — die Kennung wird als Element-Kennung uebernommen. */
    for(const b of (kat.books||[])){
      if(!b || !b.bid || buchDa.has(b.bid)) continue;
      await BS._intern.tx('buecher','readwrite',st=>st.put({
        id:b.bid, name:b.name||'Import', chip:b.chip||b.name||'Import',
        hubId:null, angelegt:b.createdAt||Date.now(), geaendert:Date.now() }));
      buchDa.add(b.bid); neueBuecher++;
    }
    for(const m of (kat.tunes||[])){
      if(!m || !m.id){ continue; }
      if(vorhanden.has(m.id)){ schonDa++; continue; }
      const zf=m.file && zip.file(m.file); if(!zf){ ohneDatei++; continue; }
      const blob=await zf.async('blob');
      const bid = buchDa.has(m.bid) ? m.bid : (await sammelBuch(buchDa));
      const tid = BS.kennung('ti');
      await BS._intern.tx(['titel','elemente','bytes'],'readwrite',(t,el,by)=>{
        t.put({ id:tid, buchId:bid, titel:m.title||'Stück', komponist:m.composer||'',
                angelegt:m.addedAt||Date.now(), geaendert:Date.now() });
        el.put({ id:m.id, titelId:tid, art:'blatt', etikett:m.voice||'', instrument:m.voice||'',
                 reihung:0, np:m.np||1, dateiname:m.fileName||'', groesse:blob.size, ziel:'',
                 angelegt:m.addedAt||Date.now(), geaendert:Date.now() });
        by.put({id:m.id, blob});
      });
      vorhanden.add(m.id); dazu++;
    }
  }
  /* Frueher ging danach der alte Dialog „Eigene Noten" auf. Er ist seit dem
     30. Juli ein Ueberrest: Das Einlesen wird aus Content angestossen, und
     dorthin gehoert die Rueckkehr — nicht in ein Fenster, das der Nutzer nicht
     gerufen hat. */
  await loadLibrary();
  if(window.cPruef) cPruef.gehe([]);
  const eng=nachImportZeigen();
  alert('Paket eingelesen.\n'+dazu+' Element'+(dazu===1?'':'e')+' hinzugefügt'
    +(schonDa?', '+schonDa+' schon vorhanden':'')
    +(ohneDatei?', '+ohneDatei+' ohne Datei übergangen':'')
    +(neueBuecher?'\n'+neueBuecher+' Buch/Bücher angelegt':'')
    +'\n\nIn der Liste stehen jetzt '+titelInDerListe()+' Titel.'
    +(eng ? '\n\nDie Liste war eingeschränkt und steht jetzt auf „Alle".' : ''));
}
/* Ein Sammelbuch fuer Stuecke, deren Buch im Paket fehlt. */
let _sammelBid=null;
async function sammelBuch(buchDa){
  if(_sammelBid && buchDa.has(_sammelBid)) return _sammelBid;
  const b=await BS.buchAnlegen({name:'Importierte Noten'});
  _sammelBid=b.id; buchDa.add(b.id); return b.id;
