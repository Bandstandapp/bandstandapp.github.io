    for(const r of roles()){ if(r==='Audio') continue; if(n.includes(r.toLowerCase().replace('-',''))||n.includes(r.toLowerCase())) return r; }
    return 'Leadsheet'; }
  function appendPartsUI(card, t){
    if(!card || !t || t.isEdit) return;                 // Notizen ausgenommen
    if(card.querySelector('.partsSec')) return;
    const sec=document.createElement('div'); sec.className='partsSec';
    card.append(sec);
    renderSec(sec, t);
  }
  function refreshAfter(t){ try{ render(); }catch(e){}
    const v=document.getElementById('viewer');
    if(v && v.classList.contains('open') && typeof CURRENT!=='undefined' && CURRENT && CURRENT.key===t.key) refreshVoiceBar(t); }

  function roleSelectHTML(p){
    const rs=roles(); const cur=p.role||'';
    const list=rs.slice(); if(cur && list.indexOf(cur)<0) list.unshift(cur);
    return '<select class="txt prole-sel" style="flex:0 0 auto;width:auto;max-width:44%">'
      + list.map(r=>'<option'+(r===cur?' selected':'')+'>'+esc(r)+'</option>').join('')
      + '<option value="__other__">＋ Andere…</option></select>';
  }

  function renderSec(sec, t){
    const ps=partsOf(t.key);
    let html='<div class="lbl" style="margin:0 0 6px">Stimmen &amp; Audio</div>'
      +'<div class="muted" style="margin:0 0 8px">Lade PDF-Stimmen oder ein MP3 hoch — die Rolle ordnest du danach je Zeile zu (oder „Andere…" für einen eigenen Namen). Die Dateien bleiben auf diesem Gerät.</div>';
    if(ps.length){ html+='<div id="pList">'+ps.map(p=>
      '<div class="prow" data-id="'+p.id+'"><span class="pkind">'+(p.kind==='audio'?'<i class="i ic-music"></i>':'<i class="i ic-book-open"></i>')+'</span>'
      + roleSelectHTML(p)
      +'<span class="pfile">'+esc(p.fileName||'')+'</span>'
      +(p.kind==='pdf'?'<button class="pdetach" title="Vom Stück lösen → Sonstiges Material"><i class="i ic-external-link"></i></button>':'')
      +'<button class="pdel" title="Ganz entfernen (Datei löschen)"><i class="i ic-trash-2"></i></button></div>').join('')+'</div>'; }
    html+='<button class="btn" id="pAdd" style="width:100%;margin-top:10px">＋ Datei(en) hochladen</button>'
      +'<input type="file" id="pFile" accept="application/pdf,audio/*,.pdf,.mp3,.m4a,.wav,.musicxml,.mxl,.xml,.abc" multiple class="dateifeld">';
    sec.innerHTML=html;
    // Rolle je Zeile ändern
    sec.querySelectorAll('.prole-sel').forEach(sel=>{ sel.onchange=()=>{
      const id=sel.closest('.prow').dataset.id; const p=partsOf(t.key).find(x=>x.id===id); if(!p) return;
      let val=sel.value;
      if(val==='__other__'){ const c=prompt('Eigene Bezeichnung für diese Stimme:', p.role||''); if(c==null){ renderSec(sec,t); return; } val=(c.trim()||p.role||'Stimme'); }
      partPut({ id:p.id, tuneKey:p.tuneKey, role:val, kind:p.kind, fileName:p.fileName, addedAt:p.addedAt, blob:p.blob })
        .then(loadParts).then(()=>{ renderSec(sec,t); refreshAfter(t); });
    }; });
    // vom Stück lösen → als eigenes Stück nach „Sonstiges Material"
    sec.querySelectorAll('.pdetach').forEach(x=>x.onclick=()=>{ const id=x.closest('.prow').dataset.id;
      const p=partsOf(t.key).find(y=>y.id===id); if(p) detachPart(p, t).then(()=>renderSec(sec,t)); });
    // ganz löschen (mit Rückfrage)
    sec.querySelectorAll('.pdel').forEach(x=>x.onclick=()=>{ const id=x.closest('.prow').dataset.id;
      if(!confirm('Diese Stimme ganz entfernen? Die Datei wird gelöscht.')) return;
      partDel(id).then(loadParts).then(()=>{ renderSec(sec,t); refreshAfter(t); }); });
    // hochladen: erst Datei(en), Rolle danach änderbar
    const file=sec.querySelector('#pFile');
    sec.querySelector('#pAdd').onclick=()=>file.click();
    file.onchange=()=>{ const files=Array.prototype.slice.call(file.files||[]); if(!files.length) return;
      sec.querySelector('#pAdd').textContent='Speichere…';
      (async()=>{ for(const f of files){
          const isAudio=AUDIO_RX.test(f.name)||(f.type||'').indexOf('audio')===0;
          const role=isAudio?'Audio':guessRole(f.name);
          await partPut({ id:uid(), tuneKey:t.key, role, kind:isAudio?'audio':'pdf', fileName:f.name, addedAt:Date.now(), blob:f });
        } await loadParts(); renderSec(sec,t); refreshAfter(t);
      })().catch(()=>{ renderSec(sec,t); }); };
  }

  /* ---- Hooks setzen ---- */
  function boot(){
    // openMetaSheet umschließen → Stimmen-Verwaltung anhängen
    if(typeof window.openMetaSheet==='function'){
      const om=window.openMetaSheet;
      window.openMetaSheet=function(t){ const r=om.apply(this,arguments); try{ appendPartsUI(document.getElementById('sheetCard'), t); }catch(e){} return r; };
    }
    /* openViewer umschliessen → den Schalter neu aufbauen.
       Die aktive Stimme faellt VOR dem Zeichnen weg: Sonst zeichnete der
       Betrachter die Stimme des vorigen Stuecks.

       Der Ton dagegen laeuft weiter, solange man im selben Stueck bleibt.
       Genau dafuer ist er da — mitspielen, waehrend das Blatt wechselt; das
       Konzept sagt, ein Audio sei keine Stimme, sondern laufe daneben. Bis
       zum 28. Juli hielt der Wechsel der Ausgabe die Musik an. Beim Wechsel
       des Stuecks wird still geschlossen. */
    if(typeof window.openViewer==='function'){
      const ov=window.openViewer;
      window.openViewer=function(t){
        const vorher=jetziges();
        const gleicheGruppe = !!(vorher && t && vorher.gid && vorher.gid===t.gid);
        AKTIV=null;
        if(!gleicheGruppe){ try{ closeAudio(true); }catch(e){} }
        const r=ov.apply(this,arguments);
        try{ schliesseMenue(); schalterAuffrischen(); }catch(e){}
        return r;
      };
    }
    // Betrachter schließen → Stimme und Ton mit schließen
    const vc=document.getElementById('vClose');
    if(vc) vc.addEventListener('click',()=>{ AKTIV=null; closeAudio(true); schliesseMenue(); });
    /* Ein Tipp irgendwohin schliesst das Menue. Am Dokument abgefangen, weil
       einzelne Knoepfe ihr onclick spaeter ueberschrieben bekommen — siehe
       den Dropbox-Baustein im Arbeitsstand. */
    document.addEventListener('click', ()=>schliesseMenue());
    // Parts laden und Liste auffrischen
    loadParts().then(()=>{ try{ render(); }catch(e){} });
  }
  window.RBParts={ loadParts, refreshVoiceBar, partsOf, _boot:boot };
  if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',boot); else setTimeout(boot,0);
})();

</script>

<script>
/* ================================================================
   Schritt 4 — dreispaltiges Geruest (Fassung 1+2)

   Grundsatz: Es wird nichts neu geschrieben, was es schon gibt. Die
   vorhandenen Knoten werden in das neue Geruest VERSCHOBEN. Ein
   verschobener Knoten behaelt seine Ereignis-Anbindungen, damit bleibt
   die gesamte Logik unberuehrt — auch die des Betrachters.
   ================================================================ */
(function(){
  const $ = id => document.getElementById(id);
  const MINLIST = 300;
  const RATIO = { a4: 210/297, letter: 8.5/11 };

  /* Bis Schritt 5 das Verhaeltnis je PDF liefert, gilt A4 als Startwert
     (Entscheidung 6.3 vom 26.7.2026). Bis Schritt 6 steht das Dock fest unten,
     damit die Randberechnung von Anfang an die richtigen Masse ergibt. */
  window.SHEET_RATIO = RATIO.a4;
  window.DOCK_EDGE   = null;   // wird vom Dock (Schritt 6) gesetzt

  /* Die App laeuft mit viewport-fit=cover und durchscheinender Statusleiste:
     Der Inhalt reicht bis an die Kanten des Bildschirms. Ohne die sicheren
     Raender laege die Oberkante des Blattes unter der Statusleiste. Die
     env()-Werte sind aus JavaScript nicht direkt lesbar, darum traegt ein
     unsichtbarer Messknoten sie als Polsterung; abgelesen wird die berechnete
     Angabe. In der Testumgebung sind alle vier null — dort aendert sich also
     nichts. */
  let sicher = { t:0, r:0, b:0, l:0 };
  const messknoten = document.createElement('div');
  messknoten.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;'
    + 'pointer-events:none;padding-top:env(safe-area-inset-top);'
    + 'padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);'
    + 'padding-left:env(safe-area-inset-left)';
  document.body.append(messknoten);
  function messeSicher(){
    const cs = getComputedStyle(messknoten);
    sicher = { t:parseFloat(cs.paddingTop)||0,  r:parseFloat(cs.paddingRight)||0,
               b:parseFloat(cs.paddingBottom)||0, l:parseFloat(cs.paddingLeft)||0 };
  }
  messeSicher();

  /* Platz wird nur dort freigehalten, wo das Dock DAUERHAFT steht. Klappt es
     weg und kommt nur auf Tipp fuer ein paar Sekunden hervor, waere es
     verschenkt: 94 px sind gut ein Fuenftel der Blattflaeche. Seit Schritt 8
     entscheidet darueber die Einstellung je Ausrichtung. */
  function docPads(){
    const frei = 94, rand = 16, e = window.DOCK_EDGE;
    const fest = window.dockEinklappbar ? !window.dockEinklappbar() : false;
    const p = (fest && e) ? { t: e==='top'?frei:rand,  b: e==='bottom'?frei:rand,
                              l: e==='left'?frei:rand, r: e==='right'?frei:rand }
                          : { t: rand, b: rand, l: rand, r: rand };
    /* Der Player schwebt seit Schritt 10 am unteren Buehnenrand. Er haelt
       nur Platz frei, solange er offen ist — zugeklappt sind es null, und
       das Blatt bekommt die Hoehe vollstaendig zurueck. */
    const ton = window.playerHoehe ? window.playerHoehe() : 0;
    return { t:p.t+sicher.t, r:p.r+sicher.r, b:p.b+sicher.b+ton, l:p.l+sicher.l };
  }
  window.docPads = docPads;

  /* Derselbe Rand wirkt auf die Einpass-Flaeche des Betrachters. Damit
     zentriert sich das Blatt im Rest und laeuft nie unter das Dock. */
  function setzeBlattrand(){
    const fit = document.getElementById('vFit'); if(!fit) return;
    const p = docPads();
    fit.style.padding = p.t+'px '+p.r+'px '+p.b+'px '+p.l+'px';
  }
  window.setzeBlattrand = setzeBlattrand;

  /* Rechenfunktion des Handoffs, unveraendert uebernommen. Das Blatt bekommt
     zuerst die volle Hoehe, seine Breite folgt aus dem Seitenverhaeltnis, die
     Buehne ist so breit wie Blatt plus Rand, und die Liste bekommt den Rest. */
  function layout(){
    const ui = $('ui'), nav = $('nav'), stage = $('stage');
    if(!ui || !stage) return;
    /* Der Blattrand gilt in beiden Ausrichtungen — das Dock schwebt hier wie
       dort ueber dem Blatt. Deshalb steht er vor dem Ausstieg ins Hochformat. */
    setzeBlattrand();
    if(document.body.dataset.o !== 'land'){ stage.style.width=''; return; }
    const p = docPads();
    /* Im Betrachter steht nichts mehr im Fluss: Dock, Player und seit dem
       28. Juli auch der Stimmen-Schalter schweben. Der Platzbedarf von Dock
       und Player steckt in docPads(); der Schalter braucht keinen, er liegt
       auf den Noten. Die Stimmen-Leiste, die hier bis zum 28. Juli
       siebenundvierzig Pixel abzog, ist entfallen. */
    const blattH  = ui.clientHeight - p.t - p.b;
    const buehneW = Math.ceil(blattH * window.SHEET_RATIO) + p.l + p.r;
    const maxB    = ui.clientWidth - nav.offsetWidth - MINLIST;
    stage.style.width = Math.max(260, Math.min(buehneW, maxB)) + 'px';
  }
  window.layout = layout;

  function ausrichtung(){
    /* Die Medienabfrage steht beim Drehen sofort richtig; innerWidth und
       innerHeight hinken unter iOS hinterher. Wer sich auf die Masse verlaesst,
       rechnet einmal mit der alten Ausrichtung und muss nachbessern — genau
       der Aufbau in zwei Schritten, den Jens am 28. Juli gemeldet hat. */
    const mq = window.matchMedia && window.matchMedia('(orientation: landscape)');
    const quer = mq ? mq.matches : (window.innerWidth >= window.innerHeight);
    const neu = quer ? 'land' : 'port';
    if(document.body.dataset.o !== neu){ document.body.dataset.o = neu; return true; }
    return false;
  }

  /* ---- Geruest aufbauen und die vorhandenen Knoten einhaengen ---- */
  const topbar = $('topbar');
  const ui = document.createElement('div'); ui.id='ui'; ui.className='ui';
  const nav = document.createElement('nav'); nav.id='nav';
  const listcol = document.createElement('div'); listcol.id='listcol';
  const stage = document.createElement('div'); stage.id='stage';
  const setup = document.createElement('section'); setup.id='setup';
  setup.innerHTML='<div class="suphead"><h2>Setup</h2>'
    +'<button class="btn ghost sm" id="setupClose" style="margin-left:auto">Schließen</button></div>'
    +'<div class="supcols"><div class="supnav" id="supNav"></div>'
    +'<div class="supscroll" id="supScroll"></div></div>';
  ui.append(nav, listcol, stage, setup);
  topbar.parentNode.insertBefore(ui, topbar);

  const el = (tag, cls) => { const d=document.createElement(tag); if(cls) d.className=cls; return d; };
  const titel = t => { const d=el('div','ntitle'); d.textContent=t; return d; };

  /* Seitenleiste */
  const navhead = el('div','navhead');
  const marke = document.querySelector('.brand');
  navhead.append(marke);
  const umschalter = document.createElement('button');
  umschalter.className='navtoggle'; umschalter.id='navToggle';
  umschalter.title='Seitenleiste ein- oder ausklappen';
  umschalter.innerHTML='<i class="i ic-chevron-left"></i>';
  /* Im Rail steht der Pfeil rechts neben dem Icon statt darunter; ein Tipp
     auf das Icon klappt dort ebenfalls auf. Ausgeklappt bleibt das Icon der
     Weg zur Startseite. */
  navhead.append(umschalter);
  /* Ein Tipp auf das App-Symbol klappt die Seitenleiste auf und ein zweiter
     wieder zu — in jeder Ansicht. Im Hochformat ist das die Schublade, im
     Querformat der Wechsel zwischen 256 px und Rail. Das Abfangen in der
     Erfassungsphase unterbindet zugleich das alte onclick des Knotens; die
     Startseiten-Funktion liegt darum jetzt auf dem langen Tippen. */
  let langGetippt=false;
  function markeUm(e){
    if(e){ e.stopImmediatePropagation(); e.preventDefault(); }
    /* Nach einem langen Tippen folgt trotzdem ein Klick. Der darf die Leiste
       nicht auch noch umschalten, sonst tut ein Griff zwei Dinge. */
    if(langGetippt){ langGetippt=false; return; }
    if(document.body.dataset.o!=='land'){ schubladeUm(); return; }
    setzeNav(document.body.dataset.nav==='rail' ? 'wide':'rail');
    layout();   /* das Blatt zieht der transitionend von #nav nach */
  }
  window.markeUm = markeUm;
  marke.addEventListener('click', markeUm, true);
  langesTippen(marke, ()=>{ langGetippt=true; if(typeof goHome==='function') goHome(); });
  const navScroll = el('div'); navScroll.id='navScroll';
  /* Festgehalten, nicht zweimal gesucht: Sobald #tabs in den noch nicht
     eingehaengten navScroll wandert, findet getElementById es nicht mehr.
     Falle 3 des Arbeitsstands. */
  const tabsBox = $('tabs');
  navScroll.append(titel('Bibliothek'), tabsBox);
  /* Im Rail stehen statt der ausgeklappten Listen zwei Eintraege, die die
     Dialoge oeffnen. Ausgeklappt sind sie ueberfluessig — dort stehen Bücher
     und Tags ja in der Seitenleiste selbst. */
  const railzeug = el('div','railonly');
  railzeug.innerHTML =
      '<div class="tab" data-dlg="books" title="Bücher auswählen"><i class="i ic-book-open"></i><span class="lab">Bücher</span></div>'
    + '<div class="tab" data-dlg="lists" title="Setlists und Tags"><i class="i ic-list-music"></i><span class="lab">Listen</span></div>';
  navScroll.append(railzeug);
  /* Buecher und Tags bekommen je einen Kopf, der den Flyout oeffnet. Die
     Ueberschriften entfallen dafuer — der Kopf traegt den Namen selbst. */
  const tagToggle = document.createElement('div');
  tagToggle.className='collapse-h'; tagToggle.id='tagToggle';
  tagToggle.title='Tags anzeigen';
  tagToggle.innerHTML='<i class="i ic-tags"></i><div class="lbl">Tags</div><span class="cnt" id="tagCnt"></span>';
  /* Die beiden Koepfe haengt renderTabs ein, nicht dieser Baustein — sie
     stehen seit dem 28. Juli in der Reiterliste, damit sie sich mitsortieren
     lassen. Hier wird der neue Kopf nur in den Baum gesetzt, damit renderTabs
     ihn ueber seine Kennung findet; wo er landet, entscheidet dort die
     gespeicherte Reihenfolge.

     Vorher hing er hier fest, und weil renderTabs beim ersten Lauf schon
     zugegriffen hatte, lieferte getElementById einmal null — append(null)
     schreibt dann das Wort „null" in die Seitenleiste. Genau das stand unter
     dem letzten Eintrag. */
  tabsBox.append(tagToggle);
  navScroll.append($('bookwrap'), $('tagtabs'));
  const navfoot = el('div','navfoot');
  /* Das Plus entfaellt: Die Verwaltung der eigenen Noten sitzt jetzt im Setup
     unter „Bücher". Der Knoten bleibt versteckt im Baum, damit vorhandener
     Code ihn weiter findet. */
  /* Der Knopf ist seit dem 2. August wieder sichtbar: Er nimmt jetzt die
     Sendung eines Kollegen an, statt die alte Noten-Verwaltung zu oeffnen. */
  $('libBtn').style.display='';
  $('settingsBtn').innerHTML='<i class="i ic-settings"></i>';
  $('settingsBtn').title='Setup';
  /* Die beiden Zahlen standen unter der Wortmarke und machten den Kopf
     unruhig. Unten neben dem Zahnrad werden sie zur Statuszeile.

     Geholt wird der Knoten ueber die Kopfzeile, nicht ueber getElementById:
     Die Seitenleiste wird losgeloest zusammengebaut, und sobald .brand in den
     noch nicht eingehaengten Kopf wandert, ist #count fuer das Dokument nicht
     mehr auffindbar. Genau daran ist der erste Anlauf gescheitert. */
  const zahlen = navhead.querySelector('.count');
  navfoot.append($('libBtn'), $('settingsBtn'));
  /* Die Statusfläche nimmt den ganzen Raum zwischen der Bibliothek und dem
     Zahnrad ein. Sie stand bis zum 28. Juli als schmale Zeile neben dem
     Zahnrad und konnte deshalb nur zwei Zahlen tragen; jetzt benennt sie die
     Buecher. */
  const status = el('div'); status.id='navStatus'; status.append(zahlen);
  const wortmarke = el('div'); wortmarke.id='navWordmark';
  wortmarke.innerHTML='<span>Band<b>Stand</b></span>';
  nav.append(navhead, navScroll, status, wortmarke, navfoot);

  /* Der leere Rest der alten Kopfzeile wandert mit, damit vorhandener Code,
     der auf #controls zugreift, weiter ein Element vorfindet. */
  navScroll.append($('controls'));

  /* Titelliste */
  const lhead = el('div','lhead');
  const schublade = document.createElement('button');
  schublade.className='drawerbtn'; schublade.id='drawerBtn';
  schublade.title='Seitenleiste zeigen';
  schublade.innerHTML='<i class="i ic-menu"></i>';
  /* Der Suchschlitz steht ueber der Liste, nicht in der Seitenleiste. Dort war
     er im eingeklappten Zustand gar nicht mehr zu sehen, und er gehoert
     logisch neben „Alphabet": Beides schraenkt dieselbe Liste ein.

     Die Kontextzeile („Alle Buecher · Buchstabe M") ist dafuer entfallen. Sie
     sagte dasselbe wie die Statusflaeche in der Seitenleiste, nur kuerzer.

     Daneben steht das gewaehlte Instrument. Aus ihm folgt, welche Ausgabe
     aufgeht — ohne diese Marke waere nicht zu sehen, warum ein Stueck in B
     erscheint. Ein Tipp fuehrt geradewegs zur Wahl. „Alphabet" heisst dafuer
     jetzt „ABC": Zu dritt wird es in der Zeile sonst zu eng. */
  const instrKnopf = el('div','collapse-h'); instrKnopf.id='instrBtn';
  instrKnopf.innerHTML='<div class="lbl"></div>';
  instrKnopf.onclick=()=>{ if(window.openSetup) window.openSetup('instrument'); };
  window.instrumentMarkeAuffrischen = function(){
    const l=instrKnopf.querySelector('.lbl');
    const i=(typeof meinInstrument==='function') ? meinInstrument() : null;
    l.textContent = i ? i.name : 'Voice';
    instrKnopf.classList.toggle('aus', !i);
    instrKnopf.title = i ? ('Voice: '+i.name+(i.en?' · '+i.en:'')
                            +(i.notation?' · notiert in '+i.notation:'')+' — tippen zum Ändern')
                         : 'Keine Voice gewählt — tippen zum Wählen';
  };
  window.instrumentMarkeAuffrischen();
  /* Instrument und ABC bilden ein Paar. Ohne die Klammer bricht die Zeile
     zwischen ihnen um, und ABC stuende im Querformat allein auf einer Zeile —
     gemessen. So bricht sie an der einzig sinnvollen Stelle: hinter dem
     Suchschlitz. */
  const lbtn = el('div','lheadbtns');
  lbtn.append(instrKnopf, $('azToggle'));
  /* Ein X zum Loeschen des Suchbegriffs. Safari zeigt bei einem Suchfeld von
     sich aus keines, und mit einer Bildschirmtastatur ist das Leeren von Hand
     muehsam. Es erscheint nur, wenn etwas dasteht. */
  const suchfeld = el('div','suchfeld');
  const suchX = document.createElement('button');
  suchX.className='suchx'; suchX.id='suchX'; suchX.title='Suche löschen';
  suchX.innerHTML='<i class="i ic-x"></i>';
  /* Der Knoten wird EINMAL geholt und dann festgehalten. Falle 3 des
     Arbeitsstands, hier eine Ebene weiter: Die Titelspalte wird ebenso
     losgeloest zusammengebaut wie die Seitenleiste, und sobald das Suchfeld in
     den noch nicht eingehaengten Kasten wandert, findet getElementById es
     nicht mehr. Gemessen: „Cannot read properties of null". */
  const qFeld = $('q');
  suchfeld.append(qFeld, suchX);
  const suchXzeigen = () => suchfeld.classList.toggle('voll', !!qFeld.value);
  qFeld.addEventListener('input', suchXzeigen);
  suchX.onclick=()=>{ qFeld.value=''; qFeld.dispatchEvent(new Event('input')); qFeld.focus(); };
  suchXzeigen();
  lhead.append(suchfeld, lbtn, $('hint'));

  /* Kopfzeile des Hochformats: Hamburger links, Symbol und Wortmarke mittig.
     Im Querformat traegt die Seitenleiste die Wortmarke selbst, dort bleibt
     diese Zeile weg. Der Schublade-Knopf sitzt hier statt in .lhead, damit
     beide auf einer Linie liegen. */
  const porthead = el('div','porthead');
  const markeHoch = marke.cloneNode(true);
  markeHoch.id='homePort'; markeHoch.title='Seitenleiste zeigen';
  /* Die Verlaeufe des Symbols tragen Kennungen. Zweimal dieselbe Kennung im
     Dokument ist ungueltig, und Safari faerbt dann die zweite Fassung falsch.
     Darum bekommt die Kopie eigene. */
  markeHoch.innerHTML = markeHoch.innerHTML
     .replace(/bsIconBg/g,'bsIconBgP').replace(/bsIconNote/g,'bsIconNoteP');
  markeHoch.addEventListener('click', markeUm, true);
  langesTippen(markeHoch, ()=>{ langGetippt=true; if(typeof goHome==='function') goHome(); });
  porthead.append(schublade, markeHoch);

  const azHost = el('div'); azHost.id='azwrapHost'; azHost.append($('azwrap'));
  const listfix = el('div'); listfix.id='listfix';
  listcol.append(porthead, lhead, azHost, listfix, $('main'));

  /* Buehne: der Betrachter wandert hinein, sein Innenleben bleibt unberuehrt */
  const leer = el('div','stage-empty');
  leer.textContent = 'Kein Stück geöffnet — links ein Stück antippen.';
  stage.append($('viewer'), leer);

  const schleier = el('div'); schleier.id='scrim';
  document.body.append(schleier);
  topbar.remove();

  /* Die Reiter einmal neu zeichnen. renderTabs holt sich dabei die beiden
     Koepfe „Buecher" und „Tags" in seine Liste — ohne diesen Aufruf haenge
     das davon ab, ob render() vor oder nach diesem Baustein laeuft. */
  if(typeof renderTabs==='function'){ try{ renderTabs(); }catch(e){} }

  /* ---- Fassung 3: Rail-Zustand ---- */
  const NAV_KEY='rb_navstate', WMV_KEY='rb_wordmark';
  function setzeNav(zustand){
    document.body.dataset.nav = zustand;
    try{ localStorage.setItem(NAV_KEY, zustand); }catch(e){}
  }
  setzeNav((()=>{ try{ return localStorage.getItem(NAV_KEY)==='rail' ? 'rail':'wide'; }catch(e){ return 'wide'; } })());
  document.body.dataset.wmv = (()=>{ try{ return localStorage.getItem(WMV_KEY)||'dim'; }catch(e){ return 'dim'; } })();
  umschalter.addEventListener('click', ()=>{
    if(document.body.dataset.o==='port'){ schubladeUm(); return; }
    setzeNav(document.body.dataset.nav==='rail' ? 'wide':'rail');
    /* Die Breite laeuft als Uebergang; erst danach neu rechnen (Handoff). */
    layout();
  });

  /* ---- Bücher und Tags fuehren ueberall in denselben Dialog ----
     Vorher gab es zwei Darstellungen: einen Flyout bei ausgeklappter Leiste
     und den Dialog im Rail. Jens bevorzugt den Dialog; der Flyout entfaellt.
     Damit ist die Buecherauswahl in jeder Ansicht dieselbe. */
  function dialogBinde(kopfId, art){
    const kopf = $(kopfId); if(!kopf) return;
    kopf.addEventListener('click', e=>{
      e.stopImmediatePropagation(); e.preventDefault();
      if(window.dialogAuf) window.dialogAuf(art);
    }, true);
  }
  dialogBinde('bookToggle','books');
  dialogBinde('tagToggle','lists');

  /* ---- Fassung 4: Schublade im Hochformat ---- */
  function schubladeUm(auf){
    const offen = (auf===undefined) ? document.body.dataset.drawer!=='open' : !!auf;
    document.body.dataset.drawer = offen ? 'open':'closed';
  }
  document.body.dataset.drawer='closed';
  schublade.addEventListener('click', ()=>schubladeUm(true));
  schleier.addEventListener('click', ()=>schubladeUm(false));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') schubladeUm(false); });
  /* Ein Tipp in der Seitenleiste schliesst die Schublade wieder. */
  nav.addEventListener('click', e=>{
    if(document.body.dataset.o!=='port') return;
    if(e.target.closest('.tab,.fchip,.collapse-h,.iconbtn')) schubladeUm(false);
  });

  /* Das aktive Stueck zurueck auf die Buehne holen. Nur im Querformat, nur
     wenn der Betrachter geschlossen ist und das Stueck es noch gibt.
     Bewusst OHNE keepNav: Beim Zurueckgehen wurde der Blaetter-Kontext
     geleert, und er soll sich aus der Liste neu ergeben, die jetzt zu sehen
     ist. Sonst fuehrte das Wischen ins Leere. */
  function buehneFuellen(){
    if(document.body.dataset.o!=='land') return;
    const v=document.getElementById('viewer'); if(!v || v.classList.contains('open')) return;
    const k=window.aktivesStueck; if(!k) return;
    const t=(typeof byKey!=='undefined') ? byKey[k] : null; if(!t) return;
    try{ openViewer(t); }catch(e){}
  }
  window.buehneFuellen = buehneFuellen;

  /* Das aktive Stueck nach dem Drehen in die Liste holen. Im Querformat ist
     die sichtbare Bahn viel kuerzer als im Hochformat; eine Zeile, die eben
     noch unten stand, liegt danach ausserhalb.

     NUR beim Drehen, nicht bei jedem Neuzeichnen. Ein Rollen bei jedem
     Neuzeichnen war am 27. Juli kurz eingebaut und wieder heraus: Es sprang
     auch beim Tippen auf Favorit, und die Zeile unter dem Finger war danach
     weit weg.

     Zweimal nachgefasst, weil Zeilen ausserhalb des Sichtfelds nur eine
     geschaetzte Hoehe haben. Nach dem ersten Sprung steht die echte fest,
     und der Rest wird nachgezogen. Der Zeitgeber ist das Netz fuer den Fall,
     dass die Bildfolge im Hintergrund nicht laeuft. */
  function aktivesInSicht(){
    const k=window.aktivesStueck; if(!k) return;
    const haupt=document.getElementById('main'); if(!haupt) return;
    /* Steht die Zeile gerade gar nicht im Dokument, wird erst grob an ihren
       Platz gerollt; danach ist sie da und wird genau eingemittet. */
    const t=(typeof byKey!=='undefined') ? byKey[k] : null;
    if(window.zuGruppeRollen && (!window.aktiveZeile || !window.aktiveZeile()))
      window.zuGruppeRollen(t && t.gid ? t.gid : k);
    const hin=()=>{
      const li=window.aktiveZeile ? window.aktiveZeile() : null;
      if(!li) return;
      const r=li.getBoundingClientRect(), b=haupt.getBoundingClientRect();
      if(r.top>=b.top+4 && r.bottom<=b.bottom-4) return;   // steht schon im Bild
      haupt.scrollTop += (r.top-b.top) - Math.max(0,(b.height-r.height)/2);
    };
    hin();
    requestAnimationFrame(()=>{ hin(); requestAnimationFrame(hin); });
    setTimeout(hin, 220);
  }
  window.aktivesInSicht = aktivesInSicht;

  /* ---- Aufrufpunkte nach Handoff: Start, Drehen, Groessenaenderung ---- */
  function neuRechnen(){
    const tStart = performance.now();
    messeSicher();
    const gewechselt = ausrichtung();
    if(gewechselt){
      if(document.body.dataset.o==='land') document.body.dataset.drawer='closed';
      /* Jede Ausrichtung hat ihre eigene Dock-Kante; beim Drehen gilt die neue. */
      if(window.dockKanteAuffrischen) window.dockKanteAuffrischen();
      /* Im Querformat ist die Buehne eine feste Spalte, kein Blatt, das man
         schliesst. Wer im Hochformat ueber den Hamburger zur Liste geht und
         dann dreht, erwartet sein Stueck dort wieder — vorher stand da „Kein
         Stueck geoeffnet", obwohl die Zeile in der Liste ausgezeichnet war. */
      buehneFuellen();
    }
    layout();
    /* Die Flaeche hat sich geaendert — das Blatt muss neu eingepasst werden.
       layout() rechnet nur die Spalten; ohne diesen Aufruf blieb das Blatt
       nach dem Drehen in der Groesse der alten Ausrichtung stehen. */
    if(window.blattNeuZeichnen) window.blattNeuZeichnen();
    /* Die Spalte ist jetzt anders breit; die gemessenen Zeilenhoehen gelten
       nicht mehr. Vor dem Rollen neu messen, sonst zielt es daneben. */
    if(gewechselt && window.fensterNeuMessen) window.fensterNeuMessen();
    /* Erst nach layout(), denn vorher hat die Spalte noch ihre alte Hoehe. */
    if(gewechselt) aktivesInSicht();
    /* Nur beim echten Drehen messen. Die Liste wird dabei einmal umbrochen —
       das Ablesen von scrollHeight erzwingt das und macht die Kosten
       sichtbar, statt sie in den naechsten Bildaufbau zu verschieben. */
    if(gewechselt){
      const tVorListe = performance.now();
      const haupt=document.getElementById('main');
      const zeilen = haupt ? haupt.querySelectorAll('li.tune').length : 0;
      if(haupt) haupt.scrollHeight;
      const tListe = performance.now()-tVorListe;
      window.drehZeiten = { liste:Math.round(tListe), zeilen,
        alle:(window.listeZeilenZahl ? window.listeZeilenZahl() : zeilen),
        gesamt:Math.round(performance.now()-tStart), blatt:0 };
      /* Das Blatt zeichnet verzoegert; seine Dauer traegt renderPdfFit nach. */
      window.drehBlattStart = performance.now();
    }
  }
  window.addEventListener('resize', neuRechnen);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', neuRechnen);
  /* Klappt die Seitenleiste, wird die Titelspalte schmaler oder breiter. Die
     Metazeile bricht dann anders um, und die gemessenen Zeilenhoehen gelten
     nicht mehr — dieselbe Luecke wie beim Blatt, nur eine Ebene weiter. */
  nav.addEventListener('transitionend', ()=>{ layout(); if(window.blattNeuZeichnen) window.blattNeuZeichnen();
    if(window.fensterNeuMessen) window.fensterNeuMessen(); });

  /* Auf das resize-Ereignis allein ist beim Drehen kein Verlass — iOS meldet es
     verspaetet oder gar nicht, und in der Testumgebung blieb es ganz aus. Die
     Medienabfrage schlaegt beim Drehen zuverlaessig an. Zusaetzlich
     orientationchange mit kurzer Verzoegerung, weil die neuen Masse dort erst
     nach dem Ereignis feststehen. */
  /* Beim Drehen meldet iOS das Ereignis, bevor die neuen Masse feststehen.
     Wer sofort rechnet, baut die Seite einmal falsch auf und schiebt sie
     danach zurecht. Deshalb wird gewartet, bis die gemeldeten Masse zur
     Medienabfrage passen, und erst dann EINMAL gerechnet. Die Obergrenze von
     30 Bildern (rund eine halbe Sekunde) verhindert ein Haengenbleiben, falls
     die beiden nie zusammenfinden. */
  let drehUhr=null;
  function nachDrehung(){
    const mq = window.matchMedia && window.matchMedia('(orientation: landscape)');
    const soll = mq ? mq.matches : null;
    clearTimeout(drehUhr);
    let bilder=0;
    const pruefe = ()=>{
      const ist = window.innerWidth >= window.innerHeight;
      if(soll===null || ist===soll || ++bilder>30){
        neuRechnen();
        /* Ein Nachschlag, falls Safari die Masse erst nach dem Zeichnen
           endgueltig setzt. Er kostet nichts, wenn schon alles stimmt. */
        drehUhr=setTimeout(neuRechnen, 300);
        return;
      }
      requestAnimationFrame(pruefe);
    };
    pruefe();
  }
  if(window.matchMedia){
    const quer = window.matchMedia('(orientation: landscape)');
    if(quer.addEventListener) quer.addEventListener('change', nachDrehung);
    else if(quer.addListener) quer.addListener(nachDrehung);
  }
  window.addEventListener('orientationchange', nachDrehung);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) neuRechnen(); });

  ausrichtung();
  layout();
  requestAnimationFrame(layout);
  setTimeout(layout, 300);
})();
</script>

<script>
/* ================================================================
   Schritt 6 — das verschiebbare Dock

   Das Dock schwebt ueber dem Blatt, laesst sich an jeden der vier
   Raender ziehen und rastet beim Loslassen an der naechsten Kante ein.
   Doppeltippen auf den Griff dreht die Kanten weiter. Nur an SEINER
   Kante wird Platz freigehalten; das rechnet docPads() aus Schritt 4.

   Die Knoepfe rufen ausschliesslich vorhandene Funktionen auf. Es wird
   keine Logik nachgebaut, damit sich nichts auseinanderentwickeln kann.
   ================================================================ */
(function(){
  const KANTE_KEY = { land:'rb_dockedge_land', port:'rb_dockedge_port' };
  const VORGABE   = { land:'left', port:'bottom' };   /* quer seitlich, hoch unten */
  /* Bis zum 21. August 4000 ms. Jens wollte ein Drittel mehr Luft — wer im
     Dock etwas sucht, war vorher oft zu langsam. */
  const ZULAUF    = 5300;                             /* danach klappt es wieder ein */
  const dock  = document.getElementById('dock');
  const grip  = document.getElementById('dockGrip');
  const knopfAuf = document.getElementById('dockBtn');
  const rahmen= dock.parentElement;              /* .frame */
  const viewer= document.getElementById('viewer');
  const knopf = {};
  dock.querySelectorAll('.gb').forEach(b => knopf[b.dataset.a] = b);
  const quer = () => document.body.dataset.o === 'land';

  /* ---- Kante: je Ausrichtung eine eigene, weil sie verschieden knapp sind.
     Im Querformat ist die Hoehe knapp, also gehoert das Dock an eine Seite;
     im Hochformat ist die Breite knapp, also nach unten. ---- */
  const gueltig = k => k==='top'||k==='bottom'||k==='left'||k==='right';
  function geleseneKante(){
    const o = quer() ? 'land' : 'port';
    try{ const g = localStorage.getItem(KANTE_KEY[o]); if(gueltig(g)) return g; }catch(e){}
    return VORGABE[o];
  }
  function setzeKante(k, neuZeichnen){
    dock.dataset.edge = k;
    window.DOCK_EDGE  = k;
    try{ localStorage.setItem(KANTE_KEY[quer()?'land':'port'], k); }catch(e){}
    if(window.layout) window.layout();
    if(neuZeichnen) blattNeu();
  }
  /* Beim Drehen gilt die Kante der neuen Ausrichtung. */
  function kanteAuffrischen(){
    const k = geleseneKante();
    if(dock.dataset.edge !== k){ dock.dataset.edge = k; window.DOCK_EDGE = k; }
    else window.DOCK_EDGE = k;
  }
  window.dockKanteAuffrischen = kanteAuffrischen;
  kanteAuffrischen();

  /* ---- Ein- und Ausklappen ----
     Ob sich das Dock wegklappt, ist je Ausrichtung einstellbar (Setup-Seite,
     Schritt 8). Vorgabe ist in beiden Ausrichtungen „an". Steht es dauerhaft,
     haelt docPads() an seiner Kante Platz frei; klappt es weg, nicht. */
  const FALT_KEY = { land:'rb_dockfold_land', port:'rb_dockfold_port' };
  function einklappbar(o){
    const k = FALT_KEY[o || (quer()?'land':'port')];
    try{ return localStorage.getItem(k) !== '0'; }catch(e){ return true; }
  }
  window.dockEinklappbar = einklappbar;
  window.dockSetzeEinklappbar = (o, an) => {
    try{ localStorage.setItem(FALT_KEY[o], an?'1':'0'); }catch(e){}
    faltZustand();
    if(window.layout) window.layout();
    blattNeu();
  };
  window.dockKante = o => { try{ const g=localStorage.getItem(KANTE_KEY[o]); return gueltig(g)?g:VORGABE[o]; }catch(e){ return VORGABE[o]; } };
  window.dockSetzeKante = k => setzeKante(k, true);
  /* Das Merkmal am body steuert die Stilangaben: Nur wenn eingeklappt werden
     darf, gibt es den runden Knopf und den Zustand „zu". */
  function faltZustand(){
    const an = einklappbar();
    document.body.dataset.dockfold = an ? 'an' : 'aus';
    document.body.dataset.dock = an ? 'zu' : 'auf';
  }
  window.dockFaltZustand = faltZustand;

  let uhr = null;
  /* Zwei Arten, die Leiste wieder loszuwerden. „Von selbst" schliesst sie nach
     ZULAUF, „mit einem Tipp" laesst sie stehen, bis man das Blatt noch einmal
     antippt. Wer beim Spielen liest, will das eine; wer im Dock arbeitet, das
     andere. Von Jens am 21. August gewuenscht. */
  const WEG_KEY = 'bs_dockweg';
  function dockWeg(){
    try{ return localStorage.getItem(WEG_KEY)==='tipp' ? 'tipp' : 'auto'; }catch(e){ return 'auto'; }
  }
  window.dockWegLesen  = dockWeg;
  window.dockWegSetzen = v => {
    try{ localStorage.setItem(WEG_KEY, v==='tipp'?'tipp':'auto'); }catch(e){}
    clearTimeout(uhr);
    /* Steht die Leiste gerade offen und wird auf „von selbst" gestellt,
       soll die Uhr sofort laufen — sonst bliebe sie bis zum naechsten Tipp. */
    if(dockWeg()==='auto' && document.body.dataset.dock==='auf') zuhalten();
  };
  function zuhalten(){
    clearTimeout(uhr);
    if(dockWeg()!=='auto') return;
    uhr = setTimeout(dockZu, ZULAUF);
  }
  /* Der Stimmen-Schalter kommt und geht mit dem Dock. Wer an ihm arbeitet,
     soll ihn nicht unter der Hand verlieren — deshalb verlaengert auch eine
     Beruehrung dort die Zeit. */
  window.dockAntippen = () => { if(einklappbar()) zuhalten(); };
  function dockAuf(){
    if(!einklappbar()) return;
    document.body.dataset.dock = 'auf';
    zuhalten();
  }
  function dockZu(){
    clearTimeout(uhr);
    if(!einklappbar()) return;
    document.body.dataset.dock = 'zu';
  }
  faltZustand();
  knopfAuf.onclick = () => { if(document.body.dataset.dock === 'auf') dockZu(); else dockAuf(); };
  /* Jede Beruehrung im Dock verlaengert die Zeit — sonst klappt es weg,
     waehrend man noch zielt. */
  dock.addEventListener('pointerdown', () => { if(einklappbar()) zuhalten(); });
  /* Ein Tipp aufs Blatt holt es ebenfalls hervor. Ueber 'click', nicht ueber
     Zeigerereignisse: Auf einer Flaeche, die eine Wischgeste auswertet, meldet
     iOS statt 'pointerup' oft 'pointercancel', und dann passierte gar nichts.
     Nach einem Wisch unterdrueckt der Browser den Klick von sich aus; zur
     Sicherheit wird die Strecke zusaetzlich gemessen. */
  (function(){
    const fit = document.getElementById('vFit');
    let x0=0, y0=0, weit=false;
    fit.addEventListener('touchstart', e => {
      if(e.touches.length!==1){ weit=true; return; }
      x0=e.touches[0].clientX; y0=e.touches[0].clientY; weit=false;
    }, {passive:true});
    fit.addEventListener('touchmove', e => {
      if(!e.touches.length) return;
      if(Math.abs(e.touches[0].clientX-x0)>12 || Math.abs(e.touches[0].clientY-y0)>12) weit=true;
    }, {passive:true});
    fit.addEventListener('click', () => {
      if(weit) return;
      /* Bei „mit einem Tipp" schaltet dasselbe Antippen die Leiste auch
         wieder weg — sonst gaebe es keinen Weg zurueck ausser dem Knopf. */
      if(dockWeg()==='tipp' && document.body.dataset.dock==='auf') dockZu();
      else dockAuf();
    });
  })();

  /* Beim Drehen gilt die Einstellung der neuen Ausrichtung. */
  window.addEventListener('resize', faltZustand);
  window.addEventListener('orientationchange', ()=>setTimeout(faltZustand,150));

  /* Nach einem Kantenwechsel aendert sich der freie Rand — das Blatt muss neu
     eingepasst werden. */
  function blattNeu(){ if(window.blattNeuZeichnen) window.blattNeuZeichnen(true); }

  /* ---- Zustand der Knoepfe ---- */
  function an(b, zustand){ if(zustand) b.dataset.on = zustand; else b.removeAttribute('data-on'); }
  function dockSync(){
    const t = CURRENT;
    if(!t || !viewer.classList.contains('open')) return;
    an(knopf.fav,  gruppeHat(S.fav,t)  ? 'fav'  : null);
    an(knopf.prac, gruppeHat(S.prac,t) ? 'prac' : null);
    an(knopf.tag,  (gruppeTagIds(t)||[]).length ? 'tag' : null);
    /* Der Stimmen-Knopf ist am 28. Juli entfallen. Der Schalter auf dem
       Blatt liegt in jeder Ausrichtung ueber den Noten und tut dasselbe;
       zwei Wege zum selben Ziel haetten das Dock nur voll gehalten. */
    /* Seit Stufe 3 nimmt auch ein Leadsheet den Stift an. Die Notiz haengt
       dort an der AUSGABE — am Paar aus Quelle und Tonart — und friert das
       Blatt ein, damit sie liegen bleibt, wo sie geschrieben wurde. */
    knopf.note.disabled = !!t.isEdit;
    if(typeof lsKnopfBeschriften==='function') lsKnopfBeschriften(t);
    const voll = viewer.classList.contains('fullscreen');
    const sym  = knopf.full.querySelector('.i');
    if(sym) sym.className = 'i ' + (voll ? 'ic-minimize' : 'ic-maximize');
    knopf.full.title = voll ? 'Vollbild verlassen' : 'Vollbild';
  }
  window.dockSync = dockSync;

  /* ---- Das offene Stueck in der Liste auszeichnen und ins Bild holen ----
     Gerollt wird, wenn das Stueck WECHSELT — nicht bei jedem Neuzeichnen.
     Genau daran war es am 27.7.2026 gescheitert: Damals hing das Rollen am
     Neuzeichnen, sprang deshalb auch beim Tippen auf Favorit oder Ueben, die
     Zeile unter dem Finger war danach weit weg und der zweite Tipp traf eine
     andere. Gemessen: von Scrollposition 4000 zurueck auf 263.

     Verglichen wird die Gruppe, nicht der Schluessel. Ein Wechsel der Stimme
     bleibt damit folgenlos — die Zeile ist dieselbe und steht schon da. */
  let zuletztGefolgt = null;
  function listeMitfuehren(){
    /* Ausgezeichnet wird das AKTIVE Stueck, nicht das gerade geoeffnete.
       Beim Schliessen wird CURRENT null; haette die Auszeichnung daran
       gehangen, waere sie beim naechsten Neuzeichnen verschwunden. Das aktive
       Stueck setzt openViewer und nur ein anderes Stueck loest es ab. */
    const aktiv = window.aktivesStueck;
    if(!aktiv) return;
    document.querySelectorAll('li.tune[aria-selected]').forEach(li => li.removeAttribute('aria-selected'));
    const li = window.aktiveZeile ? window.aktiveZeile() : null;
    /* Auch die Marke auf den Stimmen wandert mit. Die Zeile wird beim Oeffnen
       NICHT neu gebaut — ohne diesen Nachlauf blieb C blau, obwohl E auf der
       Buehne lag. */
    document.querySelectorAll('li.tune .stimme.an').forEach(b=>b.classList.remove('an'));
    if(li){ const b=li.querySelector('.stimme[data-skey="'+cssEsc(aktiv)+'"]');
            if(b) b.classList.add('an');
            else { const z=li.querySelector('.stimme'); if(z) z.classList.add('an'); } }
    if(li) li.setAttribute('aria-selected','true');
    /* Erst jetzt rollen. Zeilen, die dabei neu entstehen, kommen schon
       ausgezeichnet zur Welt — tuneRow setzt die Marke beim Bauen. */
    const t=(typeof byKey!=='undefined') ? byKey[aktiv] : null;
    const gruppe=(t && t.gid) ? t.gid : aktiv;
    if(gruppe!==zuletztGefolgt){
      zuletztGefolgt=gruppe;
      if(window.aktivesInSicht) window.aktivesInSicht();
    }
  }

  /* ---- Knoepfe ---- */
  knopf.fav  .onclick = () => { if(CURRENT) toggle(S.fav,  CURRENT.key); };
  knopf.prac .onclick = () => { if(CURRENT) toggle(S.prac, CURRENT.key); };
  knopf.tag  .onclick = () => { if(CURRENT) assignTagsFlow(CURRENT); };
  knopf.set  .onclick = () => { if(CURRENT) addToSetlistFlow(CURRENT); };
  knopf.note .onclick = () => { if(CURRENT && !CURRENT.isEdit) openEditor(CURRENT); };
  if(knopf.key) knopf.key.onclick = () => { if(CURRENT) openTonartSheet(CURRENT); };
  /* Foto und leeres Notizblatt direkt aus der Notenansicht. Am 7. August von
     Jens verlangt: Wer an einem Stück arbeitet, will dafür nicht ins Setup
     springen. In Content bleiben beide Wege stehen — dort ordnet man, hier
     arbeitet man. */
  knopf.foto .onclick = () => { if(CURRENT) dockFotoHinzu(CURRENT); };
  knopf.blank.onclick = () => { if(CURRENT) dockNotizblatt(CURRENT); };
  /* Geteilt wird, was auf dem Blatt liegt. Liegt dort eine Stimme, waere
     das Leadsheet die falsche Datei — und der Fehler faellt erst beim
     Empfaenger auf. */
  knopf.share.onclick = () => { const b = window.blattStueck ? window.blattStueck() : CURRENT; if(b) shareTune(b); };
  /* Die Stimmenwahl im Dock ist am 28. Juli entfallen; sie liegt jetzt auf
     dem Schalter ueber dem Blatt. Der galt im Hochformat als einziger Weg zu
     einer anderen Ausgabe — der Schalter ist es dort ebenso, nur naeher an
     den Noten. */
  knopf.full .onclick = () => { if(!CURRENT) return;
    if(viewer.classList.contains('fullscreen')) exitFullscreen(); else enterFullscreen(); };
  document.getElementById('vBack').onclick = () => document.getElementById('vClose').click();

  /* ---- Ziehen und Einrasten ----
     Der Griff faengt den Zeiger ein, damit der Zug nicht abreisst, sobald der
     Finger die 22 px breite Flaeche verlaesst. Das ist etwas anderes als die
     Regel des Pencil-Editors: Dort ist das Einfangen verboten, weil aufeinander
     folgende Striche dieselbe Zeiger-Kennung tragen. Hier gibt es nur einen
     Zug zur Zeit, und die Zeichenflaeche wird nicht beruehrt. */
  const REIHE = ['bottom','right','top','left'];
  let zug = null, letzterTipp = 0;

  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    const r = rahmen.getBoundingClientRect(), d = dock.getBoundingClientRect();
    zug = { sx:e.clientX, sy:e.clientY, r, ox:d.left-r.left, oy:d.top-r.top,
            w:d.width, h:d.height, bewegt:false };
    dock.classList.add('dragging');
    dock.style.transform='none'; dock.style.right='auto'; dock.style.bottom='auto';
    dock.style.left = zug.ox+'px'; dock.style.top = zug.oy+'px';
  });

  grip.addEventListener('pointermove', e => {
    if(!zug) return;
    const dx = e.clientX-zug.sx, dy = e.clientY-zug.sy;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) zug.bewegt = true;
    dock.style.left = (zug.ox+dx)+'px'; dock.style.top = (zug.oy+dy)+'px';
  });

  function loesen(){
    if(!zug) return;
    const bewegt = zug.bewegt, r = zug.r,
          mx = (parseFloat(dock.style.left)+zug.w/2)/r.width,
          my = (parseFloat(dock.style.top) +zug.h/2)/r.height;
    dock.classList.remove('dragging');
    dock.style.left=''; dock.style.top=''; dock.style.right='';
    dock.style.bottom=''; dock.style.transform='';
    zug = null;
    if(bewegt){
      /* Naechste Kante: die kuerzeste der vier Entfernungen, in Anteilen der
         Flaeche gerechnet, damit ein breiter Rahmen nicht immer links gewinnt. */
      const kante = [['left',mx],['right',1-mx],['top',my],['bottom',1-my]]
                      .sort((a,b) => a[1]-b[1])[0][0];
      setzeKante(kante, true);
      return;
    }
    /* Kein Zug, sondern ein Tipp. Zwei Tipps kurz nacheinander drehen weiter.
       Auf 'dblclick' ist unter iOS kein Verlass, darum von Hand gemessen. */
    const jetzt = Date.now();
    if(jetzt - letzterTipp < 420){
      letzterTipp = 0;
      setzeKante(REIHE[(REIHE.indexOf(dock.dataset.edge)+1) % 4], true);
    } else letzterTipp = jetzt;
  }
  grip.addEventListener('pointerup', loesen);
  grip.addEventListener('pointercancel', loesen);

  /* ---- Anschluss an den vorhandenen Ablauf ----
     Die Funktionen sind als Funktionsdeklarationen angelegt; ein Ersetzen am
     globalen Objekt wirkt daher auch auf die Aufrufe im uebrigen Code. */
  ['render','openViewer','enterFullscreen','exitFullscreen'].forEach(name => {
    const alt = window[name];
    if(typeof alt !== 'function') return;
    window[name] = function(){
      const r = alt.apply(this, arguments);
      try{ dockSync(); listeMitfuehren(); }catch(e){}
      return r;
    };
  });

  dockSync();
})();
</script>

<script>
/* ================================================================
   Schritt 7b — die Dialoge „Bücher" und „Listen"

   Sie sind nur im Rail-Zustand erreichbar und ersetzen dort die
   ausgeklappten Listen der Seitenleiste. Beide arbeiten auf demselben
   Zustand wie die Seitenleiste; es entsteht kein zweiter Datenweg.
   ================================================================ */
(function(){
  const dlg    = document.getElementById('dlg');
  const schleier = document.getElementById('dlgScrim');

  function auf(art){ document.body.dataset.dlg = art; zeichne(); }
  window.dialogAuf = auf;
  function zu(){ delete document.body.dataset.dlg; dlg.innerHTML=''; }
  window.dialogZu = zu;

  schleier.addEventListener('click', zu);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.body.dataset.dlg) zu(); });
  document.querySelectorAll('.railonly [data-dlg]').forEach(b=>b.onclick=()=>auf(b.dataset.dlg));

  /* Wie viele Stuecke traegt ein Buch? Einmal je Aufruf gezaehlt statt je
     Zeile — bei 6.231 Stuecken und 17 Buechern lohnt sich das. */
  function buchZahlen(){
    const z={}; ALL().forEach(t=>{ z[t.bid]=(z[t.bid]||0)+1; }); return z;
  }
  function kopf(titel, unterzeile){
    return '<div class="dlghead"><div><h3>'+esc(titel)+'</h3>'
      +'<div class="sub">'+esc(unterzeile)+'</div></div>'
      +'<button class="dlgclose" title="Schließen"><i class="i ic-x"></i></button></div>';
  }
  function zeileBuch(bid, name, zahl){
    const an = S.books.has(bid);
    return '<div class="dlgrow" role="checkbox" aria-checked="'+an+'" data-bid="'+esc(bid)+'">'
      +'<span class="dlgbox"><i class="i ic-check"></i></span>'
      +'<span class="nm">'+esc(name)+'</span>'
      +'<span class="cnt">'+zahl+'</span></div>';
  }

  function buecherHTML(){
    const z=buchZahlen();
    const gewaehlt=S.books.size;
    let alle=0, html='';
    BOOK_GROUPS.forEach(g=>{
      const bids=g.bids.filter(b=>PRESENT_BIDS.has(b)||b===SONST_BID);
      if(!bids.length) return;
      html+='<div class="ntitle">'+esc(g.label)+'</div>';
      bids.forEach(bid=>{ alle++;
        html+=zeileBuch(bid,(BOOKMETA[bid]||{}).name||bid, z[bid]||0); });
    });
    if(USERBOOKS.length){
      html+='<div class="ntitle">Eigene Bücher</div>';
      USERBOOKS.forEach(ub=>{ alle++; html+=zeileBuch(ub.bid, ub.name, z[ub.bid]||0); });
    }
    const sub = gewaehlt ? (gewaehlt+' von '+alle+' gewählt') : ('alle '+alle+' Bücher');
    const istStandard = (typeof booksAreDefault==='function') && booksAreDefault()
                        && (DEFAULT_BOOKS.length>0 || gewaehlt>0);
    return kopf('Bücher','Welche Bücher die Liste zeigt · '+sub)
      +'<div class="dlgbody">'+html+'</div>'
      +'<div class="dlgfoot">'
        +(gewaehlt?'<span class="link" data-a="clear">Auswahl aufheben</span>':'<span class="muted">Keine Auswahl — alle Bücher</span>')
        +'<span style="flex:1"></span>'
        +(istStandard
            ? '<span class="istStandard">✓ Ist der Standard</span>'
            : '<button class="btn ghost sm" data-a="default" title="Diese Auswahl beim Start vorwählen"><i class="i ic-star"></i> Als Standard</button>')
        +'<button class="btn sm" data-a="done">Fertig</button>'
      +'</div>';
  }

  function listenHTML(){
    let html='';
    html+='<div class="ntitle">Setlists</div>';
    if(!S.sets.length) html+='<div class="muted" style="padding:6px 10px 10px">Noch keine Setlist. Tippe bei einem Titel auf ＋.</div>';
    else S.sets.forEach(st=>{
      html+='<div class="dlgrow" data-set="'+esc(st.id)+'"><i class="i ic-list-music"></i>'
        +'<span class="nm">'+esc(st.name)+'</span>'
        +'<span class="cnt">'+st.items.length+'</span></div>';
    });
    const tags=S.tags.filter(t=>t.pinned || tagCount(t.id)>0)
      .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || norm(a.name).localeCompare(norm(b.name)));
    html+='<div class="ntitle">Aus Tags</div>';
    if(!tags.length) html+='<div class="muted" style="padding:6px 10px 10px">Noch keine Tags vergeben.</div>';
    else tags.forEach(tg=>{
      html+='<div class="dlgrow" data-tag="'+esc(tg.id)+'"><span class="dot" style="background:'+tg.color+'"></span>'
        +'<span class="nm">'+esc(tg.name)+'</span>'
        +'<span class="cnt">'+tagCount(tg.id)+'</span></div>';
    });
    return kopf('Listen','Setlists und Tags als Ansicht · '+(S.sets.length+tags.length)+' insgesamt')
      +'<div class="dlgbody">'+html+'</div>'
      +'<div class="dlgfoot"><span style="flex:1"></span><button class="btn sm" data-a="done">Fertig</button></div>';
  }

  function zeichne(){
    const art=document.body.dataset.dlg;
    if(art!=='books' && art!=='lists') return;
    dlg.innerHTML = (art==='books') ? buecherHTML() : listenHTML();
    dlg.querySelector('.dlgclose').onclick=zu;
    const fertig=dlg.querySelector('[data-a=done]'); if(fertig) fertig.onclick=zu;

    if(art==='books'){
      /* Die Auswahl wirkt sofort auf die Liste — der Dialog bleibt offen,
         damit man mehrere Bücher hintereinander an- und abwählen kann. */
      dlg.querySelectorAll('[data-bid]').forEach(r=>r.onclick=()=>{
        const bid=r.dataset.bid;
        S.books.has(bid) ? S.books.delete(bid) : S.books.add(bid);
        render(); zeichne();
      });
      const clr=dlg.querySelector('[data-a=clear]');
      if(clr) clr.onclick=()=>{ S.books=new Set(); render(); zeichne(); };
      const std=dlg.querySelector('[data-a=default]');
      if(std) std.onclick=()=>{ setDefaultBooks(); zeichne(); };
    } else {
      dlg.querySelectorAll('[data-set]').forEach(r=>r.onclick=()=>{
        S.view='set'; S.openSet=r.dataset.set; render(); zu();
      });
      dlg.querySelectorAll('[data-tag]').forEach(r=>r.onclick=()=>{
        S.view='tag:'+r.dataset.tag; S.openSet=null; render(); zu();
      });
    }
  }

  /* Klappt die Seitenleiste wieder auf, hat der Dialog keinen Zweck mehr. */
  const beobachter=new MutationObserver(()=>{
    if(document.body.dataset.dlg && document.body.dataset.nav!=='rail') zu();
  });
  beobachter.observe(document.body,{attributes:true,attributeFilter:['data-nav','data-o']});
})();
</script>

<script>
/* ================================================================
   Schritt 8 — die Setup-Seite

   Zweispaltig: links die Themen, rechts die Einstellungen des gewaehlten
   Themas. Jede Zeile ruft eine vorhandene Funktion auf; es wird nichts
   nachgebaut. Drei Themen fuehren in eine Unterseite, weil dort mehr als
   ein Knopf haengt.
   ================================================================ */
(function(){
  const AN = { rs:'rb_rowstyle', tagline:'rb_tagline' };
  const G = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const Sset = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };

  /* Vorgaben nach dem Entwurf: Zeilen-Stil B, Tag-Umrandung in Buchfarbe. */
  document.body.dataset.rs      = G(AN.rs) || 'b';
  document.body.dataset.tagline = G(AN.tagline) || 'book';

  /* Elf Themen in drei Gruppen (7. August 2026).
     Vorher waren es sieben, und drei Anwendungsfälle lagen quer darin: Der
     Import stand als Zeile in Content, der Export an zwei Orten unter zwei
     Namen — „Alles exportieren" in Content, „Sicherung exportieren" unter
     „Sicherung und Abgleich". Wer seine Noten weitergeben wollte, suchte unter
     Sicherung und fand das Falsche.
     Jetzt ist die erste Frage „rein oder raus", die zweite „was". Content
     enthält nur noch, was sein Name sagt: Bücher, Titel, Elemente ordnen. */
  const THEMEN = [
    ['content',    'Content',        'book-open',     'Bestand'],
    ['import',     'Import',         'download',      'Bestand'],
    ['export',     'Export',         'share',         'Bestand'],
    ['papierkorb', 'Papierkorb',     'trash-2',       'Bestand'],
    ['instrument', 'Voice',          'music',         'App'],
    ['darstellung','Darstellung',    'star',          'App'],
    ['werkzeug',   'Werkzeugleiste', 'grip-vertical', 'App'],
    ['listen',     'Listen und Tags','tags',          'App'],
    ['abgleich',   'Abgleich',       'undo-2',        'System'],
    ['ueber',      'Über',           'settings',      'System'],
  ];
  const THEMA_NAME = Object.fromEntries(THEMEN.map(([id,name])=>[id,name]));
  const UNTERTITEL = { instrumente:'Voices verwalten' };
  let thema='content', unter=null;

  /* ================================================================
     Content — der Bestand, in einem Fenster.

     Drei Ebenen, eine Liste, eine Werkzeugleiste. Wo Du bist, sagt der
     Brotkrumenpfad in der Kopfzeile; die Ebene folgt daraus und wird nicht
     eigens gewaehlt. Am 30. Juli mit Jens so festgelegt.

     Vorher steckte das Verwalten in einer Unterseite und der Import in einer
     Unterseite DAVON — zwei verschachtelte „Öffnen", und die Verschachtelung
     behauptete, Importieren sei ein Unterfall von Verwalten. Ist es nicht.
     ================================================================ */
  let cPfad=[];              /* [] = Bücher · [buchId] = Titel · [buchId,titelId] = Elemente */
  let cFlach=false;          /* die Ebene „Alle Titel", quer über alle Bücher */
  let cWahl=new Set();       /* was auf dieser Ebene angehakt ist */
  let cSuche='', cBuchst='';
  let cAktion=null;          /* {art:'verschieben'|'kopieren', ebene, ids} */
  const C_ARTEN_KEY='bs_teilen_arten';

  /* Beim Ebenenwechsel faellt die Auswahl weg — und die Suche mit ihr. Ein
     Suchwort, das aus der vorigen Ebene stehen bleibt, laesst die neue leer
     erscheinen, und niemand sucht die Ursache im Feld darueber. */
  function cZuruecksetzen(){ cWahl=new Set(); cSuche=''; }
  function cEbene(){ return cFlach ? 'titel' : (cPfad.length===0 ? 'buch' : cPfad.length===1 ? 'titel' : 'element'); }
  const cBuch  = () => (BS_KATALOG.buecher||[]).find(b=>b.id===cPfad[0]) || null;
  const cTitel = () => (BS_KATALOG.titel||[]).find(t=>t.id===cPfad[1]) || null;
  const EBENE_NAME={buch:'Buch', titel:'Titel', element:'Element'};

  /* ---- Bausteine einer Zeile ---- */
  function zeile(lb, sb){
    const r=document.createElement('div'); r.className='srow';
    const links=document.createElement('div');
    links.innerHTML='<div class="lb">'+esc(lb)+'</div>'+(sb?'<div class="sb">'+sb+'</div>':'');
    const ctl=document.createElement('div'); ctl.className='ctl';
    r.append(links,ctl); r._sb=links.querySelector('.sb'); r._ctl=ctl;
    return r;
  }
  function knopf(text, tu, art){
    const b=document.createElement('button'); b.className='btn ghost'+(art?' '+art:'');
    b.textContent=text; b.onclick=tu; return b;
  }
  function schalter(an, tu, gesperrt){
    const b=document.createElement('button'); b.className='sw'; b.dataset.on=!!an;
    b.setAttribute('role','switch'); b.setAttribute('aria-checked',!!an);
    if(gesperrt) b.disabled=true;
    else b.onclick=()=>{ const neu=b.dataset.on!=='true'; b.dataset.on=neu;
      b.setAttribute('aria-checked',neu); tu(neu); };
    return b;
  }
  function wahl(paare, jetzt, tu){
    const s=document.createElement('div'); s.className='seg2';
    paare.forEach(([wert,text])=>{
      const b=document.createElement('button'); b.textContent=text;
      b.setAttribute('aria-pressed', wert===jetzt);
      b.onclick=()=>{ tu(wert); zeichne(); };
      s.append(b);
    });
    return s;
  }
  /* Ein Schieber fuer stufenlose Werte. Der Zahlenwert steht daneben, sonst
     schiebt man ins Blinde. Geschrieben wird beim Loslassen und beim Ziehen —
     die Vorschau auf der Buehne soll mitgehen. */
  function regler(min, max, schritt, jetzt, tu, format){
    const w=document.createElement('div'); w.className='row'; w.style.cssText='gap:10px;align-items:center';
    const r=document.createElement('input'); r.type='range'; r.className='sreg';
    r.min=min; r.max=max; r.step=schritt; r.value=jetzt;
    const z=document.createElement('span'); z.className='muted';
    z.style.cssText='min-width:42px;text-align:right;font-variant-numeric:tabular-nums';
    /* Wie weit der Griff steht, weiss nur JavaScript — CSS kann den Wert eines
       Reglers nicht lesen. Ohne diese Zeile bliebe die Fuellung stehen. */
    const stand=()=>{ const p=(max-min)>0 ? (r.value-min)/(max-min)*100 : 0;
                      r.style.setProperty('--p', p.toFixed(1)+'%'); };
    const zeig=v=>{ z.textContent = format ? format(v) : String(v); };
    zeig(jetzt); stand();
    r.oninput=()=>{ stand(); zeig(+r.value); tu(+r.value); };
    w.append(r,z); return w;
  }
  function karte(titel, zeilen, erklaerung){
    const box=document.createDocumentFragment();
    if(titel){ const h=document.createElement('div'); h.className='sgrp'; h.textContent=titel; box.append(h); }
    if(erklaerung) box.append(hinweis(erklaerung));
    const c=document.createElement('div'); c.className='scard';
    zeilen.filter(Boolean).forEach(z=>c.append(z));
    box.append(c); return box;
  }
  /* Ein Erklärungsabsatz. Er steht ÜBER der Karte und nicht als Zeile darin —
     eine Zeile ohne Bedienelement sieht aus wie eine, an der etwas zu tun ist,
     und genau darüber ist Jens am 7. August gestolpert. */
  function hinweis(text, warnend){
    const p=document.createElement('p'); p.className='shint'+(warnend?' warn':'');
    p.innerHTML=text; return p;
  }
  const KANTEN=[['left','Links'],['top','Oben'],['right','Rechts'],['bottom','Unten']];

  /* ---- Gerüst: Themenliste links, Inhalt rechts ---- */
  function themenZeichnen(){
    const n=document.getElementById('supNav'); if(!n) return;
    n.innerHTML='';
    let gruppeJetzt=null;
    THEMEN.forEach(([id,name,icon,gruppe])=>{
      if(gruppe!==gruppeJetzt){
        gruppeJetzt=gruppe;
        const g=document.createElement('div'); g.className='supgrp'; g.textContent=gruppe;
        n.append(g);
      }
      const d=document.createElement('div');
      d.className='supitem'+(id===thema&&!unter?' active':'')+(id===thema?' gewaehlt':'');
      d.innerHTML='<i class="i ic-'+icon+'"></i><span>'+esc(name)+'</span>';
      d.onclick=()=>{ themaSetzen(id); };
      n.append(d);
    });
  }
  /* Ein Themenwechsel räumt auf, was zum vorigen Thema gehörte. Ohne das
     stünde man nach dem Wechsel von Content nach Import noch in einem Buch,
     und der Zurück-Pfeil führte irgendwohin. */
  function themaSetzen(id){
    thema=id; unter=null;
    if(id!=='content'){ cAktion=null; }
    zeichne();
  }
  /* Der Brotkrumenpfad. Er sagt, WO man ist — nicht, was man gerade tut: Die
     Handlung steht als Überschrift ihres Schrittes. Sonst wanderte die Ebene
     aus dem Pfad, sobald eine Funktion läuft, und man wüsste nicht mehr,
     worauf sie wirkt. */
  function cKrumen(){
    const teile=[{text:'Content', tu:()=>{ cPfad=[]; cFlach=false; cAktion=null; cZuruecksetzen(); zeichne(); }}];
    if(cFlach) teile.push({text:'Alle Titel'});
    else {
      const b=cBuch(); if(b) teile.push({text:b.name,
        tu:()=>{ cPfad=[b.id]; cAktion=null; cZuruecksetzen(); zeichne(); }});
      const t=cTitel(); if(t) teile.push({text:t.titel});
    }
    /* Läuft eine Handlung, steht sie am Ende des Pfades (Schritt 5). Wer nach
       einer Unterbrechung zurückkommt, liest oben „Content › Blauton › Zwei
       Titel verschieben" und weiß wieder, was er angefangen hat. Die Ebene
       darüber bleibt stehen — sonst wüsste man nicht, worauf es wirkt. */
    if(cAktion) teile.push({text:
      cMenge(cAktion.ebene, (cAktion.ids||[]).length) + ' '
      + (cAktion.art==='verschieben' ? 'verschieben' : 'kopieren')});
    return teile;
  }
  function kopfSetzen(){
    const h=document.querySelector('.suphead'); if(!h) return;
    const h2=h.querySelector('h2');
    if(thema==='content' && !unter){
      const teile=cKrumen();
      h2.innerHTML=teile.map((t,i)=>
        (i?'<span class="krumeTr"> › </span>':'')
        + '<span class="krume'+(t.tu?' klick':'')+'" data-k="'+i+'">'+esc(t.text)+'</span>').join('');
      h2.querySelectorAll('.krume.klick').forEach(el=>{
        const t=teile[+el.dataset.k]; el.onclick=t.tu;
      });
    } else {
      /* Der Kopf nennt das Thema, nicht „Setup". Wo man ist, soll oben stehen
         und nicht nur links in der Liste — im Hochformat ist die Liste schmal
         und der Name dort abgeschnitten. */
      h2.textContent = unter ? UNTERTITEL[unter] : (THEMA_NAME[thema] || 'Setup');
    }
    let z=h.querySelector('#supBack');
    const zurueckNoetig = unter || (thema==='content' && (cPfad.length || cFlach || cAktion));
    if(!zurueckNoetig){ if(z) z.remove(); return; }
    if(!z){
      z=document.createElement('button'); z.className='dlgclose'; z.id='supBack';
      z.title='Zurück'; z.innerHTML='<i class="i ic-arrow-left"></i>'; z.style.marginLeft='0';
      h.prepend(z);
    }
    z.onclick=()=>{
      if(unter){ unter=null; zeichne(); return; }
      if(cAktion){ cAktion=null; zeichne(); return; }
      if(cFlach){ cFlach=false; cZuruecksetzen(); zeichne(); return; }
      cPfad.pop(); cZuruecksetzen(); zeichne();
    };
  }
  function zeichne(){
    /* Steht der Assistent offen, gehört ihm das Wort. Ohne das zeichnete
       jede Änderung im Hintergrund die Seite neu, und seine Karten stünden
       doppelt da. */
    const assi=document.getElementById('impAssi');
    if(assi && assi.classList.contains('an')){ assiZeichnen(); }
    kopfSetzen(); themenZeichnen();
    const w=document.getElementById('supScroll'); if(!w) return;
    w.innerHTML='';
    if(unter==='instrumente') return zeichneInstrumente(w);
    const tu = { content:themaContent, import:zeichneImport, export:themaExport,
       papierkorb:cZeichneKorb,
       instrument:themaInstrument, darstellung:themaDarstellung,
       werkzeug:themaWerkzeug, listen:themaListen, abgleich:themaAbgleich,
       ueber:themaUeber }[thema];
    /* Ein unbekanntes Thema kann nur aus einem alten gespeicherten Zustand
       kommen. Dann lieber auf Content zurück als eine leere Seite. */
    if(!tu){ thema='content'; return zeichne(); }
    tu(w);
  }

  /* ---- Thema: Instrument ----
     Das Konzept nennt es den einzigen Ort, an dem etwas eingestellt wird.
     Aus dem Instrument folgt, welche Ausgabe aufgeht; es gibt keine zweite
     Regel und keinen Ort, an dem sich zwei Einstellungen widersprechen
     koennten. */
  /* In der Voice-Verwaltung steht der Anzeigename vorn — er ist der, den man
     ueberall sonst sieht. Der gespeicherte Name folgt dahinter, damit man die
     Kennung erkennt, unter der die Blaetter haengen. */
  const instrTitel = i => { const a=anzeigeStimme(i.name);
    return esc(a) + (a!==i.name ? ' <span class="muted">· '+esc(i.name)+'</span>' : ''); };
  function themaInstrument(w){
    const ich=(typeof meinInstrument==='function') ? meinInstrument() : null;
    const z_ich=zeile('Meine Voice',
      ich ? ('<b>'+instrTitel(ich)+'</b>'+(ich.notation ? ' · notiert in '+esc(ich.notation) : ' · ohne Notation'))
          : 'Noch keine gewählt — es öffnet die C-Ausgabe');
    z_ich._ctl.append(knopf(ich?'Ändern':'Wählen', ()=>{ unter='instrumente'; zeichne(); }));
    if(ich) z_ich._ctl.append(knopf('Keine', ()=>{ instrumentWaehlen(''); zeichne(); }));
    w.append(karte('Voice',[z_ich]));

    const stufe=(n,txt)=>zeile(n+'. Stufe', txt);
    w.append(karte('So wird die Stimme gewählt',[
      stufe(1,'Eine Stimme, die so heißt wie die Voice — deutsch oder englisch.'),
      stufe(2,'Sonst eine Stimme in der Notation der Voice — das trifft in den Real Books zu.'),
      stufe(3,'Sonst die C-Ausgabe, und gibt es die nicht, die erste vorhandene.'),
    ]));

    const z_lst=zeile('Voices verwalten',
      INSTRUMENTE.length+' Einträge · Namen, Notation und Abkürzungen ändern, anlegen, löschen und sortieren');
    z_lst._ctl.append(knopf('Öffnen', ()=>{ unter='instrumente'; zeichne(); }));
    w.append(karte('Die Liste',[z_lst]));
  }

  /* ---- Unterseite: die Instrumentenliste ----
     Ein Tipp auf eine Zeile waehlt das Instrument, das Stift-Zeichen macht
     sie zum Formular. Die Abkuerzungen werden erst beim Import eines
     Bandbuchs gebraucht (Schritt 6); gepflegt werden sie hier. */
  let instrBearbeitet=null;   // id des Eintrags, der gerade offen ist, oder 'neu'
  function zeichneInstrumente(w){
    const streit=kuerzelKonflikte();
    if(streit.length){
      const z=zeile('Doppelte Abkürzungen',
        streit.map(s=>'<b>'+esc(s.kurz)+'</b> gehört „'+esc(s.a)+'" und „'+esc(s.b)+'"').join('<br>'));
      z.classList.add('warnrow');
      w.append(karte('Achtung',[z]));
    }
    const zeilen=[];
    INSTRUMENTE.forEach(i=>{
      if(instrBearbeitet===i.id){ zeilen.push(formular(i)); return; }
      const gewaehlt = (typeof meinInstrument==='function') && meinInstrument() && meinInstrument().id===i.id;
      const z=zeile('', (i.notation ? 'Notiert in '+esc(i.notation) : 'Ohne Notation')
                    + (i.kurz.length ? ' · '+esc(i.kurz.join(', ')) : ''));
      z.querySelector('.lb').innerHTML = instrTitel(i);
      z.dataset.iid = i.id;
      /* Angefasst wird am Griff, nicht an der Zeile — sonst liesse sich die
         Liste nicht mehr rollen. Dieselbe Regel wie beim Sortieren einer
         Tag-Ansicht. */
      const griff=document.createElement('div'); griff.className='igriff';
      griff.title='Zum Sortieren ziehen';
      griff.innerHTML='<i class="i ic-grip-vertical"></i>';
      z.prepend(griff);
      if(gewaehlt) z.classList.add('gewaehlt');
      z._ctl.append(knopf(gewaehlt?'Gewählt':'Wählen', ()=>{ instrumentWaehlen(i.id); zeichne(); }));
      z._ctl.append(knopf('Ändern', ()=>{ instrBearbeitet=i.id; zeichne(); }));
      z._ctl.append(knopf('Löschen', ()=>{
        if(!confirm('„'+i.name+'" aus der Liste löschen?')) return;
        INSTRUMENTE = INSTRUMENTE.filter(x=>x.id!==i.id); instrumenteSichern();
        if(INSTR_WAHL===i.id) instrumentWaehlen('');
        zeichne();
      }, 'warn'));
      zeilen.push(z);
    });
    if(instrBearbeitet==='neu') zeilen.push(formular(null));
    const karteListe=document.createElement('div'); karteListe.append(karte('Voices', zeilen));
    w.append(karteListe);
    if(instrBearbeitet!=='neu'){
      const z=zeile('Neue Voice','Etwa eine zweite Gitarre: verdoppeln, umbenennen, Abkürzungen setzen');
      z._ctl.append(knopf('Anlegen', ()=>{ instrBearbeitet='neu'; zeichne(); }));
      w.append(karte(null,[z]));
    }
    const z_abc=zeile('Alphabetisch sortieren','Stellt die Reihenfolge nach dem deutschen Namen wieder her');
    z_abc._ctl.append(knopf('Sortieren', ()=>{ instrumenteAlphabetisch(); zeichne(); }));
    const z_zur=zeile('Vorgaben wiederherstellen','Setzt die Liste auf die zwanzig mitgelieferten Einträge zurück');
    z_zur._ctl.append(knopf('Zurücksetzen', ()=>{
      if(!confirm('Die Voice-Liste auf die Vorgaben zurücksetzen?\n\nEigene Einträge und Änderungen gehen dabei verloren.')) return;
      INSTRUMENTE = INSTR_FRISCH();
      instrumenteSichern();
      if(!INSTRUMENTE.some(i=>i.id===INSTR_WAHL)) instrumentWaehlen('');
      zeichne();
    }, 'warn'));
    w.append(karte('Reihenfolge und Vorgaben',[z_abc,z_zur]));
  }

  /* ---- Ziehen zum Sortieren ----
     Einmal verdrahtet, nicht bei jedem Zeichnen: Wer die Zeiger-Ereignisse in
     zeichneInstrumente anmeldete, haette nach zehn Durchgaengen zehn Zuhoerer
     am Fenster. Gearbeitet wird deshalb ueber den festen Rahmen. */
  (function(){
    const wo=document.getElementById('supScroll'); if(!wo) return;
    let zug=null, liste=null;
    wo.addEventListener('pointerdown', e=>{
      if(unter!=='instrumente' || instrBearbeitet) return;
      const griff=e.target.closest('.igriff'); if(!griff) return;
      const r=griff.closest('.srow'); if(!r || !r.dataset.iid) return;
      e.preventDefault();
      zug=r; liste=r.parentElement; r.classList.add('zieht');
      if(navigator.vibrate) try{ navigator.vibrate(8); }catch(_){}
    });
    window.addEventListener('pointermove', e=>{
      if(!zug) return;
      e.preventDefault();
      for(const r of liste.querySelectorAll('.srow[data-iid]')){
        if(r===zug) continue;
        const b=r.getBoundingClientRect();
        if(e.clientY < b.top + b.height/2){ if(r.previousSibling!==zug) liste.insertBefore(zug,r); return; }
      }
      if(liste.lastChild!==zug) liste.append(zug);
    }, {passive:false});
    const ende=()=>{
      if(!zug) return;
      zug.classList.remove('zieht'); zug=null;
      /* Die neue Reihenfolge steht im Dokument; von dort wird sie gelesen. */
      const ids=[...liste.querySelectorAll('.srow[data-iid]')].map(r=>r.dataset.iid);
      INSTRUMENTE.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
      instrumenteSichern(); liste=null;
      /* Die Reihenfolge dieser Liste bestimmt, in welcher Folge die Stimmen in
         der Hauptliste und in der Setliste stehen. Am 1. August von Jens so
         verlangt. Deshalb muss die Liste MIT neu gezeichnet werden — sonst
         sieht man die Wirkung erst nach einem Neustart. */
      render();
      zeichne();
    };
    window.addEventListener('pointerup', ende, true);
    window.addEventListener('pointercancel', ende, true);
  })();
  /* Die Zeile als Formular. Notation als Segment-Wahl, damit nur die fuenf
     gueltigen Werte hineinkommen; Abkuerzungen als freie Liste mit Komma. */
  function formular(i){
    const neu=!i;
    const r=document.createElement('div'); r.className='srow instrform';
    const nam=document.createElement('input'); nam.type='text'; nam.className='ifeld';
    nam.placeholder='Name, deutsch'; nam.value=i?i.name:'';
    const eng=document.createElement('input'); eng.type='text'; eng.className='ifeld';
    eng.placeholder='Name, englisch'; eng.value=i?(i.en||''):'';
    const kur=document.createElement('input'); kur.type='text'; kur.className='ifeld';
    kur.placeholder='Abkürzungen, mit Komma getrennt'; kur.value=i?i.kurz.join(', '):'';
    let notation = i ? i.notation : 'C';
    const seg=document.createElement('div'); seg.className='seg2';
    [['C','C'],['B♭','B♭'],['E♭','E♭'],['Bass','Bass'],['','—']].forEach(([wert,text])=>{
      const b=document.createElement('button'); b.textContent=text;
      b.setAttribute('aria-pressed', wert===notation);
      b.onclick=()=>{ notation=wert; [...seg.children].forEach(x=>x.setAttribute('aria-pressed','false'));
                      b.setAttribute('aria-pressed','true'); };
      seg.append(b);
    });
    const warn=document.createElement('div'); warn.className='sb iwarn';
    const knoepfe=document.createElement('div'); knoepfe.className='ctl';
    knoepfe.append(knopf('Sichern', ()=>{
      const name=nam.value.trim();
      if(!name){ warn.textContent='Ohne Namen geht es nicht.'; return; }
      const kurz=kur.value.split(',').map(s=>s.trim()).filter(Boolean);
      const eintrag={ id: neu ? ('u_'+Date.now().toString(36)) : i.id,
                      name, en:eng.value.trim(), notation, kurz };
      const probe = neu ? INSTRUMENTE.concat([eintrag])
                        : INSTRUMENTE.map(x=>x.id===i.id?eintrag:x);
      if(probe.filter(x=>instrNorm(x.name)===instrNorm(name)).length>1){
        warn.textContent='„'+name+'" steht schon in der Liste.'; return; }
      const streit=kuerzelKonflikte(probe);
      if(streit.length){
        /* Genannt wird der ANDERE Eintrag, nicht der gerade bearbeitete. Wer
           welcher ist, hing vorher an der Reihenfolge der Liste — seit sie
           alphabetisch steht, meldete das Setup „Tp gehört schon Cello",
           während man gerade Cello bearbeitete. */
        warn.innerHTML='Doppelte Abkürzung: '+streit.map(s=>
          '<b>'+esc(s.kurz)+'</b> gehört schon „'+esc(s.a===name ? s.b : s.a)+'"').join(', ');
        return; }
      INSTRUMENTE=probe; instrumenteSichern(); instrBearbeitet=null;
      if(INSTR_WAHL===eintrag.id) instrumentWaehlen(eintrag.id);
      zeichne();
    }));
    knoepfe.append(knopf('Abbrechen', ()=>{ instrBearbeitet=null; zeichne(); }));
    const links=document.createElement('div'); links.className='ifelder';
    links.append(nam, eng, seg, kur, warn);
    r.append(links, knoepfe);
    return r;
  }

  /* ---- Thema: Bücher ---- */
  /* ---- Thema: Content — der Bestand in einem Fenster ------------------ */
  function themaContent(w){
    if(cAktion) return cZeichneZiel(w);
    return cZeichneEbene(w);
  }

  /* Was auf dieser Ebene in der Liste steht. Eine Zeile ist ein Ding mit
     Kennung, Namen, einer Kennzahl und dem Weg nach unten. */
  /* Wie viele Zeilen HAETTE die Ebene ohne Suche und Buchstabe? Daran haengt
     nur die Frage, ob die Finden-Karte ueberhaupt lohnt — deshalb wird
     gezaehlt und nicht gebaut. */
  function cReihenRoh(){
    const K=BS_KATALOG;
    if(cFlach) return (K.titel||[]);
    if(cPfad.length===0) return (K.buecher||[]);
    if(cPfad.length===1) return (K.titel||[]).filter(t=>t.buchId===cPfad[0]);
    return (K.elemente||[]).filter(e=>e.titelId===cPfad[1]);
  }

  function cReihen(){
    const K=BS_KATALOG;
    if(cFlach){
      const buchName={}; (K.buecher||[]).forEach(b=>buchName[b.id]=b.name);
      let t=(K.titel||[]).slice();
      if(cSuche){ const q=norm(cSuche);
        t=t.filter(x=>norm(x.titel).includes(q) || norm(x.komponist||'').includes(q)); }
      if(cBuchst){ t=t.filter(x=>initialOf({t:x.titel})===cBuchst); }
      return t.sort((a,b)=>(a.titel||'').localeCompare(b.titel||'','de'))
              .map(x=>({ id:x.id, name:x.titel,
                unten: (x.komponist? esc(x.komponist)+' · ':'') + esc(buchName[x.buchId]||'')
                       + ' · ' + (K.elemente||[]).filter(e=>e.titelId===x.id).length + ' Elemente',
                zahl:'' }));
    }
    /* Die Suche gilt auf jeder Ebene, nicht nur in „Alle Titel". Jens hat am
       20. August danach gefragt: Wer in einem Buch mit vierhundert Titeln ein
       einzelnes Notizblatt loeschen will, soll nicht scrollen muessen. */
    const q = cSuche ? norm(cSuche) : '';
    if(cPfad.length===0){
      let bb=(K.buecher||[]).slice();
      if(q) bb=bb.filter(b=>norm(b.name||'').includes(q));
      return bb.sort((a,b)=>(a.name||'').localeCompare(b.name||'','de'))
        .map(b=>{ const tz=(K.titel||[]).filter(t=>t.buchId===b.id);
          const ez=(K.elemente||[]).filter(e=>tz.some(t=>t.id===e.titelId));
          return { id:b.id, name:b.name,
            unten: tz.length+(tz.length===1?' Titel':' Titel')+' · '+ez.length+(ez.length===1?' Element':' Elemente'),
            hinein:()=>{ cPfad=[b.id]; cZuruecksetzen(); zeichne(); } }; });
    }
    if(cPfad.length===1){
      return (K.titel||[]).filter(t=>t.buchId===cPfad[0])
        .filter(t=>!q || norm(t.titel||'').includes(q) || norm(t.komponist||'').includes(q))
        .filter(t=>!cBuchst || initialOf({t:t.titel})===cBuchst)
        .sort((a,b)=>(a.titel||'').localeCompare(b.titel||'','de'))
        .map(t=>{ const el=(K.elemente||[]).filter(e=>e.titelId===t.id)
                    .sort((a,b)=>(a.reihung||0)-(b.reihung||0));
          return { id:t.id, name:t.titel, komponist:t.komponist||'',
            unten: el.length ? esc(el.map(e=>zeigStimme(e.etikett,e.instrument)||e.art).join(' · '))
                             : '<i>noch keine Elemente</i>',
            hinein:()=>{ cPfad=[cPfad[0], t.id]; cZuruecksetzen(); zeichne(); } }; });
    }
    return (BS_KATALOG.elemente||[]).filter(e=>e.titelId===cPfad[1])
      /* Auf der Element-Ebene wird ueber alles gesucht, was in der Zeile
         steht: Etikett, Instrument, Art und Dateiname. „Notiz" findet damit
         die Notizblaetter, „alt" die Alt-Stimmen. */
      .filter(e=>!q || [e.etikett, e.instrument, (BS.ARTEN[e.art]||{}).name, e.dateiname]
                        .some(x=>norm(x||'').includes(q)))
      .sort((a,b)=>(a.reihung||0)-(b.reihung||0))
      .map(e=>({ id:e.id, name:zeigStimme(e.etikett,e.instrument)||BS.ARTEN[e.art].name,
        unten: BS.ARTEN[e.art].name + ' · ' + esc(e.dateiname||'ohne Datei')
               + (e.np>1 ? ' · '+e.np+' Seiten' : '')
               + (e.etikett && e.instrument && e.etikett!==e.instrument ? ' · erkannt als '+esc(anzeigeStimme(e.instrument)) : ''),
        el:e }));
  }

  /* Eine Listenzeile mit Haken. Die Mehrfachauswahl ist der Normalfall — auf
     jeder Ebene dieselbe Geste. */
  function cListenZeile(r, umbenennen){
    const z=zeile('', r.unten||''); z.classList.add('crow');
    const links=z.firstChild;
    /* `flex:1 1 240px` und nicht `flex:1` — sonst schrumpft die Spalte unter
       ihren Inhalt, und das Namensfeld wird auf null gequetscht, waehrend der
