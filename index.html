/* ---------- Viewer ---------- */
let CURRENT=null, fitOn=false;
let LISTNAV=[];               // Keys der aktuell angezeigten Liste (Kontext-Blättern)
/* Die Gruppen-Kennung je Zeile, in derselben Reihenfolge. Ohne sie findet ein
   Stueck seinen Platz im Blaetter-Kontext nicht, sobald eine andere als die
   angezeigte Stimme offen ist — der Kontext traegt ja den Schluessel der
   C-Ausgabe. Genau daran hing das Blaettern fest. */
let LISTGIDS=[];
let NAV={keys:[],idx:0};      // aktueller Blätter-Kontext im Betrachter
function openViewer(t, keepNav){
  CURRENT=t; fitOn=false;
  /* Das aktive Stueck ist etwas anderes als das gerade geoeffnete. Es bleibt
     aktiv, bis ein anderes gewaehlt wird — auch wenn im Hochformat ueber den
     Hamburger zur Liste zurueckgegangen wird. Daran haengen die Auszeichnung
     in der Liste und die Buehne nach dem Drehen. */
  window.aktivesStueck = t.key;
  if(!keepNav){
    /* Erst ueber den Schluessel, dann ueber die Gruppe. Ohne den zweiten Weg
       fand eine E-Ausgabe ihren Platz in der Liste nicht, der Kontext schrumpfte
       auf ein einziges Stueck, und das Blaettern stand still. */
    let i=LISTNAV.indexOf(t.key);
    if(i<0 && t.gid) i=LISTGIDS.indexOf(t.gid);
    NAV = (i>=0)?{keys:LISTNAV.slice(), idx:i} : {keys:[t.key], idx:0};
  }
  document.getElementById('vTitle').textContent=t.t;
  document.getElementById('vSub').textContent = t.isEdit
    ? ('✏️ '+(t.editor||'')+(t.editedAt?' — '+new Date(t.editedAt).toLocaleString('de-DE'):''))
    : t.isLib ? ((t.c?t.c+' — ':'')+t.b)
    : ((t.c?t.c+' — ':'')+t.b+', S. '+t.pg);
  const frame=document.getElementById('vFrame'), fit=document.getElementById('vFit');
  document.getElementById('viewer').classList.remove('fullscreen'); fitOn=false;
  resetFrameStyle();
  document.getElementById('vFitBtn').classList.remove('on');
  document.getElementById('vFitBtn').style.display='flex';
  document.getElementById('vEditBtn').style.display = t.isEdit ? 'none':'flex';
  const vMeta=document.getElementById('vMetaBtn');
  vMeta.style.display = 'flex';                                     // Titel/Komponist – Großsammlung, importierte Stücke UND Notizen
  vMeta.onclick=()=>openMetaSheet(t);
  const vt=document.querySelector('.vtitle');                       // Titel/Komponist direkt antippbar
  if(vt){ vt.style.cursor='pointer'; vt.title='Titel & Komponist bearbeiten'; vt.onclick=()=>openMetaSheet(CURRENT); }
  document.getElementById('vShare').onclick=()=>shareTune(t);
  document.getElementById('vPrint').onclick=()=>printCurrent(t);
  if(t.isEdit){
    frame.style.display='none'; frame.src='about:blank';
    fit.style.display='flex'; document.getElementById('vTab').style.display='none';
    renderUserFit(t);
  } else if(t.isLib){
    // Importiertes PDF: direkt über PDF.js (Blob) einpassen – zuverlässiger als Blob im Iframe (Safari)
    frame.style.display='none'; frame.src='about:blank';
    fit.style.display='flex'; document.getElementById('vTab').style.display='none';
    fitOn=true; renderPdfFit(t);
  } else {
    /* Das Blatt wird ueber PDF.js in die Hoehe eingepasst — im Querformat in
       die Buehne, im Hochformat in den Bildschirm. Safaris native Anzeige im
       Iframe passt die Seite nicht ein: quer lief sie rechts heraus, hoch sass
       sie oben mit leerer Flaeche darunter. Faellt PDF.js aus, greift der
       Rueckfallpfad in renderPdfFit und setzt das Iframe frisch. */
    fit.style.display='flex'; fit.innerHTML='';
    frame.style.display='none'; frame.src='about:blank';
    /* Im Hochformat bleibt '↗' erreichbar: Es oeffnet das PDF in einem eigenen
       Tab, wo Safaris Betrachter das Zoomen mit zwei Fingern anbietet. */
    const tab=document.getElementById('vTab');
    tab.style.display = (document.body.dataset.o==='land') ? 'none':'flex';
    tab.onclick=async()=>{ const u=await urlSichern(t); if(u) window.open(encodeURI(u),'_blank'); };
    fitOn=true; renderPdfFit(t);
  }
  updateNavUI();
  document.getElementById('viewer').classList.add('open');
  if(window.layout) window.layout();
  markPlayed(t);
}
function updateNavUI(){
  const multi=NAV.keys.length>1;
  const nav=document.getElementById('seqnav');
  if(!multi){ nav.style.display='none'; nav.innerHTML=''; }
  else{
    nav.style.display='flex';
    nav.innerHTML='<button class="btn ghost" id="navPrev" title="Vorheriges">‹</button>'
      +'<span id="navPos" style="align-self:center;color:var(--sub);font-size:13px;white-space:nowrap"></span>'
      +'<button class="btn ghost" id="navNext" title="Nächstes">›</button>';
    document.getElementById('navPos').textContent=(NAV.idx+1)+' / '+NAV.keys.length;
    const pv=document.getElementById('navPrev'), nx=document.getElementById('navNext');
    pv.disabled=NAV.idx<=0; nx.disabled=NAV.idx>=NAV.keys.length-1;
    pv.onclick=()=>navGo(-1); nx.onclick=()=>navGo(1);
  }
  const fp=document.getElementById('vFsPrev'), fn=document.getElementById('vFsNext');
  fp.hidden=!multi; fn.hidden=!multi;
  fp.disabled=NAV.idx<=0; fn.disabled=NAV.idx>=NAV.keys.length-1;
}
function navGo(delta){
  if(NAV.keys.length<2) return;
  const i=NAV.idx+delta; if(i<0||i>=NAV.keys.length) return;
  const wasFull=document.getElementById('viewer').classList.contains('fullscreen');
  NAV={keys:NAV.keys, idx:i}; let t=byKey[NAV.keys[i]]; if(!t) return;
  /* Die gewaehlte Stimme geht mit zum naechsten Stueck, sofern es sie hat.
     Wer eine Setlist in B durchspielt, bleibt in B. Sonst gilt, was die Zeile
     ohnehin zeigen wuerde.

     Der Wunsch ist ein eigener Zustand und wird NICHT aus CURRENT.stimme
     gelesen. Bis zum 28. Juli war er das, und dann loeschte ihn jedes Stueck
     ohne transponierte Ausgaben — dort ist die Stimme leer. Gemessen: Nach
     „Bass" wischte man weiter, traf „1983" ohne Ausgaben, und Bass war
     verloren. Schlimmer noch setzte „500 Miles High", das es nur in E gibt,
     den Wunsch versehentlich auf E, und der ueberstimmte danach das
     Instrument. */
  const wunsch = STIMMWUNSCH;
  if(wunsch && t.fam && GRUPPEN[t.gid]){
    const gleiche = GRUPPEN[t.gid].find(x=>x.stimme===wunsch);
    if(gleiche) t=gleiche;
  }
  openViewer(t, true);
  if(wasFull) enterFullscreen();
}
document.getElementById('vFsPrev').onclick=()=>navGo(-1);
document.getElementById('vFsNext').onclick=()=>navGo(1);
/* ---------- Blaettern: Blatt fuer Blatt ----------
   Ein Wisch bewegt genau ein Blatt weiter, gleich wie kraeftig gewischt wird.
   Dafuer scrollt die Flaeche nicht mehr von selbst (overflow:hidden); wir
   setzen die Position auf die Kante des naechsten Blattes. Liegt in
   Wischrichtung kein Blatt mehr, geht es zum naechsten Stueck. */
function blattKanten(){
  const fit=document.getElementById('vFit');
  const fr=fit.getBoundingClientRect(), pl=parseFloat(getComputedStyle(fit).paddingLeft)||0;
  return [...fit.querySelectorAll('.pg')]
    .map(c=>Math.round(c.getBoundingClientRect().left - fr.left + fit.scrollLeft - pl));
}
function blaettern(vor){
  const fit=document.getElementById('vFit');
  if(!document.getElementById('viewer').classList.contains('open')) return;
  const k=blattKanten(), jetzt=fit.scrollLeft;
  /* Die Kante des letzten Blattes ist oft gar nicht erreichbar: Dahinter liegt
     nur noch der Rand, und die Flaeche laesst sich nicht weiter schieben als
     bis scrollWidth minus clientWidth. Im Querformat fiel das nicht auf, weil
     Blatt und Flaeche dort fast gleich breit sind — im Hochformat blieb das
     Blaettern nach der zweiten Seite haengen, weil das Ziel immer 45 px vor
     dem lag, was die Flaeche hergibt. Deshalb wird das Ziel begrenzt, und wenn
     es uns nicht weiterbringt, geht es zum naechsten Stueck. */
  const grenze = Math.max(0, fit.scrollWidth - fit.clientWidth);
  let ziel = vor ? k.find(x=>x>jetzt+4) : k.slice().reverse().find(x=>x<jetzt-4);
  if(ziel!==undefined) ziel = Math.max(0, Math.min(ziel, grenze));
  const bringtNichts = (ziel===undefined) || (vor ? ziel<=jetzt+4 : ziel>=jetzt-4);
  if(bringtNichts){ navGo(vor?1:-1); return; }
  gleite(fit, ziel);
}
/* Weiches Blaettern: Der eingebaute Weg sprang hart, weil Safari die eigene
   Glaettung bei programmatischem Scrollen kaum ausfuehrt. 340 ms mit einer
   Kurve, die weich anfaengt und weich ausklingt. */
function gleite(el, ziel){
  const start=el.scrollLeft, weg=ziel-start, dauer=340;
  if(Math.abs(weg)<2){ el.scrollLeft=ziel; return; }
  cancelAnimationFrame(gleite._f);
  const t0=performance.now();
  const schritt=now=>{
    const p=Math.min(1,(now-t0)/dauer);
    const e = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    el.scrollLeft = start + weg*e;
    if(p<1) gleite._f=requestAnimationFrame(schritt);
  };
  gleite._f=requestAnimationFrame(schritt);
}
(function(){
  const el=document.getElementById('vFit'); let x0=null,y0=null,t0=0;
  el.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
  el.addEventListener('touchend',e=>{ if(x0==null)return; const c=e.changedTouches[0]; const dx=c.clientX-x0, dy=c.clientY-y0; x0=null;
    if(Date.now()-t0>1200) return;
    if(Math.abs(dx)<40 || Math.abs(dx)<Math.abs(dy)*1.2) return;
    blaettern(dx<0); },{passive:true});
})();
/* Pfeiltasten links/rechts blättern (funktionieren, wenn nicht in der Nativ-PDF-Ansicht fokussiert) */
document.addEventListener('keydown',e=>{
  if(!document.getElementById('viewer').classList.contains('open')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); blaettern(true); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); blaettern(false); }
});
document.getElementById('vClose').onclick=()=>{
  document.getElementById('viewer').classList.remove('open','fullscreen');
  document.getElementById('vFrame').src='about:blank';
  document.getElementById('vFit').innerHTML=''; document.getElementById('vFit').style.display='none';
  document.getElementById('vFrame').style.display='block'; fitOn=false; CURRENT=null;
  document.getElementById('seqnav').style.display='none';document.getElementById('seqnav').innerHTML='';
  NAV={keys:[],idx:0};
  if(window.layout) window.layout();
};
function enterFullscreen(){
  if(!CURRENT) return;
  const frame=document.getElementById('vFrame'), fit=document.getElementById('vFit');
  fitOn=true; document.getElementById('viewer').classList.add('fullscreen');
  document.getElementById('vFitBtn').classList.add('on');
  frame.style.display='none'; fit.style.display='flex';
  fit.innerHTML='<div class="vlade">Lädt…</div>';
  // Menüleiste ist jetzt ausgeblendet – erst nach Reflow messen, damit die volle Höhe genutzt wird
  const doFit=()=>{ if(!CURRENT) return; if(CURRENT.isEdit) renderUserFit(CURRENT); else renderPdfFit(CURRENT); };
  requestAnimationFrame(()=>requestAnimationFrame(doFit));
}
function exitFullscreen(){
  const frame=document.getElementById('vFrame'), fit=document.getElementById('vFit');
  fitOn=false; document.getElementById('viewer').classList.remove('fullscreen');
  document.getElementById('vFitBtn').classList.remove('on');
  fit.innerHTML=''; resetFrameStyle();
  if(CURRENT && CURRENT.isEdit){ fit.style.display='flex'; frame.style.display='none'; renderUserFit(CURRENT); }
  else if(CURRENT){
    /* Zurueck in die eingepasste Darstellung. Das Iframe ist hier nicht mehr
       der Anzeigeweg, also entfaellt sein Neuladen. Die Safari-Regel gegen die
       „Briefmarke" bleibt gewahrt: Ueberall, wo das Iframe doch zum Einsatz
       kommt — im Rueckfallpfad von renderPdfFit — wird seine Quelle frisch
       gesetzt, und genau darum geht es bei der Regel. */
    fit.style.display='flex'; frame.style.display='none'; frame.src='about:blank';
    fitOn=true; requestAnimationFrame(()=>{ if(window.layout) window.layout(); renderPdfFit(CURRENT); });
  }
  else { fit.style.display='none'; frame.style.display='block'; }
}
document.getElementById('vFitBtn').onclick=()=>{
  if(!CURRENT) return;
  if(document.getElementById('viewer').classList.contains('fullscreen')) exitFullscreen(); else enterFullscreen();
};
document.getElementById('vFsClose').onclick=exitFullscreen;
document.getElementById('vEditBtn').onclick=()=>{ if(CURRENT && !CURRENT.isEdit) openEditor(CURRENT); };

/* ---------- Teilen (Web Share) + Drucken ---------- */
function safeName(s){ return (s||'Stück').replace(/[\/\\:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80); }
async function fetchAsFile(t){
  if(t.isEdit){ const pages=await idbGetPages(t.key); if(!pages.length) return null;
    const bl=await (await fetch(pages[0])).blob(); return new File([bl], safeName(t.t)+'.png',{type:'image/png'}); }
  /* Aus der neuen Ablage direkt die Bytes nehmen, ohne Umweg ueber eine URL. */
  if(t.bsId){ const bl=await BS.bytes(t.bsId); if(!bl) return null;
    return new File([bl], safeName(t.t)+'.pdf',{type:'application/pdf'}); }
  const bl=await (await fetch(encodeURI(t.f))).blob(); return new File([bl], safeName(t.t)+'.pdf',{type:'application/pdf'});
}
async function shareTune(t){
  if(!t) return;
  await urlSichern(t);
  /* Ein Blatt aus der eigenen Ablage hat keine teilbare Adresse — sein Verweis
     gilt nur in dieser Sitzung. Geteilt wird dann die Datei, nicht die URL. */
  const title=t.t, url=t.bsId ? '' : new URL(encodeURI(t.f), location.href).href;
  // 1) Datei teilen (iPad/iPhone + neuere macOS): öffnet den Apple-Share-Dialog inkl. Drucken
  try{ const f=await fetchAsFile(t);
    if(f && navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  // 2) URL teilen (öffnet auch auf dem Mac den Apple-Share-Dialog)
  try{ if(navigator.share && url){ await navigator.share({title, url}); return; }
       if(navigator.share){ await navigator.share({title, text:title}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  // 3) Web Share nicht verfügbar (z. B. Doppelklick/file://)
  alert('Teilen ist hier nicht verfügbar – es funktioniert in der installierten App bzw. über die gehostete Adresse (Netlify) oder localhost. Ich öffne stattdessen den Druck-Dialog.');
  printCurrent(t);
}
function printCurrent(t){
  if(!t) return;
  if(t.isEdit){ printImages(t); return; }
  const frame=document.getElementById('vFrame');
  try{ if(frame && frame.style.display!=='none' && frame.contentWindow){ frame.contentWindow.focus(); frame.contentWindow.print(); return; } }catch(e){}
  /* Liegt das Blatt auf der Buehne, ist sein Verweis schon geliehen und der
     Klick bleibt eine Nutzerhandlung. Nur wenn nicht, muss gewartet werden —
     dafuer wird das Fenster vorher geoeffnet, sonst greift der Pop-up-Blocker. */
  if(t.f){ const w=window.open(encodeURI(t.f),'_blank');
    try{ w&&w.addEventListener&&w.addEventListener('load',()=>{try{w.print();}catch(e){}}); }catch(e){}
    return; }
  const w=window.open('','_blank'); if(!w){ alert('Bitte Pop-ups erlauben, um zu drucken.'); return; }
  urlSichern(t).then(url=>{
    if(!url){ try{ w.close(); }catch(e){} alert('Für diesen Titel ist keine Datei hinterlegt.'); return; }
    w.location.href=encodeURI(url);
    try{ w.addEventListener('load',()=>{try{w.print();}catch(e){}}); }catch(e){}
  });
}
async function shareSetlist(st){
  const items=st.items.map(k=>byKey[k]).filter(Boolean); if(!items.length) return;
  try{
    const files=[];
    for(const t of items){ if(t.isEdit) continue;
      const f=await fetchAsFile(t); if(f) files.push(f); }
    if(files.length && navigator.canShare && navigator.canShare({files})){ await navigator.share({files, title:st.name}); return; }
    if(navigator.share){ await navigator.share({title:st.name, text:st.name}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  printSetlist(st);
}

function setupTagDnD(card){
  const zones=[...card.querySelectorAll('.tagzone')]; let d=null;
  function zoneAt(x,y){ return zones.find(z=>{const r=z.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}); }
  function move(e){ if(!d)return; d.moved=true; const z=zoneAt(e.clientX,e.clientY); zones.forEach(zz=>zz.classList.toggle('over',zz===z)); }
  function up(e){ if(!d)return; const z=zoneAt(e.clientX,e.clientY);
    zones.forEach(zz=>zz.classList.remove('over')); d.el.classList.remove('dragging');
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    const id=d.id, moved=d.moved; d=null;
    if(z && moved){ const tag=tagById(id); const want=z.dataset.pinned==='1';
      if(tag && !!tag.pinned!==want){ tag.pinned=want; tag.updatedAt=Date.now(); save(); manageTagsFlow(); render(); } }
  }
  card.querySelectorAll('.tagcard').forEach(el=>{
    el.addEventListener('pointerdown',e=>{ if(e.target.closest('[data-e=edit]'))return; if(d)return; e.preventDefault();
      d={el,id:el.dataset.tag,moved:false}; el.classList.add('dragging');
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up); });
  });
}

function onDragMove(e){if(!drag)return;e.preventDefault();
  const li=drag.li,ul=li.parentElement,y=e.clientY;

  if(!placed)ul.appendChild(li);}

  li.classList.remove('dragging');drag.h.style.cursor='grab';
  drag.st.items=[...ul.children].map(x=>x.dataset.key);drag.st.updatedAt=Date.now();

const CLICKABLE='.tab,.fchip,.chip,.iconbtn,.link,.handle,.swatch,.tagcard,.collapse-h,.brand,.danger,.pen';
function a11y(root){ (root||document).querySelectorAll(CLICKABLE).forEach(el=>{
  if(!el.hasAttribute('tabindex')) el.tabIndex=0;
  if(!el.hasAttribute('role')) el.setAttribute('role','button'); }); }
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el=document.activeElement; if(!el||el===document.body) return;
  const tag=el.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||tag==='BUTTON') return;
  if(el.matches && el.matches(CLICKABLE)){ e.preventDefault(); el.click(); }
});
document.addEventListener('keydown',e=>{ if(e.key!=='Enter') return;
  const inp=e.target;
  if(inp && inp.matches && inp.matches('.newrow input')){
    const btn=inp.closest('.newrow').querySelector('.btn'); if(btn){ e.preventDefault(); btn.click(); } }
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  const viewer=document.getElementById('viewer');
  if(viewer.classList.contains('fullscreen')){ exitFullscreen(); return; }
  if(document.getElementById('sheet').classList.contains('open')){ closeSheet(); return; }
  if(viewer.classList.contains('open')){ document.getElementById('vClose').click(); }
});

/* ---------- Daten & Offline (Export / Import / PWA) ---------- */
function exportData(){
  const data={schema:1, app:'realbook', exportedAt:new Date().toISOString(),
    fav:[...S.fav], prac:[...S.prac], sets:S.sets, tags:S.tags, tuneTags:S.tuneTags};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(); const stamp=d.toISOString().slice(0,10);
  a.download='bandstand-daten-'+stamp+'.json'; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function mergeState(obj){
  if(!obj||typeof obj!=='object') throw new Error('Ungültige Datei');
  (obj.fav||[]).forEach(k=>S.fav.add(k));
  (obj.prac||[]).forEach(k=>S.prac.add(k));
  const setById=Object.fromEntries(S.sets.map(s=>[s.id,s]));
  (obj.sets||[]).forEach(s=>{const ex=setById[s.id];
    if(!ex){S.sets.push(s);setById[s.id]=s;} else if((s.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,s);}});
  const tagById2=Object.fromEntries(S.tags.map(t=>[t.id,t]));
  (obj.tags||[]).forEach(t=>{const ex=tagById2[t.id];
    if(!ex){S.tags.push(t);tagById2[t.id]=t;} else if((t.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,t);}});
  const inTags=id=>S.tags.some(t=>t.id===id);
  for(const k in (obj.tuneTags||{})){const cur=new Set(S.tuneTags[k]||[]);
    obj.tuneTags[k].forEach(id=>cur.add(id));
    const arr=[...cur].filter(inTags); if(arr.length)S.tuneTags[k]=arr; else delete S.tuneTags[k];}
  save(); render();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result);
      const before={sets:S.sets.length,tags:S.tags.length};
      mergeState(obj);
      alert('Import zusammengeführt.\nSetlists: '+before.sets+' → '+S.sets.length+'\nTags: '+before.tags+' → '+S.tags.length);
      closeSheet();
    }catch(e){ alert('Import fehlgeschlagen: '+e.message); } };
  r.readAsText(file);
}
/* ---- Baustein 2: Einstellungen als EINZELNE Dateien (je mit Versionskennung) ---- */
const PART_META={ setlists:{label:'Setlists',file:'setlists'}, tags:{label:'Tags',file:'tags'},
  favorites:{label:'Favoriten',file:'favoriten'}, practice:{label:'Üben-Liste',file:'ueben'} };
function partPayload(kind){
  const base={schema:1, app:'realbook', kind, exportedAt:new Date().toISOString()};
  if(kind==='setlists') return {...base, sets:S.sets};
  if(kind==='tags')     return {...base, tags:S.tags, tuneTags:S.tuneTags};
  if(kind==='favorites')return {...base, fav:[...S.fav]};
  if(kind==='practice') return {...base, prac:[...S.prac]};
  return base;
}
function downloadJSON(obj, name){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportPart(kind){ const m=PART_META[kind]; if(!m) return;
  downloadJSON(partPayload(kind), 'bandstand-'+m.file+'-'+new Date().toISOString().slice(0,10)+'.json'); }
/* Merge-Bausteine: neuere Version gewinnt (updatedAt); Favoriten/Üben = Vereinigung */
function mergeSets(arr){ const by=Object.fromEntries(S.sets.map(s=>[s.id,s])); let added=0,updated=0;
  (arr||[]).forEach(s=>{ if(!s||!s.id)return; const ex=by[s.id];
    if(!ex){ S.sets.push(s); by[s.id]=s; added++; }
    else if((s.updatedAt||0)>(ex.updatedAt||0)){ Object.assign(ex,s); updated++; } });
  return {added,updated}; }
function mergeTags(tags,tuneTags){ const by=Object.fromEntries(S.tags.map(t=>[t.id,t])); let added=0,updated=0;
  (tags||[]).forEach(t=>{ if(!t||!t.id)return; const ex=by[t.id];
    if(!ex){ S.tags.push(t); by[t.id]=t; added++; }
    else if((t.updatedAt||0)>(ex.updatedAt||0)){ Object.assign(ex,t); updated++; } });
  const inTags=id=>S.tags.some(t=>t.id===id);
  for(const k in (tuneTags||{})){ const cur=new Set(S.tuneTags[k]||[]);
    (tuneTags[k]||[]).forEach(id=>cur.add(id)); const a=[...cur].filter(inTags);
    if(a.length)S.tuneTags[k]=a; else delete S.tuneTags[k]; }
  return {added,updated}; }
function importPart(file){
  const r=new FileReader();
  r.onload=()=>{ try{
      const obj=JSON.parse(r.result);
      if(!obj||typeof obj!=='object') throw new Error('Ungültige Datei');
      let msg;
      if(obj.kind==='setlists'){ const b=S.sets.length; const {added,updated}=mergeSets(obj.sets);
        msg='Setlists: '+b+' → '+S.sets.length+' ('+added+' neu, '+updated+' aktualisiert)'; }
      else if(obj.kind==='tags'){ const b=S.tags.length; const {added,updated}=mergeTags(obj.tags,obj.tuneTags);
        msg='Tags: '+b+' → '+S.tags.length+' ('+added+' neu, '+updated+' aktualisiert)'; }
      else if(obj.kind==='favorites'){ const b=S.fav.size; (obj.fav||[]).forEach(k=>S.fav.add(k));
        msg='Favoriten: '+b+' → '+S.fav.size; }
      else if(obj.kind==='practice'){ const b=S.prac.size; (obj.prac||[]).forEach(k=>S.prac.add(k));
        msg='Üben-Liste: '+b+' → '+S.prac.size; }
      else { mergeState(obj); msg='Gesamtdatei zusammengeführt (Setlists '+S.sets.length+', Tags '+S.tags.length+').'; }
      save(); render();
      alert('Import zusammengeführt.\n'+msg);
      closeSheet();
    }catch(e){ alert('Import fehlgeschlagen: '+e.message); } };
  r.readAsText(file);
}
let precacheState={running:false,done:0,total:0};
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e=>{
  const m=e.data||{};
  if(m.type==='PRECACHE_PROGRESS'){precacheState={running:true,done:m.done,total:m.total}; updatePrecacheUI();}
  if(m.type==='PRECACHE_DONE'){precacheState={running:false,done:m.total,total:m.total}; updatePrecacheUI(true);}
});
function updatePrecacheUI(done){
  const el=document.getElementById('precacheStatus'); if(!el)return;
  if(done) el.textContent='✓ Alle '+precacheState.total+' Noten sind offline gespeichert.';
  else el.textContent='Speichere… '+precacheState.done+' / '+precacheState.total;
}
function precacheAll(){
  if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller){
    alert('Offline-Speicher ist erst nach der Installation (bzw. einem Neuladen der Seite) aktiv.'); return; }
  precacheState={running:true,done:0,total:TUNES.length}; updatePrecacheUI();
  navigator.serviceWorker.controller.postMessage({type:'PRECACHE_ALL', urls:TUNES.map(t=>t.f)});
}

/* ---------- Eigene Noten: Bücher anlegen, PDFs importieren, verwalten ----------
   Alles unten schreibt in die neue Ablage. Die alte `libtunes` wird nicht mehr
   beschrieben und bleibt als Rueckweg unberuehrt liegen. */
async function createBook(name){ name=(name||'').trim(); if(!name) return null;
  try{ const b=await BS.buchAnlegen({name}); await loadLibrary(); return b.id; }
  catch(e){ alert('Das Buch konnte nicht angelegt werden: '+(e&&e.message||e)); return null; }
}
async function deleteBook(bid){ const ub=userBook(bid); if(!ub) return;
  const own=LIBTUNES.filter(t=>t.bid===bid);
  if(!confirm('Buch „'+ub.name+'" löschen'+(own.length?' – samt '+own.length+' Stück'+(own.length>1?'en':'')+'?':'?')
      +'\n\nDas Gelöschte liegt danach im Papierkorb.')) return;
  own.forEach(t=>urlFreigeben(t));
  try{ await BS.loeschen('buch',[bid],'Buch löschen'); }
  catch(e){ alert('Löschen fehlgeschlagen: '+(e&&e.message||e)); return; }
  S.books.delete(bid);
  await loadLibrary(); render(); openLibrarySheet(); }
/* Einzelne PDFs dazulegen — der Knopf „＋ PDF" am Buch.

   Er liest Titel und Stimme genauso aus dem Dateinamen wie der
   Bandbuch-Import. Vorher nahm er den ganzen Dateinamen als Titel: Aus
   „Afro Blue Alt 1 NEU.pdf" wurde ein Stueck namens „Afro Blue Alt 1 NEU"
   ohne Stimme. Das war beim schnellen Nachlegen einer einzelnen Datei
   unbrauchbar und hat Jens am 30. Juli zu Recht gewundert.

   Gehoeren die Blaetter zu Stuecken, die im Buch schon stehen, wird EINMAL
   gefragt. Stillschweigend zusammengelegt wird nichts — dieselbe Regel wie in
   der Vorschau des Bandbuch-Imports. */
async function importPdfs(bid, files){
  const liste=[...files].filter(f=>/pdf$/i.test(f.type||'') || /\.pdf$/i.test(f.name||''));
  if(!liste.length) return 0;

  const saetze=liste.map(file=>{
    const name=file.name||'Stück';
    let z=nameZerlegen(name, ' - ');
    if(z.rest){ if(stimmeAmAnfang(z.titel) && !stimmeAmAnfang(z.rest)) z={titel:z.rest, rest:z.titel}; }
    else { const t=titelVorStimme(name); if(t) z=t; }
    const auto = blattArt(z.rest) || ((voiceAusText(z.rest)||{}).name) || '';
    return { file, pfad:name, name, kennung:name, titel:z.titel||name.replace(/\.pdf$/i,''),
             rest:z.rest||'', auto, hand:'', gruppe:'t:'+titelSchluessel(z.titel||name),
             voice:auto };
  });

  /* Was gibt es im Buch schon? */
  const imBuch={};
  (BS_KATALOG.titel||[]).filter(t=>t.buchId===bid).forEach(t=>{
    const k=titelSchluessel(t.titel||''); if(!(k in imBuch)) imBuch[k]=t.id; });
  const treffer=[...new Set(saetze.map(s=>titelSchluessel(s.titel)).filter(k=>imBuch[k]))];
  if(treffer.length){
    const andocken=confirm(
      treffer.length+' der Blätter '+(treffer.length===1?'gehört':'gehören')+' zu einem Titel, '
      +'das in diesem Buch schon steht.\n\n'
      +'OK: als weitere Stimme zum vorhandenen Titel legen\n'
      +'Abbrechen: als eigenen Titel anlegen');
    if(andocken) saetze.forEach(s=>{ const id=imBuch[titelSchluessel(s.titel)]; if(id) s.andockAn=id; });
  }

  const n=await importBandbuch(bid, saetze);
  openLibrarySheet();
  return n;
}
/* Ein Bandbuch schreiben. Erst hier, nach der Vorschau — vorher wird nichts
   angelegt und nichts geraten.

   Schritt 1b: Die Saetze werden nach ihrem Stueck gebuendelt und als Stuecke
   geschrieben, nicht mehr als einzelne Blaetter. Damit entsteht der Titel als
   eigene Sache, und die Blaetter eines Stuecks haengen an ihm. Zwei Stuecke
   desselben Namens bleiben zwei, weil die Vorschau sie getrennt fuehrt.

   Das Etikett ist Jens' Schreibweise, das Instrument das Erkannte. Beide
   werden getrennt mitgeschrieben — damit ist Schritt 3 des Import-Konzepts
   erledigt, und auf dem Schalter steht „Alt 1" statt zweimal „Alt-Sax". */
async function importBandbuch(bid, saetze, fortschritt){
  const gueltig=(saetze||[]).filter(s=>s && s.file &&
    (/pdf$/i.test(s.file.type||'') || /\.pdf$/i.test(s.file.name||'')));
  if(!gueltig.length) return 0;

  /* Buendeln. Die Vorschau liefert je Satz seinen Titel; gleiche Titel in
     derselben Reihenfolge gehoeren zum selben Stueck. Ein zweites Stueck mit
     demselben Namen entsteht nur, wenn die Vorschau es getrennt fuehrt —
     dafuer traegt jeder Satz seine Gruppenkennung `gruppe`, sofern gesetzt. */
  const nachStueck=new Map();
  for(const s of gueltig){
    const schl = s.gruppe || ('t:'+titelSchluessel(s.titel||'Stück'));
    if(!nachStueck.has(schl)) nachStueck.set(schl,
      { titel:{titel:s.titel||'Stück'}, elemente:[],
        /* Steht hier eine Kennung, dockt das Stueck an ein vorhandenes an,
           statt ein zweites gleichen Namens anzulegen. Gesetzt wird sie in
           der Vorschau und nur dort — hier wird nie nach Namen gesucht. */
        titelId: s.andockAn || null });
    const g=nachStueck.get(schl);
    g.elemente.push({ art:'blatt', etikett:'', instrument:s.voice || '',
                      dateiname:s.file.name, blob:s.file, np:1, _rest:s.rest||'' });
  }
  const gruppen=[...nachStueck.values()];

  /* ---- Das Etikett ----------------------------------------------------
     Gerechnet wird mit `etikettenBerechnen` — derselben Funktion, mit der die
     Vorschau anzeigt. Beim Andocken zaehlen die Blaetter mit, die am Stueck
     schon haengen; sonst hiessen ein vorhandenes und ein neues Alt-Blatt beide
     „Alt-Sax". Dieselben Eingaben, dasselbe Ergebnis: Was die Vorschau zeigt,
     wird auch geschrieben. */
  for(const g of gruppen){
    const vorhandene = g.titelId
      ? (BS_KATALOG.elemente||[]).filter(e=>e.titelId===g.titelId).map(e=>e.instrument||'')
      : [];
    const paare=g.elemente.map(e=>({instrument:e.instrument||'', rest:e._rest||''}));
    etikettenBerechnen(paare, vorhandene);
    g.elemente.forEach((e,i)=>{ e.etikett=paare[i].etikett; delete e._rest; });
    g.elemente.sort(nachStimmeOrdnen);
  }
  /* Seitenzahl aus den Bytes, mit PDF.js als Rueckfallweg. */
  let gelesen=0;
  const gesamtDateien=gueltig.length;
  for(const g of gruppen) for(const e of g.elemente){
    e.np=await BS.seitenzahl(e.blob);
    if(fortschritt) fortschritt('lesen', ++gelesen, gesamtDateien);
  }
  let ber;
  try{ ber=await BS.stueckeSchreiben(bid, gruppen, (n,g,t)=>{ if(fortschritt) fortschritt('schreiben',n,g,t); }); }
  catch(e){ alert('Import fehlgeschlagen: '+(e&&e.message||e)); return 0; }
  await loadLibrary(); render();
  window._letzterImport = ber;
  return ber.elemente;
}
window.importBandbuch = importBandbuch;

/* ---- Adapter auf die neue Ablage ----------------------------------------
   Die Oberflaeche ruft weiter `saveLibMeta(libId, patch)`. Nur wandern die
   Felder jetzt an die richtige Ebene: Titel und Komponist gehoeren dem STUECK,
   die Stimme dem BLATT. Genau das ist der Gewinn des eigenen Titels — ein
   Stueck umzubenennen kostet einen Schreibvorgang statt acht. */
async function saveLibMeta(id, patch){ return saveLibMetaMehrere([id], patch); }
async function saveLibMetaMehrere(ids, patch){
  ids=(ids||[]).filter(Boolean); if(!ids.length) return;
  const tunes=ids.map(id=>LIBTUNES.find(x=>x.libId===id)).filter(Boolean);
  if(!tunes.length) return;
  try{
    /* Titel und Komponist: je betroffenes Stueck EIN Schreibvorgang. */
    if('title' in patch || 'composer' in patch){
      const stueck={};
      tunes.forEach(t=>{ stueck[t.titelId]=true; });
      const p={};
      if('title' in patch) p.titel=(patch.title||'').trim()||'Stück';
      if('composer' in patch) p.komponist=(patch.composer||'').trim();
      for(const tid of Object.keys(stueck)) await BS.aendern('titel', tid, p);
    }
    /* Die Stimme: je Blatt. Das Etikett folgt der Stimme, solange der Nutzer
       kein eigenes gesetzt hat — sonst hiesse ein richtiggestelltes Blatt
       weiter wie zuvor. */
    if('voice' in patch){
      for(const t of tunes){
        const el=BS_KATALOG.elemente.find(e=>e.id===t.libId); if(!el) continue;
        const neu={instrument:patch.voice||''};
        if(!el.etikett || el.etikett===el.instrument) neu.etikett=patch.voice||'';
        await BS.aendern('element', t.libId, neu);
      }
    }
    if('etikett' in patch){
      for(const t of tunes) await BS.aendern('element', t.libId, {etikett:(patch.etikett||'').trim()});
    }
  }catch(e){ alert('Konnte die Änderung nicht speichern: '+(e&&e.message||e)); }
  await loadLibrary(); render();
}
/* Mehrere Blaetter loeschen: einmal fragen, einmal aufraeumen. Die
   Verweise in Favoriten, Uebungsliste, Tags und Setlists muessen mit weg,
   sonst zeigen sie ins Leere. */
async function deleteLibTunes(ids){
  if(!ids.length) return false;
  const namen=ids.map(id=>{ const t=LIBTUNES.find(x=>x.libId===id);
    return t ? (t.stimme ? t.t+' · '+t.stimme : t.t) : 'Blatt'; });
  const frage = ids.length===1
    ? '„'+namen[0]+'" löschen?'
    : ids.length+' Blätter löschen?\n\n'+namen.slice(0,12).join('\n')
      + (ids.length>12 ? '\n… und '+(ids.length-12)+' weitere' : '');
  if(!confirm(frage+'\n\nDas Gelöschte liegt danach im Papierkorb.')) return false;
  /* Die Verweise in Favoriten, Uebungsliste, Tags und Setlists muessen mit
     weg, sonst zeigen sie ins Leere. Der Schluessel wird am Eintrag abgelesen
     und nicht zusammengebaut — er hiess frueher `lib|…` und heisst jetzt
     `bs|…`; zusammengebaut waere er beim Umstieg still falsch geworden. */
  const schluessel=ids.map(id=>{ const t=LIBTUNES.find(x=>x.libId===id); return t&&t.key; }).filter(Boolean);
  ids.forEach(id=>{ const t=LIBTUNES.find(x=>x.libId===id); if(t) urlFreigeben(t); });
  try{ await BS.loeschen('element', ids, 'Blätter löschen'); }
  catch(e){ alert('Löschen fehlgeschlagen: '+(e&&e.message||e)); return false; }
  schluessel.forEach(k=>{ S.fav.delete(k); S.prac.delete(k); delete S.tuneTags[k];
    S.sets.forEach(st=>st.items=st.items.filter(x=>x!==k)); });
  save(); await loadLibrary(); render();
  return true;
}
async function deleteLibTune(id){ const t=LIBTUNES.find(x=>x.libId===id);
  if(!confirm('„'+((t&&t.t)||'Stück')+'" löschen?\n\nDas Gelöschte liegt danach im Papierkorb.')) return;
  const k=t&&t.key; if(t) urlFreigeben(t);
  try{ await BS.loeschen('element',[id],'Blatt löschen'); }
  catch(e){ alert('Löschen fehlgeschlagen: '+(e&&e.message||e)); return; }
  if(k){ S.fav.delete(k); S.prac.delete(k); delete S.tuneTags[k];
    S.sets.forEach(st=>st.items=st.items.filter(x=>x!==k)); save(); }
  await loadLibrary(); render(); openLibrarySheet(); }
async function exportLibTune(id){ const r=await libGet(id); if(!r||!r.blob) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(r.blob); a.download=safeName(r.title)+'.pdf';

function resetOverride(key){ const t=byKey[key]; if(!t) return; delete OVERRIDES[key]; t.t=t._ot; t.c=t._oc; saveOverrides(); rebuildByKey(); render(); }

      : ((t.c?t.c+' — ':'')+t.b+', S. '+t.pg); } }

  if('t' in patch) u.t=(patch.t||'').trim()||u.t;

/* ---------- Baustein 3b: Sammlungspaket (eigene Noten als eine Datei) ---------- */
/* Der Export des ganzen Bestands. Er liegt jetzt in BS: sprechende Namen im
   Ordner, die Kennungen im Katalog daneben, dazu eine LIESMICH — lesbar auch
   ohne BandStand. Gemessen an 6.231 Blaettern: 23,7 s, 298,8 MB. */
async function exportPackage(){
  const z=await BS.zahlen();
  if(!z.elemente){ alert('Es sind keine eigenen Noten zum Sichern vorhanden.'); return; }
  const alle=confirm('Bestand exportieren.\n\n'+z.titel+' Stücke, '+z.elemente+' Elemente.\n\n'
    +'OK: mit Tonaufnahmen (größer)\nAbbrechen: nur Noten');
  try{
    const zahl=await BS.exportAlsDatei(alle?{arten:Object.keys(BS.ARTEN)}:undefined);
    alert('Export erstellt.\n'+zahl.titel+' Stücke, '+zahl.elemente+' Elemente, '
      +(zahl.bytes/1048576).toFixed(1)+' MB.');
  }catch(e){ alert('Export fehlgeschlagen: '+(e&&e.message||e)); }
}
/* Einlesen. Es kennt zwei Formen: den neuen Katalog und das alte
   Sammlungspaket, damit frueher erzeugte Pakete nicht verloren sind.

   In beiden Faellen bleiben die KENNUNGEN erhalten. Deshalb verdoppelt ein
   zweites Einlesen desselben Pakets nichts, sondern erkennt „habe ich schon". */
async function importPackage(file){
  let zip; try{ zip=await JSZip.loadAsync(file); }catch(e){ alert('Kein gültiges Paket.'); return; }
  const neu=zip.file('katalog.json'), alt=zip.file('manifest.json');
  if(!neu && !alt){ alert('Das Paket enthält weder katalog.json noch manifest.json.'); return; }
  let kat;
  try{ kat=JSON.parse(await (neu||alt).async('string')); }
  catch(e){ alert('Der Katalog im Paket ist nicht lesbar.'); return; }

  const vorhanden=new Set((BS_KATALOG.elemente||[]).map(e=>e.id));
  const buchDa=new Set((BS_KATALOG.buecher||[]).map(b=>b.id));
  let neueBuecher=0, dazu=0, schonDa=0, ohneDatei=0;

  if(neu){
    /* Neue Form: Buecher, Titel und Elemente mit ihren Kennungen. */
    for(const b of (kat.buecher||[])){
      if(!b || !b.id || buchDa.has(b.id)) continue;
      await BS._intern.tx('buecher','readwrite',st=>st.put({
        id:b.id, name:b.name||'Import', chip:b.chip||b.name||'Import',
        hubId:b.hubId||null, angelegt:b.angelegt||Date.now(), geaendert:Date.now() }));
      buchDa.add(b.id); neueBuecher++;
    }
    const titelDa=new Set((BS_KATALOG.titel||[]).map(t=>t.id));
    for(const t of (kat.titel||[])){
      if(!t || !t.id || titelDa.has(t.id)) continue;
      const bid = buchDa.has(t.buchId) ? t.buchId : (await sammelBuch(buchDa));
      await BS._intern.tx('titel','readwrite',st=>st.put({
        id:t.id, buchId:bid, titel:t.titel||'Stück', komponist:t.komponist||'',
        angelegt:t.angelegt||Date.now(), geaendert:Date.now() }));
      titelDa.add(t.id);
    }
    for(const e of (kat.elemente||[])){
      if(!e || !e.id){ continue; }
      if(vorhanden.has(e.id)){ schonDa++; continue; }
      if(!titelDa.has(e.titelId)){ ohneDatei++; continue; }
      let blob=null;
      if(e.datei){ const zf=zip.file(e.datei); if(zf) blob=await zf.async('blob'); }
      if(!blob && (BS.ARTEN[e.art]||{}).bytes){ ohneDatei++; continue; }
      await BS._intern.tx(['elemente','bytes'],'readwrite',(el,by)=>{
        el.put({ id:e.id, titelId:e.titelId, art:e.art||'blatt', etikett:e.etikett||'',
                 instrument:e.instrument||'', reihung:e.reihung||0, np:e.np||1,
                 dateiname:e.dateiname||'', groesse:(blob&&blob.size)||0, ziel:e.ziel||'',
                 angelegt:e.angelegt||Date.now(), geaendert:Date.now() });
        if(blob) by.put({id:e.id, blob});
      });
      vorhanden.add(e.id); dazu++;
    }
  } else {
    /* Alte Form: je Stueck ein Satz. Daraus wird je Satz ein Stueck mit einem
       Blatt — die Kennung wird als Element-Kennung uebernommen. */
    for(const b of (kat.books||[])){
      if(!b || !b.bid || buchDa.has(b.bid)) continue;
      await BS._intern.tx('buecher','readwrite',st=>st.put({
        id:b.bid, name:b.name||'Import', chip:b.chip||b.name||'Import',
        hubId:null, angelegt:b.createdAt||Date.now(), geaendert:Date.now() }));
      buchDa.add(b.bid); neueBuecher++;
    }
    for(const m of (kat.tunes||[])){
      if(!m || !m.id){ continue; }
      if(vorhanden.has(m.id)){ schonDa++; continue; }
      const zf=m.file && zip.file(m.file); if(!zf){ ohneDatei++; continue; }
      const blob=await zf.async('blob');
      const bid = buchDa.has(m.bid) ? m.bid : (await sammelBuch(buchDa));
      const tid = BS.kennung('ti');
      await BS._intern.tx(['titel','elemente','bytes'],'readwrite',(t,el,by)=>{
        t.put({ id:tid, buchId:bid, titel:m.title||'Stück', komponist:m.composer||'',
                angelegt:m.addedAt||Date.now(), geaendert:Date.now() });
        el.put({ id:m.id, titelId:tid, art:'blatt', etikett:m.voice||'', instrument:m.voice||'',
                 reihung:0, np:m.np||1, dateiname:m.fileName||'', groesse:blob.size, ziel:'',
                 angelegt:m.addedAt||Date.now(), geaendert:Date.now() });
        by.put({id:m.id, blob});
      });
      vorhanden.add(m.id); dazu++;
    }
  }
  await loadLibrary(); render(); openLibrarySheet();
  alert('Paket eingelesen.\n'+dazu+' Element'+(dazu===1?'':'e')+' hinzugefügt'
    +(schonDa?', '+schonDa+' schon vorhanden':'')
    +(ohneDatei?', '+ohneDatei+' ohne Datei übergangen':'')
    +(neueBuecher?'\n'+neueBuecher+' Buch/Bücher angelegt':''));
}
/* Ein Sammelbuch fuer Stuecke, deren Buch im Paket fehlt. */
let _sammelBid=null;
async function sammelBuch(buchDa){
  if(_sammelBid && buchDa.has(_sammelBid)) return _sammelBid;
  const b=await BS.buchAnlegen({name:'Importierte Noten'});
  _sammelBid=b.id; buchDa.add(b.id); return b.id;
}

/* ================================================================
   Die Stimmen-Wahl

   Ein Knopf, der eine Liste aufklappt. Die Liste haengt am Dokument
   und nicht am Knopf: Sonst schnitte sie der Rand des schwebenden
   Fensters ab, und im Setup der Rand der Rollflaeche.

   Der Inhalt kommt aus EINER Quelle — dieselbe Liste steht in der
   Vorschau und in jedem Fenster.
   ================================================================ */
/* Was hinter dem Namen in Klammern steht. Die Notation kommt aus der
   Voice-Liste, wo Jens sie festlegt; „ohne Notation" ist dieselbe Wendung,
   die der Voice-Dialog verwendet. Schlagzeug und Percussion kommen in
   transponierten Ausgaben nicht vor und tragen darum keine. */
function notationText(i){ return i.notation ? i.notation : 'ohne Notation'; }
function stimmenAuswahl(erkannt){
  const aus=[{ wert:'', text:'Automatisch erkennen',
               ton: erkannt ? erkannt : 'nichts erkannt', kopf:null }];
  INSTRUMENTE.forEach((i,n)=>aus.push({ wert:i.name, text:i.name, ton:notationText(i),
                                        kopf: n===0 ? 'Instrumente' : null }));
  BLATT_NAMEN.forEach((n,k)=>aus.push({ wert:n, text:n, ton:'keine Stimme',
                                        kopf: k===0 ? 'Blätter' : null }));
  aus.push({ wert:'-', text:'Auslassen', ton:'wird nicht importiert', kopf:'Sonst' });
  return aus;
}
/* Dieselbe Liste fuer den fertigen Bestand. Dort gibt es kein „Auslassen"
   mehr — was importiert ist, ist da — und statt „Automatisch erkennen" steht
   „Keine Stimme": ein Blatt ohne Stimme ist eine gueltige Angabe, keine
   fehlende. */
function stimmenAuswahlBestand(){
  const aus=[{ wert:'', text:'Keine Stimme', ton:'steht für sich', kopf:null }];
  INSTRUMENTE.forEach((i,n)=>aus.push({ wert:i.name, text:i.name, ton:notationText(i),
                                        kopf: n===0 ? 'Instrumente' : null }));
  BLATT_NAMEN.forEach((n,k)=>aus.push({ wert:n, text:n, ton:'keine Stimme',
                                        kopf: k===0 ? 'Blätter' : null }));
  return aus;
}
const AWAHL = (function(){
  let liste=null, offenerKnopf=null;
  function bauen(){
    if(liste) return;
    liste=document.createElement('div'); liste.className='awahlliste';
    document.body.append(liste);
    /* Ein Tipp daneben schliesst. `pointerdown` statt `click`, damit die
       Liste weg ist, bevor darunter etwas anderes anspringt. */
    document.addEventListener('pointerdown', e=>{
      if(!offenerKnopf) return;
      if(liste.contains(e.target) || offenerKnopf.contains(e.target)) return;
      zu();
    }, true);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && offenerKnopf){ e.stopPropagation(); zu(); } }, true);
    /* Rollt oder dreht sich etwas, stimmt die Stelle nicht mehr. Dann lieber
       schliessen als daneben stehen. */
    window.addEventListener('resize', zu);
    window.addEventListener('scroll', zu, true);
  }
  function zu(){
    if(!offenerKnopf) return;
    offenerKnopf.setAttribute('aria-expanded','false');
    offenerKnopf=null; liste.classList.remove('offen'); liste.innerHTML='';
  }
  function stellen(knopf){
    const r=knopf.getBoundingClientRect();
    liste.style.visibility='hidden'; liste.classList.add('offen');
    liste.style.left='0px'; liste.style.top='0px';
    const lb=liste.offsetWidth, lh=liste.offsetHeight;
    let x=r.left, y=r.bottom+6;
    if(y+lh>window.innerHeight-8) y=Math.max(8, r.top-lh-6);      /* nach oben klappen */
    if(y+lh>window.innerHeight-8) y=Math.max(8, window.innerHeight-lh-8);
    x=Math.max(8, Math.min(x, window.innerWidth-lb-8));
    liste.style.left=Math.round(x)+'px'; liste.style.top=Math.round(y)+'px';
    liste.style.visibility='';
  }
  /* knopf: der Knoten. eintraege: [{wert,text,ton,kopf}]. wert: der jetzige.
     aufWahl(neu): wird gerufen, wenn gewaehlt wurde. */
  function auf(knopf, eintraege, wert, aufWahl){
    bauen();
    if(offenerKnopf===knopf){ zu(); return; }
    zu();
    offenerKnopf=knopf; knopf.setAttribute('aria-expanded','true');
    eintraege.forEach(e=>{
      if(e.kopf){ const h=document.createElement('div'); h.className='akopf'; h.textContent=e.kopf; liste.append(h); }
      const b=document.createElement('button'); b.type='button';
      b.innerHTML='<span>'+esc(e.text)+'</span>'+(e.ton?'<span class="ton">'+esc(e.ton)+'</span>':'');
      if(e.wert===wert) b.className='an';
      b.onclick=()=>{ const w=e.wert; zu(); aufWahl(w); };
      liste.append(b);
    });
    stellen(knopf);
  }
  /* Der Knopf selbst. `beschriftung(wert)` liefert, was darauf steht. */
  function knopf(hole, aufWahl, titel){
    const b=document.createElement('button'); b.type='button'; b.className='awahl';
    b.setAttribute('aria-haspopup','listbox'); b.setAttribute('aria-expanded','false');
    if(titel) b.title=titel;
    b.innerHTML='<span class="wert"></span><span class="ton"></span><i class="i ic-chevron-down"></i>';
    b._auffrischen=()=>{
      const {wert, text, ton}=hole();
      b.querySelector('.wert').textContent=text;
      b.querySelector('.ton').textContent=ton||'';
      b.dataset.wert=wert;
    };
    b.onclick=()=>{ const {wert, eintraege}=hole(); auf(b, eintraege, wert, aufWahl); };
    b._auffrischen();
    return b;
  }
  return { knopf, zu };
})();

/* ================================================================
   Das schwebende PDF-Fenster

   Es zeigt EIN PDF, frei verschiebbar, an der unteren rechten Ecke
   skalierbar, mit „X" zu schliessen. Die Seite wird immer GANZ
   gezeigt: eingepasst in die Flaeche, nie beschnitten.

   Es ist bewusst vom Safari-Betrachter getrennt. Der ist die
   empfindlichste Stelle des Projekts und wird nicht angefasst; dieses
   Fenster ist neuer, eigener Code und teilt mit ihm nichts als die
   Bibliothek PDF.js.

   Es gibt beliebig viele davon — wer „Alt 1" gegen „Alt 2" halten
   will, macht beide auf. Jedes traegt die Kennung seiner Datei; ein
   zweiter Tipp auf dieselbe Datei holt das vorhandene Fenster nach
   vorn, statt ein zweites danebenzustellen.
   ================================================================ */
/* Was nach der Stimmenwahl geschieht. Voreingestellt bleibt das Fenster
   stehen; wer viele Blaetter am Stueck zuordnet, stellt auf „schließen" und
   spart je Blatt einen Griff. Eigener Speicher, v3 liest ihn nicht. */
const PDFW_ZU_KEY='rb_pdfw_zu';
function pdfwZuNachWahl(){
  try{ return localStorage.getItem(PDFW_ZU_KEY)==='wahl'; }catch(e){ return false; }
}
function pdfwZuNachWahlSetzen(an){
  try{ localStorage.setItem(PDFW_ZU_KEY, an?'wahl':'knopf'); }catch(e){}
}
window.pdfwZuNachWahl=pdfwZuNachWahl;
window.pdfwZuNachWahlSetzen=pdfwZuNachWahlSetzen;

const PDFW = (function(){
  const fenster=new Map();          /* kennung -> Zustand */
  let obenZ=96, fang=null, versatz=0, letzterKasten=null;

  function fangFlaeche(){
    if(!fang) fang=document.getElementById('pdfwFang');
    return fang;
  }
  /* Ein neues Fenster steht nicht auf dem alten, sondern versetzt daneben —
     sonst sieht es beim zweiten Aufmachen so aus, als sei nichts geschehen. */
  function neuerKasten(){
    const B=window.innerWidth, H=window.innerHeight;
    if(letzterKasten){
      versatz=(versatz+1)%6;
      const k={...letzterKasten, x:letzterKasten.x+26*versatz, y:letzterKasten.y+26*versatz};
      return k;
    }
    const h=Math.min(Math.round(H*0.78), 760);
    const b=Math.min(Math.round(h*0.78), Math.round(B*0.6), 620);
    return { x:Math.max(12, B-b-24), y:Math.max(12, Math.round((H-h)/2)), b, h };
  }
  function einpassenInsBild(k){
    const B=window.innerWidth, H=window.innerHeight;
    k.b=Math.max(240, Math.min(k.b, B-16));
    k.h=Math.max(200, Math.min(k.h, H-16));
    k.x=Math.max(8, Math.min(k.x, B-k.b-8));
    k.y=Math.max(8, Math.min(k.y, H-k.h-8));
    return k;
  }
  function anwenden(f){
    f.knoten.style.left=f.kasten.x+'px'; f.knoten.style.top=f.kasten.y+'px';
    f.knoten.style.width=f.kasten.b+'px'; f.knoten.style.height=f.kasten.h+'px';
  }
  function hervorholen(f){
    f.knoten.style.zIndex=++obenZ;
    fenster.forEach(x=>{ if(x!==f) delete x.knoten.dataset.oben; });
    f.knoten.dataset.oben='1';
  }
  function oberstes(){
    let best=null;
    fenster.forEach(f=>{ if(!best || +f.knoten.style.zIndex > +best.knoten.style.zIndex) best=f; });
    return best;
  }

  /* Verschieben und Skalieren. Kein `setPointerCapture` — statt dessen faengt
     eine Flaeche ueber allem die Zeiger ab. Capture und Canvas vertragen sich
     in Safari nicht zuverlaessig, und die Fangflaeche haelt den Zug auch
     dann, wenn der Finger ueber einen Knopf faehrt. */
  function ziehen(f, knoten, art){
    knoten.addEventListener('pointerdown', e=>{
      if(e.button!==undefined && e.button!==0) return;
      if(art==='verschieben' && e.target.closest('button')) return;
      e.preventDefault(); hervorholen(f);
      const x0=e.clientX, y0=e.clientY, k0={...f.kasten};
      document.body.dataset.pdfwZieht='1'; fangFlaeche();
      const bewegen=ev=>{
        const dx=ev.clientX-x0, dy=ev.clientY-y0;
        if(art==='verschieben'){ f.kasten.x=k0.x+dx; f.kasten.y=k0.y+dy; }
        else { f.kasten.b=k0.b+dx; f.kasten.h=k0.h+dy; }
        einpassenInsBild(f.kasten); anwenden(f);
        /* Waehrend des Zuges wird NICHT neu gerechnet — das Blatt wird nur
           per CSS mitgezogen. Ein Neuzeichnen je Bild waere bei 460 Saetzen
           die eine Stelle, an der es hakt. Scharf wird es beim Loslassen. */
        if(art==='skalieren') grobEinpassen(f);
      };
      const loslassen=()=>{
        document.removeEventListener('pointermove', bewegen);
        document.removeEventListener('pointerup', loslassen);
        document.removeEventListener('pointercancel', loslassen);
        delete document.body.dataset.pdfwZieht;
        letzterKasten={...f.kasten};
        if(art==='skalieren') zeichnen(f);
      };
      document.addEventListener('pointermove', bewegen);
      document.addEventListener('pointerup', loslassen);
      document.addEventListener('pointercancel', loslassen);
    });
  }

  function flaeche(f){
    const cs=getComputedStyle(f.buehne), p=n=>parseFloat(cs[n])||0;
    return { b:f.buehne.clientWidth - p('paddingLeft') - p('paddingRight'),
             h:f.buehne.clientHeight - p('paddingTop') - p('paddingBottom') };
  }
  function grobEinpassen(f){
    const c=f.buehne.querySelector('canvas'); if(!c) return;
    const nb=+c.dataset.nb, nh=+c.dataset.nh; if(!nb||!nh) return;
    const fl=flaeche(f); if(fl.b<20||fl.h<20) return;
    const s=Math.min(fl.b/nb, fl.h/nh);
    c.style.width=Math.max(1,Math.round(nb*s))+'px';
    c.style.height=Math.max(1,Math.round(nh*s))+'px';
  }
  async function zeichnen(f){
    if(!f.doc) return;
    const meins=++f.zeichenLauf;
    const fl=flaeche(f); if(fl.b<20||fl.h<20) return;
    let s;
    try{ s=await f.doc.getPage(f.seite); }catch(e){ return; }
    if(meins!==f.zeichenLauf) return;
    const eins=s.getViewport({scale:1});
    /* Immer der ganze Inhalt: die Seite wird eingepasst, nie beschnitten. */
    const passe=Math.min(fl.b/eins.width, fl.h/eins.height);
    /* Auf dem Bildschirm des iPads liegen zwei Geraetepunkte auf einem
       CSS-Punkt. Ohne diesen Faktor waere die Note weich. */
    const dpr=Math.min(window.devicePixelRatio||1, 3);
    const vp=s.getViewport({scale:passe*dpr});
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
    c.dataset.nb=eins.width; c.dataset.nh=eins.height;
    c.style.width=Math.max(1,Math.round(eins.width*passe))+'px';
    c.style.height=Math.max(1,Math.round(eins.height*passe))+'px';
    try{ await s.render({canvasContext:c.getContext('2d'), viewport:vp}).promise; }
    catch(e){ return; }
    if(meins!==f.zeichenLauf) return;
    f.buehne.innerHTML=''; f.buehne.append(c);
  }
  function blaetternZeigen(f){
    f.bl.hidden = f.seiten<=1;
    f.zahl.textContent = f.seite+' / '+f.seiten;
    f.zurueck.disabled = f.seite<=1;
    f.vor.disabled = f.seite>=f.seiten;
  }
  function blaettern(f,d){
    const neu=Math.min(f.seiten, Math.max(1, f.seite+d));
    if(neu===f.seite) return;
    f.seite=neu; blaetternZeigen(f); zeichnen(f);
  }

  function bauen(opt){
    const k=document.createElement('div');
    k.className='pdfw'; k.setAttribute('role','dialog'); k.setAttribute('aria-label','PDF-Vorschau');
    k.innerHTML=
      '<div class="pdfw-kopf">'
      +  '<div style="flex:1;min-width:0"><div class="nm"></div><div class="sub"></div></div>'
      +  '<div class="pdfw-blaettern" hidden>'
      +    '<button class="pdfw-knopf" data-r="zurueck" title="Seite zurück"><i class="i ic-chevron-left"></i></button>'
      +    '<span class="zahl"></span>'
      +    '<button class="pdfw-knopf" data-r="vor" title="Seite vor"><i class="i ic-chevron-right"></i></button>'
      +  '</div>'
      +  '<button class="pdfw-knopf" data-r="zu" title="Schließen"><i class="i ic-x"></i></button>'
      + '</div>'
      + '<div class="pdfw-buehne"></div>'
      + '<div class="pdfw-griff" title="Ziehen zum Skalieren"></div>';
    document.body.append(k);
    /* Die Knoten EINMAL holen und festhalten — Falle 3 aus CLAUDE.md. */
    const f={ kennung:opt.kennung, knoten:k,
      kopf:k.querySelector('.pdfw-kopf'), buehne:k.querySelector('.pdfw-buehne'),
      griff:k.querySelector('.pdfw-griff'),
      nm:k.querySelector('.nm'), sub:k.querySelector('.sub'),
      bl:k.querySelector('.pdfw-blaettern'), zahl:k.querySelector('.zahl'),
      zurueck:k.querySelector('[data-r=zurueck]'), vor:k.querySelector('[data-r=vor]'),
      doc:null, seite:1, seiten:1, lauf:0, zeichenLauf:0,
      kasten:einpassenInsBild(neuerKasten()), wahlKnopf:null };
    k.querySelector('[data-r=zu]').onclick=()=>schliessen(f.kennung);
    f.zurueck.onclick=()=>blaettern(f,-1);
    f.vor.onclick=()=>blaettern(f,1);
    k.addEventListener('pointerdown', ()=>hervorholen(f), true);
    ziehen(f, f.kopf, 'verschieben');
    ziehen(f, f.griff, 'skalieren');
    anwenden(f);
    fenster.set(f.kennung, f);
    return f;
  }

  async function oeffnen(opt){
    const da=fenster.get(opt.kennung);
    const f = da || bauen(opt);
    hervorholen(f);
    letzterKasten={...f.kasten};
    f.nm.textContent = opt.name || (opt.datei && opt.datei.name) || 'PDF';
    f.sub.textContent = opt.unter || '';
    /* Die Stimmen-Wahl im Kopf, links vom Schliessen. Waehlen und
       weitergehen sind ein Handgriff, nicht zwei an entgegengesetzten
       Ecken. */
    if(opt.wahl){
      /* ZUERST hinterlegen, dann bauen: Der Knopf fragt seinen Zustand schon
         beim Bauen ab. Andersherum griffe er ins Leere, und das Fenster
         stuende ohne Wahl da. */
      f.wahl=opt.wahl;
      if(!f.wahlKnopf){
        f.wahlKnopf=AWAHL.knopf(
          ()=>f.wahl.hole(),
          /* `aufWahl` kann in den Bestand schreiben und damit erst spaeter
             fertig sein. Darum ueber ein Promise — sonst zeigte der Knopf
             noch den alten Wert. */
          neu=>Promise.resolve(f.wahl.aufWahl(neu)).then(()=>{
                 /* Wer viele Blaetter am Stueck zuordnet, will nach der Wahl
                    weiter und nicht erst schliessen. Der Schalter im Setup
                    entscheidet; voreingestellt bleibt das Fenster stehen. */
                 if(pdfwZuNachWahl()) schliessen(f.kennung);
                 else if(fenster.has(f.kennung)) f.wahlKnopf._auffrischen();
               }),
          'Stimme festlegen');
        f.kopf.insertBefore(f.wahlKnopf, f.kopf.querySelector('[data-r=zu]'));
      }
      f.wahlKnopf.hidden=false; f.wahlKnopf._auffrischen();
    } else if(f.wahlKnopf) f.wahlKnopf.hidden=true;
    if(da) return f;                       /* schon offen: nur nach vorn geholt */

    const meins=++f.lauf;
    f.bl.hidden=true;
    f.buehne.innerHTML='<div class="pdfw-lade">Wird geladen …</div>';
    let neu;
    try{
      const puffer=await opt.datei.arrayBuffer();
      if(meins!==f.lauf) return f;
      neu=await pdfjsLib.getDocument({data:new Uint8Array(puffer)}).promise;
    }catch(e){
      if(meins!==f.lauf) return f;
      f.buehne.innerHTML='<div class="pdfw-lade">Diese Datei lässt sich nicht anzeigen.</div>';
      return f;
    }
    if(meins!==f.lauf){ try{ neu.destroy(); }catch(e){} return f; }
    f.doc=neu; f.seiten=f.doc.numPages||1; f.seite=1;
    blaetternZeigen(f); zeichnen(f);
    return f;
  }
  function schliessen(kennung){
    const f=fenster.get(kennung); if(!f) return;
    f.lauf++; f.zeichenLauf++;
    if(f.doc){ try{ f.doc.destroy(); }catch(e){} f.doc=null; }
    f.knoten.remove(); fenster.delete(kennung);
    const o=oberstes(); if(o) o.knoten.dataset.oben='1';
  }
  function alleZu(){ [...fenster.keys()].forEach(schliessen); versatz=0; }
  /* Nach jedem Neuzeichnen der Vorschau: Was die Fenster anzeigen, kann sich
     geaendert haben. Die Wahrheit steht in der Vorschau, nicht im Fenster. */
  function auffrischen(){
    fenster.forEach(f=>{ if(f.wahlKnopf) f.wahlKnopf._auffrischen(); });
  }
  /* Escape schliesst das oberste Fenster — eines nach dem anderen. Die
     Stimmen-Liste faengt die Taste vorher ab, wenn sie offen ist.

     `stopImmediatePropagation` ist hier kein Zierrat: Das Setup haengt an
     derselben Taste und ginge sonst gleichzeitig eine Ebene zurueck. Ein
     Druck, zwei Wirkungen — man haette das Fenster geschlossen und stuende
     ploetzlich woanders. Der Betrachter meldet sich vor uns an und ist
     darum nicht betroffen. */
  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape' || !fenster.size) return;
    e.stopImmediatePropagation();
    const o=oberstes(); if(o) schliessen(o.kennung);
  });
  window.addEventListener('resize', ()=>{
    fenster.forEach(f=>{ einpassenInsBild(f.kasten); anwenden(f); zeichnen(f); });
  });
  return { oeffnen, schliessen, alleZu, auffrischen, anzahl:()=>fenster.size };
})();
/* Der Fang ist nicht ueberfluessig: `oeffnen` ist asynchron, und ein Fehler
   darin blieb sonst voellig stumm — kein Fenster, keine Meldung, nichts in
   der Konsole. Genau so ist die Stimmen-Wahl einmal unbemerkt ausgefallen. */
window.pdfVorschau = opt => PDFW.oeffnen(opt).catch(e=>{
  console.error('PDF-Vorschau fehlgeschlagen:', e);
  alert('Die Vorschau lässt sich nicht öffnen: '+(e&&e.message||e));
});
window.PDFW = PDFW;

/* keep search area visible: pin controls just below the header */
(function(){
  const header=document.querySelector('header'), controls=document.getElementById('controls');
  function sync(){ if(document.body.dataset.o==='land'){ controls.style.top=''; return; }
                   controls.style.top=(header.offsetHeight-1)+'px'; }
  if(window.ResizeObserver) new ResizeObserver(sync).observe(header);
  window.addEventListener('resize',sync); sync(); setTimeout(sync,300);
})();

function getEditorName(){ return localStorage.getItem('rb_editor')||''; }
function setEditorName(v){ localStorage.setItem('rb_editor', v||''); }

/* ---- fit layout ---- */
function computeFit(n,natW,natH,W,H,gap){
  if(n<=2){ const s=Math.min(H/natH,(W-gap*(n-1))/(n*natW)); return {scale:Math.max(s,0.05),center:true}; }
  return {scale:Math.max(H/natH,0.05),center:false};
}
const _pdfCache={};
async function loadPdf(url){
  if(_pdfCache[url])return _pdfCache[url];
  // Bytes selbst holen und an PDF.js geben – robuster in Safari & mit Service Worker als getDocument(url)
  const buf=await (await fetch(encodeURI(url))).arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  _pdfCache[url]=doc; return doc;
}
/* Sicherheitsnetz: Was auch immer beim Rechnen schiefgeht — am Ende MUSS das
   Blatt in die Flaeche passen. Gemessen wird nach dem Zeichnen, und nur
   verkleinert, nie vergroessert. Ohne dieses Netz war das Blatt im Querformat
   zu gross und lief aus der Buehne heraus; erkennbar daran, dass es nicht mehr
   mittig sass. */
function passeBlattEin(){
  const fit=document.getElementById('vFit'); if(!fit) return;
  const cs=getComputedStyle(fit);
  const p=n=>parseFloat(cs[n])||0;
  const cw=fit.clientWidth  - p('paddingLeft') - p('paddingRight');
  const ch=fit.clientHeight - p('paddingTop')  - p('paddingBottom');
  const seiten=[...fit.querySelectorAll('.pg')];
  if(!seiten.length || cw<40 || ch<40) return;
  const b=parseFloat(seiten[0].style.width), h=parseFloat(seiten[0].style.height);
  if(!b || !h) return;
  const f=Math.min(1, cw/b, ch/h);
  if(f>0.999) return;
  seiten.forEach(s=>{ const sb=parseFloat(s.style.width), sh=parseFloat(s.style.height);
    s.style.width=(sb*f)+'px'; s.style.height=(sh*f)+'px'; });
}

/* Das Blatt neu einpassen, wenn sich die Flaeche geaendert hat — beim Drehen,
   beim Klappen der Seitenleiste, beim Verschieben des Docks. Vorher hing das
   allein am resize-Ereignis, und auf das ist unter iOS kein Verlass; nach dem
   Drehen blieb das Blatt in der Groesse der alten Ausrichtung stehen. */
let _blattUhr;
function blattNeuZeichnen(sofort){
  clearTimeout(_blattUhr);
  const tu=()=>{
    if(!document.getElementById('viewer').classList.contains('open') || !CURRENT) return;
    /* Seit Schritt 10 kann statt des Leadsheets eine Stimme auf dem Blatt
       liegen. Sie ist ein Pseudo-Stueck mit einer Blob-Adresse und geht
       denselben Weg wie ein importiertes PDF. */
    const stimme = window.aktiveStimme ? window.aktiveStimme() : null;
    if(stimme) renderPdfFit(stimme);
    else if(CURRENT.isEdit) renderUserFit(CURRENT); else renderPdfFit(CURRENT);
  };
  if(sofort) tu(); else _blattUhr=setTimeout(tu,180);
}
window.blattNeuZeichnen=blattNeuZeichnen;

/* Polsterung der Einpass-Flaeche, in Pixeln abgelesen (x = links+rechts). */
function fitRand(fit){
  const cs=getComputedStyle(fit);
  const l=parseFloat(cs.paddingLeft)||0, r=parseFloat(cs.paddingRight)||0;
  const t=parseFloat(cs.paddingTop)||0,  b=parseFloat(cs.paddingBottom)||0;
  return { x:l+r, y:t+b };
}
async function renderPdfFit(t){
  const fit=document.getElementById('vFit'); fit.classList.remove('center');
  /* Beim Drehen liegt das alte Blatt schon da und wird nur neu eingepasst.
     Es dann durch „Laedt…" zu ersetzen, laesst die Noten kurz verschwinden —
     genau das Flackern, das Jens am 28. Juli gemeldet hat. Das alte Blatt
     bleibt deshalb stehen, bis das neue fertig gezeichnet ist. Nur wenn gar
     nichts da ist, erscheint der Hinweis. */
  const stehtSchon = !!fit.querySelector('.pg');
  if(!stehtSchon) fit.innerHTML='<div class="vlade">Lädt…</div>';
  /* Die EINE Zeile, die Schritt 1c am Betrachter aendert: Sie beschafft den
     Verweis. Wie gezeichnet und wie eingepasst wird, bleibt unberuehrt —
     samt dem Rueckfallweg unten, der `t.f` ebenfalls schon gefuellt findet. */
  await urlSichern(t);
  try{
    const doc=await loadPdf(t.f); const n=doc.numPages;
    const p1=await doc.getPage(1); const v1=p1.getViewport({scale:1});
    /* Das Seitenverhaeltnis kommt aus dem Viewport der ersten Seite und ersetzt
       jede feste Annahme. Die Buehnenbreite haengt davon ab, also erst neu
       rechnen, dann messen — sonst misst man die alte Breite. */
    const verh=v1.width/v1.height;
    if(window.SHEET_RATIO!==undefined && Math.abs(verh-window.SHEET_RATIO)>0.002){
      window.SHEET_RATIO=verh; if(window.layout) window.layout();
    }
    const fsMode=document.getElementById('viewer').classList.contains('fullscreen');
    const box=fit.getBoundingClientRect();
    /* Der Rand der Einpass-Flaeche haelt seit Schritt 6 an der Dock-Kante
       94 px frei, sonst 16 px, jeweils zuzueglich der sicheren Raender. Er
       wird abgelesen statt angenommen, damit das Blatt nie unter das Dock
       laeuft. Bei der frueheren festen Polsterung von 10 px kommen genau die
       alten Werte 24 und 20 heraus. */
    const rand=fitRand(fit);
    const W=(fsMode?window.innerWidth:(box.width||window.innerWidth))-rand.x-4;
    const H=(fsMode?window.innerHeight:(box.height||window.innerHeight))-rand.y;
    /* In der Buehne ist genau ein Blatt Platz. computeFit stellt ein- bis
       zweiseitige Stuecke nebeneinander — jede Seite waere dann halb so gross.
       Deshalb dort der Hoehen-Pfad; weitere Seiten erreicht man durch Wischen.
       Im Vollbild und im Hochformat bleibt das Nebeneinander erhalten, dort
       ist es gerade der Vorteil (kein Umblaettern beim Spielen). */
    /* Nebeneinander lohnt nur im Vollbild im QUERformat — dort sind zwei
       Seiten je rund 570 px breit. Im Hochformat waeren es je 400 px, und
       in der Buehne nur die halbe Bahn. Sonst gilt: ein Blatt, volle Hoehe. */
    const einBlatt = !(fsMode && document.body.dataset.o==='land');
    /* Die Hoehe gibt den Ton an, aber die Breite darf nicht ueberlaufen. Im
       Querformat folgt die Buehnenbreite ohnehin aus dem Verhaeltnis, dort
       aendert die Begrenzung nichts. Im Hochformat schon: Ein Blatt im
       Letter-Format wurde 828 px breit, verfuegbar waren 802 — der rechte Rand
       lag ausserhalb und war nur durch Wischen erreichbar. */
    const {scale,center} = einBlatt
      ? { scale: Math.max(Math.min(H/v1.height, W/v1.width), 0.05), center: (n===1) }
      : computeFit(n,v1.width,v1.height,W,H,14);
    fit.classList.toggle('center',center);
    /* Erst zeichnen, dann tauschen. Solange die neuen Seiten entstehen, bleibt
       das alte Blatt stehen; erst am Ende wird in einem Zug ersetzt. Vorher
       war die Flaeche waehrend des Zeichnens leer, und beim Drehen sah man das
       als Flackern. */
    const neu=document.createDocumentFragment();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=n;i++){ const page=await doc.getPage(i); const vp=page.getViewport({scale:scale*dpr});
      const cvs=document.createElement('canvas'); cvs.className='pg';
      cvs.width=Math.round(vp.width); cvs.height=Math.round(vp.height);
      cvs.style.width=(vp.width/dpr)+'px'; cvs.style.height=(vp.height/dpr)+'px';
      neu.append(cvs); await page.render({canvasContext:cvs.getContext('2d'),viewport:vp}).promise; }
    fit.replaceChildren(neu);
    passeBlattEin();
    /* Dauer des Blatts nach einem Drehen nachtragen — siehe Setup, „Über". */
    if(window.drehBlattStart && window.drehZeiten){
      window.drehZeiten.blatt = Math.round(performance.now()-window.drehBlattStart);
      window.drehBlattStart = 0;
    }
  }catch(e){
    /* Fallback: PDF.js nicht verfügbar → native Anzeige, aber per Iframe-Breite auf die HÖHE eingepasst.
       Iframe-Breite = Seitenbreite bei voller Höhe → der native Betrachter (view=FitH) füllt die Höhe. */
    const frame=document.getElementById('vFrame'), holder=frame.parentElement;
    fit.style.display='none'; fit.innerHTML='';
    const H=window.innerHeight, W=window.innerWidth,
          ratio=(window.SHEET_RATIO||210/297); // je PDF, nicht mehr fest US-Letter
    const iw=Math.min(W, Math.round(H*ratio));
    holder.style.display='flex'; holder.style.justifyContent='center'; holder.style.overflow='hidden';
    frame.style.display='block'; frame.style.width=iw+'px'; frame.style.height='100%'; frame.style.margin='0 auto';
    frame.src=encodeURI(t.f)+'#toolbar=0&navpanes=0&view=FitH';
  }
}
function resetFrameStyle(){
  const frame=document.getElementById('vFrame'), holder=frame.parentElement;
  frame.style.width=''; frame.style.height=''; frame.style.margin='';
  holder.style.display=''; holder.style.justifyContent=''; holder.style.overflow='';
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function renderUserFit(t){
  const fit=document.getElementById('vFit'); fit.classList.remove('center');

  const probe=await loadImg(pages[0]); const natW=probe.naturalWidth,natH=probe.naturalHeight;
  const box=fit.getBoundingClientRect(); const rand=fitRand(fit);
  const W=box.width-rand.x-4, H=box.height-rand.y;

});}
